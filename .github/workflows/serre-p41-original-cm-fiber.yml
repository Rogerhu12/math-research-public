name: Serre p41 original CM fiber jets

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R790-public-original-CM-fiber-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R790-original-CM-fiber-jets
  cancel-in-progress: false

jobs:
  original_cm_fiber:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-cm-fiber.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R790_exact_CM_fiber_jets.py
            /topics/serre-uniformity/scripts/R790_public_original_CM_fiber.py
            /topics/serre-uniformity/scripts/R754_original_periods_and_Hom_kernel.py
            /topics/serre-uniformity/scripts/R786_public_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R790-public-original-CM-fiber-request.json
            /topics/serre-uniformity/results/R790-original-CM-fiber-regularization-and-155-jet-evaluation.md
            /topics/serre-uniformity/computations/R732-p41-original-CM-model/43608152850-1/full-outputs-manifest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Evaluate original regularized CM values and first coarse jets
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R790_public_original_CM_fiber.py compute
      - name: Transfer the active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R790-original-CM-fiber-jets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R790-original-CM-fiber-jets/output
          retention-days: 1
          if-no-files-found: warn
      - name: Publish only script parameters run and output hashes
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R790_public_original_CM_fiber.py publish
      - name: Require source-bound original regularized CM values
        if: always()
        run: python topics/serre-uniformity/scripts/R790_public_original_CM_fiber.py verify
