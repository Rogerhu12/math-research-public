name: R143 correlated Gram body budget and optimal root screen

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-correlated-gram-body-budget-public.yml

permissions:
  contents: write

concurrency:
  group: r143-correlated-gram-body-budget-v1
  cancel-in-progress: false

jobs:
  complete-correlated-gram-body-budget:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_correlated_gram_body_budget_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-26-R143-correlated-gram-body-budget-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the fixed directed runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Restore five inputs and evaluate correlated Gram bounds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_correlated_gram_body_budget_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-26-R143-correlated-gram-body-budget-inputs.json --manifest-sha 72de72538cccff06c824fa28d4ab14eb806ad262fbe2fea12df600179a89b86e
