name: Serre p41 original M6 mixed Hodge ratios

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R803-public-original-M6-mixed-Hodge-ratios-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R803-original-M6-mixed-Hodge-ratios
  cancel-in-progress: false

jobs:
  original_m6_mixed_hodge_ratios:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-M6-mixed-Hodge-ratios.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R803_original_M6_mixed_Hodge_ratios.py
            /topics/serre-uniformity/scripts/R803_public_original_M6_mixed_Hodge_ratios.py
            /topics/serre-uniformity/scripts/R786_public_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R803-public-original-M6-mixed-Hodge-ratios-request.json
            /topics/serre-uniformity/notes/R803-original-M6-mixed-ratios-and-addition-interface.md
            /topics/serre-uniformity/results/R803-original-single-map-reuse-and-mixed-Hodge-ratios.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source syntax without executing mathematics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("R803_original_M6_mixed_Hodge_ratios.py", "R803_public_original_M6_mixed_Hodge_ratios.py"):
              path = Path("topics/serre-uniformity/scripts") / name
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compute five mixed forms and six finite RHS groups in the original M6 basis
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R803_public_original_M6_mixed_Hodge_ratios.py compute
      - name: Transfer the active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R803-original-M6-mixed-Hodge-ratios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R803-original-M6-mixed-Hodge-ratios/output
          retention-days: 1
          if-no-files-found: warn
      - name: Require all six exact coordinate groups and full original normalization
        if: always()
        run: python topics/serre-uniformity/scripts/R803_public_original_M6_mixed_Hodge_ratios.py verify
