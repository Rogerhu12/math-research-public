name: Serre p41 original Wronskian derivation inputs

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R813-public-original-Wronskian-derivation-inputs-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R813-original-Wronskian-derivation-inputs
  cancel-in-progress: false

jobs:
  original_Wronskian_derivation_inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-Wronskian-derivation-inputs.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R813_original_Wronskian_derivation_inputs.py
            /topics/serre-uniformity/scripts/R813_public_original_Wronskian_derivation_inputs.py
            /topics/serre-uniformity/scripts/R786_public_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R813-public-original-Wronskian-derivation-inputs-request.json
            /topics/serre-uniformity/notes/R813-original-two-S3-Wronskian-derivation-input-method.md
            /topics/serre-uniformity/results/R813-original-Wronskian-normal-derivation-and-cyclic-certificate.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source syntax without executing mathematics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("R813_original_Wronskian_derivation_inputs.py", "R813_public_original_Wronskian_derivation_inputs.py"):
              path = Path("topics/serre-uniformity/scripts") / name
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Restore two original Wronskians using the completed S3 inverse
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R813_public_original_Wronskian_derivation_inputs.py compute
      - name: Transfer the active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R813-original-Wronskian-derivation-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R813-original-Wronskian-derivation-inputs/output
          retention-days: 1
          if-no-files-found: warn
      - name: Require both original 820-row certificates and their exact scales
        if: always()
        run: python topics/serre-uniformity/scripts/R813_public_original_Wronskian_derivation_inputs.py verify
