name: visible-exact complete fixed eta quarter cap sources

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-complete-quarter-cap.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-quarter-cap
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CAP_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-quarter-cap-CI-inputs.json
  CAP_MANIFEST_SHA: 6dc5bf2d8030d506c74dc29ef2cb3c1991cd5f7fb8c2a051b03b0ad89cb2fb69
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  plan:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 40
    outputs:
      artifact: ${{ steps.paths.outputs.artifact }}
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-quarter-cap-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate all frozen inputs and recover only owned actual prefixes
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$CAP_MANIFEST" --manifest-sha "$CAP_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/complete_quarter_cap_ci/
      - name: Parse the frozen new sources before mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_complete_quarter_cap_sources.py','fourfold_codazzi_complete_quarter_cap_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('New complete quarter sources passed AST parsing; mathematics has not run.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible paths and exact artifact name
        id: paths
        run: |
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-quarter-prepared" >> "$GITHUB_OUTPUT"
          printf 'pilot=%s\n' "$RUNNER_TEMP/visible-exact-quarter-pilot" >> "$GITHUB_OUTPUT"
          printf 'complete=%s\n' "$RUNNER_TEMP/visible-exact-quarter-complete" >> "$GITHUB_OUTPUT"
          printf 'fixed=%s\n' "$RUNNER_TEMP/visible-exact-quarter-fixed" >> "$GITHUB_OUTPUT"
          printf 'original_ranges=%s\n' "$RUNNER_TEMP/visible-exact-quarter-original-ranges" >> "$GITHUB_OUTPUT"
          printf 'plan=%s\n' "$RUNNER_TEMP/visible-exact-quarter-plan" >> "$GITHUB_OUTPUT"
          printf 'ranges=%s\n' "$RUNNER_TEMP/visible-exact-quarter-ranges" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-quarter-output" >> "$GITHUB_OUTPUT"
          printf 'artifact=%s\n' "visible-exact-complete-quarter-cap-plan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Receive the exact successful original w0 and full boundary data
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43610982446
          name: visible-exact-known-cut-direction-cap-pilot-v3-43610982446-1
          path: ${{ steps.paths.outputs.pilot }}
      - name: Receive the original complete1977 physical source and all14 gains
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43615251195
          name: visible-exact-complete-cut-Z-finish-43615251195-1
          path: ${{ steps.paths.outputs.complete }}
      - name: Receive all four original completed direct ranges
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43615251195
          pattern: visible-exact-complete-cut-Z-range-*-43615251195-1
          merge-multiple: false
          path: ${{ steps.paths.outputs.original_ranges }}
      - name: Receive all336 completed fixed eta pilot domains without recomputing any
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43619535345
          name: visible-exact-fixed-eta-physical-cap-pilot-43619535345-1
          path: ${{ steps.paths.outputs.fixed }}
      - name: Run the exact plan with real ten-minute pull and README checkpoints
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_quarter_cap_CI.py
          --manifest "$CAP_MANIFEST" --manifest-sha "$CAP_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --phase plan --workflow-run "$GITHUB_RUN_ID"
          --pilot-artifact "$RUNNER_TEMP/visible-exact-quarter-pilot"
          --complete-artifact "$RUNNER_TEMP/visible-exact-quarter-complete"
          --fixed-artifact "$RUNNER_TEMP/visible-exact-quarter-fixed"
          --original-ranges "$RUNNER_TEMP/visible-exact-quarter-original-ranges"
          --work "$RUNNER_TEMP/visible-exact-quarter-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-quarter-output"
          --compute-minutes 20 --checkpoint-minutes 10
      - name: Require nonempty actual evidence and a small inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          data=(json.dumps(entries,indent=2)+'\n').encode()
          if len(data)>60000:raise RuntimeError('inventory exceeded60000 bytes; preserve all actual evidence')
          (root/'artifact-inventory.json').write_bytes(data)
          print(dict(actual_files=len(files),actual_inventory_bytes=len(data)))
          PY_INVENTORY
      - name: Preserve full native bytes and every actual failed prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.artifact }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error

  ranges:
