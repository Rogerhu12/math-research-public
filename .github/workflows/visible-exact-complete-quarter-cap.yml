          - {first: 512, end: 768}
          - {first: 768, end: 1024}
          - {first: 1024, end: 1280}
          - {first: 1280, end: 1536}
          - {first: 1536, end: 1792}
          - {first: 1792, end: 1977}
    steps:
      - name: Install terminal Git
