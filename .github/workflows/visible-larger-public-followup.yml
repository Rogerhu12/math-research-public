name: visible-larger geometry and full-core followup

on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-followup-request.json
  workflow_dispatch:
    inputs:
      lane:
        description: Independent calculation
        type: choice
        default: all
        options: [all, free3, material, geometry]

permissions:
  contents: write

jobs:
  followup:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: ${{ fromJSON(inputs.lane == 'free3' && '["free3"]' || inputs.lane == 'material' && '["material"]' || inputs.lane == 'geometry' && '["geometry"]' || '["free3","material","geometry"]') }}
    name: Followup ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: visible-larger-public-followup-${{ matrix.lane }}
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-geometry-resume-scaled-sphere-M96-normal-BVP-r1.json.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-exact-resume-RK24-radial4to8-closed-r1/
            /topics/visible-flex-larger-amplitude/notes/2026-11-12-closure-scaled-endpoint-q003-m8-d12-f225-exclusive-ready.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-m28-recovered-full-audit-r1-ready.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1.json.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1-config.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1-tail-response_0003.json.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1-accepted-ready-extracted.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1_coeff_00.npy.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1_coeff_01.npy.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1_coeff_02.npy.gz
      - name: Bound repository maintenance
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Continue while fixing only the first three core modes
        if: matrix.lane == 'free3'
        timeout-minutes: 315
        run: |
          python -u topics/visible-flex-larger-amplitude/computations/geometry_20261114_public_free3.py \
            --out "$RUNNER_TEMP/visible-followup/free3" --work "$RUNNER_TEMP/visible-free3-factors" \
            --durations .006 .012 .024 --budget-seconds 18000
      - name: Measure the actual material-angle spectral tail and complete jets
        if: matrix.lane == 'material'
        timeout-minutes: 90
        run: |
          mkdir -p "$RUNNER_TEMP/visible-followup/material"
          python -u topics/visible-flex-larger-amplitude/computations/exact_20261114_material_tail_packet.py \
            --input topics/visible-flex-larger-amplitude/notes/2026-11-14-geometry-resume-scaled-sphere-M96-normal-BVP-r1.json.gz \
            --angles 1024 2048 4096 --out "$RUNNER_TEMP/visible-followup/material/material-tail"
      - name: Restore only the original public numerical source bytes
        if: matrix.lane == 'geometry'
        run: |
          PYTHONPATH=topics/visible-flex-larger-amplitude/computations python - <<'PY'
          import os
          from pathlib import Path
          from exact_20261114_public_resume import prepare_public_source
          out=Path(os.environ['RUNNER_TEMP'])/'visible-followup/geometry'
          out.mkdir(parents=True, exist_ok=True)
          source=prepare_public_source(Path.cwd(),Path(os.environ['RUNNER_TEMP'])/'visible-geometry-source',out)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
          PY
      - name: Apply the nonplanar-prefix and fixed-marker inputs
        if: matrix.lane == 'geometry'
        run: |
          python -u topics/visible-flex-larger-amplitude/computations/geometry_20261114_planar_germ_coefficients.py \
            --checkpoint topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1.json.gz \
            --plan topics/visible-flex-larger-amplitude/notes/2026-11-14-exact-resume-RK24-radial4to8-closed-r1/closed/refined-A-closed-plan.json \
            --assembly topics/visible-flex-larger-amplitude/notes/2026-11-14-exact-resume-RK24-radial4to8-closed-r1/closed/refined-A-closed-assembly.json \
            --out "$RUNNER_TEMP/visible-followup/geometry/R238-inputs.json"
      - name: Compute the actual all-phase spatial covering budget
        if: matrix.lane == 'geometry'
        timeout-minutes: 90
        run: |
          python -u topics/visible-flex-larger-amplitude/computations/geometry_20261114_continuous_cover_budget.py \
            --directory topics/visible-flex-larger-amplitude/notes/2026-11-14-exact-resume-RK24-radial4to8-closed-r1/closed \
            --checkpoint topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1.json.gz \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --port topics/visible-flex-larger-amplitude/computations/alternative-neck-provider-smallcut30-port32-r2048.json \
            --out "$RUNNER_TEMP/visible-followup/geometry/R37-cover.json" \
            --radial-stride 2 --angular-stride 1
      - name: Preserve every actual outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-followup-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visible-followup/${{ matrix.lane }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded outputs with ordinary synchronization
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u topics/visible-flex-larger-amplitude/computations/root_20261114_publish_actions.py \
            --results "$RUNNER_TEMP/visible-followup/${{ matrix.lane }}" --lane "${{ matrix.lane }}"
