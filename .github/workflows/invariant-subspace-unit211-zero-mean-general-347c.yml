name: ISP unit211 zero-mean exact general charts
on:
  push:
    branches: [main]
    paths:
      - 'topics/invariant-subspace-problem/notes/2026-11-26-unit211-nonzero-base-highest-zero-isolated-mean-general-347c.py'
      - '.github/workflows/invariant-subspace-unit211-zero-mean-general-347c.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isp-unit211-zero-mean-general-347c
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ISP_PIN: ${{ github.sha }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FLINT_NUM_THREADS: '1'
    steps:
      - name: Select exact arithmetic Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Partial checkout and frozen source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-unit211-general"
          cd "$RUNNER_TEMP/isp-unit211-general"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          timeout 120s git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-26-unit211-nonzero-base-highest-zero-isolated-mean-general-347c.py" > "$RUNNER_TEMP/isp-unit211-general-source.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-26-unit211-zero-mean-actions-driver-347c.py" > "$RUNNER_TEMP/isp-unit211-general-driver.py"
          python -m pip install --quiet python-flint==0.9.0 sympy==1.14.0
          python -u "$RUNNER_TEMP/isp-unit211-general-driver.py" --checkout "$PWD" --source "$RUNNER_TEMP/isp-unit211-general-source.py" --seconds 10200
