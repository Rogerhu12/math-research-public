name: visible-exact cached all-interface impulse gains

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_finite193_cached_interface_impulse_gains.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_finite193_cached_interface_impulse_gains_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cached-interface-impulse-CI-inputs.json'
      - '.github/workflows/visible-exact-cached-interface-impulse-gains.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-cached-all5970-interface-impulse
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  IMPULSE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cached-interface-impulse-CI-inputs.json
  IMPULSE_MANIFEST_SHA: 75b9039039a663a5fb8aad5a7f719e5fcea9edf648096441bc0777e25240a44c
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  impulses:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 60
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cached-interface-impulse-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate all101 pins with the original97 mathematical files unchanged
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$IMPULSE_MANIFEST" --manifest-sha "$IMPULSE_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/finite193_cached_interface_impulse_ci/
      - name: Parse the two new consumers before new scalar arithmetic
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_finite193_cached_interface_impulse_gains.py','fourfold_codazzi_finite193_cached_interface_impulse_gains_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('Cached-interface consumers parsed; no old evolution is requested.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible paths
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-interface-impulse-output" >> "$GITHUB_OUTPUT"
          printf 'inputs=%s\n' "$RUNNER_TEMP/visible-exact-interface-impulse-inputs" >> "$GITHUB_OUTPUT"
      - name: Download original successful complete signed finite193 Green
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-complete-cut-Green-complete-43601964129-1
          repository: Rogerhu12/math-research-public
          run-id: 43601964129
          github-token: ${{ github.token }}
          path: ${{ steps.paths.outputs.inputs }}/green/
      - name: Download original successful complete ordinary-L2 kernels
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-finite193-L2-Green-kernel-43633074696-1
          repository: Rogerhu12/math-research-public
          run-id: 43633074696
          github-token: ${{ github.token }}
          path: ${{ steps.paths.outputs.inputs }}/kernel/
      - name: Compute only new all5970 impulse recurrences with true pull every10minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_finite193_cached_interface_impulse_gains_CI.py
          --manifest "$IMPULSE_MANIFEST" --manifest-sha "$IMPULSE_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --green-artifact "$RUNNER_TEMP/visible-exact-interface-impulse-inputs/green"
          --kernel-artifact "$RUNNER_TEMP/visible-exact-interface-impulse-inputs/kernel"
          --work "$RUNNER_TEMP/visible-exact-interface-impulse-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-interface-impulse-output"
          --compute-minutes 40 --checkpoint-minutes 10
      - name: Require nonempty actual evidence and bounded inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty impulse process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,
                        sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          raw=(json.dumps(entries,indent=2)+'\n').encode()
          if len(raw)>60000:raise RuntimeError('impulse artifact inventory exceeds60000 bytes')
          (root/'artifact-inventory.json').write_bytes(raw)
          print(dict(actual_files=len(files),actual_inventory_bytes=len(raw)))
          PY_INVENTORY
      - name: Preserve the complete actual native and every completed prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cached-interface-impulse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
