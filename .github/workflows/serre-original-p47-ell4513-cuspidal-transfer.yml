name: Serre original p47 ell4513 complete transfer

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/original-p47-ell4513-cuspidal-transfer-request.json

permissions:
  contents: read

concurrency:
  group: serre-original-p47-ell4513-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_complete_transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/original_p47_cuspidal_disks.py
            /topics/serre-uniformity/results/R9-cm-reduction-separation.md
            /topics/serre-uniformity/results/R1062-original-full-nonsplit-cuspidal-kummer-descent.md
            /topics/serre-uniformity/results/R1064-original-cuspidal-cover-descent-and-auxiliary-character-visibility.md
            /topics/serre-uniformity/results/R1069-all-prime-good-cuspidal-characters-and-unique-global-labels.md
            /topics/serre-uniformity/results/R1070-original-cuspidal-labels-by-division-polynomial-values.md
            /topics/serre-uniformity/results/R1071-original-p-local-cuspidal-label-polynomials.md
            /topics/serre-uniformity/results/R1072-certified-original-p47-cuspidal-disk-labels.md
            /topics/serre-uniformity/results/R1073-original-split-auxiliary-cuspidal-sieve.md
            /topics/serre-uniformity/scripts/original_p47_ell4513_cuspidal_transfer.py
            /topics/serre-uniformity/notes/2026-11-27-original-p47-ell4513-cuspidal-transfer-method.md
            /topics/serre-uniformity/results/R1074-certified-original-p47-eight-CM-disks.md
            /topics/serre-uniformity/results/R1083-original-level47-auxiliary-Hecke-fields-and-scalar-fibers.md
            /topics/serre-uniformity/notes/original-p47-ell4513-cuspidal-transfer-request.json
      - name: Install the exact finite-field dependency
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Compute all original ell4513 labels including scalar fibers
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          SERRE_EXPECTED_REQUEST_SHA256: '655d3f21b34d6c87f3e7eac95e3b9621c7989e4afc21c625a6b8416fa0dd6493'
        run: python topics/serre-uniformity/scripts/original_p47_ell4513_cuspidal_transfer.py
