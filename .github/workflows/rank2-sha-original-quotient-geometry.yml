name: Rank2 actual genus19 normalization before eta48 inversion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rank2-sha-original-quotient-geometry.yml'
      - 'topics/rank2-sha-infinitely-many-p/scripts/produce-original-quotient-geometry-only.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rank2-original-quotient-geometry
  cancel-in-progress: false
jobs:
  quotient-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            topics/rank2-sha-infinitely-many-p/scripts
          persist-credentials: false
      - name: Normalize the original quotient and check every divisor
        shell: bash
        run: |
          set -euo pipefail
          RANK2_IMAGE='sagemath/sagemath@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb'
          RANK2_CONTAINER="rank2-quotient-geometry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup_rank2_geometry() {
            docker rm -f "$RANK2_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_rank2_geometry EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          docker pull "$RANK2_IMAGE"
          timeout --kill-after=30s 21000 docker run --rm --name "$RANK2_CONTAINER" --network none \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e RANK2_SOURCE_SHA="$GITHUB_SHA" \
            -e RANK2_RUN_ID="$GITHUB_RUN_ID" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e OMP_NUM_THREADS=4 \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            --entrypoint /usr/bin/sage "$RANK2_IMAGE" -python \
            topics/rank2-sha-infinitely-many-p/scripts/produce-original-quotient-geometry-only.py --prime 29
