name: Serre R827 determinant Bezout termination

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R827-determinantal-Bezout-public-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R827-determinantal-Bezout
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/notes/R827-determinantal-Bezout-public-request.json
      - name: Pull current main and compare the two read rule files
        env:
          REQUEST_SOURCE: ${{ github.sha }}
          RECEIPT_PATH: ${{ runner.temp }}/R827-determinantal-rules-pull.json
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, subprocess
          from pathlib import Path
          path = 'topics/serre-uniformity/notes/R827-determinantal-Bezout-public-request.json'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',os.environ['REQUEST_SOURCE']],check=True)
          request = json.loads(subprocess.check_output(['git','show',os.environ['REQUEST_SOURCE']+':'+path]))
          subprocess.run(['git','checkout','-B','r827-determinantal-rules-main'],check=True)
          subprocess.run(['git','pull','--rebase','origin','main'],check=True)
          head = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          old = request['rules_last_read_commit']
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',old],check=True)
          expected = request['readme_sha256']
          actual = {key:hashlib.sha256(Path(name).read_bytes()).hexdigest()
                    for key,name in [('root','README.md'),('topic','topics/serre-uniformity/README.md')]}
          changed = actual != expected
          receipt = {'actual_git_pull_rebase_completed':True,'actual_head':head,'previous_read_commit':old,
                     'actual_UTC':dt.datetime.now(dt.timezone.utc).isoformat(),
                     'readme_sha256':actual,'expected_readme_sha256':expected,'rules_changed':changed}
          Path(os.environ['RECEIPT_PATH']).write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('R827_DETERMINANT_RULES_PULL='+json.dumps(receipt,sort_keys=True))
          if changed:
              subprocess.run(['git','diff',old,head,'--','README.md','topics/serre-uniformity/README.md'],check=True)
              raise SystemExit('The two README rules changed; the new rules must be read before mathematics.')
          PY
      - name: Preserve the one-day actual pull receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-R827-determinantal-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R827-determinantal-rules-pull.json
          retention-days: 1
          if-no-files-found: warn

  compute:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R827_determinantal_Bezout_termination.py
            /topics/serre-uniformity/scripts/R827_determinantal_Bezout_public.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/results/R827-original-global-modular-surjectivity-and-derivative-termination.md
            /topics/serre-uniformity/notes/R827-original-determinantal-Bezout-termination-certificate.md
            /topics/serre-uniformity/notes/R827-determinantal-Bezout-public-request.json
            /.github/workflows/serre-R827-determinantal-Bezout.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse the frozen sources without executing mathematics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          folder = Path('topics/serre-uniformity/scripts')
          for name in ('R827_determinantal_Bezout_termination.py','R827_determinantal_Bezout_public.py',
                       'R824_public_original_global_polar_generators.py'):
              path=folder/name
              ast.parse(path.read_text(),filename=str(path))
              print('AST_OK',name)
          PY
      - name: Install the frozen arithmetic dependency
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Continue completed determinant nodes and exact polynomial certificates
        run: |
          python topics/serre-uniformity/scripts/R827_determinantal_Bezout_public.py \
            --output "$RUNNER_TEMP/R827-determinantal/output"
      - name: Verify source bytes, complete nodes and the actual certificate schema
        if: always()
        run: |
          python topics/serre-uniformity/scripts/R827_determinantal_Bezout_public.py \
            --output "$RUNNER_TEMP/R827-determinantal/output" --verify
      - name: Preserve the one-day active source and continuation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-global-R827-determinantal-Bezout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R827-determinantal/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
