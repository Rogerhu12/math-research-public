name: visible-exact nonzero-entry outer-piece complete sources

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-outer-piece-nonzero-entry-complete-sources.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-outer-piece-nonzero-entry-complete-sources
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-outer-piece-nonzero-entry-complete-sources-CI-inputs.json
  PHASE_MANIFEST_SHA: 4a3e28f6b4ade95e47f901f406e094dc5d1d21aa75c2c1860a1da499e806185d
  PHASE_PIPELINE_SHA: 9e81e2bc57d3f94cd7231fa3d52f2511c844625a644f7387b277e96d2b684f70
  PHASE_WORKER_SHA: c0c4c16a97c301989446ce6d00cef224724556c18958882ab80947973f547073
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-reviewed-public-CI-rules-reproducible-data.json
  REVIEWED_RULES_SHA: f2661bd5cf5cb006c1f78c64126b3ac065e6bc26a50790545ac443efb5e372bd

jobs:
  nonzero-entry-complete-sources:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_outer_piece_nonzero_entry_complete_sources_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-outer-piece-nonzero-entry-complete-sources-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-reviewed-public-CI-rules-reproducible-data.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_outer_piece_nonzero_entry_complete_sources_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_outer_piece_nonzero_entry_complete_sources_public_worker.py --mode hydrate
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse both newly pinned sources before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_outer_piece_nonzero_entry_complete_sources.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          q=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_outer_piece_entry_Airy_algebra.py')
          assert hashlib.sha256(q.read_bytes()).hexdigest()=='d9547ccc78147fd705279c3c776255e3f2b0e0f8a6ab240cacf0bb129fcef389'
          ast.parse(q.read_text(),filename=str(q))
          PY_SOURCE
      - name: Install the identical completed scientific runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5 scipy==1.17.0
      - name: Check the full immutable AST closure and compute only the two new complete pieces
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_outer_piece_nonzero_entry_complete_sources_public_worker.py --mode run
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-outer-nonzero-entry-science"
          --prepared "$RUNNER_TEMP/visible-exact-outer-nonzero-entry-original"
          --out-dir "$RUNNER_TEMP/visible-exact-outer-nonzero-entry-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
