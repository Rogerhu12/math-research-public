name: Serre original scalar obstruction beyond 200000

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/original-scalar-obstruction-new-window-request.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serre-scalar-obstruction-new-window-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_scalar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R698_fast_scalar_window.py
            /topics/serre-uniformity/scripts/R698_verify_original_z.py
            /topics/serre-uniformity/scripts/original_scalar_obstruction_new_window.py
            /topics/serre-uniformity/notes/original-scalar-obstruction-new-window-request.json
            /topics/serre-uniformity/notes/2026-11-27-original-scalar-obstruction-new-window-method.md
            /topics/serre-uniformity/results/R706-exact-window-through-200000-and-original-sigma-zero.md
      - name: Install the established exact arithmetic dependency
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Search only the new original scalar interval
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python topics/serre-uniformity/scripts/original_scalar_obstruction_new_window.py
