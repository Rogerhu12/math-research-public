name: visible-exact periodic weighted-kernel normalizer refinement

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-normalizer-periodic-kernel-refinement.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-normalizer-periodic-kernel-refinement
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-normalizer-periodic-kernel-refinement-CI-inputs.json
  PHASE_MANIFEST_SHA: 950be9b64d5f25bba6b53ba8a979ce01b389f1987468824e902d71fbcce3bb6e
  PHASE_PIPELINE_SHA: 67d54e08d0c72583f198285ef555bb5dc55b2984d4708f9d65044c925a6c3a08
  PHASE_WORKER_SHA: 7dc92fb08c27ab9ff56678a0b6a3176a9127ca1d68597771b69124ce9ee495a1
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  normalizer-periodic-kernel-refinement:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_normalizer_periodic_kernel_refinement_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-normalizer-periodic-kernel-refinement-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_normalizer_periodic_kernel_refinement_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_normalizer_periodic_kernel_refinement_public_worker.py --mode hydrate
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new source before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_normalizer_periodic_kernel_refinement.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the pinned scalar runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Check the full immutable AST closure and evaluate the complete periodic weighted-kernel normalizer refinement
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_normalizer_periodic_kernel_refinement_public_worker.py --mode run
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-normalizer-periodic-kernel-refinement-science"
          --out-dir "$RUNNER_TEMP/visible-normalizer-periodic-kernel-refinement-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
