name: R144 fixed eta0 correlated mean integral

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-fixed-eta0-correlated-mean-public.yml

permissions:
  contents: write

concurrency:
  group: r144-fixed-eta0-correlated-mean-v1
  cancel-in-progress: false

jobs:
  complete-fixed-eta0-correlated-mean:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_fixed_eta0_correlated_mean_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-26-R144-fixed-eta0-correlated-mean-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the fixed directed runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5
      - name: Enclose the new complete fixed eta0 correlated mean integral
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_fixed_eta0_correlated_mean_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-26-R144-fixed-eta0-correlated-mean-inputs.json --manifest-sha e99e081cd404c36e9f754c0839e9f8f7d95502fffa2db02bff093fe90a0599a8
