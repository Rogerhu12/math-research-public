name: visible-larger Rule15 metadata-only notes cleanup
'on':
  push:
    branches:
      - main
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-rule15-notes-cleanup-request.json
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: visible-larger-rule15-notes-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    name: Ordinary exact-OID deletion without scientific payload reads
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/README.md
            /topics/visible-flex-larger-amplitude/computations/root_20261115_rule15_prune_notes_metadata.py
            /topics/visible-flex-larger-amplitude/computations/public-rule15-notes-cleanup-request.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14
      - name: Bind compact source and recipe, without importing the cleanup module
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          python - <<'PYSOURCE'
          import ast, hashlib, json, os
          from pathlib import Path
          repo = Path.cwd()
          comp = repo/'topics/visible-flex-larger-amplitude/computations'
          name = 'root_20261115_rule15_prune_notes_metadata.py'
          source = (comp/name).read_bytes()
          recipe = (comp/'public-rule15-notes-cleanup-request.json').read_bytes()
          assert hashlib.sha256(source).hexdigest() == '2465b3dd0e50acfc63b026e7fd73cd15d0c58e401fb925b9d47974b2e31d014c'
          assert hashlib.sha256(recipe).hexdigest() == '078a1297f8d4c1c259c0f89f1c55e6af419200ca4319951532d25708a94fba03'
          parsed = json.loads(recipe)
          assert parsed['request_number'] == 104
          assert parsed['script_sha256'] == hashlib.sha256(source).hexdigest()
          compile(ast.parse(source, filename=name), name, 'exec')
          dst = Path(os.environ['RUNNER_TEMP'])/'rule15-cleanup104-source'
          dst.mkdir()
          (dst/name).write_bytes(source)
          (dst/'request.json').write_bytes(recipe)
          print(json.dumps(dict(event='request104-source-recipe-bound',
              source_sha256=hashlib.sha256(source).hexdigest(),
              recipe_sha256=hashlib.sha256(recipe).hexdigest(),
              AST_only=True, scientific_imports=0, inventory_not_executed_yet=True)))
          PYSOURCE
      - name: Match original Git objects, remove from index, and ordinary pull/rebase/push
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -u "$RUNNER_TEMP/rule15-cleanup104-source/root_20261115_rule15_prune_notes_metadata.py" \
            --repository "$GITHUB_WORKSPACE" \
            --recipe "$RUNNER_TEMP/rule15-cleanup104-source/request.json" \
            --out "$RUNNER_TEMP/rule15-cleanup104-output" \
            --apply
