                raise RuntimeError('The independent native group was not observed stopped')
            if target.is_dir():shutil.rmtree(target)
            print(json.dumps(dict(event='request168_owned_temporary_payload_removed',
              original_complete_readback_steps=outcomes,quiescent=True,
              raw_outputs_or_recovered_inputs_not_uploaded=True)),flush=True)
          except Exception as error:
            print(json.dumps(dict(event='request168_owned_cleanup_skipped',error=repr(error),
              raw_left_only_until_runner_destruction=True,
              no_missing_readback_or_scientific_completion_inferred=True)),flush=True)
          PYCLEAN
  report:
    name: Actual original C plus complete native scope and output hashes only
    needs: compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCALAR_SUMMARY: ${{ needs.compute.outputs.scalar_summary }}
      SCALAR_SUMMARY_BYTES: ${{ needs.compute.outputs.scalar_summary_bytes }}
      SCALAR_SUMMARY_SHA256: ${{ needs.compute.outputs.scalar_summary_sha256 }}
      COMPUTE_RESULT: ${{ needs.compute.result }}
      CUT_TWOJET_SUMMARY: ${{ needs.compute.outputs.cut_twojet_summary }}
      CUT_TWOJET_SUMMARY_BYTES: ${{ needs.compute.outputs.cut_twojet_summary_bytes }}
      CUT_TWOJET_SUMMARY_SHA256: ${{ needs.compute.outputs.cut_twojet_summary_sha256 }}
      FAR_SUMMARY: ${{ needs.compute.outputs.far_summary }}
      FAR_SUMMARY_BYTES: ${{ needs.compute.outputs.far_summary_bytes }}
      FAR_SUMMARY_SHA256: ${{ needs.compute.outputs.far_summary_sha256 }}
      NATIVE_SUMMARY: ${{ needs.compute.outputs.native_summary }}
      NATIVE_SUMMARY_BYTES: ${{ needs.compute.outputs.native_summary_bytes }}
      NATIVE_SUMMARY_SHA256: ${{ needs.compute.outputs.native_summary_sha256 }}
    steps:
      - name: Print bounded original readout with honest unavailable case
        run: |
          python - <<'PYREPORT'
          import hashlib,json,os
          text=os.environ.get('SCALAR_SUMMARY','')
          if not text:
            text=json.dumps(dict(schema='request168-actual-continuous-E-output-unavailable-v1',
              run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],
              compute_job_result=os.environ.get('COMPUTE_RESULT'),continuous_E_completion_not_claimed=True),separators=(',',':'))
            raw=text.encode()
