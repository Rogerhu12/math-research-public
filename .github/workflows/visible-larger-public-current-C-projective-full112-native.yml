      - name: Install the explicit original numerical and rigorous interval runtimes
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5 scipy==1.17.0
      - name: Reserve temporary capacity for the declared single native call
        run: |
          python - <<'PYSPACE'
          import json,os,shutil,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          before=shutil.disk_usage(root)._asdict()
          for name in ('/usr/local/lib/android','/usr/share/dotnet','/opt/ghc'):
            path=Path(name)
            if path.exists():subprocess.run(['sudo','rm','-rf','--',name],check=True)
          after=shutil.disk_usage(root)._asdict()
          print(json.dumps(dict(event='request168_actual_temporary_capacity',
            before=before,after=after,minimum_bytes=34359738368,
            scope='One declared protocol call; not a guarantee for fullDN multi-call outputs',
            numerical_sources_and_tolerances_unchanged=True)),flush=True)
          if after['free']<34359738368:
            raise SystemExit('Declared temporary resource unavailable before scientific work')
          PYSPACE
      - name: Bind actual scientific source and explicit complete closed query
        run: |
          python - <<'PYPINS'
          import ast,hashlib,json,os,re,subprocess
          from pathlib import Path,PurePosixPath
          repo=Path(os.environ['GITHUB_WORKSPACE']);comp=Path(os.environ['VISIBLE_COMPUTATIONS'])
          raw=(comp/'public-current-C-projective-full112-native-request.json').read_bytes();request=json.loads(raw)
          assert request['schema']=='public-current-C-projective-full112-native-request-v1'
          assert request['request_number']==168 and request['lanes']==['currentCprojectivefull112native']
