name: visible-larger actual projective-current-C full112 zero native response and complete sensitivity
'on':
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-current-C-projective-full112-native-request.json
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: visible-larger-public-current-C-projective-full112-native
  cancel-in-progress: false
jobs:
  compute:
    name: Actual same-C oriented-unit far full112 zero solve complete sensitivity and finite audit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      scalar_summary: ${{ steps.scalar.outputs.scalar_summary }}
      scalar_summary_bytes: ${{ steps.scalar.outputs.scalar_summary_bytes }}
      scalar_summary_sha256: ${{ steps.scalar.outputs.scalar_summary_sha256 }}
      cut_twojet_summary: ${{ steps.cut_twojet.outputs.cut_twojet_summary }}
      cut_twojet_summary_bytes: ${{ steps.cut_twojet.outputs.cut_twojet_summary_bytes }}
      cut_twojet_summary_sha256: ${{ steps.cut_twojet.outputs.cut_twojet_summary_sha256 }}
      far_summary: ${{ steps.far_scalar.outputs.far_summary }}
      far_summary_bytes: ${{ steps.far_scalar.outputs.far_summary_bytes }}
      far_summary_sha256: ${{ steps.far_scalar.outputs.far_summary_sha256 }}
      native_summary: ${{ steps.native_scalar.outputs.native_summary }}
      native_summary_bytes: ${{ steps.native_scalar.outputs.native_summary_bytes }}
      native_summary_sha256: ${{ steps.native_scalar.outputs.native_summary_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-larger-public-current-C-projective-full112-native.yml
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
            /topics/visible-flex-larger-amplitude/results/R286-original-stored-continuous-integral-and-metric-bridge.md
            /topics/visible-flex-larger-amplitude/results/R297-continuous-E-unit-panel-and-piecewise-enclosure.md
            /topics/visible-flex-larger-amplitude/results/R306-complete-cap-endpoint-primitives-and-budget-preserving-integration.md
            /topics/visible-flex-larger-amplitude/results/R312-continuous-C-complete112-zero-tail-and-head-connection.md
            /topics/visible-flex-larger-amplitude/results/R324-continuous-C-finite-head-flux-and-closed-tube.md
            /topics/visible-flex-larger-amplitude/results/R347-continuous-C-two-chart-projective-normalization-and-cut-quotients.md
            /topics/visible-flex-larger-amplitude/results/R357-original-C-oriented-unit-Robin-family-enclosures.md
            /topics/visible-flex-larger-amplitude/results/R331-current-C-zero-seed-general-Robin-and-complete-sensitivity.md
      - name: Establish request168 owned namespace resource plan and process receipts
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          git config --global merge.stat false
          python3 - <<'PYNS'
          import ast,hashlib,json,os,time
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP']).resolve()/'visible-current-C-projective-native168'
          base.mkdir(exist_ok=False)
          comp=Path(os.environ['GITHUB_WORKSPACE'])/'topics/visible-flex-larger-amplitude/computations'
          request_raw=(comp/'public-current-C-projective-full112-native-request.json').read_bytes()
          assert hashlib.sha256(request_raw).hexdigest()=='d6b87eb9b3d2207171aeb5a11eb5e32c7a422a27030949458a33549ee9583aaa'
          request=json.loads(request_raw)
          assert request['execution']['namespace_science_deadline_seconds']==18900
          assert request['execution']['readback_reserve_seconds']==2700
          helper="\"\"\"Request168 owned process identities; standard-library lifecycle only.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport runpy\nimport sys\nimport time\n\nROLES={\"C\":\"rule-sync\",\"far\":\"rule-sync-far\",\"sampling\":\"rule-sync-sampling\",\"native\":\"rule-sync-native\"}\ndef canonical(value):\n    return (json.dumps(value,sort_keys=True,separators=(\",\",\":\"),allow_nan=False)+\"\\n\").encode()\ndef root():\n    base=Path(os.environ[\"VISIBLE_BASE\"]).resolve()\n    temporary=Path(os.environ[\"RUNNER_TEMP\"]).resolve()\n    if base.name!=\"visible-current-C-projective-native168\" or base.parent!=temporary:\n        raise ValueError(\"Use this job's exclusive request168 namespace\")\n    return base\ndef identity(pid):\n    try:\n        text=(Path(\"/proc\")/str(pid)/\"stat\").read_text()\n    except (FileNotFoundError,ProcessLookupError):\n        return None\n    fields=text.rsplit(\")\",1)[1].split()\n    return dict(pid=pid,state=fields[0],ppid=int(fields[1]),pgid=int(fields[2]),\n        start_ticks=int(fields[19]))\ndef record(role,kind,phase,**details):\n    if role not in ROLES or kind not in (\"parent\",\"science\"):\n        raise ValueError(\"Unknown original stage owner\")\n    directory=root()/\"owned-rule-sync-processes\"\n    directory.mkdir(exist_ok=True)\n    value=dict(schema=\"request168-owned-process-receipt-v1\",\n        repository=os.environ[\"GITHUB_REPOSITORY\"],run_id=os.environ[\"GITHUB_RUN_ID\"],\n        source_commit=os.environ[\"GITHUB_SHA\"],role=role,kind=kind,phase=phase,\n        own_process=identity(os.getpid()),unix_seconds=time.time(),**details)\n    path=directory/(role+\"-\"+kind+\"-\"+phase+\".json\")\n    raw=canonical(value)\n    with path.open(\"xb\") as stream:\n        stream.write(raw);stream.flush();os.fsync(stream.fileno())\n    print(json.dumps(dict(event=\"request168-owned-process-receipt\",\n        relative_file=str(path.relative_to(root())),bytes=len(raw),\n        sha256=hashlib.sha256(raw).hexdigest(),role=role,kind=kind,phase=phase)),flush=True)\n    return value\ndef invoke_parent(role,callback):\n    record(role,\"parent\",\"launch\",exclusive_process_group=False,\n        parent_may_inherit_a_shared_job_process_group=True)\n    try:\n        code=callback()\n    except BaseException as error:\n        record(role,\"parent\",\"return\",actual_exception_type=type(error).__name__,\n            actual_exception=str(error),normal_return=False)\n        raise\n    record(role,\"parent\",\"return\",actual_returncode=code,normal_return=True)\n    return code\ndef execute(argv):\n    if len(argv)<2 or argv[0] not in ROLES:\n        raise ValueError(\"Use exec ROLE original-script original-arguments\")\n    role=argv[0]\n    for key in (\"GH_TOKEN\",\"GITHUB_TOKEN\",\"MR_TOKEN\"):os.environ.pop(key,None)\n    own=identity(os.getpid())\n    if own is None or own[\"pgid\"]!=own[\"pid\"]:\n        raise ValueError(\"The original rule runner must own an exclusive science session\")\n    record(role,\"science\",\"launch\",exclusive_process_group=True,\n        exclusive_group_created_by_original_rules_runner_start_new_session=True)\n    actual=list(argv[1:])\n    declared_argv_sha256=hashlib.sha256(canonical(actual)).hexdigest()\n    base=root()\n    request_raw=(base/\"dispatch-request.json\").read_bytes()\n    request=json.loads(request_raw)\n    deadline=json.loads((base/\"namespace-science-deadline.json\").read_bytes())\n    if (deadline[\"schema\"]!=\"request168-owned-namespace-science-deadline-v1\"\n            or deadline[\"repository\"]!=os.environ[\"GITHUB_REPOSITORY\"]\n            or deadline[\"run_id\"]!=os.environ[\"GITHUB_RUN_ID\"]\n            or deadline[\"source_commit\"]!=os.environ[\"GITHUB_SHA\"]\n            or deadline[\"request_sha256\"]!=hashlib.sha256(request_raw).hexdigest()\n            or deadline[\"science_seconds_from_namespace\"]!=18900\n            or deadline[\"readback_reserve_seconds\"]!=2700):\n        raise ValueError(\"Bind the actual same-job namespace resource plan\")\n    remaining=deadline[\"namespace_created_unix_seconds\"]+18900-time.time()\n    policy=dict(schema=\"request168-actual-stage-resource-clip-v1\",\n        role=role,actual_remaining_namespace_seconds=remaining,\n        original_argv=actual[:],original_argv_sha256=declared_argv_sha256,\n        clipping_happens_after_original_rules_startup_sync=True,\n        phase_clocks_still_exclude_source_binding_and_runtime_setup=True,\n        namespace_is_a_startup_plan_not_an_absolute_kill_clock=True,\n        resource_scope_not_a_mathematical_or_denominator_gate=True)\n    def stop(reason):\n        record(role,\"science\",\"resource-stop\",scientific_script_started=False,\n            reason=reason,resource_policy=policy)\n        record(role,\"science\",\"return\",actual_returncode=124,normal_return=True,\n            original_scientific_scope_unpaid=True)\n        return None\n    def position(flag):\n        if actual.count(flag)!=1:\n            raise ValueError(\"One original resource argument required: \"+flag)\n        return actual.index(flag)+1\n    if remaining<=0:\n        stop(\"namespace-resource-plan-exhausted-before-this-scientific-entry\")\n        return 124\n    if role==\"sampling\":\n        declared=request[\"native_sampling\"][\"parameters\"]\n        linear=float(declared[\"linear_budget_seconds\"])\n        sampling=float(declared[\"sampling_budget_seconds\"])\n        reserve=float(request[\"execution\"][\"native_process_budget_seconds\"])\n        allowance=max(0.0,remaining-reserve)\n        scale=min(1.0,allowance/(linear+sampling))\n        policy.update(original_linear_seconds=linear,original_sampling_seconds=sampling,\n            planned_later_native_reserve_seconds=reserve,\n            actual_stage_allowance_seconds=allowance,\n            actual_linear_seconds=linear*scale,actual_sampling_seconds=sampling*scale,\n            sampling_phase_excludes_projective_propagation_elapsed=True)\n        if scale<=0:\n            stop(\"no-sampling-allowance-after-explicit-native-resource-reserve\")\n            return 124\n        for flag,original,effective in (\n                (\"--linear-budget-seconds\",linear,linear*scale),\n                (\"--sampling-budget-seconds\",sampling,sampling*scale)):\n            i=position(flag)\n            if float(actual[i])!=original:raise ValueError(\"Declared phase argument differs\")\n            actual[i]=repr(effective)\n    elif role==\"native\":\n        pi=position(\"--recipe\");hi=position(\"--recipe-sha256\")\n        raw=Path(actual[pi]).read_bytes();original=hashlib.sha256(raw).hexdigest()\n        if original!=actual[hi] or original!=request[\"native_execution_recipe\"][\"sha256\"]:\n            raise ValueError(\"The original explicit native recipe differs\")\n        recipe=json.loads(raw);declared=float(recipe[\"native_process_budget_seconds\"])\n        effective=min(declared,remaining)\n        policy.update(original_native_seconds=declared,actual_native_seconds=effective,\n            original_recipe=dict(file=actual[pi],bytes=len(raw),sha256=original),\n            scientific_parameters_and_all112_H_words_unchanged=True)\n        if effective<=0:\n            stop(\"no-native-process-allowance-after-rule-sync-startup\")\n            return 124\n        if effective<declared:\n            recipe[\"native_process_budget_seconds\"]=effective\n            recipe[\"actual_request168_budget_only_runtime_origin\"]=dict(\n                original_recipe=policy[\"original_recipe\"],\n                actual_remaining_namespace_seconds=remaining,\n                original_native_process_budget_seconds=declared,\n                only_changed_original_parameter=\"native_process_budget_seconds\",\n                all_scientific_parameters_and_requests_unchanged=True)\n            adjusted=canonical(recipe);path=base/\"actual-runtime-native-recipe.json\"\n            with path.open(\"xb\") as stream:\n                stream.write(adjusted);stream.flush();os.fsync(stream.fileno())\n            actual[pi]=str(path);actual[hi]=hashlib.sha256(adjusted).hexdigest()\n            policy[\"actual_runtime_recipe\"]=dict(file=str(path),bytes=len(adjusted),sha256=actual[hi])\n        else:\n            policy[\"actual_runtime_recipe\"]=policy[\"original_recipe\"]\n    else:\n        policy[\"original_C_or_deep_arguments_unchanged\"]=True\n    policy[\"actual_argv\"]=actual[:]\n    policy[\"actual_argv_sha256\"]=hashlib.sha256(canonical(actual)).hexdigest()\n    record(role,\"science\",\"resource-policy\",resource_policy=policy)\n    sys.argv=actual\n    try:\n        runpy.run_path(actual[0],run_name=\"__main__\")\n    except SystemExit as result:\n        code=0 if result.code is None else (result.code if type(result.code) is int else 1)\n        record(role,\"science\",\"return\",actual_returncode=code,normal_return=True,\n            original_system_exit_value=result.code if result.code is None or type(result.code) in (int,str) else repr(result.code))\n        raise\n    except BaseException as error:\n        record(role,\"science\",\"return\",actual_exception_type=type(error).__name__,\n            actual_exception=str(error),normal_return=False)\n        raise\n    record(role,\"science\",\"return\",actual_returncode=0,normal_return=True)\n    return 0\ndef observe():\n    base=root();directory=base/\"owned-rule-sync-processes\"\n    active=[];unknown=[];identities=[];launches={}\n    for path in (sorted(directory.glob(\"*-launch.json\")) if directory.is_dir() else []):\n        try:\n            raw=path.read_bytes();value=json.loads(raw)\n            if (value[\"schema\"]!=\"request168-owned-process-receipt-v1\"\n                    or value[\"repository\"]!=os.environ[\"GITHUB_REPOSITORY\"]\n                    or value[\"run_id\"]!=os.environ[\"GITHUB_RUN_ID\"]\n                    or value[\"source_commit\"]!=os.environ[\"GITHUB_SHA\"]):\n                raise ValueError(\"An original owner receipt has a different source or run\")\n            role,kind=value[\"role\"],value[\"kind\"];saved=value[\"own_process\"]\n            if role not in ROLES or kind not in (\"parent\",\"science\") or saved is None:\n                raise ValueError(\"Original owner identity is incomplete\")\n            launches[(role,kind)]=value\n            current=identity(saved[\"pid\"])\n            same=(current is not None and current[\"start_ticks\"]==saved[\"start_ticks\"])\n            one=dict(relative_file=str(path.relative_to(base)),bytes=len(raw),\n                sha256=hashlib.sha256(raw).hexdigest(),role=role,kind=kind,\n                original_pid=saved[\"pid\"],original_start_ticks=saved[\"start_ticks\"],\n                original_pgid=saved[\"pgid\"],same_original_process_currently_present=same,\n                current_state=current[\"state\"] if same else None)\n            if same and current[\"state\"]!=\"Z\":\n                active.append(dict(role=role,kind=kind,**current))\n            if kind==\"science\":\n                if value.get(\"exclusive_process_group\") is not True or saved[\"pgid\"]!=saved[\"pid\"]:\n                    raise ValueError(\"A science group was not proved exclusive at launch\")\n                members=[]\n                for child in Path(\"/proc\").iterdir():\n                    if not child.name.isdigit():continue\n                    current_member=identity(int(child.name))\n                    if (current_member is not None and current_member[\"pgid\"]==saved[\"pgid\"]\n                            and current_member[\"state\"]!=\"Z\"):\n                        members.append(current_member)\n                one[\"live_members_of_original_exclusive_science_group\"]=members\n                for member in members:\n                    if not any(x[\"pid\"]==member[\"pid\"] for x in active):\n                        active.append(dict(role=role,kind=\"science-group-member\",**member))\n            else:\n                one[\"shared_parent_process_group_not_required_to_be_empty\"]=True\n            identities.append(one)\n        except Exception as error:\n            unknown.append(dict(relative_file=str(path.relative_to(base)),\n                type=type(error).__name__,message=str(error)))\n    for role,name in ROLES.items():\n        out=base/name\n        if (out/\"science-launch.json\").is_file() and (role,\"science\") not in launches:\n            if not (out/\"runner-result.json\").is_file() and not (out/\"science-launch-failed.json\").is_file():\n                unknown.append(dict(role=role,\n                    reason=\"Original launch intent exists but no actual child identity or joined return was recorded\"))\n        if out.is_dir() and (role,\"parent\") not in launches:\n            unknown.append(dict(role=role,\n                reason=\"An original rules directory exists without its wrapper owner launch identity\"))\n    return dict(schema=\"request168-original-owner-quiescence-observation-v1\",\n        repository=os.environ[\"GITHUB_REPOSITORY\"],run_id=os.environ[\"GITHUB_RUN_ID\"],\n        source_commit=os.environ[\"GITHUB_SHA\"],unix_seconds=time.time(),\n        original_process_receipts=identities,live_original_owned_processes=active,\n        unknown_owner_scopes=unknown,quiescent=not active and not unknown,\n        parent_shared_job_group_not_treated_as_science=True,\n        no_signal_or_process_mutation_performed=True,\n        this_metadata_condition_is_not_a_mathematical_acceptance_gate=True)\nif __name__==\"__main__\":\n    if sys.argv[1:2]!=[\"exec\"]:raise SystemExit(\"Use exec ROLE original scientific argv\")\n    raise SystemExit(execute(sys.argv[2:]))\n"
          helper_raw=helper.encode()
          assert len(helper_raw)==13175 and hashlib.sha256(helper_raw).hexdigest()=='e8418e10afe0cf519b2d6ea747feb57ffa9dc74f8cd797661b0525a1122d1176'
          compile(ast.parse(helper_raw,filename='request168_owned_process.py'),'request168_owned_process.py','exec')
          with (base/'request168_owned_process.py').open('xb') as stream:
            stream.write(helper_raw);stream.flush();os.fsync(stream.fileno())
          deadline=dict(schema='request168-owned-namespace-science-deadline-v1',
            repository=os.environ['GITHUB_REPOSITORY'],run_id=os.environ['GITHUB_RUN_ID'],
            source_commit=os.environ['GITHUB_SHA'],request_sha256=hashlib.sha256(request_raw).hexdigest(),
            namespace_created_unix_seconds=time.time(),science_seconds_from_namespace=18900,
            readback_reserve_seconds=2700,job_hard_timeout_minutes=360,
            scope='Startup resource plan and actual clip; no namespace-wide absolute kill timer',
            original_stage_clocks_exclude_binding_and_setup=True,
            resource_partial_not_mathematical_rejection=True)
          with (base/'namespace-science-deadline.json').open('xb') as stream:
            stream.write((json.dumps(deadline,sort_keys=True,separators=(',',':'))+'\n').encode())
            stream.flush();os.fsync(stream.fileno())
          print(json.dumps(dict(event='request168_actual_namespace_resource_plan',**deadline)),flush=True)
          with open(os.environ['GITHUB_ENV'],'a') as stream:
            stream.write('VISIBLE_BASE='+str(base)+'\n')
            stream.write('VISIBLE_COMPUTATIONS='+str(comp)+'\n')
          PYNS
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
