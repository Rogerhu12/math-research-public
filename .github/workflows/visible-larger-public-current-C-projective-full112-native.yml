      - name: Read actual complete metadata and unresolved suffixes without new scientific arithmetic
        id: scalar
        if: always()
        timeout-minutes: 5
        run: |
          python - <<'PYSCALAR'
          import collections,hashlib,json,os
          from pathlib import Path
          base=Path(os.environ['VISIBLE_BASE']);out=base/'continuous-E'
          def digest(path):
            h=hashlib.sha256();count=0
            with path.open('rb') as stream:
              for block in iter(lambda:stream.read(1048576),b''):h.update(block);count+=len(block)
            return dict(file=str(path.relative_to(base)),bytes=count,sha256=h.hexdigest())
          summary=dict(schema='request168-original-continuous-E-actual-scalar-summary-v1',
            run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],
            compute_step_outcome='${{ steps.science.outcome }}',
            source_result=None,query_results=None,complete_unpaid_scope=None,
            actual_accepted_field_not_claimed=True,readout_performs_no_new_scientific_arithmetic=True)
          result=out/'result.json'
          if result.is_file():
            desc=digest(result);record=json.loads(result.read_bytes())
            assert record['schema']=='R286-original-stored-convention-C-continuous-E-cover-v3'
            comp=Path(os.environ['VISIBLE_COMPUTATIONS'])
            request=json.loads((Path(os.environ['VISIBLE_BASE'])/'dispatch-request.json').read_bytes())
            assert record['source_sha256']==request['source_sha256'][request['scientific_entry']]
            assert record['preserved_original_producer_source']==request['evaluation_strategy']['preserved_original_producer_source']
            assert record['preserved_unit_panel_producer_source']==request['evaluation_strategy']['preserved_unit_panel_producer_source']
            summary['original_result_file']=desc;summary['source_result']=record
            query=record['query_results'];path=out/query['file'];qraw=path.read_bytes()
            assert len(qraw)==query['bytes'] and hashlib.sha256(qraw).hexdigest()==query['sha256']
            summary['query_results']=json.loads(qraw)
            unpaid=record['ledgers']['complete_unpaid_scope'];path=out/unpaid['file']
            actual=digest(path)
            assert actual['bytes']==unpaid['bytes'] and actual['sha256']==unpaid['sha256']
            counts=collections.Counter();source_suffixes=[];query_suffixes=[];first_issue=None;rows=0
            with path.open('rb') as stream:
              for raw in stream:
                item=json.loads(raw);rows+=1;kind=item['kind'];counts[kind]+=1
                if first_issue is None:first_issue=item
                if kind=='unvisited-source-piece-suffix':source_suffixes.append(item)
                if kind=='unvisited-query-suffix':query_suffixes.append(item)
            assert rows==unpaid['rows']
            summary['complete_unpaid_scope']=dict(original_ledger=actual,rows=rows,
              exact_row_count_by_kind=dict(counts),first_original_issue=first_issue,
              all_unvisited_source_piece_suffixes=source_suffixes,all_unvisited_query_suffixes=query_suffixes,
              other_closed_panel_rows_are_in_recomputable_ledger_not_silently_claimed_paid=True)
          else:
            summary['failure_scope']='No final producer result; inspect original child stderr and rule-sync outcome; no scientific completion is inferred.'
          rules=base/'rule-sync'/'runner-result.json'
          if rules.is_file():summary['rules_runner_result']=dict(original_file=digest(rules),value=json.loads(rules.read_bytes()))
          raw=json.dumps(summary,ensure_ascii=False,separators=(',',':'),allow_nan=False).encode()
          if len(raw)>90000:
            print(json.dumps(dict(event='request168_actual_scalar_summary_too_large',bytes=len(raw),
              sha256=hashlib.sha256(raw).hexdigest(),no_truncation_and_no_success_relabel=True)),flush=True)
            raise SystemExit(70)
          print('BEGIN_REQUEST168_ACTUAL_CONTINUOUS_E_SCALAR_SUMMARY')
          print(raw.decode())
          print('END_REQUEST168_ACTUAL_CONTINUOUS_E_SCALAR_SUMMARY')
          checksum=hashlib.sha256(raw).hexdigest()
          print(json.dumps(dict(event='request168_actual_scalar_identity',bytes=len(raw),sha256=checksum,
            hash_scope='compact UTF8 JSON excluding separator LF',raw_upload=False)),flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
            stream.write('scalar_summary='+raw.decode()+'\n')
            stream.write('scalar_summary_bytes='+str(len(raw))+'\n')
            stream.write('scalar_summary_sha256='+checksum+'\n')
          PYSCALAR
      - name: Read all actual deep rows and retain only original scope and identities
        id: far_scalar
        if: always()
        timeout-minutes: 5
        run: |
          python - <<'PYFARREAD'
          import hashlib,json,os
          from pathlib import Path,PurePosixPath
          base=Path(os.environ['VISIBLE_BASE']);out=base/'deep-far'
          request=json.loads((base/'dispatch-request.json').read_bytes())
