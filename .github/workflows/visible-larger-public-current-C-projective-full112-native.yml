          assert hashlib.sha256(raw).hexdigest()=='8a3ddc5d59244b245292bd5a0e3fb33768527017148cc4e697d2f2cf771989e7'
          spec=importlib.util.spec_from_file_location('_request168_original_byte_readback',comp/name)
          R=importlib.util.module_from_spec(spec);sys.modules[spec.name]=R;spec.loader.exec_module(R)
          owner=base/'request168_owned_process.py'
          assert hashlib.sha256(owner.read_bytes()).hexdigest()=='e8418e10afe0cf519b2d6ea747feb57ffa9dc74f8cd797661b0525a1122d1176'
          owned=runpy.run_path(str(owner),run_name='_request168_rule_readback_owner')
