              if not item.is_file() or item.is_symlink():continue
              label='REQUEST168_RULE_%03d_%05d'%(index,j)
              if item.name.endswith('.json'):
                value,identity=R.optional(item)
                R.emit(label,dict(original_file=identity,original_value=value,read_only=True))
              else:R.original_bytes(item,label)
