              if value.get('actual_client_process_started') and value.get('owned_process_group_shutdown_before_readback') is not True:
                observed['unknown_owner_scopes'].append(dict(role='native-client',reason='Actual independent client group has no observed stopped receipt'))
            except Exception as error:
              observed['unknown_owner_scopes'].append(dict(role='native-client',reason='Owned native output exists without a complete launch-return receipt',original_error=repr(error)))
          observed['quiescent']=not observed['live_original_owned_processes'] and not observed['unknown_owner_scopes']
          (base/'rule-readback-quiescence.json').write_bytes(R.canonical(observed))
          R.emit('REQUEST168_RULE_READBACK_OWNER_SCOPE',observed)
          for i,name in enumerate(('namespace-science-deadline.json','pre-native-readback-quiescence.json',
              'rule-readback-quiescence.json','actual-runtime-native-recipe.json')):
            path=base/name
            if path.is_file():
              value,identity=R.optional(path)
              R.emit('REQUEST168_RESOURCE_%03d'%i,dict(original_file=identity,original_value=value,read_only=True))
          if not observed['quiescent']:
            R.emit('REQUEST168_RULE_LIVE_SCOPE_UNPAID',dict(
              quiescent=False,complete_mutable_rule_streams_not_claimed=True,
