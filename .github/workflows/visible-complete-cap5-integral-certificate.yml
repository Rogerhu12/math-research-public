name: visible-flex complete cap five-gate rational integral certificate
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-complete-cap5-integral-certificate.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visible-flex-complete-cap5-certificate
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-complete-cap5-integral-certificate.yml
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-complete-cap5-integral-certificate.json
            /topics/visible-flex-new-mechanism/notes/complete-cap5-integral-positive-certificate-design-20261116.md
            /topics/visible-flex-new-mechanism/scripts/complete_cap5_integral_certificate.py
            /topics/visible-flex-new-mechanism/scripts/observe_complete_cap5_certificate_stdout.py
            /topics/visible-flex-new-mechanism/scripts/read_original_actions_log.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install the pinned numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Pull rules and execute one new rational integral-certificate problem
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path.cwd();topic='topics/visible-flex-new-mechanism'
          request_path=topic+'/computations/request-complete-cap5-integral-certificate.json'
          reader_path=topic+'/scripts/read_original_actions_log.py'
          raw_request=Path(request_path).read_bytes()
          request=json.loads(raw_request)
          source=os.environ['GITHUB_SHA']
          sys.path.insert(0,str((root/topic/'scripts').resolve()))
          import read_original_actions_log as reader
          reader.require(os.environ.get('GITHUB_ACTIONS')=='true'
              and os.environ.get('GITHUB_REPOSITORY')=='Rogerhu12/math-research-public',
              'new science belongs only to this public repository Actions')
          reader.require(hashlib.sha256(Path(reader.__file__).read_bytes()).hexdigest()
              ==request['source_sha256'][reader_path],'rule reader source changed')
          def emit(tag,value):
              print(tag+' '+reader.encoded(value).decode('utf-8'),flush=True)
          public=reader.actual_pull(root,request,source)
          emit('CAP5_CERT_PUBLIC_PULL',public)
          reader.require(public['passed'],'README changed or actual pull failed; apply only diff')
          private={}
          try:
              reader.private_rule_pull(request,private)
          finally:
              os.environ.pop('MR_TOKEN',None)
              emit('CAP5_CERT_PRIVATE_PULL',private)
          reader.git_ok(root,['checkout','--detach',source])
          reader.require(Path(request_path).read_bytes()==raw_request,'source request differs')
          for path,expected in request['source_sha256'].items():
              reader.require(hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected,
                  'published input source changed: '+path)
          reader.require('MR_TOKEN' not in os.environ,'private credential must leave before science')
          out=Path(os.environ['RUNNER_TEMP'])/'visible-complete-cap5-certificate'/'result.json'
          # One new 600-second account: complete original polynomial assembly,
          # one LP (at most 180 seconds), one exact rational defect judge,
          # all failures and output. Reserve 180 seconds after the LP;
          # no old atom search, adaptive basis, preflight, or second LP.
          result=subprocess.run([sys.executable,
              topic+'/scripts/complete_cap5_integral_certificate.py',
              '--request',request_path,'--source-commit',source,'--out',str(out)])
          raise SystemExit(result.returncode)
          PY
      # All scientific values and new certificates remain in original stdout
      # and ephemeral runner output. No artifacts, Releases, Git or cache upload.
  report:
    needs: research
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-complete-cap5-integral-certificate.yml
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-complete-cap5-integral-certificate.json
            /topics/visible-flex-new-mechanism/scripts/observe_complete_cap5_certificate_stdout.py
            /topics/visible-flex-new-mechanism/scripts/read_original_actions_log.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull rules and read the completed new research stdout once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path.cwd();topic='topics/visible-flex-new-mechanism'
          request_path=topic+'/computations/request-complete-cap5-integral-certificate.json'
          reader_path=topic+'/scripts/read_original_actions_log.py'
          observer_path=topic+'/scripts/observe_complete_cap5_certificate_stdout.py'
          workflow_path='.github/workflows/visible-complete-cap5-integral-certificate.yml'
          raw_request=Path(request_path).read_bytes();request=json.loads(raw_request)
          source=os.environ['GITHUB_SHA'];run_id=os.environ['GITHUB_RUN_ID']
          sys.path.insert(0,str((root/topic/'scripts').resolve()))
          import read_original_actions_log as reader
          reader.require(hashlib.sha256(Path(reader.__file__).read_bytes()).hexdigest()
              ==request['source_sha256'][reader_path],'read-only rule reader source changed')
          def emit(tag,value):
              print(tag+' '+reader.encoded(value).decode('utf-8'),flush=True)
          public=reader.actual_pull(root,request,source)
          emit('CAP5_CERT_REPORT_PUBLIC_PULL',public)
          reader.require(public['passed'],'README changed before read-only observer; apply only diff')
          private={}
          try:
              reader.private_rule_pull(request,private)
          finally:
              os.environ.pop('MR_TOKEN',None)
              emit('CAP5_CERT_REPORT_PRIVATE_PULL',private)
          reader.git_ok(root,['checkout','--detach',source])
          reader.require(Path(request_path).read_bytes()==raw_request,'observer source request differs')
          for path in (reader_path,observer_path,workflow_path):
              reader.require(hashlib.sha256(Path(path).read_bytes()).hexdigest()
                  ==request['source_sha256'][path],'observer source binding differs: '+path)
          api=reader.GitHubReader('Rogerhu12/math-research-public')
          run=api.api_json('/actions/runs/'+run_id)
          jobs=api.api_json('/actions/runs/'+run_id+'/jobs?filter=latest&per_page=100')
          selected=[j for j in jobs['jobs'] if j['name']=='research']
          reader.require(str(run['id'])==run_id and run['head_sha']==source
              and str(run.get('path','')).split('@',1)[0]==workflow_path and len(selected)==1,
              'unique same-source research job required')
          job=selected[0]
          reader.require(job['status']=='completed' and job['head_sha']==source,
              'research job must be completed; success is not assumed')
          out=Path(os.environ['RUNNER_TEMP'])/'visible-complete-cap5-certificate'/'read-only-report.json'
          result=subprocess.run([sys.executable,observer_path,
              '--run-id',run_id,'--job-id',str(job['id']),'--source-commit',source,
              '--workflow',workflow_path,'--out',str(out)])
          raise SystemExit(result.returncode)
          PY
      # Stdlib original-output selection only; no numerical imports or research.
