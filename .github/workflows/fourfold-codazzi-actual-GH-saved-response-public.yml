name: Actual GH saved head response

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-actual-GH-saved-response-public.yml

permissions:
  contents: write

concurrency:
  group: actual-GH-saved-head-response-v1
  cancel-in-progress: false

jobs:
  complete-four-responses:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_actual_GH_saved_response_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-20-actual-GH-saved-response-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the same completed directed runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Consume complete source and high-response scalars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_actual_GH_saved_response_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-20-actual-GH-saved-response-inputs.json --manifest-sha 87e75f8e001601fa8ed6279d7b3e0735799a336a31b4e39b0bac9b0f2194bc35
