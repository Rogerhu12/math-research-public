name: visible-larger request142 complete-nine directional-response single batch
'on':
  push:
    branches:
    - main
    paths:
    - topics/visible-flex-larger-amplitude/computations/public-nine-control-directional-response-request.json
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: visible-larger-public-nine-control-directional-response
  cancel-in-progress: false
jobs:
  compute:
    name: One complete-nine directional-response eight-direction batch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    outputs:
      chain_summary: ${{ steps.chain.outputs.chain_summary }}
      chain_summary_bytes: ${{ steps.chain.outputs.chain_summary_bytes }}
      chain_summary_sha256: ${{ steps.chain.outputs.chain_summary_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        filter: blob:none
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /README.md
          /topics/visible-flex-larger-amplitude/*.md
          /topics/visible-flex-larger-amplitude/computations/
    - name: Establish independent temporary metadata paths
      run: |
        git config gc.auto 0
        git config gc.autoPackLimit 0
        git config maintenance.auto false
        git config --global merge.stat false
        mkdir -p "$RUNNER_TEMP/visible-nine-control-directional-response"
        echo "VISIBLE_OUT=$RUNNER_TEMP/visible-nine-control-directional-response" >> "$GITHUB_ENV"
        echo "VISIBLE_INPUTS=$RUNNER_TEMP/visible-nine-control-directional-response/original-inputs" >> "$GITHUB_ENV"
        echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.14
    - name: Install unchanged original operator runtime
      run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
    - name: Bind actual138 final parameters and radius with93 sources and5 support pins
      run: |
        python - <<'PYPINS'
        import ast,hashlib,json,os,subprocess
        from pathlib import Path,PurePosixPath
        repo=Path.cwd();comp=Path(os.environ['VISIBLE_COMPUTATIONS']);out=Path(os.environ['VISIBLE_OUT'])
        input_root=Path(os.environ['VISIBLE_INPUTS']);input_root.mkdir(parents=True,exist_ok=False)
        raw=(comp/'public-nine-control-directional-response-request.json').read_bytes();request=json.loads(raw)
        assert request['repository']=='Rogerhu12/math-research-public' and request['request_number']==142
        assert request['schema']=='public-nine-control-complete-directional-response-single-temporary-batch-request-v1'
        assert request['lanes']==['smallcoreresonance']
        entry='geometry_20261115_small_core_nine_control_directional_response_recipe.py';family_name='geometry_20261115_small_core_nine_control_family.py'
        wrapper='geometry_20261115_nine_control_directional_response_temporary_batch.py'
        assert request['execution_entry']==wrapper and request['scientific_entry']==entry
        assert request['source_sha256'][wrapper]=='5c482ac3504686b32c945d6ec0b589e5f986f07accce158e6a61712b37f77f4d'
        assert request['source_sha256'][entry]=='5acf5b029a756a356a3de3d598211eaa89df4a7670fc703f2d3567488e09bae4'
        assert request['source_sha256']['geometry_20261115_nine_control_temporary_batches.py']=='b15a6571a1ebc5dc72f1037212fd86a10d7a5848957c2faca4ae9e7fd69f21bb'
        assert request['source_sha256']['geometry_20261115_nine_control_thirty_two_temporary_batches.py']=='fd5d78f3a24b4f5bbcb38c59bc25ca9405244f6253de5438bc00776b4e1fb5bb'
        assert request['source_sha256']['geometry_20261115_small_core_nine_control_curved_recipe.py']=='824c0967e5de5cc9079a80018b66b1232c78ce406a6de4e0d7ab4cdee876bdaf'
        assert request['batch_chain']=={'max_batches':1,'chain_budget_seconds':3600,'budget_checked_only_between_complete_batches':True,'reset_initial_relative_radius_each_batch':False,'carry_final_relative_trust_radius':True,'one_atomic_original_eight_direction_child':True}
        assert request['source_sha256'][family_name]=='086572f9a9fc172d671f050e9b343b66c4a57c5c88867537a1e8a3daa5ab9629'
        assert request['workflow_support_source_sha256']['root_20261115_small_core_nine_control_curved_scalar_readout.py']=='f57a7dfae95f3e629aa412003e10ea4e32a9821b754c3d575318f97b09b7317d'
        assert request['workflow_support_source_sha256']['root_20261115_small_core_nine_control_directional_response_scalar_readout.py']=='f3a236a3b1a18ad8eacaafe32e166cb8c5d7c96d1cd9a7a6573f0105156073f6'
        expected=json.loads(r'''{"parameters":[0.3055213765780896,0.21645017443068498,0.34270035782290403,-0.06322330093655137,-0.017474512907261836,0.9376116549666047,1.0751305682653982,0.6886902199638585,0.9385448548742756],"backtracks":20,"candidate_resonance_tolerance":1e-8,"interval_bits":160,"interval_depth":14,"original_mesh_nodes":699,"field_modes":112,"tail_modes":112,"physical_angle_grid":2048,"material_and_boundary_angles":4096,"original_RHS_workers":1,"initial_relative_radius":3.814697265625e-7,"candidate_steps":8,"normal_iterations":12,"normal_backtracks":20,"normal_target_tolerance":1e-8}''')
        assert request['diagnostic']==expected
        for path,blob in request['reviewed_README_blobs'].items():
         assert subprocess.check_output(['git','hash-object',path],text=True).strip()==blob,'README changed: read and apply new rules'
        handoff=(repo/'topics/visible-flex-larger-amplitude/HANDOFF.md').read_bytes()
        assert len(handoff)<=10000 and sum(line.startswith('规则同步记录：'.encode()) for line in handoff.splitlines())==1,'Retain the existing unique rule-sync line; do not bypass original Runner'
        for group,expected_count in [('source_sha256',93),('workflow_support_source_sha256',5)]:
         assert len(request[group])==expected_count
         for name,digest in request[group].items():
          assert PurePosixPath(name).name==name
          b=(comp/name).read_bytes();assert hashlib.sha256(b).hexdigest()==digest,name
          if name.endswith('.py'):compile(ast.parse(b,filename=name),name,'exec')
        closure=request['source_closure']['current_producer']
        assert len(closure)==31 and len(request['source_closure']['origin_producer'])==29
        assert all(request['source_sha256'][name]==digest for name,digest in closure.items())
        carried_baseline='geometry_20261115_small_core_nine_control_carried_radius_recipe.py'
        selector='geometry_20261115_nine_control_same_trace_full_merit_candidate.py'
        response_helper='geometry_20261115_nine_control_directional_complex_response.py'
        same_trace_parent='geometry_20261115_small_core_nine_control_same_trace_merit_recipe.py'
        assert closure[response_helper]=='50044473f14b34c9451360debaa1ec9189f0a7924957098cafc37df3f849643f'
        assert closure[same_trace_parent]=='e8704af6daa13eac4d0301a6ef1debdca4c9cb0b10a806544644a2e1d162329a'
        assert request['source_closure']['origin_producer']=={name:digest for name,digest in closure.items() if name not in (entry,response_helper)}
        assert request['source_sha256']['geometry_20261115_nine_control_same_trace_merit_temporary_batches.py']=='79c178f4ea76880e0a1cc01ead06cf95fb0e98e74f8f6b8dacedfa98b5f95ad6'
        assert request['workflow_support_source_sha256']['root_20261115_small_core_nine_control_same_trace_merit_scalar_readout.py']=='4973404938189fc37b8563508da7212959a34d1527abd1c5910f717f27e504cd'
        assert closure[carried_baseline]=='ed78684f93c76cf1695a3a54f04d28528b5505fccf115b6fd6afddc7a657cd50'
        assert closure[selector]=='d4c9cd448b81e3c506984a273cb0e050cf806ebc109ad4d2b140cec9fa8d2cbf'
        assert request['source_sha256']['geometry_20261115_nine_control_carried_radius_temporary_batches.py']=='df856e9ecf9d9bbd52c7c515d75aed0a50efbfd0f54126ec9dd07eed48521209'
        assert request['workflow_support_source_sha256']['root_20261115_small_core_nine_control_carried_radius_scalar_readout.py']=='24c5ff04203965bf49ab3a559eaaaa5b90ecccd16a58cc87eb148676cf885cd2'
        item=request['parameter_recipe'];recipe_raw=(repo/item['file']).read_bytes()
        assert len(recipe_raw)==2449==item['bytes']
        assert hashlib.sha256(recipe_raw).hexdigest()==item['sha256']=='29bf38f8a91063cbe0a6982bc015684e512fbdbbb65ac97dcb8703f9ce5ea1ac'
        recipe=json.loads(recipe_raw)
        assert set(recipe)=={'schema','origin','literal_parameters','algorithm_state','input_sha256','family'}
        assert recipe['schema']=='R259-explicit-nine-control-parameters-and-radius-recipe-v1'
        assert recipe['literal_parameters']==request['diagnostic']['parameters'] and recipe['origin']==item['origin']
        assert recipe['family']==item['family']==json.loads(r'''{"formula":"sum p_i*b_i + sum theta_i*b_i*t_i + sum eta_i*b_i*t_i^2, t_i=2*x_i-1","new_parameter_count":9,"new_quadratic_controls":3,"newly_added_quadratic_column_indices":[6,7,8],"old_four_column_indices":[0,1,2,4],"old_six_column_indices":[0,1,2,3,4,5],"original_even_controls":3,"parameter_order":["p1","p2","p3","theta1","theta2","theta3","eta1","eta2","eta3"],"raw_quadratic_controls_not_centered":true,"retained_odd_controls":3,"schema":"three-original-supports-even-odd-raw-quadratic-C2-controls-v1","support_indices":[0,1,2],"zero_new_quadratics_reduces_to_previous_six":true}''')
        assert len(recipe['literal_parameters'])==9
        assert recipe['origin']['producer_file']=='geometry_20261115_small_core_nine_control_same_trace_merit_recipe.py'
        assert recipe['origin']['producer_schema']=='R259-nine-control-full-three-two-normal-same-trace-merit-carried-radius-trust-recipe-v1'
        assert recipe['origin']['producer_sha256']==request['source_sha256'][recipe['origin']['producer_file']]
        assert recipe['origin']['run_id']=='43710284131' and recipe['origin']['source_commit']=='0be175792723e0663809146e3922e7052e906c09'
        assert recipe['origin']['status_sha256']==request['actual138_source_provenance']['origin']['status_sha256']=='42df80cf0bdfd42a107b20d2ab994d92be64b8ab148ef54b915008a8a938e134'
        assert recipe['origin']['log_summary_sha256']==request['actual138_source_provenance']['origin']['log_summary_sha256']=='2dab4f53ee03392f7888ff3386b56b8ea6253a8d90897d560f53f076e7aca409'
        assert request['actual138_source_provenance']['origin']==recipe['origin'] and request['actual138_source_provenance']['final_batch']==32
        assert recipe['origin']['status_bytes']==973393 and recipe['origin']['log_summary_bytes']==67945
        assert recipe['origin']['parameter_field']=='final.parameters' and recipe['origin']['radius_field']=='final_relative_trust_radius'
        assert recipe['algorithm_state']==item['algorithm_state']=={'relative_trust_radius':3.814697265625e-7}
        assert float(recipe['algorithm_state']['relative_trust_radius']).hex()==float(request['diagnostic']['initial_relative_radius']).hex()
        assert request['trust_radius_restart']['initial_actual_recorded_radius']==3.814697265625e-7
        assert request['trust_radius_restart']['continuation_of_stored_trust_state'] is True
        assert request['scalar_family']['zero_added_quadratic_bitwise_equality_is_not_an_acceptance_or_execution_gate'] is True
        assert recipe['input_sha256']=={k:v['sha256'] for k,v in request['inputs'].items()}
        history=request['original_input_history_commit']
        assert history=='8bd267107cc8710d371f3b62c02986655ac965b0'
        subprocess.run(['git','fetch','--filter=blob:none','--no-tags','origin',history],check=True)
        paths={}
        for key,item in request['inputs'].items():
         rel=PurePosixPath(item['file'])
         assert not rel.is_absolute() and '..' not in rel.parts and str(rel).startswith('topics/visible-flex-larger-amplitude/')
         b=subprocess.check_output(['git','show',history+':'+str(rel)])
         assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256'],str(rel)
         p=input_root/(key+'-'+rel.name);p.write_bytes(b);paths[key]=str(p)
        (out/'original-input-paths.json').write_text(json.dumps(paths,sort_keys=True)+'\n')
        head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        assert head==os.environ['GITHUB_SHA']
        print(json.dumps(dict(event='request142-source-input-identity',source_commit=head,request_sha256=hashlib.sha256(raw).hexdigest(),source_count=93,workflow_support_source_count=5,origin_child_source_count=29,current_child_source_count=31,parameter_recipe_sha256=request['parameter_recipe']['sha256'],actual_origin_summary_is_fallback=False,actual_saved_radius_carried=True,parent_model_arrays_reused=False,math_inputs_restored_only_under_RUNNER_TEMP=True,old_publisher_executed=False,raw_output_retention=False)),flush=True)
        PYPINS
    - name: Restore original78 public numerical source files once
      run: |
        PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYSOURCE'
        import os
        from pathlib import Path
        from exact_20261114_public_resume import prepare_public_source
        source=prepare_public_source(Path.cwd(),Path(os.environ['RUNNER_TEMP'])/'nine-control-directional-response-original-source',Path(os.environ['VISIBLE_OUT']))
        with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
        PYSOURCE
    - name: One8-direction batch with complete basis responses, actual actions and normal scalar transport
      id: science
      timeout-minutes: 75
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PYTHONPATH="$VISIBLE_COMPUTATIONS" python -u - <<'PYRUN'
        import hashlib,json,os,sys
        from pathlib import Path
        import root_20261114_current576_rules_runner as runner
        comp=Path(os.environ['VISIBLE_COMPUTATIONS']).resolve();repo=Path(os.environ['GITHUB_WORKSPACE']);out=Path(os.environ['VISIBLE_OUT'])
        request=json.loads((comp/'public-nine-control-directional-response-request.json').read_text())
        inputs=json.loads((out/'original-input-paths.json').read_text())
        if Path(runner.__file__).resolve()!=comp/'root_20261114_current576_rules_runner.py':
         raise ValueError('Use the pinned original metadata runner')
        wanted_source=request['workflow_support_source_sha256']['root_20261114_current576_rules_runner.py']
        if hashlib.sha256(Path(runner.__file__).read_bytes()).hexdigest()!=wanted_source:
         raise ValueError('Original rules runner source changed')
        wanted=request['reviewed_README_blobs']
        if set(wanted)!={'README.md','topics/visible-flex-larger-amplitude/README.md'}:
         raise ValueError('Both explicitly reviewed README identities are required')
        baselines={}
        for name,expected in wanted.items():
         raw=(repo/name).read_bytes()
         blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
         if blob!=expected:raise ValueError('Reviewed README bytes changed: '+name)
         baselines[name]=dict(blob=blob,text=raw.decode('utf-8'))
        old={name:item['blob'] for name,item in runner.BASELINES.items()}
        runner.BASELINES=baselines
        print(json.dumps(dict(event='request142_explicit_rules_baseline_update',unchanged_runner_sha256=wanted_source,old_embedded_blobs=old,reviewed_current_blobs=wanted,period_seconds=runner.PERIOD_SECONDS,original_pull_rebase_diff_and_stop_on_new_rules_retained=True)),flush=True)
        request_path=comp/'public-nine-control-directional-response-request.json'
        request_sha=hashlib.sha256(request_path.read_bytes()).hexdigest()
        argv=[sys.executable,'-u',str(comp/request['execution_entry']),
          '--request',str(request_path),'--request-sha256',request_sha,
          '--repository-directory',str(repo),
          '--original-input-paths',str(out/'original-input-paths.json'),
          '--rules-directory',str(out/'rule-sync'),
          '--out',str(out/request['output_directory'])]
        print(json.dumps(dict(event='request142_nine_control_batch_argv',argv=argv,
          batch_chain=request['batch_chain'],same_nine_control_family_as_actual138=True,
          all_nine_parameter_columns_retained=True,
          actual_initial_parameters=request['diagnostic']['parameters'],
          each_original_batch_resets_radius_point_one=False,
          actual_initial_radius=request['diagnostic']['initial_relative_radius'],
          actual_saved_radius_carried_from_fully_read_status=True,
          actual138_final_parameters_and_radius_are_the_explicit_initial_guess=True,
          initial_point_not_claimed_to_be_nonzero_native_or_BVP_solution=True,
          sole_new_algorithmic_change_is_complete_outer_response_reformation=True,
          all9_basis_responses_and_actual_chosen_direction_complex_action_recomputed=True,
          original_R299_normal_helper_bytes_and_budgets_retained=True,
          normal_trajectory_not_claimed_equal_to_actual138=True,
          pilot_action_direct_action_and_curve_origin_not_relabelled_as_equal=True,
          all_normal_scalar_records_and_selector_samples_logged=True,
          parent_model_J_merit_not_reused=True,
          complete_three_by_nine_response=True,complete_two_normal_seven_tangent_path=True,
          zero_added_quadratic_comparison_is_not_gate=True,
          original_inner_error_flag_not_new_batch_gate=True,
          original_stop_conditions_unchanged=True,
          scientific_source_sha256=request['source_sha256'][request['scientific_entry']],
          wrapper_source_sha256=request['source_sha256'][request['execution_entry']])),flush=True)
        sys.argv=[runner.__file__,'--out',str(out/'rule-sync'),'--command',*argv]
        raise SystemExit(runner.main())
        PYRUN
    - name: Pass the complete planned batch row or honest90KB overflow; full direction and normal records stay in log segments
      id: chain
      if: always()
      run: |
        python "$VISIBLE_COMPUTATIONS/geometry_20261115_nine_control_directional_response_temporary_batch.py" \
          --report-only \
          --out "$VISIBLE_OUT/nine-control-directional-response-temporary-batch" \
          --rules-directory "$VISIBLE_OUT/rule-sync" \
          --compute-outcome "${{ steps.science.outcome }}"
    - name: Remove only this request temporary inputs, source cache and scientific payloads
      if: always()
      run: |
        python - <<'PYCLEAN'
        import json,os,shutil,stat
        from pathlib import Path
        runner=Path(os.environ['RUNNER_TEMP']).resolve();base=Path(os.environ['VISIBLE_OUT'])
        targets=[base/'nine-control-directional-response-temporary-batch',base/'original-inputs',runner/'nine-control-directional-response-original-source']
        removed=[]
        def own_tree_writable(path):
         if path.is_symlink():raise ValueError('Do not follow a cleanup symlink')
         for parent,dirs,files in os.walk(path,topdown=True,followlinks=False):
          p=Path(parent);s=p.lstat()
          if s.st_uid!=os.getuid():raise PermissionError('Cleanup only request-owned trees')
          os.chmod(p,stat.S_IMODE(s.st_mode)|stat.S_IWUSR|stat.S_IXUSR)
          for name in dirs+files:
           child=p/name;s=child.lstat()
           if stat.S_ISLNK(s.st_mode):continue
           if s.st_uid!=os.getuid():raise PermissionError('Cleanup only request-owned entries')
           os.chmod(child,stat.S_IMODE(s.st_mode)|stat.S_IWUSR|(stat.S_IXUSR if stat.S_ISDIR(s.st_mode) else 0))
        for target in targets:
         if target.is_symlink():raise ValueError('Do not follow a cleanup symlink')
         target.resolve().relative_to(runner)
         if target.is_dir():
          own_tree_writable(target);shutil.rmtree(target);removed.append(str(target.relative_to(runner)))
        print(json.dumps(dict(event='request142_temporary_scientific_payloads_removed',relative_directories=removed,compact_chain_index_step_precedes_cleanup=True,readout_success_not_inferred_from_cleanup=True,raw_artifact_or_Release_upload=False)),flush=True)
        PYCLEAN
  report:
    name: Bounded chain index only; all original batch primaries and direction segments remain in compute log
    needs:
    - compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
    - name: Print bounded original chain index and exact output SHA
      env:
        CHAIN_SUMMARY: ${{ needs.compute.outputs.chain_summary }}
        CHAIN_SUMMARY_BYTES: ${{ needs.compute.outputs.chain_summary_bytes }}
        CHAIN_SUMMARY_SHA256: ${{ needs.compute.outputs.chain_summary_sha256 }}
        COMPUTE_RESULT: ${{ needs.compute.result }}
      run: |
        python3 - <<'PYREPORT'
        import hashlib,json,os
        text=os.environ.get('CHAIN_SUMMARY','')
        if not text:
         payload=dict(schema='request142-compute-output-unavailable-v1',compute_job_result=os.environ.get('COMPUTE_RESULT'),run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],scientific_completion_not_claimed=True)
         raw=json.dumps(payload,sort_keys=True,separators=(',',':')).encode()
        else:
         raw=text.encode('utf-8')
         if len(raw)>90000:raise ValueError('Compute job output exceeded the explicit small summary bound')
         if len(raw)!=int(os.environ['CHAIN_SUMMARY_BYTES']) or hashlib.sha256(raw).hexdigest()!=os.environ['CHAIN_SUMMARY_SHA256']:
          raise ValueError('The original compute-to-report JSON output identity changed')
         json.loads(raw)
        print('BEGIN_VISIBLE142_CHAIN_SUMMARY')
        print(raw.decode('utf-8'))
        print('END_VISIBLE142_CHAIN_SUMMARY')
        print(json.dumps(dict(event='visible142-chain-summary-sha256',bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),hash_scope='UTF-8 JSON string excluding log separator LF',compute_job_result=os.environ.get('COMPUTE_RESULT'),run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'])),flush=True)
        PYREPORT
