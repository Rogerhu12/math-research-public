name: visible-flex joint geometric budget and exact block Jacobian
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-inverse-joint-budget-20261126.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-inverse-joint-budget-20261126
  cancel-in-progress: false
jobs:
  research:
    name: joint budget ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [rounded-core-B030, rounded-core-B038]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-inverse-joint-budget-20261126.yml
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-inverse-joint-budget-20261126.json
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_flat_oscillatory_tail_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_hard_exchange_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_hard_exchange_resume_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_r566_block_jacobian_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_joint_budget_20261126.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull current rules and adopt the identified q under a joint budget
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-inverse-joint-budget-20261126.json
          --lane ${{ matrix.lane }}
      # The identified prior state is retained as source evidence. R, Y and
      # tau change together; the old run's qualification does not change.
      # Full new-budget reconstruction and block-AD work count as new science.
      # Actual dual-repository pulls, a 2400-second scientific checkpoint,
      # and original stdout only: no artifacts, Git writes or cross-run cache.
