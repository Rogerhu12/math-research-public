name: ISP six independent weights full S2 matrix half
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isp-six-site-full-s2-matrix-half-8542
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ISP_PIN: ${{ github.sha }}
      ISP_FILE: 2026-11-28-six-bit-s2-matrix-half-characteristic-8542.py
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FLINT_NUM_THREADS: '1'
    steps:
      - name: Prepare exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Pinned FLINT arithmetic
        run: python -m pip install --quiet python-flint==0.9.0
      - name: New exact original input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-equal-six-cofactors"
          cd "$RUNNER_TEMP/isp-equal-six-cofactors"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          timeout 120s git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          ISP_SOURCE_PATH="topics/invariant-subspace-problem/notes/$ISP_FILE"
          ISP_BLOB="$(git rev-parse "$ISP_PIN:$ISP_SOURCE_PATH")"
          git show "$ISP_PIN:$ISP_SOURCE_PATH" > "$RUNNER_TEMP/isp-equal-six-source.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-focused-exact-actions-source-args-driver-8542.py" > "$RUNNER_TEMP/isp-equal-six-driver.py"
          python -u "$RUNNER_TEMP/isp-equal-six-driver.py" --checkout "$PWD" --source "$RUNNER_TEMP/isp-equal-six-source.py" --expected-blob "$ISP_BLOB" --seconds 195 --source-arg=--full-orbits

      - name: Retain the newly computed complete coefficient input
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os,json,hashlib,zlib,base64
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"isp-equal-six-source.json"
          if p.exists():
              obj=json.loads(p.read_text())
              raw=json.dumps(obj,separators=(",",":")).encode()
              encoded=base64.b64encode(zlib.compress(raw,9)).decode()
              chunks=[encoded[i:i+75000] for i in range(0,len(encoded),75000)]
              print("ISP_SIX_MATRIX_HALF_EXACT_OUTPUT "+json.dumps({"schema":"isp-six-matrix-half-exact-output-chunks-v1","status":obj.get("status"),"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),"encoding":"base64+zlib+json","chunks":len(chunks),"base64Characters":len(encoded)}),flush=True)
              for i,chunk in enumerate(chunks):
                  print("ISP_SIX_MATRIX_HALF_EXACT_OUTPUT_CHUNK "+json.dumps({"index":i,"total":len(chunks),"data":chunk}),flush=True)
          else:
              print("ISP_SIX_MATRIX_HALF_EXACT_OUTPUT "+json.dumps({"schema":"isp-first-six-matrix-half-exact-output-v1","fileProduced":False}),flush=True)
          PY
