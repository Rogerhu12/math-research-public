name: Serre p41 exact short K basis and Hodge coordinates

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R777-public-exact-short-K-basis-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R777-exact-short-K-basis
  cancel-in-progress: false

jobs:
  exact_short_series:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-exact-short-K-basis.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R777_exact_short_K_basis.py
            /topics/serre-uniformity/scripts/R777_public_exact_short_K_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R777-public-exact-short-K-basis-request.json
            /topics/serre-uniformity/notes/R777-exact-short-K-basis-and-Hodge-coordinates-method.md
            /topics/serre-uniformity/results/R772-original-RR-descent-and-exact-function-recovery-certificates.md
            /topics/serre-uniformity/results/R778-original-cusp-orbit-and-short-exact-recovery.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compute original exact short series and Hodge coordinates
        continue-on-error: true
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R777_public_exact_short_K_basis.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R777-exact-short-K-basis-and-Hodge-cube-coordinates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R777-exact-short-K-basis-and-Hodge-cube-coordinates/output
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve exact states and publish small complete or failed receipts
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R777_public_exact_short_K_basis.py publish
      - name: Require exact original series and rational coordinate certificate
        if: always()
        run: python topics/serre-uniformity/scripts/R777_public_exact_short_K_basis.py verify
