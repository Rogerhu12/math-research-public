name: ISP small original geometries and exact rational projections
on:
  push:
    branches: [main]
    paths:
      - 'topics/invariant-subspace-problem/notes/2026-11-26-unit211-L0-general-QQ-factor-atlas-347c.py'
      - 'topics/invariant-subspace-problem/notes/2026-11-26-unit211-S0-Lt0-original-parameter-projection-347c.py'
      - 'topics/invariant-subspace-problem/notes/2026-11-26-unit211-S0-lazy-original-Chow-projections-347c.py'
      - 'topics/invariant-subspace-problem/notes/2026-11-26-reduced-H3-zero-edge-infinity-original-QQ-347c.py'
      - '.github/workflows/invariant-subspace-small-original-geometries-347c.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isp-small-original-geometries-347c
  cancel-in-progress: false
jobs:
  exact:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: unit211-L0-original-QQ-factor-atlas
            file: 2026-11-26-unit211-L0-general-QQ-factor-atlas-347c.py
            condition: 'project'
            seconds: 660
            minutes: 15
          - label: unit211-S0-Lt0-original-parameter-factors
            file: 2026-11-26-unit211-S0-Lt0-original-parameter-projection-347c.py
            condition: 'project'
            seconds: 360
            minutes: 10
          - label: unit211-S0-lazy-original-Chow-projections
            file: 2026-11-26-unit211-S0-lazy-original-Chow-projections-347c.py
            condition: 'project'
            seconds: 660
            minutes: 15
          - label: reduced-H3-zero-edge-infinity-original-QQ
            file: 2026-11-26-reduced-H3-zero-edge-infinity-original-QQ-347c.py
            condition: 'project'
            seconds: 360
            minutes: 10
    env:
      ISP_PIN: ${{ github.sha }}
      ISP_FILE: ${{ matrix.file }}
      ISP_U_CONDITION: ${{ matrix.condition }}
      ISP_S0_STAGE: ${{ matrix.condition }}
      ISP_SECONDS: ${{ matrix.seconds }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FLINT_NUM_THREADS: '1'
    steps:
      - name: Select exact arithmetic Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Partial checkout and frozen original equations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-small-exact"
          cd "$RUNNER_TEMP/isp-small-exact"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          timeout 120s git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          ISP_SOURCE_PATH="topics/invariant-subspace-problem/notes/$ISP_FILE"
          ISP_BLOB="$(git rev-parse "$ISP_PIN:$ISP_SOURCE_PATH")"
          git show "$ISP_PIN:$ISP_SOURCE_PATH" > "$RUNNER_TEMP/isp-small-source.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-26-small-exact-actions-driver-347c.py" > "$RUNNER_TEMP/isp-small-driver.py"
          python -m pip install --quiet python-flint==0.9.0 sympy==1.14.0
          python -u "$RUNNER_TEMP/isp-small-driver.py" --checkout "$PWD" --source "$RUNNER_TEMP/isp-small-source.py" --expected-blob "$ISP_BLOB" --seconds "$ISP_SECONDS"
