name: visible-exact positive high weighted body cut ports

on:
  workflow_run:
    workflows: ['visible-exact M32 body cross weighted Green']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_positive_high_weighted_body_cut_ports.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_positive_high_weighted_body_cut_ports_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-14-R133-positive-high-weighted-body-cut-CI-inputs.json'
      - '.github/workflows/visible-exact-positive-high-weighted-body-cut.yml'
  workflow_dispatch:
    inputs:
      cross_run:
        description: 'A verified successful original fixed-M32 body-cross run'
        required: true
        default: '43637596465'

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-positive-high-weighted-body-cut
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PORT_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-positive-high-weighted-body-cut-CI-inputs.json
  PORT_MANIFEST_SHA: c15abff3016946b717f1d9479290fd89b9ce81fb6d707d74f41ff3e9f3cf4066
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  eligible:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.choose.outputs.ready }}
      cross_run: ${{ steps.choose.outputs.cross_run }}
      cross_attempt: ${{ steps.choose.outputs.cross_attempt }}
    steps:
      - name: Verify the actual original body-cross run before selecting it
        id: choose
        uses: actions/github-script@v7
        with:
          script: |
            const eventRun = context.payload.workflow_run;
            const requested = context.eventName === 'workflow_run'
              ? eventRun.id
              : Number(context.payload.inputs?.cross_run || '43637596465');
            if (!Number.isSafeInteger(requested) || requested <= 0) {
              throw new Error('An exact positive public run identifier is required.');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: 'Rogerhu12', repo: 'math-research-public', run_id: requested
            });
            if (run.repository?.full_name !== 'Rogerhu12/math-research-public'
                || run.head_repository?.full_name !== 'Rogerhu12/math-research-public'
                || run.name !== 'visible-exact M32 body cross weighted Green') {
              throw new Error('The selected run is not the fixed-M32 body-cross workflow.');
            }
            const ready = run.status === 'completed' && run.conclusion === 'success';
            core.setOutput('ready', ready ? 'true' : 'false');
            core.setOutput('cross_run', String(run.id));
            core.setOutput('cross_attempt', String(run.run_attempt));
            core.info(JSON.stringify({run: run.id, attempt: run.run_attempt,
              status: run.status, conclusion: run.conclusion, actual_science_eligible: ready}));

  consume:
    needs: eligible
    if: needs.eligible.outputs.ready == 'true'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 60
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-positive-high-weighted-body-cut-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate all193 pins preserving original175 and87 closures
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$PORT_MANIFEST" --manifest-sha "$PORT_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/positive_high_weighted_body_cut_ci/
      - name: Parse the two new sources before any mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_positive_high_weighted_body_cut_ports.py','fourfold_codazzi_positive_high_weighted_body_cut_ports_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('New source and worker parsed; original target and Riccati rows remain read-only.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible artifact paths
        id: paths
        run: |
          printf 'body=%s\n' "$RUNNER_TEMP/visible-exact-positive-weighted-body" >> "$GITHUB_OUTPUT"
          printf 'cross=%s\n' "$RUNNER_TEMP/visible-exact-positive-weighted-cross" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-positive-weighted-output" >> "$GITHUB_OUTPUT"
      - name: Receive the exact original4650 positive scalar rows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43601149891
          name: visible-exact-repaired-positive-high-43601149891-1
          path: ${{ steps.paths.outputs.body }}
      - name: Receive the already completed fixed-M32 cross rows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: ${{ needs.eligible.outputs.cross_run }}
          name: visible-exact-M32-body-cross-weighted-Green-${{ needs.eligible.outputs.cross_run }}-${{ needs.eligible.outputs.cross_attempt }}
          path: ${{ steps.paths.outputs.cross }}
      - name: Consume new weighted head sources and the true cut trace
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_CROSS_RUN: ${{ needs.eligible.outputs.cross_run }}
          ORIGINAL_CROSS_ATTEMPT: ${{ needs.eligible.outputs.cross_attempt }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_positive_high_weighted_body_cut_ports_CI.py
          --manifest "$PORT_MANIFEST" --manifest-sha "$PORT_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --body-artifact "$RUNNER_TEMP/visible-exact-positive-weighted-body"
          --cross-artifact "$RUNNER_TEMP/visible-exact-positive-weighted-cross"
          --cross-run "$ORIGINAL_CROSS_RUN" --cross-attempt "$ORIGINAL_CROSS_ATTEMPT"
          --work "$RUNNER_TEMP/visible-exact-positive-weighted-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-positive-weighted-output"
          --compute-minutes 40 --checkpoint-minutes 10
      - name: Require nonempty actual evidence and bounded inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process evidence exists')
          rows=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          data=(json.dumps(rows,indent=2)+'\n').encode()
          if len(data)>60000:raise RuntimeError('inventory exceeds60000 bytes; retain all original evidence')
          (root/'artifact-inventory.json').write_bytes(data)
          print(dict(actual_files=len(files),actual_inventory_bytes=len(data)))
          PY_INVENTORY
      - name: Preserve every actual new prefix and all original receipt bytes
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-positive-high-weighted-body-cut-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
