name: Serre p41 original normal derivative inputs

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R825-public-original-normal-derivative-inputs-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R825-original-normal-derivative-inputs
  cancel-in-progress: false

jobs:
  original_normal_derivative_inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-normal-derivative-inputs.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R825_original_normal_derivative_inputs.py
            /topics/serre-uniformity/scripts/R825_public_original_normal_derivative_inputs.py
            /topics/serre-uniformity/scripts/R811_original_regular_multipliers.py
            /topics/serre-uniformity/scripts/R815_public_original_normal_derivation_operators.py
            /topics/serre-uniformity/notes/R825-public-original-normal-derivative-inputs-request.json
            /topics/serre-uniformity/notes/R825-original-normal-derivative-source-adapter-method.md
            /topics/serre-uniformity/results/R825-original-logarithmic-ratio-and-multiplicity-preimages.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source syntax without executing mathematics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("R825_original_normal_derivative_inputs.py", "R825_public_original_normal_derivative_inputs.py", "R811_original_regular_multipliers.py", "R815_public_original_normal_derivation_operators.py"):
              path = Path("topics/serre-uniformity/scripts") / name
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compute original normal derivative and cusp-coordinate inputs
        continue-on-error: true
        timeout-minutes: 330
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R825_public_original_normal_derivative_inputs.py compute
      - name: Transfer the active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R825-original-normal-derivative-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R825-original-normal-derivative-inputs/output
          retention-days: 1
          if-no-files-found: warn
      - name: Require both original derivative inputs and exact two-chart transports
        if: always()
        run: python topics/serre-uniformity/scripts/R825_public_original_normal_derivative_inputs.py verify
