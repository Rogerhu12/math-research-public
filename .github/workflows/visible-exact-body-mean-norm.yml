name: visible-exact complete mean norm into actual phase direction

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-body-mean-norm.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-body-mean-norm
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  NORM_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-body-mean-norm-CI-pinned-inputs-v2.json
  NORM_MANIFEST_SHA: 59a666811e0ac769454a663ef00b3936ce740d34226e0736a1e158c48ed4548d
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  complete-body-mean-norm:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 40
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the complete mean norm consumer and pinned inputs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-body-mean-norm-CI-pinned-inputs-v2.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Fetch only the exact eight source and direction inputs
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$NORM_MANIFEST" --manifest-sha "$NORM_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/body_mean_norm_ci/
      - name: Install the original arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible completed body artifact paths
        id: paths
        run: |
          printf 'prior=%s\n' "$RUNNER_TEMP/visible-exact-original-body-mean" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-body-mean-norm" >> "$GITHUB_OUTPUT"
      - name: Receive the successful complete body and both scalar mean-error flows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43586413510
          name: visible-exact-body-complete-mean-43586413510-1
          path: ${{ steps.paths.outputs.prior }}
      - name: Consume every mean-error interval and preserve the true response error budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_body_mean_norms_CI_worker_v2.py
          --manifest "$NORM_MANIFEST" --manifest-sha "$NORM_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --prior-artifact "$RUNNER_TEMP/visible-exact-original-body-mean"
          --work "$RUNNER_TEMP/visible-exact-body-mean-norm-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-body-mean-norm"
          --compute-minutes 25 --checkpoint-minutes 10
      - name: Preserve every actual complete or failed native and process
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-body-mean-norm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
