name: visible-exact exact root-value-subtracted first Airy sources

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-root-subtracted-first-Airy-sources.yml']
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Optional exact root-subtracted run whose completed norm, seam and cell prefixes will be reused'
        required: false
        type: string
        default: ''
      resume_attempt:
        description: 'Original attempt for the optional exact prefix artifact'
        required: false
        type: string
        default: '1'

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-root-subtracted-first-Airy-sources
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-root-subtracted-first-Airy-sources-CI-inputs.json
  PHASE_MANIFEST_SHA: 5158bc631e1cbf3eddea6b6ad1a2e28ac2e782eea1f94da5970f1ac7c3e1c426
  PHASE_PIPELINE_SHA: fb0d109fa897567682773adbe9206e664a04fd1a380188ed801fb89966617cea
  PHASE_WORKER_SHA: 0748f1c7aecdd916be3397141fb5e298e7c172767651b4dff333fa9e014c7775
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-root-subtracted-first-Airy-sources:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_root_subtracted_first_Airy_sources_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-root-subtracted-first-Airy-sources-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Verify the separately pinned publication worker
        run: |
          python - <<'PY_WORKER'
          import hashlib,os,pathlib
          path=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_root_subtracted_first_Airy_sources_public_worker.py')
          assert hashlib.sha256(path.read_bytes()).hexdigest()==os.environ['PHASE_WORKER_SHA'], 'publication worker changed'
          PY_WORKER
      - name: Hydrate25 exact successful inputs and the full root-subtraction source closure
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_root_subtracted_first_Airy_sources_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the complete pinned Python source closure without running mathematics
        run: |
          python - <<'PY_SOURCE'
          import ast,json,os,pathlib
          manifest=json.loads(pathlib.Path(os.environ['PHASE_MANIFEST']).read_text())
          for entry in manifest['files']:
              path=pathlib.Path(entry['path'])
              if path.suffix=='.py':
                  ast.parse(path.read_text(),filename=str(path))
          PY_SOURCE
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5 scipy==1.17.0
      - name: Set the actual result path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-root-subtracted-first-Airy-sources-output" >> "$GITHUB_OUTPUT"
      - name: Prepare a separate optional prefix directory
        run: mkdir -p "$RUNNER_TEMP/visible-exact-root-subtracted-first-Airy-sources-prepared"
      - name: Restore the exact original complete larger root native
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-piecewise-real-root-fold-resume-v2-43616813816-1
          run-id: 43616813816
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-root-subtracted-first-Airy-sources-prepared/root
      - name: Restore the exact original normalized forcing stages without finite recomputation
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-old-rho-first-Airy-Taylor-43653825736-1
          run-id: 43653825736
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-root-subtracted-first-Airy-sources-prepared/Taylor
      - name: Restore an explicitly selected exact root-subtracted prefix
        if: ${{ inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-root-subtracted-first-Airy-sources-${{ inputs.resume_run }}-${{ inputs.resume_attempt }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-root-subtracted-first-Airy-sources-prepared/resume
      - name: Reuse all original Taylor and derivative stages and compute exact root-subtracted scalar bounds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_root_subtracted_first_Airy_sources_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-root-subtracted-first-Airy-sources-science"
          --prepared "$RUNNER_TEMP/visible-exact-root-subtracted-first-Airy-sources-prepared"
          --out-dir "$RUNNER_TEMP/visible-exact-root-subtracted-first-Airy-sources-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-root-subtracted-first-Airy-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
