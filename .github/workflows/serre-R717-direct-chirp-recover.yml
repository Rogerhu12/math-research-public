name: Serre R717 direct chirp recovery

on:
  push:
    branches: [main]
    paths:
      - 'topics/serre-uniformity/notes/R717-direct-chirp-recover-request.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R717-direct-chirp-recovery-p137147
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout reviewed public source and retained receipts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            README.md
            .github/workflows/serre-R717-direct-chirp-recover.yml
            topics/serre-uniformity/README.md
            topics/serre-uniformity/scripts
            topics/serre-uniformity/notes/R717-direct-chirp-recover-request.json
            topics/serre-uniformity/notes/R717-p137147-fixed-bin-compatibility.json
            topics/serre-uniformity/computations/R717-trace-diagnostics-p137147
            topics/serre-uniformity/computations/R717-original-CM-norm-p137147-direct-chirps
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned interval arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Recover from fixed completed bins with independent phases
        id: recovery
        continue-on-error: true
        timeout-minutes: 320
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R717_public_direct_chirp_recover.py run
      - name: Preserve all recovery outputs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-cartier-R717-original-CM-norm-p137147-direct-chirps-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R717-direct-chirp-recover-output
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded certificates and complete artifact manifest
        if: always()
        env:
          SERRE_ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python topics/serre-uniformity/scripts/R717_public_direct_chirp_recover.py publish
      - name: Verify the original norm certificate
        if: always()
        run: python topics/serre-uniformity/scripts/R717_public_direct_chirp_recover.py verify
