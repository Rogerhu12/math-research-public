name: visible-exact principal inverse adjoint bootstrap

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-principal-inverse-adjoint-bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-principal-inverse-adjoint-bootstrap
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-principal-inverse-adjoint-bootstrap-CI-inputs.json
  PHASE_MANIFEST_SHA: 7afa0cdafab54202a6a4abe32f80a1e4ae2689b862bbad44ce652fe2d329048e
  PHASE_PIPELINE_SHA: 14c1cf4a9047895cefec650378d1462ee8d86f4c074e9ea076efe2c1a9276a53
  PHASE_WORKER_SHA: 43c33554b60ccdb597312d4055ee10e606612b890478b0adb1da264f0c01d665
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  principal-inverse-adjoint-bootstrap:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_principal_inverse_adjoint_bootstrap_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-principal-inverse-adjoint-bootstrap-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_principal_inverse_adjoint_bootstrap_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_principal_inverse_adjoint_bootstrap_public_worker.py --mode hydrate
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new source before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_principal_inverse_adjoint_bootstrap.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the pinned scalar runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Check the full immutable AST closure and evaluate the complete principal inverse adjoint bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_principal_inverse_adjoint_bootstrap_public_worker.py --mode run
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-principal-inverse-adjoint-bootstrap-science"
          --out-dir "$RUNNER_TEMP/visible-principal-inverse-adjoint-bootstrap-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
