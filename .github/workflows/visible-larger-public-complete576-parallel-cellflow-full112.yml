name: visible-larger complete576 parallel current cellflow with original full112 gates
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
    - topics/visible-flex-larger-amplitude/computations/public-complete576-parallel-cellflow-full112-request.json
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: visible-larger-public-complete576-parallel-cellflow-full112
  cancel-in-progress: false
jobs:
  compute:
    name: Two actual workers for complete current576 tangent flows with original full112 gates
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    outputs:
      scalar_summary: ${{ steps.scalar.outputs.scalar_summary }}
      scalar_summary_bytes: ${{ steps.scalar.outputs.scalar_summary_bytes }}
      scalar_summary_sha256: ${{ steps.scalar.outputs.scalar_summary_sha256 }}
      scalar_readback_outcome: ${{ steps.scalar.outcome }}
      parallel_outer_request_sha256: ${{ steps.parallel_source_views.outputs.outer_request_sha256 }}
      parallel_source_generation_outcome: ${{ steps.parallel_source_views.outcome }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VISIBLE_R531_ACTUAL_REQUEST: '227'
      VISIBLE_R531_CELLFLOW_WORKERS: '2'
      VISIBLE_R531_CELLFLOW_WORKER_HEAP_MB: '3072'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        filter: blob:none
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /README.md
          /.github/workflows/visible-larger-public-six-control-input-support-contracted-trace-r273.yml
          /.github/workflows/visible-larger-public-complete576-parallel-cellflow-full112.yml
          /topics/visible-flex-larger-amplitude/results/R531-complete-current576-parallel-cellflow-source-and-conditional-equivalence.md
          /topics/visible-flex-larger-amplitude/notes/2026-11-16-complete576-parallel-cellflow-source-interface.md
          /topics/visible-flex-larger-amplitude/results/R411-original64-finite-root-trace-matched-variation-and-full-return.md
          /topics/visible-flex-larger-amplitude/results/R465-recorded-factor-backsolve-defect-and-complete-column-contraction.md
          /topics/visible-flex-larger-amplitude/results/R471-zero-nonlinear-split-flux-finite-trace-fast-path.md
          /topics/visible-flex-larger-amplitude/results/R474-finite-input-zero-coefficient-linear-implementation.md
          /topics/visible-flex-larger-amplitude/results/R523-actual-tangent-row-support-and-complete-linear-products.md
          /topics/visible-flex-larger-amplitude/results/R473-zero-coefficient-elision-in-complete-finite-trace-linear-products.md
          /topics/visible-flex-larger-amplitude/*.md
          /topics/visible-flex-larger-amplitude/computations/
    - name: Establish one fresh actual227 namespace using the immutable224 child directory
      run: |
        git config gc.auto 0
        git config gc.autoPackLimit 0
        git config maintenance.auto false
        git config --global merge.stat false
        mkdir -p "$RUNNER_TEMP/visible-original64-input-support-contracted-trace224"
        echo "VISIBLE_BASE=$RUNNER_TEMP/visible-original64-input-support-contracted-trace224" >> "$GITHUB_ENV"
        echo "VISIBLE_PUBLIC_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
        echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.14
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Install original complete field and full current R273 runtime
      run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
    - name: Recreate all original224 source words in this actual227 job without importing science
      id: source_views
      run: |
        python - <<'PYVIEWS'
        import hashlib,json,os,subprocess,sys
        from pathlib import Path
        public=Path(os.environ['VISIBLE_PUBLIC_COMPUTATIONS']).resolve()
        request_file=public/'public-six-control-input-support-contracted-trace-r273-request.json';raw=request_file.read_bytes();request=json.loads(raw)
        assert len(raw)==88551 and hashlib.sha256(raw).hexdigest()=='6aa2f23f2e92f326ea2bf17b58f084c28580f5a44420c8cf47816597e9e5b980'
        assert request['schema']=='public-six-control-input-support-contracted-trace-r273-request-v1' and request['request_number']==224
        descriptor=request['source_views']['generator'];generator=public/Path(descriptor['file']).name
        code=generator.read_bytes()
        assert len(code)==descriptor['bytes'] and hashlib.sha256(code).hexdigest()==descriptor['sha256']
        assert request['published_source_sha256'][generator.name]==descriptor['sha256']
        subprocess.run([sys.executable,str(generator),'--request',str(request_file),
          '--expected-request-sha256','6aa2f23f2e92f326ea2bf17b58f084c28580f5a44420c8cf47816597e9e5b980','--public-computations',str(public),
          '--out',str(Path(os.environ['VISIBLE_BASE'])/'runtime-source-views/computations')],check=True)
        PYVIEWS
    - name: Bind actual227 and generate all eight R531 source views in the real computations directory
      id: parallel_source_views
      run: |
        PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYPARALLELVIEWS'
        import hashlib,json,os,subprocess,sys
        from pathlib import Path
        repo=Path(os.environ['GITHUB_WORKSPACE']).resolve()
        public=Path(os.environ['VISIBLE_PUBLIC_COMPUTATIONS']).resolve()
        comp=Path(os.environ['VISIBLE_COMPUTATIONS']).resolve()
        file=repo/'topics/visible-flex-larger-amplitude/computations/public-complete576-parallel-cellflow-full112-request.json';raw=file.read_bytes();outer=json.loads(raw)
        assert len(raw)==19994 and hashlib.sha256(raw).hexdigest()=='56c985a5513e9c403fb9a31f03e1a5982267684293e4b925c181d1f8d5246504'
        assert outer['schema']=='public-complete576-parallel-cellflow-full112-request-v1'
        assert outer['request_number']==227 and outer['repository']=='Rogerhu12/math-research-public'
        assert outer['lanes']==['parallelComplete576Original112']
        assert os.environ['VISIBLE_R531_ACTUAL_REQUEST']=='227'
        assert int(os.environ['VISIBLE_R531_CELLFLOW_WORKERS'])==outer['parallel_execution']['worker_count']==2
        assert int(os.environ['VISIBLE_R531_CELLFLOW_WORKER_HEAP_MB'])==outer['parallel_execution']['worker_heap_MiB']==3072
        child=outer['original224']['request'];child_raw=(repo/child['file']).read_bytes()
        assert len(child_raw)==child['bytes'] and hashlib.sha256(child_raw).hexdigest()==child['sha256']
        child_request=json.loads(child_raw)
        assert (comp/Path(child['file']).name).read_bytes()==child_raw
        assert outer['execution']==child_request['execution'] and outer['retention']==child_request['retention']
        assert outer['original224']['parameter_recipe']==child_request['parameter_recipe']
        assert outer['reviewed_README_blobs']==child_request['reviewed_README_blobs']
        sources=outer['r531']
        for role in ('plan','proof','interface'):
          row=sources[role];data=(repo/row['file']).read_bytes()
          assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
        plan_file=repo/sources['plan']['file'];plan=json.loads(plan_file.read_bytes())
        assert plan['schema']==sources['schema'] and plan['actual_source_union']==sources['actual_source_union']
        assert plan['original224']['request']==dict(file=Path(child['file']).name,bytes=child['bytes'],sha256=child['sha256'])
        assert {v['file']:dict(bytes=v['bytes'],sha256=v['sha256']) for v in plan['required_public_helpers']}==sources['required_public_helpers']
        assert {v['output']['file']:dict(bytes=v['output']['bytes'],sha256=v['output']['sha256']) for v in plan['views']}==sources['generated_sources']
        for name,row in sources['required_public_helpers'].items():
          assert Path(name).name==name and name.endswith(('.py','.mjs'))
          data=(public/name).read_bytes()
          assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
          destination=comp/name
          if destination.exists():assert destination.read_bytes()==data
          else:destination.write_bytes(data)
        descriptor=sources['generator'];generator=comp/Path(descriptor['file']).name
        assert sources['required_public_helpers'][generator.name]==dict(bytes=descriptor['bytes'],sha256=descriptor['sha256'])
        directory=Path(os.environ['VISIBLE_BASE'])/sources['receipt_relative_directory']
        subprocess.run([sys.executable,str(generator),'--computations',str(comp),
          '--plan',str(plan_file),'--plan-sha256',sources['plan']['sha256'],'--out',str(directory)],check=True)
        receipt_file=directory/'source-views.json';receipt_raw=receipt_file.read_bytes();receipt=json.loads(receipt_raw)
        assert receipt['schema']==sources['receipt_schema']
        record=dict(schema='R538-actual227-immutable224-and-R531-entry-source-binding-v1',
          run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],actual_request=227,
          actual_request_file=str(file),actual_request_bytes=len(raw),actual_request_sha256=hashlib.sha256(raw).hexdigest(),
          immutable_child_request=child,actual_R531_plan=sources['plan'],
          actual_source_receipt=dict(file=str(receipt_file),bytes=len(receipt_raw),sha256=hashlib.sha256(receipt_raw).hexdigest()),
          actual_computations=str(comp),parallel_execution=outer['parallel_execution'],
          actual_source_union=sources['actual_source_union'],scientific_execution_not_started=True)
        data=(json.dumps(record,sort_keys=True,separators=(',',':'))+'\n').encode()
        (directory/'entry-binding.json').write_bytes(data)
        print(data.decode(),end='',flush=True)
        with open(os.environ['GITHUB_ENV'],'a') as output:
          output.write('VISIBLE_R538_REQUEST='+str(file)+'\n')
          output.write('VISIBLE_R538_REQUEST_SHA256='+hashlib.sha256(raw).hexdigest()+'\n')
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:
          output.write('outer_request_sha256='+hashlib.sha256(raw).hexdigest()+'\n')
        PYPARALLELVIEWS
    - name: Bind all original policy words and the actual193 source union
      run: |
        PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYPINS'
        import ast,hashlib,json,os,re,subprocess
        from pathlib import Path,PurePosixPath
        repo=Path(os.environ['GITHUB_WORKSPACE']);comp=Path(os.environ['VISIBLE_COMPUTATIONS'])
        raw=(comp/'public-six-control-input-support-contracted-trace-r273-request.json').read_bytes();request=json.loads(raw)
        assert len(raw)==88551 and hashlib.sha256(raw).hexdigest()=='6aa2f23f2e92f326ea2bf17b58f084c28580f5a44420c8cf47816597e9e5b980'
        assert request['schema']=='public-six-control-input-support-contracted-trace-r273-request-v1'
        assert request['request_number']==224 and request['lanes']==['inputSupportContractedTraceR273']
        assert request['repository']=='Rogerhu12/math-research-public'
        assert request['scientific_entry']=='geometry_20261116_six_control_input_support_contracted_trace_r273_full112.py'
        assert request['source_sha256'][request['scientific_entry']]=='0a1a7cca83bdd0b3738df6e92f2534a280cd00b1a17e218b75256dd6283e342d'
        assert request['native_client']=='geometry_20261116_input_support_contracted_trace_r273_tail_client.py'
        assert request['source_sha256'][request['native_client']]=='aa9139a85d3debf268568167249c23af0f12a31b4ad7352da7e8e80a64f26fe1'
        verified=[]
        for name,expected in request['source_sha256'].items():
          assert PurePosixPath(name).name==name and re.fullmatch(r'[0-9a-f]{64}',expected)
          data=(comp/name).read_bytes();assert hashlib.sha256(data).hexdigest()==expected,name
          if name.endswith('.py'):compile(ast.parse(data,filename=name),name,'exec')
          verified.append([name,len(data),expected])
        outer_file=Path(os.environ['VISIBLE_R538_REQUEST']);outer_raw=outer_file.read_bytes();outer=json.loads(outer_raw)
        assert len(outer_raw)==19994 and hashlib.sha256(outer_raw).hexdigest()=='56c985a5513e9c403fb9a31f03e1a5982267684293e4b925c181d1f8d5246504'
        assert hashlib.sha256(outer_raw).hexdigest()==os.environ['VISIBLE_R538_REQUEST_SHA256']
        assert outer['request_number']==227 and outer['execution']==request['execution']
        assert outer['original224']['request']['sha256']==hashlib.sha256(raw).hexdigest()
        from root_20261116_parallel_cellflow_source_views import bind_prepared_views
        new_binding=bind_prepared_views(comp,outer['r531']['plan']['sha256'],
          Path(os.environ['VISIBLE_R531_SOURCE_VIEW_RECEIPT']))
        new_sources={**outer['r531']['required_public_helpers'],**outer['r531']['generated_sources']}
        assert len(new_sources)==12 and not (set(new_sources)&set(request['source_sha256']))
        new_verified=[]
        for name,row in new_sources.items():
          assert Path(name).name==name and name.endswith(('.py','.mjs'))
          data=(comp/name).read_bytes()
          assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
          if name.endswith('.py'):compile(ast.parse(data,filename=name),name,'exec')
          new_verified.append([name,len(data),row['sha256']])
        assert len(verified)+len(new_verified)==193
        assert (outer['parallel_execution']['worker_count'],outer['parallel_execution']['worker_heap_MiB'])==(2,3072)
        for role in ('runner','full112','client','reader'):
          row=outer['actual_entry'][role]
          assert new_sources[row['file']]==dict(bytes=row['bytes'],sha256=row['sha256'])
        print(json.dumps(dict(event='request227_actual_parallel_source_identity',run_id=os.environ['GITHUB_RUN_ID'],
          source_commit=os.environ['GITHUB_SHA'],actual_outer_request_sha256=hashlib.sha256(outer_raw).hexdigest(),
          immutable_child_request_sha256=hashlib.sha256(raw).hexdigest(),
          original_source_count=len(verified),additional_actual_source_count=len(new_verified),
          actual_source_count=193,new_source_rows=new_verified,actual_parallel_source_binding=new_binding,
          no_new_scientific_gate=True)),flush=True)
        for name,expected in request['reviewed_README_blobs'].items():
          assert subprocess.check_output(['git','hash-object',name],text=True).strip()==expected
        handoff=(repo/'topics/visible-flex-larger-amplitude/HANDOFF.md').read_bytes()
        assert len(handoff)<=10000 and sum(x.startswith('规则同步记录：'.encode()) for x in handoff.splitlines())==1
        item=request['parameter_recipe'];path=repo/item['file'];recipe_raw=path.read_bytes();recipe=json.loads(recipe_raw)
        assert len(recipe_raw)==item['bytes'] and hashlib.sha256(recipe_raw).hexdigest()==item['sha256']
        assert recipe['schema']=='explicit-six-control-input-support-contracted-trace-r273-height-path-nonzero112-recipe-v1'
        assert recipe['lambda_target']==0.001 and recipe['initial_guess_kind']=='fresh-circle-low-three-linear'
        assert recipe['parameter_order']==['p1','p2','p3','theta1','theta2','theta3']
        assert recipe['active_parameter_indices']==[0,1,2] and recipe['frozen_parameter_indices']==[3,4,5]
        assert len(recipe['initial_six_parameters'])==6 and recipe['origin']==item['origin']
        assert recipe['source_input_sha256']=={k:v['sha256'] for k,v in request['inputs'].items()}
        assert (recipe['field_modes'],recipe['field_angular_quadrature'])==(112,2048)
        assert recipe['height_continuation']==request['height_continuation']
        policy=recipe['height_continuation']
        assert policy['schema']=='explicit-input-support-contracted-trace-r273-complete112-height-path-policy-v1'
        assert (policy['initial_positive_increment'],policy['accepted_increment_multiplier'],policy['maximum_increment'])==(1/64,2,1/4)
        assert policy['stop_after_first_positive_original_mathematical_refusal']
        assert policy['no_repeated_height_halving_after_refusal'] and policy['maximum_bootstrap_requests']==64
        assert policy['includes_zero_and_final_J_requests'] and policy['endpoint_request_jacobian']
        assert not policy['zero_request_jacobian'] and not policy['intermediate_request_jacobian'] and not policy['bootstrap_audit']
        assert policy['endpoint_uses_original_H_star_words'] and policy['total_scientific_wall_clock_seconds']==18000
        assert policy['resource_limits_are_not_mathematical_nonexistence_claims']
        assert len(request['source_sha256'])==181
        assert request['source_roles']['retained_actual145_source_pins']==115
        assert request['source_roles']['retained_actual145_source_pins_unchanged']
        assert request['source_roles']['new_source_pins']==13
        assert request['source_roles']['retained_actual195_source_pins']==127
        assert request['source_roles']['retained_actual195_source_pins_unchanged']
        old=request['original195_baseline']['request'];old_raw=(repo/old['file']).read_bytes()
        assert len(old_raw)==old['bytes'] and hashlib.sha256(old_raw).hexdigest()==old['sha256']
        old_request=json.loads(old_raw)
        assert all(request['source_sha256'][k]==v for k,v in old_request['source_sha256'].items())
        assert request['inputs']==old_request['inputs'] and request['execution']==old_request['execution']
        original208=request['original208_baseline']['request'];original208_raw=(repo/original208['file']).read_bytes()
        assert len(original208_raw)==original208['bytes'] and hashlib.sha256(original208_raw).hexdigest()==original208['sha256']
        request208=json.loads(original208_raw)
        assert len(request208['source_sha256'])==140
        assert all(request['published_source_sha256'][k]==v for k,v in request208['source_sha256'].items())
        assert request['inputs']==request208['inputs'] and request['execution']==request208['execution']
        assert request['frozen_geometry_inputs']==request208['frozen_geometry_inputs'] and request['r273']==request208['r273']
        assert request['source_roles']['retained_actual208_source_pins']==140
        assert request['source_roles']['retained_actual208_source_pins_unchanged']
        assert len(request['published_source_sha256'])==150 and len(request['generated_source_sha256'])==31
        original210=request['original210_baseline']['request'];original210_raw=(repo/original210['file']).read_bytes()
        assert len(original210_raw)==original210['bytes'] and hashlib.sha256(original210_raw).hexdigest()==original210['sha256']
        request210=json.loads(original210_raw)
        assert (len(request210['published_source_sha256']),len(request210['generated_source_sha256']))==(143,11)
        assert all(request['published_source_sha256'][k]==v for k,v in request210['published_source_sha256'].items())
        assert all(request['generated_source_sha256'][k]==v for k,v in request210['generated_source_sha256'].items())
        assert request['inputs']==request210['inputs'] and request['execution']==request210['execution']
        assert request['frozen_geometry_inputs']==request210['frozen_geometry_inputs'] and request['r273']==request210['r273']
        assert request['zero_nonlinear_flux']==request210['zero_nonlinear_flux']
        assert request['source_roles']['retained_actual210_source_pins']==154
        assert request['source_roles']['retained_actual210_source_pins_unchanged']
        original211=request['original211_baseline']['request'];original211_raw=(repo/original211['file']).read_bytes()
        assert len(original211_raw)==original211['bytes'] and hashlib.sha256(original211_raw).hexdigest()==original211['sha256']
        request211=json.loads(original211_raw)
        assert (len(request211['source_sha256']),len(request211['published_source_sha256']),len(request211['generated_source_sha256']))==(168,147,21)
        assert all(request['published_source_sha256'][k]==v for k,v in request211['published_source_sha256'].items())
        assert all(request['generated_source_sha256'][k]==v for k,v in request211['generated_source_sha256'].items())
        assert request['inputs']==request211['inputs'] and request['execution']==request211['execution']
        assert request['frozen_geometry_inputs']==request211['frozen_geometry_inputs'] and request['r273']==request211['r273']
        assert request['zero_nonlinear_flux']==request211['zero_nonlinear_flux']
        assert request['source_roles']['retained_actual211_source_pins']==168
        assert request['source_roles']['retained_actual211_source_pins_unchanged']
        assert request['source_roles']['new_source_pins_relative_to']=='original211-complete168-closure'
        dependency=request['original_transitive_import_source_repair'];dep_item=dependency['original_source']
        dependency_raw=(repo/dep_item['file']).read_bytes()
        assert len(dependency_raw)==dep_item['bytes'] and hashlib.sha256(dependency_raw).hexdigest()==dep_item['sha256']
        assert request['published_source_sha256'][Path(dep_item['file']).name]==dep_item['sha256']
        assert not (set(request['published_source_sha256'])&set(request['generated_source_sha256']))
        assert {**request['published_source_sha256'],**request['generated_source_sha256']}==request['source_sha256']
        from root_20261116_input_support_contracted_source_views import bound_source_view_receipt
        views=bound_source_view_receipt(comp,comp/'public-six-control-input-support-contracted-trace-r273-request.json',request)
        assert (comp/Path(item['file']).name).read_bytes()==recipe_raw
        proof=request['finite_trace_proof'];proof_raw=(repo/proof['file']).read_bytes()
        assert len(proof_raw)==proof['bytes'] and hashlib.sha256(proof_raw).hexdigest()==proof['sha256']
        assert proof['sha256']=='1d66947d6d02b1dac50aa6348e94b56c959336fa1ca52b1ee1450bd6b6ec342c'
        contraction=request['recorded_factor_contraction_proof'];contraction_raw=(repo/contraction['file']).read_bytes()
        assert len(contraction_raw)==contraction['bytes'] and hashlib.sha256(contraction_raw).hexdigest()==contraction['sha256']
        assert contraction['sha256']=='6f9200ea16b08f8305b29c15d6f5712d67c747c4a5f6d27ef8f7b202f835c347'
        assert contraction==recipe['recorded_factor_contraction_proof']
        zero=request['zero_nonlinear_flux'];assert zero==recipe['zero_nonlinear_flux']
        assert zero['actual_primal_and_finiteRootDirection_always_retained']
        assert zero['only_original_positive_zero_nonlinear_dFlux_array_retained']
        assert zero['failed_eligibility_is_original_full_angular_loop_not_scientific_rejection']
        assert zero['no_error_or_resource_exception_caught_for_retry'] and zero['no_new_native_residual_domain_or_FD_gate']
        assert zero['all224_columns226_states_both_mean_and_original_final_assembly_retained']
        assert not zero['binary64_whole_run_word_equivalence_claimed'] and not zero['speedup_or_wall_completion_guaranteed']
        assert request['source_sha256'][zero['helper_file']]==zero['helper_sha256']
        assert request['source_sha256'][zero['variation_file']]==zero['variation_sha256']
        zproof=request['zero_nonlinear_flux_proof'];zproof_raw=(repo/zproof['file']).read_bytes()
        assert len(zproof_raw)==zproof['bytes'] and hashlib.sha256(zproof_raw).hexdigest()==zproof['sha256']
        assert zproof==recipe['zero_nonlinear_flux_proof']
        linear=request['input_support_linear'];assert linear==recipe['input_support_linear']
        assert request['source_sha256'][linear['helper_file']]==linear['helper_sha256']
        assert request['source_sha256'][linear['flow_file']]==linear['flow_sha256']
        assert linear['finite_input_false_runs_original_complete_i_j_k_loop']
        assert linear['all_nonzero_multiply_then_add_and_original_j_order_retained']
        assert linear['all226_output_rows_and224_columns_both_means_retained']
        assert linear['no_output_finiteness_throw_or_new_scientific_gate']
        assert linear['no_error_or_resource_exception_caught_for_retry']
