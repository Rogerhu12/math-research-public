name: visible-exact complete7908 cap adjoint Grams

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_cap_adjoint_Grams.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_cap_adjoint_Grams_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete7908-cap-adjoint-Gram-CI-inputs.json'
      - '.github/workflows/visible-exact-complete7908-cap-adjoint-Grams.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete7908-cap-adjoint-Grams
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  FULL_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete7908-cap-adjoint-Gram-CI-inputs.json
  FULL_MANIFEST_SHA: baf3a42869c52ac0158ec6aac709aebced64a06efda8a8ea6d52939da71f1df5
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  exact-texts:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Partially check out the exact new source and wrapper
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_cap_adjoint_Grams.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_cap_adjoint_Grams_CI.py
      - name: Check exact SHA256 and syntax without any numerical imports
        run: |
          python - <<'PY_EXACT_AST'
          import ast,hashlib,pathlib
          expected={
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_cap_adjoint_Grams.py':'6b3a47a54386171b2c659c776bbfeff52ae0ebe4456ced5b67350f7eabf48a8d',
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_cap_adjoint_Grams_CI.py':'86c2a02bd23eb146fbe4ee4c61cb2fd98d35110c36fde8eed1d6f426e73efed7',
          }
          for name,sha in expected.items():
              raw=pathlib.Path(name).read_bytes()
              if hashlib.sha256(raw).hexdigest()!=sha:
                  raise ValueError('An exact complete-adjoint text changed: '+name)
              ast.parse(raw.decode(),filename=name)
          print('Both exact new sources parsed; no mathematical producer imported or executed.')
          PY_EXACT_AST

  prepare:
    needs: exact-texts
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 200
    outputs:
      source_run: ${{ steps.paths.outputs.source_run }}
      source_attempt: ${{ steps.paths.outputs.source_attempt }}
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out immutable sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete7908-cap-adjoint-Gram-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Set the actual container-visible output paths
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/complete-adjoint-plan-output" >> "$GITHUB_OUTPUT"
          printf 'source_run=%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'source_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Hydrate341 exact files with all337 original pilot pins unchanged
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$FULL_MANIFEST" --manifest-sha "$FULL_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/complete_cap_adjoint_Grams_ci/
      - name: Install the original pinned arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Run the actual plan phase with real pulls and complete prefix preservation
        id: scientific
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_cap_adjoint_Grams_CI.py
          --manifest "$FULL_MANIFEST" --manifest-sha "$FULL_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --phase plan
          --work "$RUNNER_TEMP/complete-adjoint-plan-work"
          --artifact-dir "$RUNNER_TEMP/complete-adjoint-plan-output"
          --compute-minutes 170 --checkpoint-minutes 10
      - name: Preserve an actual nonempty process and exact completed scientific prefixes
        id: collect
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_ACTUAL'
          import json,os,pathlib,shutil
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          process=root/'process.json'
          if not process.is_file() or not process.stat().st_size:
              raise RuntimeError('No actual nonempty complete-adjoint process exists')
          d=json.loads(process.read_text())
          if d.get('repository')!='Rogerhu12/math-research-public':
              raise ValueError('The actual process belongs to another repository')
          for group in range(32):
              folder=root/'bundles'/('range-%02d'%group)
              complete=(folder/'bundle-index.json').is_file()
              if complete:
                  index=json.loads((folder/'bundle-index.json').read_text())
                  complete=all((folder/x['file']).is_file() for x in index['exact_source_files'])
              if complete:
                  shutil.copyfile(process,folder/'process.json')
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                  out.write('bundle%02d=%s\n'%(group,'true' if complete else 'false'))
          files=[p for p in root.rglob('*') if p.is_file()]
          print(json.dumps(dict(actual_files=len(files),actual_bytes=sum(p.stat().st_size for p in files),
              process_complete=d.get('complete'),actual_failure=d.get('failure'),
              actual_quarters=d.get('actual_completed_quarters'),actual_bundles=d.get('actual_completed_bundles'),
              old_target_calls=0,full_cap_high_to_low_claimed=False)))
          PY_ACTUAL
      - name: Retain the actual plan control process and every true mathematical outcome
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-complete-adjoint-Grams-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.output }}/
            !${{ steps.paths.outputs.output }}/bundles/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Preserve exact original proposal slice 00
        if: ${{ always() && steps.collect.outputs.bundle00 == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-complete-adjoint-original-slice-00-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/bundles/range-00/
