          printf 'source_run=%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'source_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Hydrate341 exact files with all337 original pilot pins unchanged
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$FULL_MANIFEST" --manifest-sha "$FULL_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/complete_cap_adjoint_Grams_ci/
      - name: Install the original pinned arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Run the actual range phase with real pulls and complete prefix preservation
        id: scientific
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_cap_adjoint_Grams_CI.py
          --manifest "$FULL_MANIFEST" --manifest-sha "$FULL_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --phase range --group ${{ matrix.group }} --source-run ${{ needs.prepare.outputs.source_run }} --source-attempt ${{ needs.prepare.outputs.source_attempt }}
          --work "$RUNNER_TEMP/complete-adjoint-range-${{ matrix.tag }}-work"
          --artifact-dir "$RUNNER_TEMP/complete-adjoint-range-${{ matrix.tag }}-output"
          --compute-minutes 170 --checkpoint-minutes 10
      - name: Preserve an actual nonempty process and exact completed scientific prefixes
        id: collect
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_ACTUAL'
          import json,os,pathlib,shutil
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          process=root/'process.json'
          if not process.is_file() or not process.stat().st_size:
              raise RuntimeError('No actual nonempty complete-adjoint process exists')
          d=json.loads(process.read_text())
          if d.get('repository')!='Rogerhu12/math-research-public':
              raise ValueError('The actual process belongs to another repository')
          files=[p for p in root.rglob('*') if p.is_file()]
          print(json.dumps(dict(actual_files=len(files),actual_bytes=sum(p.stat().st_size for p in files),
              process_complete=d.get('complete'),actual_failure=d.get('failure'),
              actual_quarters=d.get('actual_completed_quarters'),actual_bundles=d.get('actual_completed_bundles'),
              old_target_calls=0,full_cap_high_to_low_claimed=False)))
          PY_ACTUAL
      - name: Retain the actual range control process and every true mathematical outcome
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-complete-adjoint-Grams-range-${{ matrix.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.output }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

