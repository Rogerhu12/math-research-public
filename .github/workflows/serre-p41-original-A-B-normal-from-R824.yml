name: Serre p41 A B normal vectors from an actual R824 relation

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R809-public-A-B-normal-from-R824-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R809-A-B-normal-from-R824
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R809_original_A_B_normal_from_R824.py
            /topics/serre-uniformity/scripts/R809_public_A_B_normal_from_R824.py
            /topics/serre-uniformity/scripts/R809_original_S5_normal_coordinates.py
            /topics/serre-uniformity/scripts/R824_original_exact_relation_adapter.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/results/R809-original-normal-vectors-for-function-and-Hodge-inputs.md
            /topics/serre-uniformity/notes/R809-original-A-B-normal-consumer-from-R824-method.md
            /topics/serre-uniformity/notes/R809-public-A-B-normal-from-R824-request.json
            /topics/serre-uniformity/computations/R786-exact-original-power5-short-basis/43682100611-1/core-receipt.json
            /topics/serre-uniformity/computations/R786-exact-original-power5-short-basis/43682100611-1/public-actions-input.json
            /.github/workflows/serre-p41-original-A-B-normal-from-R824.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse frozen sources without importing mathematical cores
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path("topics/serre-uniformity/scripts")
          for name in ("R809_original_A_B_normal_from_R824.py",
                       "R809_public_A_B_normal_from_R824.py",
                       "R809_original_S5_normal_coordinates.py",
                       "R824_original_exact_relation_adapter.py",
                       "R824_public_original_global_polar_generators.py"):
              path = root/name
              ast.parse(path.read_text(), filename=str(path))
              print("AST_OK", name)
          PY
      - name: Install the fixed exact arithmetic dependency
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Solve only the two new original normal targets with the retained S5 inverse
        run: |
          python topics/serre-uniformity/scripts/R809_public_A_B_normal_from_R824.py \
            --output "$RUNNER_TEMP/R809-R824/output"
      - name: Verify the complete selected source closure and exact result inventory
        run: |
          python topics/serre-uniformity/scripts/R809_public_A_B_normal_from_R824.py \
            --output "$RUNNER_TEMP/R809-R824/output" --verify
      - name: Keep the one-day active continuation and its original inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-global-R809-original-A-B-normal-coordinates-from-R824-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R809-R824/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
