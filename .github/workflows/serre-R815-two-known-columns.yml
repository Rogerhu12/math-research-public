name: Serre R815 reconstruction with two exact original columns

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R815_two_known_columns-public-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R815-two-known-columns
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R805_public_success_io_audit.py
            /topics/serre-uniformity/notes/R815_two_known_columns-public-request.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actually pull main and compare both rule files with the read commit
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          path = Path("topics/serre-uniformity/scripts/R805_public_success_io_audit.py")
          assert hashlib.sha256(path.read_bytes()).hexdigest() == "5ae35d0c86b20a8b6234f3aac6059c6567cfbea73ed6f835d74f15ba48360e4f"
          spec = importlib.util.spec_from_file_location("R815_two_known_columns_rules_pull", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          request = json.loads(Path("topics/serre-uniformity/notes/R815_two_known_columns-public-request.json").read_text())
          root = Path(os.environ["RUNNER_TEMP"])/"serre-R815-two-known-columns-rules-pull"
          (root/"audit-output").mkdir(parents=True, exist_ok=True)
          module.pull_and_compare(root, request["rules_last_read_commit"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-R815-two-known-columns-rules-pull-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-R815-two-known-columns-rules-pull/audit-output
          retention-days: 1
          if-no-files-found: warn

  reconstruct:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-R815-two-known-columns.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R815_two_known_columns_reconstruction.py
            /topics/serre-uniformity/scripts/R815_two_known_columns_public.py
            /topics/serre-uniformity/scripts/R815_original_normal_derivation_operators.py
            /topics/serre-uniformity/scripts/R811_original_regular_multipliers.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/notes/R815_two_known_columns-public-request.json
            /topics/serre-uniformity/notes/R815-original-two-known-columns-reconstruction-method.md
            /topics/serre-uniformity/notes/R815-original-normal-derivation-operator-method.md
            /topics/serre-uniformity/results/R813-original-Wronskian-normal-derivation-and-cyclic-certificate.md
            /topics/serre-uniformity/results/R817-original-normal-derivation-without-separate-h-multiplier.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse the actual sources without importing mathematical code
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path("topics/serre-uniformity/scripts")
          for name in ("R815_two_known_columns_reconstruction.py", "R815_two_known_columns_public.py",
                       "R815_original_normal_derivation_operators.py",
                       "R811_original_regular_multipliers.py",
                       "R824_public_original_global_polar_generators.py"):
              path = root/name
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print("AST_OK", name)
          PY
      - name: Install pinned exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Keep the original two exact columns, reconstruct from the same 425-prime state, and continue Gamma
        continue-on-error: true
        timeout-minutes: 335
        run: python topics/serre-uniformity/scripts/R815_two_known_columns_public.py compute
      - name: Transfer active exact stages and the unchanged minimal input carrier
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R815-original-normal-derivation-operators-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R815-original-normal-derivation-operators/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
      - name: Require both original operators and exact source-bound certificate interfaces
        if: always()
        run: python topics/serre-uniformity/scripts/R815_two_known_columns_public.py verify
