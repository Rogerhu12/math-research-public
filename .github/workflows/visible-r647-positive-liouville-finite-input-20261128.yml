name: visible-flex rational Morse finite geometry input
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r647-positive-liouville-finite-input-20261128.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r647-positive-liouville-finite-input-20261128
  cancel-in-progress: false
jobs:
  research:
    name: New excited Morse pair and actual positive sigma geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/visible-r647-positive-liouville-finite-input-20261128.yml
            /README.md
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r647-positive-liouville-finite-input-20261128.json
            /topics/visible-flex-new-mechanism/scripts/r647_positive_liouville_finite_profile_20261128.py
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/results/R630-morse-double-kernel-all-frequency-center.md
            /topics/visible-flex-new-mechanism/results/R635-exact-boundary-cancellation-in-double-kernel-port.md
            /topics/visible-flex-new-mechanism/results/R637-certified-morse-port-and-true-flat-tail-transfer.md
            /topics/visible-flex-new-mechanism/results/R647-positive-liouville-gauge-finite-morse-profile.md
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r647-positive-liouville-finite-input-scope.md
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r630-morse-port-actions.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull current rules and evaluate the new finite input
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r647-positive-liouville-finite-input-20261128.json
          --lane excited-pair-finite-input
