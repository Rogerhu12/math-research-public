name: ISP R150 original nonrankone two-atom gradient
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: isp-nonrankone-small-temporary-789f
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/invariant-subspace-problem/README.md
            /topics/invariant-subspace-problem/HANDOFF.md
            /topics/invariant-subspace-problem/notes/2026-11-16-r150-nonrankone-manifest-session-789f.py
            /topics/invariant-subspace-problem/notes/2026-11-16-r150-nonrankone-manifest-session-789f-request.json
          persist-credentials: false
      - name: Install exact arithmetic
        run: python -m pip install --quiet python-flint==0.9.0
      - name: Compute the full original rational gradient at the two-atom point
        run: python topics/invariant-subspace-problem/notes/2026-11-16-r150-nonrankone-manifest-session-789f.py
