name: visible-flex complete closed-spinor continuation and fixed metric refinement
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r728-closed-spinor-continuation-20261128.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visible-flex-r728-closed-spinor-continuation-20261128
  cancel-in-progress: false
jobs:
  research:
    name: Continue the actual R703 field in complete closed-spinor coordinates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      R728_REQUEST: topics/visible-flex-new-mechanism/computations/request-r728-closed-spinor-continuation-20261128.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/visible-r728-closed-spinor-continuation-20261128.yml
            /README.md
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r728-closed-spinor-continuation-20261128.json
            /topics/visible-flex-new-mechanism/scripts/r703_material_geometry_observer.py
            /topics/visible-flex-new-mechanism/scripts/r703_real_material_mass_continuation_20261128.py
            /topics/visible-flex-new-mechanism/scripts/r703_transported_lattice_anchor.py
            /topics/visible-flex-new-mechanism/scripts/r703_weighted_material_field.py
            /topics/visible-flex-new-mechanism/scripts/r687_darboux_frame_transport_20261128.py
            /topics/visible-flex-new-mechanism/scripts/r683_proper_phase_metric_transport_20261128.py
            /topics/visible-flex-new-mechanism/scripts/r669_true_finite_tilt_reach_continuation_20261128.py
            /topics/visible-flex-new-mechanism/scripts/r659_finite_tilt_latitude_system_20261128.py
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/computations/r687-natural-frame-for-r703-20261128.json
            /topics/visible-flex-new-mechanism/computations/r703-real-material-mass-20261128.json
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r703-actual-weighted-material-continuation-scope.md
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r703-r687-actual-general-frame-natural-terminal.md
            /topics/visible-flex-new-mechanism/results/R698-two-component-latitude-curl-with-the-actual-signed-binormal-speed.md
            /topics/visible-flex-new-mechanism/results/R701-actual-material-latitude-reparametrization-and-fixed-radial-mass.md
            /topics/visible-flex-new-mechanism/results/R687-global-darboux-frames-with-quantitative-periodic-immersion-reconstruction.md
            /topics/visible-flex-new-mechanism/results/R680-smaller-tilt-offset-cap-and-positive-hoop-curvature-phase-input.md
            /topics/visible-flex-new-mechanism/results/R662-tilted-two-plane-global-tube-and-offset-cap-clearance.md
            /topics/visible-flex-new-mechanism/results/R665-end-tangent-and-length-cost-for-finite-tilt.md
            /topics/visible-flex-new-mechanism/results/R725-closed-latitude-coordinates-and-one-common-radial-metric.md
            /topics/visible-flex-new-mechanism/results/R726-closed-spinor-fourier-and-complete-common-metric-residuals.md
            /topics/visible-flex-new-mechanism/results/R731-piecewise-analytic-flat-rim-rotational-metric-rigidity.md
            /topics/visible-flex-new-mechanism/scripts/r726_closed_spinor_fourier.py
            /topics/visible-flex-new-mechanism/scripts/r726_paid_half_projection.py
            /topics/visible-flex-new-mechanism/scripts/r728_paid_spinor_hermite.py
            /topics/visible-flex-new-mechanism/scripts/r728_full_spinor_geometry.py
            /topics/visible-flex-new-mechanism/scripts/r728_paid_spinor_input.py
            /topics/visible-flex-new-mechanism/scripts/r728_closed_spinor_continuation_20261128.py
            /topics/visible-flex-new-mechanism/computations/r728-actual-closed-spinor-20261128.json
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r728-actual-closed-spinor-continuation-scope.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Read and bind the completed historical receipt before science
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/r728_paid_spinor_input.py
          --request topics/visible-flex-new-mechanism/computations/request-r728-closed-spinor-continuation-20261128.json
      - name: Pull both current rule sources and run the actual full-column continuation
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r728-closed-spinor-continuation-20261128.json
          --lane actual-closed-spinor
      - name: Preserve every retained paid block and its exact next operation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-r728-paid-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r728-paid-checkpoint/
          retention-days: 30
          if-no-files-found: error
