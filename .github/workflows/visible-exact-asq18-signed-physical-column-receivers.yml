name: R149 ASQ18 whole original physical signed column receivers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visible-exact-asq18-signed-physical-column-receivers.yml'
permissions:
  contents: read
concurrency:
  group: visible-exact-asq18-signed-physical-column-receivers
  cancel-in-progress: false
jobs:
  receive-original-bfp-and-dcp-centres:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/visible-exact-asq18-signed-physical-column-receivers.yml
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/notes/2026-11-27-unit-disk-operator-Theta-low-square-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-28-full-target-nu-forward-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-28-particular-density-Theta-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-28-read-public-model-ultra-rules.json
            /topics/visible-flex-exact-nearby/notes/2026-11-28-saved-WBN-column-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-28-weighted-model-Theta-receiver-inputs.json
            /topics/visible-flex-exact-nearby/notes/full_target_nu_forward_ci/run-46118996598-1/actual-full-target-nu-forward.json
            /topics/visible-flex-exact-nearby/notes/full_target_nu_forward_ci/run-46118996598-1/execution.json
            /topics/visible-flex-exact-nearby/notes/particular_density_Theta_ci/run-46124617641-1/actual-particular-density-Theta.json
            /topics/visible-flex-exact-nearby/notes/particular_density_Theta_ci/run-46124617641-1/execution.json
            /topics/visible-flex-exact-nearby/notes/saved_WBN_column_ci/run-46125286420-1/actual-saved-column-consequence.json
            /topics/visible-flex-exact-nearby/notes/saved_WBN_column_ci/run-46125286420-1/execution.json
            /topics/visible-flex-exact-nearby/notes/unit_disk_operator_Theta_low_square_ci/run-45933303391-1/actual-unit-disk-operator-Theta-low-square.json
            /topics/visible-flex-exact-nearby/notes/unit_disk_operator_Theta_low_square_ci/run-45933303391-1/execution.json
            /topics/visible-flex-exact-nearby/notes/weighted_model_Theta_receiver_ci/run-46122573619-1/actual-weighted-model-Theta-receiver.json
            /topics/visible-flex-exact-nearby/notes/weighted_model_Theta_receiver_ci/run-46122573619-1/execution.json
            /topics/visible-flex-exact-nearby/results/R149-supplement-actual-signed-Theta-trial-and-finite-inverse-by-primitive-residual.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_asq18_original_physical_column_receivers.py
      - name: Apply ASQ18 to each complete signed physical readout
        run: >-
          python3 -B topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_asq18_original_physical_column_receivers.py
          --repo "$GITHUB_WORKSPACE" --source-sha 991f9f51ffffd6d5b591d628f1baa7cae6e136ada9a622481d5acabd467b216f
