name: Serre p41 original S5 normal coordinates

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R809-public-original-S5-normal-coordinates-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R809-original-S5-normal-coordinates
  cancel-in-progress: false

jobs:
  original_S5_normal_coordinates:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-S5-normal-coordinates.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R809_original_S5_normal_coordinates.py
            /topics/serre-uniformity/scripts/R809_public_original_S5_normal_coordinates.py
            /topics/serre-uniformity/scripts/R786_public_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R809-public-original-S5-normal-coordinates-request.json
            /topics/serre-uniformity/notes/R809-original-S5-normal-coordinate-consumer-method.md
            /topics/serre-uniformity/results/R809-original-normal-vectors-for-function-and-Hodge-inputs.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source syntax without executing mathematics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("R809_original_S5_normal_coordinates.py", "R809_public_original_S5_normal_coordinates.py"):
              path = Path("topics/serre-uniformity/scripts") / name
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Restore requested actual normal vectors in one shared exact S5 block
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R809_public_original_S5_normal_coordinates.py compute
      - name: Transfer the active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R809-original-S5-normal-coordinates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R809-original-S5-normal-coordinates/output
          retention-days: 1
          if-no-files-found: warn
      - name: Require full original 1380-row certification for every requested target
        if: always()
        run: python topics/serre-uniformity/scripts/R809_public_original_S5_normal_coordinates.py verify
