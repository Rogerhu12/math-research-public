name: visible-flex R584 R586 complete nineteen-state BVP
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r530-full-centered-bvp-20261126.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r530-full-centered-bvp-20261126
  cancel-in-progress: false
jobs:
  research:
    name: Complete ordered history and finite nineteen-state boundary roots
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-r530-full-centered-bvp-20261126.yml
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r530-full-centered-bvp-20261126.json
            /topics/visible-flex-new-mechanism/results/R581-exact-c2-local-ruling-with-full-history-chain.md
            /topics/visible-flex-new-mechanism/results/R584-centered-third-history-and-nineteen-state-full-ruling-bvp.md
            /topics/visible-flex-new-mechanism/results/R586-sixfold-full-history-coefficient-projection-and-finite-integrals.md
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r530_compact_history_v2_agent.py
            /topics/visible-flex-new-mechanism/scripts/r530_c2_r578_evaluator_agent.py
            /topics/visible-flex-new-mechanism/scripts/r530_full_centered_nineteen_bvp_agent.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull rules compile complete coefficients and solve actual boundary equations
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r530-full-centered-bvp-20261126.json
          --lane full-nineteen-bvp
      # One sequential job. All four finite H/L cases share the same R578 input.
      # No raw R581 replay, artifacts, Releases, or Git writes.

