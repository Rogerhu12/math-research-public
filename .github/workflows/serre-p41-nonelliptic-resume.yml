name: Serre p41 resume preserved nonelliptic stages

on:
  workflow_dispatch:
    inputs:
      result:
        description: Reserved result ID with a preserved wave02 artifact
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-p41-nonelliptic-${{ inputs.result }}
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RESUME_RESULT: ${{ inputs.result }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            topics/serre-uniformity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 sympy==1.14.0 python-flint==0.8.0 mpmath==1.3.0
      - name: Restore and bind the completed original stages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/p41_public_nonelliptic_resume.py prepare --result "$RESUME_RESULT"
      - name: Resume with the original nonelliptic clearing certificate
        continue-on-error: true
        timeout-minutes: 330
        run: python topics/serre-uniformity/scripts/p41_public_nonelliptic_resume.py run --result "$RESUME_RESULT" --budget-minutes 320
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-p41-nonelliptic-${{ inputs.result }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-p41-nonelliptic/${{ inputs.result }}/output
          retention-days: 30
          if-no-files-found: warn
      - name: Publish the actual completed tail
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/p41_public_nonelliptic_resume.py publish --result "$RESUME_RESULT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-p41-nonelliptic-publication-${{ inputs.result }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-p41-nonelliptic/${{ inputs.result }}/output/publication-receipt.json
          retention-days: 30
          if-no-files-found: warn
      - name: Require actual completion
        if: always()
        run: python topics/serre-uniformity/scripts/p41_public_nonelliptic_resume.py verify --result "$RESUME_RESULT"
