name: Serre next original Abel pair at the sigma exception

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R710-public-next-Abel-request.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract_next_abel_pair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-next-original-Abel-pair.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/*.py
            /topics/serre-uniformity/notes/R710-public-next-Abel-request.json
            /topics/serre-uniformity/computations/R706-original-z-137147/**
            /topics/serre-uniformity/computations/R710-next-original-Abel-pair/**
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned finite-field arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Extract only the next pair from completed original coefficients
        continue-on-error: true
        timeout-minutes: 10
        run: python topics/serre-uniformity/scripts/R710_public_next_abel.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-cartier-R710-next-original-Abel-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-cartier/R710-next-original-Abel-pair
          retention-days: 30
          if-no-files-found: warn
      - name: Publish exact original-pair extraction outputs
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R710_public_next_abel.py publish
      - name: Require complete original-pair extraction
        if: always()
        run: python topics/serre-uniformity/scripts/R710_public_next_abel.py verify
