name: Serre original p47 ell283 cuspidal sieve

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/original-p47-ell283-cuspidal-sieve-request.json

permissions:
  contents: read

concurrency:
  group: serre-original-p47-ell283-cuspidal-sieve-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_same_point_sieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/original_p47_cuspidal_disks.py
            /topics/serre-uniformity/scripts/original_p47_ell283_cuspidal_sieve.py
            /topics/serre-uniformity/notes/2026-11-27-original-p47-ell283-cuspidal-sieve-method.md
            /topics/serre-uniformity/results/R9-cm-reduction-separation.md
            /topics/serre-uniformity/results/R1062-original-full-nonsplit-cuspidal-kummer-descent.md
            /topics/serre-uniformity/results/R1064-original-cuspidal-cover-descent-and-auxiliary-character-visibility.md
            /topics/serre-uniformity/results/R1069-all-prime-good-cuspidal-characters-and-unique-global-labels.md
            /topics/serre-uniformity/results/R1070-original-cuspidal-labels-by-division-polynomial-values.md
            /topics/serre-uniformity/results/R1071-original-p-local-cuspidal-label-polynomials.md
            /topics/serre-uniformity/results/R1072-certified-original-p47-cuspidal-disk-labels.md
            /topics/serre-uniformity/results/R1073-original-split-auxiliary-cuspidal-sieve.md
            /topics/serre-uniformity/notes/original-p47-ell283-cuspidal-sieve-request.json
      - name: Install the exact finite-field dependency
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Compare all original points at ell283 with the same p47 candidates
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          SERRE_EXPECTED_REQUEST_SHA256: '1871b12acdbc020ef9d6a3f15e875893f855cf9f30b1dc3116accfcc135d414a'
        run: python topics/serre-uniformity/scripts/original_p47_ell283_cuspidal_sieve.py
