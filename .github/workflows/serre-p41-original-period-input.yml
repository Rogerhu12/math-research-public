name: Serre p41 original marked compact periods

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R738-public-p41-period-input-request.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serre-R738-p41-original-period-input
  cancel-in-progress: false

jobs:
  integral_period_input:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-period-input.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R738_p41_original_period_input.py
            /topics/serre-uniformity/scripts/R738_public_period_input.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R738-public-p41-period-input-request.json
            /topics/serre-uniformity/notes/R738-p41-original-period-input-method.md
            /topics/serre-uniformity/results/R575-correct-actual-sixfold-CM-deck-and-cubic-twist.md
            /topics/serre-uniformity/results/R616-original-CM-point-difference-and-explicit-height-basis.md
            /topics/serre-uniformity/results/R732-original-CM-period-kernel-and-bounded-rational-function-recovery.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact rational arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compute the original marked cells, compact cycles, and intersection form
        continue-on-error: true
        timeout-minutes: 30
        run: python topics/serre-uniformity/scripts/R738_public_period_input.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R738-p41-original-period-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R738-p41-original-period-input
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve complete or failed exact outputs
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R738_public_period_input.py publish
      - name: Require the complete marked integral homology certificate
        if: always()
        run: python topics/serre-uniformity/scripts/R738_public_period_input.py verify
