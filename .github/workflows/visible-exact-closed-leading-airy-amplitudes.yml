name: visible-exact closed leading Airy amplitudes and exact seam transmission

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-closed-leading-airy-amplitudes.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-closed-leading-airy-amplitudes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-closed-leading-Airy-amplitudes-CI-inputs.json
  PHASE_MANIFEST_SHA: 9f6c60a2395c11ec04d9fbc69aadc6fcd0be6717ebdead8ba9d76d7c371cf5a8
  PHASE_PIPELINE_SHA: c67d48104692a01637b5cc757cee8f6c586cf0c74e6a6c53c0257ab27a226b10
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-closed-leading-airy-amplitudes:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_closed_leading_Airy_amplitudes_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-closed-leading-Airy-amplitudes-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate the thirteen exact original process and proof inputs
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_closed_leading_Airy_amplitudes_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0 sympy==1.14.0
      - name: Set the original artifact path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-closed-leading-airy-amplitudes-output" >> "$GITHUB_OUTPUT"
      - name: Compute the complete leading amplitudes and exact identities and publish the outcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_closed_leading_Airy_amplitudes_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-closed-leading-airy-amplitudes-science"
          --out-dir "$RUNNER_TEMP/visible-exact-closed-leading-airy-amplitudes-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-closed-leading-airy-amplitudes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
