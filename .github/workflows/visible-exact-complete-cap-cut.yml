name: visible-exact complete cap into true moving cut and full Gram

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-complete-cap-cut.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-cap-cut
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  CUT_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-cap-cut-CI-pinned-inputs.json
  CUT_MANIFEST_SHA: 7191a7db5b48501128249c59d777e4617eebd13f5e24ddd6f455801d0dbc8970
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  complete-cap-and-cut:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 60
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact unchanged cap inputs and consumer
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-cap-cut-CI-pinned-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Fetch only the exact nine source and certificate inputs
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$CUT_MANIFEST" --manifest-sha "$CUT_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/complete_cap_cut_ci/
      - name: Install the original arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible original complete-cap artifact paths
        id: paths
        run: |
          printf 'prior=%s\n' "$RUNNER_TEMP/visible-exact-original-complete-cap" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-complete-cap-cut" >> "$GITHUB_OUTPUT"
      - name: Receive the successful small complete-cap result without the large trial arrays
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43583838015
          name: visible-exact-cap128-recovered-complete-43583838015-1
          path: ${{ steps.paths.outputs.prior }}
      - name: Pay the actual moving cap, every low and high row, the mean and full-frame Gram
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_cap_cut_CI_worker.py
          --manifest "$CUT_MANIFEST" --manifest-sha "$CUT_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --prior-artifact "$RUNNER_TEMP/visible-exact-original-complete-cap"
          --work "$RUNNER_TEMP/visible-exact-complete-cap-cut-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-complete-cap-cut"
          --compute-minutes 40 --checkpoint-minutes 10
      - name: Preserve the complete or failed native and actual process
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-complete-cap-cut-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
