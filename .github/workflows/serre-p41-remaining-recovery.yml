name: Serre p41 recover the actual remaining disks

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/public-p41-remaining-recovery-request.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            topics/serre-uniformity
      - name: Select only work lacking a complete published receipt
        id: matrix
        run: |
          matrix=$(python topics/serre-uniformity/scripts/p41_public_remaining_recovery.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  recover:
    needs: plan
    if: needs.plan.outputs.matrix != '{"result":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            topics/serre-uniformity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 sympy==1.14.0 python-flint==0.8.0 mpmath==1.3.0
      - name: Record the actual recovery inputs
        run: python topics/serre-uniformity/scripts/p41_public_remaining_recovery.py prepare --result ${{ matrix.result }}
      - name: Compute only the missing original chain and heights
        continue-on-error: true
        timeout-minutes: 330
        run: python topics/serre-uniformity/scripts/p41_public_remaining_recovery.py run --result ${{ matrix.result }} --budget-minutes 320
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-p41-remaining-${{ matrix.result }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-p41-remaining/${{ matrix.result }}/output
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded actual outputs
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/p41_public_remaining_recovery.py publish --result ${{ matrix.result }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-p41-remaining-publication-${{ matrix.result }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-p41-remaining/${{ matrix.result }}/output/publication-receipt.json
          retention-days: 30
          if-no-files-found: warn
      - name: Require actual computational completion
        if: always()
        run: python topics/serre-uniformity/scripts/p41_public_remaining_recovery.py verify --result ${{ matrix.result }}
