name: visible-exact same-F matrix Gram pilot

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_same_F_triangular_source_Gram_pilot.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_same_F_triangular_source_Gram_pilot_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-14-R133-same-F-triangular-source-Gram-pilot-CI-inputs.json'
      - '.github/workflows/visible-exact-same-F-triangular-source-Gram-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-same-F-triangular-source-Gram-pilot
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  GRAM_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-same-F-triangular-source-Gram-pilot-CI-inputs.json
  GRAM_MANIFEST_SHA: a24a9a7fec2f39e349e9f547ea4d5c33f72db10d41e3a77ed7030409161e7ad9
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  matrices:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 120
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-same-F-triangular-source-Gram-pilot-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate all112 pins with the original105 scientific inputs unchanged
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$GRAM_MANIFEST" --manifest-sha "$GRAM_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/same_F_triangular_source_Gram_pilot_ci/
      - name: Parse the two new sources before any new mathematical operation
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_same_F_triangular_source_Gram_pilot.py','fourfold_codazzi_same_F_triangular_source_Gram_pilot_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('Same-F source and worker parsed; original target, F and validator remain frozen.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible input and output paths
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-same-F-Gram-output" >> "$GITHUB_OUTPUT"
          printf 'inputs=%s\n' "$RUNNER_TEMP/visible-exact-same-F-Gram-inputs" >> "$GITHUB_OUTPUT"
      - name: Download exact original four successful full193 matrix arrays
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-full193-matrix-pilot-43645186441-1
          repository: Rogerhu12/math-research-public
          run-id: 43645186441
          github-token: ${{ github.token }}
          path: ${{ steps.paths.outputs.inputs }}/old-matrices/
      - name: Download unchanged original frame slice0
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-0-43594139132-1
          repository: Rogerhu12/math-research-public
          run-id: 43594139132
          github-token: ${{ github.token }}
          path: ${{ steps.paths.outputs.inputs }}/frame-0/
      - name: Download unchanged original frame slice8
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-8-43594139132-1
          repository: Rogerhu12/math-research-public
          run-id: 43594139132
          github-token: ${{ github.token }}
          path: ${{ steps.paths.outputs.inputs }}/frame-8/
      - name: Download unchanged original frame slice15
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-15-43594139132-1
          repository: Rogerhu12/math-research-public
          run-id: 43594139132
          github-token: ${{ github.token }}
          path: ${{ steps.paths.outputs.inputs }}/frame-15/
      - name: New same-F patch and complete signed matrix Grams with real pull every10minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_same_F_triangular_source_Gram_pilot_CI.py
          --manifest "$GRAM_MANIFEST" --manifest-sha "$GRAM_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --matrix-artifact "$RUNNER_TEMP/visible-exact-same-F-Gram-inputs/old-matrices"
          --frame-slice "$RUNNER_TEMP/visible-exact-same-F-Gram-inputs/frame-0"
          --frame-slice "$RUNNER_TEMP/visible-exact-same-F-Gram-inputs/frame-8"
          --frame-slice "$RUNNER_TEMP/visible-exact-same-F-Gram-inputs/frame-15"
          --work "$RUNNER_TEMP/visible-exact-same-F-Gram-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-same-F-Gram-output"
          --compute-minutes 100 --checkpoint-minutes 10
      - name: Require nonempty actual evidence and bounded inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty same-F matrix process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,
                        sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          raw=(json.dumps(entries,indent=2)+'\n').encode()
          if len(raw)>60000:raise RuntimeError('same-F matrix inventory exceeds60000 bytes')
          (root/'artifact-inventory.json').write_bytes(raw)
          print(dict(actual_files=len(files),actual_inventory_bytes=len(raw)))
          PY_INVENTORY
      - name: Preserve every actual same-F matrix byte and successful prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-same-F-matrix-Gram-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
