name: Serre required original source intake

on:
  push:
    branches: [serre-public-recovery-20261116]
    paths:
      - topics/serre-uniformity/notes/serre-source-artifact-intake-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-required-original-source-intake
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
      - name: Actually pull main and compare the two read rule files
        env:
          REQUEST_SOURCE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, subprocess
          from pathlib import Path
          path='topics/serre-uniformity/notes/serre-source-artifact-intake-request.json'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',os.environ['REQUEST_SOURCE']],check=True)
          request=json.loads(subprocess.check_output(['git','show',os.environ['REQUEST_SOURCE']+':'+path]))
          subprocess.run(['git','checkout','-B','serre-intake-rules-main'],check=True)
          subprocess.run(['git','pull','--rebase','origin','main'],check=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          actual={key:hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  for key,name in [('root','README.md'),('topic','topics/serre-uniformity/README.md')]}
          print('INTAKE_RULES_PULL='+json.dumps({'head':head,'UTC':dt.datetime.now(dt.timezone.utc).isoformat(),
                'readme_sha256':actual,'changed':actual!=request['readme_sha256']},sort_keys=True))
          if actual!=request['readme_sha256']:
              old=request['rules_last_read_commit']
              subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',old],check=True)
              subprocess.run(['git','diff',old,head,'--','README.md','topics/serre-uniformity/README.md'],check=True)
              raise SystemExit('Read the actual rule changes before continuing.')
          PY

  read_sources:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/serre_public_artifact_source_intake.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/notes/serre-source-artifact-intake-request.json
      - name: Read original source leaves and actual ended checkpoints
        run: |
          python topics/serre-uniformity/scripts/serre_public_artifact_source_intake.py \
            topics/serre-uniformity/notes/serre-source-artifact-intake-request.json \
            "$RUNNER_TEMP/serre-source-intake/output"
      - name: Preserve only required original sources for the active consumers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-required-original-source-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-source-intake/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
