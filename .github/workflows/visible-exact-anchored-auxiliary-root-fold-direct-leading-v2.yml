name: visible-exact anchored auxiliary fold v2 and exact failed-prefix continuation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-anchored-auxiliary-root-fold-direct-leading-v2.yml']
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Optional exact anchored-fold run whose completed scalar stages will be reused'
        required: false
        type: string
        default: ''
      resume_attempt:
        description: 'Original attempt for the optional exact prefix artifact'
        required: false
        type: string
        default: '1'

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-anchored-auxiliary-root-fold-direct-leading-v2
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-anchored-auxiliary-root-fold-direct-leading-v2-CI-inputs.json
  PHASE_MANIFEST_SHA: 7f00e2a21677b55213c6d72805e50b92b7d24fe703895a01f8d1dcb3003ad9f6
  PHASE_PIPELINE_SHA: 4e32040a5e0294822056808bf94a4b20555366693b6fd7a2d32ffdef3682c3b5
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-anchored-auxiliary-root-fold-direct-leading-v2:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_anchored_auxiliary_root_fold_direct_leading_v2_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-anchored-auxiliary-root-fold-direct-leading-v2-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate28 exact original prefixes, completed coefficients, proofs and new scalar inputs
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_anchored_auxiliary_root_fold_direct_leading_v2_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the complete pinned Python source closure without running mathematics
        run: |
          python - <<'PY_SOURCE'
          import ast,json,os,pathlib
          manifest=json.loads(pathlib.Path(os.environ['PHASE_MANIFEST']).read_text())
          for entry in manifest['files']:
              path=pathlib.Path(entry['path'])
              if path.suffix=='.py':
                  ast.parse(path.read_text(),filename=str(path))
          PY_SOURCE
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Set the actual result path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-anchored-auxiliary-root-fold-direct-leading-v2-output" >> "$GITHUB_OUTPUT"
      - name: Prepare a separate optional prefix directory
        run: mkdir -p "$RUNNER_TEMP/visible-exact-anchored-auxiliary-root-fold-direct-leading-v2-prepared"
      - name: Restore an explicitly selected exact auxiliary-domain prefix
        if: ${{ inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-anchored-auxiliary-root-fold-direct-leading-v2-${{ inputs.resume_run }}-${{ inputs.resume_attempt }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-anchored-auxiliary-root-fold-direct-leading-v2-prepared/resume
      - name: Reuse the whole smaller case and refine only the failed larger characteristic
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_anchored_auxiliary_root_fold_direct_leading_v2_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-anchored-auxiliary-root-fold-direct-leading-v2-science"
          --prepared "$RUNNER_TEMP/visible-exact-anchored-auxiliary-root-fold-direct-leading-v2-prepared"
          --out-dir "$RUNNER_TEMP/visible-exact-anchored-auxiliary-root-fold-direct-leading-v2-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-anchored-auxiliary-root-fold-direct-leading-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
