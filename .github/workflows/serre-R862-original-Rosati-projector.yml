name: Serre original Rosati projector and integral correspondences

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R862-original-Rosati-projector-public-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R862-original-Rosati-projector
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/notes/R862-original-Rosati-projector-public-request.json
      - name: Pull main and compare both rule files with the read commit
        env:
          REQUEST_SOURCE: ${{ github.sha }}
          RECEIPT_PATH: ${{ runner.temp }}/R862-projector-rules-pull.json
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, subprocess
          from pathlib import Path
          name='topics/serre-uniformity/notes/R862-original-Rosati-projector-public-request.json'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',os.environ['REQUEST_SOURCE']],check=True)
          request=json.loads(subprocess.check_output(['git','show',os.environ['REQUEST_SOURCE']+':'+name]))
          assert request['producer_inputs_pending'] is False
          subprocess.run(['git','checkout','-B','r862-projector-rules-main'],check=True)
          subprocess.run(['git','pull','--rebase','origin','main'],check=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          old=request['rules_last_read_commit']
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',old],check=True)
          actual={key:hashlib.sha256(Path(path).read_bytes()).hexdigest()
                  for key,path in [('root','README.md'),('topic','topics/serre-uniformity/README.md')]}
          changed=actual!=request['readme_sha256']
          receipt={'actual_git_pull_rebase_completed':True,'actual_head':head,'previous_read_commit':old,
                   'actual_UTC':dt.datetime.now(dt.timezone.utc).isoformat(),'readme_sha256':actual,
                   'expected_readme_sha256':request['readme_sha256'],'rules_changed':changed}
          Path(os.environ['RECEIPT_PATH']).write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('R862_RULES_PULL='+json.dumps(receipt,sort_keys=True))
          if changed:
              subprocess.run(['git','diff',old,head,'--','README.md','topics/serre-uniformity/README.md'],check=True)
              raise SystemExit('Read the changed README files before new arithmetic.')
          PY
      - name: Preserve the actual pull receipt for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-R862-projector-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R862-projector-rules-pull.json
          retention-days: 1
          if-no-files-found: warn

  compute:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R862_original_Rosati_projector.py
            /topics/serre-uniformity/scripts/R862_public_original_Rosati_projector.py
            /topics/serre-uniformity/scripts/R858_public_original_p41_single_Z.py
            /topics/serre-uniformity/scripts/R852_public_original_one_Z_coefficients.py
            /topics/serre-uniformity/scripts/R850_public_original_rigidified_fibres.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/results/R862-original-Rosati-projector-from-certified-Hom-correspondences.md
            /topics/serre-uniformity/notes/R862-original-Rosati-projector-public-request.json
            /.github/workflows/serre-R862-original-Rosati-projector.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse source files without importing mathematical modules
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          base=Path('topics/serre-uniformity/scripts')
          names=('R862_original_Rosati_projector.py','R862_public_original_Rosati_projector.py',
                 'R858_public_original_p41_single_Z.py','R852_public_original_one_Z_coefficients.py',
                 'R850_public_original_rigidified_fibres.py','R824_public_original_global_polar_generators.py')
          for name in names:
              path=base/name
              ast.parse(path.read_text(),filename=str(path))
              print('AST_OK',name)
          PY
      - name: Compute the original projector from the completed Hom source
        run: |
          python topics/serre-uniformity/scripts/R862_public_original_Rosati_projector.py compute \
            --output "$RUNNER_TEMP/R862-original-projector/output"
      - name: Verify all completed stages and original source bytes
        if: always()
        run: |
          python topics/serre-uniformity/scripts/R862_public_original_Rosati_projector.py verify \
            --output "$RUNNER_TEMP/R862-original-projector/output"
      - name: Preserve the exact polynomial and original source-bound stages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-global-R862-original-Rosati-projector-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R862-original-projector/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
