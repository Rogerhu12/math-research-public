name: Run 54 pre-bent closed waist and two free-rim systems

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-larger-amplitude/computations/run54-prebent-waist-request.json'
      - '.github/workflows/visible-larger-run54-prebent-waist.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-larger-run54-prebent-waist
  cancel-in-progress: false

jobs:
  finite_amplitude:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the triggering public source commit
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/README.md
            /topics/visible-flex-larger-amplitude/HANDOFF.md
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/publish_r734_exact_conclusion.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/publish_r738_exact_gap.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/run36_bent_disk_actions.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/observe_run48_readme_publications.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/observe_bent_prebent_waist_search.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_prebent_waist_phase.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_prebent_waist_fields.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_prebent_waist_normal.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_prebent_waist_stress.py
            /topics/visible-flex-larger-amplitude/computations/bent-prebent-waist-phase-design-v1.json
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r791_prebent_lever_waist_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r783_four_developable_cap_flaps.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r781_round_three_lobe_spatial_rings.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r740_rolled_disk_seed.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r742_tilted_disk_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r767_negative_track_profile.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r767_preloaded_cap_atlas.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_preloaded_bridge_system.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/closed_body_mesh_r772_terminal.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/closed_body_mesh_terminal.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/closed_body_mesh_geometry.py
            /topics/visible-flex-larger-amplitude/computations/run54-prebent-waist-request.json
            /topics/visible-flex-larger-amplitude/notes/run54-prebent-waist-*.json
      - name: Select the pinned public numerical Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14
      - name: Fit all three R791 pre-bent families and export all three complete fields
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
          RUN54_PYTHON_SETUP: ${{ steps.python.outcome }}
        shell: bash
        run: >-
          python -u topics/visible-flex-larger-amplitude/scripts/resume_20261128/observe_bent_prebent_waist_search.py
          --request topics/visible-flex-larger-amplitude/computations/run54-prebent-waist-request.json
          --setup-conclusion "$RUN54_PYTHON_SETUP"
