name: ISP Phi zero h one six actual QQ local factors
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isp-phi-h-one-six-qq-local-factors-8542
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ISP_PIN: ${{ github.sha }}
      ISP_FILE: 2026-11-27-unit211-Phi-zero-rank-one-value-six-original-QQ-local-factors-8542.py
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FLINT_NUM_THREADS: '1'
    steps:
      - name: Prepare exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Pinned FLINT arithmetic
        run: python -m pip install --quiet python-flint==0.9.0
      - name: New complete QQ local factors of original fixed Sylvester
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-equal-six-cofactors"
          cd "$RUNNER_TEMP/isp-equal-six-cofactors"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          timeout 120s git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          ISP_SOURCE_PATH="topics/invariant-subspace-problem/notes/$ISP_FILE"
          ISP_BLOB="$(git rev-parse "$ISP_PIN:$ISP_SOURCE_PATH")"
          git show "$ISP_PIN:$ISP_SOURCE_PATH" > "$RUNNER_TEMP/isp-equal-six-source.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-27-focused-exact-actions-driver-8542.py" > "$RUNNER_TEMP/isp-equal-six-driver.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-27-unit211-rank-one-centered-value-original-gram-helper-8542.py" > "$RUNNER_TEMP/isp-centered-gram-helper.py"
          export ISP_CENTERED_VALUE_HELPER="$RUNNER_TEMP/isp-centered-gram-helper.py"
          export ISP_RANK_ONE_GRAM_HELPER="$RUNNER_TEMP/isp-centered-gram-helper.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-27-unit211-monic-six-explicit-geometric-localization-helper-8542.py" > "$RUNNER_TEMP/isp-monic-six-helper.py"
          export ISP_MONIC_SIX_HELPER="$RUNNER_TEMP/isp-monic-six-helper.py"
          python -u "$RUNNER_TEMP/isp-equal-six-driver.py" --checkout "$PWD" --source "$RUNNER_TEMP/isp-equal-six-source.py" --expected-blob "$ISP_BLOB" --seconds 135
