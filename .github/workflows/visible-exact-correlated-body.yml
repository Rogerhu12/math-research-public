name: visible-exact complete correlated regular body residual

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-correlated-body.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-correlated-body
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VISIBLE_BODY_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-body-CI-pinned-inputs.json
  VISIBLE_BODY_MANIFEST_SHA: c214f800a5094c905c554e9053c52567d5ae5d76be41ac2e3fe9d673b396d784

jobs:
  prepare:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 350
    outputs:
      artifact_name: ${{ steps.paths.outputs.artifact_name }}
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the original body worker and its exact manifest
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-body-CI-pinned-inputs.json
      - name: Fetch only the pinned original scientific inputs
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_body_CI_worker.py
          --mode hydrate --manifest "$VISIBLE_BODY_MANIFEST" --manifest-sha "$VISIBLE_BODY_MANIFEST_SHA"
      - name: Install the original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible original-trial artifact paths
        id: paths
        run: |
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-body-prepared" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "visible-exact-body-prepared-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Reconstruct all original Hermite bytes from the fixed complete nodal answers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_body_CI_worker.py
          --mode prepare --manifest "$VISIBLE_BODY_MANIFEST" --manifest-sha "$VISIBLE_BODY_MANIFEST_SHA"
          --work "$RUNNER_TEMP/visible-exact-body-prepare-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-body-prepared"
          --compute-minutes 310 --checkpoint-minutes 10
      - name: Pass the complete original trials as an Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.artifact_name }}
          path: ${{ steps.paths.outputs.prepared }}/
          compression-level: 1
          retention-days: 7
          if-no-files-found: error
      - name: Preserve actual reconstruction evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-body-prepare-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.prepared }}/evidence/
            ${{ steps.paths.outputs.prepared }}/process.json
            ${{ steps.paths.outputs.prepared }}/producer.stdout.log
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn

  body-range:
    needs: prepare
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - first: 257
            end: 1200
          - first: 1200
            end: 2133
          - first: 2133
            end: 3066
          - first: 3066
            end: 4000
          - first: 4000
            end: 5000
          - first: 5000
            end: 6000
          - first: 6001
            end: 6860
          - first: 6860
            end: 7721
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the unchanged row producer and manifest
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-body-CI-pinned-inputs.json
      - name: Fetch the pinned inputs and previous actual body checkpoints
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_body_CI_worker.py
          --mode hydrate --manifest "$VISIBLE_BODY_MANIFEST" --manifest-sha "$VISIBLE_BODY_MANIFEST_SHA"
      - name: Install the original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible row and input paths
        id: paths
        run: |
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-body-bundle" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-body-${{ matrix.first }}-${{ matrix.end }}" >> "$GITHUB_OUTPUT"
      - name: Receive the exact complete common trials
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ steps.paths.outputs.prepared }}
      - name: Consume disjoint original closed rows and publish real outcomes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_body_CI_worker.py
          --mode consume --manifest "$VISIBLE_BODY_MANIFEST" --manifest-sha "$VISIBLE_BODY_MANIFEST_SHA"
          --first ${{ matrix.first }} --end ${{ matrix.end }}
          --prepared "$RUNNER_TEMP/visible-exact-body-bundle"
          --work "$RUNNER_TEMP/visible-exact-body-work-${{ matrix.first }}-${{ matrix.end }}"
          --artifact-dir "$RUNNER_TEMP/visible-exact-body-${{ matrix.first }}-${{ matrix.end }}"
          --compute-minutes 310 --checkpoint-minutes 10
      - name: Preserve every normal or failed body prefix and real process record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-body-rows-${{ matrix.first }}-${{ matrix.end }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
