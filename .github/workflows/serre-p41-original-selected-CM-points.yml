name: Serre p41 original selected CM points

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R804-public-original-selected-CM-points-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R804-original-selected-CM-points
  cancel-in-progress: false

jobs:
  original_selected_cm_points:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-selected-CM-points.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R804_original_selected_CM_points.py
            /topics/serre-uniformity/scripts/R804_public_original_selected_CM_points.py
            /topics/serre-uniformity/scripts/R754_original_periods_and_Hom_kernel.py
            /topics/serre-uniformity/scripts/R786_public_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R804-public-original-selected-CM-points-request.json
            /topics/serre-uniformity/notes/R804-original-CM-point-consumer-interface.md
            /topics/serre-uniformity/results/R804-original-selected-map-reuse-in-integral-cyclic-module.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax without executing mathematics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("R804_original_selected_CM_points.py", "R804_public_original_selected_CM_points.py"):
              path = Path("topics/serre-uniformity/scripts") / name
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Evaluate the eight original Hom additions at the certified original beta
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R804_public_original_selected_CM_points.py compute
      - name: Transfer the active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R804-original-selected-CM-point-values-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R804-original-selected-CM-point-values/output
          retention-days: 1
          if-no-files-found: warn
      - name: Require all five original points and the actual isogeny image
        if: always()
        run: python topics/serre-uniformity/scripts/R804_public_original_selected_CM_points.py verify
