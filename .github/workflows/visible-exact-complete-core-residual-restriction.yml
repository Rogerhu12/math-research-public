name: visible-exact complete core residual restriction

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-complete-core-residual-restriction.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-core-residual-restriction
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CRF_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete-core-residual-restriction-CI-inputs.json
  CRF_MANIFEST_SHA: 88a732839ec83e5661efdf7417d163b46784c7f4865f658463ba4b6540aabbf9
  CRF_PIPELINE_SHA: 59f9130e024c51ce63b6138960535f986d0eaaa63dd724a1015a55729ff98f54
  CRF_WORKER_SHA: 96401306459ceadca70659876f9219477c98098cd5a49d7fbd64a53775585a1d
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  complete-core-residual-restriction:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_core_residual_restriction_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete-core-residual-restriction-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_core_residual_restriction_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['CRF_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate only small source proof and provenance texts
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_core_residual_restriction_public_worker.py --mode hydrate
          --manifest "$CRF_MANIFEST" --manifest-sha "$CRF_MANIFEST_SHA"
          --pipeline-sha "$CRF_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new saved-row consumer before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,json,os,pathlib
          manifest=json.loads(pathlib.Path(os.environ['CRF_MANIFEST']).read_text())
          for role in ('source',):
              item=next(x for x in manifest['file_receipts'] if x['role']==role)
              p=pathlib.Path(item['path'])
              assert len(p.read_bytes())==item['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
              ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the pinned directed arithmetic runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Restore three original byte parts and evaluate only the new core restriction
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_core_residual_restriction_public_worker.py --mode run
          --manifest "$CRF_MANIFEST" --manifest-sha "$CRF_MANIFEST_SHA"
          --pipeline-sha "$CRF_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-complete-core-residual-restriction-science"
          --out-dir "$RUNNER_TEMP/visible-exact-complete-core-residual-restriction-output"
      # Root rule15: the three original Git byte parts are temporary read-only inputs.
      # No upload-artifact, Release upload, native or per-row numerical-data commit.
      # Complete science is atomically saved and printed before publication-size guards.
      # The actual topic capacity must retain120000 bytes before any new arithmetic.
