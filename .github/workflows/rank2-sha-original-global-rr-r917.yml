name: Rank2 complete original global RR integral q lattice
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rank2-sha-original-global-rr-r917.yml'
      - 'topics/rank2-sha-infinitely-many-p/scripts/produce-r917-original-global-rr-q-lattice.py'
      - 'topics/rank2-sha-infinitely-many-p/ci/original-global-rr-r917-request.json'
      - 'topics/rank2-sha-infinitely-many-p/scripts/original_pari_m2_basis.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rank2-original-global-rr-r917
  cancel-in-progress: false
jobs:
  original-global-rr-r917:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/rank2-sha-infinitely-many-p/README.md
            /topics/rank2-sha-infinitely-many-p/scripts/produce-r917-original-global-rr-q-lattice.py
            /topics/rank2-sha-infinitely-many-p/scripts/original_pari_m2_basis.py
            /topics/rank2-sha-infinitely-many-p/ci/original-global-rr-r917-request.json
          persist-credentials: false
      - name: Saturate the same complete rational M2 and return the full original global RR lattice
        shell: bash
        run: |
          set -euo pipefail
          RANK2_IMAGE='sagemath/sagemath@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb'
          RANK2_CONTAINER="rank2-r917-rr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup_rank2_rr() {
            docker rm -f "$RANK2_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_rank2_rr EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          docker pull "$RANK2_IMAGE"
          RANK2_ROOT_README_SHA="$(git rev-parse HEAD:README.md)"
          RANK2_TOPIC_README_SHA="$(git rev-parse HEAD:topics/rank2-sha-infinitely-many-p/README.md)"
          timeout --kill-after=30s 21000 docker run --rm --name "$RANK2_CONTAINER" --network none \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e RANK2_SOURCE_SHA="$GITHUB_SHA" \
            -e RANK2_RUN_ID="$GITHUB_RUN_ID" \
            -e RANK2_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e RANK2_ROOT_README_SHA="$RANK2_ROOT_README_SHA" \
            -e RANK2_TOPIC_README_SHA="$RANK2_TOPIC_README_SHA" \
            -e RANK2_IMAGE="$RANK2_IMAGE" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e OMP_NUM_THREADS=4 \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            --entrypoint /usr/bin/sage "$RANK2_IMAGE" -python -c \
            'import json,runpy,sys; p="topics/rank2-sha-infinitely-many-p/"; sys.path.insert(0,p+"scripts"); sys.argv=[p+"scripts/produce-r917-original-global-rr-q-lattice.py"]+json.load(open(p+"ci/original-global-rr-r917-request.json"))["arguments"]; runpy.run_path(sys.argv[0],run_name="__main__")'
