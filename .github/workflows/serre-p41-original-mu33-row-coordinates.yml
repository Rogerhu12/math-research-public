name: Serre p41 original mu33 row coordinates

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R798-public-original-mu33-row-coordinates-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R798-original-mu33-row-coordinates
  cancel-in-progress: false

jobs:
  original_mu33_row_coordinates:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-mu33-row-coordinates.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R798_original_mu33_row_coordinates.py
            /topics/serre-uniformity/scripts/R798_public_original_mu33_row_coordinates.py
            /topics/serre-uniformity/scripts/R786_public_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R798-public-original-mu33-row-coordinates-request.json
            /topics/serre-uniformity/notes/R798-original-mu33-row-coordinate-method.md
            /topics/serre-uniformity/results/R798-original-power6-row-coordinate-interface.md
            /topics/serre-uniformity/results/R793-original-RR-pole-divisors-and-CM-local-algebra.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Certify the short coordinates and required original anchor products
        continue-on-error: true
        timeout-minutes: 337
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R798_public_original_mu33_row_coordinates.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R798-original-mu33-row-coordinates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R798-original-mu33-row-coordinates/output
          retention-days: 1
          if-no-files-found: warn
      - name: Require the actual short minor and all 690 full product checks
        if: always()
        run: python topics/serre-uniformity/scripts/R798_public_original_mu33_row_coordinates.py verify

