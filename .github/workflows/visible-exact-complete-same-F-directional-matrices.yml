          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --group ${{ matrix.group }}
          --prepared-artifact "$RUNNER_TEMP/visible-exact-complete-same-F-inputs/prepared"
          --reference-artifact "$RUNNER_TEMP/visible-exact-complete-same-F-inputs/reference"
          --frame-slice "$RUNNER_TEMP/visible-exact-complete-same-F-inputs/frames"
          --work "$RUNNER_TEMP/visible-exact-complete-same-F-work"
