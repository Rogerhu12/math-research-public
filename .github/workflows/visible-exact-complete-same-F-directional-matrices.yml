name: visible-exact complete same-F directional matrices

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_same_F_directional_matrices.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_same_F_directional_matrices_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-same-F-directional-matrix-CI-inputs.json'
      - '.github/workflows/visible-exact-complete-same-F-directional-matrices.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-same-F-directional-matrices
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  MATRIX_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-same-F-directional-matrix-CI-inputs.json
  MATRIX_MANIFEST_SHA: a9e1b1646031d1cfdb3472570228920730e8a3736819a257746a2960138e50fc
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  prepare:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 60
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-same-F-directional-matrix-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate all117 pins with the original112 scientific inputs unchanged
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$MATRIX_MANIFEST" --manifest-sha "$MATRIX_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/complete_same_F_directional_matrices_ci/
      - name: Parse the new source and worker before new mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_complete_same_F_directional_matrices.py','fourfold_codazzi_complete_same_F_directional_matrices_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('Canonical matrix source and worker parsed; original target, validator and four successful matrices stay frozen.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible input and output paths
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-complete-same-F-output" >> "$GITHUB_OUTPUT"
          printf 'inputs=%s\n' "$RUNNER_TEMP/visible-exact-complete-same-F-inputs" >> "$GITHUB_OUTPUT"
      - name: Download the complete original5970 local-reference profile
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-complete-5970-projectors-43594139132-1
          repository: Rogerhu12/math-research-public
          run-id: 43594139132
          github-token: ${{ github.token }}
          path: ${{ steps.paths.outputs.inputs }}/projectors/
      - name: Download only the four actual successful same-F matrix data
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-same-F-matrix-Gram-pilot-43648579604-1
          repository: Rogerhu12/math-research-public
          run-id: 43648579604
          github-token: ${{ github.token }}
          path: ${{ steps.paths.outputs.inputs }}/pilot/
      - name: Actual plan with real pull and README differences every10minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_same_F_directional_matrices_CI.py
          --phase plan
          --manifest "$MATRIX_MANIFEST" --manifest-sha "$MATRIX_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --projector-artifact "$RUNNER_TEMP/visible-exact-complete-same-F-inputs/projectors"
          --pilot-artifact "$RUNNER_TEMP/visible-exact-complete-same-F-inputs/pilot"
          --work "$RUNNER_TEMP/visible-exact-complete-same-F-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-complete-same-F-output"
          --compute-minutes 40 --checkpoint-minutes 10
      - name: Require actual nonempty evidence and bounded inventory parts
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty complete-matrix evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,
                        sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          for number,first in enumerate(range(0,len(entries),128)):
              raw=(json.dumps(entries[first:first+128],indent=2)+'\n').encode()
              if len(raw)>60000:raise RuntimeError('one actual artifact inventory part exceeds60000 bytes')
              (root/f'artifact-inventory-{number:03d}.json').write_bytes(raw)
          print(dict(actual_files=len(files),inventory_parts=(len(entries)+127)//128))
          PY_INVENTORY
      - name: Preserve all actual mathematical bytes and successful prefixes
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-complete-same-F-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 90
          if-no-files-found: error

  ranges:
