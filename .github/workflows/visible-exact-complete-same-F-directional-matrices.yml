          - {group: 6, slice: 3}
          - {group: 7, slice: 3}
          - {group: 8, slice: 4}
          - {group: 9, slice: 4}
          - {group: 10, slice: 5}
          - {group: 11, slice: 5}
          - {group: 12, slice: 6}
          - {group: 13, slice: 6}
          - {group: 14, slice: 7}
          - {group: 15, slice: 7}
          - {group: 16, slice: 8}
          - {group: 17, slice: 8}
          - {group: 18, slice: 9}
          - {group: 19, slice: 9}
          - {group: 20, slice: 10}
          - {group: 21, slice: 10}
          - {group: 22, slice: 11}
          - {group: 23, slice: 11}
          - {group: 24, slice: 12}
          - {group: 25, slice: 12}
          - {group: 26, slice: 13}
          - {group: 27, slice: 13}
          - {group: 28, slice: 14}
          - {group: 29, slice: 14}
          - {group: 30, slice: 15}
