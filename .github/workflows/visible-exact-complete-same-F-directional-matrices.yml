          printf 'inputs=%s\n' "$RUNNER_TEMP/visible-exact-complete-same-F-inputs" >> "$GITHUB_OUTPUT"
      - name: Download the exact completed matrix plan and original5970 profile
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-complete-same-F-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.inputs }}/prepared/
      - name: Download only the assigned original full-reference range
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-cut-projector-cells-${{ matrix.slice }}-43594139132-1
          repository: Rogerhu12/math-research-public
          run-id: 43594139132
          github-token: ${{ github.token }}
          path: ${{ steps.paths.outputs.inputs }}/reference/
      - name: Download only the matching original unmodified Q slice
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-${{ matrix.slice }}-43594139132-1
          repository: Rogerhu12/math-research-public
          run-id: 43594139132
