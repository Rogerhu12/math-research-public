name: visible-exact complete inner first Airy sources from accepted Taylor

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-inner-first-Airy-complete-sources.yml']
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Optional exact inner-source run whose accepted source rows will be reused'
        required: false
        type: string
        default: ''
      resume_attempt:
        description: 'Original attempt for the optional exact prefix artifact'
        required: false
        type: string
        default: '1'

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-inner-first-Airy-complete-sources
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-inner-first-Airy-complete-sources-CI-inputs.json
  PHASE_MANIFEST_SHA: 373af63c2d6357a01210dc2d746d26fea79758f6c9068f5bef68d06c671ecef6
  PHASE_WORKER_SHA: c6aecd7d069812d7f687fd6be59fc66974ce9f11f8372041eeaa023eb646723e
  PHASE_PIPELINE_SHA: 3a3a68c9f30ae00b543101e6c8ac832bc2fa347508a8b00ffb644d9a420dbf28
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-inner-first-Airy-complete-sources:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_inner_first_Airy_complete_sources_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-inner-first-Airy-complete-sources-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Verify the exact complete worker before hydration
        run: |
          python - <<'PY_WORKER'
          import hashlib,os,pathlib
          path=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_inner_first_Airy_complete_sources_public_worker.py')
          if hashlib.sha256(path.read_bytes()).hexdigest()!=os.environ['PHASE_WORKER_SHA']:
              raise SystemExit('the complete public worker changed')
          PY_WORKER
      - name: Hydrate59 exact inputs while preserving original28 and23 pins
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_inner_first_Airy_complete_sources_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the complete pinned import closure before new mathematics
        run: |
          python - <<'PY_SOURCE'
          import ast,json,os,pathlib
          manifest=json.loads(pathlib.Path(os.environ['PHASE_MANIFEST']).read_text())
          for entry in manifest['files']:
              path=pathlib.Path(entry['path'])
              if path.suffix=='.py':ast.parse(path.read_text(),filename=str(path))
          PY_SOURCE
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5
      - name: Set the actual result path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-inner-first-Airy-complete-sources-output" >> "$GITHUB_OUTPUT"
      - name: Prepare a separate optional prefix directory
        run: mkdir -p "$RUNNER_TEMP/visible-exact-inner-first-Airy-complete-sources-prepared"
      - name: Restore an explicitly selected exact inner source prefix
        if: ${{ inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-inner-first-Airy-complete-sources-${{ inputs.resume_run }}-${{ inputs.resume_attempt }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-inner-first-Airy-complete-sources-prepared/resume
      - name: Reuse all old profiles and rows; evaluate only new inner source bounds and preserve every outcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_inner_first_Airy_complete_sources_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-inner-first-Airy-complete-sources-science"
          --prepared "$RUNNER_TEMP/visible-exact-inner-first-Airy-complete-sources-prepared"
          --out-dir "$RUNNER_TEMP/visible-exact-inner-first-Airy-complete-sources-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-inner-first-Airy-complete-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
