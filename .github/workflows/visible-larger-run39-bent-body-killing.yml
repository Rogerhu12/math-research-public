name: Run 39 whole bent-body intrinsic Killing field search

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-larger-amplitude/computations/run39-bent-body-killing-request.json'
      - '.github/workflows/visible-larger-run39-bent-body-killing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-larger-run39-bent-body-killing
  cancel-in-progress: false

jobs:
  finite_amplitude:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the triggering public source commit
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/README.md
            /topics/visible-flex-larger-amplitude/HANDOFF.md
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/publish_r734_exact_conclusion.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/publish_r738_exact_gap.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/run36_bent_disk_actions.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/observe_bent_disk_search.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r740_rolled_disk_seed.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r742_tilted_disk_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r744_extruded_closed_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r745_equal_meridian_jacobi_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_body_killing.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_body_atlas.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_body_ambient.py
            /topics/visible-flex-larger-amplitude/computations/bent-body-killing-design-v1.json
            /topics/visible-flex-larger-amplitude/computations/run39-bent-body-killing-request.json
            /topics/visible-flex-larger-amplitude/notes/run39-bent-body-killing-*.json
      - name: Select the pinned public numerical Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14
      - name: Execute all whole-body Killing stages and record the actual returned field
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
          RUN39_PYTHON_SETUP: ${{ steps.python.outcome }}
        shell: bash
        run: >-
          python -u topics/visible-flex-larger-amplitude/scripts/resume_20261128/observe_bent_disk_search.py
          --request topics/visible-flex-larger-amplitude/computations/run39-bent-body-killing-request.json
          --setup-conclusion "$RUN39_PYTHON_SETUP"
