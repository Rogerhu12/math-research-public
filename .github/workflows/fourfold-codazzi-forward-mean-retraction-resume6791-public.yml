name: R144 finish signed forward mean retraction suffix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-forward-mean-retraction-resume6791-public.yml

permissions:
  contents: write

concurrency:
  group: r144-forward-mean-retraction-resume6791-v1
  cancel-in-progress: false

jobs:
  complete-signed-forward-mean-suffix:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_forward_mean_retraction_resume6791_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-26-R144-forward-mean-retraction-resume6791-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the fixed directed runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5
      - name: Restore saved prefix and enclose only the unfinished forward suffix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_forward_mean_retraction_resume6791_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-26-R144-forward-mean-retraction-resume6791-inputs.json --manifest-sha f71c080384eac9583eac533cc589be01a29a04d0dd1ce5a7d3912de467a8e87c
