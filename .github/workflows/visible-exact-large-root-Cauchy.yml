name: visible-exact full real large-root Cauchy energies

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-large-root-Cauchy.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-large-root-Cauchy
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  ENERGY_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-large-root-Cauchy-CI-inputs.json
  ENERGY_MANIFEST_SHA: 89671a532e1102c9b94a20fd111ac0f92bca6dc91cae1042e325a8ca53fc7c49
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  energies:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 50
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out frozen entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-large-root-Cauchy-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate only pinned text and owned original scalar prefixes
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_large_root_Cauchy_CI.py
          --mode hydrate --manifest "$ENERGY_MANIFEST" --manifest-sha "$ENERGY_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
      - name: Parse new sources before numerical work
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_large_root_Cauchy_budget.py','fourfold_codazzi_large_root_Cauchy_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('Both new scalar consumer sources parsed; mathematics has not run.')
          PY_AST
      - name: Install the frozen directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual artifact paths
        id: paths
        run: |
          printf 'root=%s\n' "$RUNNER_TEMP/visible-exact-large-Cauchy-root" >> "$GITHUB_OUTPUT"
          printf 'body=%s\n' "$RUNNER_TEMP/visible-exact-large-Cauchy-body" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-large-Cauchy-output" >> "$GITHUB_OUTPUT"
      - name: Receive the successful complete1300 root rows and actual child process
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43616813816
          name: visible-exact-piecewise-real-root-fold-resume-v2-43616813816-1
          path: ${{ steps.paths.outputs.root }}
      - name: Receive original intrinsic parts2389 through3066 without recomputation
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43583838026
          name: visible-exact-body-rows-2133-3066-43583838026-1
          path: ${{ steps.paths.outputs.body }}/visible-exact-body-rows-2133-3066-43583838026-1
      - name: Receive original intrinsic parts3066 through3834 without recomputation
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43583838026
          name: visible-exact-body-rows-3066-4000-43583838026-1
          path: ${{ steps.paths.outputs.body }}/visible-exact-body-rows-3066-4000-43583838026-1
      - name: Evaluate only new complete common-row scalar energies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_large_root_Cauchy_CI.py
          --mode run --manifest "$ENERGY_MANIFEST" --manifest-sha "$ENERGY_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --root-artifact "$RUNNER_TEMP/visible-exact-large-Cauchy-root"
          --body-artifacts "$RUNNER_TEMP/visible-exact-large-Cauchy-body"
          --work "$RUNNER_TEMP/visible-exact-large-Cauchy-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-large-Cauchy-output"
          --compute-minutes 30 --checkpoint-minutes 10
      - name: Require actual nonempty evidence and small inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('No actual nonempty process evidence exists')
          rows=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          raw=(json.dumps(rows,indent=2)+'\n').encode()
          if len(raw)>60000:raise RuntimeError('Inventory exceeds60000 bytes; retain all original evidence')
          (root/'artifact-inventory.json').write_bytes(raw)
          print(dict(actual_files=len(files),inventory_bytes=len(raw)))
          PY_INVENTORY
      - name: Preserve all actual native bytes and failure prefixes
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-large-root-Cauchy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
