name: R149 signed primitive fees for the original positive i model
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visible-exact-original-positive-i-after-gate-list.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: visible-exact-original-positive-i-after-gate-list
  cancel-in-progress: false
jobs:
  consume-saved-original-1502-candidates:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/visible-exact-original-positive-i-after-gate-list.yml
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/notes/2026-11-28-read-public-model-ultra-rules.json
            /topics/visible-flex-exact-nearby/notes/finite_Cayley_scalar_gap_ci/run-43757868884-1/actual-scientific-conclusion.json
            /topics/visible-flex-exact-nearby/notes/finite_Cayley_scalar_gap_ci/run-43757868884-1/execution.json
            /topics/visible-flex-exact-nearby/notes/first_symbol_quadratic_gap_ci/run-43598755503-1/consumers/process.json
            /topics/visible-flex-exact-nearby/notes/first_symbol_quadratic_gap_ci/run-43598755503-1/publication.json
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_actual_positive_i_model_fees.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_actual_positive_i_after_gate_list.py
      - name: Combine the complete original positive i group with all remaining frequencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 -B topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_actual_positive_i_after_gate_list.py
          --repo "$GITHUB_WORKSPACE" --source-sha e74ea3951ad6b9800751140f6da3d01184f8824d7e087432b45db399de4b8ae4
