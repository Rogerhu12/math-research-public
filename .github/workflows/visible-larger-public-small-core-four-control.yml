name: visible-larger four-control scalar design with complete three resonances
'on':
  push:
    branches:
    - main
    paths:
    - topics/visible-flex-larger-amplitude/computations/public-small-core-four-control-request.json
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: visible-larger-public-small-core-four-control
  cancel-in-progress: false
jobs:
  compute:
    name: Actual114 three literal parameters plus new odd theta control
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    outputs:
      scalar_summary: ${{ steps.scalar.outputs.scalar_summary }}
      scalar_summary_bytes: ${{ steps.scalar.outputs.scalar_summary_bytes }}
      scalar_summary_sha256: ${{ steps.scalar.outputs.scalar_summary_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        filter: blob:none
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /README.md
          /topics/visible-flex-larger-amplitude/*.md
          /topics/visible-flex-larger-amplitude/computations/
          /topics/visible-flex-larger-amplitude/notes/public-actions-43580643038-1-free3/stage-00/actual.json.gz
          /topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-prepare112/preparation112/prepared.json.gz
          /topics/visible-flex-larger-amplitude/notes/public-actions-43592195185-1-coupling112banded/full-DN112/outer-00-anchor-tail.json.gz
          /topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-prepare112/T112-config.json
    - name: Establish independent temporary metadata paths
      run: |
        git config gc.auto 0
        git config gc.autoPackLimit 0
        git config maintenance.auto false
        git config --global merge.stat false
        mkdir -p "$RUNNER_TEMP/visible-small-core-four-control-curved"
        echo "VISIBLE_OUT=$RUNNER_TEMP/visible-small-core-four-control-curved" >> "$GITHUB_ENV"
        echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.14
    - name: Install unchanged original operator runtime
      run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
    - name: Bind true114 recipe and all79 primary plus2 metadata support sources
      run: |
        python - <<'PYPINS'
        import ast,hashlib,json,os,subprocess
        from pathlib import Path,PurePosixPath
        repo=Path.cwd();comp=Path(os.environ['VISIBLE_COMPUTATIONS']);out=Path(os.environ['VISIBLE_OUT'])
        raw=(comp/'public-small-core-four-control-request.json').read_bytes();request=json.loads(raw)
        assert request['repository']=='Rogerhu12/math-research-public' and request['request_number']==115
        assert request['schema']=='public-small-core-four-control-curved-recipe-request-v1'
        assert request['lanes']==['smallcoreresonance']
        entry='geometry_20261115_small_core_four_control_curved_recipe.py'
        assert request['execution_entry']==entry
        assert request['source_sha256'][entry]=='3ca1bdf723e7c44f808ed786ccda854775c262d28ce92804fde2c8ca86cad160'
        assert request['source_sha256']['geometry_20261115_small_core_four_control_family.py']=='9222390b73abbd2e8bc4a1f8e9d8b861cd66b4a927b21629deb2e6b70073dd11'
        assert request['source_sha256']['geometry_20261115_small_core_full3_curved_normal_recipe.py']=='be37ce213ddfd87972b5edc241a0b220fe0f424c553f5836b5df337ff1dd980e'
        assert request['source_sha256']['geometry_20261115_small_core_full3_trust_recipe.py']=='5d3540150390f0e820200ba4a210eb2bc8d06bc025a0a677160df97d72e6f4c1'
        assert request['source_sha256']['geometry_20261115_small_core_full3_retry_trust_recipe.py']=='b9fff58becdfdcfdb4877cd789a3160510c7c2895005239d8989bb7673c2ea20'
        assert request['scientific_entry']==entry
        assert request['source_sha256']['geometry_20261115_small_core_inexact_p3_eta_0p01_recipe.py']=='3169b2d3ea821a244d9f27611cd6c5cb3b239cf0e7f9bbbd7f49ac9d5f1dc9ee'
        expected={'parameters': [0.46303184038373296, -0.19282285521524933, 0.6316435963633119, 0.0], 'backtracks': 20, 'candidate_resonance_tolerance': 1e-08, 'interval_bits': 160, 'interval_depth': 14, 'original_mesh_nodes': 699, 'field_modes': 112, 'tail_modes': 112, 'physical_angle_grid': 2048, 'material_and_boundary_angles': 4096, 'original_RHS_workers': 1, 'initial_relative_radius': 0.1, 'candidate_steps': 8, 'normal_iterations': 12, 'normal_backtracks': 20, 'normal_target_tolerance': 1e-08}
        assert request['diagnostic']==expected
        for path,blob in request['reviewed_README_blobs'].items():
         assert subprocess.check_output(['git','hash-object',path],text=True).strip()==blob,'README changed: read and apply new rules'
        handoff=(repo/'topics/visible-flex-larger-amplitude/HANDOFF.md').read_bytes()
        assert len(handoff)<=10000 and sum(line.startswith('规则同步记录：'.encode()) for line in handoff.splitlines())==1,'Retain the existing unique rule-sync line; do not bypass original Runner'
        verified=[]
        for group,expected_count in [('source_sha256',79),('workflow_support_source_sha256',2)]:
         assert len(request[group])==expected_count
         for name,digest in request[group].items():
          assert PurePosixPath(name).name==name
          b=(comp/name).read_bytes();assert hashlib.sha256(b).hexdigest()==digest,name
          if name.endswith('.py'):compile(ast.parse(b,filename=name),name,'exec')
          verified.append(dict(group=group,file=name,bytes=len(b),sha256=digest))
        closure=request['source_closure']['current_producer']
        assert len(closure)==22 and len(request['source_closure']['origin_producer'])==18
        assert all(request['source_sha256'][name]==digest for name,digest in closure.items())
        item=request['parameter_recipe'];p=repo/item['file'];recipe_raw=p.read_bytes()
        assert len(recipe_raw)==1490==item['bytes']
        assert hashlib.sha256(recipe_raw).hexdigest()==item['sha256']=='becfe390c6f5a8a49905fb2269357a3bd16172492c4ed15e569489c2d1f9299f'
        recipe=json.loads(recipe_raw)
        assert recipe['schema']=='R259-explicit-four-control-odd-shape-recipe-v1'
        assert recipe['literal_parameters']==expected['parameters'] and recipe['origin']==item['origin']
        assert recipe['family']==item['family']
        assert recipe['family']==dict(schema='second-original-support-odd-C2-control-v1',support_index=1,original_controls=3,new_parameter_count=4,formula='b2(x)*(2*x-1)',theta_zero_reduces_to_original=True)
        assert len(recipe['literal_parameters'])==4 and recipe['literal_parameters'][3]==0
        assert request['new_scalar_family']['theta_zero_bitwise_equality_is_not_an_acceptance_or_execution_gate'] is True
        assert recipe['origin']['run_id']=='43687426018' and recipe['origin']['source_commit']=='dc032461bbd2f3f7515ea30e5495b50870a06f65'
        assert recipe['input_sha256']=={k:v['sha256'] for k,v in request['inputs'].items()}
        history=request['original_input_history_commit'];fetched=False
        def original(item):
         global fetched
         rel=PurePosixPath(item['file'])
         assert not rel.is_absolute() and '..' not in rel.parts and str(rel).startswith('topics/visible-flex-larger-amplitude/')
         p=repo/str(rel)
         if not p.is_file():
          if not fetched:
           subprocess.run(['git','fetch','--filter=blob:none','--no-tags','origin',history],check=True)
           fetched=True
          b=subprocess.check_output(['git','show',history+':'+str(rel)])
          p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
         b=p.read_bytes()
         assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256'],str(rel)
        for item in request['inputs'].values():original(item)
        head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        assert head==os.environ['GITHUB_SHA']
        print(json.dumps(dict(event='request115-source-input-identity',source_commit=head,request_sha256=hashlib.sha256(raw).hexdigest(),source_count=79,workflow_support_source_count=2,origin_child_source_count=18,current_child_source_count=22,parameter_recipe_sha256=request['parameter_recipe']['sha256'],old_publisher_executed=False,raw_output_retention=False)),flush=True)
        PYPINS
    - name: Restore original78 public numerical source files once
      run: |
        PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYSOURCE'
        import os
        from pathlib import Path
        from exact_20261114_public_resume import prepare_public_source
        source=prepare_public_source(Path.cwd(),Path(os.environ['RUNNER_TEMP'])/'small-core-four-control-curved-original-source',Path(os.environ['VISIBLE_OUT']))
        with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
        PYSOURCE
    - name: New four-control family and complete three-row curved candidates with real rules sync
      id: science
      timeout-minutes: 75
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PYTHONPATH="$VISIBLE_COMPUTATIONS" python -u - <<'PYRUN'
        import hashlib,json,os,sys
        from pathlib import Path
        import root_20261114_current576_rules_runner as runner
        comp=Path(os.environ['VISIBLE_COMPUTATIONS']).resolve();repo=Path(os.environ['GITHUB_WORKSPACE']);out=Path(os.environ['VISIBLE_OUT'])
        request=json.loads((comp/'public-small-core-four-control-request.json').read_text())
        if Path(runner.__file__).resolve()!=comp/'root_20261114_current576_rules_runner.py':
         raise ValueError('Use the pinned original metadata runner')
        wanted_source=request['workflow_support_source_sha256']['root_20261114_current576_rules_runner.py']
        if hashlib.sha256(Path(runner.__file__).read_bytes()).hexdigest()!=wanted_source:
         raise ValueError('Original rules runner source changed')
        wanted=request['reviewed_README_blobs']
        if set(wanted)!={'README.md','topics/visible-flex-larger-amplitude/README.md'}:
         raise ValueError('Both explicitly reviewed README identities are required')
        baselines={}
        for name,expected in wanted.items():
         raw=(repo/name).read_bytes()
         blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
         if blob!=expected:raise ValueError('Reviewed README bytes changed: '+name)
         baselines[name]=dict(blob=blob,text=raw.decode('utf-8'))
        old={name:item['blob'] for name,item in runner.BASELINES.items()}
        runner.BASELINES=baselines
        print(json.dumps(dict(event='request115_explicit_rules_baseline_update',unchanged_runner_sha256=wanted_source,old_embedded_blobs=old,reviewed_current_blobs=wanted,period_seconds=runner.PERIOD_SECONDS,original_pull_rebase_diff_and_stop_on_new_rules_retained=True)),flush=True)
        argv=[sys.executable,'-u',str(comp/request['execution_entry'])]
        for key in ('accepted','prepared','tail_anchor','tail_config'):
         argv+=['--'+key.replace('_','-'),str(repo/request['inputs'][key]['file'])]
        argv+=['--parameter-recipe',str(repo/request['parameter_recipe']['file']),'--parameter-recipe-sha256',request['parameter_recipe']['sha256']]
        for key in ('initial_relative_radius','candidate_steps','backtracks','normal_iterations','normal_backtracks','normal_target_tolerance','candidate_resonance_tolerance','interval_bits','interval_depth'):
         argv+=['--'+key.replace('_','-'),str(request['diagnostic'][key])]
        argv+=['--out',str(out/request['output_directory'])]
        print(json.dumps(dict(event='request115_four_control_full3_curved_argv',argv=argv,new_four_control_g_family=True,complete_three_by_four_response=True,complete_two_normal_two_tangent_path=True,theta_zero_comparison_is_not_gate=True,rejected_direction_multiplier=.25,eight_total_directions_count_rejections=True,p3_restoration_called=False,inner_target_not_outer_gate=True,normal_iterations=12,normal_backtracks=20,scientific_source_sha256=request['source_sha256'][request['scientific_entry']])),flush=True)
        sys.argv=[runner.__file__,'--out',str(out/'rule-sync'),'--command',*argv]
        raise SystemExit(runner.main())
        PYRUN
    - name: Pass compact original scalars to separate report job
      id: scalar
      if: always()
      run: |
        python "$VISIBLE_COMPUTATIONS/root_20261115_small_core_four_control_curved_scalar_readout.py" \
          --directory "$VISIBLE_OUT/small-core-four-control-curved" \
          --rules-directory "$VISIBLE_OUT/rule-sync" \
          --compute-outcome "${{ steps.science.outcome }}"
    - name: Remove temporary recomputable scientific payloads after scalar readout
      if: always()
      run: |
        python - <<'PYCLEAN'
        import json,os,shutil
        from pathlib import Path
        base=Path(os.environ['VISIBLE_OUT']).resolve();target=base/'small-core-four-control-curved'
        if target.is_symlink():raise ValueError('Do not follow a cleanup symlink')
        if target.is_dir():shutil.rmtree(target)
        print(json.dumps(dict(event='request115_temporary_scientific_payloads_removed',relative_directory=target.name,raw_artifact_or_Release_upload=False)),flush=True)
        PYCLEAN
  report:
    name: Small original scalar readout only
    needs:
    - compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
    - name: Print bounded original summary and exact output SHA
      env:
        SCALAR_SUMMARY: ${{ needs.compute.outputs.scalar_summary }}
        SCALAR_SUMMARY_BYTES: ${{ needs.compute.outputs.scalar_summary_bytes }}
        SCALAR_SUMMARY_SHA256: ${{ needs.compute.outputs.scalar_summary_sha256 }}
        COMPUTE_RESULT: ${{ needs.compute.result }}
      run: |
        python3 - <<'PYREPORT'
        import hashlib,json,os
        text=os.environ.get('SCALAR_SUMMARY','')
        if not text:
         payload=dict(schema='request115-compute-output-unavailable-v1',compute_job_result=os.environ.get('COMPUTE_RESULT'),run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],scientific_completion_not_claimed=True)
         raw=json.dumps(payload,sort_keys=True,separators=(',',':')).encode()
        else:
         raw=text.encode('utf-8')
         if len(raw)>90000:raise ValueError('Compute job output exceeded the explicit small summary bound')
         if len(raw)!=int(os.environ['SCALAR_SUMMARY_BYTES']) or hashlib.sha256(raw).hexdigest()!=os.environ['SCALAR_SUMMARY_SHA256']:
          raise ValueError('The original compute-to-report JSON output identity changed')
         json.loads(raw)
        print('BEGIN_VISIBLE115_SCALAR_SUMMARY')
        print(raw.decode('utf-8'))
        print('END_VISIBLE115_SCALAR_SUMMARY')
        print(json.dumps(dict(event='visible115-scalar-summary-sha256',bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),hash_scope='UTF-8 JSON string excluding log separator LF',compute_job_result=os.environ.get('COMPUTE_RESULT'),run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'])),flush=True)
        PYREPORT

