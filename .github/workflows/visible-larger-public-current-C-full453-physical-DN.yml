          import hashlib,importlib.util,json,os,sys
          from pathlib import Path
          comp=Path(os.environ['VISIBLE_COMPUTATIONS']);base=Path(os.environ['VISIBLE_BASE'])
          name='root_20261115_current_C_native_scalar_readout.py'
          raw=(comp/name).read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='2f2386afab07e5acc9b6ec155f782cb1ba1c8df5a879607effd5985c151784ff'
          spec=importlib.util.spec_from_file_location('_request159_only_original_byte_readback',comp/name)
          R=importlib.util.module_from_spec(spec);sys.modules[spec.name]=R;spec.loader.exec_module(R)
          for index,path in enumerate(sorted(base.glob('*rule-sync*'))):
           if not path.is_dir() or path.is_symlink():continue
           for j,item in enumerate(sorted(path.rglob('*'))):
            if not item.is_file() or item.is_symlink():continue
            label='REQUEST159_RULE_%03d_%05d'%(index,j)
            if item.name.endswith('.json'):
             value,identity=R.optional(item)
             R.emit(label,dict(original_file=identity,original_value=value,read_only=True))
            else:
             R.original_bytes(item,label)
          R.emit('REQUEST159_COMPLETE_RULE_READBACK',dict(read_only=True,
           complete_rule_files=len(R._seen),original_read_errors=R._errors,
           cleanup_waits_for_this_readback=True,no_scientific_acceptance_inferred=True))
          if R._errors:raise SystemExit(2)
          PYRULESREAD
      - name: Remove only the159 owned namespace after all actual readbacks and observed quiescence
        if: always()
        run: |
          python - <<'PYCLEAN'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']).resolve()
          target=Path(os.environ.get('VISIBLE_BASE',str(root/'visible-current-C-full453159')))
          outcomes=dict(C='${{ steps.scalar.outcome }}',cut='${{ steps.cut_twojet.outcome }}',
           construction='${{ steps.construction_readback.outcome }}',far='${{ steps.far_scalar.outcome }}',
           BVP='${{ steps.bvp_scalar.outcome }}',rules='${{ steps.rules_scalar.outcome }}')
          try:
           assert target.name=='visible-current-C-full453159' and not target.is_symlink()
           assert target.resolve().is_relative_to(root) and target.resolve()!=root
           if any(value!='success' for value in outcomes.values()):
            raise RuntimeError('A complete original readback did not finish; owned raw remains only until runner destruction')
           launch=target/'BVP-launch';path=launch/'result.json'
           if launch.exists():
            if not path.is_file():raise RuntimeError('Existing owned launch lacks quiescence result; no deletion before runner destruction')
            actual=json.loads(path.read_bytes())
            if actual.get('owned_group_quiescent_before_readback') is not True:
             raise RuntimeError('Owned native process group was not observed quiescent')
           if target.is_dir():shutil.rmtree(target)
           print(json.dumps(dict(event='request159_owned_temporary_payload_removed',
            original_readback_outcomes=outcomes,raw_not_archived_uploaded_or_republished=True)),flush=True)
          except Exception as error:
           print(json.dumps(dict(event='request159_cleanup_scope_unpaid',error=repr(error),
            original_readback_outcomes=outcomes,
            no_other_input_source_repo_or_process_touched=True,
            raw_retained_only_until_runner_destruction=True,
            storage_lifecycle_not_a_scientific_acceptance_gate=True)),flush=True)
          PYCLEAN
  report:
    name: Repeat exact bounded primary scopes without a scientific calculation
    needs: compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMPUTE_RESULT: ${{ needs.compute.result }}
      BVP_OUTCOME: ${{ needs.compute.outputs.BVP_science_outcome }}
      SCALAR_SUMMARY: ${{ needs.compute.outputs.scalar_summary }}
      SCALAR_SUMMARY_BYTES: ${{ needs.compute.outputs.scalar_summary_bytes }}
      SCALAR_SUMMARY_SHA256: ${{ needs.compute.outputs.scalar_summary_sha256 }}
      CUT_TWOJET_SUMMARY: ${{ needs.compute.outputs.cut_twojet_summary }}
      CUT_TWOJET_SUMMARY_BYTES: ${{ needs.compute.outputs.cut_twojet_summary_bytes }}
      CUT_TWOJET_SUMMARY_SHA256: ${{ needs.compute.outputs.cut_twojet_summary_sha256 }}
      FAR_SUMMARY: ${{ needs.compute.outputs.far_summary }}
      FAR_SUMMARY_BYTES: ${{ needs.compute.outputs.far_summary_bytes }}
      FAR_SUMMARY_SHA256: ${{ needs.compute.outputs.far_summary_sha256 }}
      CONSTRUCTION_SUMMARY: ${{ needs.compute.outputs.construction_summary }}
      CONSTRUCTION_SUMMARY_BYTES: ${{ needs.compute.outputs.construction_summary_bytes }}
      CONSTRUCTION_SUMMARY_SHA256: ${{ needs.compute.outputs.construction_summary_sha256 }}
      BVP_SUMMARY: ${{ needs.compute.outputs.bvp_summary }}
      BVP_SUMMARY_BYTES: ${{ needs.compute.outputs.bvp_summary_bytes }}
      BVP_SUMMARY_SHA256: ${{ needs.compute.outputs.bvp_summary_sha256 }}
    steps:
      - name: Print all five actual primary summaries and preserve original compute outcome
        run: |
          python3 - <<'PYREPORT'
          import hashlib,json,os
          names=('scalar_summary','cut_twojet_summary','far_summary','construction_summary','bvp_summary')
          errors=[]
          for name in names:
           key=name.upper();text=os.environ.get(key,'')
           if not text:
            print(json.dumps(dict(event='request159_primary_unavailable',original_kind=name,
             compute_result=os.environ.get('COMPUTE_RESULT'),BVP_outcome=os.environ.get('BVP_OUTCOME'),
             no_native_BVP_or_upstream_success_inferred=True)),flush=True)
            continue
           try:
            expected_size=int(os.environ[key+'_BYTES']);expected_sha=os.environ[key+'_SHA256']
            raw=text.encode()
            if len(raw)!=expected_size or hashlib.sha256(raw).hexdigest()!=expected_sha:raw+=b'\n'
            assert len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected_sha
            assert len(raw)<=90000
            json.loads(raw)
            print('BEGIN_REQUEST159_'+key)
            print(raw.decode(),end='' if raw.endswith(b'\n') else '\n')
            print('END_REQUEST159_'+key)
            print(json.dumps(dict(event='request159_original_primary_identity',kind=name,
             original_bytes=len(raw),original_sha256=expected_sha,
             all_detailed_trial_member_and_failure_segments_remain_in_original_compute_log=True)),flush=True)
           except Exception as error:errors.append(dict(kind=name,error=repr(error)))
          print(json.dumps(dict(event='request159_report_transport_scope',errors=errors,
           compute_result=os.environ.get('COMPUTE_RESULT'),BVP_outcome=os.environ.get('BVP_OUTCOME'),
           report_success_not_a_mathematical_BVP_or_closed_surface_result=True)),flush=True)
          if errors or os.environ.get('COMPUTE_RESULT')!='success':raise SystemExit(2)
          PYREPORT
