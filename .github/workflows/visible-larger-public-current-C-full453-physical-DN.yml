name: visible-larger actual current-C current-profile full453 physical DN
'on':
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-current-C-full453-physical-DN-request.json
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: visible-larger-public-current-C-full453-physical-DN
  cancel-in-progress: false
jobs:
  compute:
    name: Fresh current-C and current scalar actual H full J FD complete BVP and fresh audit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      scalar_summary: ${{ steps.scalar.outputs.scalar_summary }}
      scalar_summary_bytes: ${{ steps.scalar.outputs.scalar_summary_bytes }}
      scalar_summary_sha256: ${{ steps.scalar.outputs.scalar_summary_sha256 }}
      cut_twojet_summary: ${{ steps.cut_twojet.outputs.cut_twojet_summary }}
      cut_twojet_summary_bytes: ${{ steps.cut_twojet.outputs.cut_twojet_summary_bytes }}
      cut_twojet_summary_sha256: ${{ steps.cut_twojet.outputs.cut_twojet_summary_sha256 }}
      far_summary: ${{ steps.far_scalar.outputs.far_summary }}
      far_summary_bytes: ${{ steps.far_scalar.outputs.far_summary_bytes }}
      far_summary_sha256: ${{ steps.far_scalar.outputs.far_summary_sha256 }}
      construction_summary: ${{ steps.construction_readback.outputs.construction_summary }}
      construction_summary_bytes: ${{ steps.construction_readback.outputs.construction_summary_bytes }}
      construction_summary_sha256: ${{ steps.construction_readback.outputs.construction_summary_sha256 }}
      bvp_summary: ${{ steps.bvp_scalar.outputs.bvp_summary }}
      bvp_summary_bytes: ${{ steps.bvp_scalar.outputs.bvp_summary_bytes }}
      bvp_summary_sha256: ${{ steps.bvp_scalar.outputs.bvp_summary_sha256 }}
      BVP_science_outcome: ${{ steps.bvp.outcome }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
            /topics/visible-flex-larger-amplitude/results/R286-original-stored-continuous-integral-and-metric-bridge.md
            /topics/visible-flex-larger-amplitude/results/R312-continuous-C-complete112-zero-tail-and-head-connection.md
            /topics/visible-flex-larger-amplitude/results/R324-continuous-C-finite-head-flux-and-closed-tube.md
            /topics/visible-flex-larger-amplitude/results/R331-current-C-zero-seed-general-Robin-and-complete-sensitivity.md
            /topics/visible-flex-larger-amplitude/results/R300-continuous-nine-control-scalar-family-and-cut-calibration.md
            /topics/visible-flex-larger-amplitude/results/R323-finite-cut-boxes-and-explicit-uniform-dyadic-windows.md
            /topics/visible-flex-larger-amplitude/results/R297-continuous-E-unit-panel-and-piecewise-enclosure.md
            /topics/visible-flex-larger-amplitude/results/R306-complete-cap-endpoint-primitives-and-budget-preserving-integration.md
      - name: Establish exclusive request159 namespace and whole-job science deadline
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          git config --global merge.stat false
          python3 - <<'PYNAMESPACE'
          import hashlib,json,os,time
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'visible-current-C-full453159'
          base.mkdir(exist_ok=False)
          comp=Path(os.environ['GITHUB_WORKSPACE'])/'topics/visible-flex-larger-amplitude/computations'
          raw=(comp/'current-C-full453-physical-DN159-recipe.json').read_bytes()
          recipe=json.loads(raw);policy=recipe['execution']
          deadline=dict(schema='request159-owned-job-science-deadline-v1',
           repository=os.environ['GITHUB_REPOSITORY'],run_id=os.environ['GITHUB_RUN_ID'],
           source_commit=os.environ['GITHUB_SHA'],recipe_sha256=hashlib.sha256(raw).hexdigest(),
           namespace_created_unix_seconds=time.time(),
           science_seconds_from_namespace=policy['maximum_elapsed_science_seconds_from_namespace'],
           readback_reserve_seconds=policy['readback_reserve_seconds'],
           job_timeout_minutes=360,resource_deadline_not_a_scientific_gate=True)
          (base/'job-science-deadline.json').write_text(json.dumps(deadline,sort_keys=True,separators=(',',':'))+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:
           f.write('VISIBLE_BASE='+str(base)+'\n')
           f.write('VISIBLE_COMPUTATIONS='+str(comp)+'\n')
          print(json.dumps(dict(event='request159_actual_namespace_deadline',**deadline)),flush=True)
          PYNAMESPACE
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install unchanged numerical and rigorous interval runtimes
        run: |
          python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5 scipy==1.17.0
      - name: Record temporary capacity without claiming full multi-call output capacity
        run: |
          python - <<'PYSPACE'
          import json,os,shutil,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          before=shutil.disk_usage(root)._asdict()
          for name in ('/usr/local/lib/android','/usr/share/dotnet','/opt/ghc'):
           path=Path(name)
           if path.exists():subprocess.run(['sudo','rm','-rf','--',name],check=True)
          after=shutil.disk_usage(root)._asdict()
          print(json.dumps(dict(event='request159_initial_temporary_capacity',before=before,after=after,
           minimum_startup_bytes=34359738368,live_process_free_reserve_bytes=2147483648,
           full_multi_call_capacity_not_guaranteed=True,original_iterations_and_tolerances_unchanged=True)),flush=True)
          if after['free']<34359738368:raise SystemExit('Declared temporary resource unavailable before science')
          PYSPACE
      - name: Bind all57 direct sources actual recipe original147 construction and current rules
        run: |
          python - <<'PYPINS'
          import ast,hashlib,json,os,re,subprocess
          from pathlib import Path,PurePosixPath
          repo=Path(os.environ['GITHUB_WORKSPACE']);comp=Path(os.environ['VISIBLE_COMPUTATIONS'])
          base=Path(os.environ['VISIBLE_BASE'])
          raw=(comp/'public-current-C-full453-physical-DN-request.json').read_bytes();request=json.loads(raw)
          assert request['schema']=='public-current-C-full453-physical-DN-request-v1'
          assert request['request_number']==159 and request['lanes']==['currentCfull453physicalDN']
          assert request['repository']=='Rogerhu12/math-research-public'
          assert request['source_count']==len(request['source_sha256'])==57
          assert request['execution']['job_timeout_minutes']==360
          assert request['execution']['namespace_science_deadline_seconds']==18900
          assert request['execution']['readback_reserve_seconds']==2700
          records=[]
          for name,expected in request['source_sha256'].items():
           assert PurePosixPath(name).name==name and re.fullmatch('[0-9a-f]{64}',expected)
           data=(comp/name).read_bytes();assert hashlib.sha256(data).hexdigest()==expected,name
           if name.endswith('.py'):compile(ast.parse(data,filename=name),name,'exec')
           if name.endswith('.mjs'):subprocess.run(['node','--check',str(comp/name)],check=True)
           records.append(dict(file=name,bytes=len(data),sha256=expected))
          def metadata(item):
           path=repo/item['file'] if item['file'].startswith('topics/') else comp/item['file']
           data=path.read_bytes()
           assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256'],item['file']
           return data
          recipe_raw=metadata(request['current_BVP_recipe']);recipe=json.loads(recipe_raw)
          assert recipe['schema']=='explicit-current-C-R300-v3-three-active-complete453-recipe-v1'
          assert recipe['lambda_target']==.001 and recipe['height_sign']==-1
          assert recipe['field_modes']==112 and recipe['state_dimension']==453
          assert recipe['active_parameter_indices']==[0,1,2] and recipe['frozen_parameter_indices']==[3,4,5,6,7,8]
          assert recipe['initial_guess_kind']=='complete453-explicit-public-u-reparameterization'
          assert recipe['complete_initial_guess']['mesh_pointer']=='/mesh'
          assert recipe['complete_initial_guess']['states_pointer']=='/states'
          assert recipe['complete_initial_guess']['source_sha256']==request['construction_inputs']['complete_seed']['sha256']
          assert recipe['accepted_source_sha256']==request['construction_inputs']['accepted']['sha256']
          atomic_raw=metadata(request['original_atomic_construction_request']);atomic=json.loads(atomic_raw)
          assert atomic['schema']=='public-continuous-nine-v3-construction-request-v1' and atomic['request_number']==147
          assert atomic['construction']==request['construction']
          assert recipe['initial_nine_parameters']==atomic['construction']['initial_nine_parameters']
          assert recipe['initial_parameter_origin']==atomic['construction']['parameter_origin']
          assert atomic['inputs']==request['inputs']
          assert atomic['query_recipe']==request['query_recipe']
          actual=dict(atomic['scientific_parameters']);actual['budget_seconds']=3600
          assert request['scientific_parameters']==actual
          query=json.loads(metadata(request['query_recipe']))
          assert query['queries']==[dict(id='original-binary-config-cut-point',kind='closed-rational-radius-interval',
            left=.3,right=.3,left_closed=True,right_closed=True),
            dict(id='whole-original-source-natural-continuous-domain',kind='whole-natural-domain',left_closed=True,right_closed=True)]
          assert request['scientific_parameters']==dict(deep_definition='original-exact-root-family',
            precision_bits=256,integral_absolute_bits=96,integral_relative_bits=80,analytic_guard_bits=8,
            integral_evaluation_limit=100000,value_width_bits=24,max_depth=48,query_depth=12,
            max_panels=200000,max_query_nodes=200000,budget_seconds=3600)
          assert request['deep_far']['parameters']==dict(far_port=159,precision_bits=256)
          assert request['native_sampling']['parameters']==dict(precision_bits=256,linear_budget_seconds=1800,
            sampling_budget_seconds=1800,max_panels=200000,max_depth=32,local_defect_bits=12,
            panel_norm_limit='1/2',taylor_terms=24,max_geometry_cache_records=65536,
            sample_max_nodes=1000000,sample_inverse_depth=24,sample_value_bits=32,steps=12)
          driver=ast.parse((comp/request['current_BVP']['file']).read_bytes())
          constants={n.targets[0].id:ast.literal_eval(n.value) for n in driver.body
           if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name)
           and n.targets[0].id in ('PINS','NATIVE_PINS','ORIGINAL_RUNTIME_PINS')}
          assert all(request['source_sha256'].get(k)==v for k,v in constants['PINS'].items())
          assert recipe['native_configuration']['source_sha256']==constants['NATIVE_PINS']
          assert recipe['native_configuration']['original_runtime_sha256']==constants['ORIGINAL_RUNTIME_PINS']
          for item in (request['proof'],request['deep_far']['proof'],request['finite_head']['proof'],
           request['native_proof'],request['evaluation_strategy']['proof'],request['evaluation_strategy']['unit_panel_proof'],
           request['construction']['R300_proof'],request['construction']['R323_proof'],
           request['query_recipe'],request['native_sampling'],request['current_BVP'],request['current_BVP_launch'],request['current_BVP_readout']):
           metadata(item)
          for name,blob in request['reviewed_README_blobs'].items():
           assert subprocess.check_output(['git','hash-object',name],text=True).strip()==blob
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          assert not any(request['retention'][key] for key in ('upload_artifact','upload_release','publish_raw_to_git'))
          (base/'dispatch-request.json').write_bytes(raw)
          (base/'BVP-recipe.json').write_bytes(recipe_raw)
          print(json.dumps(dict(event='request159_complete_frozen_source_and_recipe_binding',
           run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],
           request=dict(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()),
           actual_BVP_recipe=request['current_BVP_recipe'],sources=records,
           original_atomic_construction=request['original_atomic_construction_request'],
           actual_C_parameters=request['scientific_parameters'],no_scientific_import_or_evaluation_in_preflight=True)),flush=True)
          PYPINS
      - name: Restore only the five original byte inputs and verify the complete453 seed producer
        run: |
          python - <<'PYINPUTS'
          import gzip,hashlib,json,os,subprocess
          from pathlib import Path,PurePosixPath
          repo=Path(os.environ['GITHUB_WORKSPACE']);base=Path(os.environ['VISIBLE_BASE'])
          request=json.loads((base/'dispatch-request.json').read_bytes())
          commit='8bd267107cc8710d371f3b62c02986655ac965b0'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['GITHUB_SHA']
          if subprocess.run(['git','cat-file','-e',commit+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
           subprocess.run(['git','fetch','--no-write-fetch-head','--no-tags','--filter=blob:none','--depth=1','origin',commit],check=True)
          inputs=base/'original-inputs';inputs.mkdir(exist_ok=False);records={}
          for role,item in {**request['inputs'],**request['construction_inputs']}.items():
           assert item['historical_public_commit']==commit
           relative=PurePosixPath(item['file'])
           assert not relative.is_absolute() and '..' not in relative.parts
           assert str(relative).startswith('topics/visible-flex-larger-amplitude/notes/')
           assert Path(item['runtime_basename']).name==item['runtime_basename']
           blob=subprocess.check_output(['git','rev-parse',commit+':'+str(relative)],text=True).strip()
           if 'git_blob' in item:assert blob==item['git_blob']
           raw=subprocess.check_output(['git','cat-file','blob',blob])
           assert len(raw)==item['bytes'] and hashlib.sha256(raw).hexdigest()==item['sha256'],role
           path=inputs/item['runtime_basename']
           with path.open('xb') as stream:stream.write(raw);stream.flush();os.fsync(stream.fileno())
           records[role]=dict(source_path=str(relative),git_blob=blob,bytes=len(raw),sha256=item['sha256'],temporary_file=str(path))
          assert set(records)=={'config','calibration_ledger','stored_reference','accepted','complete_seed'}
          import struct
          original_config=json.loads((inputs/request['inputs']['config']['runtime_basename']).read_bytes())
          query=json.loads((repo/request['query_recipe']['file']).read_bytes())
          cut=original_config['rCut'];point=query['queries'][0]
          assert type(cut) is float and type(point['left']) is float and type(point['right']) is float
          assert struct.pack('<d',point['left'])==struct.pack('<d',cut)==struct.pack('<d',point['right'])
          seed_raw=(inputs/request['construction_inputs']['complete_seed']['runtime_basename']).read_bytes()
          seed=json.loads(gzip.decompress(seed_raw))
          assert seed['source_sha256']=='9a1ae018d71e38ff901c4b9156b23502a4efde44f812c1ff4e03323878b659db'
          assert (seed['M'],seed['N'])==(112,2048)
          assert len(seed['mesh'])==len(seed['states'])==699 and all(len(row)==453 for row in seed['states'])
          assert seed['source_accepted_prefix']['sha256']==request['construction_inputs']['accepted']['sha256']
          assert seed['success'] is False and seed['complete_closed_surface'] is False
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==head
          print(json.dumps(dict(event='request159_actual_five_input_bytes_and_source_seed_bound',
           source_commit=head,historical_public_commit=commit,inputs=records,
           current_original_binary_cut_float64le=struct.pack('<d',cut).hex(),
           actual_seed_nodes=len(seed['mesh']),actual_seed_dimension=453,
           actual_seed_producer=seed['source_sha256'],actual_seed_success=seed['success'],
           old_RHS_metric_tail_and_acceptance_not_inherited=True,
           actual_current_public_u_remap_and_fresh_RHS_remain_to_be_computed=True,
           no_current_H_native_response_or_J_fabricated=True)),flush=True)
          PYINPUTS
      - name: Restore the unchanged original public source subset once
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYSOURCE'
          import os
          from pathlib import Path
          from exact_20261114_public_resume import prepare_public_source
          base=Path(os.environ['VISIBLE_BASE'])
          source=prepare_public_source(Path.cwd(),base/'original-public-source',base)
          with open(os.environ['GITHUB_ENV'],'a') as stream:
            stream.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
          PYSOURCE
      - name: Produce the complete original continuous E cover with honest partial scope
        id: science
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python -u - <<'PYRUN'
          import hashlib,json,os,sys
          from pathlib import Path
          import root_20261114_current576_rules_runner as runner
          repo=Path(os.environ['GITHUB_WORKSPACE']);comp=Path(os.environ['VISIBLE_COMPUTATIONS']).resolve()
          request_path=Path(os.environ['VISIBLE_BASE'])/'dispatch-request.json';request=json.loads(request_path.read_bytes())
          assert Path(runner.__file__).resolve()==comp/'root_20261114_current576_rules_runner.py'
          expected=request['source_sha256']['root_20261114_current576_rules_runner.py']
          assert hashlib.sha256(Path(runner.__file__).read_bytes()).hexdigest()==expected
          baselines={}
          for name,blob in request['reviewed_README_blobs'].items():
            raw=(repo/name).read_bytes()
            assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==blob
            baselines[name]=dict(blob=blob,text=raw.decode())
          old={name:value['blob'] for name,value in runner.BASELINES.items()};runner.BASELINES=baselines
          print(json.dumps(dict(event='request159_explicit_rules_baseline_update',unchanged_runner_sha256=expected,
            old_embedded_blobs=old,reviewed_current_blobs=request['reviewed_README_blobs'],
            period_seconds=runner.PERIOD_SECONDS,original_pull_rebase_rule_change_stop_retained=True)),flush=True)
          base=Path(os.environ['VISIBLE_BASE']);inputs=base/'original-inputs'
          argv=[str(comp/request['scientific_entry']),'--runtime-computations',str(comp),
            '--source-topic',os.environ['VISIBLE_SOURCE_TOPIC'],'--proof',str(repo/request['proof']['file']),
            '--queries',str(repo/request['query_recipe']['file']),'--queries-sha256',request['query_recipe']['sha256'],
            '--out',str(base/'continuous-E')]
          for role,option in (('config','config'),('calibration_ledger','ledger-ready'),('stored_reference','stored-ready')):
            item=request['inputs'][role]
            argv.extend(['--'+option,str(inputs/item['runtime_basename']),'--'+option+'-sha256',item['sha256']])
          for key,value in request['scientific_parameters'].items():
            argv.extend(['--'+key.replace('_','-'),str(value)])
          # Auth exists only for the original rule-sync parent; the numerical
          # child executes the independent evaluator of the unchanged model without GitHub token variables.
          bootstrap="import os,runpy,sys; [os.environ.pop(k,None) for k in ('GH_TOKEN','GITHUB_TOKEN','MR_TOKEN')]; sys.argv=sys.argv[1:]; runpy.run_path(sys.argv[0],run_name='__main__')"
          command=[sys.executable,'-u','-c',bootstrap,*argv]
          sys.argv=[runner.__file__,'--out',str(base/'rule-sync'),'--command',*command]
          raise SystemExit(runner.main())
          PYRUN
      - name: Read every original point-query leaf and enclose the complete cut two-jet
        id: cut_twojet
        if: always()
        timeout-minutes: 10
        run: |
          python -u - <<'PYCUT'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          repo=Path(os.environ['GITHUB_WORKSPACE']);comp=Path(os.environ['VISIBLE_COMPUTATIONS']).resolve()
          base=Path(os.environ['VISIBLE_BASE']);out=base/'continuous-E';result=out/'result.json'
          request=json.loads((Path(os.environ['VISIBLE_BASE'])/'dispatch-request.json').read_bytes())
          if not result.is_file():
            print(json.dumps(dict(event='request159_cut_twojet_source_result_unavailable',
              complete_cut_twojet_not_claimed=True,original_science_or_rule_failure_retained=True)),flush=True)
            raise SystemExit(0)
          helper=request['cut_twojet_readout'];raw=(comp/helper['file']).read_bytes()
          assert len(raw)==helper['bytes'] and hashlib.sha256(raw).hexdigest()==helper['sha256']
          config=request['inputs']['config'];query=request['query_recipe']
          argv=[sys.executable,'-u',str(comp/helper['file']),'--directory',str(out),
            '--result-sha256',hashlib.sha256(result.read_bytes()).hexdigest(),
            '--config',str(base/'original-inputs'/config['runtime_basename']),
            '--config-sha256',config['sha256'],'--query-recipe',str(repo/query['file']),
            '--query-recipe-sha256',query['sha256'],'--out',str(base/'cut-twojet-readout')]
          child_env={key:value for key,value in os.environ.items()
            if key not in ('GH_TOKEN','GITHUB_TOKEN','MR_TOKEN')}
          code=subprocess.run(argv,env=child_env).returncode
          raise SystemExit(code)
          PYCUT
      - name: Construct actual R323 windows, exact new target and explicit numerical search profile
        id: construction
        if: always()
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python -u - <<'PYCONSTRUCT'
          import hashlib,json,os,sys
          from pathlib import Path
          import root_20261114_current576_rules_runner as runner
          repo=Path(os.environ['GITHUB_WORKSPACE']);comp=Path(os.environ['VISIBLE_COMPUTATIONS']).resolve()
          request_path=comp/'public-continuous-nine-v3-construction-request.json'
          request=json.loads(request_path.read_bytes())
          assert Path(runner.__file__).resolve()==comp/'root_20261114_current576_rules_runner.py'
          assert hashlib.sha256(Path(runner.__file__).read_bytes()).hexdigest()==request['source_sha256']['root_20261114_current576_rules_runner.py']
          baselines={}
          for name,blob in request['reviewed_README_blobs'].items():
            raw=(repo/name).read_bytes()
            assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==blob
            baselines[name]=dict(blob=blob,text=raw.decode())
          runner.BASELINES=baselines
          base=Path(os.environ['VISIBLE_BASE']);policy=request['construction']
          helper=comp/policy['entry'];raw=helper.read_bytes()
          assert len(raw)==policy['entry_bytes'] and hashlib.sha256(raw).hexdigest()==policy['entry_sha256']
          argv=[str(helper),'--request',str(request_path),'--inputs-directory',str(base/'original-inputs'),
            '--tail-cover-directory',str(base/'continuous-E'),
            '--cut-twojet-readout',str(base/'cut-twojet-readout'/'cut-twojet-readout.json'),
            '--code-directory',str(comp),'--r300-proof',str(repo/policy['R300_proof']['file']),
            '--r323-proof',str(repo/policy['R323_proof']['file']),'--out',str(base/'construction')]
          bootstrap="import os,runpy,sys; [os.environ.pop(k,None) for k in ('GH_TOKEN','GITHUB_TOKEN','MR_TOKEN')]; sys.argv=sys.argv[1:]; runpy.run_path(sys.argv[0],run_name='__main__')"
          command=[sys.executable,'-u','-c',bootstrap,*argv]
          print(json.dumps(dict(event='request147_construction_same_job_dispatch',
            original_E_model_and_other_resources_unchanged=True,actual_E_budget_seconds=3600,
            original_atomic147_E_budget_seconds=1800,original_rules_period=runner.PERIOD_SECONDS,
