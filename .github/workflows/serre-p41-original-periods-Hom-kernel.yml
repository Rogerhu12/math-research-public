name: Serre p41 original exact periods and Hom kernel

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R754-public-original-periods-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R754-original-p41-periods-and-Hom-kernel
  cancel-in-progress: false

jobs:
  original_periods_and_kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-periods-Hom-kernel.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R754_original_periods_and_Hom_kernel.py
            /topics/serre-uniformity/scripts/R754_public_periods_and_Hom_kernel.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R754-public-original-periods-request.json
            /topics/serre-uniformity/notes/R754-original-periods-and-Hom-kernel-method.md
            /topics/serre-uniformity/results/R725-original-CM-elliptic-model-and-splitting-field.md
            /topics/serre-uniformity/results/R728-original-Weil-restriction-primitive-projector-and-Neron-lattice.md
            /topics/serre-uniformity/results/R732-original-CM-period-kernel-and-bounded-rational-function-recovery.md
            /topics/serre-uniformity/results/R735-exact-original-p41-CM-model-and-Neron-input.md
            /topics/serre-uniformity/results/R738-certified-original-p41-period-input.md
            /topics/serre-uniformity/results/R745-certified-original-p41-Hodge-and-adelic-input.md
            /topics/serre-uniformity/results/R751-original-period-compression-in-the-retained-degree-280-field.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Reuse original inputs and compute exact periods and the full kernel
        continue-on-error: true
        timeout-minutes: 95
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R754_public_periods_and_Hom_kernel.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R754-original-p41-periods-and-Hom-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R754-original-p41-periods-and-Hom-kernel/output
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve complete or failed exact checkpoints and small receipts
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R754_public_periods_and_Hom_kernel.py publish
      - name: Require exact rank six and all original closed chains
        if: always()
        run: python topics/serre-uniformity/scripts/R754_public_periods_and_Hom_kernel.py verify
