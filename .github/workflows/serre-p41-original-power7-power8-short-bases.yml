name: Serre p41 original power7 power8 short bases

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R799-public-power7-power8-short-bases-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R799-original-power7-power8-short-bases
  cancel-in-progress: false

jobs:
  original_power7_power8_short_bases:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-power7-power8-short-bases.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R799_original_power7_power8_short_bases.py
            /topics/serre-uniformity/scripts/R799_public_original_power7_power8_short_bases.py
            /topics/serre-uniformity/scripts/R786_public_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R799-public-power7-power8-short-bases-request.json
            /topics/serre-uniformity/notes/R799-power7-power8-minimal-bases-method.md
            /topics/serre-uniformity/results/R799-original-power7-power8-minimal-basis-construction.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Complete only V6 q82 to108 and new V7 V8 shortest certified bases
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R799_public_original_power7_power8_short_bases.py compute
      - name: Transfer the active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R799-original-power7-power8-short-bases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R799-original-power7-power8-short-bases/output
          retention-days: 1
          if-no-files-found: warn
      - name: Publish only script parameters run and output hashes
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R799_public_original_power7_power8_short_bases.py publish
      - name: Require both actual new nonzero minors and all exact rows
        if: always()
        run: python topics/serre-uniformity/scripts/R799_public_original_power7_power8_short_bases.py verify
