name: Serre p41 original regular multipliers

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R811-public-original-regular-multipliers-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R811-original-regular-multipliers
  cancel-in-progress: false

jobs:
  original_regular_multipliers:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-regular-multipliers.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R811_original_regular_multipliers.py
            /topics/serre-uniformity/scripts/R811_public_original_regular_multipliers.py
            /topics/serre-uniformity/notes/R811-public-original-regular-multipliers-request.json
            /topics/serre-uniformity/notes/R811-original-regular-multiplier-and-polar-preimage-method.md
            /topics/serre-uniformity/results/R811-original-normal-polar-ideal-preimages-and-two-chart-certificates.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source syntax without importing mathematics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("R811_original_regular_multipliers.py", "R811_public_original_regular_multipliers.py"):
              path = Path("topics/serre-uniformity/scripts") / name
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Install frozen exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compute original A and B regular multipliers
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R811_public_original_regular_multipliers.py compute
      - name: Transfer the active checkpoint to its immediate continuation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-global-R811-original-regular-multipliers-and-polar-preimages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R811-original-regular-multipliers-and-polar-preimages/output
          retention-days: 1
          if-no-files-found: warn
      - name: Require complete exact matrix identities and original two-chart transport
        if: always()
        run: python topics/serre-uniformity/scripts/R811_public_original_regular_multipliers.py verify
