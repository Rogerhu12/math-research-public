name: Serre R880 original D and cusp bounded RR inputs

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R880-D-cusp-bounded-RR-public-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R880-D-cusp-bounded-RR-inputs
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/notes/R880-D-cusp-bounded-RR-public-request.json
      - name: Pull main and compare both rule files with the read commit
        env:
          REQUEST_SOURCE: ${{ github.sha }}
          RECEIPT_PATH: ${{ runner.temp }}/R880-D-cusp-bounded-RR-rules-pull.json
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, subprocess
          from pathlib import Path
          path='topics/serre-uniformity/notes/R880-D-cusp-bounded-RR-public-request.json'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',os.environ['REQUEST_SOURCE']],check=True)
          request=json.loads(subprocess.check_output(['git','show',os.environ['REQUEST_SOURCE']+':'+path]))
          subprocess.run(['git','checkout','-B','r880-D-cusp-bounded-RR-rules-main'],check=True)
          subprocess.run(['git','pull','--rebase','origin','main'],check=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          old=request['rules_last_read_commit']
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',old],check=True)
          actual={key:hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  for key,name in [('root','README.md'),('topic','topics/serre-uniformity/README.md')]}
          changed=actual!=request['readme_sha256']
          receipt={'actual_git_pull_rebase_completed':True,'actual_head':head,'previous_read_commit':old,
                   'actual_UTC':dt.datetime.now(dt.timezone.utc).isoformat(),'readme_sha256':actual,
                   'expected_readme_sha256':request['readme_sha256'],'rules_changed':changed}
          Path(os.environ['RECEIPT_PATH']).write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('R880_RULES_PULL='+json.dumps(receipt,sort_keys=True))
          if changed:
              subprocess.run(['git','diff',old,head,'--','README.md','topics/serre-uniformity/README.md'],check=True)
              raise SystemExit('Both README changes must be read before the new mathematics.')
          PY
      - name: Preserve the actual pull receipt for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-R880-D-cusp-bounded-RR-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R880-D-cusp-bounded-RR-rules-pull.json
          retention-days: 1
          if-no-files-found: warn

  construct:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R880_original_D_and_cusp_bounded_RR_inputs.py
            /topics/serre-uniformity/scripts/R880_public_original_D_and_cusp_bounded_RR_inputs.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/notes/R872-original-point-jets-and-bounded-two-weight-RR-kernels.md
            /topics/serre-uniformity/results/R845-certified-original-D-pencil-and-eight-pole-generators.md
            /topics/serre-uniformity/notes/R880-original-D-pencil-reuse-and-common-cusp-RR-inputs.md
            /topics/serre-uniformity/notes/R880-original-D-and-cusp-bounded-RR-input-execution-method.md
            /topics/serre-uniformity/notes/R880-D-cusp-bounded-RR-public-request.json
            /.github/workflows/serre-R880-D-cusp-bounded-RR-inputs.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned finite matrix library
        run: |
          python -m pip install --only-binary=:all: python-flint==0.9.0
      - name: Parse source files without importing mathematical code
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          base=Path('topics/serre-uniformity/scripts')
          for name in ('R880_original_D_and_cusp_bounded_RR_inputs.py',
                       'R880_public_original_D_and_cusp_bounded_RR_inputs.py',
                       'R824_public_original_global_polar_generators.py'):
              p=base/name
              ast.parse(p.read_text(),filename=str(p))
              print('AST_OK',name)
          PY
      - name: Compute the bounded original D and common cusp RR inputs
        run: |
          python topics/serre-uniformity/scripts/R880_public_original_D_and_cusp_bounded_RR_inputs.py compute \
            --request topics/serre-uniformity/notes/R880-D-cusp-bounded-RR-public-request.json \
            --output "$RUNNER_TEMP/R880-D-cusp-bounded-RR/output"
      - name: Preserve all six original carriers and every completed RR stage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-R880-D-cusp-bounded-RR-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R880-D-cusp-bounded-RR/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
      - name: Read complete RR source, residual and principal-function interfaces
        if: always()
        run: |
          python topics/serre-uniformity/scripts/R880_public_original_D_and_cusp_bounded_RR_inputs.py verify \
            --request topics/serre-uniformity/notes/R880-D-cusp-bounded-RR-public-request.json \
            --output "$RUNNER_TEMP/R880-D-cusp-bounded-RR/output"
