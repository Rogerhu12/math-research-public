      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull rules prove complete potential identity and solve the new actual endpoint equations
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r590-c2-positive-square-free-germs-20261126.json
          --lane c2-positive-square-free-germs
      # One new actual free-H/L problem, not the four prior fixed-H/L guesses.
      # All six C2 histories and the full square have their original coefficients.
      # No artifacts, Releases, cache, or job-side Git writes.

