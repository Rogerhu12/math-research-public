    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r590-c2-positive-square-free-germs-20261126.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r590-c2-positive-square-free-germs-20261126
  cancel-in-progress: false
jobs:
  research:
    name: Exact C2 history paid square and actual free H L boundary problem
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-r590-c2-positive-square-free-germs-20261126.yml
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r590-c2-positive-square-free-germs-20261126.json
            /topics/visible-flex-new-mechanism/results/R581-exact-c2-local-ruling-with-full-history-chain.md
