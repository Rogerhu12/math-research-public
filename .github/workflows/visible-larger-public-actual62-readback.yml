"name": "visible-larger actual62 saved artifact readback"
"on":
  "push":
    "branches":
      - "main"
    "paths":
      - "topics/visible-flex-larger-amplitude/computations/public-actual62-readback-request.json"
"permissions":
  "contents": "write"
  "actions": "read"
"defaults":
  "run":
    "shell": "bash"
"jobs":
  "receipts":
    "name": "Read completed actual62 original reports and all exported bytes"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 40
    "concurrency":
      "group": "visible-larger-public-actual62-readback"
      "cancel-in-progress": false
    "env":
      "PYTHONDONTWRITEBYTECODE": "1"
      "PYTHONUNBUFFERED": "1"
      "OPENBLAS_NUM_THREADS": "1"
      "OMP_NUM_THREADS": "1"
      "MKL_NUM_THREADS": "1"
    "steps":
      -
        "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        "with":
          "fetch-depth": 1
          "filter": "blob:none"
          "persist-credentials": false
          "sparse-checkout-cone-mode": false
          "sparse-checkout": |
            /README.md
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
      -
        "name": "Set bounded repository maintenance and readback output"
        "run": |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          mkdir -p "$RUNNER_TEMP/visible-actual62-readback/receipts"
          echo "VISIBLE_OUT=$RUNNER_TEMP/visible-actual62-readback/receipts" >> "$GITHUB_ENV"
          echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
      -
        "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065"
        "with":
          "python-version": "3.12.14"
      -
        "name": "Install array decoding dependency"
        "run": "python -m pip install --disable-pip-version-check numpy==2.3.5"
      -
        "name": "Verify the exact reader and transport source bytes without imports"
        "run": |
          python - <<'PYPINS'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          comp = Path(os.environ['VISIBLE_COMPUTATIONS'])
          raw = (comp/'public-actual62-readback-request.json').read_bytes()
          request = json.loads(raw)
          if request['repository'] != 'Rogerhu12/math-research-public' or request['original_request_number'] != 62:
              raise ValueError('Use the designated public actual62 receipt request')
          pins = request['source_sha256']
          required = {'root_20261114_read_actual62_receipts.py',
              'exact_20261114_fetch_pinned_public_artifact.py','root_20261114_publish_actions.py'}
          if set(pins) != required:
              raise ValueError('Pin the reader, transport and publisher')
          verified = []
          for name, expected in pins.items():
              if Path(name).name != name or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise ValueError('Invalid explicit source identity')
              source = (comp/name).read_bytes()
              actual = hashlib.sha256(source).hexdigest()
              if actual != expected:
                  raise ValueError('Readback source differs: '+name)
              compile(source, name, 'exec')
              verified.append(dict(file=name, bytes=len(source), sha256=actual))
          head = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if head != os.environ['GITHUB_SHA']:
              raise ValueError('Use the triggering source checkout')
          record = dict(source_commit=head, request=request,
              request_sha256=hashlib.sha256(raw).hexdigest(), verified_sources=verified,
              new_scientific_computation=False, task_completed=False)
          (Path(os.environ['VISIBLE_OUT'])/'actual62-readback-request-identity.json').write_text(
              json.dumps(record,indent=2)+'\n')
          print(json.dumps(dict(source_commit=head,verified_sources=len(verified))),flush=True)
          PYPINS
      -
        "name": "Read original actual62 reports and verify every exported array byte"
        "env":
          "GITHUB_TOKEN": "${{ github.token }}"
        "run": |
          python -u "$VISIBLE_COMPUTATIONS/root_20261114_read_actual62_receipts.py" \
            --download-out "$RUNNER_TEMP/actual62-original-verified" \
            --out "$VISIBLE_OUT/request62-readback" \
            --repository-root "$GITHUB_WORKSPACE" \
            2>&1 | tee "$VISIBLE_OUT/actual62-readback.log"
      -
        "name": "Preserve full receipt and detailed byte audit"
        "if": "always()"
        "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        "with":
          "name": "visible-receipts-actual62-${{ github.run_id }}-${{ github.run_attempt }}"
          "path": "${{ runner.temp }}/visible-actual62-readback/receipts/"
          "compression-level": 1
          "retention-days": 30
          "if-no-files-found": "warn"
      -
        "name": "Publish original scalar readouts and bounded receipts"
        "if": "always()"
        "env":
          "GH_TOKEN": "${{ github.token }}"
        "run": |
          python -u "$VISIBLE_COMPUTATIONS/root_20261114_publish_actions.py" \
            --results "$RUNNER_TEMP/visible-actual62-readback/receipts" --lane receipts
