name: visible-exact fourth-angle global-sign budgets

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-fourth-angle-global-sign.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-fourth-angle-global-sign
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  DZ_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-fourth-angle-and-global-sign-CI-inputs.json
  DZ_MANIFEST_SHA: c9a45aa76c5228d440d36629a87e38ee24fcc8c61085cbfeef3cf4bfa41dfba9
  DZ_PIPELINE_SHA: 245da4db1e6e105d5a753ab8917a3f2b0b1633214dba7e69fc81a36c7e52cd6b
  DZ_WORKER_SHA: 8d0c64522b1a08664e5d8612c210e56952ab9e50a0fd2457b4286ab4557814ac
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  fourth-angle-global-sign-budgets:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_fourth_angle_and_Maslov_sign_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-fourth-angle-and-global-sign-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_fourth_angle_and_Maslov_sign_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['DZ_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate only small source proof and provenance texts
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_fourth_angle_and_Maslov_sign_public_worker.py --mode hydrate
          --manifest "$DZ_MANIFEST" --manifest-sha "$DZ_MANIFEST_SHA"
          --pipeline-sha "$DZ_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new consumer and both evidence-only sources before any new arithmetic
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,json,os,pathlib
          manifest=json.loads(pathlib.Path(os.environ['DZ_MANIFEST']).read_text())
          for role in ('source','fa_source','fold_source'):
              item=next(x for x in manifest['files'] if x['role']==role)
              p=pathlib.Path(item['path'])
              assert len(p.read_bytes())==item['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
              ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the pinned directed arithmetic runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Read five completed scientific records and evaluate only new fourth-angle and global-sign combinations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_fourth_angle_and_Maslov_sign_public_worker.py --mode run
          --manifest "$DZ_MANIFEST" --manifest-sha "$DZ_MANIFEST_SHA"
          --pipeline-sha "$DZ_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-fourth-angle-global-sign-science"
          --out-dir "$RUNNER_TEMP/visible-exact-fourth-angle-global-sign-output"
      # Root rule15: all fourteen inputs are current small text; zero old binaries or artifacts are restored.
      # The two original Python sources are AST-only evidence; they are never imported or called.
      # No upload-artifact, Release upload, native or per-row numerical-data commit.
      # Complete science is atomically saved and printed before publication-size guards.
      # The actual topic capacity must retain120000 bytes before any new arithmetic.
