name: visible-exact cached full193 matrix pilot

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_full193_matrix_pilot.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_full193_matrix_pilot_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cached-full193-matrix-pilot-CI-inputs.json'
      - '.github/workflows/visible-exact-cached-full193-matrix-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-cached-full193-matrix-pilot
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  MATRIX_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cached-full193-matrix-pilot-CI-inputs.json
  MATRIX_MANIFEST_SHA: e15a4e56df96b96bdd8f2bd8628f6985518b140978912fa3d45aad7e6c265936
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  matrices:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 90
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cached-full193-matrix-pilot-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate all105 pins including the exact four previously completed matrix definitions
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$MATRIX_MANIFEST" --manifest-sha "$MATRIX_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/cached_full193_matrix_pilot_ci/
      - name: Parse the two new sources before any mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_cached_full193_matrix_pilot.py','fourfold_codazzi_cached_full193_matrix_pilot_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('New full193 matrix sources parsed; original target and projector cells remain frozen.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set the actual container-visible artifact path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-cached-full193-matrix-output" >> "$GITHUB_OUTPUT"
      - name: Certify only the new complete square matrices with true pull and README checks every10minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_full193_matrix_pilot_CI.py
          --manifest "$MATRIX_MANIFEST" --manifest-sha "$MATRIX_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --work "$RUNNER_TEMP/visible-exact-cached-full193-matrix-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-cached-full193-matrix-output"
          --compute-minutes 75 --checkpoint-minutes 10
      - name: Require nonempty actual evidence and bounded inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty matrix process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,
                        sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          raw=(json.dumps(entries,indent=2)+'\n').encode()
          if len(raw)>60000:raise RuntimeError('matrix artifact inventory exceeds60000 bytes')
          (root/'artifact-inventory.json').write_bytes(raw)
          print(dict(actual_files=len(files),actual_inventory_bytes=len(raw)))
          PY_INVENTORY
      - name: Preserve every actual matrix byte and successful prefix with its original receipts
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-full193-matrix-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
