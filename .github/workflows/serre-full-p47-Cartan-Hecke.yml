name: Serre full p47 Cartan and integral Hecke

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/full-p47-Cartan-Hecke-request.json

permissions:
  contents: read

concurrency:
  group: serre-full-p47-Cartan-Hecke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_Cartan_and_integral_Hecke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/full_p47_Cartan_Hecke_certificate.py
            /topics/serre-uniformity/notes/2026-11-27-full-p47-Cartan-Hecke-method.md
            /topics/serre-uniformity/results/R1078-original-level47-Cartan-correspondences-and-fixed-cycles.md
            /topics/serre-uniformity/results/R1080-certified-full-level47-Jacobian-rank.md
            /topics/serre-uniformity/notes/full-p47-Cartan-Hecke-request.json
      - name: Pull pinned official SageMath 10.6 image
        run: docker pull sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      - name: Certify the actual Cartan traces and integral Hecke factors
        env:
          SERRE_EXPECTED_REQUEST_SHA256: '68ed263279a0c0d5d81ec419f1f92312009b5da89e051da846716770ff74156a'
        run: |
          timeout --signal=TERM --kill-after=30s 600s docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work,readonly" \
            --workdir /work \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SHA \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e SERRE_EXPECTED_REQUEST_SHA256 \
            -e PYTHONUNBUFFERED=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879 \
            sage -python topics/serre-uniformity/scripts/full_p47_Cartan_Hecke_certificate.py
