name: visible-exact complete mixed continuous Z source cover

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-complete-mixed-Z-source-cover-v2.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-mixed-Z-source-cover-v2
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  COVER_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-mixed-Z-source-cover-v2-CI-inputs.json
  COVER_MANIFEST_SHA: 05178f530e1fbc9be1016faa52cb9f5773e199915ab7bfcae1ad187609e7e0ac
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  plan:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 60
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-mixed-Z-source-cover-v2-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate all pinned original bytes and exact new source definitions
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$COVER_MANIFEST" --manifest-sha "$COVER_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/complete_Z_source_v2_ci/
      - name: Parse the new exact sources without executing mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_complete_mixed_Z_source_cover.py','fourfold_codazzi_complete_mixed_Z_source_CI_v2.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('All new sources passed Python AST parsing; mathematics has not run.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible input and output paths
        id: paths
        run: |
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-full-Z-prepared" >> "$GITHUB_OUTPUT"
          printf 'previous=%s\n' "$RUNNER_TEMP/visible-exact-full-Z-original-rows" >> "$GITHUB_OUTPUT"
          printf 'body=%s\n' "$RUNNER_TEMP/visible-exact-full-Z-body-mean" >> "$GITHUB_OUTPUT"
          printf 'repair=%s\n' "$RUNNER_TEMP/visible-exact-full-Z-repair" >> "$GITHUB_OUTPUT"
          printf 'pilot=%s\n' "$RUNNER_TEMP/visible-exact-full-Z-completed-pilot" >> "$GITHUB_OUTPUT"
          printf 'plan=%s\n' "$RUNNER_TEMP/visible-exact-full-Z-actual-plan" >> "$GITHUB_OUTPUT"
          printf 'ranges=%s\n' "$RUNNER_TEMP/visible-exact-full-Z-actual-ranges" >> "$GITHUB_OUTPUT"
          printf 'original_plan=%s\n' "$RUNNER_TEMP/visible-exact-full-Z-original-successful-plan" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-full-Z-output" >> "$GITHUB_OUTPUT"
      - name: Restore the original full candidate and trial bytes without reconstructing them
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43583838026
          name: visible-exact-body-prepared-43583838026-1
          path: ${{ steps.paths.outputs.prepared }}
      - name: Receive all eight original completed residual artifact groups
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43583838026
          pattern: visible-exact-body-rows-*-43583838026-1
          merge-multiple: false
          path: ${{ steps.paths.outputs.previous }}
      - name: Receive the actual full body and independent mean native
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43586413510
          name: visible-exact-body-complete-mean-43586413510-1
          path: ${{ steps.paths.outputs.body }}
      - name: Receive the already completed full centre repair source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43597921732
          name: visible-exact-complete-response-repair-source-43597921732-1
          path: ${{ steps.paths.outputs.repair }}
      - name: Reuse all fourteen successful exact-bump rows and their completed fixed-eta subcells
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43610523058
          name: visible-exact-exact-bump-continuous-Z-source-pilot-43610523058-1
          path: ${{ steps.paths.outputs.pilot }}
      - name: Recover the exact original successful mathematical plan after its summary publication failure
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43612904296
          name: visible-exact-complete-Z-plan-43612904296-1
          path: ${{ steps.paths.outputs.original_plan }}
      - name: Execute the actual plan phase with real pull and README checks every ten minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_mixed_Z_source_CI_v2.py
          --manifest "$COVER_MANIFEST" --manifest-sha "$COVER_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --phase plan --workflow-run "${{ github.run_id }}"
          --original-plan-artifact "$RUNNER_TEMP/visible-exact-full-Z-original-successful-plan"
          --prepared "$RUNNER_TEMP/visible-exact-full-Z-prepared"
          --previous-artifacts "$RUNNER_TEMP/visible-exact-full-Z-original-rows"
          --body-artifact "$RUNNER_TEMP/visible-exact-full-Z-body-mean"
          --repair-artifact "$RUNNER_TEMP/visible-exact-full-Z-repair"
          --pilot-artifact "$RUNNER_TEMP/visible-exact-full-Z-completed-pilot"
          --work "$RUNNER_TEMP/visible-exact-full-Z-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-full-Z-output"
          --compute-minutes 30 --checkpoint-minutes 10
      - name: Require nonempty actual process evidence and a small artifact inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          data=(json.dumps(entries,indent=2)+'\n').encode()
          if len(data)>60000:
              raise RuntimeError('artifact inventory exceeded the strict plaintext limit; all original evidence is retained')
          (root/'artifact-inventory.json').write_bytes(data)
          print(dict(actual_files=len(files),nonempty_output_verified=True,inventory_bytes=len(data)))
          PY_INVENTORY
      - name: Preserve the actual native and every failed prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-complete-Z-v2-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error

