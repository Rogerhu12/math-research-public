name: Rank2 original shadow through complete triangular sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rank2-sha-original-triangular-artinian-shadow.yml'
      - 'topics/rank2-sha-infinitely-many-p/ci/original-triangular-artinian-shadow-request.json'
      - 'topics/rank2-sha-infinitely-many-p/scripts/launch-original-triangular-artinian-shadow.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/produce-original-triangular-artinian-shadow.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rank2-original-artinian-shadow
  cancel-in-progress: false
jobs:
  original-triangular-artinian-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            topics/rank2-sha-infinitely-many-p/scripts
            topics/rank2-sha-infinitely-many-p/ci
          persist-credentials: false
      - name: Pull the pinned Sage 10.6 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull sagemath/sagemath@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb
      - name: Authenticate both original PASS receipts and compute all original thick shadow gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          timeout --kill-after=45s 21000s python3 topics/rank2-sha-infinitely-many-p/scripts/launch-original-triangular-artinian-shadow.py
