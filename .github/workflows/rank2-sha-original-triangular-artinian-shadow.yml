      - 'topics/rank2-sha-infinitely-many-p/scripts/launch-original-adaptive-scalar-graph-shadow-v17.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/produce-original-adaptive-scalar-graph-shadow-v17.py'
