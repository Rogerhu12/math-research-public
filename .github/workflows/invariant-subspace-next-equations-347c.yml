name: ISP nonzero mean and finite H21 next equations
on:
  push:
    branches: [main]
    paths:
      - 'topics/invariant-subspace-problem/notes/2026-11-26-unit211-scaled-high-curve-mixed-projections-347c.py'
      - 'topics/invariant-subspace-problem/notes/2026-11-26-unit211-original-U-value-atlas-347c.py'
      - 'topics/invariant-subspace-problem/notes/2026-11-26-unit211-U-value-L0-w1-347c.py'
      - 'topics/invariant-subspace-problem/notes/2026-11-26-unit211-U-value-S0-collision-347c.py'
      - 'topics/invariant-subspace-problem/notes/2026-11-26-h21-zero-hp-finite-w-V-infinity-probe-347c.py'
      - '.github/workflows/invariant-subspace-next-equations-347c.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isp-next-equations-347c
  cancel-in-progress: false
jobs:
  exact:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: unit211-high-curve
            file: 2026-11-26-unit211-scaled-high-curve-mixed-projections-347c.py
            seconds: 10200
            minutes: 180
          - label: unit211-U-value-atlas
            file: 2026-11-26-unit211-original-U-value-atlas-347c.py
            seconds: 900
            minutes: 30
          - label: unit211-U-L0-w1
            file: 2026-11-26-unit211-U-value-L0-w1-347c.py
            seconds: 1000
            minutes: 30
          - label: unit211-U-S0-collision
            file: 2026-11-26-unit211-U-value-S0-collision-347c.py
            seconds: 360
            minutes: 15
          - label: h21-finite-w-V-infinity-structure
            file: 2026-11-26-h21-zero-hp-finite-w-V-infinity-probe-347c.py
            seconds: 300
            minutes: 15
    env:
      ISP_PIN: ${{ github.sha }}
      ISP_FILE: ${{ matrix.file }}
      ISP_SECONDS: ${{ matrix.seconds }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FLINT_NUM_THREADS: '1'
    steps:
      - name: Select exact arithmetic Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Partial checkout and frozen original equations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-small-exact"
          cd "$RUNNER_TEMP/isp-small-exact"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          timeout 120s git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          ISP_SOURCE_PATH="topics/invariant-subspace-problem/notes/$ISP_FILE"
          ISP_BLOB="$(git rev-parse "$ISP_PIN:$ISP_SOURCE_PATH")"
          git show "$ISP_PIN:$ISP_SOURCE_PATH" > "$RUNNER_TEMP/isp-small-source.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-26-small-exact-actions-driver-347c.py" > "$RUNNER_TEMP/isp-small-driver.py"
          python -m pip install --quiet python-flint==0.9.0 sympy==1.14.0
          python -u "$RUNNER_TEMP/isp-small-driver.py" --checkout "$PWD" --source "$RUNNER_TEMP/isp-small-source.py" --expected-blob "$ISP_BLOB" --seconds "$ISP_SECONDS"
