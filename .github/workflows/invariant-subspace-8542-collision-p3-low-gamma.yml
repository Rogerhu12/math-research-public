name: ISP collision P3 new low Gamma deflated fixed original Q norms
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isp-8542-collision-p3-low-gamma
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ISP_PIN: ${{ github.sha }}
      ISP_FILE: 2026-11-28-unit211-collision-P3-low-Gamma-deflated-original-Q-norms-8542.py
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FLINT_NUM_THREADS: '1'
    steps:
      - name: Prepare exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Pinned FLINT arithmetic
        run: python -m pip install --quiet python-flint==0.9.0
      - name: New exact original input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-equal-six-cofactors"
          cd "$RUNNER_TEMP/isp-equal-six-cofactors"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          timeout 120s git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          ISP_SOURCE_PATH="topics/invariant-subspace-problem/notes/$ISP_FILE"
          ISP_BLOB="$(git rev-parse "$ISP_PIN:$ISP_SOURCE_PATH")"
          git show "$ISP_PIN:$ISP_SOURCE_PATH" > "$RUNNER_TEMP/isp-equal-six-source.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-27-focused-exact-actions-driver-8542.py" > "$RUNNER_TEMP/isp-equal-six-driver.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-unit211-collision-P25-3-whole-weight-original-Q-Delta-power-8542.py" > "$RUNNER_TEMP/2026-11-28-unit211-collision-P25-3-whole-weight-original-Q-Delta-power-8542.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-27-unit211-collision-Delta-nonzero-four-original-exact-input-part1-8542.json" > "$RUNNER_TEMP/2026-11-27-unit211-collision-Delta-nonzero-four-original-exact-input-part1-8542.json"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-27-unit211-collision-Delta-nonzero-four-original-exact-input-part2-8542.json" > "$RUNNER_TEMP/2026-11-27-unit211-collision-Delta-nonzero-four-original-exact-input-part2-8542.json"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-unit211-collision-two-QQ-projections-exact-factor-manifest-8542.json" > "$RUNNER_TEMP/2026-11-28-unit211-collision-two-QQ-projections-exact-factor-manifest-8542.json"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.manifest.json" > "$RUNNER_TEMP/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.manifest.json"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-01.json" > "$RUNNER_TEMP/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-01.json"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-02.json" > "$RUNNER_TEMP/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-02.json"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-03.json" > "$RUNNER_TEMP/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-03.json"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-04.json" > "$RUNNER_TEMP/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-04.json"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-05.json" > "$RUNNER_TEMP/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-05.json"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-06.json" > "$RUNNER_TEMP/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-06.json"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-07.json" > "$RUNNER_TEMP/2026-11-28-unit211-collision-P3-exact-1474-cover-8542.part-07.json"
          python -u "$RUNNER_TEMP/isp-equal-six-driver.py" --checkout "$PWD" --source "$RUNNER_TEMP/isp-equal-six-source.py" --expected-blob "$ISP_BLOB" --seconds 195
