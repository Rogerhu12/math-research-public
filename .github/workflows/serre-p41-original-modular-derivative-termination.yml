name: Serre p41 original modular derivative termination

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R827-public-original-modular-derivative-termination-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R827-public-modular-derivative-termination
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R827_original_modular_derivative_termination.py
            /topics/serre-uniformity/scripts/R827_public_original_modular_derivative_termination.py
            /topics/serre-uniformity/scripts/R827_finite_polynomial_modules.py
            /topics/serre-uniformity/scripts/R811_exact_L_polynomial_modules.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/results/R827-original-global-modular-surjectivity-and-derivative-termination.md
            /topics/serre-uniformity/notes/R827-original-modular-derivative-surjectivity-consumer-method.md
            /topics/serre-uniformity/notes/R827-public-original-modular-derivative-termination-request.json
            /.github/workflows/serre-p41-original-modular-derivative-termination.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse frozen sources without executing mathematics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path("topics/serre-uniformity/scripts")
          for name in ("R827_original_modular_derivative_termination.py",
                       "R827_public_original_modular_derivative_termination.py",
                       "R827_finite_polynomial_modules.py",
                       "R811_exact_L_polynomial_modules.py",
                       "R824_public_original_global_polar_generators.py"):
              path = root/name
              ast.parse(path.read_text(), filename=str(path))
              print("AST_OK", name)
          PY
      - name: Install the frozen arithmetic dependency
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Consume original modular inputs and preserve each complete module operation
        run: |
          python topics/serre-uniformity/scripts/R827_public_original_modular_derivative_termination.py \
            --output "$RUNNER_TEMP/R827/output"
      - name: Verify all original selected inputs and complete output bytes
        run: |
          python topics/serre-uniformity/scripts/R827_public_original_modular_derivative_termination.py \
            --output "$RUNNER_TEMP/R827/output" --verify
      - name: Preserve the one-day active continuation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-global-R827-original-global-modular-derivative-termination-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R827/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
