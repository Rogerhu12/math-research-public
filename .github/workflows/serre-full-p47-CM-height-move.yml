name: Serre full p47 CM height moving operators

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/full-p47-CM-height-move-request.json

permissions:
  contents: read

concurrency:
  group: serre-full-p47-CM-height-move-${{ github.ref }}
  cancel-in-progress: false

jobs:
  CM_height_moving_operators:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/full_p47_weight_one_Hodge_certificate.py
            /topics/serre-uniformity/notes/2026-11-27-full-p47-CM-height-move-method.md
            /topics/serre-uniformity/scripts/full_p47_CM_height_move.py
            /topics/serre-uniformity/results/R1093-certified-original-Gaussian-CM-generator-and-full-MW-lattice.md
            /topics/serre-uniformity/notes/full-p47-CM-height-move-request.json
      - name: Pull pinned official SageMath 10.6 image
        run: docker pull sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      - name: Read actual CM moving units and odd Hecke primitive
        env:
          SERRE_EXPECTED_REQUEST_SHA256: 'bc89913668d6b3d209719a720c7562a7914459441526b6a565fc69edbfc2b7e6'
        run: |
          timeout --signal=TERM --kill-after=30s 120s docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work,readonly" \
            --workdir /work \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SHA \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e SERRE_EXPECTED_REQUEST_SHA256 \
            -e PYTHONUNBUFFERED=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879 \
            sage -python topics/serre-uniformity/scripts/full_p47_CM_height_move.py
