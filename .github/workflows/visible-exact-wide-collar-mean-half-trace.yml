name: visible-exact wide collar mean and half trace

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-wide-collar-mean-half-trace.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-wide-collar-mean-half-trace
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  WIDE_COLLAR_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-wide-collar-mean-half-trace-CI-inputs.json
  WIDE_COLLAR_MANIFEST_SHA: a3a2352c3ee38ee7f326fe998e52340bfc0be7aa7d5b363d1e7787b057b88520
  WIDE_COLLAR_SCI_SHA: 9cfe1e741200467c215b30ffb41bb3c5eed6cadf9f01e029027dc86d636d3c43
  WIDE_COLLAR_WORKER_SHA: 1412c9c46e8efe77d67de47a3bd8201215452e00139ab3136f4fb806dacc8728
  WIDE_COLLAR_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  WIDE_COLLAR_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  wide-collar-mean-half-trace:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the small scientific entry and existing conclusions
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_wide_collar_mean_and_half_trace_CI.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-wide-collar-mean-half-trace-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
            /topics/visible-flex-exact-nearby/notes/wide_collar_mean_half_trace_ci/
      - name: Check the independently pinned worker and complete input manifest
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY_WIDE_COLLAR'
          import ast,hashlib,json,os,pathlib
          w=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_wide_collar_mean_and_half_trace_CI.py')
          assert hashlib.sha256(w.read_bytes()).hexdigest()==os.environ['WIDE_COLLAR_WORKER_SHA']
          ast.parse(w.read_text(),filename=str(w))
          p=pathlib.Path(os.environ['WIDE_COLLAR_MANIFEST'])
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['WIDE_COLLAR_MANIFEST_SHA']
          m=json.loads(p.read_bytes())
          assert m['source_sha256']==os.environ['WIDE_COLLAR_SCI_SHA']
          r=pathlib.Path(os.environ['WIDE_COLLAR_RULES'])
          assert hashlib.sha256(r.read_bytes()).hexdigest()==os.environ['WIDE_COLLAR_RULES_SHA']
          PY_WIDE_COLLAR
      - name: Install the identical directed scalar runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Restrict only the saved full moving mean and combine wide ordinary trace coefficients
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_wide_collar_mean_and_half_trace_CI.py
          --repo "$GITHUB_WORKSPACE"
          --work "$RUNNER_TEMP/visible-exact-wide-collar-mean-half-trace"
          --manifest "$WIDE_COLLAR_MANIFEST" --manifest-sha "$WIDE_COLLAR_MANIFEST_SHA"
          --rules "$WIDE_COLLAR_RULES" --compute-minutes 20
      # Rule15: no numerical native, large audit, Release or Actions artifact is retained.
