name: visible-flex direct reference new scientific task
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-direct-reference-new-task.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visible-flex-direct-reference-new-task
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-direct-reference-new-task.yml
            /.github/workflows/visible-paid-attainer-refinement.yml
            /.github/workflows/visible-curvature-defect-guard.yml
            /.github/workflows/visible-covered-soft-growth.yml
            /.github/workflows/visible-soc-pair-reservation.yml
            /.github/workflows/visible-expanded-layout-hold.yml
            /.github/workflows/visible-expanded-pool-soc.yml
            /.github/workflows/visible-observed-m10-soc.yml
            /topics/visible-flex-new-mechanism/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install the original pinned numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Pull both rules, reuse the authenticated nine-check chain, bind the adapter gate, and carry cumulative science
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path.cwd()
          topic='topics/visible-flex-new-mechanism'
          request_path=topic+'/computations/request-direct-reference-new-task.json'
          raw=Path(request_path).read_bytes();request=json.loads(raw)
          source=os.environ['GITHUB_SHA']
          sys.path.insert(0,str((root/topic/'scripts').resolve()))
          import read_original_actions_log as reader
          expected=request['source_sha256'][topic+'/scripts/read_original_actions_log.py']
          reader.require(hashlib.sha256(Path(reader.__file__).read_bytes()).hexdigest()==expected,'rule reader source changed')
          def emit(tag,value):
              print(tag+' '+reader.encoded(value).decode('utf-8'),flush=True)
          public=reader.actual_pull(root,request,source)
          emit('DIRECT_REFERENCE_PUBLIC_PULL',public)
          reader.require(public['passed'],'public README changed or actual pull failed; apply only the diff before science')
          private={}
          try:
              reader.private_rule_pull(request,private)
          finally:
              emit('DIRECT_REFERENCE_PRIVATE_PULL',private)
          os.environ.pop('MR_TOKEN',None)
          reader.git_ok(root,['checkout','--detach',source])
          for path,expected in request['source_sha256'].items():
              reader.require(hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected,'pinned requested source changed: '+path)
          subprocess.run([sys.executable,'-m','py_compile',*request['new_python_sources']],check=True)
          out=Path(os.environ['RUNNER_TEMP'])/'visible-direct-reference-new-task'/'audit.json'
          code=subprocess.run([sys.executable,topic+'/scripts/frame_metric_direct_reference_audit.py','--request',request_path,'--out',str(out)]).returncode
          for path in sorted(out.parent.glob('*.json')):
              data=path.read_bytes()
              emit('DIRECT_REFERENCE_WORKFLOW_OUTPUT_METADATA',{'filename':path.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'payload_committed_or_uploaded':False})
          raise SystemExit(code)
          PY
      # Reuse the nine completed checks through the second receipt; carry both failed attempts once; no study, check, LP or direction replay.
