name: visible-flex complete response self and current image
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-complete-response-self-current.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visible-flex-complete-response-self-current
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-complete-response-self-current.yml
            /topics/visible-flex-new-mechanism/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Read current rules and observe the one complete Q/current image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path.cwd()
          topic='topics/visible-flex-new-mechanism'
          request_path=topic+'/computations/request-complete-response-self-current.json'
          raw=Path(request_path).read_bytes();request=json.loads(raw)
          source=os.environ['GITHUB_SHA']
          sys.path.insert(0,str((root/topic/'scripts').resolve()))
          import read_original_actions_log as reader
          expected=request['source_sha256'][topic+'/scripts/read_original_actions_log.py']
          reader.require(hashlib.sha256(Path(reader.__file__).read_bytes()).hexdigest()==expected,'rule reader source changed')
          def emit(tag,value):
              print(tag+' '+reader.encoded(value).decode('utf-8'),flush=True)
          emit('CURRENT_Q_REQUEST',{'source_commit':source,'request_bytes':len(raw),'request_sha256':hashlib.sha256(raw).hexdigest(),'source_binding_count':len(request['source_sha256']),'one_joint_observation':True,'original_cost_labels':144,'formal_u_targets':18,'new_development_checks':2,'old_science_executions':0})
          public=reader.actual_pull(root,request,source)
          emit('CURRENT_Q_PUBLIC_PULL',public)
          reader.require(public['passed'],'public rules changed or actual pull failed; apply only the diff before science')
          private={}
          try:
              reader.private_rule_pull(request,private)
          finally:
              emit('CURRENT_Q_PRIVATE_PULL',private)
              os.environ.pop('MR_TOKEN',None)
          reader.git_ok(root,['checkout','--detach',source])
          for path,expected in request['source_sha256'].items():
              reader.require(hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected,'pinned requested source changed: '+path)
          entry=request['entry_point']
          reader.require(entry==topic+'/scripts/literature_complete_response_self_current.py','the single joint observation entry changed')
          out=Path(os.environ['RUNNER_TEMP'])/'visible-complete-response-self-current'
          code=0
          try:
              code=subprocess.run([sys.executable,entry,'--request',request_path,'--out',str(out/'complete-response-self-current.json')]).returncode
          finally:
              for path in sorted(out.glob('*.json*')):
                  data=path.read_bytes()
                  emit('CURRENT_Q_OUTPUT_METADATA',{'filename':path.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'payload_committed_or_uploaded':False})
          raise SystemExit(code)
          PY
      # Standard library only. One new 144-column whole-Q/current observation.
      # Sequential exact records plus a final cost-preserving summary.
      # Exactly two new adapter checks; no old ranks, forcing, roots, profiles,
      # development suites, artifacts, or machine-output payload commits.
