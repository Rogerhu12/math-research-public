name: visible-exact regular-transport second-local-vector reduction

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-regular-transport-second-local-vector.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-regular-transport-second-local-vector
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  L2_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-regular-transport-second-local-vector-CI-inputs.json
  L2_MANIFEST_SHA: df685783e022195c0e27df855d5dc401bdda6338fefb8ea138f8bc0ac97bac95
  L2_PIPELINE_SHA: 119403890566a97329c78d96a1be09412048724f6ff4b96dc53065f1fc29a6b6
  L2_WORKER_SHA: 2fbca96344b1e41d302ba6d81e81353f55edd0328565e3b8806d277aa34ba7c0
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  regular-transport-second-local-vector:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_transport_second_local_vector_ci.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-regular-transport-second-local-vector-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_transport_second_local_vector_ci.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['L2_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_transport_second_local_vector_ci.py --mode hydrate
          --manifest "$L2_MANIFEST" --manifest-sha "$L2_MANIFEST_SHA"
          --pipeline-sha "$L2_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new source before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_transport_second_local_vector.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['L2_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the identical completed scientific runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5 scipy==1.17.0
      - name: Check the full immutable AST closure and evaluate only the new complete second-vector and rank bound
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_transport_second_local_vector_ci.py --mode run
          --manifest "$L2_MANIFEST" --manifest-sha "$L2_MANIFEST_SHA"
          --pipeline-sha "$L2_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-regular-transport-second-local-vector-science"
          --out-dir "$RUNNER_TEMP/visible-exact-regular-transport-second-local-vector-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
