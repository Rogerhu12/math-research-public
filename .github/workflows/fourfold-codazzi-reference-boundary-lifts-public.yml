name: Complete reference boundary lifts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-reference-boundary-lifts-public.yml

permissions:
  contents: write

concurrency:
  group: reference-boundary-lifts-thread-recovery-v2
  cancel-in-progress: false

jobs:
  complete-reference-boundary:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_collar_volterra_dual_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-20-reference-boundary-lifts-thread-recovery-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the unchanged directed runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Evaluate complete exact-reference boundary Grams
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_collar_volterra_dual_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-20-reference-boundary-lifts-thread-recovery-inputs.json --manifest-sha 38ff0e8f5f3ca03a752a5836ec43baa72a31aefcf29a2d3e4421d0d399323f6d
