name: visible-exact complete cut direction and same continuous Z boundary sources

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-complete-cut-direction-and-same-Z.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-cut-direction-and-same-Z
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  COVER_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-cut-direction-and-same-Z-CI-inputs.json
  COVER_MANIFEST_SHA: 6a38fdc16b65fd052fcf85fc91d239941d82d695fd29a71f7ecad8398c8daad2
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  plan:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 60
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-cut-direction-and-same-Z-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate all pinned original bytes and exact new source definitions
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$COVER_MANIFEST" --manifest-sha "$COVER_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/complete_cut_Z_source_ci/
      - name: Parse the new exact sources without executing mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_complete_cut_direction_Z_sources.py','fourfold_codazzi_complete_cut_direction_Z_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('All new sources passed Python AST parsing; mathematics has not run.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible native and output paths
        id: paths
        run: |
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-full-cut-Z-prepared" >> "$GITHUB_OUTPUT"
          printf 'cap=%s\n' "$RUNNER_TEMP/visible-exact-full-cut-Z-cap" >> "$GITHUB_OUTPUT"
          printf 'capcut=%s\n' "$RUNNER_TEMP/visible-exact-full-cut-Z-capcut" >> "$GITHUB_OUTPUT"
          printf 'boundary=%s\n' "$RUNNER_TEMP/visible-exact-full-cut-Z-boundary" >> "$GITHUB_OUTPUT"
          printf 'pilot=%s\n' "$RUNNER_TEMP/visible-exact-full-cut-Z-completed-v3" >> "$GITHUB_OUTPUT"
          printf 'plan=%s\n' "$RUNNER_TEMP/visible-exact-full-cut-Z-actual-plan" >> "$GITHUB_OUTPUT"
          printf 'ranges=%s\n' "$RUNNER_TEMP/visible-exact-full-cut-Z-actual-ranges" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-full-cut-Z-output" >> "$GITHUB_OUTPUT"
      - name: Receive the successful complete original physical cap
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43583838015
          name: visible-exact-cap128-recovered-complete-43583838015-1
          path: ${{ steps.paths.outputs.cap }}
      - name: Receive the actual complete moving cut and full Hessian bridge
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43587619797
          name: visible-exact-complete-cap-cut-43587619797-1
          path: ${{ steps.paths.outputs.capcut }}
      - name: Receive the actual original complete raw boundary traces and means
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43599771405
          name: visible-exact-known-response-boundary-43599771405-1
          path: ${{ steps.paths.outputs.boundary }}
      - name: Reuse all sixteen successful v3 one-column cells and exact endpoint errors
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43610982446
          name: visible-exact-known-cut-direction-cap-pilot-v3-43610982446-1
          path: ${{ steps.paths.outputs.pilot }}
      - name: Run the actual plan with real pull and README checks every ten minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_cut_direction_Z_CI.py
          --manifest "$COVER_MANIFEST" --manifest-sha "$COVER_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --phase plan --workflow-run "${{ github.run_id }}"
          --cap-artifact "$RUNNER_TEMP/visible-exact-full-cut-Z-cap"
          --cap-cut-artifact "$RUNNER_TEMP/visible-exact-full-cut-Z-capcut"
          --boundary-artifact "$RUNNER_TEMP/visible-exact-full-cut-Z-boundary"
          --pilot-artifact "$RUNNER_TEMP/visible-exact-full-cut-Z-completed-v3"
          --work "$RUNNER_TEMP/visible-exact-full-cut-Z-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-full-cut-Z-output"
          --compute-minutes 30 --checkpoint-minutes 10
      - name: Require nonempty actual process evidence and a small artifact inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          data=(json.dumps(entries,indent=2)+'\n').encode()
          if len(data)>60000:
              raise RuntimeError('artifact inventory exceeded the strict plaintext limit; all original evidence is retained')
          (root/'artifact-inventory.json').write_bytes(data)
          print(dict(actual_files=len(files),nonempty_output_verified=True,inventory_bytes=len(data)))
          PY_INVENTORY
      - name: Preserve the actual native and every failed prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-complete-cut-Z-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error

  range:
