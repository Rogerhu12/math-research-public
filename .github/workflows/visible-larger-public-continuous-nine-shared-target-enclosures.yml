      TARGET_SCIENCE_OUTCOME: ${{ needs.compute.outputs.target_science_outcome }}
    steps:
      - name: Print bounded original readout with honest unavailable case
        run: |
          python - <<'PYREPORT'
          import hashlib,json,os
          text=os.environ.get('SCALAR_SUMMARY','')
          if not text:
            text=json.dumps(dict(schema='request147-actual-continuous-E-output-unavailable-v1',
