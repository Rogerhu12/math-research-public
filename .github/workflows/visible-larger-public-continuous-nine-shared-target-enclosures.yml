      - name: Preserve existing construction metadata even if its primary output was interrupted
        id: construction_readback
        if: always()
        env:
          ACTUAL_CONSTRUCTION_SUMMARY: ${{ steps.construction.outputs.construction_summary }}
          ACTUAL_CONSTRUCTION_SUMMARY_BYTES: ${{ steps.construction.outputs.construction_summary_bytes }}
          ACTUAL_CONSTRUCTION_SUMMARY_SHA256: ${{ steps.construction.outputs.construction_summary_sha256 }}
        run: |
          python - <<'PYCONSTRUCTIONREAD'
          import hashlib,json,os
          from pathlib import Path
          base=Path(os.environ['VISIBLE_BASE']);directory=base/'construction'
          text=os.environ.get('ACTUAL_CONSTRUCTION_SUMMARY','')
          def canonical(value):
            return (json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=True,allow_nan=False)+'\n').encode()
          if text:
            raw=(text+'\n').encode()
            assert len(raw)==int(os.environ['ACTUAL_CONSTRUCTION_SUMMARY_BYTES'])
            assert hashlib.sha256(raw).hexdigest()==os.environ['ACTUAL_CONSTRUCTION_SUMMARY_SHA256']
            assert json.loads(raw)['schema']=='request147-actual-v3-continuous-nine-construction-v1'
          else:
            records=[]
            for name in ('actual-R323-new-continuous-nine-recipe.json','actual-R323-width-selection.json',
                         'factory/result.json','construction-result.json'):
              path=directory/name
              if not path.is_file():continue
              data=path.read_bytes()
              item=dict(file=name,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              try:item['value']=json.loads(data)
              except Exception as error:item['actual_parse_error']=repr(error)
              records.append(item)
            value=dict(schema='request147-actual-v3-continuous-nine-construction-v1',
              run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],
              summary_complete=False,primary_output_unavailable=True,actual_existing_metadata=records,
              original_construction_step_outcome='${{ steps.construction.outcome }}',
              no_missing_result_or_interrupted_domain_is_claimed_complete=True,
              readback_performs_no_scientific_arithmetic=True,actual_BVP_or_fullDN_success=False)
            raw=canonical(value)
            if len(raw)>90000:
              source=raw.decode('ascii');chunks=[source[i:i+20000] for i in range(0,len(source),20000)]
              identity=dict(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),segments=len(chunks))
              for index,chunk in enumerate(chunks):
                print(json.dumps(dict(event='request147_interrupted_construction_metadata_segment',
                  index=index,segments=len(chunks),complete_identity=identity,data=chunk)),flush=True)
              raw=canonical(dict(schema=value['schema'],run_id=value['run_id'],source_commit=value['source_commit'],
                summary_complete=False,primary_output_unavailable=True,complete_existing_metadata_log=identity,
                actual_existing_files=[{k:v for k,v in item.items() if k!='value'} for item in records],
                actual_BVP_or_fullDN_success=False,no_interrupted_domain_completion_inferred=True))
          assert len(raw)<=90000
          print('BEGIN_REQUEST147_CONTINUOUS_NINE_CONSTRUCTION_SUMMARY')
          print(raw.decode(),end='')
          print('END_REQUEST147_CONTINUOUS_NINE_CONSTRUCTION_SUMMARY')
          print(json.dumps(dict(event='request147_construction_readback_identity',bytes=len(raw),
            sha256=hashlib.sha256(raw).hexdigest(),hash_scope='canonical ASCII UTF8 including final LF')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
            stream.write('construction_summary='+raw.decode().rstrip('\n')+'\n')
            stream.write('construction_summary_bytes='+str(len(raw))+'\n')
            stream.write('construction_summary_sha256='+hashlib.sha256(raw).hexdigest()+'\n')
          PYCONSTRUCTIONREAD
