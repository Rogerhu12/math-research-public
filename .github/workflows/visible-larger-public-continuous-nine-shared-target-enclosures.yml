            print(json.dumps(dict(event='request165_owned_temporary_payload_removed',
              readback_step_outcomes=outcomes,original_scientific_step_outcomes=original,
              raw_outputs_or_recovered_inputs_not_uploaded=True)),flush=True)
          except Exception as error:
            print(json.dumps(dict(event='request165_owned_cleanup_error',error=repr(error),
              readback_step_outcomes=outcomes,original_scientific_step_outcomes=original,
              separate_from_scientific_partial_or_complete_result=True)),flush=True)
          PYCLEAN
  report:
    name: Original147 scope and independent165 complete target-enclosure readout
    needs: compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCALAR_SUMMARY: ${{ needs.compute.outputs.scalar_summary }}
