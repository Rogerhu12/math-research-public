            raw=(text+'\n').encode('ascii')
            assert len(raw)==int(os.environ['TARGET_SUMMARY_BYTES'])<=90000
            assert hashlib.sha256(raw).hexdigest()==os.environ['TARGET_SUMMARY_SHA256']
            value=json.loads(raw)
            assert value['schema']=='request165-shared-calibration-complete-nine-target-enclosures-v1'
          else:
            value=dict(schema='request165-shared-calibration-complete-nine-target-enclosures-v1',
              run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],
              primary_summary_missing=True,summary_complete=False,transport_complete=False,
              full_public_u_closed_cover=False,actual_accepted_field_created=False,
              target_step_outcome=os.environ.get('TARGET_SCIENCE_OUTCOME'),
              no_missing_scientific_bound_or_domain_claimed=True)
            raw=(json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=True)+'\n').encode('ascii')
          print('BEGIN_REQUEST165_COMMON_U_TARGET_SUMMARY')
          print(raw.decode('ascii'),end='')
          print('END_REQUEST165_COMMON_U_TARGET_SUMMARY')
          print(json.dumps(dict(event='request165_report_identity',bytes=len(raw),
            sha256=hashlib.sha256(raw).hexdigest(),hash_scope='canonical ASCII UTF8 including final LF',
            target_step_outcome=os.environ.get('TARGET_SCIENCE_OUTCOME'),
            compute_job_result=os.environ.get('COMPUTE_RESULT'),
            no_new_scientific_arithmetic=True,raw_artifact_release_git_upload=False)))
          PYTARGETREPORT
