name: visible-larger request149 persistent Decimal50 same literal model
'on':
  push:
    branches:
    - main
    paths:
    - topics/visible-flex-larger-amplitude/computations/public-nine-control-decimal-request.json
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: visible-larger-public-nine-control-decimal
  cancel-in-progress: false
jobs:
  compute:
    name: One persistent Decimal50 full3 eight-direction experiment
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    outputs:
      chain_summary: ${{ steps.chain.outputs.chain_summary }}
      chain_summary_bytes: ${{ steps.chain.outputs.chain_summary_bytes }}
      chain_summary_sha256: ${{ steps.chain.outputs.chain_summary_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        filter: blob:none
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /README.md
          /topics/visible-flex-larger-amplitude/*.md
          /topics/visible-flex-larger-amplitude/computations/
    - name: Establish independent temporary metadata paths
      run: |
        git config gc.auto 0
        git config gc.autoPackLimit 0
        git config maintenance.auto false
        git config --global merge.stat false
        mkdir -p "$RUNNER_TEMP/visible-nine-control-decimal"
        echo "VISIBLE_OUT=$RUNNER_TEMP/visible-nine-control-decimal" >> "$GITHUB_ENV"
        echo "VISIBLE_INPUTS=$RUNNER_TEMP/visible-nine-control-decimal/original-inputs" >> "$GITHUB_ENV"
        echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.14
    - name: Install original projection runtime; Decimal is standard library
      run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
    - name: Bind actual146 parent,100 sources,7 supports and four original inputs
      run: |
        python - <<'PYPINS'
        import ast,hashlib,json,os,subprocess
        from pathlib import Path,PurePosixPath
        repo=Path.cwd();comp=Path(os.environ['VISIBLE_COMPUTATIONS']);out=Path(os.environ['VISIBLE_OUT'])
        input_root=Path(os.environ['VISIBLE_INPUTS']);input_root.mkdir(parents=True,exist_ok=False)
        raw=(comp/'public-nine-control-decimal-request.json').read_bytes();request=json.loads(raw)
        assert request['repository']=='Rogerhu12/math-research-public' and request['request_number']==149
        assert request['schema']=='public-nine-control-persistent-decimal50-single-temporary-batch-request-v1'
        assert request['lanes']==['smallcoreresonance']
        assert request['execution_entry']=='geometry_20261115_nine_control_decimal_temporary_batch.py'
        assert request['scientific_entry']=='geometry_20261115_small_core_nine_control_decimal_recipe.py'
        wanted_new=json.loads(r'''{"geometry_20261115_nine_control_decimal_literal_model.py":"2422be0c2e30d10c38b56ff7b68412c5397d37ed36451676bb16acbdc142ef75","geometry_20261115_nine_control_decimal_curved_search.py":"433d5ddd2587efa581fb28ea151ddf3cec5b6a63eb5017340375d1f19b6d98d0","geometry_20261115_small_core_nine_control_decimal_recipe.py":"66906f121c52f6dc57894efa368299990eea45f2f1d4fc5e6ce4af2fc5b9536e","geometry_20261115_nine_control_decimal_temporary_batch.py":"4f5ca501a1253cf3cbfe6fd0b4543e550ad312850bac334b99b2f2503de50943","root_20261115_nine_control_decimal_scalar_readout.py":"18583ca2f78b19976ce2d68b999556ff1139f07e0d842a575d1c9188bbd8b5dc"}''')
        for name,digest in wanted_new.items():
         assert request['source_sha256'].get(name,request['workflow_support_source_sha256'].get(name))==digest
        assert request['batch_chain']=={'max_batches':1,'one_atomic_eight_direction_child':True,'reset_initial_relative_radius':False,'carry_actual_radius':True,'extra_numeric_acceptance_or_continuation_gate':False}
        expected=json.loads(r'''{"parameters":[0.3055213835477326,0.21645013203050154,0.34270051957744246,-0.06322334619266512,-0.01747451701873286,0.9376115689625685,1.0751306255033548,0.6886900390922872,0.9385431607625546],"initial_relative_radius":4.76837158203125e-8,"decimal_digits":50,"rounding":"ROUND_HALF_EVEN","candidate_steps":8,"backtracks":20,"normal_iterations":12,"normal_backtracks":20,"normal_target_tolerance":"1e-8","candidate_resonance_tolerance":"1e-8","interval_bits":160,"interval_depth":14,"original_mesh_nodes":699,"field_modes":112,"tail_modes":112,"original_low_modes":3,"physical_angle_grid":2048,"material_and_boundary_angles":4096,"original_RHS_workers":1,"original_algorithmic_epsilon_is_retained_binary64_constant":true}''')
        assert request['diagnostic']==expected
        for path,blob in request['reviewed_README_blobs'].items():
         assert subprocess.check_output(['git','hash-object',path],text=True).strip()==blob,'README changed: read and apply actual rules'
        handoff=(repo/'topics/visible-flex-larger-amplitude/HANDOFF.md').read_bytes()
        assert len(handoff)<=10000 and sum(line.startswith('规则同步记录：'.encode()) for line in handoff.splitlines())==1
        for group,count in [('source_sha256',100),('workflow_support_source_sha256',7)]:
         assert len(request[group])==count
         for name,digest in request[group].items():
          assert PurePosixPath(name).name==name
          b=(comp/name).read_bytes();assert hashlib.sha256(b).hexdigest()==digest,name
          if name.endswith('.py'):compile(ast.parse(b,filename=name),name,'exec')
        origin=request['source_closure']['origin_producer'];current=request['source_closure']['current_producer']
        assert len(origin)==33 and len(current)==36
        added=['geometry_20261115_nine_control_decimal_literal_model.py','geometry_20261115_nine_control_decimal_curved_search.py','geometry_20261115_small_core_nine_control_decimal_recipe.py']
        assert current=={**origin,**{name:request['source_sha256'][name] for name in added}}
        assert all(request['source_sha256'][name]==digest for name,digest in current.items())
        item=request['parameter_recipe'];recipe_raw=(repo/item['file']).read_bytes()
        assert len(recipe_raw)==2452==item['bytes']
        assert hashlib.sha256(recipe_raw).hexdigest()==item['sha256']=='c9f5908efe8254d785ac56a77e664522e3b36ffdedb3e40c3a744745846a0123'
        recipe=json.loads(recipe_raw)
        assert recipe['schema']=='R259-explicit-nine-control-parameters-and-radius-recipe-v1'
        assert recipe['literal_parameters']==request['diagnostic']['parameters']
        assert recipe['origin']==item['origin']==request['actual146_source_provenance']['origin']
        assert recipe['origin']['producer_file']=='geometry_20261115_small_core_nine_control_direct_normal_response_recipe.py'
        assert recipe['origin']['producer_sha256']=='c717bafb95854bef7b60048a8194b9949a30fbff29bc5e1eee8a0dbb25cf233b'
        assert recipe['origin']['producer_schema']=='R259-nine-control-full-three-direct-normal-response-carried-radius-trust-recipe-v1'
        assert recipe['origin']['run_id']=='43716274591' and recipe['origin']['source_commit']=='69765fcd81ca84819cdeb09c4fe14c55fdb5fb80'
        assert recipe['origin']['status_bytes']==2741264 and recipe['origin']['status_sha256']=='252a9ceabf63305cdab40312b104e397acb7a8deb52ea513d4ecc038104d80e5'
        assert recipe['origin']['log_summary_bytes']==73169 and recipe['origin']['log_summary_sha256']=='befc5446223c3f45bc96f4d53aeae6e0115f2fe3214051bc4219f2465fefe1e9'
        assert recipe['algorithm_state']==item['algorithm_state']=={'relative_trust_radius':4.76837158203125e-8}
        assert recipe['family']==item['family']
        assert recipe['input_sha256']=={k:v['sha256'] for k,v in request['inputs'].items()}
        history=request['original_input_history_commit']
        assert history=='8bd267107cc8710d371f3b62c02986655ac965b0'
        subprocess.run(['git','fetch','--filter=blob:none','--no-tags','origin',history],check=True)
        paths={}
        for key,item in request['inputs'].items():
         rel=PurePosixPath(item['file'])
         assert not rel.is_absolute() and '..' not in rel.parts and str(rel).startswith('topics/visible-flex-larger-amplitude/')
         b=subprocess.check_output(['git','show',history+':'+str(rel)])
         assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256']
         p=input_root/(key+'-'+rel.name);p.write_bytes(b);paths[key]=str(p)
        (out/'original-input-paths.json').write_text(json.dumps(paths,sort_keys=True)+'\n')
        head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        assert head==os.environ['GITHUB_SHA']
        print(json.dumps(dict(event='request149-source-input-identity',source_commit=head,request_sha256=hashlib.sha256(raw).hexdigest(),source_count=100,workflow_support_source_count=7,origin_child_source_count=33,current_child_source_count=36,parameter_recipe_sha256=request['parameter_recipe']['sha256'],actual146_parameters_and_radius_from_published_recipe=True,parent_state_J_merit_FD_not_reused=True,math_inputs_restored_under_RUNNER_TEMP=True,scientific_model_not_executed_in_this_metadata_step=True,raw_output_retention=False)),flush=True)
        PYPINS
    - name: Restore original78 public numerical source files once
      run: |
        PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYSOURCE'
        import os
        from pathlib import Path
        from exact_20261114_public_resume import prepare_public_source
        source=prepare_public_source(Path.cwd(),Path(os.environ['RUNNER_TEMP'])/'nine-control-decimal-original-source',Path(os.environ['VISIBLE_OUT']))
        with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
        PYSOURCE
    - name: Persistent Decimal50 complete primal,response,QR and original8x20 search
      id: science
      timeout-minutes: 75
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PYTHONPATH="$VISIBLE_COMPUTATIONS" python -u - <<'PYRUN'
        import hashlib,json,os,sys
        from pathlib import Path
        import root_20261114_current576_rules_runner as runner
        comp=Path(os.environ['VISIBLE_COMPUTATIONS']).resolve();repo=Path(os.environ['GITHUB_WORKSPACE']);out=Path(os.environ['VISIBLE_OUT'])
        request_path=comp/'public-nine-control-decimal-request.json'
        request=json.loads(request_path.read_text());request_sha=hashlib.sha256(request_path.read_bytes()).hexdigest()
        if Path(runner.__file__).resolve()!=comp/'root_20261114_current576_rules_runner.py':
         raise ValueError('Use the frozen original metadata runner')
        wanted_source=request['workflow_support_source_sha256']['root_20261114_current576_rules_runner.py']
        if hashlib.sha256(Path(runner.__file__).read_bytes()).hexdigest()!=wanted_source:
         raise ValueError('The original rules runner source changed')
        wanted=request['reviewed_README_blobs']
        if set(wanted)!={'README.md','topics/visible-flex-larger-amplitude/README.md'}:
         raise ValueError('Both reviewed rules identities are required')
        baselines={}
        for name,expected in wanted.items():
         raw=(repo/name).read_bytes()
         blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
         if blob!=expected:raise ValueError('Reviewed README changed: '+name)
         baselines[name]=dict(blob=blob,text=raw.decode())
        old={name:item['blob'] for name,item in runner.BASELINES.items()}
        runner.BASELINES=baselines
        print(json.dumps(dict(event='request149_explicit_rules_baseline_update',unchanged_runner_sha256=wanted_source,old_embedded_blobs=old,reviewed_current_blobs=wanted,period_seconds=runner.PERIOD_SECONDS,original_true_pull_rebase_diff_and_stop_on_changed_rules_retained=True)),flush=True)
        argv=[sys.executable,'-u',str(comp/request['execution_entry']),
         '--request',str(request_path),'--request-sha256',request_sha,
         '--repository-directory',str(repo),
         '--original-input-paths',str(out/'original-input-paths.json'),
         '--rules-directory',str(out/'rule-sync'),
         '--out',str(out/request['output_directory'])]
        print(json.dumps(dict(event='request149_actual_experiment_argv',argv=argv,
         actual_initial_parameters=request['diagnostic']['parameters'],
         actual_initial_radius=request['diagnostic']['initial_relative_radius'],
         arithmetic='Decimal50/ROUND_HALF_EVEN, exact original64 coefficient lifts',
         all_subsequent_owner_updates_remain_high_precision=True,
         full3_unweighted_original_Armijo_and_all_nine_columns_retained=True,
         original8x20_outer_and12x20_normal_budgets_retained=True,
         original54_FD_Arb_and453circle_checks_at_declared_binary64_projection=True,
         projection_never_replaces_persistent_owner=True,
         highprecision_forward_and54_FD_are_additional_current_point_readbacks=True,
         no_new_rank_or_inner_target_gate=True,native_or_nonzero_field_completion_not_claimed=True,
         scientific_source_sha256=request['source_sha256'][request['scientific_entry']])),flush=True)
        sys.argv=[runner.__file__,'--out',str(out/'rule-sync'),'--command',*argv]
        raise SystemExit(runner.main())
        PYRUN
    - name: Read all eight planned directions or honest partial; never rerun science
      id: chain
      if: always()
      run: |
        python "$VISIBLE_COMPUTATIONS/geometry_20261115_nine_control_decimal_temporary_batch.py" \
          --report-only \
          --out "$VISIBLE_OUT/nine-control-decimal50-temporary-batch" \
          --rules-directory "$VISIBLE_OUT/rule-sync" \
          --compute-outcome "${{ steps.science.outcome }}"
    - name: Preserve complete original child errors before temporary cleanup
      if: always()
      run: |
        python - <<'PYERRORS'
        import hashlib,json,os
        from pathlib import Path
        root=Path(os.environ['VISIBLE_OUT'])/'nine-control-decimal50-temporary-batch'
        chain=root/'chain-metadata.json'
        value=json.loads(chain.read_bytes()) if chain.is_file() else {}
        names=['producer-stderr.txt','reader-stderr.txt']
        if value.get('child_exit_code')!=0:
         names.append('producer-stdout.txt')
        for name in names:
         path=root/name
         if not path.is_file():continue
         raw=path.read_bytes();whole=hashlib.sha256(raw).hexdigest()
         count=max(1,(len(raw)+11999)//12000)
         print(json.dumps(dict(event='request149-complete-child-log-identity',file=name,bytes=len(raw),sha256=whole,parts=count,transport='Each text uses UTF-8 surrogateescape; concatenate encode(utf-8,surrogateescape) by exact byte range to reconstruct original bytes',no_scientific_evaluation=True),ensure_ascii=True),flush=True)
         for part in range(count):
          start=12000*part;piece=raw[start:start+12000]
          record=dict(event='request149-complete-child-log-part',file=name,file_bytes=len(raw),file_sha256=whole,part=part,parts=count,byte_start=start,byte_stop=start+len(piece),bytes=len(piece),sha256=hashlib.sha256(piece).hexdigest(),utf8_surrogateescape_text=piece.decode('utf-8','surrogateescape'))
          encoded=json.dumps(record,sort_keys=True,separators=(',',':'),ensure_ascii=True).encode('ascii')
          if len(encoded)>90000:raise ValueError('Complete error-text segment exceeds bound; do not claim complete transport')
          print(encoded.decode('ascii'),flush=True)
        PYERRORS
    - name: Remove only this request temporary inputs, source cache and scientific payloads
      if: always()
      run: |
        python - <<'PYCLEAN'
        import json,os,shutil,stat
        from pathlib import Path
        runner=Path(os.environ['RUNNER_TEMP']).resolve();base=Path(os.environ['VISIBLE_OUT'])
        targets=[base/'nine-control-decimal50-temporary-batch',base/'original-inputs',runner/'nine-control-decimal-original-source']
        removed=[]
        def own_tree_writable(path):
         if path.is_symlink():raise ValueError('Do not follow a cleanup symlink')
         for parent,dirs,files in os.walk(path,topdown=True,followlinks=False):
          p=Path(parent);s=p.lstat()
          if s.st_uid!=os.getuid():raise PermissionError('Cleanup only request-owned trees')
          os.chmod(p,stat.S_IMODE(s.st_mode)|stat.S_IWUSR|stat.S_IXUSR)
          for name in dirs+files:
           child=p/name;s=child.lstat()
           if stat.S_ISLNK(s.st_mode):continue
           if s.st_uid!=os.getuid():raise PermissionError('Cleanup only request-owned entries')
           os.chmod(child,stat.S_IMODE(s.st_mode)|stat.S_IWUSR|(stat.S_IXUSR if stat.S_ISDIR(s.st_mode) else 0))
        for target in targets:
         if target.is_symlink():raise ValueError('Do not follow a cleanup symlink')
         target.resolve().relative_to(runner)
         if target.is_dir():
          own_tree_writable(target);shutil.rmtree(target);removed.append(str(target.relative_to(runner)))
        print(json.dumps(dict(event='request149_temporary_scientific_payloads_removed',relative_directories=removed,compact_chain_index_step_precedes_cleanup=True,readout_success_not_inferred_from_cleanup=True,raw_artifact_or_Release_upload=False)),flush=True)
        PYCLEAN
  report:
    name: Bounded one-batch index; complete normal and FD records remain in compute log
    needs:
    - compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
    - name: Print bounded original chain index and exact output SHA
      env:
        CHAIN_SUMMARY: ${{ needs.compute.outputs.chain_summary }}
        CHAIN_SUMMARY_BYTES: ${{ needs.compute.outputs.chain_summary_bytes }}
        CHAIN_SUMMARY_SHA256: ${{ needs.compute.outputs.chain_summary_sha256 }}
        COMPUTE_RESULT: ${{ needs.compute.result }}
      run: |
        python3 - <<'PYREPORT'
        import hashlib,json,os
        text=os.environ.get('CHAIN_SUMMARY','')
        if not text:
         payload=dict(schema='request149-compute-output-unavailable-v1',compute_job_result=os.environ.get('COMPUTE_RESULT'),run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],scientific_completion_not_claimed=True)
         raw=json.dumps(payload,sort_keys=True,separators=(',',':')).encode()
        else:
         raw=text.encode('utf-8')
         if len(raw)>90000:raise ValueError('Compute job output exceeded the explicit small summary bound')
         if len(raw)!=int(os.environ['CHAIN_SUMMARY_BYTES']) or hashlib.sha256(raw).hexdigest()!=os.environ['CHAIN_SUMMARY_SHA256']:
          raise ValueError('The original compute-to-report JSON output identity changed')
         json.loads(raw)
        print('BEGIN_VISIBLE149_CHAIN_SUMMARY')
        print(raw.decode('utf-8'))
        print('END_VISIBLE149_CHAIN_SUMMARY')
        print(json.dumps(dict(event='visible149-chain-summary-sha256',bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),hash_scope='UTF-8 JSON string excluding log separator LF',compute_job_result=os.environ.get('COMPUTE_RESULT'),run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'])),flush=True)
        PYREPORT
