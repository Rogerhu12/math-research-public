name: visible-exact cached complete97 cap adjoint proposal

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_cap_adjoint_proposal.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_cap_adjoint_proposal_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cached-cap-adjoint-proposal-CI-inputs.json'
      - '.github/workflows/visible-exact-cached-cap-adjoint-proposal.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-cached-complete97-cap-adjoint-proposal
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  ADJOINT_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cached-cap-adjoint-proposal-CI-inputs.json
  ADJOINT_MANIFEST_SHA: a5260c946c731d3b50c3bdb2a76fa7aec7b653ad3bec6c9eb844b8bb37be982d
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  exact-texts:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Partially check out the two exact new sources
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_cap_adjoint_proposal.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_cap_adjoint_proposal_CI.py
      - name: Check both exact SHA256s and syntax without mathematical imports
        run: |
          python - <<'PY_EXACT_AST'
          import ast,hashlib,pathlib
          expected={
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_cap_adjoint_proposal.py':'5cdff6d9f51db3e99a3a89738001856182b155ae46819c6c796acdceb8480a89',
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_cap_adjoint_proposal_CI.py':'f83b29bcf559820a685f3cc66686126a08ac7ed0b1e2e0fc4a45f7cf6d70d19b',
          }
          for name,sha in expected.items():
              raw=pathlib.Path(name).read_bytes()
              if hashlib.sha256(raw).hexdigest()!=sha:
                  raise ValueError('An exact new source changed: '+name)
              ast.parse(raw.decode(),filename=name)
          print('Exact source and worker parsed; no scientific producer imported or executed.')
          PY_EXACT_AST

  proposal:
    needs: exact-texts
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 360
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out sources and separately reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cached-cap-adjoint-proposal-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Set the actual container-visible artifact output path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-cap-adjoint-proposal-output" >> "$GITHUB_OUTPUT"
      - name: Hydrate247 pinned files with all original234 pins unchanged
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$ADJOINT_MANIFEST" --manifest-sha "$ADJOINT_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/cached_cap_adjoint_proposal_ci/
      - name: Install the original pinned arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Build only the new complete97 adjoint QR and preserve every complete prefix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_cap_adjoint_proposal_CI.py
          --manifest "$ADJOINT_MANIFEST" --manifest-sha "$ADJOINT_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --work "$RUNNER_TEMP/visible-exact-cap-adjoint-proposal-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-cap-adjoint-proposal-output"
          --compute-minutes 320 --checkpoint-minutes 10
      - name: Require an actual nonempty process and retain the real success or failure
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_ACTUAL'
          import json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          process=root/'process.json'
          if not process.is_file() or not process.stat().st_size:
              raise RuntimeError('No actual nonempty adjoint process exists')
          d=json.loads(process.read_text())
          if d.get('repository')!='Rogerhu12/math-research-public':
              raise ValueError('The actual process belongs to another repository')
          files=[p for p in root.rglob('*') if p.is_file()]
          print(json.dumps(dict(actual_files=len(files),actual_bytes=sum(p.stat().st_size for p in files),
              process_complete=d.get('complete'),actual_failure=d.get('failure'),
              exact_proposal_state_inventory_sha256=d.get('proposal_state_receipt_sha256'),
              old_targets_recomputed=0,continuous_adjoint_bound_claimed=False)))
          PY_ACTUAL
      - name: Preserve exact QR, all97 state columns, derivatives and every prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cached-cap-adjoint-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
