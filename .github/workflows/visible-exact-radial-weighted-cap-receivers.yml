name: visible-exact radial weighted cap receivers

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-radial-weighted-cap-receivers.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-radial-weighted-cap-receivers
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  RADIAL_CAP_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-radial-weighted-cap-receivers-CI-inputs.json
  RADIAL_CAP_MANIFEST_SHA: 333bff731ec491b362feb665b54bcb2173bbbdc571f3459e03b63a63af72a3af
  RADIAL_CAP_SCI_SHA: f8d97a14aa7c2ebac746a9732e7b9fd00bf939db95b2b610edcd47f22f9388bb
  RADIAL_CAP_WORKER_SHA: e15f0e49fbd84da0b165489cbd8f04ef36477e53e502a12daf3362ced4f458e6
  RADIAL_CAP_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  RADIAL_CAP_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  radial-weighted-cap-receivers:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the small scientific entry and existing conclusions
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_radial_weighted_cap_receivers_CI.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-radial-weighted-cap-receivers-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
            /topics/visible-flex-exact-nearby/notes/radial_weighted_cap_receivers_ci/
      - name: Check the independently pinned worker and complete input manifest
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY_RADIAL_CAP'
          import ast,hashlib,json,os,pathlib
          w=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_radial_weighted_cap_receivers_CI.py')
          assert hashlib.sha256(w.read_bytes()).hexdigest()==os.environ['RADIAL_CAP_WORKER_SHA']
          ast.parse(w.read_text(),filename=str(w))
          p=pathlib.Path(os.environ['RADIAL_CAP_MANIFEST'])
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['RADIAL_CAP_MANIFEST_SHA']
          m=json.loads(p.read_bytes())
          assert m['source_sha256']==os.environ['RADIAL_CAP_SCI_SHA']
          r=pathlib.Path(os.environ['RADIAL_CAP_RULES'])
          assert hashlib.sha256(r.read_bytes()).hexdigest()==os.environ['RADIAL_CAP_RULES_SHA']
          PY_RADIAL_CAP
      - name: Install the identical directed scalar runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Consume only saved cap rows for new radial weights and complete left receivers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_radial_weighted_cap_receivers_CI.py
          --repo "$GITHUB_WORKSPACE"
          --work "$RUNNER_TEMP/visible-exact-radial-weighted-cap-receivers"
          --manifest "$RADIAL_CAP_MANIFEST" --manifest-sha "$RADIAL_CAP_MANIFEST_SHA"
          --rules "$RADIAL_CAP_RULES" --compute-minutes 20
      # Rule15: no numerical native, large audit, Release or Actions artifact is retained.
