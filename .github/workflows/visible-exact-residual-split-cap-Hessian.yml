name: visible-exact residual derivative split cap Hessian

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-residual-split-cap-Hessian.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-residual-split-cap-Hessian
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  HESSIAN_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-residual-split-cap-Hessian-CI-inputs.json
  HESSIAN_MANIFEST_SHA: a3b144b5a6e8c9d84c369f97aac1e849e3035bb7067c461ed574b53b1069d842
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  consume:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 40
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-residual-split-cap-Hessian-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate frozen inputs and parse new text without numerical execution
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$HESSIAN_MANIFEST" --manifest-sha "$HESSIAN_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/residual_split_cap_Hessian_ci/
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_residual_split_cap_Hessian.py','fourfold_codazzi_residual_split_cap_Hessian_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('New source and worker parsed; no mathematical cell executed.')
          PY_AST
      - name: Install pinned directed arithmetic
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set artifact paths inside the actual container
        id: paths
        run: |
          python - <<'PY_PATHS'
          import os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              for name in ('particular','ordinary','output'):
                  stream.write(f'{name}={root}/visible-exact-residual-split-Hessian-{name}\n')
          PY_PATHS
      - name: Receive all original complete module and radial trial norms
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43616252389
          name: visible-exact-particular-cap-Hessian-43616252389-1
          path: ${{ steps.paths.outputs.particular }}
      - name: Receive all original angular and ordinary Hessian norms
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43618931236
          name: visible-exact-ordinary-only-cap-Hessian-43618931236-1
          path: ${{ steps.paths.outputs.ordinary }}
      - name: Consume all1341 scalar source decompositions without repeating an original target or trial
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_residual_split_cap_Hessian_CI.py
          --manifest "$HESSIAN_MANIFEST" --manifest-sha "$HESSIAN_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --particular-artifact "$RUNNER_TEMP/visible-exact-residual-split-Hessian-particular"
          --ordinary-artifact "$RUNNER_TEMP/visible-exact-residual-split-Hessian-ordinary"
          --work "$RUNNER_TEMP/visible-exact-residual-split-Hessian-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-residual-split-Hessian-output"
          --compute-minutes 20 --checkpoint-minutes 10
      - name: Require nonempty actual evidence and a small inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty evidence exists')
          rows=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          data=(json.dumps(rows,indent=2)+'\n').encode()
          if len(data)>60000:raise RuntimeError('inventory too large; preserve every original file')
          (root/'artifact-inventory.json').write_bytes(data)
          print(dict(actual_files=len(files),inventory_bytes=len(data)))
          PY_INVENTORY
      - name: Preserve complete native and every real failure
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-residual-split-cap-Hessian-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
