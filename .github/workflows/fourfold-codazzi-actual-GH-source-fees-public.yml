name: Five complete actual high source rates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-actual-GH-source-fees-public.yml

permissions:
  contents: write

concurrency:
  group: actual-gh-source-fees-first
  cancel-in-progress: false

jobs:
  actual-GH-source-fees-L2:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_collar_volterra_dual_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-20-actual-GH-source-fees-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install fixed directed runtime
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: python-flint==0.9.0
      - name: Run original readonly restoration and five new complete source rates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_collar_volterra_dual_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-20-actual-GH-source-fees-inputs.json --manifest-sha 69449ea01bbdfc202d6a6c763661a13f42efdcb08303fd356b1b32dc2f09887f
