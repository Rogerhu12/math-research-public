name: visible-exact negative old mean compression from complete sources

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-negative-old-mean-compression.yml']
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Optional exact negative-mean run whose accepted source rows will be reused'
        required: false
        type: string
        default: ''
      resume_attempt:
        description: 'Original attempt for the optional exact prefix artifact'
        required: false
        type: string
        default: '1'

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-negative-old-mean-compression
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-negative-old-mean-compression-CI-inputs.json
  PHASE_MANIFEST_SHA: 3a107f5b268af999f336dd8efa7bef0ef4769c05c741aafd3c04de65b49e7204
  PHASE_PIPELINE_SHA: 7465a23e484200dd159e96ad1d00b83bc71d4847f2ed4dd1a39649e42823f886
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-negative-old-mean-compression:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_negative_old_mean_compression_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-negative-old-mean-compression-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate28 exact inputs while retaining every original21 pin
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_negative_old_mean_compression_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the complete pinned import closure before new mathematics
        run: |
          python - <<'PY_SOURCE'
          import ast,json,os,pathlib
          manifest=json.loads(pathlib.Path(os.environ['PHASE_MANIFEST']).read_text())
          for entry in manifest['files']:
              path=pathlib.Path(entry['path'])
              if path.suffix=='.py':ast.parse(path.read_text(),filename=str(path))
          PY_SOURCE
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5
      - name: Set the actual result path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-negative-old-mean-compression-output" >> "$GITHUB_OUTPUT"
      - name: Prepare a separate optional prefix directory
        run: mkdir -p "$RUNNER_TEMP/visible-exact-negative-old-mean-compression-prepared"
      - name: Restore an explicitly selected exact negative mean prefix
        if: ${{ inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-negative-old-mean-compression-${{ inputs.resume_run }}-${{ inputs.resume_attempt }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-negative-old-mean-compression-prepared/resume
      - name: Reuse all old profiles and rows; evaluate only new negative mean bounds and preserve every outcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_negative_old_mean_compression_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-negative-old-mean-compression-science"
          --prepared "$RUNNER_TEMP/visible-exact-negative-old-mean-compression-prepared"
          --out-dir "$RUNNER_TEMP/visible-exact-negative-old-mean-compression-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-negative-old-mean-compression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
