name: visible-larger original full112 live128 FD and fullDN
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-live128-original-full112-FD-fullDN-request.json
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  compute:
    name: Actual219 same-H live128 then original full112 FD and fullDN
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: visible-larger-live128-original-fullDN219
      cancel-in-progress: false
    outputs:
      necessary_json: ${{ steps.necessary.outputs.necessary_json }}
      necessary_bytes: ${{ steps.necessary.outputs.necessary_summary_bytes }}
      necessary_sha256: ${{ steps.necessary.outputs.necessary_summary_sha256 }}
      necessary_complete: ${{ steps.necessary.outputs.necessary_readback_complete }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/README.md
            /topics/visible-flex-larger-amplitude/computations/
      - name: Establish original source paths without creating a scientific receipt
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
          echo "VISIBLE_BASE=$RUNNER_TEMP/visible-live128-original-fullDN219" >> "$GITHUB_ENV"
          echo "VISIBLE_NECESSARY=$RUNNER_TEMP/visible-live128-original-fullDN219-necessary.json" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install unchanged original numerical and binary128 compilation runtime
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python --version
          node --version
          g++ --version
      - name: Bind exact public request source closure and normal source syntax
        run: |
          python - <<'PYSOURCE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          comp=Path(os.environ['VISIBLE_COMPUTATIONS']).resolve()
          path=comp/'public-live128-original-full112-FD-fullDN-request.json'
          raw=path.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='1c9400110f65f5930f833142a85a48ce389df7f652c385fd2435676c369b251b'
          request=json.loads(raw)
          assert request['schema']=='public-live128-original-full112-FD-fullDN-request-v1'
          assert request['request_number']==219 and request['repository']=='Rogerhu12/math-research-public'
          assert request['source_contract']['explicit_source_pin_count']==len(request['source_sha256'])==334
          for name,digest in request['source_sha256'].items():
              file=comp/name
              assert Path(name).name==name and not file.is_symlink()
              source=file.read_bytes()
              assert hashlib.sha256(source).hexdigest()==digest,name
              if file.suffix=='.py':
                  compile(source,str(file),'exec')
              elif file.suffix=='.mjs':
                  subprocess.run(['node','--check',str(file)],check=True)
          repo=Path(os.environ['GITHUB_WORKSPACE'])
          for name,expected in request['reviewed_README_blobs'].items():
              data=(repo/name).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual==expected
          print(json.dumps(dict(event='request219_source_binding',
              request_sha256=hashlib.sha256(raw).hexdigest(),
              sources=len(request['source_sha256']),source_commit=os.environ['GITHUB_SHA'],
              Python_compiled_not_imported=True,Node_syntax_checked_not_executed=True,
              no_CXX_scientific_compilation_or_scientific_evaluation_yet=True)))
          PYSOURCE
      - name: Reserve declared temporary capacity without deleting scientific data
        run: |
          python - <<'PYSPACE'
          import json,os,shutil,subprocess
          from pathlib import Path
          comp=Path(os.environ['VISIBLE_COMPUTATIONS'])
          request=json.loads((comp/'public-live128-original-full112-FD-fullDN-request.json').read_bytes())
          root=Path(os.environ['RUNNER_TEMP']).resolve()
          required=request['resources']['minimum_free_bytes_at_start']
          before=shutil.disk_usage(root)._asdict();removed=[]
          if before['free']<required:
              for name in ('/usr/local/lib/android','/usr/share/dotnet','/opt/ghc'):
                  path=Path(name)
                  if path.is_dir() and not path.is_symlink():
                      subprocess.run(['sudo','rm','-rf','--',name],check=True)
                      removed.append(name)
          after=shutil.disk_usage(root)._asdict()
          print(json.dumps(dict(event='request219_declared_capacity',before=before,after=after,
              minimum_free_bytes_at_start=required,unused_ephemeral_runner_SDKs_removed=removed,
              maximum_uncached_protocol_calls=18,
              all_possible_calls_fit_not_proved=True,
              scientific_payload_deleted=False,
              original320_minute_clock_not_started_yet=True)))
          if after['free']<required:
              raise RuntimeError('Actual runner cannot supply the declared multi-call temporary capacity')
          PYSPACE
      - name: Restore exact actual63 prefix original78 source and actual91 tail initial guess
        id: preparation
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python -u "$VISIBLE_COMPUTATIONS/geometry_20261116_live128_original_fullDN_owned_run.py" prepare \
            --request "$VISIBLE_COMPUTATIONS/public-live128-original-full112-FD-fullDN-request.json" \
            --request-sha256 1c9400110f65f5930f833142a85a48ce389df7f652c385fd2435676c369b251b \
            --namespace "$VISIBLE_BASE"
      - name: Fresh current-H fullJ R273 live128 original FD fullDN and final fresh audit
        id: science
        timeout-minutes: 320
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python -u "$VISIBLE_COMPUTATIONS/geometry_20261116_live128_original_fullDN_owned_run.py" run \
            --request "$VISIBLE_COMPUTATIONS/public-live128-original-full112-FD-fullDN-request.json" \
            --request-sha256 1c9400110f65f5930f833142a85a48ce389df7f652c385fd2435676c369b251b \
            --namespace "$VISIBLE_BASE"
      - name: Quiesce actual owned groups and read one necessary original conclusion
        id: necessary
        if: always()
        timeout-minutes: 20
        run: |
          set +e
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python -u "$VISIBLE_COMPUTATIONS/root_20261116_live128_original_fullDN_necessary.py" \
            --request "$VISIBLE_COMPUTATIONS/public-live128-original-full112-FD-fullDN-request.json" \
            --request-sha256 1c9400110f65f5930f833142a85a48ce389df7f652c385fd2435676c369b251b \
            --namespace "$VISIBLE_BASE" --out "$VISIBLE_NECESSARY"
          read_code=$?
          READ_CODE="$read_code" python - <<'PYOUTPUT'
          import hashlib,json,os
          from pathlib import Path
          path=Path(os.environ['VISIBLE_NECESSARY'])
          if path.is_file():
              raw=path.read_bytes()
              assert len(raw)<=90000
              value=json.loads(raw)
              assert value['schema']=='R501-live128-original-full112-necessary-v1'
              assert value['request_number']==219
              assert value['run']['GITHUB_RUN_ID']==os.environ['GITHUB_RUN_ID']
              assert value['run']['GITHUB_SHA']==os.environ['GITHUB_SHA']
              assert value['request']['sha256']=='1c9400110f65f5930f833142a85a48ce389df7f652c385fd2435676c369b251b'
              delimiter='R501_NECESSARY_'+hashlib.sha256(raw).hexdigest()
              assert delimiter not in raw.decode('ascii')
              with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
                  stream.write('necessary_json<<'+delimiter+'\n'+raw.decode('ascii').rstrip('\n')+'\n'+delimiter+'\n')
                  stream.write('necessary_summary_bytes='+str(len(raw))+'\n')
                  stream.write('necessary_summary_sha256='+hashlib.sha256(raw).hexdigest()+'\n')
                  stream.write('necessary_readback_complete='+str(value.get('necessary_readback_complete') is True).lower()+'\n')
              print(json.dumps(dict(event='request219_one_necessary_transport',
                  actual_reader_exit=int(os.environ['READ_CODE']),bytes=len(raw),
                  sha256=hashlib.sha256(raw).hexdigest(),
                  necessary_readback_complete=value.get('necessary_readback_complete') is True,
                  scientific_success_not_inferred=True)))
          else:
              print(json.dumps(dict(event='request219_necessary_not_returned',
                  actual_reader_exit=int(os.environ['READ_CODE']),
                  actual_scientific_summary_not_invented=True,cleanup_permitted=False)))
          PYOUTPUT
          transport_code=$?
          if [ "$transport_code" -ne 0 ]; then
            exit "$transport_code"
          fi
          exit "$read_code"
      - name: Remove only a completely read and actually quiescent owned namespace
        if: always()
        timeout-minutes: 5
        env:
          NECESSARY_COMPLETE: ${{ steps.necessary.outputs.necessary_readback_complete }}
        run: |
          if [ "$NECESSARY_COMPLETE" = "true" ]; then
            PYTHONPATH="$VISIBLE_COMPUTATIONS" python -u "$VISIBLE_COMPUTATIONS/geometry_20261116_live128_original_fullDN_owned_run.py" cleanup \
              --request "$VISIBLE_COMPUTATIONS/public-live128-original-full112-FD-fullDN-request.json" \
              --request-sha256 1c9400110f65f5930f833142a85a48ce389df7f652c385fd2435676c369b251b \
              --namespace "$VISIBLE_BASE" --summary "$VISIBLE_NECESSARY"
          else
            python - <<'PYSKIP'
            import json,os
            print(json.dumps(dict(event='request219_cleanup',removed=False,
                namespace=os.environ.get('VISIBLE_BASE'),
                reason='no complete same-run necessary return; raw retained until runner destruction',
                no_scientific_completion_or_quiet_inferred=True)))
            PYSKIP
          fi
  report:
    name: One necessary219 conclusion with original failure and unresolved scope
    needs: compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NECESSARY_JSON: ${{ needs.compute.outputs.necessary_json }}
      NECESSARY_BYTES: ${{ needs.compute.outputs.necessary_bytes }}
      NECESSARY_SHA256: ${{ needs.compute.outputs.necessary_sha256 }}
      COMPUTE_RESULT: ${{ needs.compute.result }}
    steps:
      - name: Print the exact single necessary object or its actual absence
        run: |
          python - <<'PYREPORT'
          import hashlib,json,os,sys
          text=os.environ.get('NECESSARY_JSON','')
          if not text:
              print(json.dumps(dict(event='request219_no_necessary_summary',
                  compute_result=os.environ['COMPUTE_RESULT'],
                  scientific_or_transport_success_not_inferred=True)))
              raise SystemExit(2)
          raw=text.encode('ascii')+b'\n'
          assert len(raw)==int(os.environ['NECESSARY_BYTES'])<=90000
          assert hashlib.sha256(raw).hexdigest()==os.environ['NECESSARY_SHA256']
          value=json.loads(raw)
          assert value['schema']=='R501-live128-original-full112-necessary-v1' and value['request_number']==219
          assert value['run']['GITHUB_RUN_ID']==os.environ['GITHUB_RUN_ID']
          assert value['run']['GITHUB_SHA']==os.environ['GITHUB_SHA']
          assert value['request']['sha256']=='1c9400110f65f5930f833142a85a48ce389df7f652c385fd2435676c369b251b'
          print('BEGIN_REQUEST219_LIVE128_ORIGINAL_FULLDN_NECESSARY_SUMMARY',flush=True)
          sys.stdout.write(raw.decode('ascii'));sys.stdout.flush()
          print('END_REQUEST219_LIVE128_ORIGINAL_FULLDN_NECESSARY_SUMMARY',flush=True)
          print(json.dumps(dict(event='request219_report_identity',bytes=len(raw),
              sha256=hashlib.sha256(raw).hexdigest(),compute_result=os.environ['COMPUTE_RESULT'],
              scientific_success_not_inferred_from_job_label=True)))
          PYREPORT
