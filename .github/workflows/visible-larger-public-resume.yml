name: visible-larger public checkpoint continuation

on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-resume-request.json
  workflow_dispatch:
    inputs:
      lane:
        description: Actual computation to continue
        type: choice
        default: all
        options: [all, m96, rk48]

permissions:
  contents: write

jobs:
  continue:
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.lane == 'm96' && '["m96"]' || inputs.lane == 'rk48' && '["rk48"]' || '["m96","rk48"]') }}
    name: Resume ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: visible-larger-public-resume-${{ matrix.lane }}
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-larger-public-resume.yml
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-public-M96-099-recovery/
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-exact-resume-fixedH-RK24-r1/
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-exact-resume-fixedH-RK48-r1/
            /topics/visible-flex-larger-amplitude/notes/2026-11-12-closure-scaled-endpoint-q003-m8-d12-f225-exclusive-ready.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-m28-recovered-full-audit-r1-ready.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1.json.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1-config.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1-tail-response_0003.json.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1-accepted-ready-extracted.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1_coeff_00.npy.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1_coeff_01.npy.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1_coeff_02.npy.gz
      - name: Keep the partial checkout bounded
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install the recorded numerical packages
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Continue the complete saved M96 system
        if: matrix.lane == 'm96'
        timeout-minutes: 315
        run: |
          python -u topics/visible-flex-larger-amplitude/computations/geometry_20261114_public_continuation.py \
            --out "$RUNNER_TEMP/visible-public-results/m96" \
            --work "$RUNNER_TEMP/visible-m96-factors" \
            --jac-workers 2 --budget-seconds 18000
      - name: Complete the genuine RK48 common-grid and closed readout
        if: matrix.lane == 'rk48'
        timeout-minutes: 315
        run: |
          python -u topics/visible-flex-larger-amplitude/computations/exact_20261114_public_resume.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/visible-public-results/rk48" --comparison-processes 2
      - name: Preserve actual outputs including failure checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-public-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visible-public-results/${{ matrix.lane }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
      - name: Commit bounded result files to this public repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u topics/visible-flex-larger-amplitude/computations/root_20261114_publish_actions.py \
            --results "$RUNNER_TEMP/visible-public-results/${{ matrix.lane }}" --lane "${{ matrix.lane }}"
