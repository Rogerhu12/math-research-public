name: Serre p41 original Hodge cube

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R774-public-original-Hodge-cube-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R774-original-p41-Hodge-cube
  cancel-in-progress: false

jobs:
  original_hodge_cube:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-hodge-cube.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R774_original_Hodge_cube.py
            /topics/serre-uniformity/scripts/R774_public_Hodge_cube.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R774-public-original-Hodge-cube-request.json
            /topics/serre-uniformity/notes/R774-original-Hodge-cube-method.md
            /topics/serre-uniformity/results/R772-original-RR-descent-and-exact-function-recovery-certificates.md
            /topics/serre-uniformity/computations/R732-p41-original-CM-model/43608152850-1/p41-original-CM-model-certificate.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Reuse original inputs and generate the complete exact Hodge cube
        continue-on-error: true
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R774_public_Hodge_cube.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R774-original-p41-Hodge-cube-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R774-original-p41-Hodge-cube/output
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve exact blocks and publish small complete or failed receipts
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R774_public_Hodge_cube.py publish
      - name: Require complete exact prefix and original M6 comparison
        if: always()
        run: python topics/serre-uniformity/scripts/R774_public_Hodge_cube.py verify
