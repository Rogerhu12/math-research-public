name: visible-exact complete sources on the whole original physical root piece

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-whole-physical-root-piece-first-Airy-sources.yml']
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Optional exact whole physical root-piece run whose accepted scalar and source stages will be reused'
        required: false
        type: string
        default: ''
      resume_attempt:
        description: 'Original attempt for the optional exact prefix artifact'
        required: false
        type: string
        default: '1'

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-whole-physical-root-piece-first-Airy-sources
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-whole-physical-root-piece-first-Airy-sources-CI-inputs.json
  PHASE_MANIFEST_SHA: d30c306e58f3e6be96768b983db4df840843455e2cc5147c84c6e2d7958e5aac
  PHASE_PIPELINE_SHA: 855bcec6d31a9f0bdb3e3710c4e6418c2be0d816edf09a59da01ab6ec956904d
  PHASE_WORKER_SHA: bc2292cfbb7fb06ad1a4e974255c3e0b3af887b75be46915982d2bb54db3acc7
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-whole-physical-root-piece-first-Airy-sources:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_whole_physical_root_piece_first_Airy_sources_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-whole-physical-root-piece-first-Airy-sources-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Verify the separately pinned publication worker
        run: |
          python - <<'PY_WORKER'
          import hashlib,os,pathlib
          path=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_whole_physical_root_piece_first_Airy_sources_public_worker.py')
          assert hashlib.sha256(path.read_bytes()).hexdigest()==os.environ['PHASE_WORKER_SHA'], 'publication worker changed'
          PY_WORKER
      - name: Hydrate80 exact inputs preserving48 saved norms and all complete exterior sources
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_whole_physical_root_piece_first_Airy_sources_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the complete pinned Python source closure without running mathematics
        run: |
          python - <<'PY_SOURCE'
          import ast,json,os,pathlib
          manifest=json.loads(pathlib.Path(os.environ['PHASE_MANIFEST']).read_text())
          for entry in manifest['files']:
              path=pathlib.Path(entry['path'])
              if path.suffix=='.py':
                  ast.parse(path.read_text(),filename=str(path))
          PY_SOURCE
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5 scipy==1.17.0
      - name: Set the actual result path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-whole-physical-root-piece-first-Airy-sources-output" >> "$GITHUB_OUTPUT"
      - name: Prepare a separate optional prefix directory
        run: mkdir -p "$RUNNER_TEMP/visible-exact-whole-physical-root-piece-first-Airy-sources-prepared"
      - name: Restore the one complete original exterior artifact file above5MB
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-root-subtracted-first-Airy-complete-sources-43665091373-1
          run-id: 43665091373
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-whole-physical-root-piece-first-Airy-sources-prepared/bstar
      - name: Restore an explicitly selected whole physical root-piece source prefix
        if: ${{ inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-whole-physical-root-piece-first-Airy-sources-${{ inputs.resume_run }}-${{ inputs.resume_attempt }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-whole-physical-root-piece-first-Airy-sources-prepared/resume
      - name: Consume the complete physical root piece and reuse all unchanged exterior rows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_whole_physical_root_piece_first_Airy_sources_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-whole-physical-root-piece-first-Airy-sources-science"
          --prepared "$RUNNER_TEMP/visible-exact-whole-physical-root-piece-first-Airy-sources-prepared"
          --out-dir "$RUNNER_TEMP/visible-exact-whole-physical-root-piece-first-Airy-sources-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-whole-physical-root-piece-first-Airy-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 90
          if-no-files-found: error
