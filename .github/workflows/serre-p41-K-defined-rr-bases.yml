name: Serre p41 original K-defined RR bases

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R775-public-K-defined-RR-bases-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R775-original-quotient-RR-bases
  cancel-in-progress: false

jobs:
  original_K_defined_rr_bases:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-K-defined-rr-bases.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R775_original_K_defined_RR_bases.py
            /topics/serre-uniformity/scripts/R771_original_quotient_RR_bases.py
            /topics/serre-uniformity/scripts/R775_public_K_defined_RR_bases.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R775-public-K-defined-RR-bases-request.json
            /topics/serre-uniformity/notes/R775-original-K-defined-RR-bases-method.md
            /topics/serre-uniformity/results/R772-original-RR-descent-and-exact-function-recovery-certificates.md
            /topics/serre-uniformity/computations/R771-p41-original-quotient-RR-bases/43628998192-1/p41-original-quotient-RR-basis-certificate.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact finite-field arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Reuse original Eisenstein rows and certify K-defined bases
        continue-on-error: true
        timeout-minutes: 310
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R775_public_K_defined_RR_bases.py compute
      # Temporary checkpoint transport for the immediately following R777 job.
      # Reproducible arrays/certificates are not committed or put in Releases.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R775-p41-original-K-defined-RR-bases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R775-p41-original-K-defined-RR-bases/output
          retention-days: 1
          if-no-files-found: warn
      - name: Preserve all states and publish small complete or failed receipts
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R775_public_K_defined_RR_bases.py publish
      - name: Require actual 146 694 1514 ranks and nonzero minors
        if: always()
        run: python topics/serre-uniformity/scripts/R775_public_K_defined_RR_bases.py verify
