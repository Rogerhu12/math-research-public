name: Serre p41 original CM target model

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R732-public-p41-original-model-request.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serre-R732-p41-original-CM-model
  cancel-in-progress: false

jobs:
  original_model:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-CM-model.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R732_p41_original_CM_model.py
            /topics/serre-uniformity/scripts/R732_public_original_CM_model.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R732-public-p41-original-model-request.json
            /topics/serre-uniformity/notes/R732-p41-original-CM-model-input-computation.md
            /topics/serre-uniformity/results/R725-original-CM-elliptic-model-and-splitting-field.md
            /topics/serre-uniformity/results/R728-original-Weil-restriction-primitive-projector-and-Neron-lattice.md
            /topics/serre-uniformity/results/R732-original-CM-period-kernel-and-bounded-rational-function-recovery.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact rational arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compute the original degree seven model and its exact embedding
        continue-on-error: true
        timeout-minutes: 85
        run: python topics/serre-uniformity/scripts/R732_public_original_CM_model.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R732-p41-original-CM-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R732-p41-original-CM-model
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve complete or failed exact outputs
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R732_public_original_CM_model.py publish
      - name: Require all exact original-model identities
        if: always()
        run: python topics/serre-uniformity/scripts/R732_public_original_CM_model.py verify
