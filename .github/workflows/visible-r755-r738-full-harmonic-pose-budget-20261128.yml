name: visible-flex original thick metric all-pose harmonic budget
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r755-r738-full-harmonic-pose-budget-20261128.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visible-flex-r755-r738-full-harmonic-pose-budget-20261128
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      R755_REQUEST: topics/visible-flex-new-mechanism/computations/request-r755-r738-full-harmonic-pose-budget-20261128.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r755-r738-full-harmonic-pose-budget-20261128.json
            /topics/visible-flex-new-mechanism/scripts/r755_harmonic_area_bounds.py
            /topics/visible-flex-new-mechanism/scripts/r755_actual_r738_material_pose_20261128.py
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r755-r738-harmonic-area-material-scope.md
            /topics/visible-flex-new-mechanism/scripts/r734_true_dyadic_tail.py
            /topics/visible-flex-new-mechanism/scripts/r726_closed_spinor_fourier.py
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r738_negative_tail_and_macro_source.py
            /topics/visible-flex-new-mechanism/scripts/r738_real_macro_reference.py
            /topics/visible-flex-new-mechanism/results/R755-vector-area-harmonic-energy-and-all-pose-budget.md
            /topics/visible-flex-new-mechanism/results/R738-broad-dyadic-collars-with-thick-macroscopic-phase-geometry.md
            /topics/visible-flex-new-mechanism/computations/r755-r738-harmonic-pose-20261128.json
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r755-first-actual-fixed-material-all-pose-budget.md
            /.github/workflows/visible-r755-r738-full-harmonic-pose-budget-20261128.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull both current rule sources and evaluate the actual whole-material budget
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r755-r738-full-harmonic-pose-budget-20261128.json
          --lane actual-material-budget
      - name: Preserve all new directed material and curvature cells
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-r755-paid-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r755-paid/
          retention-days: 30
          if-no-files-found: error
