name: Rank2 original F complete divisors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rank2-sha-original-low-f-divisors.yml'
      - 'topics/rank2-sha-infinitely-many-p/ci/original-low-f-divisors-request.json'
      - 'topics/rank2-sha-infinitely-many-p/scripts/launch-original-low-f-divisors.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/produce-original-low-f-divisors.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/original_low_f_complete_divisors.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/original_polynomial_row_reduction.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/original_ys_scalar_colon_tools.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/original_ys_integral_image_tools.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rank2-original-low-f-divisors
  cancel-in-progress: false
jobs:
  original-low-f-divisors:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            topics/rank2-sha-infinitely-many-p/scripts
            topics/rank2-sha-infinitely-many-p/ci
          persist-credentials: false
      - name: Pull the pinned Sage 10.6 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull sagemath/sagemath@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb
      - name: Authenticate original full PASS and certify both complete F divisors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          timeout --kill-after=45s 21000s python3 topics/rank2-sha-infinitely-many-p/scripts/launch-original-low-f-divisors.py
