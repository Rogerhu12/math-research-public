name: Serre p41 original normal derivation operators

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R815-public-original-normal-derivation-operators-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R815-original-normal-derivation-operators
  cancel-in-progress: false

jobs:
  original_normal_derivation_operators:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-normal-derivation-operators.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R815_original_normal_derivation_operators.py
            /topics/serre-uniformity/scripts/R815_public_original_normal_derivation_operators.py
            /topics/serre-uniformity/scripts/R811_original_regular_multipliers.py
            /topics/serre-uniformity/notes/R815-public-original-normal-derivation-operators-request.json
            /topics/serre-uniformity/notes/R815-original-normal-derivation-operator-method.md
            /topics/serre-uniformity/results/R813-original-Wronskian-normal-derivation-and-cyclic-certificate.md
            /topics/serre-uniformity/results/R817-original-normal-derivation-without-separate-h-multiplier.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source syntax without executing mathematics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("R815_original_normal_derivation_operators.py", "R815_public_original_normal_derivation_operators.py", "R811_original_regular_multipliers.py"):
              path = Path("topics/serre-uniformity/scripts") / name
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Recover original Mg and Gamma with exact nested commutator certificates
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R815_public_original_normal_derivation_operators.py compute
      - name: Transfer the active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R815-original-normal-derivation-operators-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R815-original-normal-derivation-operators/output
          retention-days: 1
          if-no-files-found: warn
      - name: Require the two original operator certificates and both regular charts
        if: always()
        run: python topics/serre-uniformity/scripts/R815_public_original_normal_derivation_operators.py verify
