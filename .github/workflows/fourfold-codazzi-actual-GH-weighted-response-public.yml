name: Complete radially weighted actual high response

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-actual-GH-weighted-response-public.yml

permissions:
  contents: write

concurrency:
  group: actual-GH-weighted-response-first-v1
  cancel-in-progress: false

jobs:
  complete-weighted-high-response:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_collar_volterra_dual_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-20-actual-GH-weighted-response-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the unchanged directed runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Evaluate complete radial weighted-source functionals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_collar_volterra_dual_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-20-actual-GH-weighted-response-inputs.json --manifest-sha f544cf42442f81c2c2edcd0e4e5f5c5402161d10640c2be43a394ae534b4f0a1
