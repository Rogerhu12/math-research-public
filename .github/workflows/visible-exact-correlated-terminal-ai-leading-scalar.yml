name: visible-exact correlated terminal-Ai leading scalar

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-correlated-terminal-ai-leading-scalar.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-correlated-terminal-ai-leading-scalar
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  KL_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-correlated-terminal-Ai-leading-scalar-CI-inputs.json
  KL_MANIFEST_SHA: 810a13c2e1e0d3fb85f00129ca3e826e00e264d78269e25b78408bc1f67b99c7
  KL_PIPELINE_SHA: 1f9dd122c7de8a990f5c60d0f405b2e3b3e51420b807ded9be58e8715fd480d6
  KL_WORKER_SHA: 548a1226d2f79017a5547308a2456ce386c31293bd7309385ad7ebea92c1e825
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  correlated-terminal-ai-leading-scalar:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_correlated_terminal_Ai_leading_scalar_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-correlated-terminal-Ai-leading-scalar-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_correlated_terminal_Ai_leading_scalar_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['KL_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate only small source proof and provenance texts
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_correlated_terminal_Ai_leading_scalar_public_worker.py --mode hydrate
          --manifest "$KL_MANIFEST" --manifest-sha "$KL_MANIFEST_SHA"
          --pipeline-sha "$KL_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the current-only leading-scalar consumer before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,json,os,pathlib
          manifest=json.loads(pathlib.Path(os.environ['KL_MANIFEST']).read_text())
          for role in ('source',):
              item=next(x for x in manifest['files'] if x['role']==role)
              p=pathlib.Path(item['path'])
              assert len(p.read_bytes())==item['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
              ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the pinned directed arithmetic runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Read four completed scientific records and evaluate only the new correlated scalar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_correlated_terminal_Ai_leading_scalar_public_worker.py --mode run
          --manifest "$KL_MANIFEST" --manifest-sha "$KL_MANIFEST_SHA"
          --pipeline-sha "$KL_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-correlated-terminal-ai-leading-scalar-science"
          --out-dir "$RUNNER_TEMP/visible-exact-correlated-terminal-ai-leading-scalar-output"
      # Root rule15: all fourteen inputs are current small text; zero old binaries or artifacts are restored.
      # No upload-artifact, Release upload, native or per-row numerical-data commit.
      # Complete science is atomically saved and printed before publication-size guards.
      # The actual topic capacity must retain120000 bytes before any new arithmetic.
