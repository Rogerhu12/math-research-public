name: visible-exact third actual regular-transport failure log

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-regular-transport-log-diagnostic.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-regular-transport-log-diagnostic
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  RECEIPT_SOURCE: topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_transport_log_diagnostic_public_worker.py
  RECEIPT_SOURCE_SHA: 4097d328a2b5f3f91a42cc4a0e48b6718fd127a4a55d61344b815a2f04b77ec2
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-reviewed-public-CI-rules-reproducible-data.json
  REVIEWED_RULES_SHA: f2661bd5cf5cb006c1f78c64126b3ac065e6bc26a50790545ac443efb5e372bd

jobs:
  third-failure-log-diagnostics:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 20
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only receipt source and reviewed text
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_transport_log_diagnostic_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-reviewed-public-CI-rules-reproducible-data.json
            /topics/visible-flex-exact-nearby/notes/regular_transport_log_diagnostic_ci/
      - name: Verify and parse the separately pinned stdlib-only receipt
        run: |
          python - <<'PY_RECEIPT'
          import ast,hashlib,os,pathlib
          p=pathlib.Path(os.environ['RECEIPT_SOURCE'])
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['RECEIPT_SOURCE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          r=pathlib.Path(os.environ['REVIEWED_RULES'])
          assert hashlib.sha256(r.read_bytes()).hexdigest()==os.environ['REVIEWED_RULES_SHA']
          PY_RECEIPT
      - name: Read the exact third failed log and its bounded recoverable result marker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u "$RECEIPT_SOURCE" --source-sha "$RECEIPT_SOURCE_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      # No scientific import, numerical reevaluation, artifact or Release upload.
