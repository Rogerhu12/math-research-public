name: Serre original p47 all cuspidal disks

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/original-p47-cuspidal-disks-request.json

permissions:
  contents: read

concurrency:
  group: serre-original-p47-cuspidal-disks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_disks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/original_p47_cuspidal_disks.py
            /topics/serre-uniformity/notes/2026-11-27-original-p47-cuspidal-disks-method.md
            /topics/serre-uniformity/results/R1062-original-full-nonsplit-cuspidal-kummer-descent.md
            /topics/serre-uniformity/results/R1069-all-prime-good-cuspidal-characters-and-unique-global-labels.md
            /topics/serre-uniformity/results/R1070-original-cuspidal-labels-by-division-polynomial-values.md
            /topics/serre-uniformity/results/R1071-original-p-local-cuspidal-label-polynomials.md
            /topics/serre-uniformity/notes/original-p47-cuspidal-disks-request.json
      - name: Install the exact arithmetic dependency
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Compute all original p47 cuspidal disk labels
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          SERRE_EXPECTED_REQUEST_SHA256: '6aca75b3cd8229709db915fabf426194a6faa181aa3c7416883c39a70840745b'
        run: python topics/serre-uniformity/scripts/original_p47_cuspidal_disks.py
