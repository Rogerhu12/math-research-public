name: ISP R150 remaining197 original third directions with complete local jets

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: isp-r150-197-third-lift-789f
  cancel-in-progress: false

jobs:
  third-197:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            topics/invariant-subspace-problem
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze all197 real directions, both rules and every source hash
        run: python3 topics/invariant-subspace-problem/notes/2026-11-14-r150-197-third-actions-prepare-789f.py --mode source
      - name: Restore the completed t96 artifact without rerunning its mathematics
        uses: actions/download-artifact@v4
        with:
          name: isp-r150-t96-graph-recovery-43597823809-1
          run-id: 43597823809
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/isp-r150-197-third-t96-download
      - name: Restore the original200 complete kernel artifact without rerunning its mathematics
        uses: actions/download-artifact@v4
        with:
          name: isp-r150-high-kernel-bockstein-recovery-43605503242-1
          run-id: 43605503242
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/isp-r150-197-third-old200-download
      - name: Restore the completed all198 artifact without rerunning its mathematics
        uses: actions/download-artifact@v4
        with:
          name: isp-r150-all198-second-bockstein-recovery-43619888599-1
          run-id: 43619888599
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/isp-r150-197-third-all198-download
      - name: Restore the completed seven artifact without rerunning its mathematics
        uses: actions/download-artifact@v4
        with:
          name: isp-r150-seven-saturation-recovery-43630666145-1
          run-id: 43630666145
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/isp-r150-197-third-seven-download
      - name: Restore the completed current artifact without rerunning its mathematics
        uses: actions/download-artifact@v4
        with:
          name: isp-r150-augmented-seven-second-recovery-43634830833-1
          run-id: 43634830833
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/isp-r150-197-third-current-download
      - name: Restore the completed ninth artifact without rerunning its mathematics
        uses: actions/download-artifact@v4
        with:
          name: isp-r150-ninth-first-recovery-43638830039-1
          run-id: 43638830039
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/isp-r150-197-third-ninth-download
      - name: Restore the completed five artifact without rerunning its mathematics
        uses: actions/download-artifact@v4
        with:
          name: isp-r150-five-third-recovery-43646683083-1
          run-id: 43646683083
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/isp-r150-197-third-five-download
      - name: Require every exact original input and retain only the frozen selected files
        run: python3 topics/invariant-subspace-problem/notes/2026-11-14-r150-197-third-actions-prepare-789f.py --mode restore
      - name: Install the exact finite-field dependency and record the compiler
        run: |
          python3 -m pip install python-flint==0.9.0 numpy==2.2.6
          python3 -m pip show python-flint numpy > "$ISP_197_THIRD_OUT/results/python-runtime-versions.txt"
          g++ --version > "$ISP_197_THIRD_OUT/results/compiler-version.txt"
      - name: Execute the197 new local directions with one shared300-second mathematical clock
        id: exact
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          python3 topics/invariant-subspace-problem/notes/2026-11-14-r150-197-third-local-jet-runner-789f.py \
            --notes-root topics/invariant-subspace-problem/notes \
            --t96-recovery "$ISP_197_THIRD_T96" \
            --old200-recovery "$ISP_197_THIRD_OLD200" \
            --all198-recovery "$ISP_197_THIRD_ALL198" \
            --seven-recovery "$ISP_197_THIRD_SEVEN" \
            --current-recovery "$ISP_197_THIRD_CURRENT" \
            --ninth-recovery "$ISP_197_THIRD_NINTH" \
            --five-recovery "$ISP_197_THIRD_FIVE" \
            --out "$ISP_197_THIRD_OUT" \
            --math-seconds 300 --memory-mib 512 --compile-seconds 30 \
            2>&1 | tee "$ISP_197_THIRD_OUT/results/actions-console.log"
      - name: Record the complete related197 image and every positive original identity
        if: always() && env.ISP_197_THIRD_OUT != ''
        env:
          ISP_EXACT_OUTCOME: ${{ steps.exact.outcome }}
        run: python3 topics/invariant-subspace-problem/notes/2026-11-14-r150-197-third-actions-prepare-789f.py --mode outcome
      - uses: actions/upload-artifact@v4
        if: always() && env.ISP_197_THIRD_OUT != ''
        with:
          name: isp-r150-197-third-results-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ env.ISP_197_THIRD_OUT }}/results
      - uses: actions/upload-artifact@v4
        if: always() && env.ISP_197_THIRD_OUT != ''
        with:
          name: isp-r150-197-third-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          compression-level: 1
          if-no-files-found: warn
          path: ${{ env.ISP_197_THIRD_OUT }}/recovery
      - name: Publish this actual result directory with real pull and immediate rebase retries
        id: publication
        if: always() && env.ISP_197_THIRD_OUT != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 topics/invariant-subspace-problem/notes/2026-11-14-r150-197-third-actions-publish-789f.py \
            --checkout "$GITHUB_WORKSPACE" \
            --results "$ISP_197_THIRD_OUT/results" \
            --recovery "$ISP_197_THIRD_OUT/recovery" \
            --work "$RUNNER_TEMP/isp-r150-197-third-publication"
      - uses: actions/upload-artifact@v4
        if: always() && env.ISP_197_THIRD_OUT != ''
        with:
          name: isp-r150-197-third-publication-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ env.ISP_197_THIRD_OUT }}/results/publication
      - name: Require complete related197 image and every compatible target multiplied back
        if: always() && env.ISP_197_THIRD_OUT != ''
        run: |
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          p=Path(os.environ['ISP_197_THIRD_OUT'])/'results/actions-outcome.json'
          r=json.loads(p.read_text()) if p.exists() else {}
          if r.get('complete') is not True:
              raise SystemExit('Original197 continuation incomplete; all actual outputs and checkpoints retained')
          pp=Path(os.environ['ISP_197_THIRD_OUT'])/'results/publication/publication-receipt.json'
          publication=json.loads(pp.read_text()) if pp.exists() else {}
          print(json.dumps(publication),flush=True)
          if publication.get('status')!='pushed':
              raise SystemExit('Actual mathematical outputs retained; real Git publication requires continuation')
          PYCODE
