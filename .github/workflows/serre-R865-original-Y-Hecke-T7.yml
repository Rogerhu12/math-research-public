name: Serre R865 original Y Hecke T7

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R865-original-Y-Hecke-T7-public-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R865-original-Y-Hecke-T7
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/notes/R865-original-Y-Hecke-T7-public-request.json
      - name: Pull main and compare both rule files with the read commit
        env:
          REQUEST_SOURCE: ${{ github.sha }}
          RECEIPT_PATH: ${{ runner.temp }}/R865-original-Y-Hecke-T7-rules-pull.json
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, subprocess
          from pathlib import Path
          path='topics/serre-uniformity/notes/R865-original-Y-Hecke-T7-public-request.json'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',os.environ['REQUEST_SOURCE']],check=True)
          request=json.loads(subprocess.check_output(['git','show',os.environ['REQUEST_SOURCE']+':'+path]))
          subprocess.run(['git','checkout','-B','r865-original-Y-Hecke-T7-rules-main'],check=True)
          subprocess.run(['git','pull','--rebase','origin','main'],check=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          old=request['rules_last_read_commit']
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',old],check=True)
          actual={key:hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  for key,name in [('root','README.md'),('topic','topics/serre-uniformity/README.md')]}
          changed=actual!=request['readme_sha256']
          receipt={'actual_git_pull_rebase_completed':True,'actual_head':head,'previous_read_commit':old,
                   'actual_UTC':dt.datetime.now(dt.timezone.utc).isoformat(),'readme_sha256':actual,
                   'expected_readme_sha256':request['readme_sha256'],'rules_changed':changed}
          Path(os.environ['RECEIPT_PATH']).write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('R865_RULES_PULL='+json.dumps(receipt,sort_keys=True))
          if changed:
              subprocess.run(['git','diff',old,head,'--','README.md','topics/serre-uniformity/README.md'],check=True)
              raise SystemExit('Both README changes must be read before the new mathematics.')
          PY
      - name: Preserve the actual pull receipt for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-R865-original-Y-Hecke-T7-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R865-original-Y-Hecke-T7-rules-pull.json
          retention-days: 1
          if-no-files-found: warn

  compute:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R865_original_Y_Hecke_T7.py
            /topics/serre-uniformity/scripts/R865_public_original_Y_Hecke_T7.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/results/R865-original-Hecke-T7-from-certified-level82-Fourier-rows.md
            /topics/serre-uniformity/notes/R865-original-Y-Hecke-T7-consumer-method.md
            /topics/serre-uniformity/notes/R866-original-holomorphic-semilinear-action-and-Q-fixed-basis.md
            /topics/serre-uniformity/notes/R864-original-holomorphic-differentials-from-cusp-evaluation.md
            /topics/serre-uniformity/results/R778-original-cusp-orbit-and-short-exact-recovery.md
            /topics/serre-uniformity/results/R802-original-semilinear-parity-and-degree-seven-relations.md
            /topics/serre-uniformity/notes/R865-original-Y-Hecke-T7-public-request.json
            /.github/workflows/serre-R865-original-Y-Hecke-T7.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned exact rational matrix library
        run: |
          python -m pip install --only-binary=:all: python-flint==0.9.0
      - name: Parse sources without importing mathematical code
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          base=Path('topics/serre-uniformity/scripts')
          for name in ('R865_original_Y_Hecke_T7.py',
                       'R865_public_original_Y_Hecke_T7.py',
                       'R824_public_original_global_polar_generators.py'):
              path=base/name
              ast.parse(path.read_text(),filename=str(path))
              print('AST_OK',name)
          PY
      - name: Compute the original T7 and exact single-operator spectrum
        run: |
          python topics/serre-uniformity/scripts/R865_public_original_Y_Hecke_T7.py compute \
            --request topics/serre-uniformity/notes/R865-original-Y-Hecke-T7-public-request.json \
            --output "$RUNNER_TEMP/R865-original-Y-Hecke-T7/output"
      - name: Preserve original sources and completed new stages for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-R865-original-Y-Hecke-T7-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R865-original-Y-Hecke-T7/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
      - name: Read complete source and certificate interfaces
        if: always()
        run: |
          python topics/serre-uniformity/scripts/R865_public_original_Y_Hecke_T7.py verify \
            --request topics/serre-uniformity/notes/R865-original-Y-Hecke-T7-public-request.json \
            --output "$RUNNER_TEMP/R865-original-Y-Hecke-T7/output"
