name: Serre exact original CM norm at p137147

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R717-public-original-CM-norm-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R717-original-CM-norm-p137147
  cancel-in-progress: false

jobs:
  bins:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-certified-original-CM-norm.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/*.py
            /topics/serre-uniformity/notes/R717-public-original-CM-norm-request.json
            /topics/serre-uniformity/computations/R717-original-CM-norm-p137147*/**
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned certified ball arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Restore only explicitly pinned old row checkpoints
        id: restore
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python topics/serre-uniformity/scripts/R717_restore_public_CM_artifacts.py
          --phase bins --shard-index ${{ matrix.shard }}
      - name: Complete this disjoint lattice-row shard
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 305
        run: >-
          python topics/serre-uniformity/scripts/R717_public_original_cm_norm.py
          compute --phase bins --shard-index ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-cartier-R717-original-CM-norm-p137147-bins-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-cartier/R717-original-CM-norm-p137147-bins-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded outputs and hashes, including failures
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R717_public_original_cm_norm.py publish
      - name: Require the exact complete row shard
        if: always()
        run: python topics/serre-uniformity/scripts/R717_public_original_cm_norm.py verify

  recover:
    needs: bins
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-certified-original-CM-norm.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/*.py
            /topics/serre-uniformity/notes/R717-public-original-CM-norm-request.json
            /topics/serre-uniformity/computations/R717-original-CM-norm-p137147*/**
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned certified ball arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Download all four complete original bin artifacts
        id: restore
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python topics/serre-uniformity/scripts/R717_restore_public_CM_artifacts.py
          --phase recover
      - name: Certify all traces and evaluate the exact original norm
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 305
        run: >-
          python topics/serre-uniformity/scripts/R717_public_original_cm_norm.py
          compute --phase recover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-cartier-R717-original-CM-norm-p137147-recover-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-cartier/R717-original-CM-norm-p137147-recover
          retention-days: 30
          if-no-files-found: warn
      - name: Publish the certificate manifest and bounded exact outputs
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R717_public_original_cm_norm.py publish
      - name: Require complete original-norm reconstruction
        if: always()
        run: python topics/serre-uniformity/scripts/R717_public_original_cm_norm.py verify
