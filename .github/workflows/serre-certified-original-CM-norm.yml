name: Serre certified original CM norm

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R717-public-original-CM-norm-request.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serre-R717-original-CM-norm-p41
  cancel-in-progress: false

jobs:
  calibrate_original_cm_norm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-certified-original-CM-norm.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/*.py
            /topics/serre-uniformity/notes/R717-public-original-CM-norm-request.json
            /topics/serre-uniformity/computations/R717-original-CM-norm-p41/**
            /topics/serre-uniformity/computations/R717-original-CM-norm-p41-bins-*/**
            /topics/serre-uniformity/computations/R717-original-CM-norm-p41-recover/**
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned certified ball arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Calibrate the new complete original norm algorithm
        continue-on-error: true
        timeout-minutes: 22
        run: python topics/serre-uniformity/scripts/R717_public_original_cm_norm.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-cartier-R717-original-CM-norm-p41-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-cartier/R717-original-CM-norm-p41
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve complete or failed certified outputs
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R717_public_original_cm_norm.py publish
      - name: Require exact traces and the historical original norm
        if: always()
        run: python topics/serre-uniformity/scripts/R717_public_original_cm_norm.py verify
