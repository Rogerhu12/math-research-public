name: Rank2 short global graph and multichain software
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rank2-sha-original-short-global-graph-software.yml'
      - 'topics/rank2-sha-infinitely-many-p/ci/original-short-global-graph-software-request.json'
      - 'topics/rank2-sha-infinitely-many-p/scripts/launch-original-short-global-graph-software.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/original_short_graph_field.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/original_short_graph_popov.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/original_short_graph_multichain.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/original_short_graph_outer.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/original_short_graph_kernel.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/original_short_graph_global.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/check-original-short-graph-multichain.py'
      - 'topics/rank2-sha-infinitely-many-p/scripts/check-original-short-global-graph.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rank2-original-short-global-graph-software
  cancel-in-progress: false
jobs:
  two-small-checkers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            topics/rank2-sha-infinitely-many-p/scripts
            topics/rank2-sha-infinitely-many-p/ci
          persist-credentials: false
      - name: Pull the pinned Sage 10.6 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull sagemath/sagemath@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb
      - name: Verify both original software checks in the same isolated container
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          topic=topics/rank2-sha-infinitely-many-p
          launcher="$topic/scripts/launch-original-short-global-graph-software.py"
          workflow=.github/workflows/rank2-sha-original-short-global-graph-software.yml
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD -- README.md "$topic/README.md" "$topic/scripts" "$topic/ci" "$workflow"
          RANK2_ROOT_README_SHA=$(git rev-parse HEAD:README.md)
          RANK2_TOPIC_README_SHA=$(git rev-parse "HEAD:$topic/README.md")
          test "$(git hash-object README.md)" = "$RANK2_ROOT_README_SHA"
          test "$(git hash-object "$topic/README.md")" = "$RANK2_TOPIC_README_SHA"
          export RANK2_ROOT_README_SHA RANK2_TOPIC_README_SHA
          export RANK2_SOURCE_SHA="$GITHUB_SHA" RANK2_RUN_ID="$GITHUB_RUN_ID" RANK2_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
          export RANK2_IMAGE=sagemath/sagemath@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb
          RANK2_DOCKER_ID=$(docker create --init --network none --cpus=4 --memory=16g --memory-swap=16g \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e RANK2_SOURCE_SHA -e RANK2_RUN_ID -e RANK2_RUN_ATTEMPT \
            -e RANK2_ROOT_README_SHA -e RANK2_TOPIC_README_SHA -e RANK2_IMAGE \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONUNBUFFERED=1 -e OMP_NUM_THREADS=4 -e OPENBLAS_NUM_THREADS=4 -e MKL_NUM_THREADS=4 \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work --entrypoint /usr/bin/sage \
            "$RANK2_IMAGE" -python "$launcher" --execute)
          export RANK2_DOCKER_ID
          trap 'docker rm -f "$RANK2_DOCKER_ID" >/dev/null 2>&1 || true' EXIT
          docker inspect "$RANK2_DOCKER_ID" | python3 "$launcher" --host-contract
          timeout --kill-after=15s 420s docker start --attach "$RANK2_DOCKER_ID" 2>&1 | python3 "$launcher" --host-after
