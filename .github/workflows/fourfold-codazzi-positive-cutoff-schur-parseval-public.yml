name: visible-exact positive Schur-Parseval and exact coefficient split

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fourfold-codazzi-positive-cutoff-schur-parseval-public.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-positive-schur-parseval-coefficient-split
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  WSP_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-16-R133-positive-cutoff-Schur-Parseval-CI-inputs.json
  WSP_MANIFEST_SHA: 11690e1bc7d1770f7c773569fc023efbffa595684db2a5684bd88e7b094cb081
  WSP_PIPELINE_SHA: 8c7ab51d386c1551738d56e19ab61d8626171fe8f841f05d0ed93b0a52c3cbe1
  WSP_WORKER_SHA: bd13fdc97df7ed79348df3a85fa569b04571debf00dbb711819f635c191672d6
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  positive-schur-parseval-coefficient-split:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_positive_cutoff_Schur_Parseval_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-16-R133-positive-cutoff-Schur-Parseval-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_positive_cutoff_Schur_Parseval_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['WSP_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate only small source proof and provenance texts
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_positive_cutoff_Schur_Parseval_public_worker.py --mode hydrate
          --manifest "$WSP_MANIFEST" --manifest-sha "$WSP_MANIFEST_SHA"
          --pipeline-sha "$WSP_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the entire frozen Python closure before any new arithmetic
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,json,os,pathlib
          manifest=json.loads(pathlib.Path(os.environ['WSP_MANIFEST']).read_text())
          sources=[x for x in manifest['files'] if x['path'].endswith('.py')]
          assert len(sources)==manifest['expected_immutable_AST_files']
          for item in sources:
              p=pathlib.Path(item['path'])
              assert len(p.read_bytes())==item['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
              ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the pinned directed arithmetic runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Read the complete frozen prior and evaluate only the new four graphs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_positive_cutoff_Schur_Parseval_public_worker.py --mode run
          --manifest "$WSP_MANIFEST" --manifest-sha "$WSP_MANIFEST_SHA"
          --pipeline-sha "$WSP_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-positive-schur-parseval-coefficient-split-science"
          --out-dir "$RUNNER_TEMP/visible-exact-positive-schur-parseval-coefficient-split-output"
      # Root rule15: eight current text inputs, two AST files, zero historical restores.
      # The complete prior and its five inherited successes remain read only; no old scientific graph is recomputed.
      # No upload-artifact, Release upload, native or per-row numerical-data commit.
      # Complete science is atomically saved and printed before publication-size guards.
      # The actual topic capacity must retain150000 bytes before any new arithmetic.
