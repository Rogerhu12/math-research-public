name: visible-exact regular-transport first-local-vector reduction

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-regular-transport-first-local-vector.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-regular-transport-first-local-vector
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-regular-transport-first-local-vector-CI-inputs.json
  PHASE_MANIFEST_SHA: 8113b0d7e73c220a766947c198c09b6e66bd3a83210539fed6b4d6d5285e8e3f
  PHASE_PIPELINE_SHA: c479aaec9438a80340e425223b2eac0ed9b5707583c6a8125553e59ccd189048
  PHASE_WORKER_SHA: 580a0aed23253f564a6f14504234acd1a32b9a1514ec29ad41ae41081140a526
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-reviewed-public-CI-rules-reproducible-data.json
  REVIEWED_RULES_SHA: f2661bd5cf5cb006c1f78c64126b3ac065e6bc26a50790545ac443efb5e372bd

jobs:
  regular-transport-first-local-vector:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_transport_first_local_vector_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-regular-transport-first-local-vector-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-reviewed-public-CI-rules-reproducible-data.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_transport_first_local_vector_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_transport_first_local_vector_public_worker.py --mode hydrate
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new source before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_transport_first_local_vector.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the identical completed scientific runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5 scipy==1.17.0
      - name: Check the full immutable AST closure and evaluate only new the complete regular-transport local-vector bound
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_transport_first_local_vector_public_worker.py --mode run
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-regular-transport-first-local-vector-science"
          --out-dir "$RUNNER_TEMP/visible-exact-regular-transport-first-local-vector-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
