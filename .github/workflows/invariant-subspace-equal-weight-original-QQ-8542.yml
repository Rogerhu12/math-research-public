name: ISP original equal weights three parameter QQ identity
on:
  push:
    branches: [main]
    paths:
      - 'topics/invariant-subspace-problem/notes/2026-11-27-unit211-equal-weight-original-three-parameter-QQ-8542.py'
      - '.github/workflows/invariant-subspace-equal-weight-original-QQ-8542.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isp-equal-weight-original-QQ-8542
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ISP_PIN: ${{ github.sha }}
      ISP_FILE: 2026-11-27-unit211-equal-weight-original-three-parameter-QQ-8542.py
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FLINT_NUM_THREADS: '1'
    steps:
      - name: Prepare exact runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install Singular
        shell: bash
        run: |
          timeout 180s sudo apt-get update -qq
          timeout 300s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends singular
      - name: New pinned original input and QQ transformation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-equal-original"
          cd "$RUNNER_TEMP/isp-equal-original"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          timeout 120s git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          ISP_SOURCE_PATH="topics/invariant-subspace-problem/notes/$ISP_FILE"
          ISP_BLOB="$(git rev-parse "$ISP_PIN:$ISP_SOURCE_PATH")"
          git show "$ISP_PIN:$ISP_SOURCE_PATH" > "$RUNNER_TEMP/isp-equal-original-source.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-27-focused-exact-actions-driver-8542.py" > "$RUNNER_TEMP/isp-equal-original-driver.py"
          python -u "$RUNNER_TEMP/isp-equal-original-driver.py" --checkout "$PWD" --source "$RUNNER_TEMP/isp-equal-original-source.py" --expected-blob "$ISP_BLOB" --seconds 780
