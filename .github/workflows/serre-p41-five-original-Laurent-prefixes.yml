name: Serre p41 five original Laurent prefixes

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R797-public-five-original-Laurent-prefixes-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R797-five-original-Laurent-prefixes
  cancel-in-progress: false

jobs:
  five_original_Laurent_prefixes:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-five-original-Laurent-prefixes.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R797_five_original_Laurent_prefixes.py
            /topics/serre-uniformity/scripts/R797_public_five_original_Laurent_prefixes.py
            /topics/serre-uniformity/scripts/R781_original_Laurent_prefix.py
            /topics/serre-uniformity/scripts/R786_public_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R797-public-five-original-Laurent-prefixes-request.json
            /topics/serre-uniformity/notes/R797-five-selected-original-Laurent-prefixes-method.md
            /topics/serre-uniformity/results/R793-original-RR-pole-divisors-and-CM-local-algebra.md
            /topics/serre-uniformity/results/R781-original-tangent-descent-and-inverse-free-Laurent-relations.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Generate the five selected original required Laurent prefixes
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R797_public_five_original_Laurent_prefixes.py compute
      - name: Transfer the active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R797-five-original-low-degree-Laurent-prefixes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R797-five-original-low-degree-Laurent-prefixes/output
          retention-days: 1
          if-no-files-found: warn
      - name: Publish only script parameters run and output hashes
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R797_public_five_original_Laurent_prefixes.py publish
      - name: Require the five actual complete original prefixes
        if: always()
        run: python topics/serre-uniformity/scripts/R797_public_five_original_Laurent_prefixes.py verify
