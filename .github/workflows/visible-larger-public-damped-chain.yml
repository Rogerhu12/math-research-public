name: visible-larger complete native damped square-root direction

on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-native-damped-chain-request.json

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

jobs:
  dampedchain:
    name: Complete damped chain and original ten nonlinear trials
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: visible-larger-public-dampedchain
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43598917532-1-coupling112trust/full-DN112/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43602823170-1-coldtailprobe/cold-tail-residual/summary.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43603818345-1-zerorkprobe/same-RK-candidate-native-probe/summary.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43604874829-1-zerorkprobev2/same-RK-candidate-native-probe-v2/summary.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43604874829-1-zerorkprobev2/same-RK-candidate-native-probe-v2/initializer-v2-construction-045-000.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/summary.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/candidate-checkpoint.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/candidate-initializer-identity.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/candidate-factory-identity.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/original-live-identity.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/probe-spec.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/verified-launch-intent.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/instrumentation.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/candidate-states-000.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/original-graphs-gains-000.json.gz
      - name: Bound maintenance and establish independent complete direction output
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          mkdir -p "$RUNNER_TEMP/visible-native-damped-chain/dampedchain"
          echo "VISIBLE_OUT=$RUNNER_TEMP/visible-native-damped-chain/dampedchain" >> "$GITHUB_ENV"
          echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
          echo "VISIBLE_TOPIC=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude" >> "$GITHUB_ENV"
          echo "VISIBLE_CAPTURE28=$RUNNER_TEMP/damped57-original28-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "VISIBLE_CAPTURE41=$RUNNER_TEMP/damped57-original41-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "VISIBLE_CAPTURE54=$RUNNER_TEMP/damped57-completed54-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install the unchanged native-reader Python dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Bind the single complete damped-chain lane and all requested source bytes
        run: |
          python - <<'PYPINS'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          comp = Path(os.environ['VISIBLE_COMPUTATIONS'])
          request_path = comp/'public-native-damped-chain-request.json'
          request_raw = request_path.read_bytes()
          request = json.loads(request_raw)
          if request.get('repository') != 'Rogerhu12/math-research-public' or request.get('lanes') != ['dampedchain']:
              raise ValueError('Use exactly the dampedchain request for this public repository')
          required = {
              'geometry_20261114_native_rawcell0_direct_ld_capture.py',
              'geometry_20261114_native_rawcell0_direct_ld_capture_hook.mjs',
              'geometry_20261114_native_rawcell0_direct_ld_window.mjs',
              'geometry_20261114_rawcell0_direct_ld_worker.py',
              'geometry_20261114_saved_stage_rk_covariance.py',
              'exact_20261114_rawcell0_direct_ld_system.py',
              'exact_20261114_rawcell0_direct_ld_equilibrated_correction.py',
              'exact_20261114_native_damped_chain_qr.py',
              'geometry_20261114_native_damped_chain_trial_replay.py',
              'geometry_20261114_native_damped_chain_trial_replay_hook.mjs',
              'exact_20261114_fetch_pinned_public_artifact.py',
              'exact_20261114_fetch_pinned_rawcell0_steps.py',
              'root_20261114_fetch_pinned_direct_ld54.py',
              'exact_20261114_public_resume.py',
              'exact_20261114_rawcell0_step_system.py',
              'geometry_20261114_native_equilibrated_band_correction.py',
              'exact_20261114_native_allrows_dyadic_residual.py',
              'root_20261114_publish_actions.py',
          }
          pins = request.get('source_sha256')
          if not isinstance(pins, dict) or not required.issubset(pins):
              raise ValueError('Pin every new map, complete-system consumer, original trial adapter, frozen arithmetic and both fixed fetchers')
          verified = []
          for name, expected in pins.items():
              if Path(name).name != name or not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise ValueError('Use each source basename and its full SHA256')
              raw = (comp/name).read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected:
                  raise ValueError('Requested source bytes changed: '+name)
              verified.append(dict(file=name, bytes=len(raw), sha256=actual))
          source_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if source_commit != os.environ['GITHUB_SHA']:
              raise ValueError('The checkout must be the triggering source commit')
          readmes = {}
          for name in ('README.md', 'topics/visible-flex-larger-amplitude/README.md'):
              readmes[name] = subprocess.check_output(['git', 'rev-parse', 'HEAD:'+name], text=True).strip()
          intent = dict(repository='Rogerhu12/math-research-public', lane='dampedchain',
              source_commit=source_commit, current_run=os.environ['GITHUB_RUN_ID'],
              request_sha256=hashlib.sha256(request_raw).hexdigest(), request=request,
              verified_sources=verified, initial_readme_git_blobs=readmes,
              scientific_execution_claimed=False, native_acceptance_claimed=False,
              original_artifact_inputs_outside_output_tree=True)
          (Path(os.environ['VISIBLE_OUT'])/'direct-ld-request-identity.json').write_text(
              json.dumps(intent, indent=2)+'\n')
          PYPINS
      - name: Check syntax of the complete damped solver, original trial adapter and provenance sources
        run: |
          python -m py_compile \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_native_rawcell0_direct_ld_capture.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_rawcell0_direct_ld_worker.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_saved_stage_rk_covariance.py" \
            "$VISIBLE_COMPUTATIONS/exact_20261114_rawcell0_direct_ld_system.py" \
            "$VISIBLE_COMPUTATIONS/exact_20261114_rawcell0_direct_ld_equilibrated_correction.py" \
            "$VISIBLE_COMPUTATIONS/exact_20261114_native_damped_chain_qr.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_native_damped_chain_trial_replay.py" \
            "$VISIBLE_COMPUTATIONS/exact_20261114_fetch_pinned_public_artifact.py" \
            "$VISIBLE_COMPUTATIONS/exact_20261114_fetch_pinned_rawcell0_steps.py" \
            "$VISIBLE_COMPUTATIONS/root_20261114_fetch_pinned_direct_ld54.py" \
            "$VISIBLE_COMPUTATIONS/exact_20261114_public_resume.py" \
            "$VISIBLE_COMPUTATIONS/exact_20261114_rawcell0_step_system.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_native_equilibrated_band_correction.py" \
            "$VISIBLE_COMPUTATIONS/exact_20261114_native_allrows_dyadic_residual.py" \
            "$VISIBLE_COMPUTATIONS/root_20261114_publish_actions.py"
          node --check "$VISIBLE_COMPUTATIONS/geometry_20261114_native_rawcell0_direct_ld_capture_hook.mjs"
          node --check "$VISIBLE_COMPUTATIONS/geometry_20261114_native_rawcell0_direct_ld_window.mjs"
          node --check "$VISIBLE_COMPUTATIONS/geometry_20261114_native_damped_chain_trial_replay_hook.mjs"
          node --version
          python --version
      - name: Fetch the unchanged actual28 complete original capture
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_fetch_pinned_public_artifact.py" \
            --run-id 43611175099 --artifact-id 14120548264 \
            --artifact-name visible-mainline-nativecorrection-43611175099-1 \
            --expected-size 235561097 \
            --expected-sha256 0ff8e6f597af60f19243b5457c28e8638096c775551b6f3d044dc2d2f1fabeee \
            --out "$VISIBLE_CAPTURE28" \
            2>&1 | tee "$VISIBLE_OUT/actual28-fetch.log"
          cp "$VISIBLE_CAPTURE28/_pinned_public_artifact_receipt.json" "$VISIBLE_OUT/actual28-artifact-fetch-receipt.json"
      - name: Fetch the unchanged actual41 complete original-step capture
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_fetch_pinned_rawcell0_steps.py" \
            --run-id 43622149326 --artifact-id 14124209116 \
            --artifact-name visible-mainline-rawcell0steps-43622149326-1 \
            --expected-size 349636774 \
            --expected-sha256 356d9d81959739a22e9347d7ceba6fd4880ad61db70dca73096a4c5b71dc73a8 \
            --out "$VISIBLE_CAPTURE41" \
            2>&1 | tee "$VISIBLE_OUT/actual41-fetch.log"
          cp "$VISIBLE_CAPTURE41/_pinned_public_artifact_receipt.json" "$VISIBLE_OUT/actual41-artifact-fetch-receipt.json"
      - name: Fetch the completed actual54 full maps with their complete original artifact
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -u "$VISIBLE_COMPUTATIONS/root_20261114_fetch_pinned_direct_ld54.py" \
            --run-id 43634889730 --artifact-id 14129522378 \
            --artifact-name visible-mainline-directld-43634889730-1 \
            --expected-size 457357361 \
            --expected-sha256 df3a54716ecbed8645783373657f7e40b08429173ca976efc73ecc7e8ce5f819 \
            --out "$VISIBLE_CAPTURE54" \
            2>&1 | tee "$VISIBLE_OUT/actual54-fetch.log"
          cp "$VISIBLE_CAPTURE54/_pinned_public_artifact_receipt.json" "$VISIBLE_OUT/actual54-artifact-fetch-receipt.json"
      - name: Bind the completed actual54 map target without a new linear acceptance gate
        run: |
          python - <<'PYRESULTS'
          import hashlib, json, os
          from pathlib import Path
          base = Path(os.environ['VISIBLE_CAPTURE54'])
          expected = {
              'native-rawcell0-direct-ld/result.json': 'e60da64312819a87388cfa96c209fc9188dca02c0ab055cbcc934f3507888ac6',
          }
          verified = []
          for name, digest in expected.items():
              raw = (base/name).read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              if actual != digest:
                  raise ValueError('The saved actual54 result bytes differ: '+name)
              verified.append(dict(file=name, bytes=len(raw), sha256=actual))
          value = dict(actual_run=43634889730,
              source_commit='7eb383af1ca2bb04c7eaef9c65578dbc124269d8',
              verified_saved_results=verified, saved_map_target_recomputed=False,
              prior_undamped_direction_not_used_for_trials=True,
              exact_linear_residual_is_diagnostic_not_new_native_trial_threshold=True)
          (Path(os.environ['VISIBLE_OUT'])/'actual54-saved-map-identity.json').write_text(
              json.dumps(value, indent=2)+'\n')
          PYRESULTS
      - name: Restore all78 original source files only from the public repository
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYSOURCE' 2>&1 | tee "$VISIBLE_OUT/public-source-restore.log"
          import os
          from pathlib import Path
          from exact_20261114_public_resume import prepare_public_source
          source = prepare_public_source(
              Path.cwd(), Path(os.environ['RUNNER_TEMP'])/'damped57-public-original-source',
              Path(os.environ['VISIBLE_OUT']))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
          PYSOURCE
      - name: Form one complete R273 square-root direction with explicit eta1
        id: damped_direction
        timeout-minutes: 60
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_native_damped_chain_qr.py" \
            --capture-directory "$VISIBLE_CAPTURE28/native-correction-capture" \
            --step-directory "$VISIBLE_CAPTURE41/native-rawcell0-step-capture" \
            --step-result-sha256 6e9485dcc8bc512481d714d794f87e76f785b577fd6f714ae12fd9d8e9468adf \
            --direct-directory "$VISIBLE_CAPTURE54/native-rawcell0-direct-ld" \
            --direct-result-sha256 e60da64312819a87388cfa96c209fc9188dca02c0ab055cbcc934f3507888ac6 \
            --eta 1 --max-factor-bytes 2147483648 --exact-workers 2 \
            --out "$VISIBLE_OUT/native-damped-chain-qr" \
            2>&1 | tee "$VISIBLE_OUT/native-damped-chain-qr.log"
      - name: Bind the actual complete new direction without an extra linear residual gate
        id: damped_identity
        run: |
          python - <<'PYDAMPED'
          import hashlib, json, os
          from pathlib import Path
          path = Path(os.environ['VISIBLE_OUT'])/'native-damped-chain-qr/result.json.gz'
          raw = path.read_bytes()
          receipt = dict(file='native-damped-chain-qr/result.json.gz', bytes=len(raw),
              sha256=hashlib.sha256(raw).hexdigest(),
              source_commit=os.environ['GITHUB_SHA'], actual_current_run=os.environ['GITHUB_RUN_ID'],
              exact_linear_and_L2_model_readbacks_are_diagnostics_not_new_trial_thresholds=True)
          (Path(os.environ['VISIBLE_OUT'])/'actual-damped-direction-identity.json').write_text(
              json.dumps(receipt, indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('result_sha256='+receipt['sha256']+'\n')
          PYDAMPED
      - name: Run the original ten nonlinear trials on the complete577-node restriction
        id: original_trial
        timeout-minutes: 30
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_native_damped_chain_trial_replay.py" \
            --failed-directory "$VISIBLE_TOPIC/notes/public-actions-43598917532-1-coupling112trust/full-DN112" \
            --cold-probe-summary "$VISIBLE_TOPIC/notes/public-actions-43602823170-1-coldtailprobe/cold-tail-residual/summary.json" \
            --first-candidate-summary "$VISIBLE_TOPIC/notes/public-actions-43603818345-1-zerorkprobe/same-RK-candidate-native-probe/summary.json" \
            --v2-candidate-summary "$VISIBLE_TOPIC/notes/public-actions-43604874829-1-zerorkprobev2/same-RK-candidate-native-probe-v2/summary.json" \
            --candidate-directory "$VISIBLE_TOPIC/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3" \
            --capture-directory "$VISIBLE_CAPTURE28/native-correction-capture" \
            --step-directory "$VISIBLE_CAPTURE41/native-rawcell0-step-capture" \
            --step-result-sha256 6e9485dcc8bc512481d714d794f87e76f785b577fd6f714ae12fd9d8e9468adf \
            --direct-directory "$VISIBLE_CAPTURE54/native-rawcell0-direct-ld" \
            --direct-result-sha256 e60da64312819a87388cfa96c209fc9188dca02c0ab055cbcc934f3507888ac6 \
            --direction-directory "$VISIBLE_OUT/native-damped-chain-qr" \
            --direction-result-sha256 "${{ steps.damped_identity.outputs.result_sha256 }}" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --node-heap 6144 --out "$VISIBLE_OUT/native-damped-chain-original-trial" \
            2>&1 | tee "$VISIBLE_OUT/native-damped-chain-original-trial.log"
      - name: Preserve all complete factors, constant rows, directions, original trials and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-mainline-dampedchain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visible-native-damped-chain/dampedchain/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded results with ordinary rebase and README checks
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u "$VISIBLE_COMPUTATIONS/root_20261114_publish_actions.py" \
            --results "$RUNNER_TEMP/visible-native-damped-chain/dampedchain" --lane dampedchain
