name: visible-larger R280 joint all-phase rational cases
'on':
  push:
    branches:
      - main
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-joint-phase-normal-balls-request.json
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: visible-larger-r280-joint-phase-normal-balls
  cancel-in-progress: false
jobs:
  rational_cases:
    name: Three conditional R280 cases without a surface or solver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      R280_COMP: topics/visible-flex-larger-amplitude/computations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/README.md
            /topics/visible-flex-larger-amplitude/computations/geometry_20261115_joint_phase_normal_balls.py
            /topics/visible-flex-larger-amplitude/computations/root_mixed_phase_normal_balls.py
            /topics/visible-flex-larger-amplitude/computations/public-joint-phase-normal-balls-request.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14
      - name: Bind both original sources and the explicit three-case recipe
        run: |
          python - <<'PYBIND'
          import ast, hashlib, json, os, subprocess
          from pathlib import Path
          comp = Path(os.environ['R280_COMP'])
          recipe_raw = (comp/'public-joint-phase-normal-balls-request.json').read_bytes()
          assert hashlib.sha256(recipe_raw).hexdigest() == '1899a66371506abb558fa166cf92f9657b1935fb3c1b45658cf2e3aa7ae60e30'
          recipe = json.loads(recipe_raw)
          assert recipe['request_number'] == 109
          assert recipe['repository'] == os.environ['GITHUB_REPOSITORY'] == 'Rogerhu12/math-research-public'
          assert len(recipe['cases']) == 3 and recipe['sqrt_bits'] == 128
          for path, expected in recipe['readme_git_blobs'].items():
              actual = subprocess.check_output(['git','rev-parse','HEAD:'+path], text=True).strip()
              if actual != expected:
                  raise RuntimeError('README changed; read updated rules before this computation: '+path)
          for name, expected in recipe['source_pins'].items():
              assert Path(name).name == name
              raw = (comp/name).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == expected
              compile(ast.parse(raw, filename=name), name, 'exec')
          temporary = Path(os.environ['RUNNER_TEMP'])/'r280-request109'
          temporary.mkdir()
          raw = (json.dumps(dict(cases=[case['input'] for case in recipe['cases']],
                    request_sha256=hashlib.sha256(recipe_raw).hexdigest()),
                    indent=2, allow_nan=False)+'\n').encode()
          (temporary/'input.json').write_bytes(raw)
          print(json.dumps(dict(event='R280-109-source-recipe-bound',
              recipe_sha256=hashlib.sha256(recipe_raw).hexdigest(),
              input_sha256=hashlib.sha256(raw).hexdigest(),
              source_pins=recipe['source_pins'], case_count=3,
              old_fixture_files_read=False, AST_only_so_far=True)))
          PYBIND
      - name: Execute the new joint alternative with the frozen exact R62 kernel
        timeout-minutes: 5
        run: |
          python -u "$R280_COMP/geometry_20261115_joint_phase_normal_balls.py" \
            --input "$RUNNER_TEMP/r280-request109/input.json" \
            --sqrt-bits 128 \
            --out "$RUNNER_TEMP/r280-request109/result.json"
      - name: Report complete small diagnostics and output hash without raw upload
        run: |
          python - <<'PYREPORT'
          import hashlib, json, os, sys
          from pathlib import Path
          comp = Path(os.environ['R280_COMP'])
          temporary = Path(os.environ['RUNNER_TEMP'])/'r280-request109'
          recipe_raw = (comp/'public-joint-phase-normal-balls-request.json').read_bytes()
          recipe = json.loads(recipe_raw)
          result_raw = (temporary/'result.json').read_bytes()
          result = json.loads(result_raw)
          assert result['schema'] == 'R280-joint-all-phase-continuous-normal-balls-v1'
          assert result['source_sha256'] == recipe['source_pins']['geometry_20261115_joint_phase_normal_balls.py']
          assert result['frozen_R62_source_sha256'] == recipe['source_pins']['root_mixed_phase_normal_balls.py']
          assert result['input_sha256'] == hashlib.sha256((temporary/'input.json').read_bytes()).hexdigest()
          assert result['complete_case_count'] == len(result['complete_records']) == 3
          records, failures = [], []
          for expected_case, actual in zip(recipe['cases'], result['complete_records'], strict=True):
              assert actual['name'] == expected_case['input']['name']
              original = actual['original_R62_record']
              assert original['exact_input'] == expected_case['input']
              joint = actual['joint_endpoint_certificate']
              view = dict(
                  old_endpoint_passes=[row['all_phase_non_normal_pass'] for row in original['endpoints']],
                  original_single_endpoint_OR=actual['original_single_endpoint_OR'],
                  joint_endpoint_pass=actual['joint_endpoint_pass'],
                  all_phase_no_double_normal_pass=actual['all_phase_no_double_normal_pass'],
                  new_joint_passes_where_both_old_endpoints_fail=actual['new_joint_passes_where_both_old_endpoints_fail'],
                  all_phase_continuous_distance_pass=original['all_phase_continuous_distance_pass'],
                  joint_phase_zero_margin=joint['phase_zero_margin'],
                  joint_phase_pi_margin=joint['phase_pi_margin'],
                  joint_quartic_ascending_coefficients=joint['quartic_ascending_coefficients'],
                  joint_distinct_real_roots=joint['sturm']['distinct_real_roots'])
              matched = view == expected_case['expected']
              records.append(dict(name=actual['name'], actual=view,
                  matches_analytic_case=matched,
                  original_all_normal_chord_pass=original['all_phase_continuous_normal_chord_pass'],
                  squared_error_thresholds=joint['squared_error_thresholds'],
                  joint_squared_error_threshold=joint['joint_squared_error_threshold']))
              if not matched:
                  failures.append(dict(name=actual['name'], expected=expected_case['expected'], actual=view))
          compact = dict(
              schema='R280-request109-actual-compact-rational-readout-v1',
              run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              source_commit=os.environ['GITHUB_SHA'], repository=os.environ['GITHUB_REPOSITORY'],
              python_version=sys.version.split()[0],
              recipe_sha256=hashlib.sha256(recipe_raw).hexdigest(),
              source_pins=recipe['source_pins'],
              input_sha256=result['input_sha256'],
              complete_output_bytes=len(result_raw),
              complete_output_sha256=hashlib.sha256(result_raw).hexdigest(),
              cases=records, analytic_case_failures=failures,
              all_three_analytic_cases_match=not failures,
              old_fixture_files_read=False, phase_sampling_used=False,
              full_surface_certified=False, actual_reach_certified=False,
              native_BVP_RHS_J_ODE_calls=0, raw_artifact_or_Release_uploads=0,
              proof_registration_waits_for_this_run=False)
          encoded=(json.dumps(compact,sort_keys=True,separators=(',',':'),allow_nan=False)+'\n').encode()
          print('BEGIN_R280_109_COMPACT_RESULT')
          print(encoded.decode(), end='')
          print('END_R280_109_COMPACT_RESULT')
          print(json.dumps(dict(event='R280-109-compact-readout-sha256',
              bytes=len(encoded),sha256=hashlib.sha256(encoded).hexdigest())))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as stream:
              stream.write('# R280 request109 conditional rational cases\n\n')
              for row in records:
                  a=row['actual']
                  stream.write('- '+row['name']+': old OR='+str(a['original_single_endpoint_OR'])
                      +', joint='+str(a['joint_endpoint_pass'])+', final OR='
                      +str(a['all_phase_no_double_normal_pass'])+', expected='
                      +str(row['matches_analytic_case'])+'\n')
              stream.write('\nComplete temporary output SHA-256: '
                  +hashlib.sha256(result_raw).hexdigest()
                  +'. No surface/native computation or raw artifact upload.\n')
          if failures:
              raise SystemExit('An actual conditional case differs from its stated analytic result; see the complete compact diagnostics above.')
          PYREPORT
