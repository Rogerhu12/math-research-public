name: ISP R150 temporary infinity research and current rule15
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isp-infinity-temporary-789f
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/invariant-subspace-problem/README.md
            /topics/invariant-subspace-problem/HANDOFF.md
            /topics/invariant-subspace-problem/notes/2026-11-15-r150-infinity-remote-session-789f.py
            /topics/invariant-subspace-problem/notes/2026-11-15-r150-infinity-remote-session-request-789f.json
            /topics/invariant-subspace-problem/notes/2026-11-15-r150-selected-infinity-resume486-input-locations-789f.json
          persist-credentials: false
      - name: Install exact rational arithmetic for the small source closure
        run: python -m pip install --quiet python-flint
      - name: Consume temporary inputs, apply current rules, and run pinned mathematics
        run: python topics/invariant-subspace-problem/notes/2026-11-15-r150-infinity-remote-session-789f.py
