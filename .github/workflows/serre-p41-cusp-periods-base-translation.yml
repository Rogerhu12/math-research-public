name: Serre p41 original cusp periods and base translation

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R764-public-cusp-periods-and-base-translation-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R764-original-cusp-periods-and-base-translation
  cancel-in-progress: false

jobs:
  original_cusp_periods_and_translation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-cusp-periods-base-translation.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R764_original_cusp_periods_and_base_translation.py
            /topics/serre-uniformity/scripts/R764_public_cusp_periods_and_base_translation.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R764-public-cusp-periods-and-base-translation-request.json
            /topics/serre-uniformity/notes/R764-original-cusp-periods-and-base-translation-method.md
            /topics/serre-uniformity/notes/R759-original-integral-period-lattice-and-map-degree-method.md
            /topics/serre-uniformity/results/R735-exact-original-p41-CM-model-and-Neron-input.md
            /topics/serre-uniformity/results/R738-certified-original-p41-period-input.md
            /topics/serre-uniformity/results/R745-certified-original-p41-Hodge-and-adelic-input.md
            /topics/serre-uniformity/results/R751-original-period-compression-in-the-retained-degree-280-field.md
            /topics/serre-uniformity/results/R762-original-mu3-quotient-and-single-function-map-recovery.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Reuse complete original periods and extract exact cusp translations
        continue-on-error: true
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R764_public_cusp_periods_and_base_translation.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R764-original-cusp-periods-and-base-translation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R764-original-cusp-periods-and-base-translation/output
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve exact states and small complete or failed receipts
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R764_public_cusp_periods_and_base_translation.py publish
      - name: Require all exact cusp periods and unique c0 translations
        if: always()
        run: python topics/serre-uniformity/scripts/R764_public_cusp_periods_and_base_translation.py verify
