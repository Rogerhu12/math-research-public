point-before-R431.md","bytes":28841,"blob":"bc8654a9c457ee5244c9e5a20287685c9d920690"},{"path":"topics/visible-flex-larger-amplitude/notes/2026-11-16-open-checkpoint-before-R434.md","bytes":29527,"blob":"04670db6cca60d8fb7040987a78c72fdb3917316"},{"path":"topics/visible-flex-larger-amplitude/notes/2026-11-16-open-checkpoint-before-R437.md","bytes":29164,"blob":"e5c2372a3d9c26778a335aa9a640dcd8eaea2831"},{"path":"topics/visible-flex-larger-amplitude/notes/2026-11-16-open-checkpoint-before-R443.md","bytes":28666,"blob":"1ebc6641bc7db41389ce04c668015a6cbd3d8867"},{"path":"topics/visible-flex-larger-amplitude/notes/2026-11-16-open-checkpoint-before-request201.md","bytes":28942,"blob":"ace2a6a0a46d6ed26587063a28b6903b5c79f791"},{"path":"topics/visible-flex-larger-amplitude/notes/2026-11-16-open-checkpoint-before-request202.md","bytes":29119,"blob":"1746d7f0240d303b6e04ac33a0ef2a731bf74909"},{"path":"topics/visible-flex-larger-amplitude/notes/2026-11-16-open-checkpoint-before-request203.md","bytes":29302,"blob":"511fdb1fd7b6d2299a713768b8fbc1b9ec979e09"},{"path":"topics/visible-flex-larger-amplitude/notes/open-checkpoint-through-request137-2026-11-15.md","bytes":30158,"blob":"ed4fe8b33e446950109ede1bed957504fd03aabd"},{"path":"topics/visible-flex-larger-amplitude/notes/open-checkpoint-through-request139-2026-11-15.md","bytes":29789,"blob":"53939a2b0978f88880d9c6788571d9774ca98191"},{"path":"topics/visible-flex-larger-amplitude/notes/open-checkpoint-through-request142-2026-11-15.md","bytes":29766,"blob":"176bbd8fe39ef1faad2afcf31659f8d7fbdf8499"},{"path":"topics/visible-flex-larger-amplitude/notes/open-checkpoint-through-request99-2026-11-15.md","bytes":29573,"blob":"6f1bab63af65bcc3c605854a561998eb6333d138"}]''')
          targets=[x["path"] for x in candidates]
          names=[pathlib.PurePosixPath(x).name for x in targets]
          target_set=set(targets)
          metadata=[]
          patterns=[]
          for row in candidates:
              path=row["path"]
              raw=(checkout/path).read_bytes()
              actual_blob=git("-C",str(checkout),"rev-parse","HEAD:"+path)
              if len(raw)!=row["bytes"] or actual_blob!=row["blob"]:raise SystemExit("Checkpoint changed: "+path)
              sha=hashlib.sha256(raw).hexdigest()
              value=raw.decode("utf-8")
              metadata.append(dict(row,sha256=sha,first_nonempty_line=next((x for x in value.splitlines() if x.strip()),"")[:240]))
              patterns.extend([pathlib.PurePosixPath(path).name,row["blob"],sha])
          scope=[topic,".github/workflows","README.md"]
          command=["git","-C",str(checkout),"grep","-I","-l","-F"]
          for item in patterns:command.extend(["-e",item])
          command.extend(["HEAD","--",*scope])
          scan=subprocess.run(command,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
          if scan.returncode not in (0,1):raise SystemExit("Reference search failed: "+scan.stderr[-3000:])
          paths=sorted(set(x.removeprefix("HEAD:") for x in scan.stdout.splitlines()))
          records=[]
          nonmd=[]
          for path in paths:
              if path in target_set:continue
              raw=(checkout/path).read_bytes()
              value=raw.decode("utf-8")
              ids=sorted({i for i,row in enumerate(metadata) if names[i] in value or row["blob"] in value or row["sha256"] in value})
              record={"path":path,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),"checkpoint_indices":ids}
              if not path.endswith(".md"):
                  matches=[]
                  for n,line in enumerate(value.splitlines(),1):
                      hit=[i for i in ids if names[i] in line or metadata[i]["blob"] in line or metadata[i]["sha256"] in line]
                      if hit:matches.append({"line":n,"target_indices":hit,"text":line if len(line)<=1500 else None,"characters":len(line)})
                  record["all_matching_lines"]=matches
