name: Capped Hhalf saved body budget

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-capped-Hhalf-saved-budget-public.yml

permissions:
  contents: write

concurrency:
  group: capped-Hhalf-saved-body-budget-v1
  cancel-in-progress: false

jobs:
  complete-new-body-bounds:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_capped_Hhalf_saved_budget_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-20-capped-Hhalf-saved-budget-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the same completed directed runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Consume whole completed X and Y scalar budgets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_capped_Hhalf_saved_budget_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-20-capped-Hhalf-saved-budget-inputs.json --manifest-sha 375a1ffc16af7834d92ec044cb33078705150fc88ce76bbe639d74754f87443f
