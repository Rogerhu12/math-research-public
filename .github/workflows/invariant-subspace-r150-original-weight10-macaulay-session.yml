name: ISP R150 full original weight-ten Macaulay and independent certificates
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: isp-original-weight10-macaulay-temporary-789f
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.MR_TOKEN }}
      GOMAXPROCS: "2"
      GOMEMLIMIT: "256MiB"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Record the bounded workflow start
        run: |
          python - <<'PY'
          import os,time
          with open(os.environ["GITHUB_ENV"],"a") as stream:
              stream.write("R150_MACAULAY_WEIGHT10_JOB_STARTED_UTC="+str(time.time())+"\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/invariant-subspace-problem/README.md
            /topics/invariant-subspace-problem/HANDOFF.md
            /topics/invariant-subspace-problem/notes/2026-11-16-r150-original-weight10-macaulay-session-789f.py
            /topics/invariant-subspace-problem/notes/2026-11-16-r150-original-weight10-macaulay-session-request-789f.json
          persist-credentials: false
      - name: Select the exact original model Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned exact arithmetic
        timeout-minutes: 5
        run: python -m pip install --quiet python-flint==0.9.0
      - name: Compile controls, rebuild all original parents, then verify complete Macaulay certificates
        run: python topics/invariant-subspace-problem/notes/2026-11-16-r150-original-weight10-macaulay-session-789f.py
