name: visible-exact recover actual cap artifacts and complete all 1977 cells

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-cap128-recover-complete.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-cap128-continuous
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CAP_SCIENCE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cap128-CI-pinned-inputs.json
  CAP_SCIENCE_SHA: 867699a5e7f968f97d9a3f50267e310181023fdbe0b815a7f9c22c6b21585e32
  CAP_RECOVERY_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cap128-CI-artifact-recovery.json
  CAP_RECOVERY_SHA: 1fc6ac79e083f98781ad03cbad32d144219109fe561f56f628e1bd9502a2cf7e
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  recover-and-complete:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 350
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out unchanged science and the separately reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cap128-CI-pinned-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cap128-CI-artifact-recovery.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Fetch only exact source and original completed-prefix files
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py
          --kind cap --mode hydrate --manifest "$CAP_SCIENCE_MANIFEST" --manifest-sha "$CAP_SCIENCE_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --recovery-manifest "$CAP_RECOVERY_MANIFEST" --recovery-sha "$CAP_RECOVERY_SHA"
      - name: Install the original arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible artifact paths
        id: paths
        run: |
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-cap128-original-bundle" >> "$GITHUB_OUTPUT"
          printf 'previous=%s\n' "$RUNNER_TEMP/visible-exact-cap128-original-cells" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-cap128-recovered-complete" >> "$GITHUB_OUTPUT"
      - name: Reuse the exact already successful preparation without recomputing it
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43580498603
          name: visible-exact-cap128-prepared-43580498603-1
          path: ${{ steps.paths.outputs.prepared }}
      - name: Recover every original actual cell artifact including wrapper failures
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43580498603
          pattern: visible-exact-cap128-cells-*-43580498603-1
          merge-multiple: false
          path: ${{ steps.paths.outputs.previous }}
      - name: Publish original outcomes, consume only missing cells, and assemble the whole cap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py
          --kind cap --mode finish-cap --manifest "$CAP_SCIENCE_MANIFEST" --manifest-sha "$CAP_SCIENCE_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --recovery-manifest "$CAP_RECOVERY_MANIFEST" --recovery-sha "$CAP_RECOVERY_SHA"
          --prepared "$RUNNER_TEMP/visible-exact-cap128-original-bundle"
          --previous-artifacts "$RUNNER_TEMP/visible-exact-cap128-original-cells"
          --work "$RUNNER_TEMP/visible-exact-cap128-recovery-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-cap128-recovered-complete"
          --compute-minutes 310 --checkpoint-minutes 10
      - name: Preserve complete or partial native bytes and all original actual outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cap128-recovered-complete-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
