name: visible-exact M32 body cross weighted Green

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_M32_body_cross_weighted_Green.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_M32_body_cross_weighted_Green_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-14-R133-M32-body-cross-weighted-Green-CI-inputs.json'
      - '.github/workflows/visible-exact-M32-body-cross-weighted-Green.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-M32-body-cross-weighted-Green
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CROSS_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-M32-body-cross-weighted-Green-CI-inputs.json
  CROSS_MANIFEST_SHA: fecb0119d3e4f472cd74d4ae80f8f31de2ee0ba4b3635e974c2bbe65f200b12e
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  consume:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 75
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-M32-body-cross-weighted-Green-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate all175 pins preserving both original147 and97 closures
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$CROSS_MANIFEST" --manifest-sha "$CROSS_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/M32_body_cross_weighted_Green_ci/
      - name: Parse the two new sources before any mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_M32_body_cross_weighted_Green.py','fourfold_codazzi_M32_body_cross_weighted_Green_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('New source and worker parsed; no original target or kernel exponential will be run.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible artifact paths
        id: paths
        run: |
          printf 'green=%s\n' "$RUNNER_TEMP/visible-exact-M32-body-cross-green" >> "$GITHUB_OUTPUT"
          printf 'kernel=%s\n' "$RUNNER_TEMP/visible-exact-M32-body-cross-kernel" >> "$GITHUB_OUTPUT"
          printf 'high=%s\n' "$RUNNER_TEMP/visible-exact-M32-body-cross-high" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-M32-body-cross-output" >> "$GITHUB_OUTPUT"
      - name: Receive the original complete finite193 signed Green
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43601964129
          name: visible-exact-complete-cut-Green-complete-43601964129-1
          path: ${{ steps.paths.outputs.green }}
      - name: Receive all previously completed signed Gram and scalar integral rows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43633074696
          name: visible-exact-finite193-L2-Green-kernel-43633074696-1
          path: ${{ steps.paths.outputs.kernel }}
      - name: Receive the exact complete coefficient native and six-gate original receipt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43630093667
          name: visible-exact-known-high-success-receipt-43630093667-1
          path: ${{ steps.paths.outputs.high }}
      - name: Consume only new body cross fees and weighted cached kernels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_M32_body_cross_weighted_Green_CI.py
          --manifest "$CROSS_MANIFEST" --manifest-sha "$CROSS_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --green-artifact "$RUNNER_TEMP/visible-exact-M32-body-cross-green"
          --kernel-artifact "$RUNNER_TEMP/visible-exact-M32-body-cross-kernel"
          --high-receipt-artifact "$RUNNER_TEMP/visible-exact-M32-body-cross-high"
          --work "$RUNNER_TEMP/visible-exact-M32-body-cross-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-M32-body-cross-output"
          --compute-minutes 60 --checkpoint-minutes 10
      - name: Require nonempty actual evidence and bounded inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process evidence exists')
          rows=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          data=(json.dumps(rows,indent=2)+'\n').encode()
          if len(data)>60000:raise RuntimeError('inventory exceeds60000 bytes; retain all original evidence')
          (root/'artifact-inventory.json').write_bytes(data)
          print(dict(actual_files=len(files),actual_inventory_bytes=len(data)))
          PY_INVENTORY
      - name: Preserve every actual new prefix and all original receipt bytes
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-M32-body-cross-weighted-Green-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
