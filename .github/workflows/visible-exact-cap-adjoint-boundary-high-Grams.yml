name: visible-exact true cap adjoint boundary and high Grams

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_core.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_boundary_high_Grams.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_boundary_high_Grams_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cap-adjoint-true-boundary-high-Gram-CI-inputs.json'
      - '.github/workflows/visible-exact-cap-adjoint-boundary-high-Grams.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-cap-adjoint-boundary-high-Grams
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  GRAM_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cap-adjoint-true-boundary-high-Gram-CI-inputs.json
  GRAM_MANIFEST_SHA: b753b78658c11326aadb0b70fab2be440c690b1f3ac78fabcac42ca799612465
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  exact-texts:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Partially check out the frozen core and two new sources
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_core.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_boundary_high_Grams.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_boundary_high_Grams_CI.py
      - name: Check the three exact SHA256s and syntax without mathematical imports
        run: |
          python - <<'PY_EXACT_AST'
          import ast,hashlib,pathlib
          expected={
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_core.py':'689bf2c54350d832cffa7ca8f46dc424509fb221e3d73cb228a1f9a18130c0dc',
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_boundary_high_Grams.py':'4105236306bcb5c1d43821a44aca06fbea1f214fd983d8c48562a94dfde832dd',
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_boundary_high_Grams_CI.py':'ab34ab0edfeb69901b46b468255d9d74780a63742ade1bceec459ac226fb5cfe',
          }
          for name,sha in expected.items():
              raw=pathlib.Path(name).read_bytes()
              if hashlib.sha256(raw).hexdigest()!=sha:
                  raise ValueError('An exact new source changed: '+name)
              ast.parse(raw.decode(),filename=name)
          print('Exact frozen core, boundary producer and worker parsed; no mathematical producer imported or executed.')
          PY_EXACT_AST

  boundary-high:
    needs: exact-texts
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 200
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out sources and separately reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cap-adjoint-true-boundary-high-Gram-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Set the actual container-visible artifact output path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-cap-adjoint-boundary-high-Grams-output" >> "$GITHUB_OUTPUT"
      - name: Hydrate341 files with all original337 pilot pins unchanged
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$GRAM_MANIFEST" --manifest-sha "$GRAM_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/cap_adjoint_boundary_high_Grams_ci/
      - name: Install the original pinned arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Certify the true endpoints and complete infinite-high trial output in all97 input directions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_boundary_high_Grams_CI.py
          --manifest "$GRAM_MANIFEST" --manifest-sha "$GRAM_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --work "$RUNNER_TEMP/visible-exact-cap-adjoint-boundary-high-Grams-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-cap-adjoint-boundary-high-Grams-output"
          --compute-minutes 170 --checkpoint-minutes 10
      - name: Require an actual nonempty process and retain the real success or failure
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_ACTUAL'
          import json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          process=root/'process.json'
          if not process.is_file() or not process.stat().st_size:
              raise RuntimeError('No actual nonempty adjoint Gram process exists')
          d=json.loads(process.read_text())
          if d.get('repository')!='Rogerhu12/math-research-public':
              raise ValueError('The actual process belongs to another repository')
          files=[p for p in root.rglob('*') if p.is_file()]
          print(json.dumps(dict(actual_files=len(files),actual_bytes=sum(p.stat().st_size for p in files),
              process_complete=d.get('complete'),actual_failure=d.get('failure'),
              actual_complete_stages=d.get('actual_completed_stages'),
              old_targets_recomputed=0,complete_full_cap_high_to_low_claimed=False)))
          PY_ACTUAL
      - name: Preserve all complete endpoint and high-output Grams with every actual stage
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cap-adjoint-boundary-high-Grams-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
