name: visible-flex preserve exact completed R738 inputs for two new consumers
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r738-completed-sources-20261128.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visible-r738-completed-sources-20261128
  cancel-in-progress: false
jobs:
  receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r738-completed-sources-20261128.json
            /topics/visible-flex-new-mechanism/scripts/r738_receive_completed_sources_20261128.py
            /topics/visible-flex-new-mechanism/scripts/r734_completed_members_transport_20261128.py
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r738-fixed-g-paid14-and-complete-deep-caps-natural-terminal.md
            /.github/workflows/visible-r738-completed-sources-20261128.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull current rules and transport the exact completed source bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python topics/visible-flex-new-mechanism/scripts/r738_receive_completed_sources_20261128.py
          --request topics/visible-flex-new-mechanism/computations/request-r738-completed-sources-20261128.json
      - name: Preserve the common immutable inputs and original receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-r738-completed-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r738-completed-sources/
          retention-days: 30
          if-no-files-found: error
