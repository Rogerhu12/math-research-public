name: Both genuine profile columns at all 576 negative root-window interfaces
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-genuine-root-seam-receiver.yml
permissions:
  contents: read
concurrency:
  group: visible-flex-exact-genuine-root-seam-receiver-20261128
  cancel-in-progress: false
jobs:
  genuine-root-seam-receiver:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    container: python@sha256:4d1caded1f729ae443eb803f26ffde7b61e696aeaef62f099abb6dd6b14257c7
    timeout-minutes: 35
    steps:
      - name: Install public read-only repository transport
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_signed_density_transport_arithmetic.py
