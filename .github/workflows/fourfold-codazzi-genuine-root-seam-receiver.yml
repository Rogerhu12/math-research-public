          CHECK
          python -m pip install --disable-pip-version-check numpy==2.3.5 python-flint==0.9.0
      - name: Receive every original root-window jump in the physical waist
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: |
          root=topics/visible-flex-exact-nearby/scripts
          python "$root/fourfold_codazzi_true_ratio_live_rules.py" python "$root/fourfold_codazzi_genuine_root_seam_receiver.py" --repo "$GITHUB_WORKSPACE" --private "$RUNNER_TEMP/gjr" --receipt "$RUNNER_TEMP/gjr-receipt.json"
      - name: Retain the complete small result or last natural physical prefix
        if: always()
        run: |
          python - <<'PYEND'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"gjr-receipt.json"
          if p.is_file():
              b=p.read_bytes()
              if not 0<len(b)<100000:raise ValueError("qualified small GJR record")
              print("GJR_FINAL_SMALL_OR_PREFIX",len(b),hashlib.sha256(b).hexdigest(),b.decode().strip(),flush=True)
          PYEND
