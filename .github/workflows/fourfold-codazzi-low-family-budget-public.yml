name: R139 complete low-family remaining-three continuation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-low-family-budget-public.yml

permissions:
  contents: write

concurrency:
  group: r139-w2c-low-family-budget-v4
  cancel-in-progress: false

jobs:
  complete-low-family-budget:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_collar_volterra_dual_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-20-low-family-budget-v4-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install fixed directed runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Continue the three unfinished low-family records
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_collar_volterra_dual_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-20-low-family-budget-v4-inputs.json --manifest-sha 382cbdc96a44d990113609d352388ecce3f42f04041620d1134eaec6d43e38be
