name: visible-exact complete directional matrix Green

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_directional_matrix_Green.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_directional_matrix_Green_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete-directional-matrix-Green-CI-inputs.json'
      - '.github/workflows/visible-exact-complete-directional-matrix-Green.yml'
  workflow_run:
    workflows: ['visible-exact complete same-F directional matrices v4']
    types: [completed]
  workflow_dispatch:
    inputs:
      matrix_run:
        description: Actual complete same-F matrix run; original four cells remain unchanged
        required: true
        default: '43654510038'
      matrix_attempt:
        description: Actual original complete matrix attempt
        required: true
        default: '1'

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-directional-matrix-Green
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  MATRIX_GREEN_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete-directional-matrix-Green-CI-inputs.json
  MATRIX_GREEN_MANIFEST_SHA: 3350a96fbea47ee33bb09cb6602cb1e978e8ba00a034c7f735dfb60bade99910
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  eligibility:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.original.outputs.ready }}
      matrix_run: ${{ steps.original.outputs.matrix_run }}
      matrix_attempt: ${{ steps.original.outputs.matrix_attempt }}
    steps:
      - name: Check out only new texts for immediate syntax verification
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_directional_matrix_Green.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_directional_matrix_Green_CI.py
      - name: Parse both exact new texts even while the original matrix run remains active
        run: |
          python - <<'PY_EARLY_AST'
          import ast,hashlib,pathlib
          expected={
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_directional_matrix_Green.py':
                  '9dca5868ed04b051aa10799978412a4b74644ae75dea748bcdc4159b3d47659d',
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_directional_matrix_Green_CI.py':
                  '3709858655e70ebe7bd334b4c1b0c070cdb8855ad31878a240229c4768b3e096',
          }
          for name,sha in expected.items():
              raw=pathlib.Path(name).read_bytes()
              if hashlib.sha256(raw).hexdigest()!=sha:
                  raise ValueError('One new exact source text differs: '+name)
              ast.parse(raw.decode(),filename=name)
          print('Both exact new sources parsed; no mathematical producer imported or executed.')
          PY_EARLY_AST
      - name: Verify the exact original completed public matrix run before any new mathematics
        id: original
        uses: actions/github-script@v7
        env:
          REQUESTED_MATRIX_RUN: ${{ inputs.matrix_run }}
          REQUESTED_MATRIX_ATTEMPT: ${{ inputs.matrix_attempt }}
        with:
          script: |
            const owner='Rogerhu12',repo='math-research-public';
            let run='43654510038',attempt='1';
            if(context.eventName==='workflow_run'){
              run=String(context.payload.workflow_run.id);
              attempt=String(context.payload.workflow_run.run_attempt);
            }else if(context.eventName==='workflow_dispatch'){
              run=process.env.REQUESTED_MATRIX_RUN;
              attempt=process.env.REQUESTED_MATRIX_ATTEMPT;
            }
            if(!/^[0-9]+$/.test(run)||!/^[0-9]+$/.test(attempt)){
              throw new Error('The original matrix run and attempt must be explicit decimal IDs');
            }
            const response=await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(run)});
            const d=response.data;
            if(d.repository.full_name!==owner+'/'+repo ||
               d.path!=='.github/workflows/visible-exact-complete-same-F-directional-matrices-v4.yml'){
              throw new Error('The requested run is not the exact authorized matrix workflow');
            }
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner,repo,run_id:Number(run),per_page:100});
            const name='visible-exact-complete-same-F-5970-finish-'+run+'-'+attempt;
            const selected=artifacts.filter(a=>a.name===name&&!a.expired);
            const ready=d.status==='completed'&&selected.length===1;
            core.setOutput('ready',ready?'true':'false');
            core.setOutput('matrix_run',run);
            core.setOutput('matrix_attempt',attempt);
            core.info(JSON.stringify({original_run:run,attempt,status:d.status,
              conclusion:d.conclusion,complete_finish_artifact_present:selected.length===1,
              new_mathematics_permitted:ready,
              mathematical_child0_full_native_and_all_gates_still_checked_by_worker:true}));
            if(!ready&&context.eventName==='workflow_dispatch'){
              throw new Error('The requested original complete matrix artifact is not yet available');
            }

  backward:
    needs: eligibility
    if: needs.eligibility.outputs.ready == 'true' && github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 360
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete-directional-matrix-Green-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Set actual container-visible paths
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-directional-matrix-Green-output" >> "$GITHUB_OUTPUT"
      - name: Hydrate all234 exact pins with original225 and101 inputs unchanged
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$MATRIX_GREEN_MANIFEST" --manifest-sha "$MATRIX_GREEN_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/complete_directional_matrix_Green_ci/
      - name: Parse the exact new source and worker before any new mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          for filename in (
            'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_directional_matrix_Green.py',
            'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_directional_matrix_Green_CI.py',
          ):
              ast.parse(pathlib.Path(filename).read_text(),filename=filename)
          print('Both new files parsed; old targets, F, C, Grams and positive ports remain frozen.')
          PY_AST
      - name: Install the original pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Actual backward sweep with original arrays and real pull every10minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_directional_matrix_Green_CI.py
          --phase backward
          --matrix-run '${{ needs.eligibility.outputs.matrix_run }}'
          --matrix-attempt '${{ needs.eligibility.outputs.matrix_attempt }}'
          --manifest "$MATRIX_GREEN_MANIFEST" --manifest-sha "$MATRIX_GREEN_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --work "$RUNNER_TEMP/visible-exact-directional-matrix-Green-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-directional-matrix-Green-output"
          --compute-minutes 320 --checkpoint-minutes 10
      - name: Require actual nonempty evidence and bounded inventory parts
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('No actual nonempty matrix Green process or prefix exists')
          entries=[]
          for p in files:
              h=hashlib.sha256()
              with p.open('rb') as source:
                  for chunk in iter(lambda:source.read(8*1024*1024),b''):
                      h.update(chunk)
              entries.append(dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=h.hexdigest()))
          for number,first in enumerate(range(0,len(entries),128)):
              raw=(json.dumps(entries[first:first+128],indent=2)+'\n').encode()
              if len(raw)>60000:raise RuntimeError('One actual matrix Green inventory part exceeds60000 bytes')
              (root/f'artifact-inventory-{number:03d}.json').write_bytes(raw)
          print(dict(actual_files=len(files),inventory_parts=(len(entries)+127)//128))
          PY_INVENTORY
      - name: Preserve every actual native chunk and original-origin matrix prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-directional-matrix-Green-backward-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 90
          if-no-files-found: error

  forward:
    needs: [eligibility, backward]
    if: needs.eligibility.outputs.ready == 'true' && github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 360
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete-directional-matrix-Green-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Set actual container-visible paths
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-directional-matrix-Green-output" >> "$GITHUB_OUTPUT"
      - name: Hydrate all234 exact pins with original225 and101 inputs unchanged
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$MATRIX_GREEN_MANIFEST" --manifest-sha "$MATRIX_GREEN_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/complete_directional_matrix_Green_ci/
      - name: Parse the exact new source and worker before any new mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          for filename in (
            'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_directional_matrix_Green.py',
            'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_directional_matrix_Green_CI.py',
          ):
              ast.parse(pathlib.Path(filename).read_text(),filename=filename)
          print('Both new files parsed; old targets, F, C, Grams and positive ports remain frozen.')
          PY_AST
      - name: Install the original pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Actual forward sweep with original arrays and real pull every10minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_directional_matrix_Green_CI.py
          --phase forward
          --matrix-run '${{ needs.eligibility.outputs.matrix_run }}'
          --matrix-attempt '${{ needs.eligibility.outputs.matrix_attempt }}'
          --backward-run '${{ github.run_id }}' --backward-attempt '${{ github.run_attempt }}'
          --manifest "$MATRIX_GREEN_MANIFEST" --manifest-sha "$MATRIX_GREEN_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --work "$RUNNER_TEMP/visible-exact-directional-matrix-Green-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-directional-matrix-Green-output"
          --compute-minutes 320 --checkpoint-minutes 10
      - name: Require actual nonempty evidence and bounded inventory parts
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('No actual nonempty matrix Green process or prefix exists')
          entries=[]
          for p in files:
              h=hashlib.sha256()
              with p.open('rb') as source:
                  for chunk in iter(lambda:source.read(8*1024*1024),b''):
                      h.update(chunk)
              entries.append(dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=h.hexdigest()))
          for number,first in enumerate(range(0,len(entries),128)):
              raw=(json.dumps(entries[first:first+128],indent=2)+'\n').encode()
              if len(raw)>60000:raise RuntimeError('One actual matrix Green inventory part exceeds60000 bytes')
              (root/f'artifact-inventory-{number:03d}.json').write_bytes(raw)
          print(dict(actual_files=len(files),inventory_parts=(len(entries)+127)//128))
          PY_INVENTORY
      - name: Preserve every actual native chunk and original-origin matrix prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-directional-matrix-Green-forward-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
