name: visible-flex eleven modes with complete nonlinear core
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r602-eleven-core-completed-20261126.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r594-eight-mode-weak-bvp-20261126
  cancel-in-progress: false
jobs:
  research:
    name: Preserve actual height and solve new modes18 20 22 with full core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r602-eleven-core-completed-20261126.json
            /topics/visible-flex-new-mechanism/scripts/r576_function_space_continuation_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r576_finite_height_turning_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r571_milder_seed_outer_jets_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r571_nonmonotone_connector_gain_20261126.py
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r576_exact_knot_height_continuation_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r576_body_forced_j4_height_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r594_eight_mode_weak_height_bvp_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r594_paid_weak_resume_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r600_factored_high_mode_jets_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r602_eleven_mode_core_completed_height_20261126.py
            /topics/visible-flex-new-mechanism/scripts/run_inverse_state_stdin_20261126.py
            /.github/workflows/visible-r602-eleven-core-completed-20261126.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull both rule sets and solve the complete new angular space
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_state_stdin_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r602-eleven-core-completed-20261126.json
          --lane r602-eleven-core-completed
      # Entire paid496q is embedded; only18/20/22 have new DtN calculations.
      # R602 is an actual dependent height correction with its complete Jacobian.
      # Original radial points retained; active256/fine512 and full harmonics read.
      # Stdout only: no raw table files, artifacts, releases, or Git writes.
