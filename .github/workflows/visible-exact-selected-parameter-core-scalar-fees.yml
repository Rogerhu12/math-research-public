name: visible-exact selected-parameter core scalar fees

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-selected-parameter-core-scalar-fees.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-selected-parameter-core-scalar-fees
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  DDELTA_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-selected-parameter-core-scalar-fees-CI-inputs.json
  DDELTA_MANIFEST_SHA: 14271d7d61c70996092f105768ca29cc0dd355665be0becea4386441b38c907f
  DDELTA_PIPELINE_SHA: 827fcb237a79b48c095872b61c370ff2ceafc143a8dc6a1774021188ff3ea320
  DDELTA_WORKER_SHA: 2e1527bfecb2b33ca911d7f8215d8c09e896e36b58144446b34b4a6f01fcc52f
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  selected-parameter-core-scalar-fees:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 60
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_selected_parameter_core_scalar_fees_ci.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-selected-parameter-core-scalar-fees-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_selected_parameter_core_scalar_fees_ci.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['DDELTA_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_selected_parameter_core_scalar_fees_ci.py --mode hydrate
          --manifest "$DDELTA_MANIFEST" --manifest-sha "$DDELTA_MANIFEST_SHA"
          --pipeline-sha "$DDELTA_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new source before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_selected_parameter_core_scalar_fees.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['DDELTA_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the identical completed scientific runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5 scipy==1.17.0
      - name: Restore forty original natural parts and evaluate only new scalar differences
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_selected_parameter_core_scalar_fees_ci.py --mode run
          --manifest "$DDELTA_MANIFEST" --manifest-sha "$DDELTA_MANIFEST_SHA"
          --pipeline-sha "$DDELTA_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-selected-parameter-core-scalar-fees-science"
          --out-dir "$RUNNER_TEMP/visible-exact-selected-parameter-core-scalar-fees-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
