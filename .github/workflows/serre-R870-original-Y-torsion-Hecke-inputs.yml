name: Serre R870 original Y torsion and Hecke inputs

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R870-original-Y-torsion-Hecke-inputs-public-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R870-original-Y-torsion-Hecke-inputs
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/notes/R870-original-Y-torsion-Hecke-inputs-public-request.json
      - name: Pull main and compare both rule files with the read commit
        env:
          REQUEST_SOURCE: ${{ github.sha }}
          RECEIPT_PATH: ${{ runner.temp }}/R870-original-Y-torsion-Hecke-inputs-rules-pull.json
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, subprocess
          from pathlib import Path
          path='topics/serre-uniformity/notes/R870-original-Y-torsion-Hecke-inputs-public-request.json'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',os.environ['REQUEST_SOURCE']],check=True)
          request=json.loads(subprocess.check_output(['git','show',os.environ['REQUEST_SOURCE']+':'+path]))
          subprocess.run(['git','checkout','-B','r870-original-Y-torsion-Hecke-inputs-rules-main'],check=True)
          subprocess.run(['git','pull','--rebase','origin','main'],check=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          old=request['rules_last_read_commit']
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',old],check=True)
          actual={key:hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  for key,name in [('root','README.md'),('topic','topics/serre-uniformity/README.md')]}
          changed=actual!=request['readme_sha256']
          receipt={'actual_git_pull_rebase_completed':True,'actual_head':head,'previous_read_commit':old,
                   'actual_UTC':dt.datetime.now(dt.timezone.utc).isoformat(),'readme_sha256':actual,
                   'expected_readme_sha256':request['readme_sha256'],'rules_changed':changed}
          Path(os.environ['RECEIPT_PATH']).write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('R870_RULES_PULL='+json.dumps(receipt,sort_keys=True))
          if changed:
              subprocess.run(['git','diff',old,head,'--','README.md','topics/serre-uniformity/README.md'],check=True)
              raise SystemExit('Both README changes must be read before the new mathematics.')
          PY
      - name: Preserve the actual pull receipt for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-R870-original-Y-torsion-Hecke-inputs-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R870-original-Y-torsion-Hecke-inputs-rules-pull.json
          retention-days: 1
          if-no-files-found: warn

  compute:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R870_original_Y_torsion_Hecke_inputs.py
            /topics/serre-uniformity/scripts/R870_public_original_Y_torsion_Hecke_inputs.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/results/R870-original-rational-Picard-torsion-and-T7-support-certificates.md
            /topics/serre-uniformity/results/R865-original-Hecke-T7-from-certified-level82-Fourier-rows.md
            /topics/serre-uniformity/notes/2026-11-16-original-c0-rigidified-Poincare-fibres-and-theta-section-DAG.md
            /topics/serre-uniformity/notes/2026-11-16-original-Y-RR-connections-and-Hecke-period-row.md
            /topics/serre-uniformity/notes/R870-original-Y-torsion-Hecke-inputs-consumer-method.md
            /topics/serre-uniformity/notes/R870-original-Y-torsion-Hecke-inputs-public-request.json
            /.github/workflows/serre-R870-original-Y-torsion-Hecke-inputs.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse sources without importing mathematical code
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          base=Path('topics/serre-uniformity/scripts')
          for name in ('R870_original_Y_torsion_Hecke_inputs.py',
                       'R870_public_original_Y_torsion_Hecke_inputs.py',
                       'R824_public_original_global_polar_generators.py'):
              path=base/name
              ast.parse(path.read_text(),filename=str(path))
              print('AST_OK',name)
          PY
      - name: Compute original rational torsion integers and Picard inputs
        run: |
          python topics/serre-uniformity/scripts/R870_public_original_Y_torsion_Hecke_inputs.py compute \
            --request topics/serre-uniformity/notes/R870-original-Y-torsion-Hecke-inputs-public-request.json \
            --output "$RUNNER_TEMP/R870-original-Y-torsion-Hecke-inputs/output"
      - name: Preserve original sources and completed new stages for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-R870-original-Y-torsion-Hecke-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R870-original-Y-torsion-Hecke-inputs/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
      - name: Read complete source and certificate interfaces
        if: always()
        run: |
          python topics/serre-uniformity/scripts/R870_public_original_Y_torsion_Hecke_inputs.py verify \
            --request topics/serre-uniformity/notes/R870-original-Y-torsion-Hecke-inputs-public-request.json \
            --output "$RUNNER_TEMP/R870-original-Y-torsion-Hecke-inputs/output"
