name: visible-exact cached quarter centre residual Hessian v2

on:
  workflow_run:
    workflows: ['visible-exact quarter endpoint recovery and complete cap finish']
    types: [completed]
  workflow_dispatch:
    inputs:
      quarter_run:
        description: 'Actual successful complete-quarter workflow run in this public repository'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-cached-quarter-centre-Hessian-v2-${{ github.event.workflow_run.id || inputs.quarter_run }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  HESSIAN_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cached-quarter-centre-Hessian-v2-CI-inputs.json
  HESSIAN_MANIFEST_SHA: 47ff50fc768a24269ea7dab3de284581fdf8be1abd04fb867d4a55be78b1368d
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5
  ORIGINAL_QUARTER_RUN: ${{ github.event.workflow_run.id || inputs.quarter_run }}

jobs:
  consume:
    if: >-
      github.repository == 'Rogerhu12/math-research-public' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == 'Rogerhu12/math-research-public'))
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 110
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cached-quarter-centre-Hessian-v2-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate unchanged exact inputs and recover only actual owned prefixes
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$HESSIAN_MANIFEST" --manifest-sha "$HESSIAN_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/cached_quarter_centre_Hessian_v2_ci/
      - name: Parse every new source before mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_cached_quarter_centre_Hessian_v2.py','fourfold_codazzi_cached_quarter_centre_Hessian_CI_v2.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('New cached-quarter Hessian sources passed AST parsing; mathematics has not run.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible input and evidence paths
        id: paths
        run: |
          printf 'particular=%s\n' "$RUNNER_TEMP/visible-exact-cached-Hessian-particular" >> "$GITHUB_OUTPUT"
          printf 'ordinary=%s\n' "$RUNNER_TEMP/visible-exact-cached-Hessian-ordinary" >> "$GITHUB_OUTPUT"
          printf 'split=%s\n' "$RUNNER_TEMP/visible-exact-cached-Hessian-split" >> "$GITHUB_OUTPUT"
          printf 'quarter=%s\n' "$RUNNER_TEMP/visible-exact-cached-Hessian-quarter" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-cached-Hessian-output" >> "$GITHUB_OUTPUT"
      - name: Receive the original complete known trial module norms
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43616252389
          name: visible-exact-particular-cap-Hessian-43616252389-1
          path: ${{ steps.paths.outputs.particular }}
      - name: Receive the original complete physical trial and angular L2 norms
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43618931236
          name: visible-exact-ordinary-only-cap-Hessian-43618931236-1
          path: ${{ steps.paths.outputs.ordinary }}
      - name: Receive the actual complete split source without rerunning it
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43621690619
          name: visible-exact-residual-split-cap-Hessian-43621690619-1
          path: ${{ steps.paths.outputs.split }}
      - name: Receive exact original plan and six completed middle ranges
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43623547711
          pattern: visible-exact-complete-quarter-cap-*-43623547711-*
          merge-multiple: false
          path: ${{ steps.paths.outputs.quarter }}
      - name: Receive the actual successful recovery finish
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: ${{ env.ORIGINAL_QUARTER_RUN }}
          pattern: visible-exact-quarter-inlet-recovery-finish-${{ env.ORIGINAL_QUARTER_RUN }}-*
          merge-multiple: false
          path: ${{ steps.paths.outputs.quarter }}
      - name: Read the precise endpoint-range run from the actual finish process
        id: recovery
        env:
          QUARTER_ARTIFACTS: ${{ steps.paths.outputs.quarter }}
        run: |
          python - <<'PY_RECOVERY'
          import json,os,pathlib
          records=[]
          for path in pathlib.Path(os.environ['QUARTER_ARTIFACTS']).glob('*/process.json'):
              p=json.loads(path.read_text())
              if str(p.get('run_id'))!=os.environ['ORIGINAL_QUARTER_RUN'] or p.get('phase')!='finish':continue
              if (p.get('repository')!='Rogerhu12/math-research-public'
                  or p.get('worker_source_sha256')!='cdaebcd03696c86249dc2cb0798a39fb4e4fabef92259af7ec3fcbe63c12a9e2'
                  or p.get('input_manifest_sha256')!='b141f6d9be92cb86fc06b49933bfb005eb0de383eef5dd8bd91a6c347d8b1263'
                  or not any(c.get('label')=='actual_complete_quarter_cap_finish' and c.get('actual_returncode')==0 for c in p.get('children',[]))):
                  continue
              records.append(p)
          if not records:raise ValueError('an actual complete recovery finish process is required')
          p=max(records,key=lambda x:int(x.get('run_attempt','1')))
          run=str(p['recovered_range_workflow_run'])
          if not run.isdigit():raise ValueError('the actual endpoint-range recovery run must be an integer')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('run='+run+'\n')
          PY_RECOVERY
      - name: Receive the original successful endpoint-range recovery bytes
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: ${{ steps.recovery.outputs.run }}
          pattern: visible-exact-quarter-inlet-recovery-range-*-${{ steps.recovery.outputs.run }}-*
          merge-multiple: false
          path: ${{ steps.paths.outputs.quarter }}
      - name: Consume saved target jets and checkpoint every ten minutes with real pulls
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_quarter_centre_Hessian_CI_v2.py
          --manifest "$HESSIAN_MANIFEST" --manifest-sha "$HESSIAN_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --quarter-run "$ORIGINAL_QUARTER_RUN"
          --particular-artifact "$RUNNER_TEMP/visible-exact-cached-Hessian-particular"
          --ordinary-artifact "$RUNNER_TEMP/visible-exact-cached-Hessian-ordinary"
          --split-artifact "$RUNNER_TEMP/visible-exact-cached-Hessian-split"
          --quarter-artifacts "$RUNNER_TEMP/visible-exact-cached-Hessian-quarter"
          --work "$RUNNER_TEMP/visible-exact-cached-Hessian-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-cached-Hessian-output"
          --compute-minutes 85 --checkpoint-minutes 10
      - name: Require nonempty actual evidence and a small inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          data=(json.dumps(entries,indent=2)+'\n').encode()
          if len(data)>60000:raise RuntimeError('inventory exceeded60000 bytes; preserve native and exact parts')
          (root/'artifact-inventory.json').write_bytes(data)
          print(dict(actual_files=len(files),actual_inventory_bytes=len(data)))
          PY_INVENTORY
      - name: Preserve full native bytes and every true failed prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cached-quarter-centre-Hessian-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
