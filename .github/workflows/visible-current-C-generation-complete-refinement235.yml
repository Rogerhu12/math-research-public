          if [ -f "$RUNNER_TEMP/request235-runtime-env.sh" ]; then source "$RUNNER_TEMP/request235-runtime-env.sh"; fi
          python -u "$VISIBLE_COMPUTATIONS/root_20261116_request235_refinement_necessary.py" readback \
            --request "$VISIBLE_BASE/refinement220-request.json" --request-sha256 "$REQUEST235_CURRENT_INNER_SHA256" \
            --base "$VISIBLE_BASE" --computations "$VISIBLE_COMPUTATIONS"
      - name: Return the complete actual235 source preparation scope independently
        id: repair_scope
        if: always()
        timeout-minutes: 5
        run: |
          if [ -f "$RUNNER_TEMP/request235-runtime-env.sh" ]; then source "$RUNNER_TEMP/request235-runtime-env.sh"; fi
          python -u "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations/root_20261116_request235_actual_source_entry.py" readback \
            --request "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/current-C-complete-generation-refinement235-request.json" --request-sha256 35c1e4230d5ae9b48157d280028cc5f364113a00b2df1041b2193087fe6d4378 \
            --base "$RUNNER_TEMP/visible-current-C-actual202-ten450-closed-geometry205" \
            --computations "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations"
      - name: Return the independent same-C source composition without duplicating geometry bodies
        id: same_C_composition_scalar
        if: always()
        timeout-minutes: 5
        run: |
          source "$RUNNER_TEMP/request235-runtime-env.sh"
          remaining=$(python - <<'PY217READCLOCK'
          import json,os,time
          from pathlib import Path
          value=json.loads((Path(os.environ['VISIBLE_BASE'])/'job-science-deadline.json').read_bytes())
          print(max(0,int(value['namespace_created_unix_seconds']+21600-time.time())))
          PY217READCLOCK
          )
          if [ "$remaining" -le 0 ]; then
            echo '{"event":"request235_composition_readback_unstarted","reason":"original_readback_deadline_exhausted","cleanup_not_authorized":true}'
            exit 2
          fi
          timeout --signal=TERM --kill-after=5s "${remaining}s" python -u "$VISIBLE_COMPUTATIONS/root_20261116_request235_same_C_composition.py" readback \
            --request "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/current-C-complete-generation-refinement235-request.json" --request-sha256 35c1e4230d5ae9b48157d280028cc5f364113a00b2df1041b2193087fe6d4378 \
            --base "$VISIBLE_BASE" --computations "$VISIBLE_COMPUTATIONS"
      - name: Return every actual same-C head metric measurement comparison and pending scope
        id: same_C_scalar
        if: always()
        timeout-minutes: 40
        run: |
          source "$RUNNER_TEMP/request235-runtime-env.sh"
          python -u "$VISIBLE_COMPUTATIONS/root_20261116_request235_same_C_necessary.py" \
            --request "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/current-C-complete-generation-refinement235-request.json" --request-sha256 35c1e4230d5ae9b48157d280028cc5f364113a00b2df1041b2193087fe6d4378 \
            --base "$VISIBLE_BASE" --computations "$VISIBLE_COMPUTATIONS" \
            --prepare-outcome "${{ steps.same_C_prepare.outcome }}" \
            --first-outcome "${{ steps.same_C_first.outcome }}" \
            --successors-outcome "${{ steps.same_C_successors.outcome }}"
      - name: Remove only fully read quiescent original and same-C scopes after all real markers
        if: always()
        env:
          C_READBACK_OUTCOME: ${{ steps.scalar.outcome }}
          CUT_READBACK_OUTCOME: ${{ steps.cut_twojet.outcome }}
          CONSTRUCTION_READBACK_OUTCOME: ${{ steps.construction_readback.outcome }}
          FAR_READBACK_OUTCOME: ${{ steps.far_scalar.outcome }}
          BVP_READBACK_OUTCOME: ${{ steps.bvp_scalar.outcome }}
          RULES_READBACK_OUTCOME: ${{ steps.rules_scalar.outcome }}
          CLOSED_READBACK_OUTCOME: ${{ steps.closed_scalar.outcome }}
          REFINEMENT_READBACK_OUTCOME: ${{ steps.refinement_scalar.outcome }}
          COMPOSITION_READBACK_OUTCOME: ${{ steps.composition_scalar.outcome }}
        run: |
          if [ -f "$RUNNER_TEMP/request235-runtime-env.sh" ]; then source "$RUNNER_TEMP/request235-runtime-env.sh"; fi
          python -u "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations/root_20261116_request235_actual_source_entry.py" guard-cleanup \
            --request "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/current-C-complete-generation-refinement235-request.json" --request-sha256 35c1e4230d5ae9b48157d280028cc5f364113a00b2df1041b2193087fe6d4378 \
            --base "$RUNNER_TEMP/visible-current-C-actual202-ten450-closed-geometry205" --computations "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" \
            --new-composition-outcome "${{ steps.same_C_composition_scalar.outcome }}" \
            --new-readback-outcome "${{ steps.same_C_scalar.outcome }}" \
            -- cleanup \
            --request "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/current-C-complete-generation-refinement235-request.json" --request-sha256 35c1e4230d5ae9b48157d280028cc5f364113a00b2df1041b2193087fe6d4378 \
            --base "$RUNNER_TEMP/visible-current-C-actual202-ten450-closed-geometry205" --computations "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations"
  report:
    name: Repeat exact bounded primary scopes without a scientific calculation
    needs: compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMPUTE_RESULT: ${{ needs.compute.result }}
      BVP_OUTCOME: ${{ needs.compute.outputs.BVP_science_outcome }}
      REFINEMENT_OUTCOME: ${{ needs.compute.outputs.refinement_science_outcome }}
      REFINEMENT_READBACK_OUTCOME: ${{ needs.compute.outputs.refinement_readback_outcome }}
      COMPOSITION_READBACK_OUTCOME: ${{ needs.compute.outputs.composition_readback_outcome }}
      REPAIR_READBACK_OUTCOME: ${{ needs.compute.outputs.repair_readback_outcome }}
      GENERATION_READBACK_OUTCOME: ${{ needs.compute.outputs.generation_readback_outcome }}
      GENERATION_SUMMARY: ${{ needs.compute.outputs.generation_summary }}
      GENERATION_SUMMARY_BYTES: ${{ needs.compute.outputs.generation_summary_bytes }}
      GENERATION_SUMMARY_SHA256: ${{ needs.compute.outputs.generation_summary_sha256 }}
      SAME_C_PREPARE_OUTCOME: ${{ needs.compute.outputs.same_C_prepare_outcome }}
      SAME_C_FIRST_OUTCOME: ${{ needs.compute.outputs.same_C_first_outcome }}
      SAME_C_SUCCESSORS_OUTCOME: ${{ needs.compute.outputs.same_C_successors_outcome }}
      SAME_C_READBACK_OUTCOME: ${{ needs.compute.outputs.same_C_readback_outcome }}
      SAME_C_COMPOSITION_OUTCOME: ${{ needs.compute.outputs.same_C_composition_outcome }}
      SAME_C_SUMMARY_BYTES: ${{ needs.compute.outputs.same_C_summary_bytes }}
      SAME_C_SUMMARY_SHA256: ${{ needs.compute.outputs.same_C_summary_sha256 }}
      REFINEMENT_SUMMARY: ${{ needs.compute.outputs.refinement_summary }}
      REFINEMENT_SUMMARY_BYTES: ${{ needs.compute.outputs.refinement_summary_bytes }}
      REFINEMENT_SUMMARY_SHA256: ${{ needs.compute.outputs.refinement_summary_sha256 }}
      CLOSED_OUTCOME: ${{ needs.compute.outputs.closed_science_outcome }}
      CLOSED_READBACK_OUTCOME: ${{ needs.compute.outputs.closed_readback_outcome }}
      CLOSED_SUMMARY_IDENTITY: ${{ needs.compute.outputs.closed_summary_identity }}
      SCALAR_SUMMARY: ${{ needs.compute.outputs.scalar_summary }}
      SCALAR_SUMMARY_BYTES: ${{ needs.compute.outputs.scalar_summary_bytes }}
      SCALAR_SUMMARY_SHA256: ${{ needs.compute.outputs.scalar_summary_sha256 }}
      CUT_TWOJET_SUMMARY: ${{ needs.compute.outputs.cut_twojet_summary }}
      CUT_TWOJET_SUMMARY_BYTES: ${{ needs.compute.outputs.cut_twojet_summary_bytes }}
      CUT_TWOJET_SUMMARY_SHA256: ${{ needs.compute.outputs.cut_twojet_summary_sha256 }}
      FAR_SUMMARY: ${{ needs.compute.outputs.far_summary }}
      FAR_SUMMARY_BYTES: ${{ needs.compute.outputs.far_summary_bytes }}
      FAR_SUMMARY_SHA256: ${{ needs.compute.outputs.far_summary_sha256 }}
      CONSTRUCTION_SUMMARY: ${{ needs.compute.outputs.construction_summary }}
      CONSTRUCTION_SUMMARY_BYTES: ${{ needs.compute.outputs.construction_summary_bytes }}
      CONSTRUCTION_SUMMARY_SHA256: ${{ needs.compute.outputs.construction_summary_sha256 }}
      BVP_SUMMARY: ${{ needs.compute.outputs.bvp_summary }}
      BVP_SUMMARY_BYTES: ${{ needs.compute.outputs.bvp_summary_bytes }}
      BVP_SUMMARY_SHA256: ${{ needs.compute.outputs.bvp_summary_sha256 }}
    steps:
      - name: Print all five actual primary summaries and preserve original compute outcome
        run: |
          if [ -f "$RUNNER_TEMP/request235-runtime-env.sh" ]; then source "$RUNNER_TEMP/request235-runtime-env.sh"; fi
          python3 - <<'PYREPORT'
          import hashlib,json,os
          names=('scalar_summary','cut_twojet_summary','far_summary','construction_summary','bvp_summary')
          errors=[]
          for name in names:
           key=name.upper();text=os.environ.get(key,'')
           if not text:
            print(json.dumps(dict(event='request205_primary_unavailable',original_kind=name,
             compute_result=os.environ.get('COMPUTE_RESULT'),BVP_outcome=os.environ.get('BVP_OUTCOME'),
             no_native_BVP_or_upstream_success_inferred=True)),flush=True)
            continue
           try:
            expected_size=int(os.environ[key+'_BYTES']);expected_sha=os.environ[key+'_SHA256']
            raw=text.encode()
            if len(raw)!=expected_size or hashlib.sha256(raw).hexdigest()!=expected_sha:raw+=b'\n'
            assert len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected_sha
            assert len(raw)<=90000
            json.loads(raw)
            print('BEGIN_REQUEST205_'+key)
            print(raw.decode(),end='' if raw.endswith(b'\n') else '\n')
            print('END_REQUEST205_'+key)
            print(json.dumps(dict(event='request205_original_primary_identity',kind=name,
             original_bytes=len(raw),original_sha256=expected_sha,
             necessary_selected_scope_only=True,large_omitted_members_not_reconstructed_or_claimed_read_in_chat=True)),flush=True)
           except Exception as error:errors.append(dict(kind=name,error=repr(error)))
          print(json.dumps(dict(event='request205_report_transport_scope',errors=errors,
           compute_result=os.environ.get('COMPUTE_RESULT'),BVP_outcome=os.environ.get('BVP_OUTCOME'),
           report_success_not_a_mathematical_BVP_or_closed_surface_result=True)),flush=True)
          print(json.dumps(dict(event='request205_closed_postsolve_report_scope',
           science_outcome=os.environ.get('CLOSED_OUTCOME'),
           readback_outcome=os.environ.get('CLOSED_READBACK_OUTCOME'),
           necessary_summary_identity=json.loads(os.environ['CLOSED_SUMMARY_IDENTITY']) if os.environ.get('CLOSED_SUMMARY_IDENTITY') else None,
           complete_new_geometry_held_and_resource_bodies_are_in_compute_log=True,
           no_mathematical_success_inferred_from_job_status=True)),flush=True)
          if errors or os.environ.get('COMPUTE_RESULT')!='success':raise SystemExit(2)
          PYREPORT

      - name: Repeat the one exact complete source-generation necessary scope
        if: always()
        run: |
          python3 - <<'PY235GENREPORT'
          import hashlib,json,os
          text=os.environ.get('GENERATION_SUMMARY','')
          if not text:
           print(json.dumps(dict(event='request235_generation_scope_unavailable',
            actual_outcome=os.environ.get('GENERATION_READBACK_OUTCOME'),
            source_generation_or_cleanup_not_inferred=True)),flush=True)
           raise SystemExit(2)
          raw=text.encode();size=int(os.environ['GENERATION_SUMMARY_BYTES']);expected=os.environ['GENERATION_SUMMARY_SHA256']
          if len(raw)!=size or hashlib.sha256(raw).hexdigest()!=expected:raw+=b'\n'
          assert len(raw)==size and hashlib.sha256(raw).hexdigest()==expected and len(raw)<=90000
          value=json.loads(raw)
          print('BEGIN_REQUEST235_COMPLETE_SOURCE_GENERATION_NECESSARY')
          print(raw.decode(),end='')
          print('END_REQUEST235_COMPLETE_SOURCE_GENERATION_NECESSARY')
          print(json.dumps(dict(event='request235_generation_scope_repeat_identity',
           bytes=len(raw),sha256=expected,source_generation_completed=value.get('source_generation_completed'),
           complete_necessary_readback=value.get('complete_necessary_readback'),
           mathematical_success_or_process_quiet_not_inferred=True)),flush=True)
          if value.get('complete_necessary_readback') is not True:raise SystemExit(2)
          PY235GENREPORT

      - name: Repeat only the single exact necessary refinement-chain body
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/request235-runtime-env.sh" ]; then source "$RUNNER_TEMP/request235-runtime-env.sh"; fi
          python - <<'PY220REPORT'
          import hashlib,json,os
          text=os.environ.get('REFINEMENT_SUMMARY','')
          if not text:
           print(json.dumps(dict(event='request235_primary_unavailable',science_outcome=os.environ.get('REFINEMENT_OUTCOME'),
            readback_outcome=os.environ.get('REFINEMENT_READBACK_OUTCOME'),no_math_result_inferred=True)),flush=True)
           raise SystemExit(2)
          raw=text.encode();expected=int(os.environ['REFINEMENT_SUMMARY_BYTES']);sha=os.environ['REFINEMENT_SUMMARY_SHA256']
          if len(raw)!=expected or hashlib.sha256(raw).hexdigest()!=sha:raw+=b'\n'
          assert len(raw)==expected and hashlib.sha256(raw).hexdigest()==sha and len(raw)<=90000
          value=json.loads(raw)
          print('BEGIN_REQUEST235_REFINEMENT_NECESSARY');print(raw.decode(),end='');print('END_REQUEST235_REFINEMENT_NECESSARY')
          print(json.dumps(dict(event='request235_repeat_identity',bytes=len(raw),sha256=sha,
           complete_necessary_readback=value.get('complete_necessary_readback'),science_outcome=os.environ.get('REFINEMENT_OUTCOME'),
           composition_readback_outcome=os.environ.get('COMPOSITION_READBACK_OUTCOME'),full_composition_body_only_in_compute_log=True,
           original_compute_result=os.environ.get('COMPUTE_RESULT'),job_green_not_a_scientific_completion=True)),flush=True)
          if value.get('complete_necessary_readback') is not True:raise SystemExit(2)
          PY220REPORT

      - name: Report only same-C necessary identities and actual outcomes
        if: always()
        run: |
          python - <<'PY217REPORT'
          import json,os
          names=('PREPARE','FIRST','SUCCESSORS','READBACK','COMPOSITION')
          identity=None
          if os.environ.get('SAME_C_SUMMARY_BYTES') and os.environ.get('SAME_C_SUMMARY_SHA256'):
           identity=dict(bytes=int(os.environ['SAME_C_SUMMARY_BYTES']),sha256=os.environ['SAME_C_SUMMARY_SHA256'])
          print(json.dumps(dict(event='request235_same_C_necessary_report_identity',
           actual_outcomes={name.lower():os.environ.get('SAME_C_'+name+'_OUTCOME') for name in names},
           repair_scope_outcome=os.environ.get('REPAIR_READBACK_OUTCOME'),
           necessary_summary=identity,original_compute_result=os.environ.get('COMPUTE_RESULT'),
           all_new_semantic_bodies_and_exact_pending_scopes_are_only_in_compute_log=True,
           report_status_does_not_imply_an_accepted_field_or_error_decrease=True)),flush=True)
          PY217REPORT
