name: visible-exact exact whole-piece domain comparison

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-dominant-outer-piece-domain-comparison.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-dominant-outer-piece-domain-comparison
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-dominant-outer-piece-domain-comparison-CI-inputs.json
  PHASE_MANIFEST_SHA: 9c5aac3369fa328284d08f1daf5a40f1230cdbb3fd1d70afcde5b9ef21d4cdf3
  PHASE_PIPELINE_SHA: 43abdfca9fdb16ebaae6a50349e3faaab87b8def87e1a233e7e44aca18ad6017
  PHASE_WORKER_SHA: e5b067144a3ef2b6e858de06d3cd8ed3df3aba0c563a8d8228c31ea418c2f3fe
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-reviewed-public-CI-rules-reproducible-data.json
  REVIEWED_RULES_SHA: f2661bd5cf5cb006c1f78c64126b3ac065e6bc26a50790545ac443efb5e372bd

jobs:
  exact-whole-piece-domains:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_dominant_outer_piece_domain_comparison_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-dominant-outer-piece-domain-comparison-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-reviewed-public-CI-rules-reproducible-data.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_dominant_outer_piece_domain_comparison_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_dominant_outer_piece_domain_comparison_public_worker.py --mode hydrate
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the pinned stdlib consumer without running the domain comparison
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_dominant_outer_piece_domain_comparison.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Compare complete original piece domains and publish only the actual conclusion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_dominant_outer_piece_domain_comparison_public_worker.py --mode run
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-dominant-whole-piece-science"
          --prepared "$RUNNER_TEMP/visible-exact-dominant-whole-piece-original"
          --out-dir "$RUNNER_TEMP/visible-exact-dominant-whole-piece-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
