name: ISP R150 exact continuation and polynomial projection
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isp-exact-continuation-temporary-789f
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/invariant-subspace-problem/README.md
            /topics/invariant-subspace-problem/HANDOFF.md
            /topics/invariant-subspace-problem/notes/2026-11-15-r150-exact-continuation-session-789f.py
            /topics/invariant-subspace-problem/notes/2026-11-15-r150-exact-continuation-session-request-789f.json
          persist-credentials: false
      - name: Install exact rational arithmetic
        run: python -m pip install --quiet python-flint==0.9.0
      - name: Compute original kernels with temporary checkpoints and periodic rule checks
        run: python topics/invariant-subspace-problem/notes/2026-11-15-r150-exact-continuation-session-789f.py
