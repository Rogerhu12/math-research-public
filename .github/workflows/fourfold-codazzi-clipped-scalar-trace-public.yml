name: R133 complete clipped scalar trace candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-clipped-scalar-trace-public.yml

permissions:
  contents: write

concurrency:
  group: r133-wctr-complete-clipped-scalar-trace-v1
  cancel-in-progress: false

jobs:
  complete-current-candidate:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout the complete frozen entry and rule files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_paired_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-16-R133-clipped-scalar-trace-current-inputs.json
      - name: Install the fixed directed runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the admitted python-flint version
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Restore, independently admit, reserve and run the one new candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_paired_public_worker.py \
            --repo "$GITHUB_WORKSPACE" \
            --manifest topics/visible-flex-exact-nearby/notes/2026-11-16-R133-clipped-scalar-trace-current-inputs.json \
            --manifest-sha acf4f84aca6a15f7e50640665448cf1b864ec9cd7918772ff9c38eb426406c02
