name: visible-larger runtime recovery

on:
  push:
    branches: ['agent-visible-larger-recovery-20261112-third']
    paths:
      - '.github/workflows/visible-larger-runtime-recovery.yml'
      - 'topics/visible-flex-larger-amplitude/computations/ci-recovery-request.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: visible-larger-source-sync
      cancel-in-progress: false
    outputs:
      strong: ${{ steps.lanes.outputs.strong }}
      interval: ${{ steps.lanes.outputs.interval }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Check out this topic and the frozen recovery source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            topics/visible-flex-larger-amplitude
            .github/workflows
          persist-credentials: false
      - name: Read the requested independent lanes
        id: lanes
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('topics/visible-flex-larger-amplitude/computations/ci-recovery-request.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for lane in ('strong','interval'):
                  f.write(lane+'='+str(lane in r['enabled_lanes']).lower()+'\n')
          PY
      - name: Run the recorded recovery with real pull and normal git push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile topics/visible-flex-larger-amplitude/computations/ci_recover_visible_larger_v2.py
          python -u topics/visible-flex-larger-amplitude/computations/ci_recover_visible_larger_v2.py --repo "$GITHUB_WORKSPACE" --request topics/visible-flex-larger-amplitude/computations/ci-recovery-request.json --lane sync
      - name: Preserve complete outputs and actual failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-larger-recovery-${{ github.run_id }}-${{ github.run_attempt }}-sync
          path: |
            topics/visible-flex-larger-amplitude/notes/ci-recovery-${{ github.run_id }}-${{ github.run_attempt }}-sync/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn

  strong:
    needs: sync
    if: needs.sync.outputs.strong == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: visible-larger-strong-compute
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Check out this topic and the frozen recovery source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            topics/visible-flex-larger-amplitude
            .github/workflows
          persist-credentials: false
      - name: Use the recorded Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Use the recorded Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install the recorded arithmetic packages
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
      - name: Run the recorded recovery with real pull and normal git push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile topics/visible-flex-larger-amplitude/computations/ci_recover_visible_larger_v2.py
          python -u topics/visible-flex-larger-amplitude/computations/ci_recover_visible_larger_v2.py --repo "$GITHUB_WORKSPACE" --request topics/visible-flex-larger-amplitude/computations/ci-recovery-request.json --lane strong
      - name: Preserve complete outputs and actual failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-larger-recovery-${{ github.run_id }}-${{ github.run_attempt }}-strong
          path: |
            topics/visible-flex-larger-amplitude/notes/ci-recovery-${{ github.run_id }}-${{ github.run_attempt }}-strong/
            topics/visible-flex-larger-amplitude/notes/2026-11-12-strong-actual-q096-ci-actions-43302113873-1-strong*
            topics/visible-flex-larger-amplitude/notes/2026-11-12-strong-artifact-restored-${{ github.run_id }}-${{ github.run_attempt }}-strong*
            topics/visible-flex-larger-amplitude/notes/2026-11-12-strong-q096-postaccept-actions-${{ github.run_id }}-${{ github.run_attempt }}-strong*
            topics/visible-flex-larger-amplitude/notes/2026-11-12-strong-q096-sameg-m28-actions-${{ github.run_id }}-${{ github.run_attempt }}-strong*
            topics/visible-flex-larger-amplitude/notes/ci-recovery-43302113873-1-strong/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn

  interval:
    needs: sync
    if: needs.sync.outputs.interval == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: visible-larger-interval-compute
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Check out this topic and the frozen recovery source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            topics/visible-flex-larger-amplitude
            .github/workflows
          persist-credentials: false
      - name: Use the recorded Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Use the recorded Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install the recorded arithmetic packages
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
      - name: Run the recorded recovery with real pull and normal git push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile topics/visible-flex-larger-amplitude/computations/ci_recover_visible_larger_v2.py
          python -u topics/visible-flex-larger-amplitude/computations/ci_recover_visible_larger_v2.py --repo "$GITHUB_WORKSPACE" --request topics/visible-flex-larger-amplitude/computations/ci-recovery-request.json --lane interval
      - name: Preserve complete outputs and actual failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-larger-recovery-${{ github.run_id }}-${{ github.run_attempt }}-interval
          path: |
            topics/visible-flex-larger-amplitude/notes/ci-recovery-${{ github.run_id }}-${{ github.run_attempt }}-interval/
            topics/visible-flex-larger-amplitude/notes/2026-11-12-closure-physical-green-actions-${{ github.run_id }}-${{ github.run_attempt }}-interval*
            topics/visible-flex-larger-amplitude/notes/2026-11-12-closure-middle-m94m96-actions-${{ github.run_id }}-${{ github.run_attempt }}-interval*
            topics/visible-flex-larger-amplitude/notes/2026-11-12-closure-physical-green-budget-actions-${{ github.run_id }}-${{ github.run_attempt }}-interval*
            topics/visible-flex-larger-amplitude/notes/2026-11-12-tail-carrier-*-actions-${{ github.run_id }}-${{ github.run_attempt }}-interval*
            topics/visible-flex-larger-amplitude/notes/2026-11-12-root-linear-centre-actions-${{ github.run_id }}-${{ github.run_attempt }}-interval*
            topics/visible-flex-larger-amplitude/notes/2026-11-12-root-linear-centre-cut-actions-${{ github.run_id }}-${{ github.run_attempt }}-interval*
            topics/visible-flex-larger-amplitude/notes/2026-11-12-tail-subdivision-binding-actions-${{ github.run_id }}-${{ github.run_attempt }}-interval*
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
