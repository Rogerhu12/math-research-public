         normal_calls_are_additional_science=True,temporary_normal_points_never_adopted_without_original_Armijo=True,
         all_ten_coordinates_permitted_in_actual_direction=True,
         complete_original_fixed112_terminal_and699_chain=True,
         persistent_owner_dimension=10,planned_complete_ten_forward_and_all120_original_FD_checks=True,
         original_full3_merit_and_exact_binary64_lift_Armijo=True,
         complete_QR_and_Cauchy_proposals_not_rank_or_accuracy_gate=True,
         scalar_Arb_and453circle_final_checks_at_explicit_binary64_projection=True,
         projection_never_replaces_Decimal_owner=True,native_or_nonzero_field_completion_not_claimed=True,
         scientific_source_sha256=request['source_sha256'][request['scientific_entry']])),flush=True)
        sys.argv=[runner.__file__,'--out',str(out/'rule-sync'),'--command',*argv]
        raise SystemExit(runner.main())
        PYRUN
    - name: Read actual independent-family status or honest partial; never rerun science
      id: chain
      if: always()
      run: |
        python "$VISIBLE_COMPUTATIONS/geometry_20261116_actual201_ten_predictor_normal_resume_temporary.py" \
          --report-only \
          --out "$VISIBLE_OUT/actual201-ten-predictor-normal-resume-temporary" \
          --rules-directory "$VISIBLE_OUT/rule-sync" \
          --compute-outcome "${{ steps.science.outcome }}"
    - name: Preserve necessary original child errors and complete log identity
      id: child_errors
      if: always()
      run: |
        python - <<'PYERRORS'
        import hashlib,json,os
        from pathlib import Path
        root=Path(os.environ['VISIBLE_OUT'])/'actual201-ten-predictor-normal-resume-temporary'
        chain=root/'run-metadata.json'
        value=json.loads(chain.read_bytes()) if chain.is_file() else {}
        names=['producer-stderr.txt','reader-stderr.txt'];complete=True;records=[]
        for name in ('producer-stdout.txt','reader-stdout.txt'):
         path=root/name
         if path.is_file():
          h=hashlib.sha256()
          with path.open('rb') as stream:
           for block in iter(lambda:stream.read(1<<20),b''):h.update(block)
          print(json.dumps(dict(event='request202-stdout-identity-not-array-transport',
           file=name,bytes=path.stat().st_size,sha256=h.hexdigest(),
           complete_scientific_stdout_not_transported=True,
           necessary_scientific_summary_is_the_single_report=True)),flush=True)
        for name in names:
         path=root/name
         if not path.is_file():continue
         raw=path.read_bytes();whole=hashlib.sha256(raw).hexdigest()
         item=dict(event='request202-original-child-error-text',file=name,
          bytes=len(raw),sha256=whole,no_scientific_evaluation=True,
          full_original_text_returned=len(raw)<=12000,
          no_data_parts_or_encoded_raw_reconstruction=True)
         if len(raw)<=12000:
          item['original_text']=raw.decode('utf-8','surrogateescape')
         else:
          complete=False
          item.update(original_first6000_bytes_text=raw[:6000].decode('utf-8','surrogateescape'),
           original_last6000_bytes_text=raw[-6000:].decode('utf-8','surrogateescape'),
           omitted_middle_bytes=len(raw)-12000,
           necessary_error_transport_partial=True,
           proactive_cleanup_ineligible=True)
         print(json.dumps(item,sort_keys=True,separators=(',',':'),ensure_ascii=True),flush=True)
         records.append({key:value for key,value in item.items() if not key.endswith('_text') and key!='original_text'})
        if root.is_dir():
         (root/'necessary-error-readback.json').write_text(json.dumps(dict(
          schema='request202-necessary-original-error-readback-v1',
          complete=complete,records=records,
          original_large_stdout_only_identified=True),sort_keys=True)+'\n')
        raise SystemExit(0 if complete else 70)
        PYERRORS
    - name: Clean owned payloads only after necessary readback, errors and child quiescence
      if: always()
      env:
        NECESSARY_SUMMARY_OUTCOME: ${{ steps.chain.outcome }}
        NECESSARY_ERRORS_OUTCOME: ${{ steps.child_errors.outcome }}
      run: |
        python - <<'PYCLEAN'
        import hashlib,json,os,shutil,stat
        from pathlib import Path
        runner=Path(os.environ['RUNNER_TEMP']).resolve();base=Path(os.environ['VISIBLE_OUT'])
        targets=[base/'actual201-ten-predictor-normal-resume-temporary',base/'original-inputs',runner/'actual201-ten-predictor-normal-resume-original-source']
        owner=targets[0];eligible=False;reason=None
        try:
         assert os.environ.get('NECESSARY_SUMMARY_OUTCOME')=='success'
         assert os.environ.get('NECESSARY_ERRORS_OUTCOME')=='success'
         assert json.loads((owner/'necessary-error-readback.json').read_bytes())['complete'] is True
         proof=json.loads((owner/'report-summary-receipt.json').read_bytes())
         quiescent=json.loads((owner/'owner-quiescent.json').read_bytes())
         reader=json.loads((owner/'readback'/'compact-summary-receipt.json').read_bytes())
         raw=(owner/'report-summary.json').read_bytes()
         compact=(owner/'readback'/'compact-summary.json').read_bytes()
         for record in (proof,quiescent):
          assert record['run_id']==os.environ['GITHUB_RUN_ID']
          assert record['source_commit']==os.environ['GITHUB_SHA']
         current=Path(os.environ['VISIBLE_COMPUTATIONS'])/'geometry_20261116_actual201_ten_predictor_normal_resume_temporary.py'
         current_sha=hashlib.sha256(current.read_bytes()).hexdigest()
         assert proof['wrapper_source']['sha256']==quiescent['wrapper_source']['sha256']==current_sha
         assert proof['necessary_summary_complete'] is True and proof['owner_quiescent'] is True
         assert quiescent['all_wrapper_launched_children_waited_and_reaped'] is True
         assert quiescent['launched_child_pids']==quiescent['reaped_child_pids']
         assert reader['metadata_complete'] is True
         assert len(compact)==reader['bytes'] and hashlib.sha256(compact).hexdigest()==reader['sha256']
         assert len(raw)==proof['bytes']<=90000 and hashlib.sha256(raw).hexdigest()==proof['sha256']
         assert json.loads(raw)['schema']=='request202-persistent-ten-full3-normal-necessary-readback-v1'
         eligible=True
        except (OSError,ValueError,KeyError,TypeError,AssertionError) as error:
         reason=repr(error)
        if not eligible:
         print(json.dumps(dict(event='request202-temporary-payloads-not-explicitly-deleted',
          necessary_summary_and_owner_quiescence_not_both_verified=True,
          actual_metadata_error=reason,only_current_ephemeral_runner_storage=True,
          no_artifact_Release_or_Git_upload=True,scientific_acceptance_not_inferred=True)),flush=True)
         raise SystemExit(0)
        removed=[]
        def own_tree_writable(path):
         if path.is_symlink():raise ValueError('Do not follow a cleanup symlink')
         for parent,dirs,files in os.walk(path,topdown=True,followlinks=False):
          p=Path(parent);s=p.lstat()
          if s.st_uid!=os.getuid():raise PermissionError('Cleanup only request-owned trees')
          os.chmod(p,stat.S_IMODE(s.st_mode)|stat.S_IWUSR|stat.S_IXUSR)
          for name in dirs+files:
           child=p/name;s=child.lstat()
           if stat.S_ISLNK(s.st_mode):continue
           if s.st_uid!=os.getuid():raise PermissionError('Cleanup only request-owned entries')
           os.chmod(child,stat.S_IMODE(s.st_mode)|stat.S_IWUSR|(stat.S_IXUSR if stat.S_ISDIR(s.st_mode) else 0))
        for target in targets:
         if target.is_symlink():raise ValueError('Do not follow a cleanup symlink')
         target.resolve().relative_to(runner)
         if target.is_dir():
          own_tree_writable(target);shutil.rmtree(target);removed.append(str(target.relative_to(runner)))
        print(json.dumps(dict(event='request202_temporary_scientific_payloads_removed',relative_directories=removed,compact_original_readback_and_errors_precede_cleanup=True,necessary_summary_and_owned_process_quiescence_verified=True,readout_success_not_inferred_from_cleanup=True,raw_artifact_or_Release_upload=False)),flush=True)
        PYCLEAN
  report:
    name: One complete128-plan conclusion, all alpha normal counts and original final gates
    needs:
    - compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
    - name: Print one compact original scientific conclusion and exact output SHA
      env:
        COMPACT_SUMMARY: ${{ needs.compute.outputs.compact_summary }}
        COMPACT_SUMMARY_BYTES: ${{ needs.compute.outputs.compact_summary_bytes }}
        COMPACT_SUMMARY_SHA256: ${{ needs.compute.outputs.compact_summary_sha256 }}
        COMPUTE_RESULT: ${{ needs.compute.result }}
      run: |
        python3 - <<'PYREPORT'
        import hashlib,json,os
        text=os.environ.get('COMPACT_SUMMARY','')
        if not text:
         payload=dict(schema='request202-compute-output-unavailable-v1',compute_job_result=os.environ.get('COMPUTE_RESULT'),run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],scientific_completion_not_claimed=True)
         raw=json.dumps(payload,sort_keys=True,separators=(',',':')).encode()
        else:
         raw=text.encode('utf-8')
         if len(raw)>90000:raise ValueError('Compute job output exceeded the explicit small summary bound')
         if len(raw)!=int(os.environ['COMPACT_SUMMARY_BYTES']) or hashlib.sha256(raw).hexdigest()!=os.environ['COMPACT_SUMMARY_SHA256']:
          raise ValueError('The original compute-to-report compact JSON output identity changed')
         json.loads(raw)
        print('BEGIN_VISIBLE202_COMPACT_SUMMARY')
        print(raw.decode('utf-8'))
        print('END_VISIBLE202_COMPACT_SUMMARY')
        print(json.dumps(dict(event='request202-report-summary-identity',bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),hash_scope='UTF-8 JSON string excluding log separator LF',compute_job_result=os.environ.get('COMPUTE_RESULT'),run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'])),flush=True)
        PYREPORT
