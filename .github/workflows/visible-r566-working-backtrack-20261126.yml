name: visible-flex actual-state working-feasible backtracking
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r566-working-backtrack-20261126.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r566-rounded-core-B030-working-rows
  cancel-in-progress: false
jobs:
  research:
    name: Backtrack actual B030 trial then qualify every physical constraint
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r566-working-backtrack-20261126.json
            /topics/visible-flex-new-mechanism/scripts/inverse_flat_oscillatory_tail_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_hard_exchange_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_hard_exchange_resume_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_r566_angular_oracle_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_r566_block_jacobian_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_r566_theta_peak_exchange_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_r566_theta_peak_resume_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_r566_theta_peak_batched_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_r566_theta_peak_checkpoint_20261126.py
            /topics/visible-flex-new-mechanism/scripts/run_inverse_state_stdin_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_r566_theta_peak_radial1025_20261126.py
            /topics/visible-flex-new-mechanism/scripts/inverse_r566_theta_peak_paid_resume_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r566_working_rows_full_acceptance_20261126.py
            /.github/workflows/visible-r566-working-rows-20261126.yml
            /topics/visible-flex-new-mechanism/computations/request-r566-working-rows-20261126.json
            /topics/visible-flex-new-mechanism/scripts/r566_working_rows_backtrack_20261126.py
            /.github/workflows/visible-r566-working-backtrack-20261126.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull both rule sets and apply the new feasible backtracking
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_state_stdin_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r566-working-backtrack-20261126.json
          --lane rounded-core-B030-working-backtrack
      # Original exact operators, full required libraries and fine gates retained.
      # Old direction/restriction observations are paid provenance, never rerun.
      # Actual accepted states and all costs are stdout only; no raw artifacts.
