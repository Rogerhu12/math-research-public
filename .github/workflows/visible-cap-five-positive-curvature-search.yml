name: visible-flex new five-condition positive curvature cap search
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-cap-five-positive-curvature-search.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visible-flex-cap-five-positive-curvature-search
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-cap-five-positive-curvature-search.yml
            /topics/visible-flex-new-mechanism/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install the pinned numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Pull rules and search the new actual positive curvature cap family
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path.cwd();topic='topics/visible-flex-new-mechanism'
          request_path=topic+'/computations/request-cap-five-positive-curvature-search.json'
          reader_path=topic+'/scripts/read_original_actions_log.py'
          entry_path=topic+'/scripts/literature_cap5_positive_curvature_search.py'
          raw_request=Path(request_path).read_bytes()
          request=json.loads(raw_request)
          source=os.environ['GITHUB_SHA']
          sys.path.insert(0,str((root/topic/'scripts').resolve()))
          import read_original_actions_log as reader
          reader.require(
              hashlib.sha256(Path(reader.__file__).read_bytes()).hexdigest()
              ==request['source_sha256'][reader_path],
              'rule reader source changed')
          def emit(tag,value):
              print(tag+' '+reader.encoded(value).decode('utf-8'),flush=True)
          public=reader.actual_pull(root,request,source)
          emit('CAP5_PUBLIC_PULL',public)
          reader.require(public['passed'],
              'public README changed or actual pull failed; apply its diff first')
          private={}
          try:
              reader.private_rule_pull(request,private)
          finally:
              os.environ.pop('MR_TOKEN',None)
              emit('CAP5_PRIVATE_PULL',private)
          reader.git_ok(root,['checkout','--detach',source])
          reader.require(Path(request_path).read_bytes()==raw_request,
              'detached source request differs from its bound input')
          reader.require(topic+'/'+request['entry_point']==entry_path,
              'one actual cap family entry required')
          for path,expected in request['source_sha256'].items():
              reader.require(
                  hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected,
                  'requested source changed: '+path)
          reader.require('MR_TOKEN' not in os.environ,
              'private credential must not enter science')
          out=Path(os.environ['RUNNER_TEMP'])/'visible-cap-five-positive-curvature'/'cap-five-positive-curvature-result.json'
          result=subprocess.run([
              sys.executable,entry_path,'--request',request_path,'--out',str(out)])
          raise SystemExit(result.returncode)
          PY
      # One new actual positive-curvature family; all five original conditions.
      # The shared 120-second clock includes imports, failures and final output.
      # No old psi3 E/self/rank replay, developer gate, artifact or data upload.
