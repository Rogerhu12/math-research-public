name: Serre exact scalar Cartier window

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R698-public-window-request.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/*.py
            /topics/serre-uniformity/notes/R698-public-window-request.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned finite-field arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compute exact scalar coefficients above sealed interval
        continue-on-error: true
        timeout-minutes: 315
        run: python topics/serre-uniformity/scripts/R698_public_window.py compute --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-cartier-R698-window-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-cartier/R698-window-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: warn
      - name: Publish finite-window receipts and gzip originals
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R698_public_window.py publish --shard ${{ matrix.shard }}
      - name: Require every assigned prime to be computed
        if: always()
        run: python topics/serre-uniformity/scripts/R698_public_window.py verify --shard ${{ matrix.shard }}
