name: visible-exact strict scaled mixed complete

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-strict-scaled-mixed-complete.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-strict-scaled-mixed-complete
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  EXPECTED_WORKER_SHA: 'cc8111c1c422708ffb3dfbfd132e8efe3bb7c91e7f5b793d4a3908e5caa78994'
  EXPECTED_MANIFEST_SHA: 'b9add6767c3773d05cfcbe96b8cf2287c2229c012faa6f8a19cbebdbf243aed2'

jobs:
  one-new-target:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Partially check out the frozen operational inputs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_strict_scaled_mixed_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-16-R133-strict-scaled-mixed-complete-current-inputs.json
      - name: Set up the directed runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the one directed dependency
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Verify the complete worker and manifest before execution
        run: |
          python - <<'PY_FROZEN'
          import ast, hashlib, os
          from pathlib import Path
          for relative, name in [
              ("topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_strict_scaled_mixed_public_worker.py", "EXPECTED_WORKER_SHA"),
              ("topics/visible-flex-exact-nearby/notes/2026-11-16-R133-strict-scaled-mixed-complete-current-inputs.json", "EXPECTED_MANIFEST_SHA"),
          ]:
              raw = Path(relative).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[name]:
                  raise RuntimeError("frozen input changed: " + relative)
              raw.decode("utf-8")
              if relative.endswith(".py"):
                  ast.parse(raw.decode("utf-8"), filename=relative)
          print("Complete frozen operational inputs verified; no scientific function called.")
          PY_FROZEN
      - name: Read twelve complete originals and run three new complete mixed graphs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_strict_scaled_mixed_public_worker.py \
            --repo "$GITHUB_WORKSPACE" \
            --manifest topics/visible-flex-exact-nearby/notes/2026-11-16-R133-strict-scaled-mixed-complete-current-inputs.json \
            --manifest-sha "$EXPECTED_MANIFEST_SHA"
