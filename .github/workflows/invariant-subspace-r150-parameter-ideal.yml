name: ISP R150 exact parameter ideal

on:
  push:
    branches: [main]
    paths:
      - topics/invariant-subspace-problem/notes/2026-11-14-r150-ci-request-789f.json
  workflow_dispatch:
    inputs:
      characteristic:
        description: Exact characteristic zero, discovery prime, or both
        type: choice
        default: both
        options: [both, '0', '32003']
      coordinates:
        description: Original moments or the exact inverse-binomial coordinates
        type: choice
        default: original
        options: [original, translated]
      algorithm:
        description: Singular standard basis method
        type: choice
        default: slimgb
        options: [slimgb, std]

permissions:
  contents: write

concurrency:
  group: isp-r150-parameter-ideal-${{ github.event_name }}-${{ inputs.coordinates }}-${{ inputs.characteristic }}
  cancel-in-progress: false

jobs:
  select-input:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      characteristics: ${{ steps.select.outputs.characteristics }}
      coordinates: ${{ steps.select.outputs.coordinates }}
      algorithm: ${{ steps.select.outputs.algorithm }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: topics/invariant-subspace-problem/notes/2026-11-14-r150-ci-request-789f.json
      - name: Select the explicitly requested branch
        id: select
        env:
          ISP_REQUEST_CHARACTERISTIC: ${{ inputs.characteristic }}
          ISP_REQUEST_COORDINATES: ${{ inputs.coordinates }}
          ISP_REQUEST_ALGORITHM: ${{ inputs.algorithm }}
        run: |
          python - <<'PYSELECT'
          import json,os
          from pathlib import Path
          if os.environ['GITHUB_EVENT_NAME']=='push':
              request=json.loads(Path('topics/invariant-subspace-problem/notes/2026-11-14-r150-ci-request-789f.json').read_text())
          else:
              request={k:os.environ['ISP_REQUEST_'+k.upper()] for k in ['characteristic','coordinates','algorithm']}
          characteristic=str(request['characteristic'])
          coordinates=request['coordinates'];algorithm=request['algorithm']
          if characteristic not in ['0','32003','both'] or coordinates not in ['original','translated'] or algorithm not in ['slimgb','std']:
              raise SystemExit('Unsupported computation request')
          selected=[0,32003] if characteristic=='both' else [int(characteristic)]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('characteristics='+json.dumps(selected,separators=(',',':'))+'\n')
              out.write('coordinates='+coordinates+'\nalgorithm='+algorithm+'\n')
          print(json.dumps({'characteristics':selected,'coordinates':coordinates,'algorithm':algorithm}))
          PYSELECT
  parameter-ideal:
    needs: select-input
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        characteristic: ${{ fromJSON(needs.select-input.outputs.characteristics) }}
    env:
      ISP_CHARACTERISTIC: ${{ matrix.characteristic }}
      ISP_COORDINATES: ${{ needs.select-input.outputs.coordinates }}
      ISP_ALGORITHM: ${{ needs.select-input.outputs.algorithm }}
      ISP_SINGULAR_MEMORY_MIB: '12288' 
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            topics/invariant-subspace-problem
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare exact computation and rule fingerprints
        run: |
          mkdir -p "$RUNNER_TEMP/isp-r150-$ISP_CHARACTERISTIC"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/('isp-r150-'+os.environ['ISP_CHARACTERISTIC'])
          rules={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in ['README.md','topics/invariant-subspace-problem/README.md']}
          (out/'source.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'rules':rules,'characteristic':int(os.environ['ISP_CHARACTERISTIC']),'coordinates':os.environ['ISP_COORDINATES'],'algorithm':os.environ['ISP_ALGORITHM'],'singular_memory_limit_mib':int(os.environ['ISP_SINGULAR_MEMORY_MIB']),'scope':'Characteristic zero requires all original lift identities and actual denominators; finite characteristic is discovery only.'},indent=2)+'\n')
          PY
      - name: Install Singular in this repository's runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends singular
          Singular --version > "$RUNNER_TEMP/isp-r150-$ISP_CHARACTERISTIC/singular-version.txt" 2>&1
      - name: Preserve reconstructed input before the expensive computation
        run: |
          set -o pipefail
          node topics/invariant-subspace-problem/notes/2026-11-14-rank-one-parameter-ideal-runner-789f.js \
            --out "$RUNNER_TEMP/isp-r150-$ISP_CHARACTERISTIC" \
            --characteristic "$ISP_CHARACTERISTIC" --coordinates "$ISP_COORDINATES" \
            --algorithm "$ISP_ALGORITHM" --stage lift --generate-only \
            2>&1 | tee "$RUNNER_TEMP/isp-r150-$ISP_CHARACTERISTIC/preflight.log"
      - uses: actions/upload-artifact@v4
        with:
          name: isp-r150-input-${{ github.run_id }}-${{ github.run_attempt }}-char${{ matrix.characteristic }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/isp-r150-${{ matrix.characteristic }}
      - name: Compute original seventeen-equation membership certificate
        id: exact
        continue-on-error: true
        timeout-minutes: 330
        run: |
          set -o pipefail
          node topics/invariant-subspace-problem/notes/2026-11-14-rank-one-parameter-ideal-runner-789f.js \
            --out "$RUNNER_TEMP/isp-r150-$ISP_CHARACTERISTIC" \
            --characteristic "$ISP_CHARACTERISTIC" --coordinates "$ISP_COORDINATES" \
            --algorithm "$ISP_ALGORITHM" --stage lift \
            2>&1 | tee "$RUNNER_TEMP/isp-r150-$ISP_CHARACTERISTIC/execution.log"
      - name: Preserve outcome and bounded reproducible artifacts
        if: always()
        env:
          ISP_STEP_OUTCOME: ${{ steps.exact.outcome }}
        run: |
          python - <<'PY'
          import gzip,hashlib,json,os,shutil
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/('isp-r150-'+os.environ['ISP_CHARACTERISTIC'])
          out.mkdir(parents=True,exist_ok=True)
          rp=out/'receipt.json'
          receipt=json.loads(rp.read_text()) if rp.exists() else {}
          for label,raw in receipt.get('workingFiles',{}).items():
              p=Path(raw)
              if p.is_file() and p.stat().st_size and not any(out.glob(label+'.sing*')):
                  shutil.copyfile(p,out/('partial-'+label+'.sing'))
          records=[]
          for p in sorted(out.iterdir()):
              if not p.is_file():continue
              raw=p.read_bytes()
              item={'name':p.name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
              if len(raw)>1000000 and p.suffix!='.gz':
                  packed=gzip.compress(raw,compresslevel=9,mtime=0)
                  p.unlink()
                  if len(packed)<=5000000:
                      q=out/(p.name+'.gz');q.write_bytes(packed);item['saved_as']=q.name
                  else:item['saved_as']='hash and reproducible source only: compressed size exceeds 5 MB'
              elif len(raw)>5000000:
                  p.unlink();item['saved_as']='hash and reproducible source only: size exceeds 5 MB'
              records.append(item)
          (out/'ci-outcome.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'step_outcome':os.environ.get('ISP_STEP_OUTCOME'),'mathematical_status':receipt.get('status','not completed'),'exact_identity_verified':receipt.get('exactIdentityVerified',False),'files':records},indent=2)+'\n')
          PY
      - name: Commit actual outputs to this repository
        if: always()
        continue-on-error: true
        env:
          ISP_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/invariant-subspace-problem/notes/2026-11-14-r150-actions-publish-789f.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isp-r150-${{ github.run_id }}-${{ github.run_attempt }}-char${{ matrix.characteristic }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/isp-r150-${{ matrix.characteristic }}
      - name: Require the exact runner to finish
        if: always()
        env:
          ISP_STEP_OUTCOME: ${{ steps.exact.outcome }}
        run: test "$ISP_STEP_OUTCOME" = success
