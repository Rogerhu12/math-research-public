name: ISP R150 original zero projection with manifest-only publication
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: isp-original-zero-projection-manifest-789f
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/invariant-subspace-problem/README.md
            /topics/invariant-subspace-problem/HANDOFF.md
            /topics/invariant-subspace-problem/notes/2026-11-16-r150-zero-projection-manifest-session-789f.py
            /topics/invariant-subspace-problem/notes/2026-11-16-r150-zero-projection-manifest-session-789f-request.json
          persist-credentials: false
      - name: Install exact arithmetic
        run: python -m pip install --quiet python-flint==0.9.0
      - name: Compute original zero projection; persist only execution identities
        run: python topics/invariant-subspace-problem/notes/2026-11-16-r150-zero-projection-manifest-session-789f.py
