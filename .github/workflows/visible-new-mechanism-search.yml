name: visible-new-mechanism public design search

on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request.json
  workflow_dispatch:
    inputs:
      lane:
        description: Public numerical lane (all uses request.json)
        type: choice
        default: all
        options: [all, eccentric, seeds, kernel, core_folded, second_order, band_geometry, band_newton, folded_bearing, inward, codedesign, inward_fixed, ellipse_cont, ellipse_phi, inward_gc4, star_core, closed_design, ruled_tail, space_star, closed_quartic, star_lift, space_refine, warped_core, warped_tube, phase_shoot, derivative_audit, star_verify, closed_branch, global_profile, warped_collar, exact_D0, cosine_core, phase_D0, physical_C, cosine_endpoints, cosine_feasible, physical_root, constant_h_exact, ellipse_frame, ellipse_audit, ellipse_enriched, zero_operator_exact, ellipse_bent_tail, zero_operator_instance, third_order_exact, fourth_order_exact, fourth_sos_exact, ellipse_saturated_heat, overlap_fourth_exact, range_numerator_exact, full_range_compile, natural_body_initial, single_P_instance, independent_height_solve, full_fourth_evaluate, fixed_height_primitive, frozen_profile_gate, entry_paired_audit, recovery_development, short_entry_development, short_entry_audit]

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      lanes: ${{ steps.lanes.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /topics/visible-flex-new-mechanism/computations/request.json
      - id: lanes
        env:
          REQUESTED_LANE: ${{ inputs.lane }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path('topics/visible-flex-new-mechanism/computations/request.json').read_text())
          chosen = os.environ.get('REQUESTED_LANE')
          lanes = [chosen] if chosen and chosen != 'all' else request['lanes']
          allowed = {'eccentric', 'seeds', 'kernel', 'core_folded', 'second_order', 'band_geometry', 'band_newton', 'folded_bearing', 'inward', 'codedesign', 'inward_fixed', 'ellipse_cont', 'ellipse_phi', 'inward_gc4', 'star_core', 'closed_design', 'ruled_tail', 'space_star', 'closed_quartic', 'star_lift', 'space_refine', 'warped_core', 'warped_tube', 'phase_shoot', 'derivative_audit', 'star_verify', 'closed_branch', 'global_profile', 'warped_collar', 'exact_D0', 'cosine_core', 'phase_D0', 'physical_C', 'cosine_endpoints', 'cosine_feasible', 'physical_root', 'constant_h_exact', 'ellipse_frame', 'ellipse_audit', 'ellipse_enriched', 'zero_operator_exact', 'ellipse_bent_tail', 'zero_operator_instance', 'third_order_exact', 'fourth_order_exact', 'fourth_sos_exact', 'ellipse_saturated_heat', 'overlap_fourth_exact', 'range_numerator_exact', 'full_range_compile', 'natural_body_initial', 'single_P_instance', 'independent_height_solve', 'full_fourth_evaluate', 'fixed_height_primitive', 'frozen_profile_gate', 'entry_paired_audit', 'recovery_development', 'short_entry_development', 'short_entry_audit'}
          if not lanes or len(lanes) > 4 or len(set(lanes)) != len(lanes) or any(x not in allowed for x in lanes):
              raise SystemExit('Invalid bounded public request lanes')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('value=' + json.dumps(lanes, separators=(',', ':')) + '\n')
          print(json.dumps({'lanes': lanes, 'request': request['request']}))
          PY
  search:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.lanes) }}
    name: Search ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: visible-new-mechanism-${{ matrix.lane }}
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-new-mechanism-search.yml
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/scripts/
            /topics/visible-flex-new-mechanism/computations/request.json
            /topics/visible-flex-new-mechanism/notes/eccentric-search-design-002-curvature-seed.json
            /topics/visible-flex-new-mechanism/notes/actions-43590239302-1-star_core/
            /topics/visible-flex-new-mechanism/notes/actions-43592270686-1-closed_quartic/
            /topics/visible-flex-new-mechanism/notes/actions-43592270686-1-star_lift/
            /topics/visible-flex-new-mechanism/notes/actions-43591099281-1-closed_design/
            /topics/visible-flex-new-mechanism/notes/actions-43597247312-1-cosine_core/
            /topics/visible-flex-new-mechanism/notes/actions-43602519926-1-ellipse_frame/
            /topics/visible-flex-new-mechanism/notes/actions-43604231319-1-ellipse_enriched/
            /topics/visible-flex-new-mechanism/notes/actions-43612971265-1-ellipse_saturated_heat/
            /topics/visible-flex-new-mechanism/notes/actions-43617085278-1-single_P_instance/
            /topics/visible-flex-new-mechanism/notes/actions-43618467921-1-independent_height_solve/
            /topics/visible-flex-new-mechanism/notes/actions-43618467921-1-full_fourth_evaluate/
            /topics/visible-flex-new-mechanism/notes/actions-43622984979-1-entry_paired_audit/
      - name: Prepare bounded public output directory
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          mkdir -p "$RUNNER_TEMP/visible-new-mechanism/${{ matrix.lane }}"
          echo "VISIBLE_NEW_OUT=$RUNNER_TEMP/visible-new-mechanism/${{ matrix.lane }}" >> "$GITHUB_ENV"
          echo "VISIBLE_NEW_SCRIPTS=$GITHUB_WORKSPACE/topics/visible-flex-new-mechanism/scripts" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Continue bounded eccentric designs without claiming fixed metric refinement
        if: matrix.lane == 'eccentric'
        timeout-minutes: 40
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          output = Path(os.environ['VISIBLE_NEW_OUT'])
          script = Path(os.environ['VISIBLE_NEW_SCRIPTS']) / 'eccentric_collar_search.py'
          previous = Path('topics/visible-flex-new-mechanism/notes/eccentric-search-design-002-curvature-seed.json')
          records = []
          for index, offset in enumerate([.05, .1, .2, .3, .45], 1):
              target = output / f'design-{index:02d}-offset-{offset:.2f}.json'
              command = [sys.executable, '-u', str(script), '--metric-mode', 'angular-design',
                         '--controls', '14', '--modes', '6', '--radial-order', '10',
                         '--angles', '48', '--offset', str(offset), '--max-nfev', '250',
                         '--design-floor', '.1', '--design-ceiling', '4', '--barrier-weight', '10',
                         '--seed-kind', 'curvature', '--seed2', '.35', '--seed3', '.25',
                         '--seed-asymmetry', '.3', '--resume', str(previous),
                         '--audit-radials', '65', '257', '1025', '--out', str(target)]
              completed = subprocess.run(command)
              record = {'offset': offset, 'returncode': completed.returncode, 'output': target.name,
                        'command': command, 'design_search': True, 'fixed_metric_refinement': False}
              if target.exists():
                  data = json.loads(target.read_text())
                  record['final_audit'] = data['final_audits'][-1]
                  previous = target
              records.append(record)
              (output / 'continuation-summary.json').write_text(json.dumps({
                  'source_commit': os.environ['GITHUB_SHA'], 'controls': 14, 'modes': 6,
                  'design_search': True, 'task_complete': False, 'steps': records}, indent=2) + '\n')
              if completed.returncode:
                  raise SystemExit(completed.returncode)
          PY
      - name: Compute public literature seed and fixed metric mixed-mode comparisons
        if: matrix.lane == 'seeds'
        timeout-minutes: 30
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/literature_band_seed.py" \
            --q 3 --output "$VISIBLE_NEW_OUT/literature-band-q3.json"
          python -u "$VISIBLE_NEW_SCRIPTS/literature_band_kernel.py" \
            --output "$VISIBLE_NEW_OUT/literature-band-kernel-q3.json"
          for angular_points in 64 128 256; do
            for side in plus minus; do
              end_value=.35
              if [ "$side" = minus ]; then end_value=-.35; fi
              python -u "$VISIBLE_NEW_SCRIPTS/mixed_mode_gc_flow.py" \
                --angles "$angular_points" --amp2 .25 --amp3 .2 \
                --curvature .6 --jerk .8 --end "$end_value" --samples 15 \
                --rtol 2e-11 --atol 2e-13 --max-step .005 \
                --out "$VISIBLE_NEW_OUT/mixed-gc-j08-N${angular_points}-${side}.json"
            done
          done
      - name: Refine integration of one fixed literature-band trial space
        if: matrix.lane == 'kernel'
        timeout-minutes: 35
        run: |
          for angular_points in 192 384 768; do
            python -u "$VISIBLE_NEW_SCRIPTS/literature_band_kernel.py" \
              --theta-n "$angular_points" --u-n 64 --modes 6 --degree 10 \
              --epsilon 0 .00001 .0001 .005 \
              --output "$VISIBLE_NEW_OUT/literature-kernel-q3-N${angular_points}.json"
          done
      - name: Solve two controlled folded core-to-tail designs
        if: matrix.lane == 'core_folded'
        timeout-minutes: 40
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/core_to_tail_bvp.py" \
            --background folded --length 1.5 --fold-min -.1 \
            --fold-first-fraction .33 --inlet-angles 256 \
            --radial-free 5 --modes 6 --angular 64 --radial-gauss 5 \
            --max-nfev 200 --out "$VISIBLE_NEW_OUT/core-tail-folded-L15.json"
          python -u "$VISIBLE_NEW_SCRIPTS/core_to_tail_bvp.py" \
            --background folded --length 1.8 --fold-min -.2 \
            --fold-first-fraction .33 --inlet-angles 256 \
            --radial-free 5 --modes 6 --angular 64 --radial-gauss 5 \
            --max-nfev 200 --out "$VISIBLE_NEW_OUT/core-tail-folded-L18.json"
      - name: Test complete second-order period conditions at a fixed profile circle
        if: matrix.lane == 'second_order'
        timeout-minutes: 25
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/literature_band_second_order.py" \
            --theta-n 1536 --xi-n 192 \
            --output "$VISIBLE_NEW_OUT/bump-second-order-N1536-x192.json"
          python -u "$VISIBLE_NEW_SCRIPTS/literature_band_second_order.py" \
            --theta-n 3072 --xi-n 256 \
            --output "$VISIBLE_NEW_OUT/bump-second-order-N3072-x256.json"
          python -u "$VISIBLE_NEW_SCRIPTS/literature_band_second_order.py" \
            --profile-kind polynomial --profile-power 4 --theta-n 384 --xi-n 64 \
            --output "$VISIBLE_NEW_OUT/poly4-second-order-N384-x64.json"
          python -u "$VISIBLE_NEW_SCRIPTS/literature_band_second_order.py" \
            --profile-kind polynomial --profile-power 4 --theta-n 768 --xi-n 96 \
            --output "$VISIBLE_NEW_OUT/poly4-second-order-N768-x96.json"
      - name: Screen exact closed band seeds for curvature and physical support width
        if: matrix.lane == 'band_geometry'
        timeout-minutes: 25
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/literature_band_geometry_scan.py" \
            --top 4 --out "$VISIBLE_NEW_OUT/band-geometry-scan.json"
      - name: Solve fixed-metric nonlinear band path slices
        if: matrix.lane == 'band_newton'
        timeout-minutes: 35
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/literature_band_path_newton.py" \
            --profile-kind polynomial --profile-power 4 \
            --theta-n 192 --xi-n 64 --modes 3 --degree 8 --epsilon .0001 \
            --phases 0 .125 .25 .5 --max-nfev 60 --check-jacobian \
            --output "$VISIBLE_NEW_OUT/poly4-fixed-metric-path-pilot.json"
      - name: Check folded circular reference and solve pinned noncircular collars
        if: matrix.lane == 'folded_bearing'
        timeout-minutes: 40
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/folded_reference_geometry.py" \
            --beta-wiggle 2.4 --length 3 --radius .8 --plateau .15 --cells 512 \
            --curvature-limit 12 --out "$VISIBLE_NEW_OUT/folded-reference.json"
          python -u "$VISIBLE_NEW_SCRIPTS/folded_collar_search.py" \
            --engine signed --core-shape curvature --seed2 .25 --seed3 .2 \
            --beta-wiggle 2.4 --length 3 --radius .8 --plateau .15 \
            --controls 14 --modes 6 --radial-order 8 --angles 64 --max-nfev 180 \
            --reference-audit "$VISIBLE_NEW_OUT/folded-reference.json" \
            --out "$VISIBLE_NEW_OUT/folded-signed-pinned-core.json"
          python -u "$VISIBLE_NEW_SCRIPTS/folded_collar_search.py" \
            --engine cartesian --core-shape ellipse --ellipse-major 1.4 --ellipse-minor .5 \
            --beta-wiggle 2.4 --length 3 --radius .8 --plateau .15 \
            --controls 14 --modes 6 --radial-order 8 --angles 64 --max-nfev 180 \
            --reference-audit "$VISIBLE_NEW_OUT/folded-reference.json" \
            --out "$VISIBLE_NEW_OUT/folded-cartesian-ellipse-core.json"
      - name: Solve two inward ellipse-to-collar designs that pass the port-length screen
        if: matrix.lane == 'inward'
        timeout-minutes: 40
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/inward_reference_geometry.py" \
            --out "$VISIBLE_NEW_OUT/inward-reference-and-round-control.json"
          python -u "$VISIBLE_NEW_SCRIPTS/core_to_tail_bvp.py" \
            --core-profile ellipse --ellipse-major 1 --ellipse-minor .3 --inlet-s .23 \
            --background inward --length .80 --inward-overshoot 1.53 --inward-first-fraction .67 \
            --cut-radius .28 --flat-start .26 --cuff-radius .23 \
            --tail-plus 0 --tail-minus 0 --tail-plus-min -.1 --tail-minus-min -.1 --tail-angle-max .1 \
            --tail-height-min .05 --tail-height-max .6 --radius-floor .24 --radius-ceiling .9 \
            --radial-free 5 --modes 12 --angular 96 --radial-gauss 6 --inlet-angles 256 \
            --max-nfev 250 --out "$VISIBLE_NEW_OUT/core-tail-inward-B.json"
          python -u "$VISIBLE_NEW_SCRIPTS/core_to_tail_bvp.py" \
            --core-profile ellipse --ellipse-major 1 --ellipse-minor .3 --inlet-s .25 \
            --background inward --length .80 --inward-overshoot 1.5 --inward-first-fraction .68 \
            --cut-radius .28 --flat-start .26 --cuff-radius .23 \
            --tail-plus 0 --tail-minus 0 --tail-plus-min -.1 --tail-minus-min -.1 --tail-angle-max .1 \
            --tail-height-min .05 --tail-height-max .6 --radius-floor .24 --radius-ceiling .9 \
            --radial-free 5 --modes 12 --angular 96 --radial-gauss 6 --inlet-angles 256 \
            --max-nfev 250 --out "$VISIBLE_NEW_OUT/core-tail-inward-C.json"
      - name: Design all eleven complete period coefficients with bounded speed
        if: matrix.lane == 'codedesign'
        timeout-minutes: 35
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/literature_base_codesign.py" \
            --theta-n 768 --validation-n 768 1536 3072 --modes 12 --max-nfev 350 \
            --out "$VISIBLE_NEW_OUT/eleven-period-coefficient-designs.json"
      - name: Solve fixed inward metric with actual raised cap planes
        if: matrix.lane == 'inward_fixed'
        timeout-minutes: 40
        run: |
          for engine in cartesian signed; do
            python -u "$VISIBLE_NEW_SCRIPTS/inward_collar_search.py" \
              --engine "$engine" --ellipse-major 1 --ellipse-minor .3 \
              --core-half-height .23 --connection-length .8 --cut-radius .28 --port-height .30 \
              --inward-overshoot 1.53 --inward-first-fraction .67 --reach-budget .069 \
              --controls 16 --modes 12 --angles 128 --radial-order 8 --max-nfev 220 \
              --check-jacobian --out "$VISIBLE_NEW_OUT/inward-fixed-${engine}.json"
          done
      - name: Continue constant-perimeter circles to strong elliptic cores
        if: matrix.lane == 'ellipse_cont'
        timeout-minutes: 40
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/ellipse_core_continuation.py" \
            --length 1.0 --h0 .23 --beta-wiggle .8 --radial-free 9 --modes 12 \
            --accept-metric .0001 --initial-step .125 --min-step .0078125 \
            --max-attempts 40 --max-nfev 250 --out-dir "$VISIBLE_NEW_OUT" --prefix ellipse-L10
          python -u "$VISIBLE_NEW_SCRIPTS/ellipse_core_continuation.py" \
            --length 1.1 --h0 .25 --beta-wiggle .8 --radial-free 9 --modes 12 \
            --accept-metric .0001 --initial-step .125 --min-step .0078125 \
            --max-attempts 40 --max-nfev 250 --out-dir "$VISIBLE_NEW_OUT" --prefix ellipse-L11
      - name: Compare elliptic angular bases in constant-perimeter continuation
        if: matrix.lane == 'ellipse_phi'
        timeout-minutes: 40
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/ellipse_core_continuation.py" \
            --length 1.0 --h0 .23 --beta-wiggle .8 --radial-free 9 --modes 12 \
            --angular-basis ellipse --accept-metric .0001 --initial-step .125 --min-step .0078125 \
            --max-attempts 40 --max-nfev 250 --out-dir "$VISIBLE_NEW_OUT" --prefix ellipse-L10-phi
          python -u "$VISIBLE_NEW_SCRIPTS/ellipse_core_continuation.py" \
            --length 1.1 --h0 .25 --beta-wiggle .8 --radial-free 9 --modes 12 \
            --angular-basis ellipse --accept-metric .0001 --initial-step .125 --min-step .0078125 \
            --max-attempts 40 --max-nfev 250 --out-dir "$VISIBLE_NEW_OUT" --prefix ellipse-L11-phi
      - name: Compare fourth-order Cauchy seeds in the same fixed inward metric
        if: matrix.lane == 'inward_gc4'
        timeout-minutes: 40
        run: |
          for basis in material ellipse; do
            python -u "$VISIBLE_NEW_SCRIPTS/inward_gc4_collar_search.py" \
              --seed-family gc4 --angular-basis "$basis" --gc-jet-fraction .25 \
              --ellipse-major 1 --ellipse-minor .3 --core-half-height .23 \
              --connection-length .8 --cut-radius .28 --port-height .30 \
              --inward-overshoot 1.53 --inward-first-fraction .67 --reach-budget .069 \
              --controls 16 --modes 12 --angles 128 --radial-order 8 --max-nfev 220 \
              --check-jacobian --out "$VISIBLE_NEW_OUT/inward-gc4-${basis}.json"
          done
      - name: Bound the true Hausdorff witness and full planar star diameter
        if: matrix.lane == 'star_core'
        timeout-minutes: 25
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/star_core_geometry.py" \
            --a .55,.60,.65 --b .06,.09,.12 --nodes 4096 --chord-samples 1024 \
            --check-derivatives --out "$VISIBLE_NEW_OUT/star-core-geometry-grid.json"
      - name: Design nine period coefficients with exact closure tilt
        if: matrix.lane == 'closed_design'
        timeout-minutes: 25
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/literature_closed_codesign.py" \
            --theta-n 768 --validation-n 768 1536 3072 --modes 12 --max-nfev 400 \
            --out "$VISIBLE_NEW_OUT/nine-coefficients-closed-design.json"
      - name: Connect an exact ruled core with one fixed complete metric
        if: matrix.lane == 'ruled_tail'
        timeout-minutes: 35
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/ruled_core_to_tail_bvp.py" \
            --length 1.0 --ruled-scale .24 --inlet-s .012 \
            --core-exact-length .01 --core-blend-length .04 --reference-flat-length .03 \
            --beta-wiggle .8 --radial-free 5 --modes 8 --angular 64 --radial-gauss 5 \
            --max-nfev 150 --out "$VISIBLE_NEW_OUT/ruled-tail-L10-J5m8.json"
      - name: Screen exact space-star flat cores using published planar certificates
        if: matrix.lane == 'space_star'
        timeout-minutes: 30
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/space_star_flat_core.py" \
            --a .60 --b .09 --lifts .10,.15,.20,.25,.30 \
            --lift-mixes 0,.187,.20,.220,valley-zero,tip-zero --widths .005,.01,.02,.03 \
            --nodes 4096 --samples 1024 \
            --planar-report "$GITHUB_WORKSPACE/topics/visible-flex-new-mechanism/notes/actions-43590239302-1-star_core/star-core-geometry-grid.json" \
            --out "$VISIBLE_NEW_OUT/space-star-flat-a60-b09.json"
          python -u "$VISIBLE_NEW_SCRIPTS/space_star_flat_core.py" \
            --a .65 --b .12 --lifts .10,.15,.20,.25,.30 \
            --lift-mixes 0,.187,.20,.220,valley-zero,tip-zero --widths .005,.01,.02,.03 \
            --nodes 4096 --samples 1024 \
            --planar-report "$GITHUB_WORKSPACE/topics/visible-flex-new-mechanism/notes/actions-43590239302-1-star_core/star-core-geometry-grid.json" \
            --out "$VISIBLE_NEW_OUT/space-star-flat-a65-b12.json"
      - name: Solve corrected closed designs then quartic support geometry
        if: matrix.lane == 'closed_quartic'
        timeout-minutes: 30
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/literature_closed_codesign.py" \
            --theta-n 768 --validation-n 768 1536 3072 --modes 12 --max-nfev 400 \
            --out "$VISIBLE_NEW_OUT/absolute-jacobian-closed-design.json"
          python -u "$VISIBLE_NEW_SCRIPTS/literature_quartic_codesign.py" \
            --q 3 --sides positive negative --theta-n 768 --validation-n 768 1536 3072 \
            --max-nfev 150 --warm-start "$VISIBLE_NEW_OUT/absolute-jacobian-closed-design.json" \
            --out "$VISIBLE_NEW_OUT/quartic-support-closed-design.json"
      - name: Optimize whole-angle spatial lifts with exact torsion constraints
        if: matrix.lane == 'star_lift'
        timeout-minutes: 30
        run: |
          python -u "$VISIBLE_NEW_SCRIPTS/space_star_lift_design.py" \
            --a .60 --b .09 --height-modes 6 --half-width .02 \
            --angles 384 --dense-angles 3072 --initial-lifts .10,.20,.30 \
            --higher-coefficient-bound .08 --j-floor .15 --kappa-floor .04 \
            --max-iterations 200 --certificate-nodes 4096 \
            --planar-report "$GITHUB_WORKSPACE/topics/visible-flex-new-mechanism/notes/actions-43590239302-1-star_core/star-core-geometry-grid.json" \
            --out "$VISIBLE_NEW_OUT/space-star-lift-design-a60-b09.json"
          python -u "$VISIBLE_NEW_SCRIPTS/space_star_lift_design.py" \
            --a .65 --b .12 --height-modes 6 --half-width .02 \
            --angles 384 --dense-angles 3072 --initial-lifts .10,.20,.30 \
            --higher-coefficient-bound .08 --j-floor .15 --kappa-floor .04 \
            --max-iterations 200 --certificate-nodes 4096 \
            --planar-report "$GITHUB_WORKSPACE/topics/visible-flex-new-mechanism/notes/actions-43590239302-1-star_core/star-core-geometry-grid.json" \
            --out "$VISIBLE_NEW_OUT/space-star-lift-design-a65-b12.json"
      - name: Refine three frozen promising space-star cores by continuous interval bounds
