name: visible-exact retained radial density-one sources

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-retained-radial-density-one-sources.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-retained-radial-density-one-sources
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-retained-radial-density-one-sources-CI-inputs.json
  PHASE_MANIFEST_SHA: e0a36c82ed4f2a7aa0ea9bbbcccee8ab3aee06ccbc78ed113a08e9f353eb93d8
  PHASE_PIPELINE_SHA: c1ed2857915498a4f301f3ad3bd6caaeea99232b97e0b1e7f87d08e89beb23a8
  PHASE_WORKER_SHA: 49f31cdeb44a000e01647976a846aa1083c4d3ce780f9ce1affa907a4e5b34d2
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  retained-radial-density-one-sources:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_retained_radial_density_one_sources_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-retained-radial-density-one-sources-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_retained_radial_density_one_sources_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_retained_radial_density_one_sources_public_worker.py --mode hydrate
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new source before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_retained_radial_density_one_sources.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the identical completed scientific runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5 scipy==1.17.0
      - name: Check the full immutable AST closure and evaluate complete retained radial density-one source bounds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_retained_radial_density_one_sources_public_worker.py --mode run
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-retained-radial-density-one-sources-science"
          --out-dir "$RUNNER_TEMP/visible-retained-radial-density-one-sources-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
