name: Serre R787 actual precision increment and original function reconstruction

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R787_precision_increment-public-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R787-precision-increment
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R805_public_success_io_audit.py
            /topics/serre-uniformity/notes/R787_precision_increment-public-request.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actually pull main and compare both rule files
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          path = Path("topics/serre-uniformity/scripts/R805_public_success_io_audit.py")
          assert hashlib.sha256(path.read_bytes()).hexdigest() == "5ae35d0c86b20a8b6234f3aac6059c6567cfbea73ed6f835d74f15ba48360e4f"
          spec = importlib.util.spec_from_file_location("R787_precision_rules_pull", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          request = json.loads(Path("topics/serre-uniformity/notes/R787_precision_increment-public-request.json").read_text())
          assert request["job"]["producer_inputs_pending"] is False
          assert request["job"]["new_current_source"] is not None
          assert request["job"]["new_checkpoint"] is not None
          root = Path(os.environ["RUNNER_TEMP"])/"serre-R787-precision-rules-pull"
          (root/"audit-output").mkdir(parents=True, exist_ok=True)
          module.pull_and_compare(root, request["rules_last_read_commit"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-R787-precision-rules-pull-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-R787-precision-rules-pull/audit-output
          retention-days: 1
          if-no-files-found: warn

  reconstruct:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-R787_precision_increment.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R787_precision_increment_reconstruction.py
            /topics/serre-uniformity/scripts/R787_precision_increment_public.py
            /topics/serre-uniformity/scripts/R787_projective_three_probe_reconstruction.py
            /topics/serre-uniformity/scripts/R781_original_Laurent_prefix.py
            /topics/serre-uniformity/scripts/R787_fixed_C_prefix_obstruction_public.py
            /topics/serre-uniformity/scripts/R787_projective_three_probe_public.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/notes/R787_precision_increment-public-request.json
            /topics/serre-uniformity/notes/R787-original-precision-increment-kernel-lattice-and-source-contract.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse the actual sources without importing mathematical code
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path("topics/serre-uniformity/scripts")
          for name in ("R787_precision_increment_reconstruction.py", "R787_precision_increment_public.py",
                       "R787_projective_three_probe_reconstruction.py", "R781_original_Laurent_prefix.py",
                       "R787_fixed_C_prefix_obstruction_public.py", "R787_projective_three_probe_public.py",
                       "R824_public_original_global_polar_generators.py"):
              path = root/name
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print("AST_OK", name)
          PY
      - name: Install pinned exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Refine the completed lattice at the actual deeper precision and verify new candidates
        continue-on-error: true
        timeout-minutes: 335
        run: python topics/serre-uniformity/scripts/R787_precision_increment_public.py compute
      - name: Transfer completed exact stages and active source carriers
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R787-original-power5-function-relation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R787-original-power5-function-relation/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
      - name: Require the full original 129 by 280 relation and actual source-bound recipe
        if: always()
        run: python topics/serre-uniformity/scripts/R787_precision_increment_public.py verify
