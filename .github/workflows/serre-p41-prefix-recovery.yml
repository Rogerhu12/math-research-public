name: Serre p41 resume actual saved prefixes

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/public-p41-recovery-request.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        result: [R620, R621]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            topics/serre-uniformity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 sympy==1.14.0 python-flint==0.8.0 mpmath==1.3.0
      - name: Restore the actual saved prefix
        run: python topics/serre-uniformity/scripts/p41_public_actions_recovery.py prepare --result ${{ matrix.result }}
      - name: Resume the missing chain and actual heights
        id: computation
        continue-on-error: true
        timeout-minutes: 325
        run: python topics/serre-uniformity/scripts/p41_public_actions_recovery.py run --result ${{ matrix.result }} --budget-minutes 320
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-p41-${{ matrix.result }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-p41-public/${{ matrix.result }}/output
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded results to this public repository
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/p41_public_actions_recovery.py publish --result ${{ matrix.result }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-p41-publication-${{ matrix.result }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-p41-public/${{ matrix.result }}/output/publication-receipt.json
          retention-days: 30
          if-no-files-found: warn
      - name: Require actual computational completion
        if: always()
        run: python topics/serre-uniformity/scripts/p41_public_actions_recovery.py verify --result ${{ matrix.result }}
