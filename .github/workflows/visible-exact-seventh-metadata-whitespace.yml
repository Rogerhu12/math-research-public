name: Visible exact seventh lossless metadata formatting
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/visible-exact-seventh-metadata-whitespace.yml
      - topics/visible-flex-exact-nearby/scripts/compact_legacy_metadata_seventh.py
permissions:
  contents: write
concurrency:
  group: visible-exact-seventh-metadata-whitespace
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            topics/visible-flex-exact-nearby
            .github
      - name: Format complete unreferenced metadata and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main "$GITHUB_SHA"
          prior=$(git rev-parse HEAD)
          git pull --rebase origin main
          git diff --exit-code "$prior" HEAD -- README.md topics/visible-flex-exact-nearby/README.md
          python topics/visible-flex-exact-nearby/scripts/compact_legacy_metadata_seventh.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Compact 128 whole legacy metadata JSON files without changing tokens"
          while true; do
            prior=$(git rev-parse HEAD)
            git pull --rebase origin main
            git diff --exit-code "$prior" HEAD -- README.md topics/visible-flex-exact-nearby/README.md
            python topics/visible-flex-exact-nearby/scripts/compact_legacy_metadata_seventh.py --recheck
            if git push origin HEAD:main; then
              break
            fi
          done
