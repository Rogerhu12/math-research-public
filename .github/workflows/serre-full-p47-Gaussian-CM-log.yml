name: Serre full p47 original Gaussian CM logarithm

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/full-p47-Gaussian-CM-log-request.json

permissions:
  contents: read

concurrency:
  group: serre-full-p47-Gaussian-CM-log-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_Gaussian_CM_log:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/full_p47_weight_one_Hodge_certificate.py
            /topics/serre-uniformity/notes/2026-11-27-full-p47-Gaussian-CM-log-method.md
            /topics/serre-uniformity/scripts/full_p47_Gaussian_CM_log.py
            /topics/serre-uniformity/results/R1091-original-Gaussian-CM-logarithm-as-one-algebraic-coefficient.md
            /topics/serre-uniformity/results/R1090-original-weight-one-integral-Hodge-source.md
            /topics/serre-uniformity/notes/full-p47-Gaussian-CM-log-request.json
      - name: Pull pinned official SageMath 10.6 image
        run: docker pull sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      - name: Read the original Gaussian CM logarithm in actual integral Hecke blocks
        env:
          SERRE_EXPECTED_REQUEST_SHA256: '469f9d05fe0e0b687f325977c2196acce30ce6ce59ebfb124969a64ab0a44810'
        run: |
          timeout --signal=TERM --kill-after=30s 1800s docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work,readonly" \
            --workdir /work \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SHA \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e SERRE_EXPECTED_REQUEST_SHA256 \
            -e PYTHONUNBUFFERED=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879 \
            sage -python topics/serre-uniformity/scripts/full_p47_Gaussian_CM_log.py
