name: visible-exact cohomological normalizer windows and global sign

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-cohomological-normalizer-windows-sign.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-cohomological-normalizer-windows-sign
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cohomological-normalizer-windows-sign-CI-inputs.json
  PHASE_MANIFEST_SHA: d66bc4a1fb2251f421a3feebef727352f92b252bf810892e732f008ebe5bad40
  PHASE_PIPELINE_SHA: c8352847b0bd8df141c4aeb97d4dab372b807d7d18546d2b93659f95011cd75f
  PHASE_WORKER_SHA: c58a65f5c6f6df22cdeafc119f86f355f9f20adc9c3019b56259c9c8d29ab222
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  cohomological-normalizer-windows-sign:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cohomological_normalizer_windows_sign_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cohomological-normalizer-windows-sign-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cohomological_normalizer_windows_sign_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cohomological_normalizer_windows_sign_public_worker.py --mode hydrate
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new source before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cohomological_normalizer_windows_sign.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the pinned scalar runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Check the full immutable AST closure and evaluate the complete cohomological normalizer windows and global sign
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cohomological_normalizer_windows_sign_public_worker.py --mode run
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-cohomological-normalizer-windows-sign-science"
          --out-dir "$RUNNER_TEMP/visible-cohomological-normalizer-windows-sign-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
