name: visible-larger inexact p3 restoration with original complete-three merit
'on':
  push:
    branches:
    - main
    paths:
    - topics/visible-flex-larger-amplitude/computations/public-small-core-resonance-request.json
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  smallcoreresonance:
    name: Continue actual93 with the same frozen inexact restoration and original complete-three merit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: visible-larger-public-smallcoreresonance
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        filter: blob:none
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /README.md
          /topics/visible-flex-larger-amplitude/*.md
          /topics/visible-flex-larger-amplitude/computations/
          /topics/visible-flex-larger-amplitude/notes/public-actions-43580643038-1-free3/stage-00/actual.json.gz
          /topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-prepare112/preparation112/prepared.json.gz
          /topics/visible-flex-larger-amplitude/notes/public-actions-43592195185-1-coupling112banded/full-DN112/outer-00-anchor-tail.json.gz
          /topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-prepare112/T112-config.json
          /topics/visible-flex-larger-amplitude/notes/public-actions-43674264245-1-smallcoreresonance/small-core-inexact-p3-restoration/inexact-p3-restoration-status.json
    - name: Establish one independent diagnostic output
      run: |
        git config gc.auto 0
        git config gc.autoPackLimit 0
        git config maintenance.auto false
        mkdir -p "$RUNNER_TEMP/visible-small-core-resonance/smallcoreresonance"
        echo "VISIBLE_OUT=$RUNNER_TEMP/visible-small-core-resonance/smallcoreresonance" >> "$GITHUB_ENV"
        echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.14
    - name: Install the existing original operator diagnostic runtime
      run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
    - name: Bind actual93 complete own-schema status, unchanged four inputs and72 pinned sources
      run: |
        python - <<'PYPINS'
        import hashlib,json,os,re,subprocess
        from pathlib import Path,PurePosixPath
        comp=Path(os.environ['VISIBLE_COMPUTATIONS']);out=Path(os.environ['VISIBLE_OUT']);repo=Path.cwd()
        raw=(comp/'public-small-core-resonance-request.json').read_bytes();request=json.loads(raw)
        if (request.get('schema')!='public-small-core-resonance-request-v1' or request.get('repository')!='Rogerhu12/math-research-public' or request.get('request_number')!=96 or request.get('lanes')!=['smallcoreresonance']):
            raise ValueError('Use the explicit same-source inexact-p3-restoration continuation request96')
        if request.get('scientific_entry')!='geometry_20261115_small_core_inexact_p3_restoration.py':raise ValueError('Use the independently identified inexact-p3-restoration candidate entry')
        source_chain={'independent_algorithm_entry': {'file': 'geometry_20261115_small_core_inexact_p3_restoration.py', 'bytes': 45133, 'sha256': 'ce93a364f8423c89e9e696e1e2c96662b61c6daaf225bd51c44fcd572e05654e'}, 'original_model_and_checks': {'file': 'geometry_20261114_small_core_resonance.py', 'sha256': '3b9c45abed425a92be662c3547d088a3074ebcc5923c23ac2ef7aaf003124bd5'}, 'parent_inner_root_provenance_only': {'file': 'geometry_20261115_small_core_p3_inner_root_search.py', 'bytes': 43598, 'sha256': '3b48efd71eb696fef66acbe7fbd163bb8dc8ca63287bfa8c4e873a2600fbf9d9'}, 'parent_resume_provenance_only': {'file': 'geometry_20261115_small_core_damped_resume.py', 'bytes': 15452, 'sha256': 'ec9a56fd184ff7d68fd1caadc9d350312b075172d20dabdee5203ce5b491ad1a'}, 'parent_direction_provenance_only': {'file': 'geometry_20261115_small_core_damped_search.py', 'bytes': 13733, 'sha256': '1691c7d9aad782f9f1a6308ca16fa9630a44988a1b99decdca594a412cdb1728'}}
        if request.get('source_chain')!=source_chain or request.get('scientific_source_unchanged') is not True or request.get('imported_original_model_source_unchanged') is not True or request.get('immutable_parent_direction_source_preserved_but_not_executed') is not True or request.get('immutable_parent_inner_root_source_preserved_but_not_executed') is not True:raise ValueError('Declare the unchanged actual93 algorithm and original model; older direction engines remain provenance only')
        expected={'parameters': [0.5078436152033409, -0.3849212262335502, 0.5911288427829965], 'backtracks': 20, 'candidate_resonance_tolerance': 1e-08, 'interval_bits': 160, 'interval_depth': 14, 'original_mesh_nodes': 699, 'field_modes': 112, 'tail_modes': 112, 'physical_angle_grid': 2048, 'material_and_boundary_angles': 4096, 'original_RHS_workers': 1, 'damping': '0.1', 'candidate_steps': 8, 'inner_newton_steps': 12, 'inner_backtracks': 20}
        if request.get('diagnostic')!=expected:raise ValueError('Retain actual93 parameters, eta0.1, outer8/20, inner12/20 and original diagnostic budgets')
        required={'geometry_20261115_small_core_p3_inner_root_search.py', 'geometry_20261114_constrained_trust_warm.py', 'geometry_20261115_small_core_damped_search.py', 'geometry_20261114_direct_operator_cell.py', 'root_20261114_publish_actions.py', 'geometry_20261114_small_core_resonance.py', 'exact_20261114_public_resume.py', 'geometry_20261115_small_core_damped_resume.py', 'geometry_20261114_full_prefix_operator.py', 'geometry_20261115_small_core_inexact_p3_restoration.py', 'geometry_20261114_constrained_collocation.py', 'source-dependencies.json'}
        if len(request['source_sha256'])!=72 or not required.issubset(request['source_sha256']):raise ValueError('Retain all72 request93 sources including the unchanged inexact-restoration algorithm entry')
        if any(request['source_sha256'].get(item['file'])!=item['sha256'] for item in source_chain.values()):raise ValueError('Bind the new algorithm and all parent/model source identities')
        if request.get('output_directory')!='small-core-inexact-p3-restoration' or request.get('output_status')!='inexact-p3-restoration-status.json' or request.get('output_status_schema')!='R278-original-three-equation-inexact-p3-restoration-LM-v1':raise ValueError('Keep the new result identity explicit')
        verified=[]
        for name,digest in request['source_sha256'].items():
            if Path(name).name!=name or not re.fullmatch(r'[0-9a-f]{64}',digest):raise ValueError('Explicit local source identity required')
            data=(comp/name).read_bytes()
            if hashlib.sha256(data).hexdigest()!=digest:raise ValueError('Frozen source changed: '+name)
            if name.endswith('.py'):compile(data,name,'exec')
            verified.append(dict(file=name,bytes=len(data),sha256=digest))
        inputs=[]
        for key,item in request['inputs'].items():
            rel=PurePosixPath(item['file'])
            if rel.is_absolute() or '..' in rel.parts or not str(rel).startswith('topics/visible-flex-larger-amplitude/'):raise ValueError('Explicit public topic input required')
            data=(repo/str(rel)).read_bytes()
            if len(data)!=item['bytes'] or hashlib.sha256(data).hexdigest()!=item['sha256']:raise ValueError('Original input changed: '+key)
            inputs.append(dict(name=key,**item))
        prior=request['prior_candidate'];item=prior['original_status'];rel=PurePosixPath(item['file'])
        expected_prior=('topics/visible-flex-larger-amplitude/notes/public-actions-43674264245-1-smallcoreresonance/small-core-inexact-p3-restoration/inexact-p3-restoration-status.json', 372627, '0913ea5d90ddb23bd408b33175887b5b24665fe0db8324d873bbe0b08c12a647')
        if (str(rel),item['bytes'],item['sha256'])!=expected_prior:raise ValueError('Bind the actual93 complete original status bytes')
        prior_raw=(repo/str(rel)).read_bytes()
        if len(prior_raw)!=item['bytes'] or hashlib.sha256(prior_raw).hexdigest()!=item['sha256']:raise ValueError('Original actual93 status changed')
        prior_status=json.loads(prior_raw)
        if prior_status['schema']!='R278-original-three-equation-inexact-p3-restoration-LM-v1' or prior_status['source_sha256']!='ce93a364f8423c89e9e696e1e2c96662b61c6daaf225bd51c44fcd572e05654e':raise ValueError('Use the genuine actual93 own-schema parent from the same frozen producer')
        if prior_status.get('last_accepted_point_semantics')!='original-three-merit-accepted-candidate-or-fresh-parent':raise ValueError('Retain the same-source declared final-point provenance')
        if prior_status['phase']!='diagnostic-completed' or prior_status['diagnostic_completed'] is not True or prior_status['success'] is not False or prior_status['native_nonlinear_solver_called'] is not False:raise ValueError('The actual93 parent is a completed candidate diagnostic only')
        if prior_status['final']['parameters']!=request['diagnostic']['parameters'] or prior['parameters']!=request['diagnostic']['parameters']:raise ValueError('Use the actual93 literal final parameter values')
        if prior_status['input_sha256']!={key:item['sha256'] for key,item in request['inputs'].items()}:raise ValueError('Retain the same four original mathematical inputs')
        if any(request['source_sha256'].get(name)!=digest for name,digest in prior_status['consumed_source_sha256'].items()):raise ValueError('Retain the actual93 complete consumed source bytes')
        prior_output=out/'prior-candidate';prior_output.mkdir();(prior_output/'actual93-inexact-p3-restoration-status.json').write_bytes(prior_raw)
        head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        if head!=os.environ['GITHUB_SHA']:raise ValueError('Retain the actual triggering source commit')
        (out/'request96-input-and-source-identity.json').write_text(json.dumps(dict(source_commit=head,request=request,request_sha256=hashlib.sha256(raw).hexdigest(),verified_sources=verified,verified_original_inputs=inputs,verified_prior_candidate=prior,scientific_execution_claimed=False),indent=2)+'\n')
        print(json.dumps(dict(source_commit=head,source_count=len(verified),input_count=len(inputs))),flush=True)
        PYPINS
    - name: Restore the original78 public numerical source files once
      run: |
        PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYSOURCE' 2>&1 | tee "$VISIBLE_OUT/public-source-restore.log"
        import os
        from pathlib import Path
        from exact_20261114_public_resume import prepare_public_source
        source=prepare_public_source(Path.cwd(),Path(os.environ['RUNNER_TEMP'])/'small-core-resonance-original-source',Path(os.environ['VISIBLE_OUT']))
        with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
        PYSOURCE
    - name: Run one full-residual Schur candidate with inexact actual p3 restoration
      timeout-minutes: 45
      run: |
        python -u - <<'PYDIAGNOSTIC' 2>&1 | tee "$VISIBLE_OUT/small-core-resonance.log"
        import json,os,subprocess,sys
        from pathlib import Path
        comp=Path(os.environ['VISIBLE_COMPUTATIONS']);repo=Path.cwd();out=Path(os.environ['VISIBLE_OUT'])
        request=json.loads((comp/'public-small-core-resonance-request.json').read_text());d=request['diagnostic']
        argv=[sys.executable,'-u',str(comp/request['scientific_entry'])]
        for key in ('accepted','prepared','tail_anchor','tail_config'):argv+=['--'+key.replace('_','-'),str(repo/request['inputs'][key]['file'])]
        argv+=['--parent-status',str(repo/request['prior_candidate']['original_status']['file']),'--parent-status-sha256',request['prior_candidate']['original_status']['sha256'],'--damping',d['damping']]
        for key in ('candidate_steps','backtracks','inner_newton_steps','inner_backtracks','candidate_resonance_tolerance','interval_bits','interval_depth'):argv+=['--'+key.replace('_','-'),str(d[key])]
        argv+=['--out',str(out/request['output_directory'])]
        (out/'exact-diagnostic-command.json').write_text(json.dumps(dict(argv=argv,parameters=d,one_independent_inexact_p3_restoration_invocation=True,parent_approximate_root_algorithm_executed=False,actual_third_residual_in_normal_correction=True,inner_threshold_is_not_an_outer_eligibility_gate=True,parent_three_coordinate_direction_engine_executed=False,original_model_and_checks_imported_unchanged=True,new_two_coordinate_algorithm_explicit=True,source_chain=request['source_chain'],native_solver_started=False),indent=2)+'\n')
        raise SystemExit(subprocess.call(argv))
        PYDIAGNOSTIC
    - name: Copy complete original inexact-restoration decisions without new mathematics
      if: always()
      run: |
        python - <<'PYREAD'
        import hashlib,json,os
        from pathlib import Path
        out=Path(os.environ['VISIBLE_OUT']);path=out/'small-core-inexact-p3-restoration'/'inexact-p3-restoration-status.json'
        if not path.is_file():
            result=dict(original_status_present=False,scientific_success_not_claimed=True,scope='The source did not write a status; preserve its original log and partial files')
        else:
            raw=path.read_bytes();status=json.loads(raw)
            wanted=('schema','phase','diagnostic_completed','seconds','success','exception','input_sha256','consumed_source_sha256','original_diagnostic_source_sha256','source_sha256','source_roles','parent_status','candidate_algorithm','damping_cli_text','damping_binary64','candidate_iteration_budget','original_backtrack_budget','inner_newton_update_budget','inner_backtrack_budget','inner_threshold_is_not_an_outer_eligibility_gate','initial_parent_not_projected_or_replaced_before_outer_search','original_armijo_coefficient','candidate_resonance_tolerance','original_mesh_nodes','field_and_tail_modes','initial','final','initial_original_three_equation_merit','final_original_three_equation_merit','last_accepted_parameters','search_stop_reason','last_accepted_point_semantics','complete_scalar_domain','original_complete_circle_check','low_mode_candidate_has_small_full_recorded_right_residual','original_unit_stopping_tolerance_met','full_nonlinear_nonzero_lambda_solution_computed','high_mode_nonresonance_or_interval_transversality_proved','exact_p3_elimination_or_implicit_function_theorem_proved','inner_call_count','original_call_trace')
            result={key:status[key] for key in wanted if key in status}
            def pick(record,keys):return {key:record[key] for key in keys if key in record}
            projection=status.get('initial_projection',{})
            result['initial_projection_summary']=pick(projection,('performed','fresh_original_parent_retained','adopted_as_outer_baseline','no_parameter_change','reason','actual_total_original_parameter_displacement','alpha','true_model_merit_slope','original_merit_before','actual_merit','original_Armijo_bound','derivative_source'))
            for key in ('original_parent_point','actual_projected_point'):
                if key in projection:result['initial_projection_summary'][key]=pick(projection[key],('parameters','low_equations_used','original_three_equation_merit'))
            if 'inner' in projection:result['initial_projection_summary']['inner']=pick(projection['inner'],('file','bytes','sha256','inner_call','usable_inner_root','usable_restoration_point','inner_threshold_is_not_an_outer_eligibility_gate','residual_tolerance_met','original_full_J_finite','original_J33_finite_nonzero','stop_reason','seconds','original_call_cost'))
            result['outer_search_summary']=[]
            for row in status.get('searches',[]):
                copied=pick(row,('iteration','parameters','residual','actual_third_unit_residual','merit_before','true_model_merit_slope','accepted','reason','direction_model_error','direction_model'))
                copied['trials']=[]
                for trial in row['trials']:
                    item=pick(trial,('trial','alpha','predicted_seed_parameters','accepted','merit_before','actual_merit','original_Armijo_bound','true_third_unit_residual_preserved','inner_unit_threshold_met','actual_total_parameter_displacement','actual_restoration_displacement_from_seed','reason'))
                    item['inner']=pick(trial['inner'],('file','bytes','sha256','inner_call','usable_inner_root','usable_restoration_point','inner_threshold_is_not_an_outer_eligibility_gate','residual_tolerance_met','original_full_J_finite','original_J33_finite_nonzero','stop_reason'))
                    if 'actual_projected_point' in trial:item['actual_projected_point']=pick(trial['actual_projected_point'],('parameters','low_equations_used','original_three_equation_merit'))
                    copied['trials'].append(item)
                result['outer_search_summary'].append(copied)
            result.update(original_status=dict(file='small-core-inexact-p3-restoration/inexact-p3-restoration-status.json',bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()),copied_existing_status_only=True,complete_original_inner_reports_remain_in_artifact=True)
        data=(json.dumps(result,ensure_ascii=False,indent=2,allow_nan=False)+'\n').encode()
        if len(data)>=90000:
            large=out/'large-arrays';large.mkdir(exist_ok=True);(large/'complete-diagnostic-readback.json').write_bytes(data)
            kept=('schema','phase','diagnostic_completed','seconds','success','exception','source_sha256','original_status','search_stop_reason','initial_projection_summary','initial_original_three_equation_merit','final_original_three_equation_merit','last_accepted_parameters','inner_call_count','original_unit_stopping_tolerance_met','low_mode_candidate_has_small_full_recorded_right_residual','complete_scalar_domain','original_complete_circle_check')
            short={key:result[key] for key in kept if key in result}
            for key in ('initial','final'):
                if key in result:short[key]=pick(result[key],('parameters','unit_diagonal_defects','low_equations_used','three_by_three_parameter_jacobian','independent_real_parameter_difference_checks'))
            short['outer_search_summary']=[dict(pick(row,('iteration','parameters','residual','merit_before','true_model_merit_slope','accepted','reason','direction_model_error')),trials=[pick(item,('trial','alpha','accepted','actual_merit','original_Armijo_bound','true_third_unit_residual_preserved','inner_unit_threshold_met','actual_total_parameter_displacement','actual_restoration_displacement_from_seed','reason')) for item in row['trials']]) for row in result.get('outer_search_summary',[])]
            short.update(complete_readback='large-arrays/complete-diagnostic-readback.json',complete_readback_bytes=len(data),complete_readback_sha256=hashlib.sha256(data).hexdigest(),complete_original_inner_reports_remain_in_artifact=True,mathematical_computation_performed_by_this_readback=False)
            data=(json.dumps(short,ensure_ascii=False,indent=2,allow_nan=False)+'\n').encode()
        (out/'small-core-resonance-readback.json').write_bytes(data)
        print(json.dumps(dict(report='small-core-resonance-readback.json',bytes=len(data),original_status_present=path.is_file())),flush=True)
        PYREAD
    - name: Preserve every original diagnostic output and failure
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: visible-mainline-smallcoreresonance-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/visible-small-core-resonance/smallcoreresonance/
        compression-level: 1
        retention-days: 30
        if-no-files-found: warn
    - name: Publish bounded original results with ordinary pull and rebase
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -u "$VISIBLE_COMPUTATIONS/root_20261114_publish_actions.py" --results "$VISIBLE_OUT" --lane smallcoreresonance
