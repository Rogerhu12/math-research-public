name: Serre original c0 Hodge first jets and comparison leading terms

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R803-c0-Hodge-jets-public-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-original-c0-Hodge-jets
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/notes/R803-c0-Hodge-jets-public-request.json
      - name: Pull main and compare both rule files with the read commit
        env:
          REQUEST_SOURCE: ${{ github.sha }}
          RECEIPT_PATH: ${{ runner.temp }}/original-c0-Hodge-jets-rules-pull.json
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, subprocess
          from pathlib import Path
          path='topics/serre-uniformity/notes/R803-c0-Hodge-jets-public-request.json'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',os.environ['REQUEST_SOURCE']],check=True)
          request=json.loads(subprocess.check_output(['git','show',os.environ['REQUEST_SOURCE']+':'+path]))
          subprocess.run(['git','checkout','-B','original-c0-Hodge-jets-rules-main'],check=True)
          subprocess.run(['git','pull','--rebase','origin','main'],check=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          old=request['rules_last_read_commit']
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',old],check=True)
          actual={key:hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  for key,name in [('root','README.md'),('topic','topics/serre-uniformity/README.md')]}
          changed=actual!=request['readme_sha256']
          receipt={'actual_git_pull_rebase_completed':True,'actual_head':head,'previous_read_commit':old,
                   'actual_UTC':dt.datetime.now(dt.timezone.utc).isoformat(),'readme_sha256':actual,
                   'expected_readme_sha256':request['readme_sha256'],'rules_changed':changed}
          Path(os.environ['RECEIPT_PATH']).write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('ORIGINAL_C0_HODGE_RULES_PULL='+json.dumps(receipt,sort_keys=True))
          if changed:
              subprocess.run(['git','diff',old,head,'--','README.md','topics/serre-uniformity/README.md'],check=True)
              raise SystemExit('Both README changes must be read before the new mathematics.')
          PY
      - name: Preserve the actual pull receipt for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-original-c0-Hodge-jets-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/original-c0-Hodge-jets-rules-pull.json
          retention-days: 1
          if-no-files-found: warn

  compute:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R803_original_c0_Hodge_jets.py
            /topics/serre-uniformity/scripts/R803_original_c0_Hodge_jets_public.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/notes/2026-11-16-original-c0-Hom-nonramification-and-comparison-leading-terms.md
            /topics/serre-uniformity/notes/R803-original-c0-Hodge-jets-and-comparison-leading-coefficients-method.md
            /topics/serre-uniformity/notes/R803-c0-Hodge-jets-public-request.json
            /.github/workflows/serre-original-c0-Hodge-jets.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse the exact sources without importing mathematical code
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          base=Path('topics/serre-uniformity/scripts')
          for name in ('R803_original_c0_Hodge_jets.py','R803_original_c0_Hodge_jets_public.py',
                       'R824_public_original_global_polar_generators.py'):
              p=base/name
              ast.parse(p.read_text(),filename=str(p))
              print('AST_OK',name)
          PY
      - name: Compute only the original c0 jets and comparison leading terms
        run: |
          python topics/serre-uniformity/scripts/R803_original_c0_Hodge_jets_public.py --mode compute \
            --output "$RUNNER_TEMP/original-c0-Hodge-jets/output"
      - name: Preserve completed stages and the minimal original source carrier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-global-R803-original-c0-Hodge-jets-and-comparison-leading-coefficients-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/original-c0-Hodge-jets/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
      - name: Read the exact source and certificate interfaces
        if: always()
        run: |
          python topics/serre-uniformity/scripts/R803_original_c0_Hodge_jets_public.py --mode verify \
            --output "$RUNNER_TEMP/original-c0-Hodge-jets/output"
