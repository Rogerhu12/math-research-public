      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Actually pull main and check both README files before research
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
          VISIBLE_SYNC_LANE: ${{ matrix.lane }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,os.environ['VISIBLE_NEW_SCRIPTS'])
          import publish_actions as p
          repo=Path.cwd(); out=Path(os.environ['VISIBLE_NEW_OUT'])
          source=os.environ['GITHUB_SHA']; env=p.git_environment(os.environ['GITHUB_TOKEN'])
          before=p.git(repo,env,'rev-parse','HEAD').stdout.strip()
          if before!=source: raise SystemExit('checkout differs from computation source')
          checked=p.pull_and_check(repo,env,out)
          after=checked['after']
          remote=checked['remote_main']
          delta=p.git(repo,env,'diff','--no-ext-diff',source,remote,'--',*p.READMES).stdout
          p.write_json(out/'pre-research-pull.json',{'actual_git_pull':True,'source_commit':source,
              'head_after_pull':after,'remote_main':remote,'both_READMEs_unchanged':not bool(delta)})
          if delta:
              (out/'publication-README-change.diff').write_text(delta)
              print(delta)
              raise SystemExit('README changed: apply the new rules before research')
          p.git(repo,env,'checkout','--detach',source)
          print(json.dumps({'actual_pull':True,'readmes_read_commit':remote,'computation_source_restored':source}))
          request=json.loads(Path('topics/visible-flex-new-mechanism/computations/request-continuation.json').read_text())
          if request.get('sync_private_rules',False) and os.environ['VISIBLE_SYNC_LANE']==request.get('private_rule_sync_lane','full_m8_tail_response_projection'):
              from datetime import datetime, timezone
              token=os.environ.get('MR_TOKEN','')
              if not token: raise SystemExit('MR_TOKEN unavailable for the authorized private rule sync')
              private=Path(os.environ['RUNNER_TEMP'])/'visible-new-mechanism-private-rule-sync'
              penv=p.git_environment(token)
              p.git(private.parent,penv,'clone','--filter=blob:none','--depth','1','--no-checkout','--branch','main',
                  'https://github.com/Rogerhu12/math-research.git',str(private))
              p.git(private,penv,'config','gc.auto','0')
              p.git(private,penv,'config','maintenance.auto','false')
              p.git(private,penv,'sparse-checkout','init','--no-cone')
              p.git(private,penv,'sparse-checkout','set','--no-cone','/README.md','/QUEUE.md',
                  '/topics/visible-flex-new-mechanism/README.md')
              p.git(private,penv,'checkout','main')
              pb=p.git(private,penv,'rev-parse','HEAD').stdout.strip()
              p.git(private,penv,'pull','--rebase','--no-autostash','origin','main')
              pa=p.git(private,penv,'rev-parse','HEAD').stdout.strip()
              current={}
              for path in p.READMES:
                  value=p.git(private,penv,'rev-parse','--verify','HEAD:'+path,check=False)
                  current[path]=value.stdout.strip() if value.returncode==0 else None
              expected=request['private_rule_sync_expected_blobs']
              changed=current!=expected
              immediate=bool(p.git(private,penv,'diff','--name-only',pb,pa,'--',*p.READMES).stdout.strip())
              rows=[line for line in (private/'QUEUE.md').read_text().splitlines()
                  if '`topics/visible-flex-new-mechanism`' in line]
              correct=len(rows)==1 and '进行中' in rows[0] and 'Astra-new-mechanism-9974ea84' in rows[0]
              status={'actual_git_pull':True,'repository':'Rogerhu12/math-research',
                  'at_utc':datetime.now(timezone.utc).isoformat(),'before':pb,'after':pa,
                  'readme_blobs':current,'readmes_unchanged_since_recorded':not changed,
                  'readmes_unchanged_during_this_pull':not immediate,'queue_unique_and_ongoing_for_this_session':correct,
                  'private_contents_not_published':True}
              p.write_json(out/'pre-research-private-pull.json',status)
              if changed or immediate:
                  raise SystemExit('Private README changed: read its private diff and apply it before continuing')
              if not correct: raise SystemExit('Private QUEUE needs the authorized topic status update')
              print(json.dumps(status))
          PY
