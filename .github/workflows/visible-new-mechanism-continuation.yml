              if len(outputs)!=1 or outputs[0]['raw_sha256']!=observed['output_sha256']:
                  raise SystemExit('previous development output identity differs')
              # The request records the root's direct reading of passed:true in
              # this completed job log. The metadata receipt alone is not a pass.
              stages=['research']
              print(json.dumps({'previous_passed_stdout_observed_in_job':observed['job'],
                  'unchanged_development_reused_from':observed['run'],
                  'old_artificial_checks_repeated':False,
                  'metadata_hash_alone_is_not_a_development_pass':True}))
