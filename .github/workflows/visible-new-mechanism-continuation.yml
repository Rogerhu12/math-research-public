name: visible-new-mechanism continuing public research
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-continuation.json
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      lanes: ${{ steps.lanes.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /topics/visible-flex-new-mechanism/computations/request-continuation.json
      - id: lanes
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('topics/visible-flex-new-mechanism/computations/request-continuation.json').read_text())
          lanes=r['lanes']
          allowed={'local_fourth_quotient','curvature_epigraph_exchange','full_m8_tail_response_projection',
              'curvature_output_recovery','constrained_static_fourth','curvature_trial_diagnostics',
              'static_g_rational_dual','static_m8_tail_quotient','curvature_feasible_exchange',
              'constrained_static_m8_tail_quotient','g_first_translation',
              'local_fourth_derivative_factors','curvature_feasible_trial_diagnostics','g_second_translation','derivative_m8_tail_quotient',
              'derivative_m8_geometry_ibp','g_translation_successor','curvature_feasible_steps','acceleration_layer_mixed','general_pure_G_identity','curvature_mixed_grid_steps','general_pure_J_identity','h_axis_sharp','general_pure_J_membership','curvature_target_ladder','D0_pivot_residual','general_pure_D0_membership','curvature_soc_steps','general_pure_J6_membership','J6_balanced_original_difference','curvature_inherited_scale','J6_implicit43_original_separation','curvature_soc_arc','character_head_minus2','curvature_soc_metric_reserve','character_minus2_finite_necessary','metric_budget_recovery','character_minus2_static_parity','metric_spectral_recovery','character_minus2_static_positive_candidate','character_head_literal_relations','character_minus2_literal_relation_cuts','metric_spectral_adaptive','character_minus2_raw_positive_candidate','metric_spectral_curvature_reserve','metric_spectral_physical_penalty','metric_spectral_trust_growth','derivative_packet_full_width_gate','character_head_word_relations','character_head_zero','character_zero_pure_readout','metric_spectral_strip_reserve','pure_minus2_archived_projection','complete_pure_minus6_projection','metric_spectral_soc_scaling','complete_pure_minus4_projection','metric_entry_body103','metric_entry_tail154','metric_entry_tail_height159','metric_height159_soc_hold',
              'exceptional_port_two_energy_gate','character_zero_endpoint_layer','character_zero_quadratic_endpoint','third_diagonal_eight_lifts'}
          if not lanes or len(lanes)>2 or len(lanes)!=len(set(lanes)) or any(x not in allowed for x in lanes):
              raise SystemExit('Invalid bounded continuation request')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('value='+json.dumps(lanes,separators=(',',':'))+'\n')
          print(json.dumps({'request':r['request'],'lanes':lanes}))
          PY
  search:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.lanes) }}
    name: Continue ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: visible-new-mechanism-${{ matrix.lane }}
      cancel-in-progress: false
