name: visible-exact weighted actual-cap inner Poisson difference

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-weighted-actual-cap-poisson-difference.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-weighted-actual-cap-poisson-difference
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  FEEDBACK_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-weighted-actual-cap-poisson-difference-CI-inputs.json
  FEEDBACK_MANIFEST_SHA: fc5acb986c2f8c55e9f6bd25a093a8d9e0594890ad8fbf24175e46e74abe001c
  FEEDBACK_PIPELINE_SHA: c8aaace95295a58d761d1b74422a38d1de721fdf7fd27867b8a7c4e87e88c5b1
  FEEDBACK_WORKER_SHA: df8c44b55c231f06865294d5c2580e3daa85a540f3b44ed73f7d8c3d353d17b5
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  weighted-actual-cap-poisson-difference:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_weighted_actual_cap_poisson_difference_ci.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-weighted-actual-cap-poisson-difference-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_weighted_actual_cap_poisson_difference_ci.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['FEEDBACK_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_weighted_actual_cap_poisson_difference_ci.py --mode hydrate
          --manifest "$FEEDBACK_MANIFEST" --manifest-sha "$FEEDBACK_MANIFEST_SHA"
          --pipeline-sha "$FEEDBACK_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new source before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_weighted_actual_cap_poisson_difference.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['FEEDBACK_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the identical completed scientific runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5 scipy==1.17.0
      - name: Consume three completed small records and evaluate weighted inner cap difference
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_weighted_actual_cap_poisson_difference_ci.py --mode run
          --manifest "$FEEDBACK_MANIFEST" --manifest-sha "$FEEDBACK_MANIFEST_SHA"
          --pipeline-sha "$FEEDBACK_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-weighted-actual-cap-poisson-difference-science"
          --out-dir "$RUNNER_TEMP/visible-exact-weighted-actual-cap-poisson-difference-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
