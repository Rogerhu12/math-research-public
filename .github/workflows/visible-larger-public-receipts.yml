name: visible-larger original receipt readback

on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-receipt-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: visible-larger-public-receipts
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43623850723-1-twelvequeryqr/
      - name: Bound maintenance and establish independent receipt output
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          mkdir -p "$RUNNER_TEMP/visible-mainline/receipts"
          echo "VISIBLE_OUT=$RUNNER_TEMP/visible-mainline/receipts" >> "$GITHUB_ENV"
          echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Bind the requested read-only sources
        id: select
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          c = Path(os.environ['VISIBLE_COMPUTATIONS'])
          r = json.loads((c/'public-receipt-request.json').read_text())
          if r['repository'] != 'Rogerhu12/math-research-public':
              raise ValueError('Use the designated public repository')
          requested = r['readers']
          allowed = {'request42', 'stage43fields'}
          if not requested or len(set(requested)) != len(requested) or any(x not in allowed for x in requested):
              raise ValueError('Select only declared original receipt readers')
          for name, digest in r['source_sha256'].items():
              if Path(name).name != name or hashlib.sha256((c/name).read_bytes()).hexdigest() != digest:
                  raise ValueError('Pinned source changed: '+name)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('request42='+str('request42' in requested).lower()+'\n')
              out.write('stage43fields='+str('stage43fields' in requested).lower()+'\n')
          (Path(os.environ['VISIBLE_OUT'])/'receipt-read-intent.json').write_text(
              json.dumps(dict(request=r, actual_source_commit=os.environ['GITHUB_SHA'],
                  current_run=os.environ['GITHUB_RUN_ID'], scientific_evaluations=0), indent=2)+'\n')
          PY
          python -m py_compile "$VISIBLE_COMPUTATIONS/geometry_20261114_request42_receipt_summary_v2.py" "$VISIBLE_COMPUTATIONS/geometry_20261114_native_stage43_field_receipt.py"
      - name: Copy only existing request42 metadata and preserve any failure receipt
        if: steps.select.outputs.request42 == 'true'
        continue-on-error: true
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_request42_receipt_summary_v2.py" \
            --receipt-dir "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43623850723-1-twelvequeryqr" \
            --out "$VISIBLE_OUT/request42-receipt-summary-v2.json" \
            > "$VISIBLE_OUT/request42-reader.log" 2>&1
      - name: Fetch the original actual41 artifact without rerunning its computation
        id: capture41
        if: steps.select.outputs.stage43fields == 'true'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_fetch_pinned_rawcell0_steps.py" \
            --run-id 43622149326 --artifact-id 14124209116 \
            --artifact-name visible-mainline-rawcell0steps-43622149326-1 \
            --expected-size 349636774 \
            --expected-sha256 356d9d81959739a22e9347d7ceba6fd4880ad61db70dca73096a4c5b71dc73a8 \
            --out "$RUNNER_TEMP/actual41-receipt-input-${{ github.run_id }}-${{ github.run_attempt }}"
          cp "$RUNNER_TEMP/actual41-receipt-input-${{ github.run_id }}-${{ github.run_attempt }}/_pinned_public_artifact_receipt.json" "$VISIBLE_OUT/actual41-artifact-fetch-receipt.json"
      - name: Copy all four saved original fields of stage43 step11
        if: steps.capture41.outcome == 'success' && steps.select.outputs.stage43fields == 'true'
        continue-on-error: true
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_native_stage43_field_receipt.py" \
            --capture-dir "$RUNNER_TEMP/actual41-receipt-input-${{ github.run_id }}-${{ github.run_attempt }}/native-rawcell0-step-capture" \
            --out "$VISIBLE_OUT/stage43-step11-fields.json" \
            > "$VISIBLE_OUT/stage43-reader.log" 2>&1
      - name: Preserve original receipt summaries and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-mainline-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visible-mainline/receipts/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded outputs with ordinary pull rebase and README checks
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u "$VISIBLE_COMPUTATIONS/root_20261114_publish_actions.py" --results "$VISIBLE_OUT" --lane receipts
