name: visible-exact per-index strict flux mean

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-per-index-strict-flux-mean.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-per-index-strict-flux-mean
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  EXPECTED_WORKER_SHA: '3770e29dbb2becd615227c1ceceaf7c9a34cf585a705deeed75465dc02594d8e'
  EXPECTED_MANIFEST_SHA: '909b8961925002c5be688a5e1776e8283184b5b07300ab308315e854775c53ec'

jobs:
  one-new-target:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Partially check out the frozen operational inputs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_relative_phase_pullback_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-16-R133-per-index-strict-flux-mean-current-inputs.json
      - name: Set up the directed runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the one directed dependency
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Verify the complete worker and manifest before execution
        run: |
          python - <<'PY_FROZEN'
          import ast, hashlib, os
          from pathlib import Path
          for relative, name in [
              ("topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_relative_phase_pullback_public_worker.py", "EXPECTED_WORKER_SHA"),
              ("topics/visible-flex-exact-nearby/notes/2026-11-16-R133-per-index-strict-flux-mean-current-inputs.json", "EXPECTED_MANIFEST_SHA"),
          ]:
              raw = Path(relative).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[name]:
                  raise RuntimeError("frozen input changed: " + relative)
              raw.decode("utf-8")
              if relative.endswith(".py"):
                  ast.parse(raw.decode("utf-8"), filename=relative)
          print("Complete frozen operational inputs verified; no scientific function called.")
          PY_FROZEN
      - name: Read eight complete originals and run fifty-two new strict mean targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_relative_phase_pullback_public_worker.py \
            --repo "$GITHUB_WORKSPACE" \
            --manifest topics/visible-flex-exact-nearby/notes/2026-11-16-R133-per-index-strict-flux-mean-current-inputs.json \
            --manifest-sha "$EXPECTED_MANIFEST_SHA"
