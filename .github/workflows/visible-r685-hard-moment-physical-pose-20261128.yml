name: visible-flex bowed endpoint hard moment and finite pose
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r685-hard-moment-physical-pose-20261128.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r685-hard-moment-physical-pose-20261128
  cancel-in-progress: false
jobs:
  research:
    name: Solve bowed endpoint response with physical bending cost
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/visible-r685-hard-moment-physical-pose-20261128.yml
            /README.md
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r685-hard-moment-physical-pose-20261128.json
            /topics/visible-flex-new-mechanism/scripts/r685_hard_moment_physical_pose_20261128.py
            /topics/visible-flex-new-mechanism/scripts/r675_bowed_endpoint_pose_response_20261128.py
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/computations/r685-hard-moment-physical-pose-20261128.json
            /topics/visible-flex-new-mechanism/computations/r675-natural-five-responses-for-r685-20261128.json
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r685-hard-moment-physical-pose-scope.md
            /topics/visible-flex-new-mechanism/results/R685-small-unit-pose-strain-with-exact-moment-and-diverging-bending-cost.md
            /topics/visible-flex-new-mechanism/results/R673-thick-bowed-tilted-endpoint-metric-with-strict-intrinsic-chord-slack.md
            /topics/visible-flex-new-mechanism/results/R675-central-bending-moment-for-an-infinitesimal-bowed-endpoint-tilt.md
            /topics/visible-flex-new-mechanism/results/R662-tilted-two-plane-global-tube-and-offset-cap-clearance.md
            /topics/visible-flex-new-mechanism/results/R655-offset-rigid-cap-and-thick-inner-hold.md
            /topics/visible-flex-new-mechanism/results/R679-elliptic-sign-separates-material-reflections-of-any-nonplanar-flat-rim-annulus.md
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r675-bowed-endpoint-response-natural-terminal.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull current rules and evaluate the new finite input
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r685-hard-moment-physical-pose-20261128.json
          --lane hard-moment-pose
