name: Serre p41 original Hodge and period input

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R745-public-p41-Hodge-input-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R745-p41-original-Hodge-input
  cancel-in-progress: false

jobs:
  actual_Hodge_input:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-Hodge-input.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R745_p41_original_Hodge_input.py
            /topics/serre-uniformity/scripts/R745_public_Hodge_input.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R745-public-p41-Hodge-input-request.json
            /topics/serre-uniformity/notes/R745-p41-original-Hodge-input-method.md
            /topics/serre-uniformity/results/R575-correct-actual-sixfold-CM-deck-and-cubic-twist.md
            /topics/serre-uniformity/results/R586-actual-c0-marking-and-six-torsion-kernel.md
            /topics/serre-uniformity/results/R592-actual-integral-CM-jet-lattice-and-complete-tail.md
            /topics/serre-uniformity/results/R616-original-CM-point-difference-and-explicit-height-basis.md
            /topics/serre-uniformity/results/R732-original-CM-period-kernel-and-bounded-rational-function-recovery.md
            /topics/serre-uniformity/results/R738-certified-original-p41-period-input.md
            /topics/serre-uniformity/results/R742-unramified-original-first-jets-and-depth-seven-Abel-isometry.md
            /topics/serre-uniformity/computations/R717-original-CM-norm-p41/43597163388-1/R717-exact-original-CM-norm.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Reuse the original cycles and compute the marked Hodge input
        continue-on-error: true
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R745_public_Hodge_input.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R745-p41-original-Hodge-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R745-p41-original-Hodge-input
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve complete or failed exact outputs
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R745_public_Hodge_input.py publish
      - name: Require the original Hodge and finite period input
        if: always()
        run: python topics/serre-uniformity/scripts/R745_public_Hodge_input.py verify
