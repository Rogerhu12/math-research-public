name: visible-flex R571 phase core shooting and unit-core field
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r571-phase-core-shooting-20261126.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r571-phase-core-shooting-20261126
  cancel-in-progress: false
jobs:
  research:
    name: R571 phase zero, core shooting, and unit-core C2 cost
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-r571-phase-core-shooting-20261126.yml
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r571-phase-core-shooting-20261126.json
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r571_milder_seed_outer_jets_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r571_phase_core_shooting_20261126.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull current rules and solve the declared phase shooting problem
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r571-phase-core-shooting-20261126.json
          --lane r571-phase-core
      # The shared entry actually pulls both repositories and checks rules.
      # Credentials are removed before the scientific child starts.
      # One job pays the phase-zero diagnostics, the true core shooting,
      # phase sensitivity, unit-core field costs, and finite mode probes.
      # No raw arrays, artifacts, releases, Git writes, or cross-run caches.
