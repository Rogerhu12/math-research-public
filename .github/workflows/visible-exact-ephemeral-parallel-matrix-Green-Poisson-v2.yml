name: visible-exact ephemeral parallel matrix Green Poisson v2

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_ephemeral_parallel_matrix_Green_Poisson_v2.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_ephemeral_parallel_matrix_Green_Poisson_CI_v2.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-15-R133-ephemeral-parallel-matrix-Green-Poisson-CI-inputs-v2.json'
      - '.github/workflows/visible-exact-ephemeral-parallel-matrix-Green-Poisson-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-ephemeral-parallel-matrix-Green-Poisson-v2
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  EPHEMERAL_MANIFEST: 'topics/visible-flex-exact-nearby/notes/2026-11-15-R133-ephemeral-parallel-matrix-Green-Poisson-CI-inputs-v2.json'
  EPHEMERAL_MANIFEST_SHA: '81fcf32f039a1d2985edce29d54302925bb0b2cfce65cfee33c9dd099f1824ed'
  EPHEMERAL_WORKER_SHA: '53d672d2e75ce9519615ea0251c5567a4931af15248ded418ebc5717d2de425a'
  CURRENT_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-reviewed-public-CI-rules-reproducible-data.json
  CURRENT_RULES_SHA: f2661bd5cf5cb006c1f78c64126b3ac065e6bc26a50790545ac443efb5e372bd
  ORIGINAL_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  complete:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Make temporary room for the original immutable arrays and three new streams
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Partially check out only current scripts, rules and small parameters
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-ephemeral-parallel-matrix-Green-Poisson-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-ephemeral-v1-original-event-hash-failure.md
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-ephemeral-parallel-matrix-Green-Poisson-CI-inputs-v2.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-reviewed-public-CI-rules-reproducible-data.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-ephemeral-parallel-matrix-Green-Poisson-contract.md
      - name: Install the exact pinned Python interpreter
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Parse the exact new source and worker before restoring or calculating anything
        run: |
          python - <<'PY_SYNTAX'
          import ast,hashlib,json,pathlib
          expected={
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_ephemeral_parallel_matrix_Green_Poisson_v2.py':'f33345d1ab2500fd3811692311ce931606e389cf3c8ef508925d225748565190',
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_ephemeral_parallel_matrix_Green_Poisson_CI_v2.py':'53d672d2e75ce9519615ea0251c5567a4931af15248ded418ebc5717d2de425a',
              'topics/visible-flex-exact-nearby/notes/2026-11-15-R133-ephemeral-parallel-matrix-Green-Poisson-CI-inputs-v2.json':'81fcf32f039a1d2985edce29d54302925bb0b2cfce65cfee33c9dd099f1824ed',
              'topics/visible-flex-exact-nearby/notes/2026-11-15-R133-ephemeral-parallel-matrix-Green-Poisson-contract.md':'b3bcba13213afdf678cd87a6f2d92d4b78995809febdc0fd9e39e6a694d774a1',
          }
          for name,sha in expected.items():
              raw=pathlib.Path(name).read_bytes()
              if hashlib.sha256(raw).hexdigest()!=sha:
                  raise ValueError('One exact new text changed: '+name)
              if name.endswith('.py'):ast.parse(raw.decode(),filename=name)
              if name.endswith('.json'):json.loads(raw)
          print('Exact text syntax/hash verified; no old or new mathematical producer ran.')
          PY_SYNTAX
      - name: Install the original pinned directed-arithmetic packages
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Consume original successful prefix and finish three streams plus both contractions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_ephemeral_parallel_matrix_Green_Poisson_CI_v2.py
          --manifest "$EPHEMERAL_MANIFEST" --manifest-sha "$EPHEMERAL_MANIFEST_SHA"
          --worker-sha "$EPHEMERAL_WORKER_SHA"
          --rules "$CURRENT_RULES" --rules-sha "$CURRENT_RULES_SHA"
          --driver-sha "$ORIGINAL_DRIVER_SHA"
          --matrix-run 43654510038 --matrix-attempt 1 --bits 192
          --work "$RUNNER_TEMP/visible-exact-ephemeral-matrix-v2-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-ephemeral-matrix-v2-process"
          --compute-minutes 340 --checkpoint-minutes 10
      - name: Print the actual small process outcome without uploading new recomputable output
        if: always()
        env:
          TEMPORARY_PROCESS: ${{ runner.temp }}/visible-exact-ephemeral-matrix-v2-process/process.json
        run: |
          python - <<'PY_RESULT'
          import json,os,pathlib
          p=pathlib.Path(os.environ['TEMPORARY_PROCESS'])
          if not p.is_file():
              print('No mathematical child process exists; inspect the actual earlier setup step.')
          else:
              d=json.loads(p.read_bytes())
              keys=('complete','failure','publication_failure','actual_scientific_complete',
                    'actual_scientific_failure','actual_output_sha256','exact_old_future_prefix',
                    'actual_temporary_progress','last_read_commit','new_recomputable_repository_data',
                    'new_Release_uploads','new_Actions_artifacts')
              out={k:d[k] for k in keys if k in d}
              out['actual_child_returns']=[{'label':c['label'],'actual_returncode':c.get('actual_returncode')}
                  for c in d.get('children',[])]
              out['actual_last_readme_check']=d.get('readme_checks',[])[-1:] or None
              print(json.dumps(out,ensure_ascii=False))
          PY_RESULT
