name: Rank2 original H22 complete CM source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rank2-sha-original-h22-cm.yml'
      - 'topics/rank2-sha-infinitely-many-p/scripts/check-r863-original-h22-full-cm-source.py'
      - 'topics/rank2-sha-infinitely-many-p/ci/original-h22-cm-request.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rank2-original-h22-cm
  cancel-in-progress: false
jobs:
  original-h22:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/rank2-sha-infinitely-many-p/README.md
            /topics/rank2-sha-infinitely-many-p/scripts/check-r863-original-h22-full-cm-source.py
            /topics/rank2-sha-infinitely-many-p/scripts/check-r732-original-type-five-cm13.py
            /topics/rank2-sha-infinitely-many-p/scripts/check-r464-degree102-cm7-exact.py
            /topics/rank2-sha-infinitely-many-p/ci/original-h22-cm-request.json
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed exact arithmetic dependency
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Compute the complete original H22 CM operators
        shell: bash
        env:
          GITHUB_ACTIONS: 'true'
          RANK2_SOURCE_SHA: ${{ github.sha }}
          RANK2_RUN_ID: ${{ github.run_id }}
          RANK2_RUN_ATTEMPT: ${{ github.run_attempt }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          export RANK2_ROOT_README_SHA="$(git rev-parse HEAD:README.md)"
          export RANK2_TOPIC_README_SHA="$(git rev-parse HEAD:topics/rank2-sha-infinitely-many-p/README.md)"
          timeout 3000 python topics/rank2-sha-infinitely-many-p/scripts/check-r863-original-h22-full-cm-source.py --workers=4
