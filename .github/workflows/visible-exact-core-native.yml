name: visible exact core paid-low replay
on:
  push:
    branches:
      - visible-exact-core-native-20261112-f6a2
    paths:
      - .github/workflows/visible-exact-core-native.yml
      - topics/visible-flex-exact-nearby/scripts/fourfold_phase_low_feedback_paid_inputs.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-core-paid-low
  cancel-in-progress: false

jobs:
  paid-low:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned mathematical runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0 sympy==1.14.0
      - name: Replay exact finite block and paid fees
        id: replay
        continue-on-error: true
        working-directory: topics/visible-flex-exact-nearby
        run: |
          python scripts/fourfold_phase_low_feedback_paid_inputs.py \
            --bits 256 \
            --out notes/2026-11-12-actual-low-feedback-paid-cap-interface-M4.json \
            > notes/2026-11-12-low-feedback-paid-CI.log 2>&1
          cat notes/2026-11-12-low-feedback-paid-CI.log
      - name: Record execution provenance
        if: always()
        env:
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        working-directory: topics/visible-flex-exact-nearby
        run: |
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          root=Path('.')
          names=['scripts/fourfold_phase_low_feedback_paid_inputs.py',
                 'notes/2026-11-12-actual-low-feedback-paid-cap-interface-M4.json',
                 'notes/2026-11-12-actual-low-feedback-paid-cap-interface-M4.npz',
                 'notes/2026-11-12-low-feedback-paid-CI.log']
          files=[dict(path=n,sha256=hashlib.sha256((root/n).read_bytes()).hexdigest(),
                      bytes=(root/n).stat().st_size) for n in names if (root/n).exists()]
          result=dict(kind='remote_replay_execution_receipt',run_id=os.environ['GITHUB_RUN_ID'],
                      triggering_commit=os.environ['GITHUB_SHA'],outcome=os.environ['REPLAY_OUTCOME'],
                      python=platform.python_version(),files=files,
                      mathematical_scope='Only the source report defines successful mathematical claims; an execution receipt alone proves none.')
          Path('notes/2026-11-12-low-feedback-paid-CI-receipt.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visible-exact-core-paid-low-${{ github.run_id }}
          retention-days: 30
          path: |
            topics/visible-flex-exact-nearby/notes/2026-11-12-actual-low-feedback-paid-cap-interface-M4.*
            topics/visible-flex-exact-nearby/notes/2026-11-12-low-feedback-paid-CI*
      - name: Preserve generated report on this research branch
        if: always()
        env:
          TARGET_BRANCH: visible-exact-core-native-20261112-f6a2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in topics/visible-flex-exact-nearby/notes/2026-11-12-actual-low-feedback-paid-cap-interface-M4.json \
                      topics/visible-flex-exact-nearby/notes/2026-11-12-actual-low-feedback-paid-cap-interface-M4.npz \
                      topics/visible-flex-exact-nearby/notes/2026-11-12-low-feedback-paid-CI.log \
                      topics/visible-flex-exact-nearby/notes/2026-11-12-low-feedback-paid-CI-receipt.json
          do
            if test -f "$path"; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record actual remote paid-low replay and complete provenance"
          for attempt in 1 2 3 4 5 6 7 8
          do
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            git fetch origin "$TARGET_BRANCH"
            git rebase FETCH_HEAD
          done
          exit 1
      - name: Require successful replay
        if: always()
        env:
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        run: test "$REPLAY_OUTCOME" = success
