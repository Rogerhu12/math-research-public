name: visible-flex finite height with exact knot insertion
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r576-exact-knot-20261126.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r576-exact-knot-20261126
  cancel-in-progress: false
jobs:
  research:
    name: Paid height state with exact-knot trial control
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-r576-exact-knot-20261126.yml
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r576-exact-knot-20261126.json
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r576_exact_knot_height_continuation_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r576_function_space_continuation_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r576_finite_height_turning_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r571_milder_seed_outer_jets_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r571_nonmonotone_connector_gain_20261126.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull current rules and insert actual radial knots
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r576-exact-knot-20261126.json
          --lane r576-exact-knot
      # Every imported research source is hash-bound and sparse included.
      # Reuse paid 68q, inner Riccati states, and H; exact knot mapping precedes new solves.
      # No raw arrays, artifacts, releases, Git writes, or cross-run caches.


