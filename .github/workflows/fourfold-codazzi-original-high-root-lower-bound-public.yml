name: R138 complete original high root lower bound

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-original-high-root-lower-bound-public.yml

permissions:
  contents: write

concurrency:
  group: r138-original-high-root-lower-bound-v1
  cancel-in-progress: false

jobs:
  complete-original-high-root:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_original_high_root_lower_bound_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-20-R138-original-high-root-lower-bound-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the fixed directed runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5
      - name: Restore original bytes and enclose the complete original high block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_original_high_root_lower_bound_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-20-R138-original-high-root-lower-bound-inputs.json --manifest-sha 5a33312d1b738abd3a8d4686244c33298167181b41e926212433a48dc09e783e
