name: visible-exact complex inner-root first Airy forcing

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-complex-inner-root-first-Airy-forcing.yml']
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Optional exact complex-root forcing run whose accepted derivatives, coefficient budget and cases will be reused'
        required: false
        type: string
        default: ''
      resume_attempt:
        description: 'Original attempt for the optional exact prefix artifact'
        required: false
        type: string
        default: '1'

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complex-inner-root-first-Airy-forcing
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complex-inner-root-first-Airy-forcing-CI-inputs.json
  PHASE_MANIFEST_SHA: 4d76f6f1379fde842a9c58ec30943e0af463d1e34e0b5b9dd709c3c0c9791a73
  PHASE_PIPELINE_SHA: e1e9765bcdd0e1669942da3899646638b16ad84dc70a7fd53973abeb65e65739
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-complex-inner-root-first-Airy-forcing:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complex_inner_root_first_Airy_forcing_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complex-inner-root-first-Airy-forcing-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate22 exact original receipts, root cubics and complex forcing sources
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complex_inner_root_first_Airy_forcing_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the two new scientific entry points without running mathematics
        run: |
          python - <<'PY_SOURCE'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_complex_inner_root_first_Airy_forcing.py','fourfold_codazzi_complex_inner_root_first_Airy_forcing_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          PY_SOURCE
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5
      - name: Set the actual result path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-complex-inner-root-first-Airy-forcing-output" >> "$GITHUB_OUTPUT"
      - name: Prepare a separate optional prefix directory
        run: mkdir -p "$RUNNER_TEMP/visible-exact-complex-inner-root-first-Airy-forcing-prepared"
      - name: Restore an explicitly selected exact derivative and forcing prefix
        if: ${{ inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-complex-inner-root-first-Airy-forcing-${{ inputs.resume_run }}-${{ inputs.resume_attempt }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-complex-inner-root-first-Airy-forcing-prepared/resume
      - name: Reuse exact old native values; evaluate new cubic derivatives and complex forcing cases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complex_inner_root_first_Airy_forcing_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-complex-inner-root-first-Airy-forcing-science"
          --prepared "$RUNNER_TEMP/visible-exact-complex-inner-root-first-Airy-forcing-prepared"
          --out-dir "$RUNNER_TEMP/visible-exact-complex-inner-root-first-Airy-forcing-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-complex-inner-root-first-Airy-forcing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
