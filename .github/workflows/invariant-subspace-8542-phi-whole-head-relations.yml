name: ISP 8542 whole Phi H42 H19 Cstar exact new head relations
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isp-8542-phi-whole-head-relations
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ISP_PIN: ${{ github.sha }}
      ISP_FILE: 2026-11-28-unit211-Phi-zero-whole-NSPS-head-exact-H19-highest-relations-8542.py
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FLINT_NUM_THREADS: '1'
    steps:
      - name: Prepare exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Pinned FLINT arithmetic
        run: python -m pip install --quiet python-flint==0.9.0
      - name: New exact original input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-equal-six-cofactors"
          cd "$RUNNER_TEMP/isp-equal-six-cofactors"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          timeout 120s git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          ISP_SOURCE_PATH="topics/invariant-subspace-problem/notes/$ISP_FILE"
          ISP_BLOB="$(git rev-parse "$ISP_PIN:$ISP_SOURCE_PATH")"
          git show "$ISP_PIN:$ISP_SOURCE_PATH" > "$RUNNER_TEMP/isp-equal-six-source.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-27-focused-exact-actions-driver-8542.py" > "$RUNNER_TEMP/isp-equal-six-driver.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-load-historical-input-8542.py" > "$RUNNER_TEMP/isp-history-loader.py"
          python "$RUNNER_TEMP/isp-history-loader.py" --repo "$PWD" --ref "$ISP_PIN" --path "topics/invariant-subspace-problem/notes/2026-11-28-unit211-Phi-zero-centered-original-NSPS-cofactor-content-and-leading-support-8542.py" --output "$RUNNER_TEMP/2026-11-28-unit211-Phi-zero-centered-original-NSPS-cofactor-content-and-leading-support-8542.py"
          python "$RUNNER_TEMP/isp-history-loader.py" --repo "$PWD" --ref "$ISP_PIN" --path "topics/invariant-subspace-problem/notes/2026-11-28-unit211-Phi-zero-slope-full-original-values-twelve-new-rows-eighteen-two-model-8542.py" --output "$RUNNER_TEMP/2026-11-28-unit211-Phi-zero-slope-full-original-values-twelve-new-rows-eighteen-two-model-8542.py"
          python "$RUNNER_TEMP/isp-history-loader.py" --repo "$PWD" --ref "$ISP_PIN" --path "topics/invariant-subspace-problem/notes/2026-11-28-unit211-Phi-zero-original-N1-slope-exact-six-by-two-mean-presentation-8542.py" --output "$RUNNER_TEMP/2026-11-28-unit211-Phi-zero-original-N1-slope-exact-six-by-two-mean-presentation-8542.py"
          python "$RUNNER_TEMP/isp-history-loader.py" --repo "$PWD" --ref "$ISP_PIN" --path "topics/invariant-subspace-problem/notes/2026-11-27-unit211-Phi-zero-first-quadratic-head-three-original-rows-D-input-8542.py" --output "$RUNNER_TEMP/2026-11-27-unit211-Phi-zero-first-quadratic-head-three-original-rows-D-input-8542.py"
          python "$RUNNER_TEMP/isp-history-loader.py" --repo "$PWD" --ref "$ISP_PIN" --path "topics/invariant-subspace-problem/notes/2026-11-28-unit211-Phi-zero-whole-highest-support-and-P6-head-exact-intersection-8542.py" --output "$RUNNER_TEMP/2026-11-28-unit211-Phi-zero-whole-highest-support-and-P6-head-exact-intersection-8542.py"
          python "$RUNNER_TEMP/isp-history-loader.py" --repo "$PWD" --ref "$ISP_PIN" --path "topics/invariant-subspace-problem/notes/2026-11-28-unit211-Phi-zero-whole-first-head-original-NV-F6-highest-unit-filtered-lift-8542.py" --output "$RUNNER_TEMP/2026-11-28-unit211-Phi-zero-whole-first-head-original-NV-F6-highest-unit-filtered-lift-8542.py"
          python "$RUNNER_TEMP/isp-history-loader.py" --repo "$PWD" --ref "$ISP_PIN" --path "topics/invariant-subspace-problem/notes/2026-11-27-unit211-Phi-zero-first-quadratic-head-actual-D-core-exact-input-8542.json" --output "$RUNNER_TEMP/2026-11-27-unit211-Phi-zero-first-quadratic-head-actual-D-core-exact-input-8542.json"
          python -u "$RUNNER_TEMP/isp-equal-six-driver.py" --checkout "$PWD" --source "$RUNNER_TEMP/isp-equal-six-source.py" --expected-blob "$ISP_BLOB" --seconds 135
