name: visible-flex actual fixed metric bowed pose continuation
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r691-same-metric-bowed-pose-continuation-20261128.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r691-same-metric-bowed-pose-continuation-20261128
  cancel-in-progress: false
jobs:
  research:
    name: Continue the actual finite bowed pose on the same material metric
    runs-on: ubuntu-24.04
    timeout-minutes: 57
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/visible-r691-same-metric-bowed-pose-continuation-20261128.yml
            /README.md
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r691-same-metric-bowed-pose-continuation-20261128.json
            /topics/visible-flex-new-mechanism/scripts/r691_same_metric_bowed_pose_continuation_20261128.py
            /topics/visible-flex-new-mechanism/scripts/r685_hard_moment_physical_pose_20261128.py
            /topics/visible-flex-new-mechanism/scripts/r675_bowed_endpoint_pose_response_20261128.py
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/computations/r691-same-metric-bowed-pose-continuation-20261128.json
            /topics/visible-flex-new-mechanism/computations/r685-natural-finite-correction-for-r691-20261128.json
            /topics/visible-flex-new-mechanism/results/R691-physical-full-derivative-for-continuing-the-actual-fixed-bowed-pose.md
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r691-same-metric-bowed-pose-continuation-scope.md
            /topics/visible-flex-new-mechanism/results/R685-small-unit-pose-strain-with-exact-moment-and-diverging-bending-cost.md
            /topics/visible-flex-new-mechanism/results/R673-thick-bowed-tilted-endpoint-metric-with-strict-intrinsic-chord-slack.md
            /topics/visible-flex-new-mechanism/results/R679-elliptic-sign-separates-material-reflections-of-any-nonplanar-flat-rim-annulus.md
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r685-hard-moment-fixed-pose-natural-terminal.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull current rules and evaluate the new finite input
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r691-same-metric-bowed-pose-continuation-20261128.json
          --lane same-metric-finite-pose
