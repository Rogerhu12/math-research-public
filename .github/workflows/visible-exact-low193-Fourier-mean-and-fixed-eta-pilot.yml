name: visible-exact low193 Fourier mean and fixed eta source diagnostic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-low193-Fourier-mean-and-fixed-eta-pilot.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-low193-Fourier-mean-and-fixed-eta-pilot
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PILOT_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-low193-Fourier-mean-and-fixed-eta-pilot-CI-inputs.json
  PILOT_MANIFEST_SHA: f0fae9a54a8a5655b81c0721bee613e45b4efbbc8549f284317e5ae680449bb8
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  selected-Fourier-mean-and-fixed-eta-diagnostic:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 60
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the immutable original source and new consumer
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-low193-Fourier-mean-and-fixed-eta-pilot-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate the exact old body inputs and separately pinned new source
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$PILOT_MANIFEST" --manifest-sha "$PILOT_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/low193_Fourier_mean_fixed_eta_ci/
      - name: Check the new exact Python source syntax without running mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_low193_Fourier_mean_and_fixed_eta_pilot.py','fourfold_codazzi_low193_Fourier_mean_and_fixed_eta_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('New selected source-projection files passed Python AST parsing; no mathematics executed.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible original artifact and actual output paths
        id: paths
        run: |
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-low193-original-prepared" >> "$GITHUB_OUTPUT"
          printf 'previous=%s\n' "$RUNNER_TEMP/visible-exact-low193-original-rows" >> "$GITHUB_OUTPUT"
          printf 'body=%s\n' "$RUNNER_TEMP/visible-exact-low193-original-body-mean" >> "$GITHUB_OUTPUT"
          printf 'repair=%s\n' "$RUNNER_TEMP/visible-exact-low193-original-repair-source" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-low193-Fourier-mean-fixed-eta-output" >> "$GITHUB_OUTPUT"
      - name: Reuse the actual original complete trial bundle without reconstructing it
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43583838026
          name: visible-exact-body-prepared-43583838026-1
          path: ${{ steps.paths.outputs.prepared }}
      - name: Receive the eight original complete disjoint residual row artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43583838026
          pattern: visible-exact-body-rows-*-43583838026-1
          merge-multiple: false
          path: ${{ steps.paths.outputs.previous }}
      - name: Receive the actual complete original body and both scalar means
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43586413510
          name: visible-exact-body-complete-mean-43586413510-1
          path: ${{ steps.paths.outputs.body }}
      - name: Receive the already completed complete repair-source artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43597921732
          name: visible-exact-complete-response-repair-source-43597921732-1
          path: ${{ steps.paths.outputs.repair }}
      - name: Certify the new direct Fourier source and fixed eta subcells with real ten minute README checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_low193_Fourier_mean_and_fixed_eta_CI.py
          --manifest "$PILOT_MANIFEST" --manifest-sha "$PILOT_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --prepared "$RUNNER_TEMP/visible-exact-low193-original-prepared"
          --previous-artifacts "$RUNNER_TEMP/visible-exact-low193-original-rows"
          --body-artifact "$RUNNER_TEMP/visible-exact-low193-original-body-mean"
          --repair-artifact "$RUNNER_TEMP/visible-exact-low193-original-repair-source"
          --work "$RUNNER_TEMP/visible-exact-low193-Fourier-mean-fixed-eta-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-low193-Fourier-mean-fixed-eta-output"
          --compute-minutes 40 --checkpoint-minutes 10
      - name: Require actual nonempty evidence before artifact publication
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          (root/'artifact-inventory.json').write_text(json.dumps(entries,indent=2)+'\n')
          print(dict(actual_files=len(files),nonempty_output_verified=True))
          PY_INVENTORY
      - name: Preserve the actual complete outcome and every failed prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-low193-Fourier-mean-and-fixed-eta-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
