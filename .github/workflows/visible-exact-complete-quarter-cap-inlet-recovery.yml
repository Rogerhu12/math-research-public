name: visible-exact quarter endpoint recovery and complete cap finish

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-complete-quarter-cap-inlet-recovery.yml']
  workflow_dispatch:
    inputs:
      phase:
        description: 'Resume two endpoint ranges and finish, or consume their already successful recovery'
        required: true
        default: range-and-finish
        type: choice
        options: [range-and-finish, finish]
      recovery_run:
        description: 'Only for finish: exact public run with both successful recovery ranges'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-quarter-cap-inlet-recovery
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CAP_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-quarter-cap-inlet-recovery-CI-inputs.json
  CAP_MANIFEST_SHA: b141f6d9be92cb86fc06b49933bfb005eb0de383eef5dd8bd91a6c347d8b1263
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  recovery:
    if: github.repository == 'Rogerhu12/math-research-public' && inputs.phase != 'finish'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {first: 0, end: 256}
          - {first: 1792, end: 1977}
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-quarter-cap-inlet-recovery-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate frozen original and recovery inputs without modifying original sources
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$CAP_MANIFEST" --manifest-sha "$CAP_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/complete_quarter_cap_inlet_recovery_ci/
      - name: Parse the independent recovery sources before mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_complete_quarter_cap_inlet_recovery.py','fourfold_codazzi_complete_quarter_cap_inlet_recovery_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('Independent inlet recovery sources passed AST; no mathematics has run.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible paths
        id: paths
        run: |
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-inlet-prepared" >> "$GITHUB_OUTPUT"
          printf 'plan=%s\n' "$RUNNER_TEMP/visible-exact-inlet-plan" >> "$GITHUB_OUTPUT"
          printf 'prefix=%s\n' "$RUNNER_TEMP/visible-exact-inlet-prefix" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-inlet-range-output" >> "$GITHUB_OUTPUT"
          printf 'artifact=%s\n' "visible-exact-quarter-inlet-recovery-range-${{ matrix.first }}-${{ matrix.end }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Receive the exact original successful plan without running it again
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43623547711
          name: visible-exact-complete-quarter-cap-plan-43623547711-1
          path: ${{ steps.paths.outputs.plan }}
      - name: Receive the exact completed original prefix and its true failure process
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43623547711
          name: visible-exact-complete-quarter-cap-range-${{ matrix.first }}-${{ matrix.end }}-43623547711-1
          path: ${{ steps.paths.outputs.prefix }}
      - name: Receive the original exact arrays without rebuilding them
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43580498603
          name: visible-exact-cap128-prepared-43580498603-1
          path: ${{ steps.paths.outputs.prepared }}
      - name: Execute only missing endpoint quarters with real ten-minute pull checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_quarter_cap_inlet_recovery_CI.py
          --manifest "$CAP_MANIFEST" --manifest-sha "$CAP_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --phase range --first ${{ matrix.first }} --end ${{ matrix.end }} --workflow-run "$GITHUB_RUN_ID"
          --prepared "$RUNNER_TEMP/visible-exact-inlet-prepared"
          --plan-artifact "$RUNNER_TEMP/visible-exact-inlet-plan"
          --prefix-artifact "$RUNNER_TEMP/visible-exact-inlet-prefix"
          --work "$RUNNER_TEMP/visible-exact-inlet-range-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-inlet-range-output"
          --compute-minutes 85 --checkpoint-minutes 10
      - name: Require nonempty actual evidence and a small inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          data=(json.dumps(entries,indent=2)+'\n').encode()
          if len(data)>60000:raise RuntimeError('inventory exceeded60000 bytes; preserve all actual evidence')
          (root/'artifact-inventory.json').write_bytes(data)
          print(dict(actual_files=len(files),actual_inventory_bytes=len(data)))
          PY_INVENTORY
      - name: Preserve complete native bytes and every actual failure prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.artifact }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error

  finish:
    needs: recovery
    if: >-
      always() && !cancelled() &&
      github.repository == 'Rogerhu12/math-research-public' &&
      (needs.recovery.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.phase == 'finish'))
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 100
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-quarter-cap-inlet-recovery-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate frozen original and recovery inputs without modifying original sources
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$CAP_MANIFEST" --manifest-sha "$CAP_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/complete_quarter_cap_inlet_recovery_ci/
      - name: Parse the independent recovery sources before mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_complete_quarter_cap_inlet_recovery.py','fourfold_codazzi_complete_quarter_cap_inlet_recovery_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('Independent inlet recovery sources passed AST; no mathematics has run.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible paths and exact recovery receipt
        id: paths
        env:
          SELECTED_RECOVERY_RUN: ${{ inputs.phase == 'finish' && inputs.recovery_run || github.run_id }}
        run: |
          python - <<'PY_PATHS'
          import os
          run=os.environ['SELECTED_RECOVERY_RUN']
          if not run.isdigit():raise ValueError('the exact public recovery run is required')
          values=dict(plan=os.environ['RUNNER_TEMP']+'/visible-exact-inlet-finish-plan',
              recovered=os.environ['RUNNER_TEMP']+'/visible-exact-inlet-finish-range',
              output=os.environ['RUNNER_TEMP']+'/visible-exact-inlet-finish-output',
              recovery_run=run,recovery_artifact='visible-exact-quarter-inlet-recovery-range-*-'+run+'-*',
              artifact='visible-exact-quarter-inlet-recovery-finish-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for key,value in values.items():f.write(key+'='+value+'\n')
          PY_PATHS
      - name: Receive the same exact original successful plan
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43623547711
          name: visible-exact-complete-quarter-cap-plan-43623547711-1
          path: ${{ steps.paths.outputs.plan }}
      - name: Receive both exact successful endpoint recovery artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: ${{ steps.paths.outputs.recovery_run }}
          pattern: ${{ steps.paths.outputs.recovery_artifact }}
          merge-multiple: false
          path: ${{ steps.paths.outputs.recovered }}
      - name: Consume six original ranges and both recoveries with genuine pull checkpoints
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXACT_RECOVERY_RUN: ${{ steps.paths.outputs.recovery_run }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_quarter_cap_inlet_recovery_CI.py
          --manifest "$CAP_MANIFEST" --manifest-sha "$CAP_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --phase finish --workflow-run "$EXACT_RECOVERY_RUN"
          --plan-artifact "$RUNNER_TEMP/visible-exact-inlet-finish-plan"
          --recovered-artifacts "$RUNNER_TEMP/visible-exact-inlet-finish-range"
          --work "$RUNNER_TEMP/visible-exact-inlet-finish-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-inlet-finish-output"
          --compute-minutes 85 --checkpoint-minutes 10
      - name: Require nonempty actual evidence and a small inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          data=(json.dumps(entries,indent=2)+'\n').encode()
          if len(data)>60000:raise RuntimeError('inventory exceeded60000 bytes; preserve all actual evidence')
          (root/'artifact-inventory.json').write_bytes(data)
          print(dict(actual_files=len(files),actual_inventory_bytes=len(data)))
          PY_INVENTORY
      - name: Preserve complete native bytes and every actual failure prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.artifact }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
