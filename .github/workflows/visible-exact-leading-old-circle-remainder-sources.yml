name: visible-exact complete old-circle inverse and even-mean source budgets

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-leading-old-circle-remainder-sources.yml']
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Optional exact old-circle source run whose completed norm and integral rows will be reused'
        required: false
        type: string
        default: ''
      resume_attempt:
        description: 'Original attempt for the optional exact prefix artifact'
        required: false
        type: string
        default: '1'

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-leading-old-circle-remainder-sources
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-leading-old-circle-remainder-sources-CI-inputs.json
  PHASE_MANIFEST_SHA: 7290cbb07293c15a239ffafb0e342e6c1b7ea812106f569e88bbe4d2502180df
  PHASE_PIPELINE_SHA: 9385aa88a3cfd6ecc0aba3474018a636a2b5d3a829bb5575d799b89a1609860d
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-leading-old-circle-remainder-sources:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_leading_old_circle_remainder_sources_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-leading-old-circle-remainder-sources-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate15 exact original receipts, native, proofs and the complete source consumer
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_leading_old_circle_remainder_sources_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse all five exact sources without running mathematics
        run: |
          python - <<'PY_SOURCE'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_leading_old_circle_remainder_sources.py','fourfold_codazzi_leading_old_circle_remainder_sources_CI.py','fourfold_codazzi_actual_first_Airy_seam_operators.py','fourfold_codazzi_actual_first_Airy_forcing.py','fourfold_codazzi_piecewise_real_root_fold_resume_v2.py'):
              ast.parse((root/name).read_text(),filename=name)
          PY_SOURCE
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5
      - name: Set the actual result path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-leading-old-circle-remainder-sources-output" >> "$GITHUB_OUTPUT"
      - name: Restore the complete original successful larger-root native
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-piecewise-real-root-fold-resume-v2-43616813816-1
          run-id: 43616813816
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-leading-old-circle-remainder-sources-prepared/root
      - name: Restore the complete original first-forcing native
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-actual-first-Airy-forcing-43624260519-1
          run-id: 43624260519
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-leading-old-circle-remainder-sources-prepared/forcing
      - name: Restore an explicitly selected original norm and integral prefix
        if: ${{ inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-leading-old-circle-remainder-sources-${{ inputs.resume_run }}-${{ inputs.resume_attempt }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-leading-old-circle-remainder-sources-prepared/resume
      - name: Evaluate the complete old-circle inverse and independent mean sources; publish every actual outcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_leading_old_circle_remainder_sources_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-leading-old-circle-remainder-sources-science"
          --prepared "$RUNNER_TEMP/visible-exact-leading-old-circle-remainder-sources-prepared"
          --out-dir "$RUNNER_TEMP/visible-exact-leading-old-circle-remainder-sources-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-leading-old-circle-remainder-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
