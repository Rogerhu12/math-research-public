name: Rank2 original degree48 RR front
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rank2-sha-original-shadow-rr-eta48.yml'
      - 'topics/rank2-sha-infinitely-many-p/scripts/produce-original-shadow-rr-eta48.py'
      - 'topics/rank2-sha-infinitely-many-p/ci/original-shadow-rr-eta48-request.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rank2-original-shadow-rr-eta48
  cancel-in-progress: false
jobs:
  original-shadow-rr-eta48:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/rank2-sha-infinitely-many-p/README.md
            /topics/rank2-sha-infinitely-many-p/scripts/produce-original-shadow-rr-eta48.py
            /topics/rank2-sha-infinitely-many-p/ci/original-shadow-rr-eta48-request.json
          persist-credentials: false
      - name: Construct the exact original eta48 branch, all cusps, and RR basis
        shell: bash
        run: |
          set -euo pipefail
          RANK2_IMAGE='sagemath/sagemath@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb'
          docker pull "$RANK2_IMAGE"
          RANK2_ROOT_README_SHA="$(git rev-parse HEAD:README.md)"
          RANK2_TOPIC_README_SHA="$(git rev-parse HEAD:topics/rank2-sha-infinitely-many-p/README.md)"
          timeout 21000 docker run --rm --network none \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e RANK2_SOURCE_SHA="$GITHUB_SHA" \
            -e RANK2_RUN_ID="$GITHUB_RUN_ID" \
            -e RANK2_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e RANK2_ROOT_README_SHA="$RANK2_ROOT_README_SHA" \
            -e RANK2_TOPIC_README_SHA="$RANK2_TOPIC_README_SHA" \
            -e RANK2_IMAGE="$RANK2_IMAGE" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e OMP_NUM_THREADS=4 \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            --entrypoint /usr/bin/sage "$RANK2_IMAGE" -python -c \
            'import json,runpy,sys; p="topics/rank2-sha-infinitely-many-p/"; sys.argv=[p+"scripts/produce-original-shadow-rr-eta48.py"]+json.load(open(p+"ci/original-shadow-rr-eta48-request.json"))["arguments"]; runpy.run_path(sys.argv[0],run_name="__main__")'
