            /topics/visible-flex-new-mechanism/results/R605-real-memory-coordinates-and-leading-energy-local-flow.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull rules and solve the new full memory original mass input
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r605-memory-energy-hard-mass-20261126.json
