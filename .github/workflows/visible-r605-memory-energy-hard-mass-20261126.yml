name: visible-flex R605 memory energy and exact boundary mass
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r605-memory-energy-hard-mass-20261126.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r605-memory-energy-hard-mass-20261126
  cancel-in-progress: false
jobs:
