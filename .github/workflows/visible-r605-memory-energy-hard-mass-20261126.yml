            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/results/R601-prepared-center-true-jet-and-fixed-gauge-acceleration.md
            /topics/visible-flex-new-mechanism/scripts/r603_vtwo_center_mass_continuation_agent.py
