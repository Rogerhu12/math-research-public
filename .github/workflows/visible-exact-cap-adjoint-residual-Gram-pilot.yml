name: visible-exact complete97 cap adjoint residual Gram pilot

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_core.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_pilot.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete97-ordinary-adjoint-Gram-pilot-CI-inputs.json'
      - '.github/workflows/visible-exact-cap-adjoint-residual-Gram-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete97-cap-adjoint-Gram-pilot
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  GRAM_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete97-ordinary-adjoint-Gram-pilot-CI-inputs.json
  GRAM_MANIFEST_SHA: 467cd31f6d62b834d3a0cf07a1ef92efe1a2ef218e27d862140122c37a9ce71f
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  exact-texts:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Partially check out the three exact new sources
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_core.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_pilot.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_CI.py
      - name: Check the three exact SHA256s and syntax without mathematical imports
        run: |
          python - <<'PY_EXACT_AST'
          import ast,hashlib,pathlib
          expected={
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_core.py':'689bf2c54350d832cffa7ca8f46dc424509fb221e3d73cb228a1f9a18130c0dc',
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_pilot.py':'ae3b90c15e65343a0d5bdeb80cba4d6eb2a6f519155bff9a175b0f48a2f72310',
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_CI.py':'3f7c1f5862530cf13bda0a30466fc16998ef2a1f0f60ab97a8e5bc9506d81222',
          }
          for name,sha in expected.items():
              raw=pathlib.Path(name).read_bytes()
              if hashlib.sha256(raw).hexdigest()!=sha:
                  raise ValueError('An exact new source changed: '+name)
              ast.parse(raw.decode(),filename=name)
          print('Exact core, pilot and worker parsed; no mathematical producer imported or executed.')
          PY_EXACT_AST

  pilot:
    needs: exact-texts
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 200
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out sources and separately reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete97-ordinary-adjoint-Gram-pilot-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Set the actual container-visible artifact output path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-cap-adjoint-Gram-pilot-output" >> "$GITHUB_OUTPUT"
      - name: Hydrate337 files with all original253 and164 pins unchanged
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$GRAM_MANIFEST" --manifest-sha "$GRAM_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/cap_adjoint_residual_Gram_pilot_ci/
      - name: Install the original pinned arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Consume four actual closed quarters with full signed97 residual and Hessian Grams
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap_adjoint_residual_Gram_CI.py
          --manifest "$GRAM_MANIFEST" --manifest-sha "$GRAM_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --work "$RUNNER_TEMP/visible-exact-cap-adjoint-Gram-pilot-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-cap-adjoint-Gram-pilot-output"
          --compute-minutes 170 --checkpoint-minutes 10
      - name: Require an actual nonempty process and retain the real success or failure
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_ACTUAL'
          import json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          process=root/'process.json'
          if not process.is_file() or not process.stat().st_size:
              raise RuntimeError('No actual nonempty adjoint Gram process exists')
          d=json.loads(process.read_text())
          if d.get('repository')!='Rogerhu12/math-research-public':
              raise ValueError('The actual process belongs to another repository')
          files=[p for p in root.rglob('*') if p.is_file()]
          print(json.dumps(dict(actual_files=len(files),actual_bytes=sum(p.stat().st_size for p in files),
              process_complete=d.get('complete'),actual_failure=d.get('failure'),
              actual_complete_quarters=d.get('actual_completed_quarters'),
              old_targets_recomputed=0,complete7908_adjoint_cover_claimed=False)))
          PY_ACTUAL
      - name: Preserve complete signed Grams, coefficient models and every actual prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cap-adjoint-Gram-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
