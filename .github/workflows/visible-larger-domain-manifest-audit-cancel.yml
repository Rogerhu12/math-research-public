name: Stop superseded read-only domain manifest audit
on:
  push:
    branches:
      - visible-flex-larger-domain-manifest-audit-cancel-20261116
permissions:
  contents: read
  actions: write
jobs:
  cancel_known_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUDIT_CANCEL_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only the exact superseded administrative run
        shell: bash
        run: |
          python3 -u - <<'PY'
          import os,json,urllib.request,urllib.error
          repo="Rogerhu12/math-research-public"
          run_id=43875316393
          expected_head="e35f4018f337b52aa5f224a3c40677569cdbbc1c"
          expected_path=".github/workflows/visible-larger-two-domain-manifest-retention-audit.yml"
          headers={"Authorization":"Bearer "+os.environ["AUDIT_CANCEL_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          url="https://api.github.com/repos/"+repo+"/actions/runs/"+str(run_id)
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40) as response:
              run=json.load(response)
          if not (run["id"]==run_id and run["head_sha"]==expected_head and run["path"]==expected_path and run["event"]=="push" and run["repository"]["full_name"]==repo):
              raise SystemExit("Refuse any cancellation outside the exact known read-only administrative audit")
          if run["status"]=="completed":
              print("AUDIT_CANCEL_JSON "+json.dumps({"run":run_id,"head":expected_head,"status":"already_completed","conclusion":run["conclusion"],"post_sent":False}))
          else:
              req=urllib.request.Request(url+"/cancel",headers=headers,method="POST",data=b"")
              try:
                  with urllib.request.urlopen(req,timeout=40) as response:
                      code=response.status
                      body=response.read().decode("utf-8","replace")
                  print("AUDIT_CANCEL_JSON "+json.dumps({"run":run_id,"head":expected_head,"http_status":code,"response_body":body,"post_sent":True,"automatic_retry":False,"scope":"only this known read-only administrative audit; no scientific run selected"}))
              except urllib.error.HTTPError as error:
                  print("AUDIT_CANCEL_HTTP "+json.dumps({"run":run_id,"http_status":error.code,"response_body":error.read().decode("utf-8","replace"),"post_sent":True,"automatic_retry":False}))
                  raise SystemExit(1)
          PY
