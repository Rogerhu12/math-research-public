name: ISP R150 complete original197 second image
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: isp-global197-original-i2-temporary-789f
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/invariant-subspace-problem/README.md
            /topics/invariant-subspace-problem/HANDOFF.md
            /topics/invariant-subspace-problem/notes/2026-11-15-r150-global197-original-i2-session-789f.py
            /topics/invariant-subspace-problem/notes/2026-11-15-r150-global197-original-i2-session-request-789f.json
          persist-credentials: false
      - name: Install exact arithmetic
        run: python -m pip install --quiet python-flint==0.9.0
      - name: Restore pinned originals and compute complete second image with rule checks
        run: python topics/invariant-subspace-problem/notes/2026-11-15-r150-global197-original-i2-session-789f.py
