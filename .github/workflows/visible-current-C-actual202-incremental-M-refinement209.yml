name: visible-larger actual202 closed geometry incremental-M and displays209
'on':
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/notes/current-C-actual202-incremental-M-refinement209-request.json
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: visible-current-C-actual202-incremental-M-refinement209
  cancel-in-progress: false
jobs:
