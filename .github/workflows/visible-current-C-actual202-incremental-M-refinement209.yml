            if line=='        run: |':
              position+=1;body=[]
              while position<len(workflow_lines):
                item_line=workflow_lines[position]
                if item_line and not item_line.startswith('          '):break
                body.append(item_line[10:] if item_line else '')
                position+=1
              shell_blocks.append('\n'.join(body)+'\n')
              continue
            position+=1
          for number,shell in enumerate(shell_blocks):
            checked_shell=subprocess.run(['bash','-n'],input=shell,text=True,capture_output=True)
            if checked_shell.returncode:
              raise ValueError('Actual workflow shell syntax '+str(number)+': '+checked_shell.stderr)
            lines=shell.splitlines();position=0
            while position<len(lines):
              marker=re.search(r"<<'([A-Z][A-Z0-9_]*)'\s*$",lines[position])
              if marker and re.search(r'\bpython(?:3)?\b',lines[position]):
                tag=marker.group(1);position+=1;body=[]
                while position<len(lines) and lines[position]!=tag:
                  body.append(lines[position]);position+=1
                assert position<len(lines),'Unterminated actual Python heredoc '+tag
                text='\n'.join(body)+'\n'
                compile(ast.parse(text,filename=workflow.name+':'+tag),workflow.name+':'+tag,'exec')
                python_blocks.append(dict(tag=tag,bytes=len(text.encode()),sha256=hashlib.sha256(text.encode()).hexdigest()))
              position+=1
          assert len(shell_blocks)>=15 and len(python_blocks)>=15
          print(json.dumps(dict(event='request205_actual_workflow_source_syntax',
            workflow_file=str(workflow.relative_to(repo)),bytes=len(workflow_raw),
            sha256=hashlib.sha256(workflow_raw).hexdigest(),
            bash_blocks=len(shell_blocks),python_heredoc_identities=python_blocks,
            no_scientific_code_imported_or_evaluated=True)),flush=True)
          (base/'dispatch-request.json').write_bytes(raw)
          (base/'BVP-template-recipe.json').write_bytes(recipe_raw)
          print(json.dumps(dict(event='request205_complete_frozen_source_and_recipe_binding',
           run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],
           request=dict(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()),
           original_BVP_template_only=request['current_BVP_recipe'],sources=records,
           original_atomic_construction=request['original_atomic_construction_request'],
           actual_C_parameters=request['scientific_parameters'],no_scientific_import_or_evaluation_in_preflight=True)),flush=True)
          PYPINS
