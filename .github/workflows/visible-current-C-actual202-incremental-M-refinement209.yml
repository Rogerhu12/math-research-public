            no_global_absolute_kill_clock_for_prior_stages=True,
            original_sampling_phase_clocks_exclude_binding_and_setup=True)
          with (base/'job-science-deadline.json').open('xb') as stream:
            stream.write((json.dumps(deadline,sort_keys=True,separators=(',',':'))+'\n').encode())
            stream.flush();os.fsync(stream.fileno())
