          observed['quiescent']=not observed['live_original_owned_processes'] and not observed['unknown_owner_scopes']
          observed_raw=(json.dumps(observed,sort_keys=True,separators=(',',':'))+'\n').encode()
          (base/'pre-BVP-readback-quiescence.json').write_bytes(observed_raw)
          print(json.dumps(dict(event='request205_before_complete_BVP_readback_owner_scope',
            original_observation=observed,bytes=len(observed_raw),
            sha256=hashlib.sha256(observed_raw).hexdigest(),
            not_a_new_scientific_gate=True)),flush=True)
          if not observed['quiescent']:
            print(json.dumps(dict(event='request205_live_scope_readback_unpaid',
              no_complete_mutable_stream_claimed=True,cleanup_must_be_skipped=True)),flush=True)
            raise SystemExit(2)
          argv=[sys.executable,'-u',str(comp/item['file']),
           '--launch-directory',str(base/'BVP-launch'),'--sampler-directory',str(base/'current-geometry'),
           '--candidate-binding',str(base/'actual202-ten-BVP-input'/'adapter-result.json'),
           '--computations',str(comp),'--out',str(base/'BVP-scalar-readout')]
          source=base/'current-geometry'/'result.json'
          if source.is_file():argv.extend(['--sampler-result-sha256',hashlib.sha256(source.read_bytes()).hexdigest()])
          env={k:v for k,v in os.environ.items() if k not in ('GH_TOKEN','GITHUB_TOKEN','MR_TOKEN')}
          result=subprocess.run(argv,env=env,check=False)
          if result.returncode:raise SystemExit(result.returncode)
          summary=base/'BVP-scalar-readout'/'scalar-summary.json'
          packed=summary.read_bytes();record=json.loads(packed)
          assert record['schema']=='actual202-accurate-ten-current-C-live-full453-and-frozen450-necessary-readback-v1'
          assert record['complete_necessary_readback_without_recorded_error'] is True
          assert record['owned_group_quiescent_before_readback'] is True
          marker=json.loads((base/'BVP-scalar-readout'/'readback-complete.json').read_bytes())
          assert marker['schema']==record['schema']+'-complete-marker'
          assert marker['repository']==os.environ['GITHUB_REPOSITORY']
          assert marker['run_id']==os.environ['GITHUB_RUN_ID'] and marker['source_commit']==os.environ['GITHUB_SHA']
          assert marker['necessary_summary']==dict(bytes=len(packed),sha256=hashlib.sha256(packed).hexdigest())
          assert marker['complete_necessary_scope'] is True
          print(json.dumps(dict(event='request205_original_necessary_BVP_readback_complete',
            original_reader=item,original_summary=marker['necessary_summary'],
            necessary_selected_scope_only=True,large_witnesses_and_earlier_trials_not_exported=True,
            no_new_scientific_acceptance_gate=True)),flush=True)
          PYBVPREAD
      - name: Read necessary actual rules resource clips process receipts and selected original errors
        id: rules_scalar
        if: always()
        timeout-minutes: 5
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python -u - <<'PYRULESREAD'
          import hashlib,importlib.util,json,os,runpy,sys
          from pathlib import Path
          comp=Path(os.environ['VISIBLE_COMPUTATIONS']);base=Path(os.environ['VISIBLE_BASE'])
          name='root_20261115_current_C_pruefer_positive_full453_necessary_readout.py';raw=(comp/name).read_bytes()
          assert len(raw)==51108 and hashlib.sha256(raw).hexdigest()=='34b49f026338b90b691cbd170d6d6303c7ec3549f2329ba0f4457a2cfeab75c9'
          spec=importlib.util.spec_from_file_location('_request205_necessary_metadata_readback',comp/name)
          R=importlib.util.module_from_spec(spec);sys.modules[spec.name]=R;spec.loader.exec_module(R)
          owner=base/'request205_owned_process.py'
          assert hashlib.sha256(owner.read_bytes()).hexdigest()=='f779c6a296b8579469dffb27c46642d5d5aaffc08d53a027537d2ddb23ee9357'
          owned=runpy.run_path(str(owner),run_name='_request205_rule_readback_owner')
          observed=owned['observe']()
          launch=base/'BVP-launch'
          if launch.exists():
            try:
              if not launch.is_dir() or launch.is_symlink():raise ValueError('Owned BVP output is not its original directory')
              value=json.loads((launch/'result.json').read_bytes())
              if (value.get('run_id')!=os.environ['GITHUB_RUN_ID']
                  or value.get('source_commit')!=os.environ['GITHUB_SHA']):
                raise ValueError('Owned BVP result does not bind this run and source')
              if value.get('owned_group_quiescent_before_readback') is not True:
                observed['unknown_owner_scopes'].append(dict(role='BVP-child',reason='Actual independent BVP group has no observed stopped receipt'))
            except Exception as error:
              observed['unknown_owner_scopes'].append(dict(role='BVP-child',
                reason='Owned BVP output exists without a complete launch-return identity',original_error=repr(error)))
          observed['quiescent']=not observed['live_original_owned_processes'] and not observed['unknown_owner_scopes']
          (base/'rule-readback-quiescence.json').write_bytes(R.canonical(observed))
          summary=dict(schema='request205-necessary-rule-resource-readback-v1',
            repository=os.environ['GITHUB_REPOSITORY'],run_id=os.environ['GITHUB_RUN_ID'],
            source_commit=os.environ['GITHUB_SHA'],owner_observation=observed,
            no_scientific_module_imported_or_scientific_value_recomputed=True,
            resource_and_rule_metadata_only_not_a_new_scientific_gate=True,
            new_postsolve_rule_scope_reported_by_distinct_closed_readback=True,
            large_original_scientific_logs_not_exported=True,files=[],resources=[])
          for name in ('job-science-deadline.json','pre-BVP-readback-quiescence.json',
              'rule-readback-quiescence.json','BVP-template-recipe.json','current-BVP-deadline.json',
              'construction/candidate-preparation/actual202-projected-accurate-ten-model-recipe.json',
              'candidate-binding-procedure-result.json','actual202-ten-BVP-input/adapter-result.json',
              'actual202-ten-BVP-input/actual202-accurate-ten-full453-frozen450-recipe.json',
              'actual202-ten-BVP-input/result.json','current-C-BVP-client-config.json','dispatch-request.json'):
            path=base/name
            if path.is_file():
              value,ident=R.document(path,'resource/'+name)
              chosen=R.small(value) if name in ('job-science-deadline.json','current-BVP-deadline.json') else R.select(value,
                ('schema','request_number','lambda_target','state_dimension','active_parameter_indices',
                 'frozen_parameter_indices','initial_ten_parameters','second_state_dimension','quiescent'))
              summary['resources'].append(dict(file=name,identity=ident,necessary_original_values=chosen,
                complete_original_parameter_source_tree_not_exported=True))
          if observed['quiescent']:
            for path in sorted(base.glob('*rule-sync*')):
              if path.name=='postsolve-rule-sync':continue
              if not path.is_dir() or path.is_symlink():continue
              for item in sorted(path.rglob('*')):
                if item.is_symlink():
                  R.fail('rule-file',ValueError('Owned symlink not followed'),path=str(item.relative_to(base)))
                  continue
                if not item.is_file():continue
                name=str(item.relative_to(base))
                if item.name.endswith('.json'):
                  value,ident=R.document(item,'rule/'+name)
                  summary['files'].append(dict(file=name,identity=ident,
                    necessary_original_metadata=R.small(value),full_member_tree_not_exported=True))
                else:
                  logged=R.log_view(item,'rule/'+name)
                  summary['files'].append(dict(file=name,identity=logged['original_file'],
                    lines=logged['complete_lines'],
                    selected_error_text=logged if logged['original_error_matched_lines'] else None,
                    complete_original_text_not_exported=True))
          else:
            R.fail('rule-owner',RuntimeError('Original mutable rule/scientific scopes are live or unknown'))
          summary['original_read_errors']=R.ERRORS
          summary['omitted_metadata_member_count']=len(R.OMISSIONS)
          summary['omitted_metadata_member_index_sha256']=R.sha(R.canonical(R.OMISSIONS))
          summary['complete_necessary_scope']=bool(observed['quiescent'] and not R.ERRORS)
          packed=R.canonical(summary)
          if len(packed)>90000:
            print(json.dumps(dict(event='request205_necessary_rule_summary_over_budget',
              bytes=len(packed),sha256=R.sha(packed),no_part_transport=True,no_cleanup_marker=True,
              complete_scientific_result_not_inferred=True)),flush=True)
            raise SystemExit(70)
          print('BEGIN_REQUEST205_NECESSARY_RULE_RESOURCE_SUMMARY')
          print(packed.decode('utf-8'),end='')
          print('END_REQUEST205_NECESSARY_RULE_RESOURCE_SUMMARY')
          print(json.dumps(dict(event='request205_necessary_rule_identity',bytes=len(packed),sha256=R.sha(packed),
            hash_scope='canonical UTF8 JSON including LF')),flush=True)
          if not summary['complete_necessary_scope']:raise SystemExit(2)
          marker=dict(schema='request205-complete-rule-resource-readback-v1',
            repository=os.environ['GITHUB_REPOSITORY'],run_id=os.environ['GITHUB_RUN_ID'],
            source_commit=os.environ['GITHUB_SHA'],complete=True,quiescent=True,
            necessary_summary=dict(bytes=len(packed),sha256=R.sha(packed)),
            large_text_omission_scope_explicit=True)
          with (base/'rule-readback-complete.json').open('xb') as stream:
            stream.write(R.canonical(marker));stream.flush();os.fsync(stream.fileno())
          PYRULESREAD
      - name: Execute genuine mesh then incremental-M refinement with independent evidence and finite displays
        id: refinement
        if: always() && steps.bind209.outcome == 'success'
        timeout-minutes: 325
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining=$(python - <<'PYTIME'
          import json,os,time
          from pathlib import Path
          value=json.loads((Path(os.environ['VISIBLE_BASE'])/'job-science-deadline.json').read_bytes())
          print(max(1,int(value['namespace_created_unix_seconds']+18900-time.time())))
          PYTIME
          )
          timeout --verbose --signal=TERM --kill-after=20s "${remaining}s" python -u "$VISIBLE_COMPUTATIONS/geometry_20261116_request209_joint_refinement.py" rules \
            --request "$VISIBLE_BASE/refinement209-request.json" --request-sha256 aaf74021bbd952b24a3ba3d45b0cbbd1df070bf9866c79f6925808c836a74009 \
            --base "$VISIBLE_BASE" --computations "$VISIBLE_COMPUTATIONS" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --proof-directory "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/results" \
            > "$VISIBLE_BASE/request209-entry.stdout.log" 2> "$VISIBLE_BASE/request209-entry.stderr.log"
      - name: Quiesce actual new owners and return one bounded refinement-chain conclusion
        id: refinement_scalar
        if: always()
        timeout-minutes: 40
        run: |
          python -u "$VISIBLE_COMPUTATIONS/root_20261116_request209_refinement_necessary.py" readback \
            --request "$VISIBLE_BASE/refinement209-request.json" --request-sha256 aaf74021bbd952b24a3ba3d45b0cbbd1df070bf9866c79f6925808c836a74009 \
            --base "$VISIBLE_BASE" --computations "$VISIBLE_COMPUTATIONS"
      - name: Remove only fully read quiescent original205 and new209 temporary payload
        if: always()
        env:
          C_READBACK_OUTCOME: ${{ steps.scalar.outcome }}
          CUT_READBACK_OUTCOME: ${{ steps.cut_twojet.outcome }}
          CONSTRUCTION_READBACK_OUTCOME: ${{ steps.construction_readback.outcome }}
          FAR_READBACK_OUTCOME: ${{ steps.far_scalar.outcome }}
          BVP_READBACK_OUTCOME: ${{ steps.bvp_scalar.outcome }}
          RULES_READBACK_OUTCOME: ${{ steps.rules_scalar.outcome }}
          CLOSED_READBACK_OUTCOME: ${{ steps.closed_scalar.outcome }}
          REFINEMENT_READBACK_OUTCOME: ${{ steps.refinement_scalar.outcome }}
        run: |
          python -u "$VISIBLE_COMPUTATIONS/root_20261116_request209_refinement_necessary.py" cleanup \
            --request "$VISIBLE_BASE/refinement209-request.json" --request-sha256 aaf74021bbd952b24a3ba3d45b0cbbd1df070bf9866c79f6925808c836a74009 \
            --base "$VISIBLE_BASE" --computations "$VISIBLE_COMPUTATIONS"
  report:
    name: Repeat exact bounded primary scopes without a scientific calculation
    needs: compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMPUTE_RESULT: ${{ needs.compute.result }}
      BVP_OUTCOME: ${{ needs.compute.outputs.BVP_science_outcome }}
      REFINEMENT_OUTCOME: ${{ needs.compute.outputs.refinement_science_outcome }}
      REFINEMENT_READBACK_OUTCOME: ${{ needs.compute.outputs.refinement_readback_outcome }}
      REFINEMENT_SUMMARY: ${{ needs.compute.outputs.refinement_summary }}
      REFINEMENT_SUMMARY_BYTES: ${{ needs.compute.outputs.refinement_summary_bytes }}
      REFINEMENT_SUMMARY_SHA256: ${{ needs.compute.outputs.refinement_summary_sha256 }}
      CLOSED_OUTCOME: ${{ needs.compute.outputs.closed_science_outcome }}
      CLOSED_READBACK_OUTCOME: ${{ needs.compute.outputs.closed_readback_outcome }}
      CLOSED_SUMMARY_IDENTITY: ${{ needs.compute.outputs.closed_summary_identity }}
      SCALAR_SUMMARY: ${{ needs.compute.outputs.scalar_summary }}
      SCALAR_SUMMARY_BYTES: ${{ needs.compute.outputs.scalar_summary_bytes }}
      SCALAR_SUMMARY_SHA256: ${{ needs.compute.outputs.scalar_summary_sha256 }}
      CUT_TWOJET_SUMMARY: ${{ needs.compute.outputs.cut_twojet_summary }}
      CUT_TWOJET_SUMMARY_BYTES: ${{ needs.compute.outputs.cut_twojet_summary_bytes }}
      CUT_TWOJET_SUMMARY_SHA256: ${{ needs.compute.outputs.cut_twojet_summary_sha256 }}
      FAR_SUMMARY: ${{ needs.compute.outputs.far_summary }}
      FAR_SUMMARY_BYTES: ${{ needs.compute.outputs.far_summary_bytes }}
      FAR_SUMMARY_SHA256: ${{ needs.compute.outputs.far_summary_sha256 }}
      CONSTRUCTION_SUMMARY: ${{ needs.compute.outputs.construction_summary }}
      CONSTRUCTION_SUMMARY_BYTES: ${{ needs.compute.outputs.construction_summary_bytes }}
      CONSTRUCTION_SUMMARY_SHA256: ${{ needs.compute.outputs.construction_summary_sha256 }}
      BVP_SUMMARY: ${{ needs.compute.outputs.bvp_summary }}
      BVP_SUMMARY_BYTES: ${{ needs.compute.outputs.bvp_summary_bytes }}
      BVP_SUMMARY_SHA256: ${{ needs.compute.outputs.bvp_summary_sha256 }}
    steps:
      - name: Print all five actual primary summaries and preserve original compute outcome
        run: |
          python3 - <<'PYREPORT'
          import hashlib,json,os
          names=('scalar_summary','cut_twojet_summary','far_summary','construction_summary','bvp_summary')
          errors=[]
          for name in names:
           key=name.upper();text=os.environ.get(key,'')
           if not text:
            print(json.dumps(dict(event='request205_primary_unavailable',original_kind=name,
             compute_result=os.environ.get('COMPUTE_RESULT'),BVP_outcome=os.environ.get('BVP_OUTCOME'),
             no_native_BVP_or_upstream_success_inferred=True)),flush=True)
            continue
           try:
            expected_size=int(os.environ[key+'_BYTES']);expected_sha=os.environ[key+'_SHA256']
            raw=text.encode()
            if len(raw)!=expected_size or hashlib.sha256(raw).hexdigest()!=expected_sha:raw+=b'\n'
            assert len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected_sha
            assert len(raw)<=90000
            json.loads(raw)
            print('BEGIN_REQUEST205_'+key)
            print(raw.decode(),end='' if raw.endswith(b'\n') else '\n')
            print('END_REQUEST205_'+key)
            print(json.dumps(dict(event='request205_original_primary_identity',kind=name,
             original_bytes=len(raw),original_sha256=expected_sha,
             necessary_selected_scope_only=True,large_omitted_members_not_reconstructed_or_claimed_read_in_chat=True)),flush=True)
           except Exception as error:errors.append(dict(kind=name,error=repr(error)))
          print(json.dumps(dict(event='request205_report_transport_scope',errors=errors,
           compute_result=os.environ.get('COMPUTE_RESULT'),BVP_outcome=os.environ.get('BVP_OUTCOME'),
           report_success_not_a_mathematical_BVP_or_closed_surface_result=True)),flush=True)
          print(json.dumps(dict(event='request205_closed_postsolve_report_scope',
           science_outcome=os.environ.get('CLOSED_OUTCOME'),
           readback_outcome=os.environ.get('CLOSED_READBACK_OUTCOME'),
           necessary_summary_identity=json.loads(os.environ['CLOSED_SUMMARY_IDENTITY']) if os.environ.get('CLOSED_SUMMARY_IDENTITY') else None,
           complete_new_geometry_held_and_resource_bodies_are_in_compute_log=True,
           no_mathematical_success_inferred_from_job_status=True)),flush=True)
          if errors or os.environ.get('COMPUTE_RESULT')!='success':raise SystemExit(2)
          PYREPORT

      - name: Repeat only the single exact necessary refinement-chain body
        if: always()
        run: |
          python - <<'PY209REPORT'
          import hashlib,json,os
          text=os.environ.get('REFINEMENT_SUMMARY','')
          if not text:
           print(json.dumps(dict(event='request209_primary_unavailable',science_outcome=os.environ.get('REFINEMENT_OUTCOME'),
            readback_outcome=os.environ.get('REFINEMENT_READBACK_OUTCOME'),no_math_result_inferred=True)),flush=True)
           raise SystemExit(2)
          raw=text.encode();expected=int(os.environ['REFINEMENT_SUMMARY_BYTES']);sha=os.environ['REFINEMENT_SUMMARY_SHA256']
          if len(raw)!=expected or hashlib.sha256(raw).hexdigest()!=sha:raw+=b'\n'
          assert len(raw)==expected and hashlib.sha256(raw).hexdigest()==sha and len(raw)<=90000
          value=json.loads(raw)
          print('BEGIN_REQUEST209_REFINEMENT_NECESSARY');print(raw.decode(),end='');print('END_REQUEST209_REFINEMENT_NECESSARY')
          print(json.dumps(dict(event='request209_repeat_identity',bytes=len(raw),sha256=sha,
           complete_necessary_readback=value.get('complete_necessary_readback'),science_outcome=os.environ.get('REFINEMENT_OUTCOME'),
           original_compute_result=os.environ.get('COMPUTE_RESULT'),job_green_not_a_scientific_completion=True)),flush=True)
          if value.get('complete_necessary_readback') is not True:raise SystemExit(2)
          PY209REPORT
