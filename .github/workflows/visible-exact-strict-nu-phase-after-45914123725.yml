name: R147 explicit strict phase continuation with literal cube
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visible-exact-strict-nu-phase-after-45914123725.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visible-flex-exact-strict-nu-phase-after-45914123725
  cancel-in-progress: false
jobs:
  first-whole-signed-phase-functional:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 135
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_negative_nu_waist_public_worker.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_support_localized_nu_public_worker.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_strict_nu_particular_public_worker.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_strict_nu_phase_cube_resume_worker.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_strict_nu_phase_resume_worker.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_strict_nu_phase_public_worker.py
            /topics/visible-flex-exact-nearby/notes/strict_nu_phase_ci/run-45914123725-1/execution.json
            /topics/visible-flex-exact-nearby/notes/strict_nu_phase_ci/run-45914123725-1/actual-strict-nu-phase.json
            /topics/visible-flex-exact-nearby/notes/2026-11-27-strict-nu-phase-after-45913335399-inputs.json
            /topics/visible-flex-exact-nearby/notes/strict_nu_phase_ci/run-45913335399-1/execution.json
            /topics/visible-flex-exact-nearby/notes/2026-11-27-strict-nu-phase-complete-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-27-strict-nu-phase-after-45914123725-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the same original carrier runtime
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 python-flint==0.9.0
      - name: Pair the true strict parameter with the complete nonlocal phase row
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_strict_nu_phase_cube_resume_worker.py
          --repo "$GITHUB_WORKSPACE"
          --manifest topics/visible-flex-exact-nearby/notes/2026-11-27-strict-nu-phase-after-45914123725-inputs.json
          --manifest-sha 6ca3b71339e0ece21f10f7474011b9632e47034f5848f0fbb8fc92053c3c0a5e
