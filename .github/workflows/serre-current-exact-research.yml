name: Serre current exact research

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/current-exact-research-request.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serre-current-exact-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact_research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/*.py
            /topics/serre-uniformity/notes/current-exact-research-request.json
            /topics/serre-uniformity/notes/R989-original-r8-sparse-heat-and-Kronecker-window-method.md
            /topics/serre-uniformity/results/R990-original-hypergeometric-fixed-r-coefficient.md
            /topics/serre-uniformity/results/R975-original-balanced-Kronecker-integral-heat-recurrence.md
            /topics/serre-uniformity/results/R988-original-pure-balanced-Cartier-contraction-and-high-trace.md
            /topics/serre-uniformity/notes/R973-original-balanced-Kronecker-four-prime-execution-method.md
      - name: Install the pinned exact polynomial runtime
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: python-flint==0.9.0
      - name: Run the current exact computations with temporary outputs
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONINTMAXSTRDIGITS: '0'
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          base = pathlib.Path('topics/serre-uniformity')
          request = json.loads((base / 'notes/current-exact-research-request.json').read_text())
          for label, path in [('root', pathlib.Path('README.md')), ('topic', base / 'README.md')]:
              assert hashlib.sha256(path.read_bytes()).hexdigest() == request['readme_sha256'][label], ('changed_rules', label)
          for relative, expected in request.get('source_sha256', {}).items():
              source = (base / relative).resolve()
              source.relative_to(base.resolve())
              assert source.is_file() and hashlib.sha256(source.read_bytes()).hexdigest() == expected, ('changed_source', relative)
          print('SOURCE_COMMIT=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          print('REQUEST=' + json.dumps(request, sort_keys=True))
          failures = []
          for item in request['computations']:
              script = (base / 'scripts' / item['script']).resolve()
              assert script.parent == (base / 'scripts').resolve() and script.suffix == '.py'
              assert hashlib.sha256(script.read_bytes()).hexdigest() == item['script_sha256']
              print('BEGIN_COMPUTATION=' + item['name'], flush=True)
              try:
                  completed = subprocess.run([sys.executable, str(script), *item['arguments']], timeout=650)
                  code = completed.returncode
              except subprocess.TimeoutExpired:
                  code = 124
              print('END_COMPUTATION=' + json.dumps({'name': item['name'], 'exit_code': code}), flush=True)
              if code:
                  failures.append(item['name'])
          if failures:
              raise SystemExit('Incomplete computations: ' + ', '.join(failures))
          PY
