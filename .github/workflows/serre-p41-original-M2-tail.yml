name: Serre p41 original M2 tail 129 to 195

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R800-public-original-M2-tail-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R800-original-M2-tail-129-195
  cancel-in-progress: false

jobs:
  original_m2_tail:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-M2-tail.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R800_original_M2_tail.py
            /topics/serre-uniformity/scripts/R800_public_original_M2_tail.py
            /topics/serre-uniformity/scripts/R786_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/R795_exact_power6_short_basis.py
            /topics/serre-uniformity/scripts/R786_public_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R800-public-original-M2-tail-request.json
            /topics/serre-uniformity/notes/R800-original-M2-tail-129-195-method.md
            /topics/serre-uniformity/results/R772-original-RR-descent-and-exact-function-recovery-certificates.md
            /topics/serre-uniformity/results/R781-original-tangent-descent-and-inverse-free-Laurent-relations.md
            /topics/serre-uniformity/results/R793-original-RR-pole-divisors-and-CM-local-algebra.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Append only the missing original M2 coefficients
        continue-on-error: true
        timeout-minutes: 337
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R800_public_original_M2_tail.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R800-original-M2-tail-129-195-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R800-original-M2-tail-129-195/output
          retention-days: 1
          if-no-files-found: warn
      - name: Require all 146 exact new tails and preserved original identities
        if: always()
        run: python topics/serre-uniformity/scripts/R800_public_original_M2_tail.py verify

