name: ISP 8542 Phi complete Vlow second weight support two axes
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isp-8542-phi-second-weight-support
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ISP_PIN: ${{ github.sha }}
      ISP_FILE: 2026-11-28-unit211-Phi-zero-corrected-Vlow-second-weight-support-two-axis-comparison-8542.py
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FLINT_NUM_THREADS: '1'
    steps:
      - name: Prepare exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Pinned FLINT arithmetic
        run: python -m pip install --quiet python-flint==0.9.0
      - name: New exact original input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-equal-six-cofactors"
          cd "$RUNNER_TEMP/isp-equal-six-cofactors"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          timeout 120s git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          ISP_SOURCE_PATH="topics/invariant-subspace-problem/notes/$ISP_FILE"
          ISP_BLOB="$(git rev-parse "$ISP_PIN:$ISP_SOURCE_PATH")"
          git show "$ISP_PIN:$ISP_SOURCE_PATH" > "$RUNNER_TEMP/isp-equal-six-source.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-27-focused-exact-actions-driver-8542.py" > "$RUNNER_TEMP/isp-equal-six-driver.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-load-historical-input-8542.py" > "$RUNNER_TEMP/isp-history-loader.py"
          python "$RUNNER_TEMP/isp-history-loader.py" --repo "$PWD" --ref "$ISP_PIN" --path "topics/invariant-subspace-problem/notes/2026-11-28-unit211-Phi-zero-corrected-t-complete-Vlow-two-original-cofactors-8542.py" --output "$RUNNER_TEMP/2026-11-28-unit211-Phi-zero-corrected-t-complete-Vlow-two-original-cofactors-8542.py"
          python "$RUNNER_TEMP/isp-history-loader.py" --repo "$PWD" --ref "$ISP_PIN" --path "topics/invariant-subspace-problem/notes/2026-11-28-unit211-Phi-zero-corrected-two-sextics-fixed-lambda-resultant-support-8542.py" --output "$RUNNER_TEMP/2026-11-28-unit211-Phi-zero-corrected-two-sextics-fixed-lambda-resultant-support-8542.py"
          python "$RUNNER_TEMP/isp-history-loader.py" --repo "$PWD" --ref "$ISP_PIN" --path "topics/invariant-subspace-problem/notes/2026-11-28-unit211-Phi-zero-corrected-whole-original-I6-fifteen-by-three-8542.py" --output "$RUNNER_TEMP/2026-11-28-unit211-Phi-zero-corrected-whole-original-I6-fifteen-by-three-8542.py"
          python "$RUNNER_TEMP/isp-history-loader.py" --repo "$PWD" --ref "$ISP_PIN" --path "topics/invariant-subspace-problem/notes/2026-11-28-unit211-Phi-zero-corrected-dual-germ-four-original-quadratic-heads-8542.py" --output "$RUNNER_TEMP/2026-11-28-unit211-Phi-zero-corrected-dual-germ-four-original-quadratic-heads-8542.py"
          python -u "$RUNNER_TEMP/isp-equal-six-driver.py" --checkout "$PWD" --source "$RUNNER_TEMP/isp-equal-six-source.py" --expected-blob "$ISP_BLOB" --seconds 135