name: visible-exact complete same97 cap posterior and Poisson

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_same97_cap_posterior.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_same97_cap_posterior_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete-same97-cap-posterior-Poisson-CI-inputs.json'
      - '.github/workflows/visible-exact-complete-same97-cap-posterior-Poisson.yml'
  workflow_run:
    workflows:
      - 'visible-exact complete7908 cap adjoint Grams'
      - 'visible-exact true cap adjoint boundary and high Grams'
      - 'visible-exact complete97 right Poisson Grams'
    types: [completed]
  workflow_dispatch:
    inputs:
      body_run:
        description: 'Optional exact completed full7908 run; actual mathematical receipts remain mandatory'
        required: false
        type: string
      boundary_run:
        description: 'Optional exact true-boundary/high run'
        required: false
        type: string
      poisson_run:
        description: 'Optional exact actual complete97 Poisson run; AST-only runs are rejected'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-same97-cap-posterior-Poisson
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  POSTERIOR_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete-same97-cap-posterior-Poisson-CI-inputs.json
  POSTERIOR_MANIFEST_SHA: 7473f7866cc7676124f0f95ce047b6316ec5a4156bed8452f3cbd1bfb257ae95
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  exact-texts:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Partially check out only the new immutable arithmetic and wrapper
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_same97_cap_posterior.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_same97_cap_posterior_CI.py
      - name: Exact source identity and syntax before mathematical imports
        run: |
          python - <<'PY_EXACT'
          import ast,hashlib,pathlib
          expected={
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_same97_cap_posterior.py':'ed62ebe4da583062bf0473aced77d8ee560c51b37c083baf490082c54e8fe1b8',
              'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_same97_cap_posterior_CI.py':'a52bb62b3ee9f882b9e1d78f0f9b5a3b25b395e2cf941fe367aa08311ce5fbd9',
          }
          for path,sha in expected.items():
              raw=pathlib.Path(path).read_bytes()
              if hashlib.sha256(raw).hexdigest()!=sha:raise ValueError('An exact posterior source changed')
              ast.parse(raw.decode(),filename=path)
          print('Both exact new sources parsed; no mathematical calculation has run')
          PY_EXACT

  select:
    needs: exact-texts
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      cap_ready: ${{ steps.actual.outputs.cap_ready }}
      poisson_ready: ${{ steps.actual.outputs.poisson_ready }}
      body_run: ${{ steps.actual.outputs.body_run }}
      body_attempt: ${{ steps.actual.outputs.body_attempt }}
      boundary_run: ${{ steps.actual.outputs.boundary_run }}
      boundary_attempt: ${{ steps.actual.outputs.boundary_attempt }}
      poisson_run: ${{ steps.actual.outputs.poisson_run }}
      poisson_attempt: ${{ steps.actual.outputs.poisson_attempt }}
    steps:
      - name: Install terminal Git
        run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact receipt verifiers and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete-same97-cap-posterior-Poisson-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate original identities without changing any scientific input
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$POSTERIOR_MANIFEST" --manifest-sha "$POSTERIOR_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
      - name: Install the pinned verifier imports without running old mathematics
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Verify actual native and child receipts even after publication failure
        id: actual
        run: >
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_same97_cap_posterior_CI.py
          --phase select
          --manifest "$POSTERIOR_MANIFEST" --manifest-sha "$POSTERIOR_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --driver-sha "$REVIEWED_DRIVER_SHA"
          --work "$RUNNER_TEMP/same97-actual-selection-work"
          --artifact-dir "$RUNNER_TEMP/same97-actual-selection-output"
          --compute-minutes 20 --checkpoint-minutes 10
      - name: Preserve genuine selection or failure receipts without a mathematical-completion claim
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-same97-actual-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/same97-actual-selection-output
          if-no-files-found: error
          retention-days: 90

  cap:
    needs: [exact-texts, select]
    if: ${{ needs.select.outputs.cap_ready == 'true' }}
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 110
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install terminal Git
        run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact inputs and previous actual posterior receipts
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/same97_cap_posterior_ci/
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete-same97-cap-posterior-Poisson-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Set actual container-visible output paths
        run: |
          printf '%s\n' "POSTERIOR_WORK=$RUNNER_TEMP/visible-exact-same97-cap-work" >> "$GITHUB_ENV"
          printf '%s\n' "POSTERIOR_OUTPUT=$RUNNER_TEMP/visible-exact-same97-cap-output" >> "$GITHUB_ENV"
      - name: Hydrate353 immutable files with original341 plus341 plus238 pins unchanged
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$POSTERIOR_MANIFEST" --manifest-sha "$POSTERIOR_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/same97_cap_posterior_ci/
      - name: Install the original pinned arithmetic environment
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Actual same97 cap with exact selected artifacts and real periodic pulls
        run: >
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_same97_cap_posterior_CI.py
          --phase cap
          --manifest "$POSTERIOR_MANIFEST" --manifest-sha "$POSTERIOR_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --driver-sha "$REVIEWED_DRIVER_SHA"
          --work "$POSTERIOR_WORK" --artifact-dir "$POSTERIOR_OUTPUT"
          --compute-minutes 60 --checkpoint-minutes 10
          --body-run ${{ needs.select.outputs.body_run }} --body-attempt ${{ needs.select.outputs.body_attempt }}
          --boundary-run ${{ needs.select.outputs.boundary_run }} --boundary-attempt ${{ needs.select.outputs.boundary_attempt }}
      - name: Require a real nonempty mathematical outcome or a genuine preserved failure
        if: always()
        run: |
          python - <<'PY_OUTCOME'
          import json,os,pathlib
          root=pathlib.Path(os.environ['POSTERIOR_OUTPUT'])
          process=root/'process.json'
          if not process.exists() or process.stat().st_size==0:
              raise ValueError('The actual posterior process is missing')
          d=json.loads(process.read_text())
          if not list((root/'native').glob('*.json.gz')) and not d.get('failure') and not d.get('publication_failure'):
              raise ValueError('There is neither an actual native nor a genuine recorded failure')
          print(json.dumps({'actual_process_bytes':process.stat().st_size,
              'mathematical_complete':d.get('complete'),'actual_failure':d.get('failure')}))
          PY_OUTCOME
      - name: Preserve complete scientific bytes and the actual process
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-same97-cap-posterior-cap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.POSTERIOR_OUTPUT }}
          if-no-files-found: error
          retention-days: 90

  compose:
    needs: [exact-texts, select, cap]
    if: ${{ always() && needs.select.result == 'success' && needs.select.outputs.cap_ready == 'true' && needs.select.outputs.poisson_ready == 'true' && needs.cap.result != 'skipped' && needs.cap.result != 'cancelled' }}
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 110
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install terminal Git
        run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact inputs and previous actual posterior receipts
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/same97_cap_posterior_ci/
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-complete-same97-cap-posterior-Poisson-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Set actual container-visible output paths
        run: |
          printf '%s\n' "POSTERIOR_WORK=$RUNNER_TEMP/visible-exact-same97-compose-work" >> "$GITHUB_ENV"
          printf '%s\n' "POSTERIOR_OUTPUT=$RUNNER_TEMP/visible-exact-same97-compose-output" >> "$GITHUB_ENV"
      - name: Hydrate353 immutable files with original341 plus341 plus238 pins unchanged
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$POSTERIOR_MANIFEST" --manifest-sha "$POSTERIOR_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/same97_cap_posterior_ci/
      - name: Install the original pinned arithmetic environment
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Actual same97 compose with exact selected artifacts and real periodic pulls
        run: >
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_complete_same97_cap_posterior_CI.py
          --phase compose
          --manifest "$POSTERIOR_MANIFEST" --manifest-sha "$POSTERIOR_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --driver-sha "$REVIEWED_DRIVER_SHA"
          --work "$POSTERIOR_WORK" --artifact-dir "$POSTERIOR_OUTPUT"
          --compute-minutes 60 --checkpoint-minutes 10
          --cap-run ${{ github.run_id }} --cap-attempt ${{ github.run_attempt }}
          --poisson-run ${{ needs.select.outputs.poisson_run }} --poisson-attempt ${{ needs.select.outputs.poisson_attempt }}
      - name: Require a real nonempty mathematical outcome or a genuine preserved failure
        if: always()
        run: |
          python - <<'PY_OUTCOME'
          import json,os,pathlib
          root=pathlib.Path(os.environ['POSTERIOR_OUTPUT'])
          process=root/'process.json'
          if not process.exists() or process.stat().st_size==0:
              raise ValueError('The actual posterior process is missing')
          d=json.loads(process.read_text())
          if not list((root/'native').glob('*.json.gz')) and not d.get('failure') and not d.get('publication_failure'):
              raise ValueError('There is neither an actual native nor a genuine recorded failure')
          print(json.dumps({'actual_process_bytes':process.stat().st_size,
              'mathematical_complete':d.get('complete'),'actual_failure':d.get('failure')}))
          PY_OUTCOME
      - name: Preserve complete scientific bytes and the actual process
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-same97-cap-posterior-compose-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.POSTERIOR_OUTPUT }}
          if-no-files-found: error
          retention-days: 90
