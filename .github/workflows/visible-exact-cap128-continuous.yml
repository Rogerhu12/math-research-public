name: visible-exact complete physical128 cap continuous residual

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-cap128-continuous.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-cap128-continuous
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VISIBLE_CAP_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cap128-CI-pinned-inputs.json
  VISIBLE_CAP_MANIFEST_SHA: 867699a5e7f968f97d9a3f50267e310181023fdbe0b815a7f9c22c6b21585e32

jobs:
  prepare:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 350
    outputs:
      artifact_name: ${{ steps.paths.outputs.artifact_name }}
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partial checkout of the exact worker and manifest
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cap128-CI-pinned-inputs.json
      - name: Fetch only the pinned scientific files
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap128_CI_worker.py
          --mode hydrate --manifest "$VISIBLE_CAP_MANIFEST" --manifest-sha "$VISIBLE_CAP_MANIFEST_SHA"
      - name: Install the original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible artifact paths
        id: paths
        run: |
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-cap128-prepared" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "visible-exact-cap128-prepared-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Reconstruct every original array and compare its scientific bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap128_CI_worker.py
          --mode prepare --manifest "$VISIBLE_CAP_MANIFEST" --manifest-sha "$VISIBLE_CAP_MANIFEST_SHA"
          --work "$RUNNER_TEMP/visible-exact-cap128-prepare-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-cap128-prepared"
          --compute-minutes 310 --checkpoint-minutes 10
      - name: Pass the exact arrays to the independent cell ranges without committing them
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.artifact_name }}
          path: ${{ steps.paths.outputs.prepared }}/
          compression-level: 1
          retention-days: 7
          if-no-files-found: error
      - name: Preserve the actual preparation evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cap128-prepare-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.prepared }}/evidence/
            ${{ steps.paths.outputs.prepared }}/process.json
            ${{ steps.paths.outputs.prepared }}/producer.stdout.log
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn

  continuous-range:
    needs: prepare
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - first: 768
            end: 1024
          - first: 1024
            end: 1280
          - first: 1280
            end: 1536
          - first: 1536
            end: 1792
          - first: 1792
            end: 1977
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partial checkout of the exact worker and manifest
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-cap128-CI-pinned-inputs.json
      - name: Fetch only the pinned scientific files and previous native checkpoints
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap128_CI_worker.py
          --mode hydrate --manifest "$VISIBLE_CAP_MANIFEST" --manifest-sha "$VISIBLE_CAP_MANIFEST_SHA"
      - name: Install the original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible artifact paths
        id: paths
        run: |
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-cap128-bundle" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-cap128-${{ matrix.first }}-${{ matrix.end }}" >> "$GITHUB_OUTPUT"
      - name: Receive the verified common trial arrays
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ steps.paths.outputs.prepared }}
      - name: Consume the full original interval range and publish real checkpoints
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cap128_CI_worker.py
          --mode consume --manifest "$VISIBLE_CAP_MANIFEST" --manifest-sha "$VISIBLE_CAP_MANIFEST_SHA"
          --first ${{ matrix.first }} --end ${{ matrix.end }}
          --prepared "$RUNNER_TEMP/visible-exact-cap128-bundle"
          --work "$RUNNER_TEMP/visible-exact-cap128-work-${{ matrix.first }}-${{ matrix.end }}"
          --artifact-dir "$RUNNER_TEMP/visible-exact-cap128-${{ matrix.first }}-${{ matrix.end }}"
          --compute-minutes 310 --checkpoint-minutes 10
      - name: Preserve every normal or failed native prefix and process record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cap128-cells-${{ matrix.first }}-${{ matrix.end }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
