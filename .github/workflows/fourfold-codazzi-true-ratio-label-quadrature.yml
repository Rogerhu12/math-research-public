            python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_true_ratio_prefix.py "$RUNNER_TEMP/grq" "$RUNNER_TEMP/grq-result.json"
          fi
          if [ -f "$RUNNER_TEMP/grq-live-rules/status.json" ]; then
            cat "$RUNNER_TEMP/grq-live-rules/status.json"
          fi
