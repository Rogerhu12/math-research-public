        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: |
          parent="$RUNNER_TEMP/grq-inputs"
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_true_ratio_live_rules.py python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_true_ratio_label_quadrature.py --repo "$GITHUB_WORKSPACE" --private "$RUNNER_TEMP/grq" --receipt "$RUNNER_TEMP/grq-result.json" --seed "$parent/true-signed-cut-seed.bin.gz" --seed-receipt "$parent/gcs-receipt.json" --phase "$parent/true-phase-inward-complete.bin.gz" --phase-receipt "$parent/gpr-receipt.json" --phase-receipt-sha 586c1a68fd29bcb622fc2a932f0f82b6fa52468215491bec41490d9265c327c9 --phase-run 46135620219 --phase-event 12cd72d84df91a464d4d01faed764b1661af228f
