      - name: Read the exact first successful GCS and GPR attempt observations and logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/grq-logs"
          for id in 46132087372 46135620219
          do
            url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$id/attempts/1"
            curl --fail --silent --show-error --location --retry 3 --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "$url" --output "$RUNNER_TEMP/grq-logs/$id.json"
