          done
      - name: Restore both necessary original private inputs to their whole SHA
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_true_ratio_live_rules.py python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_true_ratio_restore_inputs.py --repo "$GITHUB_WORKSPACE" --logs "$RUNNER_TEMP/grq-logs" --private "$RUNNER_TEMP/grq-inputs"
