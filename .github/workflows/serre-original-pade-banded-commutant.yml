name: Serre original Pade banded commutant diagnostic v1

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/original-pade-banded-commutant-request.json

permissions:
  contents: read

concurrency:
  group: serre-original-pade-banded-commutant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_pade_banded_commutant_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/original_pade_banded_commutant.py
            /topics/serre-uniformity/notes/original-pade-banded-commutant-request.json
            /topics/serre-uniformity/notes/2026-11-28-original-Pade-banded-commutant-diagnostic.md
      - name: Pull pinned official SageMath 10.6 image
        run: docker pull sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      - name: Solve the full banded self-adjoint systems for the original Pade pairing
        env:
          SERRE_EXPECTED_REQUEST_SHA256: 'ee7af9b5f650caf3c3edf4de165795b2e497c5bd0240e296e703b3fb182da3f2'
        run: |
          timeout --signal=TERM --kill-after=30s 360s docker run --rm --cpus=4 --memory=14g \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work,readonly" \
            --workdir /work \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SHA \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e SERRE_EXPECTED_REQUEST_SHA256 \
            -e PYTHONUNBUFFERED=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879 \
            sage -python topics/serre-uniformity/scripts/original_pade_banded_commutant.py
