name: R146 quadratic cap true root capacity screen

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-quadratic-cap-root-screen-public.yml

permissions:
  contents: write

concurrency:
  group: r146-quadratic-cap-root-screen-v1
  cancel-in-progress: false

jobs:
  complete-quadratic-cap-integral:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_quadratic_cap_root_screen_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-26-R146-quadratic-cap-root-screen-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the fixed directed runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5
      - name: Restore old inputs and evaluate one complete quadratic cap integral
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_quadratic_cap_root_screen_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-26-R146-quadratic-cap-root-screen-inputs.json --manifest-sha 6e0dc5b02f4122c9ffa82c041251b1da72311f0def5817b608580ae85e213f60
