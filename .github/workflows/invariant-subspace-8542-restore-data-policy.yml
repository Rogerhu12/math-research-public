name: ISP 8542 apply existing data and formula rules
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isp-8542-data-policy-correction
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ISP_PIN: ${{ github.sha }}
      MR_TOKEN: ${{ secrets.MR_TOKEN }}
    steps:
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Read pinned correction source with partial git
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-data-policy-bootstrap"
          cd "$RUNNER_TEMP/isp-data-policy-bootstrap"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-28-restore-data-and-formula-policy-8542.py" > "$RUNNER_TEMP/isp-data-policy.py"
          python -u "$RUNNER_TEMP/isp-data-policy.py"
