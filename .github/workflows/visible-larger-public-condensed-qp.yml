name: visible-larger complete condensed QP

on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-condensed-qp-request.json

permissions:
  contents: write
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.choose.outputs.lanes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /topics/visible-flex-larger-amplitude/computations/public-condensed-qp-request.json
      - name: Select only explicitly requested public follow-up lanes
        id: choose
        run: |
          python - <<'PYLANES'
          import json, os
          from pathlib import Path
          request = json.loads(Path('topics/visible-flex-larger-amplitude/computations/public-condensed-qp-request.json').read_text())
          if request.get('repository') != 'Rogerhu12/math-research-public':
              raise ValueError('The follow-up belongs to another repository')
          allowed = {'condensedqp'}
          lanes = request.get('lanes')
          if not isinstance(lanes, list) or not lanes or any(lane not in allowed for lane in lanes) or len(set(lanes)) != len(lanes):
              raise ValueError('A nonempty list of distinct implemented follow-up lanes is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('lanes=' + json.dumps(lanes, separators=(',', ':')) + '\n')
          print('Selected public follow-up calculations: ' + ', '.join(lanes))
          PYLANES

  followup:
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lane: ${{ fromJSON(needs.select.outputs.lanes) }}
    name: Follow-up ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    concurrency:
      group: visible-larger-public-followup-${{ matrix.lane }}
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/README.md
            /topics/visible-flex-larger-amplitude/computations/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43580643038-1-free3/stage-00/actual.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-prepare112/preparation112/prepared.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-prepare112/boundary112-response/response-check.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-prepare112/T112-config.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-tailzero112/zero-H-T112/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43592195185-1-coupling112banded/full-DN112/outer-00-anchor-tail.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43663293492-1-condensedqp/twenty-four-condensed-warm/warm-001.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43663293492-1-condensedqp/twenty-four-condensed-warm/driver-status.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43663293492-1-condensedqp/twenty-four-condensed-warm/driver-status.json.gz
      - name: Bound maintenance and establish independent follow-up output paths
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          mkdir -p "$RUNNER_TEMP/visible-followup/${{ matrix.lane }}"
          echo "VISIBLE_OUT=$RUNNER_TEMP/visible-followup/${{ matrix.lane }}" >> "$GITHUB_ENV"
          echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
          echo "VISIBLE_ACCEPTED=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43580643038-1-free3/stage-00/actual.json.gz" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Bind the explicit request and current source pins
        run: |
          python - <<'PYPINS'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          repo = Path.cwd()
          comp = Path(os.environ['VISIBLE_COMPUTATIONS'])
          request_path = comp/'public-condensed-qp-request.json'
          raw = request_path.read_bytes()
          request = json.loads(raw)
          if request.get('repository') != 'Rogerhu12/math-research-public' or request.get('lanes') != ['condensedqp']:
              raise ValueError('Use exactly the implemented condensedqp follow-up request')
          required = {
              'root_20261114_complete_local_qp_condensation.py',
              'geometry_20261114_condensed_local_inequality_qp.py',
              'geometry_20261114_condensed_projection_warm.py',
              'geometry_20261114_condensed_projection_response.py',
              'geometry_20261114_thirteen_query_domain_operator.py',
              'geometry_20261114_thirteen_query_condensed_warm.py',
              'geometry_20261114_thirteen_query_condensed_response.py',
              'geometry_20261114_fourteen_query_domain_operator.py',
              'geometry_20261114_fourteen_query_condensed_warm.py',
              'geometry_20261114_fourteen_query_condensed_response.py',
              'geometry_20261114_fifteen_query_domain_operator.py',
              'geometry_20261114_fifteen_query_condensed_warm.py',
              'geometry_20261114_fifteen_query_condensed_response.py',
              'geometry_20261114_sixteen_query_domain_operator.py',
              'geometry_20261114_sixteen_query_condensed_warm.py',
              'geometry_20261114_sixteen_query_condensed_response.py',
              'geometry_20261114_sixteen_query_collocation_observer_warm.py',
              'geometry_20261114_seventeen_query_domain_operator.py',
              'geometry_20261114_seventeen_query_condensed_warm.py',
              'geometry_20261114_seventeen_query_condensed_response.py',
              'geometry_20261114_seventeen_query_collocation_observer_warm.py',
              'geometry_20261114_eighteen_query_domain_operator.py',
              'geometry_20261114_eighteen_query_condensed_warm.py',
              'geometry_20261114_eighteen_query_condensed_response.py',
              'geometry_20261114_eighteen_query_collocation_observer_warm.py',
              'geometry_20261114_nineteen_query_domain_operator.py',
              'geometry_20261114_nineteen_query_condensed_warm.py',
              'geometry_20261114_nineteen_query_condensed_response.py',
              'geometry_20261114_nineteen_query_collocation_observer_warm.py',
              'geometry_20261114_twenty_query_domain_operator.py',
              'geometry_20261114_twenty_query_condensed_warm.py',
              'geometry_20261114_twenty_query_condensed_response.py',
              'geometry_20261114_twenty_query_collocation_observer_warm.py',
              'geometry_20261114_twenty_one_query_domain_operator.py',
              'geometry_20261114_twenty_one_query_condensed_warm.py',
              'geometry_20261114_twenty_one_query_condensed_response.py',
              'geometry_20261114_twenty_one_query_collocation_observer_warm.py',
              'geometry_20261114_twenty_two_query_domain_operator.py',
              'geometry_20261114_twenty_two_query_condensed_warm.py',
              'geometry_20261114_twenty_two_query_condensed_response.py',
              'geometry_20261114_twenty_two_query_collocation_observer_warm.py',
              'geometry_20261114_twenty_three_query_domain_operator.py',
              'geometry_20261114_twenty_three_query_condensed_warm.py',
              'geometry_20261114_twenty_three_query_condensed_response.py',
              'geometry_20261114_twenty_three_query_collocation_observer_warm.py',
              'geometry_20261114_twenty_four_query_domain_operator.py',
              'geometry_20261114_twenty_four_query_condensed_warm.py',
              'geometry_20261114_twenty_four_query_condensed_response.py',
              'geometry_20261114_twenty_four_query_collocation_observer_warm.py',
              'geometry_20261114_twenty_five_query_domain_operator.py',
              'geometry_20261114_twenty_five_query_condensed_warm.py',
              'geometry_20261114_twenty_five_query_condensed_response.py',
              'geometry_20261114_twenty_five_query_collocation_observer_warm.py',
              'exact_20261114_public_resume.py',
              'root_20261114_publish_actions.py',
          }
          pins = request.get('source_sha256')
          if not isinstance(pins, dict) or not required.issubset(pins):
              raise ValueError('The request must pin the unchanged ancestors, new25 entry and separate read-only observer')
          verified = []
          for name, digest in pins.items():
              if Path(name).name != name or not isinstance(digest, str) or not re.fullmatch(r'[0-9a-f]{64}', digest):
                  raise ValueError('Use a source basename and its actual SHA256')
              content = (comp/name).read_bytes()
              actual = hashlib.sha256(content).hexdigest()
              if actual != digest:
                  raise ValueError('The requested source bytes changed: ' + name)
              verified.append(dict(file=name, bytes=len(content), sha256=actual))
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          rules = {}
          for name in ('README.md', 'topics/visible-flex-larger-amplitude/README.md'):
              rules[name] = subprocess.check_output(['git', 'rev-parse', 'HEAD:'+name], text=True).strip()
          record = dict(repository='Rogerhu12/math-research-public', source_commit=commit,
                        request_sha256=hashlib.sha256(raw).hexdigest(), request=request,
                        verified_sources=verified, initial_readme_git_blobs=rules,
                        no_private_source_or_token_used=True, scientific_execution_claimed=False)
          out = Path(os.environ['VISIBLE_OUT'])
          (out/'followup-request-identity.json').write_text(json.dumps(record, indent=2)+'\n')
          PYPINS
      - name: Compile the independent condensation and original-response interfaces
        run: |
          python -m py_compile \
            "$VISIBLE_COMPUTATIONS/root_20261114_complete_local_qp_condensation.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_condensed_local_inequality_qp.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_condensed_projection_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_condensed_projection_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_thirteen_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_thirteen_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_thirteen_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_fourteen_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_fourteen_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_fourteen_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_fifteen_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_fifteen_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_fifteen_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_sixteen_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_sixteen_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_sixteen_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_sixteen_query_collocation_observer_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_seventeen_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_seventeen_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_seventeen_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_seventeen_query_collocation_observer_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_eighteen_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_eighteen_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_eighteen_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_eighteen_query_collocation_observer_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_nineteen_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_nineteen_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_nineteen_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_nineteen_query_collocation_observer_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_query_collocation_observer_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_one_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_one_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_one_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_one_query_collocation_observer_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_two_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_two_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_two_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_two_query_collocation_observer_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_three_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_three_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_three_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_three_query_collocation_observer_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_four_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_four_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_four_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_four_query_collocation_observer_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_five_query_domain_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_five_query_condensed_warm.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_five_query_condensed_response.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_five_query_collocation_observer_warm.py"
      - name: Restore all78 consumed pinned source files from the public repository
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYSOURCE'
          import os
          from pathlib import Path
          from exact_20261114_public_resume import prepare_public_source
          source = prepare_public_source(
              Path.cwd(), Path(os.environ['RUNNER_TEMP'])/'visible-followup-public-source',
              Path(os.environ['VISIBLE_OUT']))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
          PYSOURCE
      - name: Restore the actually completed M112 preparation and boundary response
        run: |
          export PREPARED112="$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-prepare112"
          python - <<'PY112'
          import hashlib, os
          from pathlib import Path
          base = Path(os.environ['PREPARED112'])
          expected = {
              'preparation112/prepared.json.gz': '0f94dd88b4ad43a58694e25c8dded46cddcf96939abae1dc21416adb50042714',
              'boundary112-response/response-check.json': '4bacf0bdbf00fd919e4de48f0b36c8322d2ea26539abeac9b9ddcf7c0db6bf7f',
          }
          for name, digest in expected.items():
              if hashlib.sha256((base/name).read_bytes()).hexdigest() != digest:
                  raise ValueError('The actually passed M112 input changed: ' + name)
          PY112
          mkdir -p "$VISIBLE_OUT/preparation112" "$VISIBLE_OUT/boundary112-response"
          cp "$PREPARED112/preparation112/prepared.json.gz" "$VISIBLE_OUT/preparation112/prepared.json.gz"
          cp "$PREPARED112/boundary112-response/response-check.json" "$VISIBLE_OUT/boundary112-response/response-check.json"
          cp "$PREPARED112/T112-config.json" "$VISIBLE_OUT/T112-config.json"
      - name: Restore the exact actual79 parent with transparent status compression handling
        run: |
          python - <<'PYPARENT79'
          import gzip, hashlib, json, os
          from pathlib import Path
          base = Path.cwd()/'topics/visible-flex-larger-amplitude/notes/public-actions-43663293492-1-condensedqp/twenty-four-condensed-warm'
          out = Path(os.environ['VISIBLE_OUT'])/'parent79'
          out.mkdir(parents=True, exist_ok=True)
          warm = base/'warm-001.json.gz'
          warm_bytes = warm.read_bytes()
          warm_sha = hashlib.sha256(warm_bytes).hexdigest()
          if len(warm_bytes) != 4868398 or warm_sha != '565e2487317ffbc85560dd01efa2cfb4e479447d51a17216deb4ef61f55b4504':
              raise ValueError('Retain the actual79 compressed warm bytes')
          available = [p for p in (base/'driver-status.json', base/'driver-status.json.gz') if p.exists()]
          if not available:
              raise FileNotFoundError('The actual79 status was not checked out')
          records, raw_status = [], None
          for path in available:
              stored = path.read_bytes()
              stored_sha = hashlib.sha256(stored).hexdigest()
              if stored[:2] == b'\x1f\x8b' and (len(stored) != 312135 or stored_sha != 'aea13404a1cd1109f207cbb2a6f3c46fb885518ab7e29c480ba332ea21d756b6'):
                  raise ValueError('The actual79 published compressed status identity changed')
              raw = gzip.decompress(stored) if stored[:2] == b'\x1f\x8b' else stored
              digest = hashlib.sha256(raw).hexdigest()
              if len(raw) != 2683314 or digest != 'e790e998ed6eebdc084546131e206dd4e5d723aebf7f92830b3153f82a25a8c0':
                  raise ValueError('The original actual79 status bytes changed: '+path.name)
              if raw_status is not None and raw != raw_status:
                  raise ValueError('Published status aliases must preserve identical original bytes')
              raw_status = raw
              records.append(dict(file=path.name, stored_bytes=len(stored),
                  stored_sha256=stored_sha,
                  original_bytes=len(raw), original_sha256=digest,
                  decompressed=stored[:2] == b'\x1f\x8b'))
          status = json.loads(raw_status)
          if (status.get('schema') != 'exact-constraint-twenty-four-query-condensed-complete-H-warm-v1'
              or status.get('accepted_warm_steps') != 1
              or status.get('optimization_progress') is not True
              or status.get('latest_warm_sha256') != warm_sha
              or status.get('latest_warm_file') != warm.name
              or status.get('success') is not False
              or status.get('new_coupled_finite_acceptance') is not False):
              raise ValueError('Use the exact completed unaccepted actual79 pair')
          (out/warm.name).write_bytes(warm_bytes)
          (out/'driver-status.json').write_bytes(raw_status)
          record = dict(parent_run=43663293492, source_commit='31d2ad909638aa3eb3211a9ea0feed632c0e9a2b',
              warm=dict(file=warm.name, sha256=warm_sha, bytes=len(warm_bytes)),
              status_transport=records, original_JSON_reserialized=False,
              original_scientific_data_changed=False)
          (out/'restore-identity.json').write_text(json.dumps(record, indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('VISIBLE_PARENT79='+str(out)+'\n')
          PYPARENT79
      - name: Add only original left-RMS465 to one complete25query model at actual79
        if: matrix.lane == 'condensedqp'
        timeout-minutes: 35
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_five_query_collocation_observer_warm.py" \
            --accepted "$VISIBLE_ACCEPTED" \
            --prepared "$VISIBLE_OUT/preparation112/prepared.json.gz" \
            --tail-anchor "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43592195185-1-coupling112banded/full-DN112/outer-00-anchor-tail.json.gz" \
            --tail-config "$VISIBLE_OUT/T112-config.json" \
            --resume "$VISIBLE_PARENT79/warm-001.json.gz" \
            --expected-resume-sha 565e2487317ffbc85560dd01efa2cfb4e479447d51a17216deb4ef61f55b4504 \
            --parent-status "$VISIBLE_PARENT79/driver-status.json" \
            --expected-parent-status-sha e790e998ed6eebdc084546131e206dd4e5d723aebf7f92830b3153f82a25a8c0 \
            --out "$VISIBLE_OUT/twenty-five-condensed-warm" \
            --iterations 1 --damping 270 --lsmr-iterations 200 \
            --projection-sweeps 200 --line-search-steps 17 \
            --budget-seconds 1200 --angles 4096 --jac-workers 2 \
            --condensed-budget-seconds 600 --condensed-trial-reserve-seconds 90 \
            --condensed-recovery-reserve-seconds 30 --condensed-max-working 512 \
            --condensed-dual-sweeps 200 --condensed-store-root
          python - <<'PYWARM'
          import hashlib, json, os
          from pathlib import Path
          directory = Path(os.environ['VISIBLE_OUT'])/'twenty-five-condensed-warm'
          status = json.loads((directory/'driver-status.json').read_text())
          if status.get('schema') != 'exact-constraint-twenty-five-query-condensed-complete-H-warm-v1':
              raise ValueError('Keep the actual independent condensed warm producer schema')
          if not status.get('optimization_progress') or status.get('accepted_warm_steps') != 1:
              raise ValueError('One actual decreased complete original warm is required')
          name = status['latest_warm_file']
          if Path(name).name != name:
              raise ValueError('Keep the actual warm in its declared output directory')
          path = directory/name
          if hashlib.sha256(path.read_bytes()).hexdigest() != status['latest_warm_sha256']:
              raise ValueError('The actual complete condensed warm identity changed')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('VISIBLE_CONDENSED_WARM='+str(path)+'\n')
          PYWARM
      - name: Recheck the original complete Rphi derivatives on the actual recovered warm
        if: matrix.lane == 'condensedqp'
        timeout-minutes: 25
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_twenty_five_query_condensed_response.py" \
            --accepted "$VISIBLE_ACCEPTED" --prepared "$VISIBLE_CONDENSED_WARM" \
            --tail-anchor "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43592195185-1-coupling112banded/full-DN112/outer-00-anchor-tail.json.gz" \
            --tail-config "$VISIBLE_OUT/T112-config.json" \
            --out "$VISIBLE_OUT/physical-response" --angles 4096
      - name: Preserve every actual result and failure checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-followup-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visible-followup/${{ matrix.lane }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded outputs with the original ordinary rebase and README check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u "$VISIBLE_COMPUTATIONS/root_20261114_publish_actions.py" \
            --results "$VISIBLE_OUT" --lane "${{ matrix.lane }}"

