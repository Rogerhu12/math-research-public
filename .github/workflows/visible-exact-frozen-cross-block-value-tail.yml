name: visible-exact frozen cross block value tail

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-frozen-cross-block-value-tail.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-frozen-cross-block-value-tail
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  EXPECTED_WORKER_SHA: '0699ff330b6a1abd0fe369a81679dd816bcd4a922e2c2a959c631ace53a78c36'
  EXPECTED_MANIFEST_SHA: '4470a77b832b95ca6050912296eb1b45d8d6e84b4d65377d7a39e1c14a498423'

jobs:
  one-new-target:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Partially check out the frozen operational inputs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_frozen_cross_block_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-16-R133-frozen-cross-block-current-inputs.json
      - name: Set up the directed runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the one directed dependency
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Verify the complete worker and manifest before execution
        run: |
          python - <<'PY_FROZEN'
          import ast, hashlib, os
          from pathlib import Path
          for relative, name in [
              ("topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_frozen_cross_block_public_worker.py", "EXPECTED_WORKER_SHA"),
              ("topics/visible-flex-exact-nearby/notes/2026-11-16-R133-frozen-cross-block-current-inputs.json", "EXPECTED_MANIFEST_SHA"),
          ]:
              raw = Path(relative).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[name]:
                  raise RuntimeError("frozen input changed: " + relative)
              raw.decode("utf-8")
              if relative.endswith(".py"):
                  ast.parse(raw.decode("utf-8"), filename=relative)
          print("Complete frozen operational inputs verified; no scientific function called.")
          PY_FROZEN
      - name: Restore exact original inputs and run five new whole maxima with two fixed refinements
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_frozen_cross_block_public_worker.py \
            --repo "$GITHUB_WORKSPACE" \
            --manifest topics/visible-flex-exact-nearby/notes/2026-11-16-R133-frozen-cross-block-current-inputs.json \
            --manifest-sha "$EXPECTED_MANIFEST_SHA"
