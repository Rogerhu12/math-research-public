          for i,name in enumerate(('job-science-deadline.json','pre-BVP-readback-quiescence.json',
              'rule-readback-quiescence.json','BVP-recipe.json','current-C-BVP-client-config.json','dispatch-request.json')):
            path=base/name
            if path.is_file():
              value,identity=R.optional(path)
              R.emit('REQUEST169_RESOURCE_%03d'%i,dict(original_file=identity,original_value=value,read_only=True))
          if not observed['quiescent']:
            R.emit('REQUEST169_RULE_LIVE_SCOPE_UNPAID',dict(
              quiescent=False,complete_mutable_rule_streams_not_claimed=True,
              cleanup_must_be_skipped=True,not_a_mathematical_rejection=True))
            raise SystemExit(2)
          for index,path in enumerate(sorted(base.glob('*rule-sync*'))):
            if not path.is_dir() or path.is_symlink():continue
            for j,item in enumerate(sorted(path.rglob('*'))):
              if not item.is_file() or item.is_symlink():continue
              label='REQUEST169_RULE_%03d_%05d'%(index,j)
              if item.name.endswith('.json'):
                value,identity=R.optional(item)
                R.emit(label,dict(original_file=identity,original_value=value,read_only=True))
              else:R.original_bytes(item,label)
          R.emit('REQUEST169_COMPLETE_RULE_READBACK',dict(read_only=True,
            complete_rule_files=len(R._seen),original_read_errors=R._errors,
            cleanup_waits_for_this_readback=True,no_scientific_acceptance_inferred=True))
          if R._errors:raise SystemExit(2)
          marker=dict(schema='request169-complete-rule-resource-readback-v1',
            repository=os.environ['GITHUB_REPOSITORY'],run_id=os.environ['GITHUB_RUN_ID'],
            source_commit=os.environ['GITHUB_SHA'],complete=True,quiescent=True)
          (base/'rule-readback-complete.json').write_bytes(R.canonical(marker))
          PYRULESREAD
      - name: Remove only request169 owned raw after all complete readbacks and actual quiescence
        if: always()
        env:
          C_READBACK_OUTCOME: ${{ steps.scalar.outcome }}
          CUT_READBACK_OUTCOME: ${{ steps.cut_twojet.outcome }}
          CONSTRUCTION_READBACK_OUTCOME: ${{ steps.construction_readback.outcome }}
          FAR_READBACK_OUTCOME: ${{ steps.far_scalar.outcome }}
          BVP_READBACK_OUTCOME: ${{ steps.bvp_scalar.outcome }}
          RULES_READBACK_OUTCOME: ${{ steps.rules_scalar.outcome }}
        run: |
          python - <<'PYCLEAN'
          import hashlib,json,os,runpy,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']).resolve()
          target=Path(os.environ.get('VISIBLE_BASE',str(root/'visible-current-C-projective-full453169')))
          try:
            assert target.name=='visible-current-C-projective-full453169'
            assert not target.is_symlink() and target.resolve().parent==root
            outcomes={name:os.environ.get(name) for name in
              ('C_READBACK_OUTCOME','CUT_READBACK_OUTCOME','CONSTRUCTION_READBACK_OUTCOME',
               'FAR_READBACK_OUTCOME','BVP_READBACK_OUTCOME','RULES_READBACK_OUTCOME')}
            if any(value!='success' for value in outcomes.values()):
              raise RuntimeError('Actual readback steps did not all return success: '+json.dumps(outcomes,sort_keys=True))
            bvp=json.loads((target/'BVP-scalar-readout'/'readback-complete.json').read_bytes())
            rules=json.loads((target/'rule-readback-complete.json').read_bytes())
            for marker in (bvp,rules):
              assert marker['repository']==os.environ['GITHUB_REPOSITORY']
              assert marker['run_id']==os.environ['GITHUB_RUN_ID'] and marker['source_commit']==os.environ['GITHUB_SHA']
            assert bvp['complete_scalar_readback_without_recorded_read_error'] is True and bvp['quiescent'] is True
            assert rules['complete'] is True and rules['quiescent'] is True
            owner=target/'request169_owned_process.py'
            assert hashlib.sha256(owner.read_bytes()).hexdigest()=='a2af90fceba09ed8d061b781151afab9bcb156cad3c4c23fb0b91b2d6d035e34'
            owned=runpy.run_path(str(owner),run_name='_request169_cleanup_owner')
            observed=owned['observe']()
            if not observed['quiescent']:raise RuntimeError('Owned rule/science processes remain live or unknown')
            launch=target/'BVP-launch'
            if launch.exists():
              state=json.loads((launch/'result.json').read_bytes())
              if state.get('owned_group_quiescent_before_readback') is not True:
                raise RuntimeError('The independent BVP group was not observed stopped')
              if state.get('run_id')!=os.environ['GITHUB_RUN_ID'] or state.get('source_commit')!=os.environ['GITHUB_SHA']:
                raise RuntimeError('Original BVP quiescence result is not from this run/source')
            if target.is_dir():shutil.rmtree(target)
            print(json.dumps(dict(event='request169_owned_temporary_payload_removed',
              original_complete_readback_steps=outcomes,quiescent=True,
              original_sources_inputs_and_raw_not_uploaded=True)),flush=True)
          except Exception as error:
            print(json.dumps(dict(event='request169_owned_cleanup_skipped',error=repr(error),
              raw_left_only_until_runner_destruction=True,
              no_missing_readback_or_scientific_completion_inferred=True,
              no_other_repository_or_input_or_process_touched=True)),flush=True)
          PYCLEAN
  report:
    name: Repeat exact bounded primary scopes without a scientific calculation
    needs: compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMPUTE_RESULT: ${{ needs.compute.result }}
      BVP_OUTCOME: ${{ needs.compute.outputs.BVP_science_outcome }}
      SCALAR_SUMMARY: ${{ needs.compute.outputs.scalar_summary }}
      SCALAR_SUMMARY_BYTES: ${{ needs.compute.outputs.scalar_summary_bytes }}
      SCALAR_SUMMARY_SHA256: ${{ needs.compute.outputs.scalar_summary_sha256 }}
      CUT_TWOJET_SUMMARY: ${{ needs.compute.outputs.cut_twojet_summary }}
      CUT_TWOJET_SUMMARY_BYTES: ${{ needs.compute.outputs.cut_twojet_summary_bytes }}
      CUT_TWOJET_SUMMARY_SHA256: ${{ needs.compute.outputs.cut_twojet_summary_sha256 }}
      FAR_SUMMARY: ${{ needs.compute.outputs.far_summary }}
      FAR_SUMMARY_BYTES: ${{ needs.compute.outputs.far_summary_bytes }}
      FAR_SUMMARY_SHA256: ${{ needs.compute.outputs.far_summary_sha256 }}
      CONSTRUCTION_SUMMARY: ${{ needs.compute.outputs.construction_summary }}
      CONSTRUCTION_SUMMARY_BYTES: ${{ needs.compute.outputs.construction_summary_bytes }}
      CONSTRUCTION_SUMMARY_SHA256: ${{ needs.compute.outputs.construction_summary_sha256 }}
      BVP_SUMMARY: ${{ needs.compute.outputs.bvp_summary }}
      BVP_SUMMARY_BYTES: ${{ needs.compute.outputs.bvp_summary_bytes }}
      BVP_SUMMARY_SHA256: ${{ needs.compute.outputs.bvp_summary_sha256 }}
    steps:
      - name: Print all five actual primary summaries and preserve original compute outcome
        run: |
          python3 - <<'PYREPORT'
          import hashlib,json,os
          names=('scalar_summary','cut_twojet_summary','far_summary','construction_summary','bvp_summary')
          errors=[]
          for name in names:
           key=name.upper();text=os.environ.get(key,'')
           if not text:
            print(json.dumps(dict(event='request169_primary_unavailable',original_kind=name,
             compute_result=os.environ.get('COMPUTE_RESULT'),BVP_outcome=os.environ.get('BVP_OUTCOME'),
             no_native_BVP_or_upstream_success_inferred=True)),flush=True)
            continue
           try:
            expected_size=int(os.environ[key+'_BYTES']);expected_sha=os.environ[key+'_SHA256']
            raw=text.encode()
            if len(raw)!=expected_size or hashlib.sha256(raw).hexdigest()!=expected_sha:raw+=b'\n'
            assert len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected_sha
            assert len(raw)<=90000
            json.loads(raw)
            print('BEGIN_REQUEST169_'+key)
            print(raw.decode(),end='' if raw.endswith(b'\n') else '\n')
            print('END_REQUEST169_'+key)
            print(json.dumps(dict(event='request169_original_primary_identity',kind=name,
             original_bytes=len(raw),original_sha256=expected_sha,
             all_detailed_trial_member_and_failure_segments_remain_in_original_compute_log=True)),flush=True)
           except Exception as error:errors.append(dict(kind=name,error=repr(error)))
          print(json.dumps(dict(event='request169_report_transport_scope',errors=errors,
           compute_result=os.environ.get('COMPUTE_RESULT'),BVP_outcome=os.environ.get('BVP_OUTCOME'),
           report_success_not_a_mathematical_BVP_or_closed_surface_result=True)),flush=True)
          if errors or os.environ.get('COMPUTE_RESULT')!='success':raise SystemExit(2)
          PYREPORT
