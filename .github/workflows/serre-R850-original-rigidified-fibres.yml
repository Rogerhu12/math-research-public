name: Serre original rigidified Poincare fibres and theta section

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R850-original-rigidified-fibres-public-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R850-original-rigidified-fibres
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/notes/R850-original-rigidified-fibres-public-request.json
      - name: Pull main and compare both rule files with the read commit
        env:
          REQUEST_SOURCE: ${{ github.sha }}
          RECEIPT_PATH: ${{ runner.temp }}/R850-rigidified-fibres-rules-pull.json
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, subprocess
          from pathlib import Path
          path='topics/serre-uniformity/notes/R850-original-rigidified-fibres-public-request.json'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',os.environ['REQUEST_SOURCE']],check=True)
          request=json.loads(subprocess.check_output(['git','show',os.environ['REQUEST_SOURCE']+':'+path]))
          subprocess.run(['git','checkout','-B','r850-rigidified-fibres-rules-main'],check=True)
          subprocess.run(['git','pull','--rebase','origin','main'],check=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          old=request['rules_last_read_commit']
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',old],check=True)
          actual={key:hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  for key,name in [('root','README.md'),('topic','topics/serre-uniformity/README.md')]}
          changed=actual!=request['readme_sha256']
          receipt={'actual_git_pull_rebase_completed':True,'actual_head':head,'previous_read_commit':old,
                   'actual_UTC':dt.datetime.now(dt.timezone.utc).isoformat(),'readme_sha256':actual,
                   'expected_readme_sha256':request['readme_sha256'],'rules_changed':changed}
          Path(os.environ['RECEIPT_PATH']).write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('R850_RULES_PULL='+json.dumps(receipt,sort_keys=True))
          if changed:
              subprocess.run(['git','diff',old,head,'--','README.md','topics/serre-uniformity/README.md'],check=True)
              raise SystemExit('Read both changed README files before the new arithmetic.')
          PY
      - name: Preserve the actual pull receipt for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-R850-rigidified-fibres-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R850-rigidified-fibres-rules-pull.json
          retention-days: 1
          if-no-files-found: warn

  compute:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R850_original_rigidified_fibres.py
            /topics/serre-uniformity/scripts/R850_public_original_rigidified_fibres.py
            /topics/serre-uniformity/scripts/R839_original_global_polar_DAG.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/notes/2026-11-16-original-c0-rigidified-Poincare-fibres-and-theta-section-DAG.md
            /topics/serre-uniformity/notes/R850-original-rigidified-fibres-consumer-method.md
            /topics/serre-uniformity/notes/R850-original-rigidified-fibres-public-request.json
            /.github/workflows/serre-R850-original-rigidified-fibres.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse the exact sources without importing mathematical code
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          base=Path('topics/serre-uniformity/scripts')
          for name in ('R850_original_rigidified_fibres.py','R850_public_original_rigidified_fibres.py',
                       'R839_original_global_polar_DAG.py','R824_public_original_global_polar_generators.py'):
              path=base/name
              ast.parse(path.read_text(),filename=str(path))
              print('AST_OK',name)
          PY
      - name: Compose the five original rigidified fibres and full sections
        run: |
          python topics/serre-uniformity/scripts/R850_public_original_rigidified_fibres.py compute \
            --out "$RUNNER_TEMP/R850-rigidified-fibres/output"
      - name: Verify all completed stages and original source identities
        if: always()
        run: |
          python topics/serre-uniformity/scripts/R850_public_original_rigidified_fibres.py verify \
            --out "$RUNNER_TEMP/R850-rigidified-fibres/output"
      - name: Preserve completed stages and both necessary original carriers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-global-R850-original-rigidified-fibres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R850-rigidified-fibres/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
