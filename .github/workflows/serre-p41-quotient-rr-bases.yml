name: Serre p41 original quotient RR bases

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R771-public-quotient-RR-bases-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R771-original-quotient-RR-bases
  cancel-in-progress: false

jobs:
  original_quotient_rr_bases:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-quotient-rr-bases.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R771_original_quotient_RR_bases.py
            /topics/serre-uniformity/scripts/R771_public_quotient_RR_bases.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R771-public-quotient-RR-bases-request.json
            /topics/serre-uniformity/notes/R771-original-quotient-RR-bases-method.md
            /topics/serre-uniformity/results/R767-original-quotient-low-weight-RR-basis-and-cusp-order-bound.md
            /topics/serre-uniformity/computations/R745-p41-original-Hodge-input/43616027318-1/p41-original-Hodge-input-certificate.json
            /topics/serre-uniformity/computations/R759-original-integral-period-lattice-and-map-degrees/43625474728-1/p41-original-integral-period-lattice-and-degree-certificate.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact finite-field arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Build original Eisenstein recipes and certify all three actual bases
        continue-on-error: true
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R771_public_quotient_RR_bases.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R771-p41-original-quotient-RR-bases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R771-p41-original-quotient-RR-bases/output
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve all states and publish small complete or failed receipts
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R771_public_quotient_RR_bases.py publish
      - name: Require actual 146 694 1514 ranks and nonzero minors
        if: always()
        run: python topics/serre-uniformity/scripts/R771_public_quotient_RR_bases.py verify
