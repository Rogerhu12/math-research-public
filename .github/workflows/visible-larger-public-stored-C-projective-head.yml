                if kind=='unvisited-query-suffix':query_suffixes.append(item)
            assert rows==unpaid['rows']
            summary['complete_unpaid_scope']=dict(original_ledger=actual,rows=rows,
              exact_row_count_by_kind=dict(counts),first_original_issue=first_issue,
              all_unvisited_source_piece_suffixes=source_suffixes,all_unvisited_query_suffixes=query_suffixes,
              other_closed_panel_rows_are_in_recomputable_ledger_not_silently_claimed_paid=True)
          else:
            summary['failure_scope']='No final producer result available for quiescent readback; original errors and observed active/unidentified owners remain separate; no scientific completion is inferred.'
          rules=base/'rule-sync'/'runner-result.json'
          if rules.is_file():summary['rules_runner_result']=dict(original_file=digest(rules),value=json.loads(rules.read_bytes()))
          raw=json.dumps(summary,ensure_ascii=False,separators=(',',':'),allow_nan=False).encode()
          if len(raw)>90000:
            print(json.dumps(dict(event='request162_actual_scalar_summary_too_large',bytes=len(raw),
              sha256=hashlib.sha256(raw).hexdigest(),no_truncation_and_no_success_relabel=True)),flush=True)
            raise SystemExit(70)
          print('BEGIN_REQUEST162_ACTUAL_CONTINUOUS_E_SCALAR_SUMMARY')
          print(raw.decode())
          print('END_REQUEST162_ACTUAL_CONTINUOUS_E_SCALAR_SUMMARY')
          checksum=hashlib.sha256(raw).hexdigest()
          print(json.dumps(dict(event='request162_actual_scalar_identity',bytes=len(raw),sha256=checksum,
            hash_scope='compact UTF8 JSON excluding separator LF',raw_upload=False)),flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
            stream.write('scalar_summary='+raw.decode()+'\n')
            stream.write('scalar_summary_bytes='+str(len(raw))+'\n')
            stream.write('scalar_summary_sha256='+checksum+'\n')
          PYSCALAR
      - name: Read all actual deep rows and retain only original scope and identities
        id: far_scalar
        if: always()
        run: |
          python - <<'PYFARREAD'
          import hashlib,json,os,sys
          from pathlib import Path,PurePosixPath
          base=Path(os.environ['VISIBLE_BASE']);out=base/'deep-far'
          sys.path.insert(0,str(base))
          import request162_owned_process as owned
          observation=owned.observe()
          request=json.loads((base/'dispatch-request.json').read_bytes())
          def canonical(value):
            return (json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False)+'\n').encode()
          def checked(desc):
            rel=PurePosixPath(desc['file']);assert not rel.is_absolute() and '..' not in rel.parts
            path=out/rel;assert not path.is_symlink() and path.resolve().is_relative_to(out.resolve())
            h=hashlib.sha256();size=0;rows=0
            with path.open('rb') as stream:
              for raw in stream:h.update(raw);size+=len(raw);rows+=1
            assert size==desc['bytes'] and h.hexdigest()==desc['sha256']
            if 'rows' in desc:assert rows==desc['rows']
            return path
          path=out/'result.json'
          summary=dict(schema='request162-actual-deep-far-scalar-readout-v1',source_result=None,
            run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],
            deep_step_outcome='${{ steps.far.outcome }}',cut_DN_not_inferred=True,
            readout_performs_no_new_scientific_arithmetic=True)
          summary['original_owner_observation']=observation
          if path.is_file() and observation['quiescent']:
            raw=path.read_bytes();result=json.loads(raw)
            assert result['schema']==request['deep_far']['schema']
            assert result['source_sha256']==request['deep_far']['sha256']
            assert result['run_id']==os.environ['GITHUB_RUN_ID'] and result['source_commit']==os.environ['GITHUB_SHA']
            checked(result['input_binding'])
            rows_path=checked(result['complete_rows']);frequencies=[]
            with rows_path.open('rb') as stream:
              for line in stream:
                item=json.loads(line);frequencies.append(item['physical_frequency'])
                assert item['mode_index']==len(frequencies)-1
                assert item['physical_frequency']==2*len(frequencies) and item['far_port']==159
                assert item['every_actual_original_root_choice_included'] is True
            assert frequencies==result['completed_modes']
            summary.update(source_result=result,actual_result_file=dict(file='result.json',
              bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()),
              actual_complete_row_stream_read=True,actual_row_frequencies=frequencies,
              all_numeric_row_words_were_not_recomputed_by_reader=True)
          else:
            summary['unavailable_scope']='No final original deep result available for quiescent readback; no deep or cut completion inferred.'
          rules=base/'rule-sync-far'/'runner-result.json'
          if rules.is_file():
            raw=rules.read_bytes()
            summary['rules_runner_result']=dict(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),value=json.loads(raw))
          raw=canonical(summary)
          if len(raw)>90000:
            print(json.dumps(dict(event='request162_far_readout_too_large',bytes=len(raw),
              sha256=hashlib.sha256(raw).hexdigest(),no_truncation=True)),flush=True)
            raise SystemExit(70)
          print('BEGIN_REQUEST162_ACTUAL_DEEP_FAR_SUMMARY');print(raw.decode(),end='');print('END_REQUEST162_ACTUAL_DEEP_FAR_SUMMARY')
          checksum=hashlib.sha256(raw).hexdigest()
          print(json.dumps(dict(event='request162_far_readout_identity',bytes=len(raw),sha256=checksum,
            hash_scope='canonical UTF8 JSON including final LF')),flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
            stream.write('far_summary='+raw.decode().rstrip('\n')+'\n')
            stream.write('far_summary_bytes='+str(len(raw))+'\n')
            stream.write('far_summary_sha256='+checksum+'\n')
          PYFARREAD
      - name: Read every original mode cut candidate cut leaf unpaid record and complete rule receipts
        id: linear_scalar
        if: always()
        timeout-minutes: 30
        run: |
          python -u - <<'PYPROJECTIVEREAD'
          import hashlib,importlib.util,json,os,subprocess,sys
          from pathlib import Path
          base=Path(os.environ['VISIBLE_BASE']);comp=Path(os.environ['VISIBLE_COMPUTATIONS']).resolve()
          request_path=base/'dispatch-request.json';request=json.loads(request_path.read_bytes())
          sys.path.insert(0,str(base))
          import request162_owned_process as owned
          observation=owned.observe()
          directory=base/'owned-rule-sync-processes';directory.mkdir(exist_ok=True)
          raw=owned.canonical(observation)
          with (directory/'quiescence-before-complete-readback.json').open('xb') as stream:
            stream.write(raw);stream.flush();os.fsync(stream.fileno())
          item=request['projective_readout'];source=(comp/item['file']).read_bytes()
          assert len(source)==item['bytes'] and hashlib.sha256(source).hexdigest()==item['sha256']
          if observation['quiescent']:
            command=[sys.executable,'-u',str(comp/item['file']),'--base',str(base),
              '--request',str(request_path),'--computations',str(comp),
              '--linear-step-outcome','${{ steps.linear.outcome }}',
              '--out',str(base/'projective-scalar-readout')]
            raise SystemExit(subprocess.run(command).returncode)
          # An interrupted live stream is not hashed as if it were closed.
          # Original rule/error receipts are still copied as complete observed
          # byte prefixes; their possible later tails remain explicitly unread.
          helper=item['standard_library_helper'];path=comp/helper['file'];source=path.read_bytes()
          assert len(source)==helper['bytes'] and hashlib.sha256(source).hexdigest()==helper['sha256']
          spec=importlib.util.spec_from_file_location('request162_original_metadata_helper',path)
          R=importlib.util.module_from_spec(spec);spec.loader.exec_module(R)
          R.emit('REQUEST162_ACTIVE_OR_UNKNOWN_ORIGINAL_OWNERS',observation)
          identities=[];errors=[]
          for i,folder in enumerate(sorted(base.glob('*rule-sync*'))):
            if not folder.is_dir() or folder.is_symlink():continue
            for j,path in enumerate(sorted(folder.rglob('*'))):
              if path.is_symlink() or not path.is_file():continue
              try:
                with path.open('rb') as stream:
                  before=os.fstat(stream.fileno());data=stream.read(before.st_size);after=os.fstat(stream.fileno())
                if len(data)!=before.st_size:raise ValueError('An observed original metadata prefix shrank during readback')
                label='REQUEST162_ACTIVE_OWNER_ERROR_PREFIX_%04d_%06d'%(i,j)
                R.original_bytes(path,label,data)
                identities.append(dict(relative_file=str(path.relative_to(base)),
                  bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),
                  original_device=before.st_dev,original_inode=before.st_ino,
                  observed_size_before=before.st_size,observed_size_after=after.st_size,
                  same_stat_during_copy=(before.st_size==after.st_size and before.st_mtime_ns==after.st_mtime_ns),
                  complete_only_for_this_observed_prefix_not_a_claim_of_stream_close=True))
              except Exception as failure:
                errors.append(dict(original_path=str(path.relative_to(base)),
                  type=type(failure).__name__,message=str(failure)))
          R.emit('REQUEST162_COMPLETE_OBSERVED_RULE_ERROR_PREFIX_IDENTITIES',
            dict(files=identities,errors=errors,all_scientific_streams_left_unread=True,
              no_complete_readback_marker_written=True,owned_raw_retained_until_runner_destruction=True))
          summary=dict(schema='request162-actual-finite-head-complete-scope-readout-v1',
            repository=request['repository'],request_number=162,run_id=os.environ['GITHUB_RUN_ID'],
            source_commit=os.environ['GITHUB_SHA'],linear_step_outcome='${{ steps.linear.outcome }}',
            complete_scalar_readback_without_recorded_read_error=False,
            source_result_available=None,original_mode_record_count=None,
            original_owner_observation=observation,observed_rule_error_prefix_count=len(identities),
            metadata_prefix_read_errors=errors,
            complete_detailed_source_result_and_mode_cut_leaf_unpaid_records_in_stdout=False,
            explicit_unread_scope=['all scientific result and ledger streams of active or unidentified owners',
              'any later bytes appended to the observed rule/error metadata prefixes'],
            reader_success_is_not_scientific_success=True,
            no_scientific_arithmetic_performed=True,no_owned_raw_deleted=True)
          raw=R.canonical(summary);assert len(raw)<=90000
          R.emit('REQUEST162_FINITE_HEAD_SUMMARY',summary)
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
            stream.write('finite_head_summary='+raw.decode().rstrip('\n')+'\n')
            stream.write('finite_head_summary_bytes='+str(len(raw))+'\n')
            stream.write('finite_head_summary_sha256='+hashlib.sha256(raw).hexdigest()+'\n')
          raise SystemExit(2)
          PYPROJECTIVEREAD
      - name: Remove only request162 owned raw after actual complete readback and quiescent owners
        if: always()
        run: |
          python - <<'PYCLEAN'
          import hashlib,json,os,shutil,sys
          from pathlib import Path
          temporary=Path(os.environ['RUNNER_TEMP']).resolve()
          target=Path(os.environ.get('VISIBLE_BASE',str(temporary/'visible-stored-C-projective162')))
          steps=dict(original_C='${{ steps.scalar.outcome }}',
            original_cut='${{ steps.cut_twojet.outcome }}',original_deep='${{ steps.far_scalar.outcome }}',
            original_projective_and_rules='${{ steps.linear_scalar.outcome }}')
          try:
            assert target.name=='visible-stored-C-projective162' and not target.is_symlink()
            assert target.resolve().parent==temporary
            if not target.is_dir():
              print(json.dumps(dict(event='request162_no_owned_namespace_to_remove',
                actual_readback_step_outcomes=steps,no_raw_deletion_performed=True)),flush=True)
              raise SystemExit(0)
            sys.path.insert(0,str(target))
            import request162_owned_process as owned
            observation=owned.observe()
            marker=target/'projective-scalar-readout'/'readback-complete.json'
            marker_identity=None;marker_valid=False
            if marker.is_file() and not marker.is_symlink():
              raw=marker.read_bytes();record=json.loads(raw)
              marker_identity=dict(file=str(marker.relative_to(target)),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
              marker_valid=(record['schema']=='request162-projective-head-complete-scalar-readback-v1-complete-marker'
                and record['run_id']==os.environ['GITHUB_RUN_ID'] and record['source_commit']==os.environ['GITHUB_SHA'])
            allowed=(all(value=='success' for value in steps.values()) and marker_valid and observation['quiescent'])
            receipt=dict(event='request162_conditional_owned_cleanup',
              actual_readback_step_outcomes=steps,actual_complete_readback_marker=marker_identity,
              marker_matches_actual_run_and_source=marker_valid,
              current_original_process_observation=observation,cleanup_authorized_by_actual_readback_and_quiescence=allowed,
              no_scientific_acceptance_gate_added=True,
              scientific_completion_not_inferred_from_readback_success=True)
            print(json.dumps(receipt),flush=True)
            if allowed:
              shutil.rmtree(target)
              print(json.dumps(dict(event='request162_owned_raw_removed_after_complete_readback',
                removed_exact_namespace=str(target),raw_artifact_release_git_upload=False)),flush=True)
            else:
              print(json.dumps(dict(event='request162_owned_raw_retained',
                until='original runner destruction',reason='An actual readback, complete marker or owner-quiescence condition is absent',
                no_unread_raw_actively_deleted=True)),flush=True)
          except Exception as failure:
            print(json.dumps(dict(event='request162_owned_cleanup_not_performed',
              error_type=type(failure).__name__,error=str(failure),
              owned_raw_retained_until_runner_destruction=True,
              separate_from_original_scientific_result=True)),flush=True)
            raise SystemExit(2)
          PYCLEAN
  report:
    name: Actual continuous model scope and output hashes only
    needs: compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCALAR_SUMMARY: ${{ needs.compute.outputs.scalar_summary }}
      SCALAR_SUMMARY_BYTES: ${{ needs.compute.outputs.scalar_summary_bytes }}
      SCALAR_SUMMARY_SHA256: ${{ needs.compute.outputs.scalar_summary_sha256 }}
      COMPUTE_RESULT: ${{ needs.compute.result }}
      CUT_TWOJET_SUMMARY: ${{ needs.compute.outputs.cut_twojet_summary }}
      CUT_TWOJET_SUMMARY_BYTES: ${{ needs.compute.outputs.cut_twojet_summary_bytes }}
      CUT_TWOJET_SUMMARY_SHA256: ${{ needs.compute.outputs.cut_twojet_summary_sha256 }}
      FAR_SUMMARY: ${{ needs.compute.outputs.far_summary }}
      FAR_SUMMARY_BYTES: ${{ needs.compute.outputs.far_summary_bytes }}
      FAR_SUMMARY_SHA256: ${{ needs.compute.outputs.far_summary_sha256 }}
      FINITE_HEAD_SUMMARY: ${{ needs.compute.outputs.finite_head_summary }}
      FINITE_HEAD_SUMMARY_BYTES: ${{ needs.compute.outputs.finite_head_summary_bytes }}
      FINITE_HEAD_SUMMARY_SHA256: ${{ needs.compute.outputs.finite_head_summary_sha256 }}
    steps:
      - name: Print bounded original readout with honest unavailable case
        run: |
          python - <<'PYREPORT'
          import hashlib,json,os
          text=os.environ.get('SCALAR_SUMMARY','')
          if not text:
            text=json.dumps(dict(schema='request162-actual-continuous-E-output-unavailable-v1',
              run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],
              compute_job_result=os.environ.get('COMPUTE_RESULT'),continuous_E_completion_not_claimed=True),separators=(',',':'))
            raw=text.encode()
          else:
            raw=text.encode();assert len(raw)==int(os.environ['SCALAR_SUMMARY_BYTES'])<=90000
            assert hashlib.sha256(raw).hexdigest()==os.environ['SCALAR_SUMMARY_SHA256'];json.loads(raw)
          print('BEGIN_REQUEST162_ACTUAL_CONTINUOUS_E_SCALAR_SUMMARY')
          print(text)
          print('END_REQUEST162_ACTUAL_CONTINUOUS_E_SCALAR_SUMMARY')
          print(json.dumps(dict(event='request162_report_identity',bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),
            hash_scope='compact UTF8 JSON excluding separator LF',compute_job_result=os.environ.get('COMPUTE_RESULT'),
            raw_artifact_release_git_upload=False)))
          PYREPORT
      - name: Print the independent complete cut two-jet readout or its honest unavailable scope
        run: |
          python - <<'PYCUTREPORT'
          import hashlib,json,os
          text=os.environ.get('CUT_TWOJET_SUMMARY','')
          if not text:
            record=dict(schema='request162-cut-twojet-readout-unavailable-v1',
              run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],
              compute_job_result=os.environ.get('COMPUTE_RESULT'),
              complete_cut_twojet_not_claimed=True,original_scalar_block_is_separate=True)
            raw=(json.dumps(record,ensure_ascii=False,separators=(',',':'))+'\n').encode()
          else:
            raw=(text+'\n').encode()
            assert len(raw)==int(os.environ['CUT_TWOJET_SUMMARY_BYTES'])<=90000
            assert hashlib.sha256(raw).hexdigest()==os.environ['CUT_TWOJET_SUMMARY_SHA256']
            record=json.loads(raw)
            assert record['schema']=='R286-v3-original-binary-cut-complete-twojet-hull-v1'
          print('BEGIN_REQUEST144_ORIGINAL_C_CUT_TWOJET_SUMMARY')
          print(raw.decode(),end='')
          print('END_REQUEST144_ORIGINAL_C_CUT_TWOJET_SUMMARY')
          print(json.dumps(dict(event='request162_cut_twojet_report_identity',bytes=len(raw),
            sha256=hashlib.sha256(raw).hexdigest(),hash_scope='canonical UTF8 JSON including its final LF',
            report_repeats_no_scientific_arithmetic=True,raw_artifact_release_git_upload=False)))
          PYCUTREPORT
      - name: Repeat independent deep and finite-head actual scope blocks without scientific arithmetic
        run: |
          python - <<'PYHEADREPORT'
          import hashlib,json,os
          entries=(('FAR_SUMMARY','request162-actual-deep-far-scalar-readout-v1',
            'REQUEST162_ACTUAL_DEEP_FAR_SUMMARY'),
            ('FINITE_HEAD_SUMMARY','request162-actual-finite-head-complete-scope-readout-v1',
            'REQUEST162_ACTUAL_FINITE_HEAD_SUMMARY'))
          for key,schema,marker in entries:
            text=os.environ.get(key,'')
            if text:
              raw=(text+'\n').encode()
              assert len(raw)==int(os.environ[key+'_BYTES'])<=90000
              assert hashlib.sha256(raw).hexdigest()==os.environ[key+'_SHA256']
              record=json.loads(raw);assert record['schema']==schema
            else:
              record=dict(schema=schema+'-unavailable',
                run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],
                compute_job_result=os.environ.get('COMPUTE_RESULT'),
                original_result_not_fabricated=True,cut_DN_or_nonlinear_completion_not_claimed=True)
              raw=(json.dumps(record,sort_keys=True,separators=(',',':'))+'\n').encode()
            print('BEGIN_'+marker);print(raw.decode(),end='');print('END_'+marker)
            print(json.dumps(dict(event='request162_report_independent_block_identity',
              block=key,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),
              hash_scope='canonical UTF8 JSON including final LF',
              compute_job_result=os.environ.get('COMPUTE_RESULT'),
              raw_artifact_release_git_upload=False)))
          PYHEADREPORT
