name: visible-larger complete112 same-C two-chart projective head and cut families
'on':
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-stored-C-projective-head-request.json
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: visible-larger-public-stored-C-projective-head
  cancel-in-progress: false
jobs:
  compute:
    name: Same-C full head and complete112 projective propagation with all cut families
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      scalar_summary: ${{ steps.scalar.outputs.scalar_summary }}
      scalar_summary_bytes: ${{ steps.scalar.outputs.scalar_summary_bytes }}
      scalar_summary_sha256: ${{ steps.scalar.outputs.scalar_summary_sha256 }}
      cut_twojet_summary: ${{ steps.cut_twojet.outputs.cut_twojet_summary }}
      cut_twojet_summary_bytes: ${{ steps.cut_twojet.outputs.cut_twojet_summary_bytes }}
      cut_twojet_summary_sha256: ${{ steps.cut_twojet.outputs.cut_twojet_summary_sha256 }}
      far_summary: ${{ steps.far_scalar.outputs.far_summary }}
      far_summary_bytes: ${{ steps.far_scalar.outputs.far_summary_bytes }}
      far_summary_sha256: ${{ steps.far_scalar.outputs.far_summary_sha256 }}
      finite_head_summary: ${{ steps.linear_scalar.outputs.finite_head_summary }}
      finite_head_summary_bytes: ${{ steps.linear_scalar.outputs.finite_head_summary_bytes }}
      finite_head_summary_sha256: ${{ steps.linear_scalar.outputs.finite_head_summary_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-larger-public-stored-C-projective-head.yml
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
            /topics/visible-flex-larger-amplitude/results/R286-original-stored-continuous-integral-and-metric-bridge.md
            /topics/visible-flex-larger-amplitude/results/R297-continuous-E-unit-panel-and-piecewise-enclosure.md
            /topics/visible-flex-larger-amplitude/results/R306-complete-cap-endpoint-primitives-and-budget-preserving-integration.md
            /topics/visible-flex-larger-amplitude/results/R312-continuous-C-complete112-zero-tail-and-head-connection.md
            /topics/visible-flex-larger-amplitude/results/R324-continuous-C-finite-head-flux-and-closed-tube.md
            /topics/visible-flex-larger-amplitude/results/R347-continuous-C-two-chart-projective-normalization-and-cut-quotients.md
      - name: Establish request162 owned namespace, resource deadline and process receipts
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          git config --global merge.stat false
          python3 - <<'PYNS'
          import ast,hashlib,json,os,time
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP']).resolve()/'visible-stored-C-projective162'
          base.mkdir(exist_ok=False)
          comp=Path(os.environ['GITHUB_WORKSPACE'])/'topics/visible-flex-larger-amplitude/computations'
          request_raw=(comp/'public-stored-C-projective-head-request.json').read_bytes()
          request=json.loads(request_raw)
          assert hashlib.sha256(request_raw).hexdigest()=='5b002d6fe786c29e96313129690d7510f9e3e572c1a8b43b88fad01e4de0be18'
          assert request['execution']['namespace_science_deadline_seconds']==18900
          assert request['execution']['readback_reserve_seconds']==2700
          record=dict(schema='request162-owned-namespace-science-deadline-v1',
              repository=os.environ['GITHUB_REPOSITORY'],run_id=os.environ['GITHUB_RUN_ID'],
              source_commit=os.environ['GITHUB_SHA'],request_sha256=hashlib.sha256(request_raw).hexdigest(),
              namespace_created_unix_seconds=time.time(),science_seconds_from_namespace=18900,
              readback_reserve_seconds=2700,job_timeout_minutes=360,
              resource_scope_does_not_change_any_scientific_acceptance_gate=True)
          raw=(json.dumps(record,sort_keys=True,separators=(',',':'))+'\n').encode()
          with (base/'namespace-science-deadline.json').open('xb') as stream:
              stream.write(raw);stream.flush();os.fsync(stream.fileno())
          helper_source=r'''"""Request162 owned process identities; standard-library lifecycle only."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import runpy
          import sys
          import time

          ROLES={"C":"rule-sync","far":"rule-sync-far","linear":"rule-sync-linear"}
          def canonical(value):
              return (json.dumps(value,sort_keys=True,separators=(",",":"),allow_nan=False)+"\n").encode()
          def root():
              base=Path(os.environ["VISIBLE_BASE"]).resolve()
              temporary=Path(os.environ["RUNNER_TEMP"]).resolve()
              if base.name!="visible-stored-C-projective162" or base.parent!=temporary:
                  raise ValueError("Use this job's exclusive request162 namespace")
              return base
          def identity(pid):
              try:
                  text=(Path("/proc")/str(pid)/"stat").read_text()
              except (FileNotFoundError,ProcessLookupError):
                  return None
              fields=text.rsplit(")",1)[1].split()
              return dict(pid=pid,state=fields[0],ppid=int(fields[1]),pgid=int(fields[2]),
                  start_ticks=int(fields[19]))
          def record(role,kind,phase,**details):
              if role not in ROLES or kind not in ("parent","science"):
                  raise ValueError("Unknown original stage owner")
              directory=root()/"owned-rule-sync-processes"
              directory.mkdir(exist_ok=True)
              value=dict(schema="request162-owned-process-receipt-v1",
                  repository=os.environ["GITHUB_REPOSITORY"],run_id=os.environ["GITHUB_RUN_ID"],
                  source_commit=os.environ["GITHUB_SHA"],role=role,kind=kind,phase=phase,
                  own_process=identity(os.getpid()),unix_seconds=time.time(),**details)
              path=directory/(role+"-"+kind+"-"+phase+".json")
              raw=canonical(value)
              with path.open("xb") as stream:
                  stream.write(raw);stream.flush();os.fsync(stream.fileno())
              print(json.dumps(dict(event="request162-owned-process-receipt",
                  relative_file=str(path.relative_to(root())),bytes=len(raw),
                  sha256=hashlib.sha256(raw).hexdigest(),role=role,kind=kind,phase=phase)),flush=True)
              return value
          def invoke_parent(role,callback):
              record(role,"parent","launch",exclusive_process_group=False,
                  parent_may_inherit_a_shared_job_process_group=True)
              try:
                  code=callback()
              except BaseException as error:
                  record(role,"parent","return",actual_exception_type=type(error).__name__,
                      actual_exception=str(error),normal_return=False)
                  raise
              record(role,"parent","return",actual_returncode=code,normal_return=True)
              return code
          def execute(argv):
              role=argv[0]
              if len(argv)<3 or argv[1]!="--" or role not in ROLES:
                  raise ValueError("Use exec ROLE -- original-script original-arguments")
              for key in ("GH_TOKEN","GITHUB_TOKEN","MR_TOKEN"):os.environ.pop(key,None)
              own=identity(os.getpid())
              if own is None or own["pgid"]!=own["pid"]:
                  raise ValueError("The original rule runner must own an exclusive science session")
              record(role,"science","launch",exclusive_process_group=True,
                  exclusive_group_created_by_original_rules_runner_start_new_session=True)
              actual=list(argv[2:])
              declared_argv_sha256=hashlib.sha256(canonical(actual)).hexdigest()
              if role=="linear":
                  base=root()
                  request_raw=(base/"dispatch-request.json").read_bytes()
                  request=json.loads(request_raw)
                  deadline=json.loads((base/"namespace-science-deadline.json").read_bytes())
                  if (deadline["schema"]!="request162-owned-namespace-science-deadline-v1"
                          or deadline["repository"]!=os.environ["GITHUB_REPOSITORY"]
                          or deadline["run_id"]!=os.environ["GITHUB_RUN_ID"]
                          or deadline["source_commit"]!=os.environ["GITHUB_SHA"]
                          or deadline["request_sha256"]!=hashlib.sha256(request_raw).hexdigest()
                          or deadline["science_seconds_from_namespace"]!=18900
                          or deadline["readback_reserve_seconds"]!=2700):
                      raise ValueError("Bind the actual same-job namespace resource deadline")
                  if actual.count("--budget-seconds")!=1:
                      raise ValueError("One explicit original linear resource argument is required")
                  position=actual.index("--budget-seconds")+1
                  declared=request["finite_head"]["parameters"]["budget_seconds"]
                  if float(actual[position])!=declared:
                      raise ValueError("The original declared resource budget differs")
                  remaining=deadline["namespace_created_unix_seconds"]+18900-time.time()
                  effective=min(float(declared),remaining)
                  policy=dict(schema="request162-actual-linear-resource-clip-v1",
                      original_declared_seconds=declared,actual_remaining_namespace_seconds=remaining,
                      actual_linear_budget_seconds=max(0.0,effective),
                      clipping_happens_after_original_rules_startup_sync=True,
                      linear_budget_clock_still_excludes_original_input_binding_and_runtime_setup=True,
                      original_argv_sha256=declared_argv_sha256,
                      resource_scope_not_a_mathematical_or_denominator_gate=True)
                  if effective<=0:
                      record(role,"science","resource-stop",scientific_script_started=False,resource_policy=policy)
                      record(role,"science","return",actual_returncode=124,normal_return=True,
                          original_scientific_scope_unpaid=True)
                      return 124
                  actual[position]=repr(effective)
                  policy["actual_argv_sha256"]=hashlib.sha256(canonical(actual)).hexdigest()
                  record(role,"science","resource-policy",resource_policy=policy)
              sys.argv=actual
              try:
                  runpy.run_path(actual[0],run_name="__main__")
              except SystemExit as result:
                  code=0 if result.code is None else (result.code if type(result.code) is int else 1)
                  record(role,"science","return",actual_returncode=code,normal_return=True,
                      original_system_exit_value=result.code if result.code is None or type(result.code) in (int,str) else repr(result.code))
                  raise
              except BaseException as error:
                  record(role,"science","return",actual_exception_type=type(error).__name__,
                      actual_exception=str(error),normal_return=False)
                  raise
              record(role,"science","return",actual_returncode=0,normal_return=True)
              return 0
          def observe():
              base=root();directory=base/"owned-rule-sync-processes"
              active=[];unknown=[];identities=[];launches={}
              for path in (sorted(directory.glob("*-launch.json")) if directory.is_dir() else []):
                  try:
                      raw=path.read_bytes();value=json.loads(raw)
                      if (value["schema"]!="request162-owned-process-receipt-v1"
                              or value["repository"]!=os.environ["GITHUB_REPOSITORY"]
                              or value["run_id"]!=os.environ["GITHUB_RUN_ID"]
                              or value["source_commit"]!=os.environ["GITHUB_SHA"]):
                          raise ValueError("An original owner receipt has a different source or run")
                      role,kind=value["role"],value["kind"];saved=value["own_process"]
                      if role not in ROLES or kind not in ("parent","science") or saved is None:
                          raise ValueError("Original owner identity is incomplete")
                      launches[(role,kind)]=value
                      current=identity(saved["pid"])
                      same=(current is not None and current["start_ticks"]==saved["start_ticks"])
                      one=dict(relative_file=str(path.relative_to(base)),bytes=len(raw),
                          sha256=hashlib.sha256(raw).hexdigest(),role=role,kind=kind,
                          original_pid=saved["pid"],original_start_ticks=saved["start_ticks"],
                          original_pgid=saved["pgid"],same_original_process_currently_present=same,
                          current_state=current["state"] if same else None)
                      if same and current["state"]!="Z":
                          active.append(dict(role=role,kind=kind,**current))
                      if kind=="science":
                          if value.get("exclusive_process_group") is not True or saved["pgid"]!=saved["pid"]:
                              raise ValueError("A science group was not proved exclusive at launch")
                          members=[]
                          for child in Path("/proc").iterdir():
                              if not child.name.isdigit():continue
                              current_member=identity(int(child.name))
                              if (current_member is not None and current_member["pgid"]==saved["pgid"]
                                      and current_member["state"]!="Z"):
                                  members.append(current_member)
                          one["live_members_of_original_exclusive_science_group"]=members
                          for member in members:
                              if not any(x["pid"]==member["pid"] for x in active):
                                  active.append(dict(role=role,kind="science-group-member",**member))
                      else:
                          one["shared_parent_process_group_not_required_to_be_empty"]=True
                      identities.append(one)
                  except Exception as error:
                      unknown.append(dict(relative_file=str(path.relative_to(base)),
                          type=type(error).__name__,message=str(error)))
              for role,name in ROLES.items():
                  out=base/name
                  if (out/"science-launch.json").is_file() and (role,"science") not in launches:
                      if not (out/"runner-result.json").is_file() and not (out/"science-launch-failed.json").is_file():
                          unknown.append(dict(role=role,
                              reason="Original launch intent exists but no actual child identity or joined return was recorded"))
                  if out.is_dir() and (role,"parent") not in launches:
                      unknown.append(dict(role=role,
                          reason="An original rules directory exists without its wrapper owner launch identity"))
              return dict(schema="request162-original-owner-quiescence-observation-v1",
                  repository=os.environ["GITHUB_REPOSITORY"],run_id=os.environ["GITHUB_RUN_ID"],
                  source_commit=os.environ["GITHUB_SHA"],unix_seconds=time.time(),
                  original_process_receipts=identities,live_original_owned_processes=active,
                  unknown_owner_scopes=unknown,quiescent=not active and not unknown,
                  parent_shared_job_group_not_treated_as_science=True,
                  no_signal_or_process_mutation_performed=True,
                  this_metadata_condition_is_not_a_mathematical_acceptance_gate=True)
          if __name__=="__main__":
              if sys.argv[1:2]!=["exec"]:raise SystemExit("Use exec ROLE -- original scientific argv")
              raise SystemExit(execute(sys.argv[2:]))
          '''
          helper_raw=helper_source.encode()
          assert hashlib.sha256(helper_raw).hexdigest()=='fbc1c8e4f95f3da7ee104e1045b8737d09c3142c935ad5a3d70dddcb293ea4db'
          compile(ast.parse(helper_raw,filename='request162_owned_process.py'),'request162_owned_process.py','exec')
          with (base/'request162_owned_process.py').open('xb') as stream:
              stream.write(helper_raw);stream.flush();os.fsync(stream.fileno())
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('VISIBLE_BASE='+str(base)+'\n')
              stream.write('VISIBLE_COMPUTATIONS='+str(comp)+'\n')
          print(json.dumps(dict(event='request162_owned_namespace_resource_plan',
              original_deadline=record,lifecycle_source_bytes=len(helper_raw),
              lifecycle_source_sha256=hashlib.sha256(helper_raw).hexdigest(),
              lifecycle_code_belongs_to_this_workflow_not_the_scientific_source_closure=True)),flush=True)
          PYNS
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14
      - name: Reserve temporary disk for the explicit full projective work scope
        run: |
          python - <<'PYCAPACITY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          base=Path(os.environ['VISIBLE_BASE'])
          before=shutil.disk_usage(base).free
          known=['/usr/local/lib/android','/usr/share/dotnet','/opt/ghc']
          removed=[]
          for name in known:
            path=Path(name)
            if path.exists() or path.is_symlink():
              subprocess.run(['sudo','rm','-rf','--',name],check=True)
              removed.append(name)
          after=shutil.disk_usage(base).free
          record=dict(schema='request162-original-runner-resource-capacity-v1',
            removed_only_known_unused_runner_SDK_paths=removed,
            free_bytes_before=before,free_bytes_after=after,minimum_free_bytes=34359738368,
            resource_available=after>=34359738368,
            original_Node_Python_compiler_BLAS_and_sources_retained=True,
            a_resource_failure_is_not_a_mathematical_failure=True)
          raw=(json.dumps(record,sort_keys=True,separators=(',',':'))+'\n').encode()
          with (base/'resource-capacity.json').open('xb') as stream:
            stream.write(raw);stream.flush();os.fsync(stream.fileno())
          print(json.dumps(record),flush=True)
          raise SystemExit(0 if record['resource_available'] else 2)
          PYCAPACITY
      - name: Install only the explicit rigorous interval runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Bind actual scientific source and explicit complete closed query
        run: |
          python - <<'PYPINS'
          import ast,hashlib,json,os,re,subprocess
          from pathlib import Path,PurePosixPath
          repo=Path(os.environ['GITHUB_WORKSPACE']);comp=Path(os.environ['VISIBLE_COMPUTATIONS'])
          raw=(comp/'public-stored-C-projective-head-request.json').read_bytes();request=json.loads(raw)
          assert request['schema']=='public-stored-C-projective-head-request-v1'
          assert request['request_number']==162 and request['lanes']==['storedCprojectivehead']
          assert request['repository']=='Rogerhu12/math-research-public'
          assert request['execution']['science_step_timeout_minutes']==75
          assert request['execution']['job_timeout_minutes']==360
          assert request['execution']['new_linear_work_budget_seconds']==14400
          assert request['execution']['linear_step_timeout_minutes']==250
          assert request['execution']['namespace_science_deadline_seconds']==18900
          assert request['execution']['readback_reserve_seconds']==2700
          assert request['execution']['complete_linear_and_rule_readback_timeout_minutes']==30
          assert request['execution']['minimum_free_disk_bytes']==34359738368
          assert request['execution']['linear_free_bytes_reserve']==2147483648
          assert request['execution']['current_v3_work_budget_seconds']==3600
          assert request['evaluation_strategy']['all_original_work_budgets_unchanged'] is False
          assert request['evaluation_strategy']['only_declared_upstream_wall_budget_changed'] is False
          assert request['evaluation_strategy']['original_C_3600_and_all_integral_parameters_unchanged_from_actual156'] is True
          assert request['scientific_entry']=='geometry_20261115_stored_continuous_E_cover_v3.py'
          assert request['source_count']==len(request['source_sha256'])==16
          assert hashlib.sha256(raw).hexdigest()=='5b002d6fe786c29e96313129690d7510f9e3e572c1a8b43b88fad01e4de0be18'
          verified=[]
          for name,expected in request['source_sha256'].items():
            assert PurePosixPath(name).name==name and re.fullmatch(r'[0-9a-f]{64}',expected)
            data=(comp/name).read_bytes();assert hashlib.sha256(data).hexdigest()==expected,name
            if name.endswith('.py'):compile(ast.parse(data,filename=name),name,'exec')
            verified.append(dict(file=name,bytes=len(data),sha256=expected))
          source=ast.parse((comp/request['scientific_entry']).read_bytes())
          constants={node.targets[0].id:ast.literal_eval(node.value) for node in source.body
            if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name)
            and node.targets[0].id in ('PINS','PROOF_SHA','REVISION','BASE_SOURCE_NAME','BASE_SOURCE_SHA256','UNIT_PANEL_SOURCE_NAME','UNIT_PANEL_SOURCE_SHA256')}
          assert constants['PINS']==request['original_formula_source_sha256']
          base=request['evaluation_strategy']['preserved_original_producer_source']
          assert constants['BASE_SOURCE_NAME']==base['file']
          assert constants['BASE_SOURCE_SHA256']==base['sha256']==request['source_sha256'][base['file']]
          assert len((comp/base['file']).read_bytes())==base['bytes']
          prior=request['evaluation_strategy']['preserved_unit_panel_producer_source']
          assert constants['UNIT_PANEL_SOURCE_NAME']==prior['file']
          assert constants['UNIT_PANEL_SOURCE_SHA256']==prior['sha256']==request['source_sha256'][prior['file']]
          assert len((comp/prior['file']).read_bytes())==prior['bytes']
          assert constants['REVISION']==request['original_source_revision']
          proof=request['proof'];data=(repo/proof['file']).read_bytes()
          assert len(data)==proof['bytes'] and hashlib.sha256(data).hexdigest()==proof['sha256']==constants['PROOF_SHA']
          strategy_proof=request['evaluation_strategy']['proof'];data=(repo/strategy_proof['file']).read_bytes()
          assert len(data)==strategy_proof['bytes'] and hashlib.sha256(data).hexdigest()==strategy_proof['sha256']
          unit_proof=request['evaluation_strategy']['unit_panel_proof'];data=(repo/unit_proof['file']).read_bytes()
          assert len(data)==unit_proof['bytes'] and hashlib.sha256(data).hexdigest()==unit_proof['sha256']
          for name,expected in request['reviewed_README_blobs'].items():
            assert subprocess.check_output(['git','hash-object',name],text=True).strip()==expected
          item=request['query_recipe'];data=(repo/item['file']).read_bytes();query=json.loads(data)
          assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256']
          assert query['schema']=='R286-original-stored-convention-C-closed-queries-v1'
          assert query['queries']==[dict(id='original-binary-config-cut-point',
            kind='closed-rational-radius-interval',left=0.3,right=0.3,left_closed=True,right_closed=True),
            dict(id='whole-original-source-natural-continuous-domain',
            kind='whole-natural-domain',left_closed=True,right_closed=True)]
          helper=request['cut_twojet_readout'];helper_raw=(comp/helper['file']).read_bytes()
          assert len(helper_raw)==helper['bytes'] and hashlib.sha256(helper_raw).hexdigest()==helper['sha256']
          helper_ast=ast.parse(helper_raw,filename=helper['file'])
          helper_constants={node.targets[0].id:ast.literal_eval(node.value) for node in helper_ast.body
            if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name)
            and node.targets[0].id in ('REPOSITORY','SCHEMA','ENTRY_NAME','ENTRY_SHA256','RESULT_SCHEMA','MODEL_SCHEMA','QUERY_SCHEMA','QUERY_ID')}
          assert helper_constants['REPOSITORY']==request['repository']
          assert helper_constants['ENTRY_NAME']==request['scientific_entry']
          assert helper_constants['ENTRY_SHA256']==request['source_sha256'][request['scientific_entry']]
          assert helper_constants['SCHEMA']==helper['schema'] and helper_constants['QUERY_ID']==helper['point_query_id']
          assert helper_constants['RESULT_SCHEMA']==request['evaluation_strategy']['current_producer_schema']
          assert helper_constants['MODEL_SCHEMA']==request['evaluation_strategy']['original_model_schema_unchanged']
          assert helper_constants['QUERY_SCHEMA']==query['schema']
          assert query['config_sha256']==request['inputs']['config']['sha256']
          assert query['calibration_ledger_sha256']==request['inputs']['calibration_ledger']['sha256']
          assert query['stored_reference_sha256']==request['inputs']['stored_reference']['sha256']
          assert request['scientific_parameters']==dict(deep_definition='original-exact-root-family',
            precision_bits=256,integral_absolute_bits=96,integral_relative_bits=80,analytic_guard_bits=8,
            integral_evaluation_limit=100000,value_width_bits=24,max_depth=48,query_depth=12,
            max_panels=200000,max_query_nodes=200000,budget_seconds=3600)
          for role in ('deep_far','finite_head'):
