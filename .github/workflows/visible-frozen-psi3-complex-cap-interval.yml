name: visible-flex frozen psi3 complete complex cap interval
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-frozen-psi3-complex-cap-interval.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visible-flex-frozen-psi3-complete-cap-interval
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-frozen-psi3-complex-cap-interval.yml
            /topics/visible-flex-new-mechanism/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull rules and observe the frozen cap complete complex integral
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path.cwd();topic='topics/visible-flex-new-mechanism'
          request_path=topic+'/computations/request-frozen-psi3-complex-cap-interval.json'
          reader_path=topic+'/scripts/read_original_actions_log.py'
          entry_path=topic+'/scripts/frozen_psi3_complex_cap_interval_audit.py'
          raw_request=Path(request_path).read_bytes()
          request=json.loads(raw_request)
          source=os.environ['GITHUB_SHA']
          sys.path.insert(0,str((root/topic/'scripts').resolve()))
          import read_original_actions_log as reader
          reader.require(
              hashlib.sha256(Path(reader.__file__).read_bytes()).hexdigest()
              ==request['workflow_source_sha256'][reader_path],
              'rule reader source changed')
          def emit(tag,value):
              print(tag+' '+reader.encoded(value).decode('utf-8'),flush=True)
          public=reader.actual_pull(root,request,source)
          emit('FROZEN_PSI3_CAP_PUBLIC_PULL',public)
          reader.require(public['passed'],
              'public README changed or actual pull failed; apply its diff first')
          private={}
          try:
              reader.private_rule_pull(request,private)
          finally:
              os.environ.pop('MR_TOKEN',None)
              emit('FROZEN_PSI3_CAP_PRIVATE_PULL',private)
          reader.git_ok(root,['checkout','--detach',source])
          reader.require(Path(request_path).read_bytes()==raw_request,
              'detached source request differs from its bound input')
          reader.require(request['entry_point']==entry_path,
              'one frozen-cap interval entry required')
          for path,expected in request['workflow_source_sha256'].items():
              reader.require(
                  hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected,
                  'requested source changed: '+path)
          reader.require('MR_TOKEN' not in os.environ,
              'private credential must not enter science')
          out=Path(os.environ['RUNNER_TEMP'])/'visible-frozen-psi3-cap'
          result=subprocess.run([
              sys.executable,entry_path,'--request',request_path,'--out',str(out)])
          raise SystemExit(result.returncode)
          PY
      # Only the new complete cap integral is evaluated. No old self/rank
      # recovery, developer test, artifact/release/Git or cross-run cache.
      # The bounded original stdout carries the complete small interval result.
