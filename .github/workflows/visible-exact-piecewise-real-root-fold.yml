name: visible-exact actual larger piecewise root fold and complete seam fees

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-piecewise-real-root-fold.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-piecewise-real-root-fold
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-piecewise-real-root-fold-CI-inputs.json
  PHASE_MANIFEST_SHA: ad82be1753e0d08259f930db8429d09e93c94ffc7411329950ca301f8377f6ab
  PHASE_PIPELINE_SHA: 41d849492163791e32fb0b04a54e4b35291b97d8df206e4894894c96cb904a39
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-piecewise-real-root-fold:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_piecewise_real_root_fold_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-piecewise-real-root-fold-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate the199 fixed completed scalar, positive and original polynomial inputs
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_piecewise_real_root_fold_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse only the new larger-root sources without running mathematics
        run: |
          python - <<'PY_SOURCE'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_piecewise_real_root_fold.py','fourfold_codazzi_piecewise_real_root_fold_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          PY_SOURCE
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5
      - name: Set the original artifact path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-piecewise-real-root-fold-output" >> "$GITHUB_OUTPUT"
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-piecewise-real-root-fold-prepared" >> "$GITHUB_OUTPUT"
      - name: Reuse the original prepared response004 and006 bytes without reconstructing a trial
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43583838026
          name: visible-exact-body-prepared-43583838026-1
          path: ${{ steps.paths.outputs.prepared }}
      - name: Evaluate the complete real piecewise root windows and publish every actual outcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_piecewise_real_root_fold_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --prepared "$RUNNER_TEMP/visible-exact-piecewise-real-root-fold-prepared"
          --work "$RUNNER_TEMP/visible-exact-piecewise-real-root-fold-science"
          --out-dir "$RUNNER_TEMP/visible-exact-piecewise-real-root-fold-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-piecewise-real-root-fold-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
