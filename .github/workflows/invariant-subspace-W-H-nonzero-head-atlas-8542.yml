name: ISP new original W H nonzero quadratic head atlas
on:
  push:
    branches: [main]
    paths:
      - 'topics/invariant-subspace-problem/notes/2026-11-27-unit211-generic-LS-W-H-nonzero-original-quadratic-head-atlas-8542.py'
      - '.github/workflows/invariant-subspace-W-H-nonzero-head-atlas-8542.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isp-W-H-nonzero-head-atlas-8542
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ISP_PIN: ${{ github.sha }}
      ISP_FILE: 2026-11-27-unit211-generic-LS-W-H-nonzero-original-quadratic-head-atlas-8542.py
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FLINT_NUM_THREADS: '1'
    steps:
      - name: Prepare exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Pinned FLINT arithmetic
        run: python -m pip install --quiet python-flint==0.9.0
      - name: New original quadratic and cubic head identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-W-head-atlas"
          cd "$RUNNER_TEMP/isp-W-head-atlas"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          timeout 120s git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          ISP_SOURCE_PATH="topics/invariant-subspace-problem/notes/$ISP_FILE"
          ISP_BLOB="$(git rev-parse "$ISP_PIN:$ISP_SOURCE_PATH")"
          git show "$ISP_PIN:$ISP_SOURCE_PATH" > "$RUNNER_TEMP/isp-W-head-source.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-27-focused-exact-actions-driver-8542.py" > "$RUNNER_TEMP/isp-W-head-driver.py"
          python -u "$RUNNER_TEMP/isp-W-head-driver.py" --checkout "$PWD" --source "$RUNNER_TEMP/isp-W-head-source.py" --expected-blob "$ISP_BLOB" --seconds 195
