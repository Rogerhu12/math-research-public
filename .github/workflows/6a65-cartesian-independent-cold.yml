name: 6a65 new Cauchy input and independent Cartesian cold run
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/6a65-cartesian-independent-cold.yml
      - topics/visible-flexible-closed-surface/ci-requests/6a65-cartesian-independent-cold.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  explicit-new-input:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Partially clone the exact trigger source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git sparse-checkout set --no-cone '/README.md' '/topics/visible-flexible-closed-surface/'
          git fetch --filter=blob:none --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the frozen numerical runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Run the actual new baseline and complete Cartesian step
        shell: bash
        env:
          CART_COLD_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python topics/visible-flexible-closed-surface/scripts/6a65-actions-cartesian-cold-recovered-20261126.py \
            --request topics/visible-flexible-closed-surface/ci-requests/6a65-cartesian-independent-cold.json \
            --directory "$RUNNER_TEMP/visible-flex-cartesian-cold-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
