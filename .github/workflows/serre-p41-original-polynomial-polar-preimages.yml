name: Serre p41 original polynomial polar preimages

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R811-public-original-polynomial-polar-preimages-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R811-original-polynomial-polar-preimages
  cancel-in-progress: false

jobs:
  original_polynomial_preimages:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-polynomial-polar-preimages.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R754_original_periods_and_Hom_kernel.py
            /topics/serre-uniformity/scripts/R811_exact_L_polynomial_modules.py
            /topics/serre-uniformity/scripts/R811_original_polynomial_polar_preimages.py
            /topics/serre-uniformity/scripts/R811_public_original_polynomial_polar_preimages.py
            /topics/serre-uniformity/scripts/R811_public_original_regular_multipliers.py
            /topics/serre-uniformity/notes/R811-public-original-polynomial-polar-preimages-request.json
            /topics/serre-uniformity/notes/R811-original-streamed-polynomial-preimage-method.md
            /topics/serre-uniformity/results/R811-original-normal-polar-ideal-preimages-and-two-chart-certificates.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact source hashes and syntax without importing mathematics
        run: |
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          topic = Path("topics/serre-uniformity")
          request = json.loads((topic/"notes/R811-public-original-polynomial-polar-preimages-request.json").read_text())
          item = request["job"]
          assert request["session"] == "serre-public-astra-20261115"
          assert item["producer_inputs_pending"] is False
          sources = {
              topic/"scripts"/item["core"]: item["core_sha256"],
              topic/"scripts"/"R811_public_original_polynomial_polar_preimages.py": item["wrapper_sha256"],
              topic/"scripts"/item["module_helper"]: item["module_helper_sha256"],
              topic/"scripts"/item["field_core"]: item["field_core_sha256"],
              topic/"scripts"/item["io_helper"]: item["io_helper_sha256"],
              topic/item["proof"]: item["R811_proof_sha256"],
              topic/item["method"]: item["polynomial_method_sha256"],
          }
          for path, digest in sources.items():
              data = path.read_bytes()
              assert hashlib.sha256(data).hexdigest() == digest, str(path)
              if path.suffix == ".py":
                  ast.parse(data.decode(), filename=str(path))
          PY
      - name: Install frozen exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compute complete original polynomial preimages and both overlaps
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R811_public_original_polynomial_polar_preimages.py compute
      - name: Transfer the active checkpoint and raw transcripts to the immediate continuation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-global-R811-original-polynomial-polar-preimages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R811-original-polynomial-polar-preimages/output
          retention-days: 1
          if-no-files-found: warn
      - name: Require complete original kernels, archive chains, and both Laurent containments
        if: always()
        run: python topics/serre-uniformity/scripts/R811_public_original_polynomial_polar_preimages.py verify

