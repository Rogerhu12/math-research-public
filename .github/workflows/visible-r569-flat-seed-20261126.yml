name: visible-flex R569 fixed linear seed and outer jets
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r569-flat-seed-20261126.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r569-flat-seed-20261126
  cancel-in-progress: false
jobs:
  research:
    name: R569 single seed with tail and tolerance comparisons
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-r569-flat-seed-20261126.yml
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r569-flat-seed-20261126.json
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r569_flat_seed_outer_jets_20261126.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull current rules and compute one fixed linear seed
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r569-flat-seed-20261126.json
          --lane r569-linear-seed
      # The shared entry pulls public and private main and checks README blobs.
      # It removes private credentials before the scientific child starts.
      # M, M at finer tolerance, and M+1 share one fixed mathematical seed.
      # Only original stdout is retained; no artifacts, releases, Git writes,
      # or cross-run caches. A successful job is not a finite bending family.

