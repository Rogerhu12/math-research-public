name: Compute R749 exact nonlinear Darboux coefficients

on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/scripts/resume_20261126/r749_fractional_darboux_coefficients.py
      - .github/workflows/visible-larger-r749-fractional-darboux.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-larger-r749-darboux-coefficients
  cancel-in-progress: false

jobs:
  actual_darboux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/README.md
            /topics/visible-flex-larger-amplitude/HANDOFF.md
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r749_fractional_darboux_coefficients.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/publish_r734_exact_conclusion.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/publish_r749_darboux_coefficients.py
            /topics/visible-flex-larger-amplitude/notes/r749-actual-darboux-coefficients-*.json
      - name: Pull main and check both current README texts
        run: python -u topics/visible-flex-larger-amplitude/scripts/resume_20261126/publish_r749_darboux_coefficients.py sync
      - name: Compute all six actual rational coefficient boxes and residuals
        shell: bash
        run: |
          set -euo pipefail
          source_dir=topics/visible-flex-larger-amplitude/scripts/resume_20261126
          summary="$RUNNER_TEMP/r749-actual-report.json"
          python -u "$source_dir/r749_fractional_darboux_coefficients.py" --orders 4 8 12 --radial 8 12 16 --heights 1 64 --raw "$RUNNER_TEMP/r749-exact-series.json" --summary "$summary"
          echo R749_COMPLETE_REPORT_BEGIN
          if test "$(wc -c < "$summary")" -lt 100000; then
            cat "$summary"
          else
            wc -c "$summary"
            sha256sum "$summary"
          fi
          echo R749_COMPLETE_REPORT_END
      - name: Publish complete finite conclusions and checked handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-larger-amplitude/scripts/resume_20261126/publish_r749_darboux_coefficients.py
          publish --summary "$RUNNER_TEMP/r749-actual-report.json"
