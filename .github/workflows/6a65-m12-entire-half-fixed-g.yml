name: 6a65 M12 entire half two source aligned hotspots
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/6a65-m12-entire-half-fixed-g.yml
      - topics/visible-flexible-closed-surface/ci-requests/6a65-m12-entire-half-fixed-g.json
  workflow_dispatch:
    inputs:
      iterations:
        description: LSMR iterations for the full true-cuff half
        required: true
        default: "800"
      newton:
        description: Complete nonlinear updates with the original fixed g
        required: true
        default: "1"
permissions:
  contents: write
jobs:
  entire-half:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      M12_RECOVERY_TOKEN: ${{ github.token }}
    steps:
      - name: Set the runner temporary directory
        shell: bash
        run: |
          set -euo pipefail
          printf 'M12_COLD_DIR=%s/visible-flex-m12-entire-half-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Partially clone the frozen trigger source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git sparse-checkout set --no-cone '/README.md' '/topics/visible-flexible-closed-surface/'
          git fetch --filter=blob:none --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --filter=blob:none --unshallow origin main
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Read the complete true-cuff finite request
        env:
          M12_DISPATCH_ITERATIONS: ${{ inputs.iterations }}
          M12_DISPATCH_NEWTON: ${{ inputs.newton }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('topics/visible-flexible-closed-surface/ci-requests/6a65-m12-entire-half-fixed-g.json')
          request=json.loads(p.read_text())
          values={key:int(request[key]) for key in ('prefix_elements','tail_elements','tail_depth','order','angular','gauss','iterations','newton','block','local_element','second_local_element')}
          for key in ('iterations','newton'):
              override=os.environ.get('M12_DISPATCH_'+key.upper())
              if override:values[key]=int(override)
          if request.get('original_metric_unchanged') is not True or request.get('true_flat_cuff_included') is not True:
              raise ValueError('This workflow requires the original full true-cuff scope')
          if not 1<=values['iterations']<=20000 or not 1<=values['newton']<=20:raise ValueError('Invalid finite iteration request')
          if not 20<=values['prefix_elements']<=1000 or not 20<=values['tail_elements']<=1000:raise ValueError('Invalid radial request')
          if not 8<=values['tail_depth']<=40 or not 8<=values['order']<=128:raise ValueError('Invalid source/basis request')
          if not 4<=values['gauss']<=16 or values['angular']<=2*(3*values['order']+1):raise ValueError('Aliased finite grid request')
          if not 1<=values['block']<=64:raise ValueError('Invalid streaming block')
          local=request.get('source_aligned_h',{})
          if values['local_element']!=190 or local.get('window')!=['.432','.436'] or not local.get('simple_knots') or not local.get('all_old_knots_retained') or not local.get('old_independent_observer_retained_in_union'):
              raise ValueError('This h trial must preserve the original knots and observer with only the declared source-aligned insertion')
          second=request.get('second_source_aligned_h',{})
          if values['second_local_element']!=176 or second.get('window')!=['.5122','.5141'] or not second.get('simple_knots') or not second.get('all_ancestor_observers_retained'):
              raise ValueError('The second measured hotspot must preserve all ancestors and the declared original source window')
          if request.get('diagnostic_windows')!=[['.432','.436'],['.5122','.5141']]:
              raise ValueError('Both old and new disjoint diagnostic windows are required')
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              for key,value in values.items():output.write('M12_'+key.upper()+'='+str(value)+'\n')
          print(json.dumps({**values,'fixed_original_metric':True,'finite_numerical_only':True,
                            'scope':'Full original half: central trace, prefix, bridge, finite tail, deep collar, true flat cuff. The radius-.6 interface is free.'}))
          PY
      - name: Recover and verify the original prefix blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$M12_COLD_DIR"
          python - <<'PY'
          import os,urllib.request,json,base64,hashlib
          from pathlib import Path
          blob='26ce0426c60ef868c53597a82252e0559c1cc21e'
          expected='359d491cd592962d467fdd538013977ee9a92070346de41c227d9ca3e1ef3bd0'
          headers={'User-Agent':'M12-entire-half-fixed-g-cold-run','Accept':'application/vnd.github+json'}
          token=os.environ.get('M12_RECOVERY_TOKEN')
          if token:headers['Authorization']='Bearer '+token
          url='https://api.github.com/repos/Rogerhu12/math-research-public/git/blobs/'+blob
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:payload=json.load(response)
          if payload['sha']!=blob or payload['encoding']!='base64':raise ValueError('Wrong source blob')
          raw=base64.b64decode(payload['content'])
          if len(raw)!=3112330 or hashlib.sha256(raw).hexdigest()!=expected:raise ValueError('Wrong original M12 prefix')
          if hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()!=blob:raise ValueError('Wrong Git framing')
          (Path(os.environ['M12_COLD_DIR'])/'m12-prefix-data.npz.gz').write_bytes(raw)
          print(json.dumps({'prefix_blob':blob,'prefix_sha256':expected,'bytes':len(raw)}))
          PY
      - name: Freeze the trigger numerical source outside the publication worktree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYFREEZE'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          root=Path.cwd();head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if head!=os.environ['GITHUB_SHA']:raise ValueError('Frozen numerical source must be the trigger commit')
          topic=Path('topics/visible-flexible-closed-surface')
          subprocess.run(['git','diff','--exit-code','HEAD','--','README.md',str(topic)],check=True)
          frozen=Path(os.environ['RUNNER_TEMP'])/('visible-flex-m12-source-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          if frozen.exists():raise FileExistsError('Fresh frozen numerical source directory required')
          (frozen/topic.parent).mkdir(parents=True)
          shutil.copytree(root/topic,frozen/topic)
          shutil.copy2(root/'README.md',frozen/'README.md')
          record={'source_head':head,'readme_sha256':{name:hashlib.sha256((frozen/name).read_bytes()).hexdigest() for name in ('README.md',str(topic/'README.md'))},
                  'frozen_source_is_separate_from_publication_worktree':True}
          (Path(os.environ['M12_COLD_DIR'])/'frozen-source.json').write_text(json.dumps(record,indent=2)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as output:output.write('M12_FROZEN_REPO='+str(frozen)+'\n')
          print(json.dumps(record,indent=2))
          PYFREEZE
      - name: Run frozen numerical sources with live 45 minute rules checks
        shell: bash
        run: |
          set -euo pipefail
          python "$M12_FROZEN_REPO/topics/visible-flexible-closed-surface/scripts/6a65-m12-frozen-source-rules-supervisor.py" \
            --repository "$GITHUB_WORKSPACE" --frozen-root "$M12_FROZEN_REPO" --directory "$M12_COLD_DIR" \
            --source-head "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --prefix-elements "$M12_PREFIX_ELEMENTS" --tail-elements "$M12_TAIL_ELEMENTS" --tail-depth "$M12_TAIL_DEPTH" \
            --order "$M12_ORDER" --angular "$M12_ANGULAR" --gauss "$M12_GAUSS" \
            --iterations "$M12_ITERATIONS" --newton "$M12_NEWTON" --block "$M12_BLOCK" \
            | tee "$M12_COLD_DIR/entire-half-supervised.log"
      - name: Write only a compact identity receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          base=Path(os.environ['M12_COLD_DIR']);base.mkdir(exist_ok=True)
          files={}
          for p in sorted(base.rglob('*')):
              if p.is_file():
                  digest=hashlib.sha256()
                  with p.open('rb') as source:
                      for block in iter(lambda:source.read(1048576),b''):digest.update(block)
                  files[str(p.relative_to(base))]={'sha256':digest.hexdigest(),'bytes':p.stat().st_size}
          receipt={'head':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                   'scope':'The entire original M12 half through the true flat cuff; internal radius-.6 seam is free.',
                   'finite_numerical_only':True,'exact_isometry_proved':False,'files':files}
          (base/'cold-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Publish the scalar result and this job's own rules marker
        if: always()
        shell: bash
        env:
          M12_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('topics/visible-flexible-closed-surface');cold=Path(os.environ['M12_COLD_DIR']);cold.mkdir(exist_ok=True)
          run=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT']
          source_head=os.environ['GITHUB_SHA']
          report_path=cold/'entire-half/entire-half-result.json';receipt_path=cold/'cold-receipt.json'
          execution_path=cold/'entire-half/entire-half-cold-execution.json'
          supervised_path=cold/'supervised-execution.json';rules_path=cold/'live-rules-checks.json'
          supervised=json.loads(supervised_path.read_text()) if supervised_path.exists() else None
          rules=json.loads(rules_path.read_text()) if rules_path.exists() else None
          if (supervised and supervised.get('rules_changed')) or (rules and rules.get('rules_changed')):
              print('Actual README change requires root review; scalar publisher must not bypass the rule guard')
              raise SystemExit(42)
          observed=json.loads(report_path.read_text()) if report_path.exists() else None
          receipt=json.loads(receipt_path.read_text()) if receipt_path.exists() else {}
          execution=json.loads(execution_path.read_text()) if execution_path.exists() else None
          continuous_reports={}
          for name in ('entire-half-original-source-bounds.json','entire-half-continuous-change-bounds.json',
                       'entire-half-actual-field-geometry.json','entire-half-original-span-observer.json',
                       'entire-half-old-observer-union.json','entire-half-closed-stl.json',
                       'entire-half-localized-metric-budget.json'):
              path=cold/'entire-half'/name
              if path.exists():
                  if path.stat().st_size>=100000:raise ValueError('Expected compact scalar report: '+name)
                  continuous_reports[name]=json.loads(path.read_text())
          geometry=continuous_reports.get('entire-half-actual-field-geometry.json',{})
          meshes=continuous_reports.get('entire-half-closed-stl.json',{})
          localized=continuous_reports.get('entire-half-localized-metric-budget.json',{})
          localized_bound_to_same_field=False
          if localized:
              if not observed or localized.get('field_sha256')!=observed.get('field_sha256') or localized.get('grid_sha256')!=observed.get('grid_sha256'):
                  raise ValueError('Localized continuous budget is not bound to this actual h field/grid')
              localized_bound_to_same_field=True
          record={'source_head':source_head,'run_id':run,'run_attempt':attempt,
                  'job_status_before_publication':os.environ['M12_JOB_STATUS'],
                  'scope':'Original fixed-g central-to-true-cuff half, including prefix, bridge, finite tail and deep collar; radius .6 is an unconstrained interior interface.',
                  'whole_half_execution_completed':bool(execution and execution.get('finished')),
                  'finite_numerical_solve':True,'exact_isometry_proved':False,
                  'whole_family_reach_certified':geometry.get('homotopy_embedded_and_reach_transfer_proved',False),
                  'complete_three_phase_STL_generated':len(meshes.get('meshFiles',[]))==3,
                  'source_aligned_h_trial':True,'second_hotspot_source_aligned_h_trial':True,
                  'all_ancestor_independent_observers_retained':continuous_reports.get('entire-half-old-observer-union.json',{}).get('union_contains_all_recorded_ancestor_observers',False),
                  'localized_metric_validation_completed':localized_bound_to_same_field,
                  'whole_half_plus_localized_validation_completed':bool(execution and execution.get('finished') and localized_bound_to_same_field),
                  'continuous_metric_certified_from_localized_budget':bool(localized_bound_to_same_field and localized.get('continuous_metric_below_1e_6',False)),
                  'localized_verifier_changes_field_or_metric':False,
                  'old_independent_observer_superset':continuous_reports.get('entire-half-old-observer-union.json',{}).get('union_contains_full_old_independent_observer',False),
                  'scalar_report_layout':'three-complete-bound-parts-v2','scalar_report_parts':{},
                  'regeneration':'Run this workflow at the same source commit and request. Known public blobs and checked source hashes regenerate every temporary array.',
                  'raw_retention':'RUNNER_TEMP only. No raw Git, release, or artifact publication.',
                  'supervised_execution':supervised,'live_rule_checks':rules,
                  'frozen_source_supervisor_completed':bool(supervised and supervised.get('finished')),
                  'receipt':receipt,'execution':execution,'scalar_observation':observed}
          target=root/'notes'/('2026-11-26-6a65-m12-entire-half-ci-'+run+'-'+attempt+'.json')
          binding={'source_head':source_head,'run_id':run,'run_attempt':attempt,
                   'field_sha256':observed.get('field_sha256') if observed else None,
                   'grid_sha256':observed.get('grid_sha256') if observed else None}
          outputs=[]
          def save_scalar(path,value):
              raw=(json.dumps(value,indent=2,allow_nan=False)+'\n').encode()
              if len(raw)>=100000:raise ValueError('Complete scalar part unexpectedly exceeds 100 KB: '+str(path))
              path.write_bytes(raw);outputs.append(path)
              return {'path':str(path),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),**binding}
          ordinary={key:value for key,value in continuous_reports.items() if key!='entire-half-localized-metric-budget.json'}
          continuous_part=target.with_name(target.stem+'-continuous.json')
          localized_part=target.with_name(target.stem+'-localized-metric.json')
          record['scalar_report_parts']['continuous_and_mesh']=save_scalar(continuous_part,
              {'schema':'6a65-M12-complete-continuous-and-mesh-scalar-part-v1',**binding,'reports':ordinary})
          record['scalar_report_parts']['localized_metric']=save_scalar(localized_part,
              {'schema':'6a65-M12-complete-localized-metric-scalar-part-v1',**binding,'report':localized or None})
          primary=save_scalar(target,record)
          (cold/'publish-paths.txt').write_text('\n'.join(str(path) for path in outputs)+'\n')
          print(json.dumps({'primary':primary,'bound_scalar_parts':record['scalar_report_parts']}))
          PY
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0='' GIT_CONFIG_KEY_1=credential.helper
          export GIT_CONFIG_VALUE_1='!f() { printf "username=x-access-token\npassword=%s\n" "$M12_RECOVERY_TOKEN"; }; f'
          git config user.name "Astra-visible-flex-6a65"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t report_paths < "$M12_COLD_DIR/publish-paths.txt"
          handoff_path="topics/visible-flexible-closed-surface/HANDOFF.md"
          export M12_CI_SUBJECT="Record M12 entire-half fixed-g scalar run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
          git add -- "${report_paths[@]}"
          git commit -m "$M12_CI_SUBJECT"
          while true; do
            before_rules="$(git rev-parse origin/main)"
            pull_succeeded=1
            if ! git pull --rebase origin main; then pull_succeeded=0; fi
            export M12_RULES_READ_SHA="$(git rev-parse origin/main)"
            if ! git diff --quiet "$before_rules" "$M12_RULES_READ_SHA" -- README.md topics/visible-flexible-closed-surface/README.md; then
              git diff "$before_rules" "$M12_RULES_READ_SHA" -- README.md topics/visible-flexible-closed-surface/README.md
              echo "README changed: root must apply this actual diff before continuing or publishing."
              exit 42
            fi
            if [ "$pull_succeeded" != "1" ]; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicts" != "$handoff_path" ]; then
                echo "Rebase conflict is not confined to this job's HANDOFF marker; root must resolve it."
                exit 43
              fi
              git show ":2:$handoff_path" > "$M12_COLD_DIR/handoff-upstream.txt"
              cp "$M12_COLD_DIR/handoff-upstream.txt" "$handoff_path"
              git add -- "$handoff_path"
              GIT_EDITOR=true git rebase --continue
            fi
            export M12_RULES_STATE="README unchanged"
            python - <<'PY'
          import os
          from pathlib import Path
          path=Path('topics/visible-flexible-closed-surface/HANDOFF.md')
          lines=path.read_text().splitlines(keepends=True);marker='<!-- 6a65-m12-entire-half-ci-rules -->'
          hits=[i for i,line in enumerate(lines) if line.startswith(marker)]
          if len(hits)>1:raise ValueError('Ambiguous own HANDOFF marker')
          line=(marker+' '+os.environ['M12_RULES_STATE']+' at '+os.environ['M12_RULES_READ_SHA']+
                '; run '+os.environ['GITHUB_RUN_ID']+' attempt '+os.environ['GITHUB_RUN_ATTEMPT']+'.\n')
          if hits:lines[hits[0]]=line
          else:
              if lines and not lines[-1].endswith('\n'):lines[-1]+='\n'
              lines.append(line)
          path.write_text(''.join(lines));print(line,end='')
          PY
            git add -- "$handoff_path"
            if ! git diff --cached --quiet; then
              if git merge-base --is-ancestor HEAD origin/main; then
                git commit -m "$M12_CI_SUBJECT"
              else
                if [ "$(git log -1 --format=%s)" != "$M12_CI_SUBJECT" ]; then
                  echo "Refusing to amend a commit that this job did not create."
                  exit 44
                fi
                git commit --amend --no-edit
              fi
            fi
            if git push origin HEAD:main; then
              break
            fi
          done
