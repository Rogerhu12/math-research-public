name: visible-exact waist normalizer coefficients

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-waist-normalizer-coefficients.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-waist-normalizer-coefficients
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  WT_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-waist-normalizer-coefficients-CI-inputs.json
  WT_MANIFEST_SHA: 4cec7ef0ba21373190dd0bf142d10546823d46bb832a58df66529822990ad125
  WT_PIPELINE_SHA: 7cde6f7f6d03bbfa107a93abdd4ee925b332f47ac7c4a2257d6557e00927a393
  WT_WORKER_SHA: fbcedfe82d591421984d6fe459a60b596490b956a774ecab89603450cb624007
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  waist-normalizer-coefficients:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_waist_normalizer_coefficients_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-waist-normalizer-coefficients-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_waist_normalizer_coefficients_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['WT_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate only small source proof and provenance texts
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_waist_normalizer_coefficients_public_worker.py --mode hydrate
          --manifest "$WT_MANIFEST" --manifest-sha "$WT_MANIFEST_SHA"
          --pipeline-sha "$WT_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new saved-row consumer before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,json,os,pathlib
          manifest=json.loads(pathlib.Path(os.environ['WT_MANIFEST']).read_text())
          for role in ('source',):
              item=next(x for x in manifest['file_receipts'] if x['role']==role)
              p=pathlib.Path(item['path'])
              assert len(p.read_bytes())==item['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
              ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the pinned directed arithmetic runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Restore one original body part and three raw byte parts for new waist scalars
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_waist_normalizer_coefficients_public_worker.py --mode run
          --manifest "$WT_MANIFEST" --manifest-sha "$WT_MANIFEST_SHA"
          --pipeline-sha "$WT_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-waist-normalizer-coefficients-science"
          --out-dir "$RUNNER_TEMP/visible-exact-waist-normalizer-coefficients-output"
      # Root rule15: one original body part and three raw byte parts are temporary read-only inputs.
      # No upload-artifact, Release upload, native or per-row numerical-data commit.
      # Complete science is atomically saved and printed before publication-size guards.
      # The actual topic capacity must retain120000 bytes before any new arithmetic.
