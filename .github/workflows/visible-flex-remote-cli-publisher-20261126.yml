name: visible-flex temporary remote CLI publisher
on:
  push:
    branches-ignore: [main]
    paths:
      - .github/scripts/visible-flex-remote-cli-publisher-20261126.py
      - .github/workflows/visible-flex-remote-cli-publisher-20261126.yml
      - .github/visible-publication-manifest.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-root-remote-cli-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref != 'refs/heads/main'
    name: publish root manifest with actual dual Git pulls
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/visible-flex-remote-cli-publisher-20261126.py
            /.github/workflows/visible-flex-remote-cli-publisher-20261126.yml
            /.github/visible-publication-manifest.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Bind the immutable root manifest without credential files
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          raw = Path('.github/visible-publication-manifest.json').read_bytes()
          data = json.loads(raw)
          assert data['schema'] == 'visible-source-cli-publication-batch-v1'
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          digest = hashlib.sha256(raw).hexdigest()
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('PUBLISH_MANIFEST_BLOB=' + blob + '\n')
              out.write('PUBLISH_MANIFEST_SHA256=' + digest + '\n')
          print('Root manifest blob=' + blob + ' sha256=' + digest)
          PY
      - name: Actually pull, check, commit, rebase and push each root step
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: python .github/scripts/visible-flex-remote-cli-publisher-20261126.py
      # This workflow, script and manifest exist only on a root-created
      # temporary branch. They are never publication entries on main.
      # Stdlib AST/JSON/hash/CLI inspection only; no scientific imports or runs.
      # MR_TOKEN is only in process environment/headers, never a token file.
