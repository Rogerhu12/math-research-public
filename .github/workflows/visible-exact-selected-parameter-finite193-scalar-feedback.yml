name: visible-exact selected-parameter finite193 scalar feedback

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-selected-parameter-finite193-scalar-feedback.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-selected-parameter-finite193-scalar-feedback
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  FEEDBACK_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-selected-parameter-finite193-scalar-feedback-CI-inputs.json
  FEEDBACK_MANIFEST_SHA: 8bb821e8063c749f505975ace82c107b80f073beba4078f2cc725b0b22677d57
  FEEDBACK_PIPELINE_SHA: 087f3971d7dbb027464ef71a59d02e734d6e032b3c9b2d3bc600c8bfaced5288
  FEEDBACK_WORKER_SHA: beae2544ae5b01b4ec2db32a065ca9c3e6e246d000d2650673434b3bcf8f022d
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  selected-parameter-finite193-scalar-feedback:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_selected_parameter_finite193_scalar_feedback_ci.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-selected-parameter-finite193-scalar-feedback-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_selected_parameter_finite193_scalar_feedback_ci.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['FEEDBACK_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_selected_parameter_finite193_scalar_feedback_ci.py --mode hydrate
          --manifest "$FEEDBACK_MANIFEST" --manifest-sha "$FEEDBACK_MANIFEST_SHA"
          --pipeline-sha "$FEEDBACK_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new source before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_selected_parameter_finite193_scalar_feedback.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['FEEDBACK_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the identical completed scientific runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5 scipy==1.17.0
      - name: Consume five completed small records and evaluate complete finite feedback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_selected_parameter_finite193_scalar_feedback_ci.py --mode run
          --manifest "$FEEDBACK_MANIFEST" --manifest-sha "$FEEDBACK_MANIFEST_SHA"
          --pipeline-sha "$FEEDBACK_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-selected-parameter-finite193-scalar-feedback-science"
          --out-dir "$RUNNER_TEMP/visible-exact-selected-parameter-finite193-scalar-feedback-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
