name: visible-exact original cut v2 failure receipt

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-cut-v2-failure-receipt.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-cut-v2-failure-receipt
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PILOT_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-known-cut-direction-cap-pilot-v2-CI-inputs.json
  PILOT_MANIFEST_SHA: 24d6e0b1f3e9fc2604a6e83f557dd2da142f734cb8e3db58f055727aad56f175
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5
  RECEIPT_SOURCE_SHA: 78bd64f648ae72a990c8b49b37460e6500679df87c3b06f57bc0a1da1a291ba9

jobs:
  receive-original-failure-without-mathematics:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 15
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the immutable original source and new receipt
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-known-cut-direction-cap-pilot-v2-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate the unchanged manifest and verify the separately pinned receipt source
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$PILOT_MANIFEST" --manifest-sha "$PILOT_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cut_v2_failure_receipt_CI.py')
          if hashlib.sha256(p.read_bytes()).hexdigest()!=os.environ['RECEIPT_SOURCE_SHA']:
              raise ValueError('the separately frozen receipt source differs')
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the original manifest environment without running a producer
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible original artifact and output paths
        id: paths
        run: |
          printf 'original=%s\n' "$RUNNER_TEMP/cut-v2-original-failure" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/cut-v2-failure-receipt-output" >> "$GITHUB_OUTPUT"
      - name: Receive the original small failed artifact only
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43609037484
          name: visible-exact-known-cut-direction-cap-pilot-v2-43609037484-1
          path: ${{ steps.paths.outputs.original }}
      - name: Publish actual failure gates and child log without running mathematics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cut_v2_failure_receipt_CI.py
          --manifest "$PILOT_MANIFEST" --manifest-sha "$PILOT_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --receipt-source-sha "$RECEIPT_SOURCE_SHA"
          --original-artifact "$RUNNER_TEMP/cut-v2-original-failure"
          --work "$RUNNER_TEMP/cut-v2-failure-receipt-work"
          --artifact-dir "$RUNNER_TEMP/cut-v2-failure-receipt-output"
      - name: Preserve the actual receipt outcome
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-v2-failure-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
