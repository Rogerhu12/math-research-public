name: visible-exact cached weighted cap Q

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_weighted_cap_Q.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_weighted_cap_Q_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cached-weighted-cap-Q-contract.md'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cached-weighted-cap-Q-CI-inputs.json'
      - '.github/workflows/visible-exact-cached-weighted-cap-Q.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-cached-weighted-cap-Q
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  WEIGHTED_Q_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cached-weighted-cap-Q-CI-inputs.json
  WEIGHTED_Q_MANIFEST_SHA: '61def9069aaca22071de918d766e5d983f755d20e87fd924caa7c31e436edfeb'
  WEIGHTED_Q_WORKER_SHA: '0e240776c168743dc39df806633ee718eab150beab610792decd18eaa7bfc20e'
  WEIGHTED_Q_SOURCE_SHA: '1be4b1115380c722a09c504e2fea99f6e32d3e0b12c8e92f44b1aa50ee27de16'
  WEIGHTED_Q_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-reviewed-public-CI-rules-reproducible-data.json

jobs:
  consume:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out public scripts and small parameters
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/notes/cached_cap_L1_endpoint_ci/run-43692857656-1-cached-cap-L1-reference-endpoint/process.json
            /topics/visible-flex-exact-nearby/notes/cached_cap_L1_endpoint_ci/run-43692857656-1-cached-cap-L1-reference-endpoint/actual-cap-L1-endpoint-summary.json
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_cap_L1_endpoint_sources.py
            /topics/visible-flex-exact-nearby/results/R133-supplement-physical-cap-L1-Wiener-sources-and-practical-nonlinear-body-ball.md
            /topics/visible-flex-exact-nearby/results/R133-supplement-weighted-Q-endpoint-invariance-and-small-analytic-cap-ball.md
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-reviewed-public-CI-rules-reproducible-data.json
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_weighted_cap_Q.py
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_weighted_cap_Q_CI.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cached-weighted-cap-Q-contract.md
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-cached-weighted-cap-Q-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/cached_weighted_cap_Q_ci/
      - name: Install the exact interpreter
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Parse exact new sources before restoring original inputs
        run: |
          python - <<'PY_SYNTAX'
          import ast,hashlib,json,os,pathlib
          source=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_weighted_cap_Q.py')
          worker=source.with_name('fourfold_codazzi_cached_weighted_cap_Q_CI.py')
          manifest=pathlib.Path(os.environ['WEIGHTED_Q_MANIFEST'])
          for p,h in ((source,os.environ['WEIGHTED_Q_SOURCE_SHA']),
                      (worker,os.environ['WEIGHTED_Q_WORKER_SHA']),
                      (manifest,os.environ['WEIGHTED_Q_MANIFEST_SHA'])):
              raw=p.read_bytes()
              if hashlib.sha256(raw).hexdigest()!=h:raise ValueError('new exact text changed: '+str(p))
              if p.suffix=='.py':ast.parse(raw.decode(),filename=str(p))
              else:json.loads(raw)
          print('Only exact text syntax and identity checked; no mathematics executed.')
          PY_SYNTAX
      - name: Install the pinned directed arithmetic and original-array reader
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5
      - name: Consume original rows and the one exact mean slot for weighted Q
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_cached_weighted_cap_Q_CI.py
          --repo "$GITHUB_WORKSPACE"
          --work "$RUNNER_TEMP/visible-exact-cached-weighted-cap-Q"
          --manifest "$WEIGHTED_Q_MANIFEST" --manifest-sha "$WEIGHTED_Q_MANIFEST_SHA"
          --rules "$WEIGHTED_Q_RULES" --compute-minutes 20
      - name: Print actual small outcome without uploading new recomputable data
        if: always()
        env:
          SMALL_PROCESS: ${{ runner.temp }}/visible-exact-cached-weighted-cap-Q/final-small-process.json
        run: |
          python - <<'PY_RESULT'
          import json,os,pathlib
          p=pathlib.Path(os.environ['SMALL_PROCESS'])
          if not p.exists():
              print('No mathematical process receipt exists; inspect the real preceding setup step.')
          else:
              d=json.loads(p.read_bytes())
              keep=('complete','failure','publication_failure','actual_scientific_complete',
                    'actual_scientific_failure','actual_output_sha256','actual_scientific_summary_sha256',
                    'actual_scientific_gates','historical_hydration','last_read_commit','topic_size_metadata',
                    'new_recomputable_data_persisted','new_Actions_artifacts','new_Release_uploads')
              s={k:d[k] for k in keep if k in d}
              s['actual_children']=[{'label':x['label'],'actual_returncode':x.get('actual_returncode')}
                                    for x in d.get('children',[])]
              s['actual_last_readme_check']=d.get('readme_checks',[])[-1:]
              print(json.dumps(s,ensure_ascii=False))
          PY_RESULT
