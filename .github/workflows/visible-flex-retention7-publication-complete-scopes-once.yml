      p63: ${{ steps.collect.outputs.p63 }}
    steps:
      - name: Bind three authored metadata sources then read the two original logs once
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -u - <<'PY'
          import base64,hashlib,json,os,pathlib,sys
          import urllib.request as U
          REPO="Rogerhu12/math-research-public"
          SOURCES=[{"file":"visible_flex_terminal_scope_parser.py","bytes":13241,"sha256":"3b7d9ede1f92f6a81c72e8fcc19a1215c19fc718903a574a8cd294355f9d3c11","blob":"da835d7b4710d5599f6efcf4dbdad0ec904dec6c"},{"file":"visible_flex_terminal_scope_transport.py","bytes":18414,"sha256":"1747be65e1442ed4268aa3df33a6192fe1e1bbb8a1c657a13ad7b20b72f1dc97","blob":"709bc71ce0358be8aaca52eccd440d4fc2ba06fa"},{"file":"retention7publication-terminal-reader.json","bytes":527,"sha256":"3d05b9e967ad0f00aadfb7170d99c5fd33a2ceb7b90916f2cba6b488fcfaa583","blob":"20cfb9346818eb624f58c5da9821b0e152943822"}]
          if os.environ["GITHUB_REPOSITORY"]!=REPO or os.environ["GITHUB_RUN_ATTEMPT"]!="1":
              raise RuntimeError("fixed-public-repository-and-first-reader-attempt")
          class NoRedirect(U.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=U.build_opener(NoRedirect)
          headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                   "Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",
                   "User-Agent":"retention7publication-authored-metadata-source-bootstrap"}
          target=pathlib.Path(os.environ["RUNNER_TEMP"])/"retention7publication-once-complete-scopes"
          target.mkdir(mode=0o700,exist_ok=False)
          bound=[]
          for source in SOURCES:
              url="https://api.github.com/repos/"+REPO+"/git/blobs/"+source["blob"]
              with opener.open(U.Request(url,headers=headers),timeout=120) as response:
                  value=json.loads(response.read())
              if value.get("encoding")!="base64" or value.get("sha")!=source["blob"]:
                  raise RuntimeError("exact-authored-source-blob-response")
              raw=base64.b64decode(value["content"])
              sha=hashlib.sha256(raw).hexdigest()
              gitsha=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              if (len(raw)!=source["bytes"] or sha!=source["sha256"]
                      or gitsha!=source["blob"]):
                  raise RuntimeError("complete-authored-source-bytes-and-two-identities")
              path=target/source["file"]
              with path.open("xb") as stream: stream.write(raw)
              bound.append(source)
          print("RETENTION7_PUBLICATION_TERMINAL_READER_SOURCE_BINDING "+json.dumps(
              {"sources":bound,"original_log_requests_before_source_binding":0,
               "source_is_only_standard_library_metadata":True},
              sort_keys=True,separators=(",",":")),flush=True)
          os.execv(sys.executable,[sys.executable,"-u",
              str(target/"visible_flex_terminal_scope_transport.py"),
              "--config",str(target/"retention7publication-terminal-reader.json")])
          PY
  scope:
    name: Whole terminal scope ${{ matrix.slot }}
    needs: collect
    if: always() && needs.collect.outputs.matrix != ''
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.collect.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Display this whole scope once and verify its received bytes
        env:
          SCOPE_EXPECTED: ${{ toJSON(matrix) }}
          SCOPE_PAYLOAD: ${{ needs.collect.outputs[matrix.slot] }}
        shell: bash
        run: |
          python3 -u - <<'PY'
          import hashlib,json,os
          expected=json.loads(os.environ["SCOPE_EXPECTED"])
          received=os.environ["SCOPE_PAYLOAD"]
          def identity(raw):
              return {"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
          raw_display=received.encode("utf-8")
          if identity(raw_display)!=expected["display_identity"]:
              raise RuntimeError("actual-whole-environment-display-identity")
          prefix=expected["begin"]+"\n"
          suffix="\n"+expected["end"]
          if not received.startswith(prefix) or not received.endswith(suffix):
              raise RuntimeError("actual-complete-administrative-display-delimiters")
          payload=received[len(prefix):-len(suffix)].encode("utf-8")
          if identity(payload)!=expected["payload_identity"] or len(payload)>90000:
              raise RuntimeError("actual-complete-original-scope-bytes-and-SHA")
          # The runner already displays SCOPE_PAYLOAD in its environment group.
          # Do not print it a second time. This is an administrative display,
          # not a fabricated original BEGIN/END event or a new scientific result.
          print("RETENTION7_PUBLICATION_TERMINAL_SCOPE_DELIVERY "+json.dumps({
              "schema":"retention7publication-whole-scope-environment-delivery-v1",
              "slot":expected["slot"],"kind":expected["kind"],
              "scope_id":expected.get("scope_id"),
              "payload_identity":identity(payload),
              "display_identity":identity(raw_display),
              "actual_received_bytes_verified":True,
              "whole_body_display_location":"SCOPE_PAYLOAD in runner environment group",
              "body_not_printed_again_on_stdout":True,
              "original_source_or_science_not_executed":True,
              "no_new_scientific_success_or_quiet_claim":True},
              sort_keys=True,separators=(",",":")),flush=True)
          PY
