name: Read retention7publication complete terminal scopes once
on:
  push:
    branches: [visible-flex-retention7publication-complete-scopes-once-20261116]
permissions:
  contents: read
  actions: read
concurrency:
  group: retention7publication-original-terminal-logs-once
  cancel-in-progress: false
jobs:
  collect:
    name: Bind retention7publication and read each original terminal job log once
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      meta: ${{ steps.collect.outputs.meta }}
      p00: ${{ steps.collect.outputs.p00 }}
      p01: ${{ steps.collect.outputs.p01 }}
      p02: ${{ steps.collect.outputs.p02 }}
