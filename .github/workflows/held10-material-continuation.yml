name: held10 material-curvature continuation

on:
  push:
    branches: [main]
    paths: [topics/visible-flex-held-10pct/ci/material-continuation-request.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: held10-material-continuation
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: topics/visible-flex-held-10pct
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical libraries
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Pull main and check both rule files
        shell: python
        run: |
          import json, subprocess, sys
          from pathlib import Path
          request=json.loads(Path('topics/visible-flex-held-10pct/ci/material-continuation-request.json').read_text())
          old=request['read_rules_commit']
          subprocess.run(['git','fetch','--depth=1','--filter=blob:none','origin',old],check=True)
          subprocess.run(['git','pull','--rebase','origin','main'],check=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          diff=subprocess.check_output(['git','diff',old,head,'--','README.md','topics/visible-flex-held-10pct/README.md'],text=True)
          print(json.dumps(dict(event='actual_pull_rules',previous_read=old,pulled_commit=head,readme_diff=diff)),flush=True)
          if diff:
              raise SystemExit('Read changed rules before continuing this computation')
          manifest=Path('topics/visible-flex-held-10pct/scripts/nonlinear_tail/m3_coupled_seed_deliverable/m3_source_recovery_manifest.json')
          revisions=sorted({item['revision'] for item in json.loads(manifest.read_text())['files']})
          for revision in revisions:
              subprocess.run(['git','fetch','--depth=1','--filter=blob:none','--no-tags','origin',revision],check=True)
      - name: Restore declared source and physical inputs
        run: |
          python topics/visible-flex-held-10pct/scripts/resume_m3/portable_bootstrap.py --repo "$GITHUB_WORKSPACE" --workdir "$RUNNER_TEMP/held10-material" > "$RUNNER_TEMP/held10-bootstrap.log" 2>&1
      - name: Recover by one low height and seven original DNs
        run: |
          python -u topics/visible-flex-held-10pct/scripts/resume_m3/height_amplitude_path.py --repo "$GITHUB_WORKSPACE" --workdir "$RUNNER_TEMP/held10-material" > "$RUNNER_TEMP/held10-height.log" 2>&1
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'held10-material/height-amplitude-path.json').read_text())
          assert result['status']=='q060_initializer_ready'
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              print('HELD_INITIAL_RAW='+result['accepted_raw'],file=stream)
          PY
      - name: Solve the new material homotopy at lambda .02
        run: |
          HELD_WORK="$RUNNER_TEMP/held10-material"
          HELD_TOPIC="$GITHUB_WORKSPACE/topics/visible-flex-held-10pct"
          python -u "$HELD_TOPIC/scripts/resume_m3/portable_prefix_continue.py" \
            --source-topic "$HELD_WORK/runtime-source/bundle/topics/visible-flexible-closed-surface" \
            --short-bridge "$HELD_WORK/runtime-source/bundle/topics/visible-flex-larger-amplitude/computations/root_short_bridge.py" \
            --profile "$HELD_WORK/inputs/q060-profile.json" --chart "$HELD_WORK/inputs/reference/chart.json" \
            --port "$HELD_WORK/inputs/q060-port.json" --amplitude .06 --warp-reference .06 \
            --nodes 401 --max-nodes 6000 --raw-restart "$HELD_INITIAL_RAW" \
            --core-module "$HELD_TOPIC/scripts/resume_m3/material_support_factory.py" \
            --core-config "$HELD_TOPIC/scripts/resume_m3/material_support_lam002.json" \
            --outdir "$HELD_WORK/material-lam002-linear" > "$RUNNER_TEMP/held10-linear.log" 2>&1
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'held10-material/material-lam002-linear/run.json').read_text())
          m=d.get('prefix_audit',{}).get('metric_l1')
          accepted=bool(d.get('solver_success') and not d.get('error') and m is not None and m<=1e-6)
          print(json.dumps(dict(event='linear_material_gate',accepted=accepted,metric=m,error=d.get('error'))))
          raise SystemExit(0 if accepted else 2)
          PY
      - name: Restore true nonlinear DN and continue the physical design
        run: |
          python -u topics/visible-flex-held-10pct/scripts/resume_m3/continue_material_true_tail.py \
            --repo "$GITHUB_WORKSPACE" --workdir "$RUNNER_TEMP/held10-material" \
            --prefix-dir "$RUNNER_TEMP/held10-material/material-lam002-linear" \
            --core-config topics/visible-flex-held-10pct/scripts/resume_m3/material_support_lam002.json \
            --workers 2 > "$RUNNER_TEMP/held10-true-tail.log" 2>&1
      - name: Report only compact actual diagnostics
        if: always()
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);work=root/'held10-material'
          for name in ('height-amplitude-path.json','material-continuation.json'):
              path=work/name
              if path.exists():
                  text=path.read_text()
                  print(json.dumps(dict(file=name,sha256=hashlib.sha256(path.read_bytes()).hexdigest(),record=json.loads(text))),flush=True)
          for directory in sorted(work.glob('height-*'))+[work/'material-lam002-linear']:
              name=directory.name
              path=directory/'run.json'
              if path.exists():
                  d=json.loads(path.read_text())
                  keys=('solver_success','error','traceback','raw_return','prefix_audit','domain_newton_stats','domain_error_counts','boundary_kind','original_linear_DN_physical_residual','original_nonlinear_DN_accepted','height_count','initializer_height_amplitude','prescribed_physical_height')
                  print(json.dumps(dict(stage=name,run_sha256=hashlib.sha256(path.read_bytes()).hexdigest(),record={k:d[k] for k in keys if k in d})),flush=True)
          for name in ('held10-bootstrap.log','held10-core-check.log','held10-height.log','held10-linear.log','held10-true-tail.log'):
              path=root/name
              if path.exists():
                  lines=path.read_text(errors='replace').splitlines()
                  print(json.dumps(dict(log=name,last_lines=lines[-18:])),flush=True)
          print(json.dumps(dict(complete_surface=False,generated_arrays_uploaded=False,scope='Actual finite diagnostics only; no whole-surface, fixed-metric refinement or held10 claim.')),flush=True)
