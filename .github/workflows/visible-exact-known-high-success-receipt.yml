name: visible-exact known high mathematical success receipt

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_known_high_success_receipt_CI.py'
      - '.github/workflows/visible-exact-known-high-success-receipt.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-known-high-success-receipt
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  HIGH_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-known-high-source-from-Z-tail-CI-inputs.json
  HIGH_MANIFEST_SHA: de4bd52b27daceb5b3ea85a79c2ba37dd01196143384ffc72d0946dc6826a759
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  receipt:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 25
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-known-high-source-from-Z-tail-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate the unchanged original scientific pins and this receipt folder
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$HIGH_MANIFEST" --manifest-sha "$HIGH_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/known_high_Z_tail_receipt_ci/
      - name: Parse the new sources before any mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_known_high_success_receipt_CI.py',):
              ast.parse((root/name).read_text(),filename=name)
          print('Receipt worker parsed; no mathematical child will run.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible receipt paths
        id: paths
        run: |
          printf 'original=%s\n' "$RUNNER_TEMP/visible-exact-known-high-original-success" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-known-high-receipt-output" >> "$GITHUB_OUTPUT"
      - name: Receive the complete original successful native and publication failure
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43628921664
          name: visible-exact-complete-known-high-Z-tail-source-43628921664-1
          path: ${{ steps.paths.outputs.original }}
      - name: Publish only the exact original mathematical receipt with zero new source rows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_known_high_success_receipt_CI.py
          --manifest "$HIGH_MANIFEST" --manifest-sha "$HIGH_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --receipt-worker-sha 74a00ec426b897222424ca6a9241d7aa1f2d3b9763529fa2fd6be31671caecee
          --original-artifact "$RUNNER_TEMP/visible-exact-known-high-original-success"
          --work "$RUNNER_TEMP/visible-exact-known-high-receipt-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-known-high-receipt-output"
          --compute-minutes 15 --checkpoint-minutes 10
      - name: Require nonempty actual evidence and a small inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          data=(json.dumps(entries,indent=2)+'\n').encode()
          if len(data)>60000:raise RuntimeError('inventory exceeds60000 bytes; retain full original evidence')
          (root/'artifact-inventory.json').write_bytes(data)
          print(dict(actual_files=len(files),actual_inventory_bytes=len(data)))
          PY_INVENTORY
      - name: Preserve the unchanged complete native and both actual process receipts
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-known-high-success-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
