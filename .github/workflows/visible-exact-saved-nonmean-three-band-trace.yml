name: visible-exact saved-nonmean three-band trace

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-saved-nonmean-three-band-trace.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-saved-nonmean-three-band-trace
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  THREEBAND_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-saved-nonmean-three-band-trace-CI-inputs.json
  THREEBAND_MANIFEST_SHA: e9ea51e344e873096d14e2c18d25da085c82e268de1039bd0e09a3c7a3b972ec
  THREEBAND_PIPELINE_SHA: 129f7f7955bb8d11385b9804353f0e389761ba38cc74467436a9600283376934
  THREEBAND_WORKER_SHA: 7f1bd9e510cbbe226e251234893b5e603cd7b4584101cf0a01de086cd19ab612
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  saved-nonmean-three-band-trace:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 60
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_saved_nonmean_three_band_trace_ci.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-saved-nonmean-three-band-trace-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_saved_nonmean_three_band_trace_ci.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['THREEBAND_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_saved_nonmean_three_band_trace_ci.py --mode hydrate
          --manifest "$THREEBAND_MANIFEST" --manifest-sha "$THREEBAND_MANIFEST_SHA"
          --pipeline-sha "$THREEBAND_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new source before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_saved_nonmean_three_band_trace.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['THREEBAND_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the pinned scalar arithmetic runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Restrict original nonmean rows and compute explicit three-band coefficients
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_saved_nonmean_three_band_trace_ci.py --mode run
          --manifest "$THREEBAND_MANIFEST" --manifest-sha "$THREEBAND_MANIFEST_SHA"
          --pipeline-sha "$THREEBAND_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-saved-nonmean-three-band-trace-science"
          --out-dir "$RUNNER_TEMP/visible-exact-saved-nonmean-three-band-trace-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
