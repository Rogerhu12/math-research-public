name: visible-larger actual accepted full field to shared closed surface
'on':
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-native-closed-followup-request.json
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  fullclosedfollowup:
    name: Actual accepted prefix and own tail through R249 and shared B
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: visible-larger-public-fullclosedfollowup
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
      - name: Establish separate complete output
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          mkdir -p "$RUNNER_TEMP/visible-closed-followup/fullclosedfollowup"
          echo "VISIBLE_OUT=$RUNNER_TEMP/visible-closed-followup/fullclosedfollowup" >> "$GITHUB_ENV"
          echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install the original complete-field numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Bind real accepted inputs and frozen source bytes
        run: |
          python - <<'PYPINS'
          import ast, hashlib, json, os, re, subprocess
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          comp = Path(os.environ['VISIBLE_COMPUTATIONS'])
          out = Path(os.environ['VISIBLE_OUT'])
          request_file = comp/'public-native-closed-followup-request.json'
          raw = request_file.read_bytes()
          request = json.loads(raw)
          if (request.get('schema') != 'public-actual-full-DN-closed-followup-request-v1'
                  or request.get('repository') != 'Rogerhu12/math-research-public'
                  or request.get('lanes') != ['fullclosedfollowup']):
              raise ValueError('Use the actual public closed follow-up request')
          driver = 'geometry_20261114_full_dn_closed_followup.py'
          tree = ast.parse((comp/driver).read_bytes())
          assignments = [node for node in tree.body if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == 'EXPECTED_SOURCES' for t in node.targets)]
          if len(assignments) != 1:
              raise ValueError('The frozen child source catalog differs')
          children = ast.literal_eval(assignments[0].value)
          required = set(children) | {driver, 'exact_20261114_public_resume.py',
              'root_20261114_current576_rules_runner.py', 'root_20261114_publish_actions.py'}
          pins = request['source_sha256']
          if not required.issubset(pins):
              raise ValueError('Pin the composition and every actual child plus public transport/rules sources')
          verified_sources = []
          for name, expected in pins.items():
              if Path(name).name != name or not re.fullmatch('[0-9a-f]{64}', str(expected)):
                  raise ValueError('Actual source basenames and complete SHA256 values are required')
              source = (comp/name).read_bytes()
              if hashlib.sha256(source).hexdigest() != expected:
                  raise ValueError('A source changed: '+name)
              if name in children and children[name] != expected:
                  raise ValueError('The request and unchanged child catalog differ: '+name)
              if name.endswith('.py'):
                  compile(source, name, 'exec')
              verified_sources.append(dict(file=name, bytes=len(source), sha256=expected))
          inputs = request['inputs']
          if set(inputs) != {'checkpoint', 'port', 'tail_config', 'tail_response'}:
              raise ValueError('Bind the four actual accepted field and own-tail files')
          checkout = []
          for key, item in inputs.items():
              path = PurePosixPath(item['file'])
              if (path.is_absolute() or '..' in path.parts
                      or not str(path).startswith('topics/visible-flex-larger-amplitude/')
                      or type(item['bytes']) is not int or item['bytes'] < 0
                      or not re.fullmatch('[0-9a-f]{64}', str(item['sha256']))):
                  raise ValueError('Actual public input file identity required: '+key)
              checkout.append('/'+str(path))
          subprocess.run(['git', 'sparse-checkout', 'add', '--no-cone', '--stdin'],
              input='\n'.join(checkout)+'\n', text=True, check=True)
          for key, item in inputs.items():
              payload = (root/item['file']).read_bytes()
              if len(payload) != item['bytes'] or hashlib.sha256(payload).hexdigest() != item['sha256']:
                  raise ValueError('Actual input bytes differ: '+key)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != os.environ['GITHUB_SHA']:
              raise ValueError('Keep the numerical source checkout at the request commit')
          receipt = dict(schema='actual-closed-followup-request-identity-v1',
              source_commit=head, request_sha256=hashlib.sha256(raw).hexdigest(),
              request=request, verified_sources=verified_sources, verified_actual_inputs=inputs,
              source_checkout_readme_blobs={name: subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD:'+name], text=True).strip()
                  for name in ('README.md', 'topics/visible-flex-larger-amplitude/README.md')},
              source_checks_only_no_numerical_execution=True,
              new_acceptance_not_inferred_from_workflow_status=True)
          (out/'closed-followup-request-identity.json').write_text(json.dumps(receipt, indent=2)+'\n')
          print(json.dumps(dict(source_commit=head, sources=len(verified_sources),
              actual_inputs=len(inputs), AST_not_import=True)), flush=True)
          PYPINS
      - name: Check original native readout syntax and actual storage
        run: |
          node --check "$VISIBLE_COMPUTATIONS/exact_20261114_resolved_radial_readout.mjs"
          node --check "$VISIBLE_COMPUTATIONS/exact_20261114_closed_background.mjs"
          node --version
          python --version
          python - <<'PYSPACE'
          import json, os, shutil
          from pathlib import Path
          out = Path(os.environ['VISIBLE_OUT'])
          request = json.loads((Path(os.environ['VISIBLE_COMPUTATIONS'])/'public-native-closed-followup-request.json').read_text())
          plan = request['resource_plan']
          required = plan['minimum_free_bytes']
          if type(required) is not int or required <= 0:
              raise ValueError('Supply an explicit storage plan for complete readout and all finite bundles')
          usage = shutil.disk_usage(out)._asdict()
          record = dict(declared_resource_plan=plan, actual=usage,
              all_original_readout_states_and_finite_field_nodes_retained=True,
              display_mesh_budget_separate_from_full_physical_field=True,
              native_BVP_or_DN_Newton_iteration_requested=False)
          (out/'runner-storage.json').write_text(json.dumps(record, indent=2)+'\n')
          print(json.dumps(record), flush=True)
          if usage['free'] < required:
              raise RuntimeError('The declared complete-output plan exceeds actual runner storage')
          PYSPACE
      - name: Restore the bound public original78 source
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYSOURCE' 2>&1 | tee "$VISIBLE_OUT/public-source-restore.log"
          import os
          from pathlib import Path
          from exact_20261114_public_resume import prepare_public_source
          source = prepare_public_source(Path.cwd(),
              Path(os.environ['RUNNER_TEMP'])/'closed-followup-public-original-source',
              Path(os.environ['VISIBLE_OUT']))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
          PYSOURCE
      - name: Complete actual readout, R249 and shared-B closed construction
        timeout-minutes: 320
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u - <<'PYRUN' 2>&1 | tee "$VISIBLE_OUT/closed-followup.log"
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path.cwd()
          comp = Path(os.environ['VISIBLE_COMPUTATIONS'])
          out = Path(os.environ['VISIBLE_OUT'])
          request = json.loads((comp/'public-native-closed-followup-request.json').read_text())
          command = [sys.executable, '-u', str(comp/'geometry_20261114_full_dn_closed_followup.py'),
              'build', '--source-topic', os.environ['VISIBLE_SOURCE_TOPIC'],
              '--out', str(out/'accepted-shared-closed')]
          for key, item in request['inputs'].items():
              flag = '--'+key.replace('_', '-')
              command += [flag, str(root/item['file']), flag+'-sha256', item['sha256']]
          runtime = request.get('runtime', {})
          for key in ('angles', 'radial_subdivisions', 'inlet_radial_subdivisions'):
              if key in runtime:
                  command += ['--'+key.replace('_', '-'), *map(str, runtime[key])]
          if 'readout_levels' in runtime:
              command += ['--readout-levels', str(runtime['readout_levels'])]
          wrapped = [sys.executable, '-u', str(comp/'root_20261114_current576_rules_runner.py'),
              '--out', str(out/'rule-sync'), '--command', *command]
          raise SystemExit(subprocess.call(wrapped))
          PYRUN
      - name: Preserve all actual tail nodes, normalized field and shared closed geometry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-mainline-fullclosedfollowup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visible-closed-followup/fullclosedfollowup/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded actual receipts with ordinary rebase and README checks
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u "$VISIBLE_COMPUTATIONS/root_20261114_publish_actions.py" \
            --results "$VISIBLE_OUT" --lane fullclosedfollowup
