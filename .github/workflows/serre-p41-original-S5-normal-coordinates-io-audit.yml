name: Serre R809 existing success source IO review

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R809-public-success-source-io-audit-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R809-existing-success-source-IO
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R809_public_success_source_io_audit.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/notes/R809-public-success-source-io-audit-request.json
            /.github/workflows/serre-p41-original-S5-normal-coordinates-io-audit.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse only the two frozen standard-library IO sources
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path("topics/serre-uniformity/scripts")
          for name in ("R809_public_success_source_io_audit.py",
                       "R824_public_original_global_polar_generators.py"):
              path = root/name
              ast.parse(path.read_text(), filename=str(path))
              print("AST_OK", name)
          PY
      - name: Read original small normal-coordinate source members over ZIP64 HTTP Range
        run: |
          python topics/serre-uniformity/scripts/R809_public_success_source_io_audit.py \
            --output "$RUNNER_TEMP/R809-source-IO/output"
      - name: Retain only the one-day IO receipt and selected original inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-R809-existing-success-source-IO-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R809-source-IO/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
