name: Serre p41 original M6 pole clearing

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R807-public-original-M6-pole-clearing-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R807-original-M6-pole-clearing
  cancel-in-progress: false

jobs:
  original_m6_pole_clearing:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-M6-pole-clearing.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R807_original_M6_pole_clearing.py
            /topics/serre-uniformity/scripts/R807_public_original_M6_pole_clearing.py
            /topics/serre-uniformity/scripts/R786_public_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R807-public-original-M6-pole-clearing-request.json
            /topics/serre-uniformity/notes/R807-original-M6-pole-clearing-execution-contract.md
            /topics/serre-uniformity/results/R805-original-two-affine-charts-and-small-polar-divisor-adapter.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source syntax without executing mathematics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("R807_original_M6_pole_clearing.py", "R807_public_original_M6_pole_clearing.py"):
              path = Path("topics/serre-uniformity/scripts") / name
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compute one V4 block, five projections, actual kernel and four M6 clearing rows
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R807_public_original_M6_pole_clearing.py compute
      - name: Transfer the active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R807-original-M6-pole-clearing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R807-original-M6-pole-clearing/output
          retention-days: 1
          if-no-files-found: warn
      - name: Require actual nonzero theta and all four products verified in all1100 rows
        if: always()
        run: python topics/serre-uniformity/scripts/R807_public_original_M6_pole_clearing.py verify
