          RT_PATTERNS = ["topics/visible-flex-larger-amplitude/notes/public-actions-43671882961-1-condensedqp/twenty-six-condensed-warm/domain-operator/manifest.json","notes/public-actions-43671882961-1-condensedqp/twenty-six-condensed-warm/domain-operator/manifest.json","public-actions-43671882961-1-condensedqp","twenty-six-condensed-warm","43671882961","51b52c3660ef47b47b12024f2932a3ca41927e47","3d2aa285471b58ccc859729366d26a8ca6332f5ece6eb8d88c423d97b062d0bb","b0dc7d5daf8344a07c07c7d53bd714c707ec3aceef9d3adee2fcf11004d2fc34","topics/visible-flex-larger-amplitude/notes/public-actions-43674854261-1-condensedqp/twenty-eight-condensed-warm/domain-operator/manifest.json","notes/public-actions-43674854261-1-condensedqp/twenty-eight-condensed-warm/domain-operator/manifest.json","public-actions-43674854261-1-condensedqp","twenty-eight-condensed-warm","43674854261","613e0701158c163053a29253fcde18561c6dac91","6e983683817eaf153f20686f2aa2b12c05bd397e738172b7d5c675527ad68eac","f04722650551ecb516d33fd680ba4c83a74e9a181609c5e457b7b29cf94aef4b","domain-operator","domain_operator","condensed-array-manifest","optimization-intent","geometry_20261114_twenty_six_query_domain_operator","geometry_20261114_twenty_eight_query_domain_operator","captured-twenty-six-query-original-RMS-and-collocation-midpoint-domain-v1","captured-twenty-eight-query-original-RMS-and-collocation-midpoint-domain-v1"]
          RT_CANDIDATES = [{"path":"topics/visible-flex-larger-amplitude/notes/public-actions-43671882961-1-condensedqp/twenty-six-condensed-warm/domain-operator/manifest.json","blob":"51b52c3660ef47b47b12024f2932a3ca41927e47","bytes":701874},{"path":"topics/visible-flex-larger-amplitude/notes/public-actions-43674854261-1-condensedqp/twenty-eight-condensed-warm/domain-operator/manifest.json","blob":"613e0701158c163053a29253fcde18561c6dac91","bytes":754969}]
          RT_SUFFIXES = (".py",".mjs",".js",".json",".yml",".yaml",".hpp",".h",".cpp",".cc",".c",".sh",".toml",".ts",".tsx",".md",".markdown",".rst",".txt",".ini",".cfg",".xml",".html",".css")
          RT_BASENAMES = ("README","LICENSE","COPYING","Makefile","Dockerfile",".gitignore",".gitattributes",".gitmodules")
          RT_HISTORY_SUFFIXES = (".md",".markdown",".rst",".txt")
          RT_HISTORY_BASENAMES = ("README","LICENSE","COPYING")
          def rt_git(*args):
           return subprocess.check_output(["git","-C",str(r),*args])
          def rt_sha(raw):
           return hashlib.sha256(raw).hexdigest()
          def rt_canonical(value):
           return json.dumps(value,ensure_ascii=True,separators=(",",":"),allow_nan=False).encode()
          def rt_changes(left,right,topic_only=False):
           args=["diff","--raw","--no-abbrev","--no-renames","-z",left,right]
           if topic_only:args+=["--",RT_TOPIC]
           tokens=rt_git(*args).split(b"\0")
           out=[];i=0
           while i<len(tokens) and tokens[i]:
            parts=tokens[i].decode("ascii").split();path=tokens[i+1].decode("utf-8")
            if len(parts)!=5 or not parts[0].startswith(":"):raise ValueError("Exact raw diff record")
            out.append(dict(path=path,old_mode=parts[0][1:],mode=parts[1],
                old_blob=parts[2],blob=parts[3],status=parts[4]))
            i+=2
           return out
          def retention_tail_guard():
           current=quiet("rev-parse","origin/main")
           before=quiet("rev-parse","HEAD")
           rg=shutil.which("rg")
           report=dict(schema="two-domain-retention-final-pull-delta-v1",reviewed_base=RT_BASE,
             actual_pulled_head=current,actual_proposed_head=before,
             scope="Complete bytes of every newly changed selected source/config/input since reviewed_base; historical text match counts only; exact unselected changes listed. No arbitrary dynamic-reference absence claim.",
             all_changed_paths=[],source_scans=[],historical_scans=[],removed_paths=[],
             unscanned_changes=[],current_source_matches=[],errors=[],
             candidate_original_main_identities=[],actual_search_backend="rg-presence-then-complete-byte-lines" if rg else "python-complete-byte-lines-rg-unavailable")
           for item in RT_CANDIDATES:
            actual=quiet("rev-parse","origin/main:"+item["path"])
            size=int(rt_git("cat-file","-s",actual).decode())
            report["candidate_original_main_identities"].append(dict(item,actual_blob=actual,actual_bytes=size))
            if actual!=item["blob"] or size!=item["bytes"]:
             report["errors"].append(dict(phase="candidate-identity",path=item["path"],actual_blob=actual,actual_bytes=size))
           def scan_raw(item,raw,representation,history):
            info=dict(path=item["path"],blob=item["blob"],bytes=len(raw),sha256=rt_sha(raw),
              representation=representation,matching_lines=0,pattern_occurrences=[0]*len(RT_PATTERNS))
            nonlocal_rg=[]
            if rg:
             cmd=[rg,"--text","--quiet","--fixed-strings"]
             for token in RT_PATTERNS:cmd+=["-e",token]
             proc=subprocess.run(cmd+["-"],input=raw,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
             info["rg_exit"]=proc.returncode
             info["rg_stderr"]=dict(bytes=len(proc.stderr),sha256=rt_sha(proc.stderr))
             if proc.returncode not in (0,1):
              report["errors"].append(dict(phase="rg",path=item["path"],exit=proc.returncode,
                 stderr=proc.stderr.decode("utf-8",errors="replace")))
             if proc.returncode==1:
              (report["historical_scans"] if history else report["source_scans"]).append(info)
              return
            start=0
            for number,line in enumerate(raw.splitlines(keepends=True),1):
             found=[]
             for index,token in enumerate(RT_PATTERNS):
              word=token.encode("utf-8");positions=[];where=line.find(word)
              while where>=0:
               positions.append(where);where=line.find(word,where+1)
              if positions:
               found.append([index,positions]);info["pattern_occurrences"][index]+=len(positions)
             if found:
              info["matching_lines"]+=1
              if not history:
               report["current_source_matches"].append(dict(path=item["path"],blob=item["blob"],
                 representation=representation,line_1_based=number,line_start_byte=start,
                 line_bytes=len(line),line_sha256=rt_sha(line),all_pattern_occurrences=found))
             start+=len(line)
            (report["historical_scans"] if history else report["source_scans"]).append(info)
           for item in rt_changes(RT_BASE,current):
            report["all_changed_paths"].append(item)
            if item["mode"]=="000000":
             report["removed_paths"].append(item["path"]);continue
            path=item["path"];base=pathlib.PurePosixPath(path).name
            is_gzip=path.startswith(RT_TOPIC+"/") and path.endswith(".gz")
            selected=path.endswith(RT_SUFFIXES) or base in RT_BASENAMES or is_gzip
            if item["mode"] not in ("100644","100755") or not selected:
             report["unscanned_changes"].append(item);continue
            raw=rt_git("cat-file","blob",item["blob"])
            if is_gzip:
             try:
              decoded=gzip.decompress(raw)
              scan_raw(item,decoded,"complete-topic-gzip-decoded",False)
              report["source_scans"][-1]["stored_bytes"]=len(raw)
              report["source_scans"][-1]["stored_sha256"]=rt_sha(raw)
             except Exception as error:
              report["errors"].append(dict(phase="gzip",path=path,type=type(error).__name__,error=str(error)))
            else:
             history=path.endswith(RT_HISTORY_SUFFIXES) or base in RT_HISTORY_BASENAMES
             scan_raw(item,raw,"complete-tracked-bytes",history)
           topic_bytes=RT_BASE_TOPIC_BYTES;byte_delta=[]
           for item in rt_changes(RT_BASE,before,True):
            old_size=0 if item["old_mode"]=="000000" else int(rt_git("cat-file","-s",item["old_blob"]).decode())
            new_size=0 if item["mode"]=="000000" else int(rt_git("cat-file","-s",item["blob"]).decode())
            topic_bytes+=new_size-old_size
            byte_delta.append(dict(path=item["path"],old_blob=item["old_blob"],new_blob=item["blob"],
                old_bytes=old_size,new_bytes=new_size,delta=new_size-old_size))
           report["topic_capacity"]=dict(reviewed_base_bytes=RT_BASE_TOPIC_BYTES,
                complete_changed_file_deltas=byte_delta,actual_proposed_bytes=topic_bytes,limit_bytes=200000000)
           report["patterns"]=RT_PATTERNS
           report["complete_returned_scope"]=True
           report["allowed"]=not report["current_source_matches"] and not report["errors"] and topic_bytes<=200000000
           body=rt_canonical(report)
           print("RETENTION_TAIL_AUDIT_IDENTITY "+rt_canonical(dict(bytes=len(body),sha256=rt_sha(body),limit_bytes=90000)).decode(),flush=True)
           if len(body)>90000:
            print("RETENTION_TAIL_AUDIT_OVERFLOW "+rt_canonical(dict(complete_body_returned=False,bytes=len(body),sha256=rt_sha(body),allowed=False)).decode(),flush=True)
            raise SystemExit(70)
           print("RETENTION_TAIL_AUDIT "+body.decode(),flush=True)
           if not report["allowed"]:raise SystemExit("New concrete references, source errors or topic capacity need explicit resolution before this ordinary deletion")
           if quiet("rev-parse","HEAD")!=before:raise SystemExit("Read-only tail audit changed HEAD")
          
          print("RECOVERY_SOURCE_ONLY "+json.dumps({"source_commit":os.environ["VISIBLE_PUBLICATION_COMMIT"],"run":os.environ["GITHUB_RUN_ID"],"branch":os.environ["GITHUB_REF_NAME"],"scientific_program_executed":False}),flush=True)
          subprocess.run(["git","-c","http.lowSpeedLimit=1","-c","http.lowSpeedTime=60","clone","--filter=blob:none","--no-checkout","--depth=8","--single-branch","--branch",os.environ["GITHUB_REF_NAME"],"https://github.com/"+repo+".git",str(r)],check=True)
          g("config","user.name","ChatGPT");g("config","user.email","chatgpt@openai.com")
          g("config","--add","remote.origin.fetch","+refs/heads/main:refs/remotes/origin/main")
