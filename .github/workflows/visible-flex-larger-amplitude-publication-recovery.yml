          g("checkout","-b","visible-publication-work","origin/main")
          real_pull()
          p=g("cherry-pick",os.environ["VISIBLE_PUBLICATION_COMMIT"],check=False)
          if p.returncode:resolve_rule_only_conflict("cherry-pick")
