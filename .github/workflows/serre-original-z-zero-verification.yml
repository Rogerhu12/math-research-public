name: Serre original sigma zero verification

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R706-original-z-request.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify_original_z:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/*.py
            /topics/serre-uniformity/notes/R706-original-z-request.json
            /topics/serre-uniformity/computations/R706-original-z-137147/**
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned finite-field arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compute original-z certificate or reuse complete receipt
        continue-on-error: true
        timeout-minutes: 45
        run: python topics/serre-uniformity/scripts/R706_original_z_public.py compute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-cartier-R706-original-z-137147-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-cartier/R706-original-z-137147
          retention-days: 30
          if-no-files-found: warn
      - name: Publish complete or failed original outputs
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R706_original_z_public.py publish
      - name: Require complete independent agreement
        if: always()
        run: python topics/serre-uniformity/scripts/R706_original_z_public.py verify
