name: ISP short exact source identities
on:
  push:
    branches: [main]
    paths:
      - 'topics/invariant-subspace-problem/notes/2026-11-20-r150-short-exact-request-b2a9.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isp-r150-short-exact-b2a9
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ISP_PIN: ${{ github.sha }}
    steps:
      - name: Select exact arithmetic Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Partial checkout, actual pull, rule check, and frozen exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-r150-short-exact"
          cd "$RUNNER_TEMP/isp-r150-short-exact"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          timeout 120s git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          export ISP_BEFORE_PULL="$(git rev-parse HEAD)"
          timeout 120s git pull --rebase origin main
          export ISP_AFTER_PULL="$(git rev-parse HEAD)"
          python - <<'PY'
          import datetime,json,os,subprocess
          rules=['README.md','topics/invariant-subspace-problem/README.md']
          expected={'README.md':'282e86b03385d3b6245ce7100ae2e2af7b103c2d','topics/invariant-subspace-problem/README.md':'4d6570e9cf346431ab781a1290076a6321aaaa00'}
          before,after=os.environ['ISP_BEFORE_PULL'],os.environ['ISP_AFTER_PULL']
          diff=subprocess.check_output(['git','diff',before,after,'--',*rules],text=True)
          blobs={p:subprocess.check_output(['git','hash-object',p],text=True).strip() for p in rules}
          receipt={'format':'isp-789f-actual-actions-pull-v1','remoteCommit':after,'beforeCommit':before,'utc':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC'),'actualPullRebaseSucceeded':True,'rulesUnchanged':not diff and blobs==expected,'rulesGitBlobs':blobs,'executionEnvironment':'GitHubActions','runId':os.environ['GITHUB_RUN_ID']}
          if diff: print(diff,flush=True)
          print('ISP_PULL_RECEIPT '+json.dumps(receipt,sort_keys=True),flush=True)
          if not receipt['rulesUnchanged']: raise SystemExit('README changed; root must read and follow the exact differences')
          PY
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-20-essential-four-unit-two-plus-two-boundaries-verify.py" > "$RUNNER_TEMP/isp-unit22_boundaries.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-20-essential-four-unit-three-plus-one-zero-base-pairing-verify.py" > "$RUNNER_TEMP/isp-unit31_zero_base.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-20-r150-vzero-degree-six-matched-bell-certificate-b2a9.py" > "$RUNNER_TEMP/isp-vzero_degree6.py"
          python -m venv "$RUNNER_TEMP/isp-r150-short-venv"
          "$RUNNER_TEMP/isp-r150-short-venv/bin/python" -m pip install --quiet sympy==1.13.3 mpmath==1.3.0 python-flint==0.9.0
          "$RUNNER_TEMP/isp-r150-short-venv/bin/python" - <<'PY'
          import concurrent.futures,hashlib,json,os,subprocess,sys,time
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          jobs=[{"label":"unit22_boundaries","file":"isp-unit22_boundaries.py","source_sha256":"a2f39931923d3f1fc4f42f8372f0b0f3b566ce70bf205c22ae7bbc8cdae2cb24","seconds":60,"args":[]},{"label":"unit31_zero_base","file":"isp-unit31_zero_base.py","source_sha256":"136eb4d472d668da73e33d360bddf29b5b0cbd9869fd217ef52e266e4a49708f","seconds":90,"args":[]},{"label":"vzero_degree6","file":"isp-vzero_degree6.py","source_sha256":"baa36d716e7f15b2a6ba7f3739cebdf3f5e6d98b9f4e305bf1a2c9716125ff54","seconds":210,"args":["--wall-seconds","180","--memory-mib","1024"]}]
          for j in jobs:
              source=root/j['file']
              assert hashlib.sha256(source.read_bytes()).hexdigest()==j['source_sha256']
              compile(source.read_text(),str(source),'exec')
          def execute(j):
              begin=time.monotonic()
              output=root/(j['label']+'.stdout.txt')
              try:
                  run=subprocess.run([sys.executable,str(root/j['file']),*j['args']],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=j['seconds'])
                  data=run.stdout
                  code=run.returncode
              except subprocess.TimeoutExpired as e:
                  data=e.stdout or b''
                  code=124
              output.write_bytes(data)
              info={'label':j['label'],'source_sha256':j['source_sha256'],'exit_code':code,'elapsed_seconds':time.monotonic()-begin,'stdout_bytes':len(data),'stdout_sha256':hashlib.sha256(data).hexdigest()}
              return info,data
          failed=False
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              for future in concurrent.futures.as_completed([pool.submit(execute,j) for j in jobs]):
                  info,data=future.result()
                  print('ISP_EXACT_BEGIN '+info['label'],flush=True)
                  print(data[:60000].decode('utf8',errors='replace'),end='',flush=True)
                  print('ISP_EXACT_RESULT '+json.dumps(info,sort_keys=True),flush=True)
                  failed=failed or info['exit_code']!=0
          if failed: raise SystemExit(1)
          PY
