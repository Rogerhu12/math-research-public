name: visible-exact first-symbol original-prefix continuation v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-first-symbol-resume-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-current-first-symbol-resume-v2
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-current-first-symbol-resume-v2-CI-inputs.json
  PHASE_MANIFEST_SHA: d2f3d184f95e1652008274bfee1a4cb0588874ee1c0524d593255252570f7c2c
  PHASE_PIPELINE_SHA: 5597510ea5d0fe71cde2288b48b2ab10874c2dfd36c17f7fd8377c2f16c23cfd
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  continue-current-first-symbol-v2:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_first_symbol_resume_v2_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-current-first-symbol-resume-v2-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate the original2838-cell prefix and exact remaining scientific inputs
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_first_symbol_resume_v2_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set the original artifact path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-first-symbol-resume-v2-output" >> "$GITHUB_OUTPUT"
      - name: Continue the actual first-symbol prefix and publish its original outcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_first_symbol_resume_v2_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-first-symbol-resume-v2-science"
          --out-dir "$RUNNER_TEMP/visible-exact-first-symbol-resume-v2-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-first-symbol-resume-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 30
          if-no-files-found: warn
