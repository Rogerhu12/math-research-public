name: visible-exact exact full193 continuous Z right endpoint

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-exact-right-Z-endpoint.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-exact-right-Z-endpoint
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-exact-right-Z-endpoint-CI-inputs.json
  PHASE_MANIFEST_SHA: 95d5041f512518eaee2753c7c8bd3cbab65fa50f2bc9c3f3652c44e4f1cb432a
  PHASE_PIPELINE_SHA: 5364fd2156b81f5300f549dceaeab6a00f647728cb21729ad17d7c157618acb6
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-exact-right-Z-endpoint:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_exact_right_Z_endpoint_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-exact-right-Z-endpoint-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate only the exact last shard, direction, outer summary and consumer inputs
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_exact_right_Z_endpoint_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new endpoint source without running mathematics
        run: |
          python - <<'PY_SOURCE'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_exact_right_Z_endpoint.py','fourfold_codazzi_exact_right_Z_endpoint_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          PY_SOURCE
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5
      - name: Set the original artifact path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-exact-right-Z-endpoint-output" >> "$GITHUB_OUTPUT"
      - name: Evaluate the exact complete physical endpoint and publish the actual strip budgets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_exact_right_Z_endpoint_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-exact-right-Z-endpoint-science"
          --out-dir "$RUNNER_TEMP/visible-exact-exact-right-Z-endpoint-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-exact-right-Z-endpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
