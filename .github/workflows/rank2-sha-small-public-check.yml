name: Rank2 small exact public checks
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/rank2-sha-small-public-check.yml"
      - "topics/rank2-sha-infinitely-many-p/ci/small-check-request.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rank2-sha-small-public-check
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Execute named topic scripts and report hashes only
        shell: bash
        run: |
          set -euo pipefail
          RANK2_CHECK_DIR="$RUNNER_TEMP/rank2-small-exact"
          export RANK2_CHECK_DIR
          git -c maintenance.auto=false clone --filter=blob:none --sparse --depth=1 --no-checkout --branch main https://github.com/Rogerhu12/math-research-public.git "$RANK2_CHECK_DIR"
          git -C "$RANK2_CHECK_DIR" sparse-checkout set topics/rank2-sha-infinitely-many-p
          git -C "$RANK2_CHECK_DIR" fetch --filter=blob:none --depth=1 --quiet origin "$GITHUB_SHA"
          git -C "$RANK2_CHECK_DIR" checkout --detach --quiet "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["RANK2_CHECK_DIR"])
          prefix = "topics/rank2-sha-infinitely-many-p/"
          request = json.loads((root / (prefix + "ci/small-check-request.json")).read_text())
          records = []
          for item in request["checks"]:
              script = pathlib.PurePosixPath(item["script"])
              if ".." in script.parts or not str(script).startswith(prefix + "scripts/"):
                  raise RuntimeError("Check must name a topic script")
              engine = item["engine"]
              if engine not in {"node", "python3"}:
                  raise RuntimeError("Unsupported exact-check engine")
              args = item.get("args", [])
              if not isinstance(args, list) or not all(isinstance(x, str) for x in args):
                  raise RuntimeError("Invalid arguments")
              result = subprocess.run([engine, str(root / str(script)), *args], cwd=root, check=True, capture_output=True)
              digest = hashlib.sha256(result.stdout).hexdigest()
              if digest != item["expected_sha256"]:
                  raise RuntimeError("Output hash mismatch for " + str(script) + ": " + digest)
              records.append({"script": str(script), "args": args, "engine": engine, "sha256": digest, "stdout_bytes": len(result.stdout), "exit_code": result.returncode})
          print("RANK2_PUBLIC_EXACT_CHECK " + json.dumps({"request_id": request["request_id"], "run_id": int(os.environ["GITHUB_RUN_ID"]), "source_commit": os.environ["GITHUB_SHA"], "checks": records, "outputs_persisted": False}))
          PY
