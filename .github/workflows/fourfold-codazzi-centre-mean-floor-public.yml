name: R139 complete centre-mean necessary floor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-centre-mean-floor-public.yml

permissions:
  contents: write

concurrency:
  group: r139-w2c-centre-mean-floor-v1
  cancel-in-progress: false

jobs:
  complete-centre-mean-necessary-floor:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_collar_volterra_dual_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-20-centre-mean-floor-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install fixed directed runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Compute one complete signed centre-mean lower certificate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_collar_volterra_dual_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-20-centre-mean-floor-inputs.json --manifest-sha e08f68211772528adac26363757f43998328f3d2a7f9dbbcea5f59f4db86a7af
