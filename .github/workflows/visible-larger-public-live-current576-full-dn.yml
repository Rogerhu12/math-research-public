name: visible-larger live current576 actual-H FD and original full DN
'on':
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-native-live-full-dn-request.json
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  livecurrent576fulldn:
    name: One real native worker through current-H FD and the original full-DN audit
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: visible-larger-public-livecurrent576fulldn
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
      - name: Establish bounded source checkout and separate full output
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          mkdir -p "$RUNNER_TEMP/visible-live-full-dn/livecurrent576fulldn"
          echo "VISIBLE_OUT=$RUNNER_TEMP/visible-live-full-dn/livecurrent576fulldn" >> "$GITHUB_ENV"
          echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install the unchanged numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Bind real source and input SHAs, checking out only declared parent files
        run: |
          python - <<'PYPINS'
          import hashlib, json, os, re, subprocess
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          comp = Path(os.environ['VISIBLE_COMPUTATIONS'])
          out = Path(os.environ['VISIBLE_OUT'])
          request_raw = (comp/'public-native-live-full-dn-request.json').read_bytes()
          request = json.loads(request_raw)
          if (request.get('schema') != 'public-live-current576-full-DN-request-v1'
                  or request.get('repository') != 'Rogerhu12/math-research-public'
                  or request.get('lanes') != ['livecurrent576fulldn']):
              raise ValueError('Use this actual public live full-DN request')
          required = {
              'geometry_20261114_live_current576_full_dn.py',
              'geometry_20261114_current576_live_tail_client.py',
              'geometry_20261114_current576_live_tail_client_hook.mjs',
              'exact_20261114_live_current576_damped_system.py',
              'exact_20261114_live_current576_damped_chain_qr.py',
              'exact_20261114_native_damped_chain_qr.py',
              'exact_20261114_native_allrows_dyadic_residual.py',
              'geometry_20261114_native_captured_band_correction.py',
              'geometry_20261114_physical_test_full_dn.py',
              'geometry_20261114_physical_test_response.py',
              'geometry_20261114_physical_test_boundary.py',
              'geometry_20261114_physical_test_cut_audit.py',
              'geometry_20261114_full_dn_solve.py',
              'geometry_20261114_full_dn_response.py',
              'geometry_20261114_full_dn_augmented.py',
              'geometry_20261114_full_dn_boundary.py',
              'geometry_20261114_lifted_modes_full_dn.py',
              'geometry_20261114_lifted_modes_banded_full_dn.py',
              'geometry_20261114_banded_collocation.py',
              'exact_20261114_true_tail_client.py',
              'exact_20261114_seeded_zero_tail_client.py',
              'tail_frozen_worker.mjs', 'tail_resumable_engine.mjs',
              'exact_20261114_public_resume.py',
              'root_20261114_current576_rules_runner.py',
              'root_20261114_publish_actions.py',
          }
          pins = request.get('source_sha256')
          if not isinstance(pins, dict) or not required.issubset(pins):
              raise ValueError('Pin all actual current and original source bytes')
          sources = []
          for name, expected in pins.items():
              if Path(name).name != name or not re.fullmatch(r'[0-9a-f]{64}', str(expected)):
                  raise ValueError('Use source basenames and actual complete SHA256 values')
              raw = (comp/name).read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected:
                  raise ValueError('A requested source changed: '+name)
              if name.endswith('.py'):
                  compile(raw, name, 'exec')
              sources.append(dict(file=name, bytes=len(raw), sha256=expected))
          keys = ('accepted', 'warm', 'warm_status', 'port', 'tail_config', 'anchor_result')
          inputs = request['inputs']
          descriptors = [inputs[name] for name in keys] + inputs['anchor_files']
          if len(inputs['anchor_files']) != 8:
              raise ValueError('Bind all eight actually completed61 parent files')
          expected_anchor_names = {
              'result.json', 'current-solve-spec.json.gz', 'current-input-config.json',
              'native_0001.json.gz', 'native_intent.json', 'native_ready.json.gz',
              'native_capacity.json', 'original-live-identity-before-selected-seed.json'}
          if {PurePosixPath(v['file']).name for v in inputs['anchor_files']} != expected_anchor_names:
              raise ValueError('The completed61 parent inventory is incomplete')
          anchor_dir = PurePosixPath(inputs['anchor_result']['file']).parent
          if any(PurePosixPath(v['file']).parent != anchor_dir for v in inputs['anchor_files']):
              raise ValueError('All eight parent files must retain their original common directory')
          selected = {}
          for row in descriptors:
              name = row['file']
              relative = PurePosixPath(name)
              if (relative.is_absolute() or '..' in relative.parts
                      or not name.startswith('topics/visible-flex-larger-amplitude/')
                      or not re.fullmatch(r'[0-9a-f]{64}', str(row['sha256']))
                      or type(row['bytes']) is not int or row['bytes'] < 0):
                  raise ValueError('Use actual public topic files and their complete byte identities')
              if name in selected and selected[name] != row:
                  raise ValueError('One input path has conflicting declared identities')
              selected[name] = row
          subprocess.run(['git', 'sparse-checkout', 'add', '--no-cone', '--stdin'],
              input=''.join('/'+name+'\n' for name in selected), text=True, check=True)
          for name, row in selected.items():
              raw = (root/name).read_bytes()
              if len(raw) != row['bytes'] or hashlib.sha256(raw).hexdigest() != row['sha256']:
                  raise ValueError('Actual input bytes changed: '+name)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != os.environ['GITHUB_SHA']:
              raise ValueError('The numerical checkout must retain the triggering source commit')
          readmes = {name: subprocess.check_output(['git', 'rev-parse', 'HEAD:'+name], text=True).strip()
              for name in ('README.md', 'topics/visible-flex-larger-amplitude/README.md')}
          intent = dict(repository='Rogerhu12/math-research-public', lane='livecurrent576fulldn',
              source_commit=head, request_sha256=hashlib.sha256(request_raw).hexdigest(),
              request=request, verified_sources=sources, verified_actual_inputs=list(selected.values()),
              source_checkout_readme_blobs=readmes, scientific_execution_claimed=False,
              original_input_bytes_outside_output_tree=True,
              old_zero_H_FD_not_relabelled=True, imported_nonzero_response_cache=False)
          (out/'live-full-DN-request-identity.json').write_text(json.dumps(intent, indent=2)+'\n')
          print(json.dumps(dict(source_commit=head, sources=len(sources), actual_inputs=len(selected),
              Python_compiled_not_imported=True)), flush=True)
          PYPINS
      - name: Check the immutable native and live bridge syntax
        run: |
          node --check "$VISIBLE_COMPUTATIONS/geometry_20261114_current576_live_tail_client_hook.mjs"
          node --check "$VISIBLE_COMPUTATIONS/tail_frozen_worker.mjs"
          node --check "$VISIBLE_COMPUTATIONS/tail_resumable_engine.mjs"
          node --version
          python --version
      - name: Apply the declared multi-call storage plan without deleting scientific data
        run: |
          python - <<'PYSPACE'
          import json, os, shutil, subprocess
          from pathlib import Path
          out = Path(os.environ['VISIBLE_OUT'])
          request = json.loads((Path(os.environ['VISIBLE_COMPUTATIONS'])/'public-native-live-full-dn-request.json').read_text())
          plan = request['resource_plan']
          required = plan['minimum_free_bytes']
          if type(required) is not int or required <= 0:
              raise ValueError('Declare an actual multi-call resource plan, not a single-call capacity claim')
          before = shutil.disk_usage(out)._asdict()
          removed = []
          if before['free'] < required:
              for name in ('/usr/local/lib/android', '/usr/share/dotnet', '/opt/ghc'):
                  path = Path(name)
                  if path.exists() and path.is_dir() and not path.is_symlink():
                      subprocess.run(['sudo', 'rm', '-rf', '--', name], check=True)
                      removed.append(name)
          after = shutil.disk_usage(out)._asdict()
          record = dict(declared_plan=plan, before=before, after=after,
              unused_ephemeral_runner_SDKs_removed=removed,
              maximum_outer_iterations=request['runtime']['outer_iterations'],
              maximum_protocol_requests=3+2*request['runtime']['outer_iterations'],
              fixed_binary_bytes_per_native_correction=704385296,
              single_native_call_32GiB_not_claimed_as_total_budget=True,
              all_completed_and_partial_scientific_payloads_retained=True,
              no_original_iteration_or_tolerance_changed=True)
          (out/'runner-storage-reservation.json').write_text(json.dumps(record, indent=2)+'\n')
          print(json.dumps(record), flush=True)
          if after['free'] < required:
              raise RuntimeError('The declared full-DN resource plan exceeds this actual runner capacity')
          PYSPACE
      - name: Restore the exact public original78 source bundle
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYSOURCE' 2>&1 | tee "$VISIBLE_OUT/public-source-restore.log"
          import os
          from pathlib import Path
          from exact_20261114_public_resume import prepare_public_source
          source = prepare_public_source(Path.cwd(),
              Path(os.environ['RUNNER_TEMP'])/'live-full-DN-public-original-source',
              Path(os.environ['VISIBLE_OUT']))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
          PYSOURCE
      - name: Actual current H and J, original FD, same live full DN and final fresh audit
        id: original_full_dn
        timeout-minutes: 320
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u - <<'PYRUN' 2>&1 | tee "$VISIBLE_OUT/live-full-DN.log"
          import json, os, subprocess, sys
          from pathlib import Path
          comp = Path(os.environ['VISIBLE_COMPUTATIONS'])
          out = Path(os.environ['VISIBLE_OUT'])
          root = Path.cwd()
          request = json.loads((comp/'public-native-live-full-dn-request.json').read_text())
          inputs, runtime = request['inputs'], request['runtime']
          command = [sys.executable, '-u', str(comp/'geometry_20261114_live_current576_full_dn.py')]
          for key in ('accepted', 'warm', 'warm_status', 'port', 'tail_config', 'anchor_result'):
              command += ['--'+key.replace('_', '-'), str(root/inputs[key]['file'])]
          for key in ('warm', 'warm_status', 'anchor_result'):
              command += ['--'+key.replace('_', '-')+'-sha256', inputs[key]['sha256']]
          command += ['--tail-source-root', os.environ['VISIBLE_SOURCE_TOPIC'],
              '--out', str(out/'live-full-dn'), '--work',
              str(Path(os.environ['RUNNER_TEMP'])/'live-full-DN-prefix-work')]
          keys = ('node_heap', 'jac_workers', 'max_nodes', 'material_angles', 'physical_angles',
              'outer_iterations', 'extension_step', 'taper_fraction', 'native_eta',
              'native_exact_workers', 'native_max_factor_bytes')
          for key in keys:
              command += ['--'+key.replace('_', '-'), str(runtime[key])]
          wrapped = [sys.executable, '-u', str(comp/'root_20261114_current576_rules_runner.py'),
              '--out', str(out/'rule-sync'), '--command', *command]
          raise SystemExit(subprocess.call(wrapped))
          PYRUN
      - name: Preserve every real request, snapshot, factor, failure and original full-DN report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-mainline-livecurrent576fulldn-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visible-live-full-dn/livecurrent576fulldn/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded actual records with ordinary rebase and README checks
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u "$VISIBLE_COMPUTATIONS/root_20261114_publish_actions.py" \
            --results "$VISIBLE_OUT" --lane livecurrent576fulldn
