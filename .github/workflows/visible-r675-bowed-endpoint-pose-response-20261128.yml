name: visible-flex bowed endpoint pose response
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r675-bowed-endpoint-pose-response-20261128.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r675-bowed-endpoint-pose-response-20261128
  cancel-in-progress: false
jobs:
  research:
    name: Complete Cartesian response of the fixed bowed endpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/visible-r675-bowed-endpoint-pose-response-20261128.yml
            /README.md
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r675-bowed-endpoint-pose-response-20261128.json
            /topics/visible-flex-new-mechanism/scripts/r675_bowed_endpoint_pose_response_20261128.py
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/computations/r675-bowed-endpoint-pose-response-20261128.json
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r675-bowed-endpoint-pose-response-scope.md
            /topics/visible-flex-new-mechanism/results/R675-central-bending-moment-for-an-infinitesimal-bowed-endpoint-tilt.md
            /topics/visible-flex-new-mechanism/results/R673-thick-bowed-tilted-endpoint-metric-with-strict-intrinsic-chord-slack.md
            /topics/visible-flex-new-mechanism/results/R671-saturated-material-meridian-and-discrete-twist-of-the-exact-endpoint-metric.md
            /topics/visible-flex-new-mechanism/results/R667-actual-thick-finite-tilt-family-and-sharp-remaining-metric-error.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull current rules and evaluate the new finite input
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r675-bowed-endpoint-pose-response-20261128.json
          --lane bowed-endpoint-pose
