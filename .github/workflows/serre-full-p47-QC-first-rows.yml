name: Serre full p47 actual QC first rows

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/full-p47-QC-first-rows-request.json

permissions:
  contents: read

concurrency:
  group: serre-full-p47-QC-first-rows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_QC_first_rows:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/results/R1096-certified-original-CM-moving-units-and-odd-Hecke-height-basis.md
            /topics/serre-uniformity/scripts/full_p47_weight_one_Hodge_certificate.py
            /topics/serre-uniformity/notes/full-p47-CM-height-move-request.json
            /topics/serre-uniformity/scripts/full_p47_small_odd_Hecke_basis.py
            /topics/serre-uniformity/notes/2026-11-27-full-p47-small-odd-Hecke-basis-method.md
            /topics/serre-uniformity/scripts/full_p47_eight_CM_tangents.py
            /topics/serre-uniformity/scripts/original_p47_ell4513_cuspidal_transfer.py
            /topics/serre-uniformity/scripts/original_p47_cuspidal_disks.py
            /topics/serre-uniformity/notes/original-p47-ell4513-cuspidal-transfer-request.json
            /topics/serre-uniformity/results/R1078-original-level47-Cartan-correspondences-and-fixed-cycles.md
            /topics/serre-uniformity/results/R1087-original-principal-Cartan-ideal-and-cusp-annihilating-correspondence.md
            /topics/serre-uniformity/results/R1105-certified-original-eight-CM-tangents.md
            /topics/serre-uniformity/scripts/full_p47_original_angle_Hodge_action.py
            /topics/serre-uniformity/notes/2026-11-27-full-p47-original-angle-Hodge-method.md
            /topics/serre-uniformity/notes/full-p47-small-odd-Hecke-basis-request.json
            /topics/serre-uniformity/notes/full-p47-original-angle-Hodge-request.json
            /topics/serre-uniformity/scripts/full_p47_Gaussian_CM_log.py
            /topics/serre-uniformity/scripts/full_p47_QC_first_rows.py
            /topics/serre-uniformity/notes/2026-11-27-full-p47-QC-first-rows-method.md
            /topics/serre-uniformity/results/R1102-certified-original-level47-complete-first-global-height.md
            /topics/serre-uniformity/results/R1103-original-CM-tangents-finite-field-third-kind-and-QC-first-jets.md
            /topics/serre-uniformity/results/R1108-original-CM-first-log-mod-q2-and-finite-residue-algebra.md
            /topics/serre-uniformity/results/R1119-original-signed-CM-coordinates-and-Jacobi-reading.md
            /topics/serre-uniformity/results/R1118-original-short-Cartier-reading-for-CM-third-kind-values.md
            /topics/serre-uniformity/scripts/full_p47_short_Cartier_third_kind.py
            /topics/serre-uniformity/scripts/full_p47_Cartier_support.py
            /topics/serre-uniformity/notes/2026-11-27-full-p47-short-Cartier-third-kind-method.md
            /topics/serre-uniformity/notes/full-p47-short-Cartier-third-kind-request.json
            /topics/serre-uniformity/results/R1120-certified-original-full47-signed-CM-coordinates.md
            /topics/serre-uniformity/results/R1121-certified-original-twelve-short-Cartier-values.md
            /topics/serre-uniformity/notes/full-p47-QC-first-rows-request.json
      - name: Pull pinned official SageMath 10.6 image
        run: docker pull sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      - name: Read requested full original QC rows
        env:
          SERRE_EXPECTED_REQUEST_SHA256: '95e8ccb0bd7906f1c0c47fbebc794c77994b3fd5cba58766d31fbc53ac3dbc0b'
        run: |
          timeout --signal=TERM --kill-after=30s 2700s docker run --rm --cpus=4 --memory=14g \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work,readonly" \
            --workdir /work \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SHA \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e SERRE_EXPECTED_REQUEST_SHA256 \
            -e PYTHONUNBUFFERED=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879 \
            /bin/bash -lc '
              set -e
              sage -pip install --user --no-cache-dir python-flint==0.9.0
              exec sage -python topics/serre-uniformity/scripts/full_p47_QC_first_rows.py
            '
