name: Serre p41 original inverse-free Laurent prefix

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R781-public-Laurent-prefix-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R781-original-Laurent-prefix
  cancel-in-progress: false

jobs:
  exact_laurent:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-inverse-free-Laurent-prefix.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R781_original_Laurent_prefix.py
            /topics/serre-uniformity/scripts/R781_public_Laurent_prefix.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R781-public-Laurent-prefix-request.json
            /topics/serre-uniformity/notes/2026-11-15-exact-height-research.md
            /topics/serre-uniformity/results/R781-original-tangent-descent-and-inverse-free-Laurent-relations.md
            /topics/serre-uniformity/results/R778-original-cusp-orbit-and-short-exact-recovery.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compute original exact Laurent coefficients
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R781_public_Laurent_prefix.py compute
      - name: Transfer active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R781-original-p41-inverse-free-Laurent-prefix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R781-original-p41-inverse-free-Laurent-prefix/output
          retention-days: 1
          if-no-files-found: warn
      - name: Publish only script parameters run and output hashes
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R781_public_Laurent_prefix.py publish
      - name: Require exact original Laurent certificate
        if: always()
        run: python topics/serre-uniformity/scripts/R781_public_Laurent_prefix.py verify
