name: Serre R787 direct two-probe projective reconstruction

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R787_projective_two_probe-public-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R787-projective-two-probe-reconstruction
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R805_public_success_io_audit.py
            /topics/serre-uniformity/notes/R787_projective_two_probe-public-request.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actually pull main and compare both rule files with the read commit
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          path = Path("topics/serre-uniformity/scripts/R805_public_success_io_audit.py")
          assert hashlib.sha256(path.read_bytes()).hexdigest() == "5ae35d0c86b20a8b6234f3aac6059c6567cfbea73ed6f835d74f15ba48360e4f"
          spec = importlib.util.spec_from_file_location("R787_projective_rules_pull", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          request = json.loads(Path("topics/serre-uniformity/notes/R787_projective_two_probe-public-request.json").read_text())
          root = Path(os.environ["RUNNER_TEMP"])/"serre-R787-projective-two-probe-rules-pull"
          (root/"audit-output").mkdir(parents=True, exist_ok=True)
          module.pull_and_compare(root, request["rules_last_read_commit"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-R787-projective-two-probe-rules-pull-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-R787-projective-two-probe-rules-pull/audit-output
          retention-days: 1
          if-no-files-found: warn

  reconstruct:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-R787_projective_two_probe.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R787_projective_two_probe_reconstruction.py
            /topics/serre-uniformity/scripts/R787_projective_two_probe_public.py
            /topics/serre-uniformity/scripts/R781_original_Laurent_prefix.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/notes/R787_projective_two_probe-public-request.json
            /topics/serre-uniformity/notes/R787-original-projective-two-probe-reconstruction-method.md
            /topics/serre-uniformity/notes/R787-original-power5-relation-solver-method.md
            /topics/serre-uniformity/results/R786-original-power5-sections-and-129-Laurent-recovery.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse all executable sources without importing the mathematical core
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path("topics/serre-uniformity/scripts")
          for name in ("R787_projective_two_probe_reconstruction.py", "R787_projective_two_probe_public.py",
                       "R781_original_Laurent_prefix.py",
                       "R824_public_original_global_polar_generators.py"):
              path = root/name
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print("AST_OK", name)
          PY
      - name: Install the pinned exact arithmetic library
        run: python -m pip install python-flint==0.9.0
      - name: Test all retained two-probe rows using the original exact 129-order relation
        continue-on-error: true
        timeout-minutes: 335
        run: python topics/serre-uniformity/scripts/R787_projective_two_probe_public.py compute
      - name: Transfer only the active exact stages and minimal source carrier
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R787-projective-two-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R787-projective-two-probe/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
      - name: Verify complete source and output bytes and the original relation interface
        if: always()
        run: python topics/serre-uniformity/scripts/R787_projective_two_probe_public.py verify
