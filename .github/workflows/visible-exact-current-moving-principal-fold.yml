name: visible-exact actual full-family analytic moving principal fold

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-current-moving-principal-fold.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-current-moving-principal-fold
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-current-moving-principal-fold-CI-inputs.json
  PHASE_MANIFEST_SHA: 77e9457a7d2fed523c47e8e7f67d51fc5e14ade859c4c42abad3bdfd46f5962f
  PHASE_PIPELINE_SHA: 383a1d9cfeabdb08151d3e2e7eae980a2f998294f3c857fd7c13b86adf127991
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-actual-moving-principal-fold:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_current_moving_principal_fold_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-current-moving-principal-fold-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate the ten exact completed root and proof inputs
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_current_moving_principal_fold_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Set the original artifact path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-current-moving-principal-fold-output" >> "$GITHUB_OUTPUT"
      - name: Compute only the full-family principal-fold domain budgets and publish the outcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_current_moving_principal_fold_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-current-moving-principal-fold-science"
          --out-dir "$RUNNER_TEMP/visible-exact-current-moving-principal-fold-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-current-moving-principal-fold-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
