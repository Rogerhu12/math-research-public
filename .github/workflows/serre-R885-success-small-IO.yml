name: R885 completed producer small IO
on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R885-success-small-IO-request.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: serre-R885-success-small-IO-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      active: ${{ steps.rules.outputs.active }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/notes/R885-success-small-IO-request.json
      - name: Read actual main rules and perform git pull
        id: rules
        shell: bash
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess
          request=pathlib.Path("topics/serre-uniformity/notes/R885-success-small-IO-request.json")
          data=json.loads(request.read_text());job=data.get("job",data)
          active=job["producer_inputs_pending"] is False
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("active="+str(active).lower()+"\n")
          if not active:
              raise SystemExit(0)
          root=pathlib.Path.cwd()
          paths={"root":"README.md","topic":"topics/serre-uniformity/README.md"}
          subprocess.run(["git","config","user.name","github-actions[bot]"],check=True)
          subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=True)
          subprocess.run(["git","fetch","--filter=blob:none","origin","main"],check=True)
          head0=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          subprocess.run(["git","checkout","-B","R885-rules-current"],check=True)
          subprocess.run(["git","pull","--rebase","origin","main"],check=True)
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          hashes={k:hashlib.sha256((root/p).read_bytes()).hexdigest() for k,p in paths.items()}
          changed=[k for k in paths if hashes[k]!=job["readme_sha256"][k]]
          if changed:
              old=job["rules_last_read_commit"]
              subprocess.run(["git","fetch","--filter=blob:none","--depth=1","origin",old],check=True)
              subprocess.run(["git","diff",old,head,"--",*paths.values()],check=True)
          receipt={"result":"R885-rules-pull","actual_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   "checkout_head":head0,"actual_main_head":head,"last_previously_read_commit":job["rules_last_read_commit"],
                   "actual_readme_sha256":hashes,"changed_readmes":changed,"actual_git_pull_rebase_performed":True}
          pathlib.Path("/tmp/R885-rules-pull-receipt.json").write_text(json.dumps(receipt,sort_keys=True)+"\n")
          print("R885_RULES_PULL="+json.dumps(receipt,sort_keys=True))
          assert not changed,"README changed; consume new actual rules before mathematical execution."
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-R885-rules-pull-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/R885-rules-pull-receipt.json
          retention-days: 1
          if-no-files-found: ignore
  compute:
    needs: rules
    if: needs.rules.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      PYTHONINTMAXSTRDIGITS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/
            /.github/workflows/serre-R885-success-small-IO.yml
      - name: Parse the frozen reader and read only existing completed bytes
        run: |
          python - <<'PY'
          import ast, hashlib, json, pathlib
          base=pathlib.Path("topics/serre-uniformity")
          data=json.loads((base/"notes/R885-success-small-IO-request.json").read_text())
          path=base/"scripts"/data["script"]
          raw=path.read_bytes();ast.parse(raw)
          assert hashlib.sha256(raw).hexdigest()==data["script_sha256"]
          print("Pure IO reader AST/SHA; no mathematical core import.")
          PY
          python topics/serre-uniformity/scripts/R885_success_small_IO.py --request topics/serre-uniformity/notes/R885-success-small-IO-request.json --output /tmp/R885-small-IO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-R885-success-small-IO-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/R885-small-IO/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
