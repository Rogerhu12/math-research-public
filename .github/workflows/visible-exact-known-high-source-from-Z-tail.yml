name: visible-exact complete known high source from Z tail

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_known_high_source_from_Z_tail.py'
      - 'topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_known_high_source_from_Z_tail_CI.py'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-14-R133-known-high-source-from-Z-tail-contract.md'
      - 'topics/visible-flex-exact-nearby/notes/2026-11-14-R133-known-high-source-from-Z-tail-CI-inputs.json'
      - '.github/workflows/visible-exact-known-high-source-from-Z-tail.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-known-high-source-from-Z-tail
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  HIGH_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-known-high-source-from-Z-tail-CI-inputs.json
  HIGH_MANIFEST_SHA: de4bd52b27daceb5b3ea85a79c2ba37dd01196143384ffc72d0946dc6826a759
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  known-high:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 55
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out exact sources and reviewed rules
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-known-high-source-from-Z-tail-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate unchanged scientific inputs and only this consumer's actual prefixes
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$HIGH_MANIFEST" --manifest-sha "$HIGH_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/known_high_Z_tail_source_ci/
      - name: Parse the new sources before any mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_known_high_source_from_Z_tail.py','fourfold_codazzi_known_high_source_from_Z_tail_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('New source and worker parsed; no target or mathematical consumer has run.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set actual container-visible input and output paths
        id: paths
        run: |
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-known-high-prepared" >> "$GITHUB_OUTPUT"
          printf 'rows=%s\n' "$RUNNER_TEMP/visible-exact-known-high-original-rows" >> "$GITHUB_OUTPUT"
          printf 'repair=%s\n' "$RUNNER_TEMP/visible-exact-known-high-repair" >> "$GITHUB_OUTPUT"
          printf 'mixed=%s\n' "$RUNNER_TEMP/visible-exact-known-high-mixed" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-known-high-output" >> "$GITHUB_OUTPUT"
      - name: Receive the exact original prepared cubics without reconstruction
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43583838026
          name: visible-exact-body-prepared-43583838026-1
          path: ${{ steps.paths.outputs.prepared }}
      - name: Receive all eight actual original complete body row artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43583838026
          pattern: visible-exact-body-rows-*-43583838026-1
          merge-multiple: false
          path: ${{ steps.paths.outputs.rows }}
      - name: Receive the original complete centre repair source receipt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43597921732
          name: visible-exact-complete-response-repair-source-43597921732-1
          path: ${{ steps.paths.outputs.repair }}
      - name: Receive the actual complete continuous Z source cover
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43613560173
          name: visible-exact-complete-Z-v2-finish-43613560173-1
          path: ${{ steps.paths.outputs.mixed }}
      - name: Consume the exact Z tail and preserve all original low and mean sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_known_high_source_from_Z_tail_CI.py
          --manifest "$HIGH_MANIFEST" --manifest-sha "$HIGH_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --prepared "$RUNNER_TEMP/visible-exact-known-high-prepared"
          --previous-artifacts "$RUNNER_TEMP/visible-exact-known-high-original-rows"
          --repair-artifact "$RUNNER_TEMP/visible-exact-known-high-repair"
          --mixed-artifact "$RUNNER_TEMP/visible-exact-known-high-mixed"
          --work "$RUNNER_TEMP/visible-exact-known-high-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-known-high-output"
          --compute-minutes 35 --checkpoint-minutes 10
      - name: Require nonempty actual evidence and a small inventory
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          data=(json.dumps(entries,indent=2)+'\n').encode()
          if len(data)>60000:raise RuntimeError('inventory exceeds60000 bytes; retain full original evidence')
          (root/'artifact-inventory.json').write_bytes(data)
          print(dict(actual_files=len(files),actual_inventory_bytes=len(data)))
          PY_INVENTORY
      - name: Preserve the complete native and every actual failure prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-complete-known-high-Z-tail-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
