name: visible-exact complete known response boundary sources

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-known-response-boundaries.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-known-response-boundaries
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  BOUNDARY_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-known-response-boundary-CI-inputs.json
  BOUNDARY_MANIFEST_SHA: baebd3764b9a1f013f1b6cf89df5864e2fbe850ceb99510a8efe0460b0aa6f85
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  complete-known-boundary-sources:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out immutable original inputs and the new boundary source
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-known-response-boundary-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate the exact full trial inputs and new complete boundary consumer
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$BOUNDARY_MANIFEST" --manifest-sha "$BOUNDARY_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/known_response_boundary_ci/
      - name: Check both new Python source files without running mathematics
        run: |
          python - <<'PY_AST'
          import ast,pathlib
          root=pathlib.Path('topics/visible-flex-exact-nearby/scripts')
          for name in ('fourfold_codazzi_known_response_true_boundary_sources.py','fourfold_codazzi_known_boundary_source_CI.py'):
              ast.parse((root/name).read_text(),filename=name)
          print('Both new complete boundary-source files passed Python AST parsing.')
          PY_AST
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible original artifact and actual output paths
        id: paths
        run: |
          printf 'prepared=%s\n' "$RUNNER_TEMP/visible-exact-boundary-original-prepared" >> "$GITHUB_OUTPUT"
          printf 'body=%s\n' "$RUNNER_TEMP/visible-exact-boundary-original-body" >> "$GITHUB_OUTPUT"
          printf 'cap=%s\n' "$RUNNER_TEMP/visible-exact-boundary-original-cap-cut" >> "$GITHUB_OUTPUT"
          printf 'weighted=%s\n' "$RUNNER_TEMP/visible-exact-boundary-original-weighted" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-known-boundary-output" >> "$GITHUB_OUTPUT"
      - name: Reuse the original prepared full physical cubics without reconstruction
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43583838026
          name: visible-exact-body-prepared-43583838026-1
          path: ${{ steps.paths.outputs.prepared }}
      - name: Receive the actual complete original scalar mean correction
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43586413510
          name: visible-exact-body-complete-mean-43586413510-1
          path: ${{ steps.paths.outputs.body }}
      - name: Receive the successful full cap-cut low mean and high certificate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43587619797
          name: visible-exact-complete-cap-cut-43587619797-1
          path: ${{ steps.paths.outputs.cap }}
      - name: Receive the actual weighted boundary prepare result
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43594139132
          name: visible-exact-cut-projector-prepared-43594139132-1
          path: ${{ steps.paths.outputs.weighted }}
      - name: Pay the complete actual boundary sources with real README checkpoints
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_known_boundary_source_CI.py
          --manifest "$BOUNDARY_MANIFEST" --manifest-sha "$BOUNDARY_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --prepared "$RUNNER_TEMP/visible-exact-boundary-original-prepared"
          --body-artifact "$RUNNER_TEMP/visible-exact-boundary-original-body"
          --cap-cut-artifact "$RUNNER_TEMP/visible-exact-boundary-original-cap-cut"
          --weighted-artifact "$RUNNER_TEMP/visible-exact-boundary-original-weighted"
          --work "$RUNNER_TEMP/visible-exact-known-boundary-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-known-boundary-output"
          --compute-minutes 20 --checkpoint-minutes 10
      - name: Require actual nonempty evidence before artifact publication
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process evidence exists')
          entries=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          (root/'artifact-inventory.json').write_text(json.dumps(entries,indent=2)+'\n')
          print(dict(actual_files=len(files),nonempty_output_verified=True))
          PY_INVENTORY
      - name: Preserve the actual complete result and every failed prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-known-response-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
