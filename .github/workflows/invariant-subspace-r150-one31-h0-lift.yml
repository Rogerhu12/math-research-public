name: ISP R150 original31h0 one-denominator lift modulo29791

on:
  push:
    branches: [main]
    paths:
      - topics/invariant-subspace-problem/notes/2026-11-14-r150-one31-h0-lift-ci-request-789f.json

permissions:
  contents: write
  actions: read

concurrency:
  group: isp-r150-one31-h0-lift-789f
  cancel-in-progress: false

jobs:
  original31h0:
    if: github.repository == 'Rogerhu12/math-research-public'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            topics/invariant-subspace-problem
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record original31h0 request, frozen source and both rules
        run: |
          python3 - <<'PYCODE'
          import ast,hashlib,json,os,sys
          from pathlib import Path
          sys.dont_write_bytecode=True
          notes=Path('topics/invariant-subspace-problem/notes')
          out=Path(os.environ['RUNNER_TEMP'])/'isp-r150-one31-h0-output'
          (out/'results').mkdir(parents=True,exist_ok=True)
          (out/'recovery').mkdir(exist_ok=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('ISP_PH0_OUT='+str(out)+'\n')
          request_path=notes/'2026-11-14-r150-one31-h0-lift-ci-request-789f.json'
          request=json.loads(request_path.read_text())
          expected={'actual_targets':9,'original_raw_rows':6188,'integer_modulus':29791,'target_multiplier':'31*h0','rational_h0_denominator_exponent':1,'selector_seconds':20,'shared_mathematical_seconds':120,'per_child_memory_mib':512,'per_compilation_seconds':30,'t96_run_id':43597823809,'t96_artifact_id':14114364261,'all198_run_id':43619888599,'all198_artifact_id':14124017685,'original_right_hand_side_cost_bound':87,'temporary_source_cost_bound':183,'characteristic_zero_identity_asserted':False,'old198_and_selected_sources_recomputed':False}
          if any(request.get(k)!=v for k,v in expected.items()):
              raise SystemExit('Original31h0 bounded request changed')
          rules={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in ['README.md','topics/invariant-subspace-problem/README.md']}
          if rules!=request['rules_sha256']:
              raise SystemExit('README changed: root must read and apply the actual diff before this request runs')
          manifest_path=notes/request['source_manifest_file']
          if hashlib.sha256(manifest_path.read_bytes()).hexdigest()!=request['source_manifest_sha256']:
              raise SystemExit('Original31h0 frozen source manifest changed')
          manifest=json.loads(manifest_path.read_text())
          for item in manifest['files']:
              data=(notes/item['file']).read_bytes()
              if len(data)!=item['bytes'] or hashlib.sha256(data).hexdigest()!=item['sha256']:
                  raise SystemExit('Frozen original31h0 file changed: '+item['file'])
          for name,expected_sha in manifest['dependencies'].items():
              if hashlib.sha256((notes/name).read_bytes()).hexdigest()!=expected_sha:
                  raise SystemExit('Frozen original source dependency changed: '+name)
          for name,expected_sha in request['workflow_source_sha256'].items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest()!=expected_sha:
                  raise SystemExit('Frozen workflow, selector or publication source changed: '+name)
          syntax=[]
          for name in [request['runner_file'],request['selector_file'],request['publication_helper_file']]:
              ast.parse((notes/name).read_text(),filename=name)
              syntax.append(name)
          result={'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'rules_sha256':rules,'request':request,'request_sha256':hashlib.sha256(request_path.read_bytes()).hexdigest(),'source_manifest_sha256':request['source_manifest_sha256'],'actualPythonSyntaxFilesParsed':syntax,'allOriginalSourceHashesVerified':True,'target_multiplier':'31*h0','noMathematicalCompletionClaimed':True}
          (out/'results'/'actions-source.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(expected))
          PYCODE
      - name: Restore the already completed original T96 graph and DAGs
        uses: actions/download-artifact@v4
        with:
          name: isp-r150-t96-graph-recovery-43597823809-1
          run-id: 43597823809
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/isp-r150-one31-h0-t96-download
      - name: Restore the already completed all198 original sources and global arrays
        uses: actions/download-artifact@v4
        with:
          name: isp-r150-all198-second-bockstein-recovery-43619888599-1
          run-id: 43619888599
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/isp-r150-one31-h0-all198-download
      - name: Retain only the exact five T96 and sixteen all198 input paths
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,shutil
          from pathlib import Path
          notes=Path('topics/invariant-subspace-problem/notes')
          contract=json.loads((notes/'2026-11-14-r150-one31-h0-lift-input-contract-789f.json').read_text())
          temp=Path(os.environ['RUNNER_TEMP'])
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1048576),b''):h.update(b)
              return h.hexdigest()
          records=[]
          for scope in ['t96','all198']:
              original=temp/('isp-r150-one31-h0-'+scope+'-download')
              selected=temp/('isp-r150-one31-h0-'+scope+'-input')
              selected.mkdir(parents=True,exist_ok=True)
              for label,item in contract['inputs'].items():
                  if item['scope']!=scope:continue
                  candidates=[original/item['relative']] if 'relative' in item else sorted({p for name in item['names'] for p in original.rglob(name)})
                  actual=next((p for p in candidates if p.is_file() and sha(p)==item['sha256']),None)
                  if actual is None:raise SystemExit('Actual saved input absent or SHA mismatch: '+label)
                  relative=Path(item['relative']) if 'relative' in item else Path(actual.name)
                  destination=selected/relative
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  try:os.link(actual,destination)
                  except OSError:shutil.copyfile(actual,destination)
                  records.append({'label':label,'scope':scope,'restoredArtifactPath':str(actual.relative_to(original)),'selectedPath':str(relative),'bytes':actual.stat().st_size,'sha256':item['sha256']})
              with open(os.environ['GITHUB_ENV'],'a') as f:
                  f.write(('ISP_PH0_T96' if scope=='t96' else 'ISP_PH0_ALL198')+'='+str(selected)+'\n')
          out=Path(os.environ['ISP_PH0_OUT'])/'results'
          (out/'actual-restored-inputs.json').write_text(json.dumps({'format':'r150-one31-h0-selective-recovery-v1','downloadsUsedOnlyT96AndAll198':True,'allSelectedHashesVerified':True,'inputs':records},indent=2)+'\n')
          print(json.dumps({'selectedFiles':len(records),'selectedBytes':sum(x['bytes'] for x in records)}))
          PYCODE
      - name: Install the exact small-selector dependency and record compiler
        run: |
          python3 -m pip install python-flint==0.9.0
          python3 -m pip show python-flint > "$ISP_PH0_OUT/results/python-flint-version.txt"
          g++ --version > "$ISP_PH0_OUT/results/compiler-version.txt"
      - name: Rebuild the lost constant payload and a truthful new receipt
        id: selector
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -o pipefail
          mkdir -p "$ISP_PH0_OUT/results/rebuilt-selector"
          timeout --kill-after=10s 20s prlimit --as=536870912 --core=0 -- \
            python3 topics/invariant-subspace-problem/notes/2026-11-14-r150-first-residual-in-second-saturation-789f.py \
            --notes-root topics/invariant-subspace-problem/notes \
            --all198-recovery "$ISP_PH0_ALL198" \
            --out "$ISP_PH0_OUT/results/rebuilt-selector" \
            2>&1 | tee "$ISP_PH0_OUT/results/selector-console.log"
          python3 - <<'PYCODE'
          import gzip,hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['ISP_PH0_OUT'])/'results'
          root=out/'rebuilt-selector'
          receipt=json.loads((root/'first-residual-in-actual-second-saturation-receipt.json').read_text())
          compressed=(root/'first-residual-in-actual-second-saturation.bin.gz').read_bytes()
          payload=gzip.decompress(compressed)
          old_plain='2d90d72ac72cc63e5531b80a6e788ef82c6bf794481b53546b27b0afcb7134ee'
          old_gzip='29583cf3f52bb3e78393bd483d80cf7fe5947199a09a4adc87a1ceee88857043'
          valid=receipt.get('status')=='completed' and receipt.get('complete315ConstantIdentityVerified') is True and receipt.get('usesPrimaryProjection') is False and len(payload)==10040 and hashlib.sha256(payload).hexdigest()==old_plain
          result={'actualNewEnvironmentReceipt':True,'old8093ByteReceiptClaimedRecovered':False,'full315PayloadMatchesOriginalSHA':valid,'actualCompressedBytes':len(compressed),'actualCompressedSHA256':hashlib.sha256(compressed).hexdigest(),'exactOldCompressedBytesRecovered':hashlib.sha256(compressed).hexdigest()==old_gzip,'actualSelectorElapsedSeconds':receipt.get('elapsedSeconds'),'actualNewReceiptSHA256':hashlib.sha256((root/'first-residual-in-actual-second-saturation-receipt.json').read_bytes()).hexdigest()}
          (out/'selector-reconstruction.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          if not valid:raise SystemExit('Actual rebuilt full315 payload failed')
          PYCODE
      - name: Execute original31h0 with one shared120-second mathematical clock
        id: exact
        if: steps.selector.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          python3 topics/invariant-subspace-problem/notes/2026-11-14-r150-one31-h0-lift-runner-789f.py \
            --notes-root topics/invariant-subspace-problem/notes \
            --t96-recovery "$ISP_PH0_T96" \
            --all198-recovery "$ISP_PH0_ALL198" \
            --out "$ISP_PH0_OUT" \
            --math-seconds 120 --memory-mib 512 --compile-seconds 30 \
            2>&1 | tee "$ISP_PH0_OUT/results/actions-console.log"
      - name: Record the actual full original31h0 outcome
        if: always() && env.ISP_PH0_OUT != ''
        env:
          ISP_SELECTOR_OUTCOME: ${{ steps.selector.outcome }}
          ISP_EXACT_OUTCOME: ${{ steps.exact.outcome }}
        run: |
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          out=Path(os.environ['ISP_PH0_OUT'])/'results'
          p=out/'one31-h0-second-lift-pipeline-receipt.json'
          r=json.loads(p.read_text()) if p.exists() else {}
          s=out/'selector-reconstruction.json'
          selector=json.loads(s.read_text()) if s.exists() else {}
          complete=os.environ.get('ISP_SELECTOR_OUTCOME')=='success' and selector.get('full315PayloadMatchesOriginalSHA') is True and os.environ.get('ISP_EXACT_OUTCOME')=='success' and r.get('status')=='completed' and r.get('outcome')=='one31-denominator-h0-full-original-mod29791-certificate' and all(r.get(k) is True for k in ['fullOriginalTarget31h0Mod29791IdentityVerified','fullOriginalMod29791IdentityVerified','finite_budget_verified','originalh0SourceHas31DenominatorExponentAtMostOne'])
          result={'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'source_commit':os.environ['GITHUB_SHA'],'selector_step_outcome':os.environ.get('ISP_SELECTOR_OUTCOME'),'native_step_outcome':os.environ.get('ISP_EXACT_OUTCOME'),'pipeline_status':r.get('status','not-started'),'outcome':r.get('outcome'),'complete':complete,'original_target':'31*h0*T modulo29791','H0_target_claimed':False,'rational_h0_precision_after_dividing31':961,'actual_source_costs':r.get('actualSourceCosts'),'mathematical_elapsed_seconds':r.get('mathematicalElapsedSeconds'),'characteristic_zero_identity_asserted':False,'partialCheckpointIsNotIdentity':True,'rootOwnsSharedResearchIndices':True}
          (out/'actions-outcome.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always() && env.ISP_PH0_OUT != ''
        with:
          name: isp-r150-one31-h0-results-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ env.ISP_PH0_OUT }}/results
      - uses: actions/upload-artifact@v4
        if: always() && env.ISP_PH0_OUT != ''
        with:
          name: isp-r150-one31-h0-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          compression-level: 1
          if-no-files-found: warn
          path: ${{ env.ISP_PH0_OUT }}/recovery
      - name: Save only this actual result directory with real pull and README checks
        id: publication
        if: always() && env.ISP_PH0_OUT != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 topics/invariant-subspace-problem/notes/2026-11-14-r150-one31-h0-actions-publish-789f.py \
            --checkout "$GITHUB_WORKSPACE" \
            --results "$ISP_PH0_OUT/results" \
            --work "$RUNNER_TEMP/isp-r150-one31-h0-publication"
      - uses: actions/upload-artifact@v4
        if: always() && env.ISP_PH0_OUT != ''
        with:
          name: isp-r150-one31-h0-publication-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ env.ISP_PH0_OUT }}/results/publication
      - name: Require the actual nine-target original31h0 identity
        if: always() && env.ISP_PH0_OUT != ''
        run: |
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          p=Path(os.environ['ISP_PH0_OUT'])/'results'/'actions-outcome.json'
          r=json.loads(p.read_text()) if p.exists() else {}
          if r.get('complete') is not True:
              raise SystemExit('Original31h0 task incomplete; truthful results and full actual checkpoints retained')
          PYCODE
