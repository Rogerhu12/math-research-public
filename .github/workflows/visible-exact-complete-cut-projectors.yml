name: visible-exact complete 5970 continuous projector cells

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-complete-cut-projectors.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-complete-cut-projectors
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  FULL_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-cut-projector-CI-pinned-inputs.json
  FULL_MANIFEST_SHA: 394379df4a2588ad53a85ed91438874a34f30473a746b85cd8db3e83edfcdbf5
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  prepare:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 60
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the immutable original scientific closure
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-complete-cut-projector-CI-pinned-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate and verify every original dependency without full repository data
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$FULL_MANIFEST" --manifest-sha "$FULL_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/regular_cut_validator_ci/
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible exact artifact paths
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-complete-projector-prepare" >> "$GITHUB_OUTPUT"
          printf 'original=%s\n' "$RUNNER_TEMP/visible-exact-original-cut-frames" >> "$GITHUB_OUTPUT"
          printf 'pilot=%s\n' "$RUNNER_TEMP/visible-exact-original-projector-pilot" >> "$GITHUB_OUTPUT"
          printf 'capcut=%s\n' "$RUNNER_TEMP/visible-exact-original-cap-cut" >> "$GITHUB_OUTPUT"
          printf 'slices=%s\n' "$RUNNER_TEMP/visible-exact-complete-projector-frame-slices" >> "$GITHUB_OUTPUT"
      - name: Receive all original frames once without recomputing them
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43588509643
          name: visible-exact-cut-head-proposal-43588509643-1
          path: ${{ steps.paths.outputs.original }}
      - name: Reuse all four actual successful continuous cells
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43591378059
          name: visible-exact-cut-projector-pilot-43591378059-1
          path: ${{ steps.paths.outputs.pilot }}
      - name: Receive the actual fourteen-gate complete cap cut
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: 43587619797
          name: visible-exact-complete-cap-cut-43587619797-1
          path: ${{ steps.paths.outputs.capcut }}
      - name: Verify true weighted boundaries and package unchanged disjoint frame slices
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_cut_complete_CI.py
          --manifest "$FULL_MANIFEST" --manifest-sha "$FULL_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --phase prepare
          --prior-artifact "$RUNNER_TEMP/visible-exact-original-cut-frames"
          --pilot-artifact "$RUNNER_TEMP/visible-exact-original-projector-pilot"
          --cap-cut-artifact "$RUNNER_TEMP/visible-exact-original-cap-cut"
          --slices "$RUNNER_TEMP/visible-exact-complete-projector-frame-slices"
          --work "$RUNNER_TEMP/visible-exact-complete-projector-prepare-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-complete-projector-prepare"
          --compute-minutes 40 --checkpoint-minutes 10
      - name: Preserve unchanged complete frame slice 0
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-00/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unchanged complete frame slice 1
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-01/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unchanged complete frame slice 2
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-02/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unchanged complete frame slice 3
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-03/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unchanged complete frame slice 4
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-04/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unchanged complete frame slice 5
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-5-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-05/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unchanged complete frame slice 6
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-6-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-06/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unchanged complete frame slice 7
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-7-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-07/
          compression-level: 0
          retention-days: 30
