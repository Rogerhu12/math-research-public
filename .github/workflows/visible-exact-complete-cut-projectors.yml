          path: ${{ steps.paths.outputs.slices }}/slice-10/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unchanged complete frame slice 11
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-11-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-11/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unchanged complete frame slice 12
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-12-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-12/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unchanged complete frame slice 13
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-13-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-13/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unchanged complete frame slice 14
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-14-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-14/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unchanged complete frame slice 15
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-frame-slice-15-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slices }}/slice-15/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Require a real nonempty process before uploading its result
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process output exists')
          records=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          (root/'artifact-inventory.json').write_text(json.dumps(records,indent=2)+'\n')
          print(json.dumps(dict(actual_files=len(files),nonempty_output_verified=True)))
          PY_INVENTORY
      - name: Preserve the actual native outcome and every failed prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-projector-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
