          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/regular_cut_validator_ci/
      - name: Install the pinned directed arithmetic environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible exact artifact paths
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-complete-projector-range" >> "$GITHUB_OUTPUT"
          printf 'slice=%s\n' "$RUNNER_TEMP/visible-exact-original-frame-slice" >> "$GITHUB_OUTPUT"
      - name: Receive only this unchanged original frame slice
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: ${{ github.run_id }}
          name: visible-exact-cut-frame-slice-${{ matrix.slice }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.slice }}
      - name: Verify every assigned new cell with ten minute real pull and README checkpoints
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_cut_complete_CI.py
          --manifest "$FULL_MANIFEST" --manifest-sha "$FULL_MANIFEST_SHA"
          --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          --phase range --slice-id ${{ matrix.slice }}
          --frame-slice "$RUNNER_TEMP/visible-exact-original-frame-slice"
          --work "$RUNNER_TEMP/visible-exact-complete-projector-range-work"
          --artifact-dir "$RUNNER_TEMP/visible-exact-complete-projector-range"
          --compute-minutes 170 --checkpoint-minutes 10
      - name: Require a real nonempty process before uploading its result
        if: ${{ always() && steps.paths.outputs.output != '' }}
        env:
          ACTUAL_OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          python - <<'PY_INVENTORY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ACTUAL_OUTPUT'])
          files=sorted(p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          if not files or not any(p.stat().st_size for p in files):
              raise RuntimeError('no actual nonempty process output exists')
          records=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in files]
          (root/'artifact-inventory.json').write_text(json.dumps(records,indent=2)+'\n')
          print(json.dumps(dict(actual_files=len(files),nonempty_output_verified=True)))
          PY_INVENTORY
      - name: Preserve the actual native outcome and every failed prefix
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-projector-cells-${{ matrix.slice }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error

