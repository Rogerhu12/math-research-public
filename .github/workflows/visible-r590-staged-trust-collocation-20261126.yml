name: visible-flex R590 real moment guide and staged trust collocation
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r590-staged-trust-collocation-20261126.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible-flex-r590-staged-trust-collocation-20261126
  cancel-in-progress: false
jobs:
  research:
    name: Actual moment seed full positive potential and safeguarded finite states
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-r590-staged-trust-collocation-20261126.yml
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r590-staged-trust-collocation-20261126.json
            /topics/visible-flex-new-mechanism/notes/2026-11-26-r590-staged-trust-collocation-design-agent.md
            /topics/visible-flex-new-mechanism/results/R581-exact-c2-local-ruling-with-full-history-chain.md
            /topics/visible-flex-new-mechanism/results/R584-centered-third-history-and-nineteen-state-full-ruling-bvp.md
            /topics/visible-flex-new-mechanism/results/R586-sixfold-full-history-coefficient-projection-and-finite-integrals.md
            /topics/visible-flex-new-mechanism/results/R589-autonomous-full-feedback-and-even-end-germs.md
            /topics/visible-flex-new-mechanism/results/R590-full-history-square-potential-and-c2-update.md
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/scripts/r530_compact_history_v2_agent.py
            /topics/visible-flex-new-mechanism/scripts/r530_c2_r578_evaluator_agent.py
            /topics/visible-flex-new-mechanism/scripts/r530_full_centered_nineteen_bvp_agent.py
            /topics/visible-flex-new-mechanism/scripts/r590_c2_history_positive_square_free_germs_agent.py
            /topics/visible-flex-new-mechanism/scripts/r590_c2_staged_trust_collocation_agent.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Pull current rules and solve the actual equations with recoverable accepted states
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r590-staged-trust-collocation-20261126.json
          --lane staged-trust-collocation
      # Same physical model and equations, new real moment seed and globalization.
      # No repeated old highest-identity, directional, or 96/192 diagnostic gates.
      # Complete accepted small states only in stdout; no artifacts or caches.
