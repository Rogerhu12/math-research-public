name: ISP R150 complete original Bell field source and exact E lift
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: isp-original-full-bell-source-temporary-789f
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.MR_TOKEN }}
      GOMAXPROCS: "2"
      GOMEMLIMIT: "256MiB"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Record the bounded workflow start
        run: |
          python - <<'PY'
          import os,time
          with open(os.environ["GITHUB_ENV"],"a") as stream:
              stream.write("R150_BELL_JOB_STARTED_UTC="+str(time.time())+"\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/invariant-subspace-problem/README.md
            /topics/invariant-subspace-problem/HANDOFF.md
            /topics/invariant-subspace-problem/notes/2026-11-16-r150-original-full-bell-source-session-789f.py
            /topics/invariant-subspace-problem/notes/2026-11-16-r150-original-full-bell-source-session-789f-request.json
          persist-credentials: false
      - name: Install pinned exact arithmetic
        timeout-minutes: 5
        run: python -m pip install --quiet python-flint==0.9.0
      - name: Install Singular for verified weighted homogeneous prefixes
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends singular
          Singular --version
      - name: Complete original field prefixes and exact E source lift in one temporary job
        run: python topics/invariant-subspace-problem/notes/2026-11-16-r150-original-full-bell-source-session-789f.py
