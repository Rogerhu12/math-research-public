name: Run 45 signed-ratio closed coframe deformation

on:
  push:
    branches: [main]
    paths:
      - 'topics/visible-flex-larger-amplitude/computations/run45-coframe-phase-request.json'
      - '.github/workflows/visible-larger-run45-coframe-phase.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-larger-run45-coframe-phase
  cancel-in-progress: false

jobs:
  finite_amplitude:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the triggering public source commit
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/README.md
            /topics/visible-flex-larger-amplitude/HANDOFF.md
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/publish_r734_exact_conclusion.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/publish_r738_exact_gap.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/run36_bent_disk_actions.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/observe_bent_shared_rim_search.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/observe_bent_coframe_search.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_coframe_phase.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_coframe_fields.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_coframe_system.py
            /topics/visible-flex-larger-amplitude/computations/bent-coframe-phase-design-v1.json
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r765_signed_ratio_closed_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_shared_rim_phase.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_shared_rim_fields.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r763_translated_caps_and_shared_rim.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r761_paired_tube_safe_nonflat_caps.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r757_curved_rectifying_closed_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_curved_hard_end_fields.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r757_delayed_metric.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r757_curved_profile_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/closed_body_mesh_terminal.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/closed_body_mesh_geometry.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r740_rolled_disk_seed.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r742_tilted_disk_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r744_extruded_closed_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r746_axial_translation_closed_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r747_offset_arclength_closed_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r748_developable_axial_caps.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r752_delayed_turn_closed_two_jets.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_body_atlas.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_end_phase.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261128/bent_end_phase_fields.py
            /topics/visible-flex-larger-amplitude/scripts/resume_20261126/r759_paired_curvature_tracks.py
            /topics/visible-flex-larger-amplitude/computations/run45-coframe-phase-request.json
            /topics/visible-flex-larger-amplitude/notes/run45-coframe-phase-*.json
      - name: Select the pinned public numerical Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14
      - name: Execute the signed-ratio and reference coframe solves and both complete same-point exports
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
          RUN45_PYTHON_SETUP: ${{ steps.python.outcome }}
        shell: bash
        run: >-
          python -u topics/visible-flex-larger-amplitude/scripts/resume_20261128/observe_bent_coframe_search.py
          --request topics/visible-flex-larger-amplitude/computations/run45-coframe-phase-request.json
          --setup-conclusion "$RUN45_PYTHON_SETUP"
