name: Serre R853 original three V1 conjugates

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R853-three-V1-conjugates-public-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R853-original-three-V1-conjugates
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/notes/R853-three-V1-conjugates-public-request.json
      - name: Pull main and compare both rule files with the read commit
        env:
          REQUEST_SOURCE: ${{ github.sha }}
          RECEIPT_PATH: ${{ runner.temp }}/R853-three-V1-conjugates-rules-pull.json
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, subprocess
          from pathlib import Path
          path='topics/serre-uniformity/notes/R853-three-V1-conjugates-public-request.json'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',os.environ['REQUEST_SOURCE']],check=True)
          request=json.loads(subprocess.check_output(['git','show',os.environ['REQUEST_SOURCE']+':'+path]))
          subprocess.run(['git','checkout','-B','r853-three-V1-conjugates-rules-main'],check=True)
          subprocess.run(['git','pull','--rebase','origin','main'],check=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          old=request['rules_last_read_commit']
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',old],check=True)
          actual={key:hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  for key,name in [('root','README.md'),('topic','topics/serre-uniformity/README.md')]}
          changed=actual!=request['readme_sha256']
          receipt={'actual_git_pull_rebase_completed':True,'actual_head':head,'previous_read_commit':old,
                   'actual_UTC':dt.datetime.now(dt.timezone.utc).isoformat(),'readme_sha256':actual,
                   'expected_readme_sha256':request['readme_sha256'],'rules_changed':changed}
          Path(os.environ['RECEIPT_PATH']).write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('R853_RULES_PULL='+json.dumps(receipt,sort_keys=True))
          if changed:
              subprocess.run(['git','diff',old,head,'--','README.md','topics/serre-uniformity/README.md'],check=True)
              raise SystemExit('Both README changes must be read before the new mathematics.')
          PY
      - name: Preserve the actual pull receipt for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-R853-three-V1-conjugates-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R853-three-V1-conjugates-rules-pull.json
          retention-days: 1
          if-no-files-found: warn

  compute:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R853_original_semilinear_V1_conjugates.py
            /topics/serre-uniformity/scripts/R853_original_semilinear_V1_conjugates_public.py
            /topics/serre-uniformity/scripts/R837_original_branch_pencil_public.py
            /topics/serre-uniformity/scripts/R824_public_original_global_polar_generators.py
            /topics/serre-uniformity/notes/2026-11-16-original-Y-finite-RR-matrices-and-source-leaves.md
            /topics/serre-uniformity/results/R802-original-semilinear-parity-and-degree-seven-relations.md
            /topics/serre-uniformity/results/R805-original-two-affine-charts-and-small-polar-divisor-adapter.md
            /topics/serre-uniformity/notes/R853-original-three-V1-conjugates-method.md
            /topics/serre-uniformity/notes/R853-three-V1-conjugates-public-request.json
            /.github/workflows/serre-R853-three-V1-conjugates.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse exact sources without importing mathematical code
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          base=Path('topics/serre-uniformity/scripts')
          for name in ('R853_original_semilinear_V1_conjugates.py',
                       'R853_original_semilinear_V1_conjugates_public.py',
                       'R837_original_branch_pencil_public.py',
                       'R824_public_original_global_polar_generators.py'):
              p=base/name
              ast.parse(p.read_text(),filename=str(p))
              print('AST_OK',name)
          PY
      - name: Install pinned exact arithmetic
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Solve only three original V1 conjugates and verify all 560 coordinates
        run: |
          python topics/serre-uniformity/scripts/R853_original_semilinear_V1_conjugates_public.py \
            --output "$RUNNER_TEMP/R853-three-V1-conjugates/output"
      - name: Preserve completed stages and the 169 original source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-global-R853-original-semilinear-V1-generator-conjugates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R853-three-V1-conjugates/output
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
      - name: Read the exact source and certificate interfaces
        if: always()
        run: |
          python topics/serre-uniformity/scripts/R853_original_semilinear_V1_conjugates_public.py \
            --output "$RUNNER_TEMP/R853-three-V1-conjugates/output" --verify
