            /.github/workflows/visible-r738-wide-collar-fixed-metric-20261128.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Restore the naturally completed original paid donor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/r738_restore_completed_r735_20261128.py
          --request topics/visible-flex-new-mechanism/computations/request-r738-wide-collar-fixed-metric-20261128.json
      - name: Load only the pinned runtime for the receipt adapter
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0
      - name: Import the actual completed shared cap rows without any new science
        run: >-
          python topics/visible-flex-new-mechanism/scripts/r738_import_completed_r735_cap_rows.py
          --geometry topics/visible-flex-new-mechanism/computations/r738-actual-wide-collar-macro-20261128.json
          --r735-bind "$RUNNER_TEMP/r735-completed-donor-binding.json"
          --r735-geometry topics/visible-flex-new-mechanism/computations/r735-actual-two-port-match-20261128.json
          --r735-journal "$RUNNER_TEMP/r735-original-central.jsonl"
          --r735-final "$RUNNER_TEMP/r735-original-final.json"
          --r734-journal "$RUNNER_TEMP/r734-original-tail.jsonl"
          --r734-final "$RUNNER_TEMP/r734-original-final.json"
      - name: Pull both current rule sources and solve the real thick fixed-metric field
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r738-wide-collar-fixed-metric-20261128.json
          --lane actual-wide-collar-fixed-metric
      - name: Preserve every original paid input and all new complete operators
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-r738-paid-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r738-paid/
          retention-days: 30
          if-no-files-found: error
