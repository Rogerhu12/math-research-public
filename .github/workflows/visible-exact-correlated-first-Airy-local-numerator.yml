name: visible-exact correlate complete first Airy local numerator

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-correlated-first-Airy-local-numerator.yml']
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Optional exact correlated numerator run whose completed natural stages will be reused'
        required: false
        type: string
        default: ''
      resume_attempt:
        description: 'Original attempt for the optional exact prefix artifact'
        required: false
        type: string
        default: '1'

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-correlated-first-Airy-local-numerator
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-correlated-first-Airy-local-numerator-CI-inputs.json
  PHASE_MANIFEST_SHA: 121240b34799def0eb4df36b80694fabd1da2e338c9e662dbbf58154e701ca2b
  PHASE_WORKER_SHA: acd69d4fd74f730ab7c45126244796ca3c308f07aa82e1c91fc2063595447cc4
  PHASE_PIPELINE_SHA: a9b69b58d260a2ea6adcf19249d12f12f22eca97eb3491077ad5c3147309aff1
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-correlated-first-Airy-local-numerator:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_correlated_first_Airy_local_numerator_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-correlated-first-Airy-local-numerator-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Verify the exact complete worker before hydration
        run: |
          python - <<'PY_WORKER'
          import hashlib,os,pathlib
          path=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_correlated_first_Airy_local_numerator_public_worker.py')
          if hashlib.sha256(path.read_bytes()).hexdigest()!=os.environ['PHASE_WORKER_SHA']:
              raise SystemExit('the complete public worker changed')
          PY_WORKER
      - name: Hydrate39 exact inputs including26 original complete coefficient stages
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_correlated_first_Airy_local_numerator_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the complete pinned import closure before new mathematics
        run: |
          python - <<'PY_SOURCE'
          import ast,json,os,pathlib
          manifest=json.loads(pathlib.Path(os.environ['PHASE_MANIFEST']).read_text())
          for entry in manifest['files']:
              path=pathlib.Path(entry['path'])
              if path.suffix=='.py':ast.parse(path.read_text(),filename=str(path))
          PY_SOURCE
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0 numpy==2.3.5 scipy==1.17.0
      - name: Set the actual result path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-correlated-first-Airy-local-numerator-output" >> "$GITHUB_OUTPUT"
      - name: Prepare a separate optional prefix directory
        run: mkdir -p "$RUNNER_TEMP/visible-exact-correlated-first-Airy-local-numerator-prepared"
      - name: Restore an explicitly selected exact correlated numerator prefix
        if: ${{ inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: visible-exact-correlated-first-Airy-local-numerator-${{ inputs.resume_run }}-${{ inputs.resume_attempt }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/visible-exact-correlated-first-Airy-local-numerator-prepared/resume
      - name: Correlate new degree-ten local outputs and pay every higher Taylor and Fourier term
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_correlated_first_Airy_local_numerator_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-correlated-first-Airy-local-numerator-science"
          --prepared "$RUNNER_TEMP/visible-exact-correlated-first-Airy-local-numerator-prepared"
          --out-dir "$RUNNER_TEMP/visible-exact-correlated-first-Airy-local-numerator-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-correlated-first-Airy-local-numerator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 90
          if-no-files-found: error
