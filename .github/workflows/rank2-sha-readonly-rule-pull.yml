name: Rank2 read-only actual pull and rule differences
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/rank2-sha-readonly-rule-pull.yml"
      - "topics/rank2-sha-infinitely-many-p/ci/rule-sync-request.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rank2-sha-readonly-rule-pull
  cancel-in-progress: false
jobs:
  actual-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse public clone, actual pull, and README difference
        shell: bash
        env:
          RANK2_RULE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RANK2_RULE_SYNC_DIR="$RUNNER_TEMP/rank2-sha-rule-sync"
          export RANK2_RULE_SYNC_DIR
          git -c maintenance.auto=false clone --filter=blob:none --sparse --depth=1 --no-checkout --branch main https://github.com/Rogerhu12/math-research-public.git "$RANK2_RULE_SYNC_DIR"
          git -C "$RANK2_RULE_SYNC_DIR" sparse-checkout set --no-cone '/README.md' '/topics/rank2-sha-infinitely-many-p/README.md' '/topics/rank2-sha-infinitely-many-p/ci/rule-sync-request.json'
          git -C "$RANK2_RULE_SYNC_DIR" checkout --quiet main
          git -C "$RANK2_RULE_SYNC_DIR" -c merge.stat=false pull --rebase --no-stat --quiet origin main
          python3 - <<'PY'
          import datetime, json, os, pathlib, re, subprocess, urllib.request
          root = pathlib.Path(os.environ["RANK2_RULE_SYNC_DIR"])
          def git(*args):
              return subprocess.check_output(["git", "-C", str(root), *args], text=True).strip()
          request = json.loads((root / "topics/rank2-sha-infinitely-many-p/ci/rule-sync-request.json").read_text())
          head = git("rev-parse", "HEAD")
          baseline = request["last_rules_read"]
          subprocess.run(["git", "-C", str(root), "fetch", "--filter=blob:none", "--depth=1", "--quiet", "origin", baseline], check=True)
          paths = ["README.md", "topics/rank2-sha-infinitely-many-p/README.md"]
          diff = git("diff", "--no-ext-diff", "--no-renames", baseline, head, "--", *paths)
          result = {
              "kind": "rank2_actual_ci_git_pull",
              "actual_git_pull_success": True,
              "utc": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC"),
              "head": head,
              "last_rules_read": baseline,
              "request_id": request["request_id"],
              "readme_blobs": {p: git("rev-parse", head + ":" + p) for p in paths},
              "rules_changed": bool(diff),
              "scope": "read-only sparse CI checkout; local workspace remains separate"
          }
          print("RANK2_RULE_PULL_RECEIPT " + json.dumps(result, ensure_ascii=False))
          if diff:
              print("RANK2_RULE_DIFF_BEGIN")
              print(diff)
              print("RANK2_RULE_DIFF_END")
          api = "https://api.github.com/repos/Rogerhu12/math-research-public/git/trees/"
          def tree(sha, recursive=False):
              req = urllib.request.Request(api + sha + ("?recursive=1" if recursive else ""), headers={"User-Agent": "rank2-readonly-rule-sync", "Accept": "application/vnd.github+json", "Authorization": "Bearer " + os.environ["RANK2_RULE_GITHUB_TOKEN"]})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = json.load(response)
              if data.get("truncated"):
                  raise RuntimeError("Tree inventory truncated; do not infer a size bound")
              return data["tree"]
          root_tree = tree(head)
          topics_sha = next(x["sha"] for x in root_tree if x["path"] == "topics")
          topic_sha = next(x["sha"] for x in tree(topics_sha) if x["path"] == "rank2-sha-infinitely-many-p")
          entries = [x for x in tree(topic_sha, True) if x["type"] == "blob"]
          large = [{"path": x["path"], "bytes": x["size"], "sha": x["sha"]} for x in entries if x["size"] > 5000000]
          parts = [{"path": x["path"], "bytes": x["size"], "sha": x["sha"]} for x in entries if re.search(r"[._-]part\d+($|\.)", x["path"])]
          inventory = {"kind": "rank2_rule15_inventory", "head": head, "tree": topic_sha, "blob_count": len(entries), "total_bytes": sum(x["size"] for x in entries), "limit_bytes": 200000000, "over_5mb_count": len(large), "part_count": len(parts), "over_5mb": large[:100], "parts": parts[:100], "lists_complete": len(large) <= 100 and len(parts) <= 100}
          print("RANK2_RULE15_INVENTORY " + json.dumps(inventory, ensure_ascii=False))
          PY
