name: Rank2 original E65 complete source and six-source consumers
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/rank2-sha-e65-full-cm-source.yml"
      - "topics/rank2-sha-infinitely-many-p/ci/e65-full-cm-source-request.json"
      - "topics/rank2-sha-infinitely-many-p/scripts/check-original-e65-full-cm-sixth-axis.py"
      - "topics/rank2-sha-infinitely-many-p/scripts/original_e65_local_schwartz.py"
      - "topics/rank2-sha-infinitely-many-p/scripts/original_e65_angular_profile.py"
      - "topics/rank2-sha-infinitely-many-p/scripts/check-original-e65-six-sigma-projection.py"
      - "topics/rank2-sha-infinitely-many-p/scripts/check-original-sixth-on-five-axis-overdetermination.py"
      - "topics/rank2-sha-infinitely-many-p/scripts/check-original-degree130-cross-cm-projection.py"
      - "topics/rank2-sha-infinitely-many-p/scripts/check-original-degree130-whole-spectrum.py"
      - "topics/rank2-sha-infinitely-many-p/scripts/check-original-e260-six-sigma-source.py"
      - "topics/rank2-sha-infinitely-many-p/scripts/check-original-degree130-old-thirteen-source.py"
      - "topics/rank2-sha-infinitely-many-p/scripts/check-original-four-arithmetic-source-angles.py"
      - "topics/rank2-sha-infinitely-many-p/scripts/check-original-degree390-common-carry-nineteen-source.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rank2-sha-e65-full-cm-source
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Rebuild complete E65 and E89 sources and consume all six angles and sigma projection
        shell: bash
        run: |
          set -euo pipefail
          RANK2_CHECK_DIR="$RUNNER_TEMP/rank2-e65-full-cm"
          export RANK2_CHECK_DIR
          git -c maintenance.auto=false clone --filter=blob:none --sparse --depth=1 --no-checkout --branch main https://github.com/Rogerhu12/math-research-public.git "$RANK2_CHECK_DIR"
          git -C "$RANK2_CHECK_DIR" sparse-checkout set topics/rank2-sha-infinitely-many-p/scripts topics/rank2-sha-infinitely-many-p/ci .github/workflows
          git -C "$RANK2_CHECK_DIR" fetch --filter=blob:none --depth=1 --quiet origin "$GITHUB_SHA"
          git -C "$RANK2_CHECK_DIR" checkout --detach --quiet "$GITHUB_SHA"
          python3 - <<'PY'
          import ast, hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ["RANK2_CHECK_DIR"])
          prefix = "topics/rank2-sha-infinitely-many-p/"
          request = json.loads((root / (prefix + "ci/e65-full-cm-source-request.json")).read_text())
          assert request["schema"] == "rank2-original-e65-full-cm-sixth-axis/v8"
          assert request["python_flint_version"] == "0.9.0"
          assert request["workers"] == 4 and request["degree"] == 390
          assert request["complete_CM_norms"] == [7, 19]
          assert request["same_job_complete_E89_rebuild"] is True
          assert request["whole_five_plus_one_actual_jets"] is True
          assert request["same_job_complete_six_source_angular_profile"] is True
          assert request["same_job_genuine_six_sigma_projection"] is True
          assert request["same_job_original_h_projection"] is True
          assert request["same_job_complete_degree130_cross_projection"] is True
          assert request["same_job_complete_degree130_and_original66_spectrum"] is True
          assert request["same_job_e260_common_carry_source"] is True
          assert request["same_job_full_thirteen_old_sources"] is True
          assert request["same_job_four_new_source_angles"] is True
          assert request["same_job_degree390_nineteen_source"] is True
          assert request["same_job_sixth_on_five_axis_overdetermination"] is True
          assert request["overdetermination_prime"] == 227
          assert request["overdetermination_precision"] == 5
          assert request["require_sixth_jet_independence"] is True
          assert request["output_files"] is False
          script = prefix + "scripts/check-original-e65-full-cm-sixth-axis.py"
          assert request["script"] == script and request["args"] == ["--workers=4"]
          sources = [
              "check-original-four-arithmetic-source-angles.py",
              "check-original-degree390-common-carry-nineteen-source.py",

              "check-original-e65-full-cm-sixth-axis.py",
              "original_e65_local_schwartz.py",
              "original_e65_angular_profile.py",
              "check-original-e65-six-sigma-projection.py",
              "check-original-sixth-on-five-axis-overdetermination.py",
              "check-original-degree130-cross-cm-projection.py",
              "check-original-degree130-whole-spectrum.py",
              "check-original-e260-six-sigma-source.py",
              "check-original-degree130-old-thirteen-source.py",
              "r941-original-six-digit-central-reader.py",
              "check-r480-actual-input-cm19.py",
              "check-r466-fixed-two-division-source.py",
              "check-r464-degree102-cm7-exact.py",
              "check-r943-original-degree178-fifth-axis.py",
              "check-r943-degree178-full-cm-source.py",
              "check-r732-original-type-five-cm13.py",
          ]
          assert len(sources) == len(set(sources)) == 18
          for name in sources:
              p = root / (prefix + "scripts/" + name)
              ast.parse(p.read_text(), filename=str(p))
          print("R959_AST_PASS " + str(len(sources)), flush=True)
          dependencies = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rank2-e65-exact-python"
          subprocess.run([sys.executable, "-m", "pip", "install",
                          "--disable-pip-version-check", "--target", str(dependencies),
                          "python-flint==0.9.0"], check=True)
          os.environ["PYTHONPATH"] = str(dependencies)
          result = subprocess.run([sys.executable, str(root / script), "--workers=4"],
                                  cwd=root, stdout=subprocess.PIPE, stderr=None)
          receipt = {"script": script, "args": ["--workers=4"],
                     "script_sha256": hashlib.sha256((root / script).read_bytes()).hexdigest(),
                     "stdout_sha256": hashlib.sha256(result.stdout).hexdigest(),
                     "stdout_bytes": len(result.stdout), "exit_code": result.returncode}
          if result.stdout:
              if len(result.stdout) > 120000:
                  print("R959_OUTPUT_LIMIT " + json.dumps(receipt, sort_keys=True), flush=True)
                  raise RuntimeError("Keep generated source output as hashes; compact report exceeded the text bound")
              report = json.loads(result.stdout)
              print("RANK2_EXACT_STDOUT " + json.dumps({"script": script, "result": report},
                                                      sort_keys=True, separators=(",", ":")), flush=True)
          print("RANK2_PUBLIC_EXACT_CHECK " + json.dumps({
              "request_id": request["request_id"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_commit": os.environ["GITHUB_SHA"],
              "checks": [receipt], "outputs_persisted": False,
              "python_flint_version": request["python_flint_version"],
              "original_306_normalization_started": False},
              sort_keys=True, separators=(",", ":")), flush=True)
          if result.returncode:
              raise RuntimeError("Original E65 full-source check failed with exit code " + str(result.returncode))
          assert report["status"] == "PASS"
          assert report["actual_source"]["all_original_columns"] == 66
          assert report["actual_six_jets"]["same_job_old_E89_full_CM_rebuilt"] is True
          assert report["actual_six_jets"]["actual_B6_nonzero"] is True
          assert report["actual_six_jets"]["actual_six_source_angular_profile"]["status"] == "PASS"
          assert report["actual_six_sigma_projection"]["status"] == "PASS"
          assert report["actual_six_sigma_projection"]["same_job_full_CM_matrices_used"] is True
          overdet = report["actual_six_jets"]["sixth_on_five_axis_overdetermination"]
          assert overdet["status"] == "PASS" and overdet["prime"] == 227 and overdet["precision"] == 5
          assert overdet["all_five_Hensel_levels_verified"] == [1,2,3,4,5]
          assert overdet["complete_original_C24"]["hensel_new_row_pairing_minus_qZ_residual"] is True
          h = report["actual_six_sigma_projection"]["original_h_projection"]
          assert h["status"] in ("PASS_NONZERO_MARGINAL", "EXACT_ZERO_MARGINAL")
          assert h["all_three_66_coordinate_projections_returned"] is True
          assert h["both_whole_frames_integral_orthogonal_and_invertible"] is True
          cross = report["actual_degree130_cross_projection"]
          assert cross["status"] in ("PASS_UNIQUE_ARITHMETIC_LINE", "COMPLETE_TARGET_MULTIPLICITY_REQUIRES_MORE_INPUT")
          assert cross["all_original_columns"] == 66
          assert cross["all_restricted_columns_including_mass"] == 22
          assert cross["trace_pullback_is_three_identity"] is True
          assert cross["both_CM_pull_and_trace_intertwiners_all_rows_returned"] is True
          assert cross["original_cross_principal_trace_is_nine_halves_H130"] is True
          assert cross["mixed_cut_removed"] is False
          assert cross["infinite_prime_nonvanishing_proved"] is False
          spectrum = report["actual_degree130_and_original66_spectrum"]
          assert spectrum["status"] in ("PASS", "FULL130_PASS_FULL66_TWELFTH_GATE_FAILED")
          assert spectrum["all_joint_blocks_checked"] == 81
          assert spectrum["all_blocks_total_rank"] == 22
          assert spectrum["complete_block_sum_is_identity"] is True
          assert spectrum["complete_H130_and_F130_component_sums_returned"] is True
          whole66 = spectrum["original_whole66_delta_new_cross_spectrum"]
          assert whole66["all_original_columns_including_mass"] == 66
          assert whole66["whole_delta_new_projector_rank"] == 44
          if whole66["status"] == "PASS":
              assert whole66["all_81_joint_blocks_checked"] is True
              assert whole66["all_delta_new_components_sum_to_original_Rnew"] is True
              assert whole66["all_original_block_ranks_sum"] == 66
              assert whole66["all_delta_new_block_ranks_sum"] == 44
          assert spectrum["any_component_assigned_arithmetic_central_zero"] is False
          assert spectrum["infinite_prime_nonvanishing_proved"] is False
          new_source = report["actual_e260_common_carry_source"]
          assert new_source["status"] in ("PASS_NONZERO_GENUINE_SOURCE", "PASS_GENUINE_SOURCE_TARGET_PROJECTION_ZERO")
          assert new_source["all_22_columns_including_mass_retained"] is True
          assert new_source["r11_global_division_recurrence_returned_twice"] is True
          assert new_source["complete_target_projection_rank"] == 1
          assert new_source["complete_81_blocks_returned"] is True
          assert new_source["whole_integral_frame"]["common_H0_H1_whole_orthogonality_returned"] is True
          assert new_source["whole_integral_frame"]["full_gram_and_both_inverse_returns"] is True
          assert new_source["mixed_cut_removed"] is False
          old = report["actual_degree130_thirteen_old_sources"]
          assert old["status"] == "PASS"
          assert old["all_original22_mass_columns_retained"] is True
          assert old["both_entire22_pull_intertwiners_returned"] is True
          assert old["same_full_level10_CM7_from_both_directions"] is True
          assert old["same_full_level10_CM19_from_both_directions"] is True
          assert old["four_actual_pull_columns_rank"] == 4
          assert old["four_actual_columns_span_both_whole_old_blocks"] is True
          assert old["F10_residual_entirely_original_E65_cube_line"] is True
          assert old["old_mass_zero_assigned_central_zero"] is False
          assert old["mixed_cut_removed"] is False
          assert old["infinite_prime_nonvanishing_proved"] is False
          angles = report["actual_four_new_source_angles"]
          assert angles["status"] == "PASS"
          assert angles["all_source_projections_before_angular_or_jet_reading"] is True
          assert angles["all_original_mass_columns_retained"] is True
          assert len(angles["source_profiles"]) == 4
          assert angles["complete_ten_source_angular_cap"]["all_ten_full_source_memberships_returned"] is True
          assert angles["actual_ten_source_low_jets"]["original_six_low_jets_returned_unchanged"] is True
          assert angles["products_assigned_arithmetic_central_zero"] is False
          assert angles["mixed_cut_removed"] is False
          nineteen = report["actual_degree390_nineteen_source"]
          assert nineteen["status"] in ("PASS_BOTH_NEW_ARITHMETIC_PROJECTIONS_NONZERO", "PASS_GENUINE_SOURCE_SOME_NEW_TARGETS_ZERO")
          assert nineteen["all_66_columns_including_mass_retained"] is True
          assert nineteen["whole_integer_psi19_division_recurrence_returned"] is True
          assert len(nineteen["complete_81_block_table"]) == 81
          assert nineteen["all_81_idempotents_sum_to_identity_and_all_images_sum_to_F19"] is True
          assert nineteen["whole_integral_frame"]["full_gram_and_both_inverse_returns"] is True
          assert nineteen["whole_integral_frame"]["common_H0_H1_whole_orthogonality_returned"] is True
          assert nineteen["mixed_cut_removed"] is False
          assert nineteen["infinite_prime_nonvanishing_proved"] is False
          PY
