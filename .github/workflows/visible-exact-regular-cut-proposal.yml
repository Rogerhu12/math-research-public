name: visible-exact complete weighted cut to waist frame proposal

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-regular-cut-proposal.yml']
  workflow_dispatch:
    inputs:
      prior_run:
        description: 'Optional original run whose complete saved frame prefix is resumed'
        required: false
        default: ''
      prior_attempt:
        description: 'Original attempt containing that prefix'
        required: false
        default: '1'

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-exact-regular-cut-head-proposal
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CUT_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-regular-cut-CI-pinned-inputs-v2.json
  CUT_MANIFEST_SHA: f8c27873466b88ce7b1d0497d1baeaaa6682ae6ebfa2840fb3c80d9baf3e0e2f
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1
  REVIEWED_DRIVER_SHA: 7f8521cbdb35a0038843ae32e243a6ec847339d503c8462ab4431bda06070bb5

jobs:
  complete-cut-to-waist-proposal:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 350
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out unchanged complete science and the new proposal
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-regular-cut-CI-pinned-inputs-v2.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Fetch only the exact complete background, cut and source inputs
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_reviewed_CI_resume.py \
            --kind body --mode hydrate --manifest "$CUT_MANIFEST" --manifest-sha "$CUT_MANIFEST_SHA" \
            --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" sparse-checkout add /topics/visible-flex-exact-nearby/notes/regular_cut_subspace_ci/
      - name: Install the pinned numerical environment
        run: >-
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python-flint==0.9.0 sympy==1.14.0 mpmath==1.3.0
      - name: Set container-visible frame artifact paths
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-cut-head-frames" >> "$GITHUB_OUTPUT"
          printf 'prior=%s\n' "$RUNNER_TEMP/visible-exact-cut-head-prior" >> "$GITHUB_OUTPUT"
      - name: Receive the original complete saved frame prefix when explicitly selected
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prior_run != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/math-research-public
          run-id: ${{ inputs.prior_run }}
          name: visible-exact-cut-head-proposal-${{ inputs.prior_run }}-${{ inputs.prior_attempt }}
          path: ${{ steps.paths.outputs.prior }}
      - name: Propagate every complete weighted regular frame from the real cut to the waist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_PREFIX_RUN: ${{ inputs.prior_run }}
        run: |
          if [ -n "$ORIGINAL_PREFIX_RUN" ]; then
            python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_cut_CI_worker.py \
              --manifest "$CUT_MANIFEST" --manifest-sha "$CUT_MANIFEST_SHA" \
              --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA" \
              --prior-artifact "$RUNNER_TEMP/visible-exact-cut-head-prior" \
              --work "$RUNNER_TEMP/visible-exact-cut-head-work" --artifact-dir "$RUNNER_TEMP/visible-exact-cut-head-frames" \
              --compute-minutes 310 --checkpoint-minutes 10
          else
            python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_regular_cut_CI_worker.py \
              --manifest "$CUT_MANIFEST" --manifest-sha "$CUT_MANIFEST_SHA" \
              --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA" --driver-sha "$REVIEWED_DRIVER_SHA" \
              --work "$RUNNER_TEMP/visible-exact-cut-head-work" --artifact-dir "$RUNNER_TEMP/visible-exact-cut-head-frames" \
              --compute-minutes 310 --checkpoint-minutes 10
          fi
      - name: Preserve all complete frame bytes and every actual process outcome
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-cut-head-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
