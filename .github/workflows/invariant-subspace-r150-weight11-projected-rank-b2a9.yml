name: ISP original weight eleven projected rank
on:
  push:
    branches: [main]
    paths:
      - 'topics/invariant-subspace-problem/notes/2026-11-20-r150-weight11-projected-rank-request-b2a9.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isp-original-weight11-projected-rank-b2a9
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      ISP_PIN: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Select the original exact arithmetic runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install the pinned original arithmetic package
        timeout-minutes: 5
        run: python -m pip install --quiet python-flint==0.9.0
      - name: Partial checkout and frozen read-only weight eleven calculation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isp-wt11-checkout"
          cd "$RUNNER_TEMP/isp-wt11-checkout"
          git init -q
          git remote add origin https://github.com/Rogerhu12/math-research-public.git
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/README.md' '/topics/invariant-subspace-problem/README.md'
          timeout 120s git fetch --no-tags --filter=blob:none --depth=1 origin "$ISP_PIN"
          git checkout -b main FETCH_HEAD
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-20-r150-weight11-projected-rank-runner-b2a9.py" > "$RUNNER_TEMP/isp-weight11-runner.py"
          git show "$ISP_PIN:topics/invariant-subspace-problem/notes/2026-11-20-r150-weight11-projected-rank-request-b2a9.json" > "$RUNNER_TEMP/isp-weight11-request.json"
          python -m py_compile "$RUNNER_TEMP/isp-weight11-runner.py"
          python "$RUNNER_TEMP/isp-weight11-runner.py" --repo "$RUNNER_TEMP/isp-wt11-checkout" --pin "$ISP_PIN" --request "$RUNNER_TEMP/isp-weight11-request.json" --work "$RUNNER_TEMP/isp-weight11-work"
