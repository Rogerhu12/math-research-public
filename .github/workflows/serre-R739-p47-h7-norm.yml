name: Serre R739 exact original p47 h7 norm

on:
  push:
    branches: [main]
    paths:
      - 'topics/serre-uniformity/notes/R739-p47-h7-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serre-R739-original-finite-norm-p47-h7
  cancel-in-progress: false

jobs:
  norm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            README.md
            .github/workflows/serre-R739-p47-h7-norm.yml
            topics/serre-uniformity/README.md
            topics/serre-uniformity/scripts/R739_original_toric_norm.py
            topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            topics/serre-uniformity/notes/R739-p47-h7-request.json
            topics/serre-uniformity/computations/R739-original-finite-norm-p47-h7
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact original finite sum modulo 47^4
        id: calculation
        continue-on-error: true
        timeout-minutes: 8
        run: python topics/serre-uniformity/scripts/R739_original_toric_norm.py run
      - name: Preserve all exact outputs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-cartier-R739-original-finite-norm-p47-h7-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R739-p47-h7-output
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded certificates and full manifest
        if: always()
        env:
          SERRE_ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python topics/serre-uniformity/scripts/R739_original_toric_norm.py publish
      - name: Verify the exact finite norm receipt
        if: always()
        run: python topics/serre-uniformity/scripts/R739_original_toric_norm.py verify
