name: Serre p41 original affine pencil and graded free basis

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R805-public-original-affine-pencil-free-basis-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: serre-R805-original-affine-pencil-free-basis
  cancel-in-progress: false

jobs:
  original_affine_pencil_free_basis:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-original-affine-pencil-free-basis.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R805_original_affine_pencil_free_basis.py
            /topics/serre-uniformity/scripts/R805_public_original_affine_pencil_free_basis.py
            /topics/serre-uniformity/scripts/R786_public_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R805-public-original-affine-pencil-free-basis-request.json
            /topics/serre-uniformity/notes/R805-original-affine-integral-basis-and-polar-ideal-method.md
            /topics/serre-uniformity/results/R805-original-two-affine-charts-and-small-polar-divisor-adapter.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source syntax without executing mathematics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("R805_original_affine_pencil_free_basis.py", "R805_public_original_affine_pencil_free_basis.py"):
              path = Path("topics/serre-uniformity/scripts") / name
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compute only missing products and the original pencil and graded basis
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R805_public_original_affine_pencil_free_basis.py compute
      - name: Transfer the active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R805-original-affine-pencil-free-basis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R805-original-affine-pencil-free-basis/output
          retention-days: 1
          if-no-files-found: warn
      - name: Require the actual pencil and complete graded free basis
        if: always()
        run: python topics/serre-uniformity/scripts/R805_public_original_affine_pencil_free_basis.py verify
