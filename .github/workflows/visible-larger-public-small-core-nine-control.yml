name: visible-larger nine-control scalar design with complete three resonances
'on':
  push:
    branches:
    - main
    paths:
    - topics/visible-flex-larger-amplitude/computations/public-small-core-nine-control-request.json
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: visible-larger-public-small-core-nine-control
  cancel-in-progress: false
jobs:
  compute:
    name: Actual121 fifth six-vector plus three raw quadratic controls
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    outputs:
      scalar_summary: ${{ steps.scalar.outputs.scalar_summary }}
      scalar_summary_bytes: ${{ steps.scalar.outputs.scalar_summary_bytes }}
      scalar_summary_sha256: ${{ steps.scalar.outputs.scalar_summary_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        filter: blob:none
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /README.md
          /topics/visible-flex-larger-amplitude/*.md
          /topics/visible-flex-larger-amplitude/computations/
    - name: Establish independent temporary metadata paths
      run: |
        git config gc.auto 0
        git config gc.autoPackLimit 0
        git config maintenance.auto false
        git config --global merge.stat false
        mkdir -p "$RUNNER_TEMP/visible-small-core-nine-control-curved"
        echo "VISIBLE_OUT=$RUNNER_TEMP/visible-small-core-nine-control-curved" >> "$GITHUB_ENV"
        echo "VISIBLE_INPUTS=$RUNNER_TEMP/visible-small-core-nine-control-curved/original-inputs" >> "$GITHUB_ENV"
        echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.14
    - name: Install unchanged original operator runtime
      run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 python-flint==0.9.0
    - name: Bind actual121 fallback literals, original inputs and all83 plus2 source identities
      run: |
        python - <<'PYPINS'
        import ast,hashlib,json,os,subprocess
        from pathlib import Path,PurePosixPath
        repo=Path.cwd();comp=Path(os.environ['VISIBLE_COMPUTATIONS']);out=Path(os.environ['VISIBLE_OUT'])
        input_root=Path(os.environ['VISIBLE_INPUTS']);input_root.mkdir(parents=True,exist_ok=False)
        raw=(comp/'public-small-core-nine-control-request.json').read_bytes();request=json.loads(raw)
        assert request['repository']=='Rogerhu12/math-research-public' and request['request_number']==123
        assert request['schema']=='public-small-core-nine-control-curved-recipe-request-v1'
        assert request['lanes']==['smallcoreresonance']
        entry='geometry_20261115_small_core_nine_control_curved_recipe.py';family_name='geometry_20261115_small_core_nine_control_family.py'
        assert request['execution_entry']==request['scientific_entry']==entry
        assert request['source_sha256'][entry]=='824c0967e5de5cc9079a80018b66b1232c78ce406a6de4e0d7ab4cdee876bdaf'
        assert request['source_sha256'][family_name]=='086572f9a9fc172d671f050e9b343b66c4a57c5c88867537a1e8a3daa5ab9629'
        assert request['workflow_support_source_sha256']['root_20261115_small_core_nine_control_curved_scalar_readout.py']=='f57a7dfae95f3e629aa412003e10ea4e32a9821b754c3d575318f97b09b7317d'
        expected={'parameters': [0.4091209275836485, 0.2513669199841148, 0.4996145196964636, -0.006902208058565607, -0.035813559588767495, 0.5645740576397902, 0.0, 0.0, 0.0], 'backtracks': 20, 'candidate_resonance_tolerance': 1e-08, 'interval_bits': 160, 'interval_depth': 14, 'original_mesh_nodes': 699, 'field_modes': 112, 'tail_modes': 112, 'physical_angle_grid': 2048, 'material_and_boundary_angles': 4096, 'original_RHS_workers': 1, 'initial_relative_radius': 0.1, 'candidate_steps': 8, 'normal_iterations': 12, 'normal_backtracks': 20, 'normal_target_tolerance': 1e-08}
        assert request['diagnostic']==expected
        for path,blob in request['reviewed_README_blobs'].items():
         assert subprocess.check_output(['git','hash-object',path],text=True).strip()==blob,'README changed: read and apply new rules'
        handoff=(repo/'topics/visible-flex-larger-amplitude/HANDOFF.md').read_bytes()
        assert len(handoff)<=10000 and sum(line.startswith('规则同步记录：'.encode()) for line in handoff.splitlines())==1,'Retain the existing unique rule-sync line; do not bypass original Runner'
        for group,expected_count in [('source_sha256',83),('workflow_support_source_sha256',2)]:
         assert len(request[group])==expected_count
         for name,digest in request[group].items():
          assert PurePosixPath(name).name==name
          b=(comp/name).read_bytes();assert hashlib.sha256(b).hexdigest()==digest,name
          if name.endswith('.py'):compile(ast.parse(b,filename=name),name,'exec')
        closure=request['source_closure']['current_producer']
        assert len(closure)==26 and len(request['source_closure']['origin_producer'])==24
        assert all(request['source_sha256'][name]==digest for name,digest in closure.items())
        assert request['source_closure']['origin_producer']=={n:h for n,h in closure.items() if n not in (entry,family_name)}
        item=request['parameter_recipe'];recipe_raw=(repo/item['file']).read_bytes()
        assert len(recipe_raw)==2239==item['bytes']
        assert hashlib.sha256(recipe_raw).hexdigest()==item['sha256']=='cc4e90955ad20f740f4107166c0e94039445c18e12462caafdfa48316299501e'
        recipe=json.loads(recipe_raw)
        assert recipe['schema']=='R259-explicit-nine-control-raw-quadratic-shape-recipe-v1'
        assert recipe['literal_parameters']==expected['parameters'] and recipe['origin']==item['origin']
        assert recipe['family']==item['family']=={'schema': 'three-original-supports-even-odd-raw-quadratic-C2-controls-v1', 'support_indices': [0, 1, 2], 'original_even_controls': 3, 'retained_odd_controls': 3, 'new_quadratic_controls': 3, 'new_parameter_count': 9, 'parameter_order': ['p1', 'p2', 'p3', 'theta1', 'theta2', 'theta3', 'eta1', 'eta2', 'eta3'], 'old_six_column_indices': [0, 1, 2, 3, 4, 5], 'old_four_column_indices': [0, 1, 2, 4], 'newly_added_quadratic_column_indices': [6, 7, 8], 'formula': 'sum p_i*b_i + sum theta_i*b_i*t_i + sum eta_i*b_i*t_i^2, t_i=2*x_i-1', 'raw_quadratic_controls_not_centered': True, 'zero_new_quadratics_reduces_to_previous_six': True}
        assert len(recipe['literal_parameters'])==9 and recipe['literal_parameters'][6:]==[0.0,0.0,0.0]
        assert recipe['origin']['producer_file']=='geometry_20261115_small_core_six_control_curved_recipe.py'
        assert recipe['origin']['producer_schema']=='R259-six-control-full-three-two-normal-curved-trust-recipe-v1'
        assert recipe['origin']['producer_sha256']==request['source_sha256']['geometry_20261115_small_core_six_control_curved_recipe.py']
        assert recipe['origin']['run_id']=='43694950669' and recipe['origin']['source_commit']=='da16069e10e11d4541992fa66c6f03ee7165baf7'
        assert recipe['origin']['status_sha256']=='cfe09440cd7d89bb9a1b79513ff17695c16f683cc745dd73fb4412c87742241d'
        assert recipe['origin']['log_summary_sha256']=='24c3b370b23840ddaf93c52caa36a4b434ff3018e31a65ccb0f4d574a6d5b30e'
        assert request['original121_batch5_summary_provenance']['available_readout_is_fallback_not_complete_normal_summary'] is True
        assert request['trust_radius_restart']['request123_initial_radius']==0.1
        assert request['trust_radius_restart']['continuation_of_stored_trust_state'] is False
        assert request['new_scalar_family']['zero_added_quadratic_bitwise_equality_is_not_an_acceptance_or_execution_gate'] is True
        assert recipe['input_sha256']=={k:v['sha256'] for k,v in request['inputs'].items()}
        history=request['original_input_history_commit']
        assert history=='8bd267107cc8710d371f3b62c02986655ac965b0'
        subprocess.run(['git','fetch','--filter=blob:none','--no-tags','origin',history],check=True)
        paths={}
        for key,item in request['inputs'].items():
         rel=PurePosixPath(item['file'])
         assert not rel.is_absolute() and '..' not in rel.parts and str(rel).startswith('topics/visible-flex-larger-amplitude/')
         b=subprocess.check_output(['git','show',history+':'+str(rel)])
         assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256'],str(rel)
         p=input_root/(key+'-'+rel.name);p.write_bytes(b);paths[key]=str(p)
        (out/'original-input-paths.json').write_text(json.dumps(paths,sort_keys=True)+'\n')
        head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        assert head==os.environ['GITHUB_SHA']
        print(json.dumps(dict(event='request123-source-input-identity',source_commit=head,request_sha256=hashlib.sha256(raw).hexdigest(),source_count=83,workflow_support_source_count=2,origin_child_source_count=24,current_child_source_count=26,parameter_recipe_sha256=request['parameter_recipe']['sha256'],actual_origin_summary_is_fallback=True,parent_model_arrays_reused=False,math_inputs_restored_only_under_RUNNER_TEMP=True,old_publisher_executed=False,raw_output_retention=False)),flush=True)
        PYPINS
    - name: Restore original78 public numerical source files once
      run: |
        PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYSOURCE'
        import os
        from pathlib import Path
        from exact_20261114_public_resume import prepare_public_source
        source=prepare_public_source(Path.cwd(),Path(os.environ['RUNNER_TEMP'])/'small-core-nine-control-curved-original-source',Path(os.environ['VISIBLE_OUT']))
        with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
        PYSOURCE
    - name: Fresh nine-control full3 curved candidates with unchanged original gates
      id: science
      timeout-minutes: 75
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PYTHONPATH="$VISIBLE_COMPUTATIONS" python -u - <<'PYRUN'
        import hashlib,json,os,sys
        from pathlib import Path
        import root_20261114_current576_rules_runner as runner
        comp=Path(os.environ['VISIBLE_COMPUTATIONS']).resolve();repo=Path(os.environ['GITHUB_WORKSPACE']);out=Path(os.environ['VISIBLE_OUT'])
        request=json.loads((comp/'public-small-core-nine-control-request.json').read_text())
        inputs=json.loads((out/'original-input-paths.json').read_text())
        if Path(runner.__file__).resolve()!=comp/'root_20261114_current576_rules_runner.py':
         raise ValueError('Use the pinned original metadata runner')
        wanted_source=request['workflow_support_source_sha256']['root_20261114_current576_rules_runner.py']
        if hashlib.sha256(Path(runner.__file__).read_bytes()).hexdigest()!=wanted_source:
         raise ValueError('Original rules runner source changed')
        wanted=request['reviewed_README_blobs']
        if set(wanted)!={'README.md','topics/visible-flex-larger-amplitude/README.md'}:
         raise ValueError('Both explicitly reviewed README identities are required')
        baselines={}
        for name,expected in wanted.items():
         raw=(repo/name).read_bytes()
         blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
         if blob!=expected:raise ValueError('Reviewed README bytes changed: '+name)
         baselines[name]=dict(blob=blob,text=raw.decode('utf-8'))
        old={name:item['blob'] for name,item in runner.BASELINES.items()}
        runner.BASELINES=baselines
        print(json.dumps(dict(event='request123_explicit_rules_baseline_update',unchanged_runner_sha256=wanted_source,old_embedded_blobs=old,reviewed_current_blobs=wanted,period_seconds=runner.PERIOD_SECONDS,original_pull_rebase_diff_and_stop_on_new_rules_retained=True)),flush=True)
        argv=[sys.executable,'-u',str(comp/request['execution_entry'])]
        for key in ('accepted','prepared','tail_anchor','tail_config'):
         argv+=['--'+key.replace('_','-'),inputs[key]]
        argv+=['--parameter-recipe',str(repo/request['parameter_recipe']['file']),'--parameter-recipe-sha256',request['parameter_recipe']['sha256']]
        for key in ('initial_relative_radius','candidate_steps','backtracks','normal_iterations','normal_backtracks','normal_target_tolerance','candidate_resonance_tolerance','interval_bits','interval_depth'):
         argv+=['--'+key.replace('_','-'),str(request['diagnostic'][key])]
        argv+=['--out',str(out/request['output_directory'])]
        print(json.dumps(dict(event='request123_nine_control_full3_curved_argv',argv=argv,new_nine_control_family=True,old_six_column_indices=[0,1,2,3,4,5],new_quadratic_column_indices=[6,7,8],stored_parent_radius=.000390625,new_family_initial_radius=.1,stored_radius_continued=False,complete_three_by_nine_response=True,complete_two_normal_seven_tangent_path=True,zero_added_quadratic_comparison_is_not_gate=True,rejected_direction_multiplier=.25,eight_total_directions_count_rejections=True,p3_restoration_called=False,inner_target_not_outer_gate=True,normal_iterations=12,normal_backtracks=20,scientific_source_sha256=request['source_sha256'][request['scientific_entry']])),flush=True)
        sys.argv=[runner.__file__,'--out',str(out/'rule-sync'),'--command',*argv]
        raise SystemExit(runner.main())
        PYRUN
    - name: Print every full direction segment and pass only bounded primary metadata
      id: scalar
      if: always()
      run: |
        # Preserve reader stdout: it contains every complete direction and trial segment.
        python "$VISIBLE_COMPUTATIONS/root_20261115_small_core_nine_control_curved_scalar_readout.py" \
          --directory "$VISIBLE_OUT/small-core-nine-control-curved" \
          --rules-directory "$VISIBLE_OUT/rule-sync" \
          --compute-outcome "${{ steps.science.outcome }}"
    - name: Remove only this request temporary inputs, source cache and scientific payloads
      if: always()
      run: |
        python - <<'PYCLEAN'
        import json,os,shutil,stat
        from pathlib import Path
        runner=Path(os.environ['RUNNER_TEMP']).resolve();base=Path(os.environ['VISIBLE_OUT'])
        targets=[base/'small-core-nine-control-curved',base/'original-inputs',runner/'small-core-nine-control-curved-original-source']
        removed=[]
        def own_tree_writable(path):
         if path.is_symlink():raise ValueError('Do not follow a cleanup symlink')
         for parent,dirs,files in os.walk(path,topdown=True,followlinks=False):
          p=Path(parent);s=p.lstat()
          if s.st_uid!=os.getuid():raise PermissionError('Cleanup only request-owned trees')
          os.chmod(p,stat.S_IMODE(s.st_mode)|stat.S_IWUSR|stat.S_IXUSR)
          for name in dirs+files:
           child=p/name;s=child.lstat()
           if stat.S_ISLNK(s.st_mode):continue
           if s.st_uid!=os.getuid():raise PermissionError('Cleanup only request-owned entries')
           os.chmod(child,stat.S_IMODE(s.st_mode)|stat.S_IWUSR|(stat.S_IXUSR if stat.S_ISDIR(s.st_mode) else 0))
        for target in targets:
         if target.is_symlink():raise ValueError('Do not follow a cleanup symlink')
         target.resolve().relative_to(runner)
         if target.is_dir():
          own_tree_writable(target);shutil.rmtree(target);removed.append(str(target.relative_to(runner)))
        print(json.dumps(dict(event='request123_temporary_scientific_payloads_removed',relative_directories=removed,scalar_readout_step_precedes_cleanup=True,readout_success_not_inferred_from_cleanup=True,raw_artifact_or_Release_upload=False)),flush=True)
        PYCLEAN
  report:
    name: Bounded primary only; all direction segments remain in compute log
    needs:
    - compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
    - name: Print bounded original summary and exact output SHA
      env:
        SCALAR_SUMMARY: ${{ needs.compute.outputs.scalar_summary }}
        SCALAR_SUMMARY_BYTES: ${{ needs.compute.outputs.scalar_summary_bytes }}
        SCALAR_SUMMARY_SHA256: ${{ needs.compute.outputs.scalar_summary_sha256 }}
        COMPUTE_RESULT: ${{ needs.compute.result }}
      run: |
        python3 - <<'PYREPORT'
        import hashlib,json,os
        text=os.environ.get('SCALAR_SUMMARY','')
        if not text:
         payload=dict(schema='request123-compute-output-unavailable-v1',compute_job_result=os.environ.get('COMPUTE_RESULT'),run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],scientific_completion_not_claimed=True)
         raw=json.dumps(payload,sort_keys=True,separators=(',',':')).encode()
        else:
         raw=text.encode('utf-8')
         if len(raw)>90000:raise ValueError('Compute job output exceeded the explicit small summary bound')
         if len(raw)!=int(os.environ['SCALAR_SUMMARY_BYTES']) or hashlib.sha256(raw).hexdigest()!=os.environ['SCALAR_SUMMARY_SHA256']:
          raise ValueError('The original compute-to-report JSON output identity changed')
         json.loads(raw)
        print('BEGIN_VISIBLE123_SCALAR_SUMMARY')
        print(raw.decode('utf-8'))
        print('END_VISIBLE123_SCALAR_SUMMARY')
        print(json.dumps(dict(event='visible123-scalar-summary-sha256',bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),hash_scope='UTF-8 JSON string excluding log separator LF',compute_job_result=os.environ.get('COMPUTE_RESULT'),run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'])),flush=True)
        PYREPORT
