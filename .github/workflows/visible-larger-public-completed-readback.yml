"name": "visible-larger original readback and explicit saved-ledger diagnostic"
"on":
  "push":
    "branches":
    - "main"
    "paths":
    - "topics/visible-flex-larger-amplitude/computations/public-completed-readback-request.json"
"permissions":
  "contents": "write"
  "actions": "read"
"defaults":
  "run":
    "shell": "bash"
"jobs":
  "receipts":
    "name": "Read original bytes and run only the explicitly requested separate diagnostic"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 120
    "concurrency":
      "group": "visible-larger-public-completed-readback"
      "cancel-in-progress": false
    "env":
      "PYTHONDONTWRITEBYTECODE": "1"
      "PYTHONUNBUFFERED": "1"
      "OPENBLAS_NUM_THREADS": "1"
      "OMP_NUM_THREADS": "1"
      "MKL_NUM_THREADS": "1"
    "steps":
    - "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
      "with":
        "fetch-depth": 1
        "filter": "blob:none"
        "persist-credentials": false
        "sparse-checkout-cone-mode": false
        "sparse-checkout": |
          /README.md
          /topics/visible-flex-larger-amplitude/*.md
          /topics/visible-flex-larger-amplitude/computations/
    - "name": "Set bounded repository maintenance and readback output"
      "run": |
        git config gc.auto 0
        git config gc.autoPackLimit 0
        git config maintenance.auto false
        mkdir -p "$RUNNER_TEMP/visible-completed-readback/receipts"
        echo "VISIBLE_OUT=$RUNNER_TEMP/visible-completed-readback/receipts" >> "$GITHUB_ENV"
        echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
    - "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065"
      "with":
        "python-version": "3.12.14"
    - "name": "Install array decoding dependency"
      "run": "python -m pip install --disable-pip-version-check numpy==2.3.5"
    - "name": "Verify the exact reader and transport source bytes without imports"
      "run": |
        python - <<'PYPINS'
        import hashlib, json, os, re, subprocess
        from pathlib import Path
        comp = Path(os.environ['VISIBLE_COMPUTATIONS'])
        raw = (comp/'public-completed-readback-request.json').read_bytes()
        request = json.loads(raw)
        readers = {'prefix18': 'root_20261114_read_completed_eighteen_prefix.py',
                   'prefix19': 'root_20261114_read_completed_nineteen_prefix.py',
                   'prefix20': 'root_20261114_read_completed_twenty_prefix.py',
                   'prefix21': 'root_20261114_read_completed_twenty_one_prefix.py',
                   'prefix21lambda27': 'root_20261114_read_completed_twenty_one_lambda27_prefix.py',
                   'prefix22': 'root_20261114_read_completed_twenty_two_prefix.py',
                   'prefix23': 'root_20261114_read_completed_twenty_three_prefix.py',
                   'prefix24': 'root_20261114_read_completed_twenty_four_prefix.py',
                   'native73': 'exact_20261115_read_noj_primal_current576_artifact.py',
               'native61': 'exact_20261114_read_current576_artifact.py'}
        kind = request.get('readback_kind')
        if request.get('repository') != 'Rogerhu12/math-research-public' or kind not in readers:
            raise ValueError('Use an implemented original public-artifact reader')
        required = {readers[kind], 'exact_20261114_fetch_pinned_public_artifact.py',
                    'root_20261114_publish_actions.py'}
        if kind in ('native61', 'native73'):
            required.add('exact_20261114_audit_damped_chain_bytes.py')
        if kind == 'native73':
            required.add('exact_20261115_actual73_readback_packets.py')
        diagnostic = request.get('affine_infinity_diagnostic', {})
        if diagnostic.get('enabled', False):
            if kind != 'native73' or diagnostic.get('native_kind') != kind:
                raise ValueError('This separately labelled diagnostic route is only actual73')
            if diagnostic.get('source_file') != 'exact_20261115_native_affine_infinity_prediction.py' or diagnostic.get('source_sha256') != 'bd4ff360cb27750a98bb9966981949f89d6b6dcf607fd820c34bb71adee9cde4':
                raise ValueError('Retain the frozen independent R276 scientific consumer')
            required.add(diagnostic['source_file'])
        pins = request['source_sha256']
        if set(pins) != required:
            raise ValueError('Pin exactly the reader, byte dependencies, optional explicit R276 consumer and publisher')
        verified = []
        for name, expected in pins.items():
            if Path(name).name != name or not re.fullmatch(r'[0-9a-f]{64}', expected):
                raise ValueError('Invalid explicit source identity')
            source = (comp/name).read_bytes()
            actual = hashlib.sha256(source).hexdigest()
            if actual != expected:
                raise ValueError('Readback source differs: '+name)
            compile(source, name, 'exec')
            verified.append(dict(file=name, bytes=len(source), sha256=actual))
        head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
        if head != os.environ['GITHUB_SHA']:
            raise ValueError('Use the triggering source checkout')
        record = dict(source_commit=head, request=request,
            request_sha256=hashlib.sha256(raw).hexdigest(), verified_sources=verified,
            this_binding_step_scientific_computation=False,
            separate_R276_diagnostic_requested=bool(diagnostic.get('enabled', False)), task_completed=False)
        (Path(os.environ['VISIBLE_OUT'])/'completed-readback-request-identity.json').write_text(
            json.dumps(record, indent=2)+'\n')
        print(json.dumps(dict(source_commit=head, verified_sources=len(verified))), flush=True)
        PYPINS
    - "name": "Reserve the explicitly declared original-byte storage"
      "run": |
        python - <<'PYSPACE'
        import json, os, shutil, subprocess
        from pathlib import Path
        request = json.loads((Path(os.environ['VISIBLE_COMPUTATIONS'])/'public-completed-readback-request.json').read_text())
        needed = request['minimum_free_bytes']
        if type(needed) is not int or needed <= 0:
            raise ValueError('Declare the actual readback storage budget')
        root = Path(os.environ['RUNNER_TEMP'])
        before = shutil.disk_usage(root).free
        removed = []
        if before < needed:
            for name in ('/usr/local/lib/android', '/usr/share/dotnet', '/opt/ghc'):
                if Path(name).is_dir():
                    subprocess.run(['sudo', 'rm', '-rf', name], check=True)
                    removed.append(name)
                if shutil.disk_usage(root).free >= needed:
                    break
        after = shutil.disk_usage(root).free
        record = dict(minimum_free_bytes=needed, free_before=before, free_after=after,
                      removed_unused_runner_SDKs=removed, original_scientific_payload_removed=False)
        (Path(os.environ['VISIBLE_OUT'])/'readback-storage.json').write_text(json.dumps(record,indent=2)+'\n')
        if after < needed:
            raise RuntimeError('Insufficient declared storage for complete original bytes')
        print(json.dumps(record), flush=True)
        PYSPACE
    - "name": "Read the original outcome before complete exported-byte checks"
      "env":
        "GITHUB_TOKEN": "${{ github.token }}"
      "run": |
        python -u - <<'PYREAD'
        import json, os, subprocess, sys
        from pathlib import Path
        comp = Path(os.environ['VISIBLE_COMPUTATIONS'])
        request = json.loads((comp/'public-completed-readback-request.json').read_text())
        kind = request['readback_kind']
        reader = {'prefix18':'root_20261114_read_completed_eighteen_prefix.py',
                  'prefix19':'root_20261114_read_completed_nineteen_prefix.py',
                  'prefix20':'root_20261114_read_completed_twenty_prefix.py',
                  'prefix21':'root_20261114_read_completed_twenty_one_prefix.py',
                  'prefix21lambda27':'root_20261114_read_completed_twenty_one_lambda27_prefix.py',
                  'prefix22':'root_20261114_read_completed_twenty_two_prefix.py',
                  'prefix23':'root_20261114_read_completed_twenty_three_prefix.py',
                  'prefix24':'root_20261114_read_completed_twenty_four_prefix.py',
                  'native73':'exact_20261115_read_noj_primal_current576_artifact.py',
              'native61':'exact_20261114_read_current576_artifact.py'}[kind]
        pin = request['original_artifact']
        argv = [sys.executable, '-u', str(comp/reader)]
        for key in ('run_id','artifact_id','artifact_name','expected_size','expected_sha256'):
            argv += ['--'+key.replace('_','-'), str(pin[key])]
        argv += ['--source-commit', request['original_source_commit'],
                 '--download-out', str(Path(os.environ['RUNNER_TEMP'])/('original-completed-'+str(pin['run_id']))),
                 '--out', str(Path(os.environ['VISIBLE_OUT'])/('request'+str(request['original_request_number'])+'-readback'))]
        if kind in ('prefix18', 'prefix19', 'prefix20', 'prefix21', 'prefix21lambda27', 'prefix22', 'prefix23', 'prefix24'):
            parent = request['original_parent']
            argv += ['--request-number', str(request['original_request_number']),
                     '--parent-directory', parent['directory'],
                     '--parent-warm-sha256', parent['warm_sha256'],
                     '--parent-status-sha256', parent['status_sha256'],
                     '--repository-root', str(Path.cwd())]
        if kind == 'native73':
            argv = [sys.executable, '-u', str(comp/'exact_20261115_actual73_readback_packets.py'),
                    '--request', str(comp/'public-completed-readback-request.json'),
                    '--download-out', str(Path(os.environ['RUNNER_TEMP'])/('original-completed-'+str(pin['run_id']))),
                    '--out', str(Path(os.environ['VISIBLE_OUT'])/'request73-readback')]
        log = Path(os.environ['VISIBLE_OUT'])/'original-readback.log'
        with log.open('w') as stream:
            child = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
            for line in child.stdout:
                stream.write(line); stream.flush()
                print(line, end='', flush=True)
            code = child.wait()
        raise SystemExit(code)
        PYREAD
    - "name": "Run independent R276 exact affine-infinity arithmetic from the same original extraction"
      "if": "always()"
      "run": |-
        python -u - <<'PYAFFINE'
        import hashlib,json,os,subprocess,sys,traceback
        from pathlib import Path
        comp=Path(os.environ['VISIBLE_COMPUTATIONS']);out=Path(os.environ['VISIBLE_OUT'])
        request=json.loads((comp/'public-completed-readback-request.json').read_text())
        diagnostic=request.get('affine_infinity_diagnostic',{})
        if not diagnostic.get('enabled',False):
            print('No independent affine-infinity diagnostic requested',flush=True)
            raise SystemExit(0)
        pin=request['original_artifact'];root=Path(os.environ['RUNNER_TEMP'])/('original-completed-'+str(pin['run_id']))
        record=dict(schema='actual73-R276-separate-Actions-step-binding-v1',original_artifact=pin,
            original_source_commit=request['original_source_commit'],original_native_outcome_unchanged=True,
            byte_only_audit=False,new_scientific_integer_diagnostic_requested=True,
            new_RHS_J_ODE_QR_or_trial=False,new_acceptance_gate=False,invoked=False)
        code=2
        def digest(path):
            h=hashlib.sha256()
            with path.open('rb') as stream:
                for block in iter(lambda:stream.read(1024*1024),b''):h.update(block)
            return h.hexdigest()
        try:
            if request['readback_kind']!='native73' or diagnostic.get('native_kind')!='native73':raise ValueError('Use actual73 only')
            receipt_path=root/'_pinned_public_artifact_receipt.json'
            receipt_raw=receipt_path.read_bytes();receipt=json.loads(receipt_raw)
            if not (receipt['success'] is True and receipt['repository']==request['repository']
                    and receipt['pinned_input']==pin and receipt['download']['actual_sha256']==pin['expected_sha256']
                    and receipt['download']['actual_size']==pin['expected_size']
                    and receipt['public_artifact_metadata']['workflow_run']['head_sha']==request['original_source_commit']):
                raise ValueError('Use the same completely verified original extraction')
            source=comp/'exact_20261115_native_affine_infinity_prediction.py'
            actual=digest(source)
            if actual!='bd4ff360cb27750a98bb9966981949f89d6b6dcf607fd820c34bb71adee9cde4' or request['source_sha256'].get(source.name)!=actual:
                raise ValueError('Frozen independent R276 source identity')
            native=root/'native-noj-primal-current576-damped'
            argv=[sys.executable,'-u',str(source),'--native-kind','native73','--native-directory',str(native),
                  '--original-run-id',str(pin['run_id']),'--original-source-commit',request['original_source_commit']]
            result=native/'result.json';journals=native/'current-corrections.jsonl';trials=native/'native_trials.jsonl'
            outer=json.loads(result.read_bytes()) if result.is_file() else None
            if outer is not None and 'current_correction_summary' in outer:
                original_sha=digest(result);argv+=['--native-result-sha256',original_sha]
                record.update(input_mode='actual original result with correction summary',original_result=dict(file=result.relative_to(root).as_posix(),bytes=result.stat().st_size,sha256=original_sha))
            elif journals.is_file():
                original_sha=digest(journals);argv+=['--partial-records-sha256',original_sha]
                record.update(input_mode='explicit actual partial journals',partial_records=dict(file=journals.relative_to(root).as_posix(),bytes=journals.stat().st_size,sha256=original_sha),native_result_present=result.is_file())
                if trials.is_file():
                    trial_sha=digest(trials);argv+=['--partial-trials-sha256',trial_sha]
                    record['partial_trials']=dict(file=trials.relative_to(root).as_posix(),bytes=trials.stat().st_size,sha256=trial_sha)
            else:
                record.update(skipped=True,reason='The original artifact contains neither a result with a correction summary nor a partial correction journal; no model was invented')
            if not record.get('skipped',False):
                if diagnostic.get('output_directory')!='request73-affine-infinity':raise ValueError('Use independent diagnostic output')
                argv+=['--out',str(out/diagnostic['output_directory'])]
                record.update(argv=argv,diagnostic_source_sha256=actual,original_transport_receipt_sha256=hashlib.sha256(receipt_raw).hexdigest(),runtime_SHA_read_from_verified_original_bytes=True)
                (out/'request73-affine-infinity-argv.json').write_text(json.dumps(record,indent=2)+'\n')
                env=os.environ.copy();env.pop('GITHUB_TOKEN',None);env.pop('GH_TOKEN',None)
                with (out/'request73-affine-infinity.log').open('w') as log:
                    child=subprocess.Popen(argv,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,env=env)
                    record['invoked']=True
                    for line in child.stdout:
                        log.write(line);log.flush();print(line,end='',flush=True)
                    code=child.wait()
                record['diagnostic_returncode']=code
            else:code=0
        except Exception as error:
            record.update(actual_error=repr(error),traceback=traceback.format_exc())
        finally:
            (out/'request73-affine-infinity-route-result.json').write_text(json.dumps(record,indent=2)+'\n')
            print(json.dumps(record),flush=True)
        raise SystemExit(code)
        PYAFFINE
    - "name": "Recover the original bounded publication from the same verified artifact"
      "if": "always()"
      "env":
        "GH_TOKEN": "${{ github.token }}"
      "run": |
        python -u - <<'PYRECOVER'
        import hashlib, json, os, subprocess, sys
        from pathlib import Path
        comp = Path(os.environ['VISIBLE_COMPUTATIONS'])
        request = json.loads((comp/'public-completed-readback-request.json').read_text())
        if not request.get('recover_original_publication', False):
            print('No original publication recovery requested', flush=True)
            raise SystemExit(0)
        if request['readback_kind'] not in ('prefix21lambda27', 'prefix22', 'prefix23', 'prefix24', 'native73'):
            raise ValueError('Original publication recovery is explicitly restricted to these completed schemas')
        lane = 'current576native' if request['readback_kind'] == 'native73' else 'condensedqp'
        if request.get('original_publication_lane', lane) != lane:
            raise ValueError('Retain the existing original publication lane')
        pin = request['original_artifact']
        root = Path(os.environ['RUNNER_TEMP'])/('original-completed-'+str(pin['run_id']))
        receipt_path = root/'_pinned_public_artifact_receipt.json'
        receipt_raw = receipt_path.read_bytes()
        receipt = json.loads(receipt_raw)
        if not (receipt['success'] is True and receipt['repository'] == request['repository']
                and receipt['pinned_input'] == pin
                and receipt['download']['actual_sha256'] == pin['expected_sha256']
                and receipt['download']['actual_size'] == pin['expected_size']
                and receipt['public_artifact_metadata']['workflow_run']['head_sha'] == request['original_source_commit']):
            raise ValueError('Recover only the already completely verified actual original artifact')
        publisher = comp/'root_20261114_publish_actions.py'
        if hashlib.sha256(publisher.read_bytes()).hexdigest() != request['source_sha256'][publisher.name]:
            raise ValueError('Use the explicitly verified publisher')
        recovery_run = os.environ['GITHUB_RUN_ID']
        record = dict(original_artifact=pin, original_source_commit=request['original_source_commit'],
            recovered_by_readback_run=recovery_run, complete_transport_receipt_sha256=hashlib.sha256(receipt_raw).hexdigest(),
            original_scientific_files_unchanged=True, this_publication_step_scientific_computation=False,
            original_publication_lane=lane,
            recovery_requested_after_original_publisher_failure=True, original_byte_audit_not_a_science_gate=True)
        output = Path(os.environ['VISIBLE_OUT'])/'original-publication-recovery.json'
        output.write_text(json.dumps(record, indent=2)+'\n')
        env = os.environ.copy()
        env.update(GITHUB_RUN_ID=str(pin['run_id']), GITHUB_RUN_ATTEMPT='1', GITHUB_SHA=request['original_source_commit'])
        with (Path(os.environ['VISIBLE_OUT'])/'original-publication-recovery.log').open('w') as log:
            result = subprocess.run([sys.executable, '-u', str(publisher), '--results', str(root), '--lane', lane], env=env, stdout=log, stderr=subprocess.STDOUT)
        record['publisher_returncode'] = result.returncode
        output.write_text(json.dumps(record, indent=2)+'\n')
        print(json.dumps(record), flush=True)
        raise SystemExit(result.returncode)
        PYRECOVER
    - "name": "Preserve original packets, complete byte audit and separate diagnostic outputs"
      "if": "always()"
      "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
      "with":
        "name": "visible-completed-readback-${{ github.run_id }}-${{ github.run_attempt }}"
        "path": "${{ runner.temp }}/visible-completed-readback/receipts/"
        "compression-level": 1
        "retention-days": 30
        "if-no-files-found": "warn"
    - "name": "Publish original readouts, byte receipts and separately labelled diagnostic reports"
      "if": "always()"
      "env":
        "GH_TOKEN": "${{ github.token }}"
      "run": |
        python -u "$VISIBLE_COMPUTATIONS/root_20261114_publish_actions.py" \
          --results "$RUNNER_TEMP/visible-completed-readback/receipts" --lane receipts
