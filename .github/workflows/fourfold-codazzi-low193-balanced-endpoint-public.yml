name: R137 remaining low193 balanced endpoint diagnostic v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fourfold-codazzi-low193-balanced-endpoint-public.yml

permissions:
  contents: write

concurrency:
  group: r137-wvc-low193-balanced-endpoint-v3
  cancel-in-progress: false

jobs:
  complete-low193-endpoint-diagnostic:
    if: github.repository == 'Rogerhu12/math-research-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            topics/visible-flex-exact-nearby/README.md
            topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_collar_volterra_dual_public_worker.py
            topics/visible-flex-exact-nearby/notes/2026-11-20-low193-balanced-endpoint-inputs.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install fixed published Arb and floating runtimes
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: python-flint==0.9.0 numpy==2.3.5 scipy==1.16.3
      - name: Admit original inputs and compute one complete low193 diagnostic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_collar_volterra_dual_public_worker.py --repo "$GITHUB_WORKSPACE" --manifest topics/visible-flex-exact-nearby/notes/2026-11-20-low193-balanced-endpoint-inputs.json --manifest-sha 44af8273d5d77be90a978e829069b21eff3d5fa45609115aacf78fbfd88b6c78
