      - name: Receive every exterior original one-sided polynomial interface in the true waist
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          root=topics/visible-flex-exact-nearby/scripts
          python "$root/fourfold_codazzi_true_ratio_live_rules.py" python "$root/fourfold_codazzi_genuine_outer_seam_owner.py" --repo "$GITHUB_WORKSPACE" --original "$RUNNER_TEMP/gjo-input" --parents "$RUNNER_TEMP/grq-inputs" --private "$RUNNER_TEMP/gjo-private" --receipt "$RUNNER_TEMP/gjo-result.json"
      - name: Receive the entire small result or last completed physical seam prefix
        if: always()
        run: |
          python - <<'PYEND'
          import hashlib,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'gjo-result.json'
          if p.exists():
              b=p.read_bytes()
              if not 0<len(b)<100000:raise ValueError('entire qualified small GJO record')
              print('GJO_FINAL_SMALL_OR_PREFIX',len(b),hashlib.sha256(b).hexdigest(),b.decode().strip(),flush=True)
          PYEND
          if [ -f "$RUNNER_TEMP/grq-live-rules/status.json" ]; then
            cat "$RUNNER_TEMP/grq-live-rules/status.json"
          fi
