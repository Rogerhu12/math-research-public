name: Serre R748 original signed CM root

on:
  push:
    branches: [main]
    paths:
      - 'topics/serre-uniformity/notes/R748-public-signed-CM-root-request.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R748-original-signed-CM-root-p41
  cancel-in-progress: false

jobs:
  signed_root:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout public source and retained original certificates
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            README.md
            .github/workflows/serre-R748-original-signed-CM-root.yml
            topics/serre-uniformity/README.md
            topics/serre-uniformity/scripts/R748_original_signed_CM_root.py
            topics/serre-uniformity/scripts/R748_public_signed_CM_root.py
            topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            topics/serre-uniformity/notes/R748-public-signed-CM-root-request.json
            topics/serre-uniformity/notes/R748-original-signed-real-CM-root-and-p41-Hodge-first-jet-method.md
            topics/serre-uniformity/results/R588-actual-toric-norm-and-CM-normalization.md
            topics/serre-uniformity/results/R592-actual-integral-CM-jet-lattice-and-complete-tail.md
            topics/serre-uniformity/results/R717-exact-original-CM-norm-from-certified-complex-traces.md
            topics/serre-uniformity/results/R742-unramified-original-first-jets-and-depth-seven-Abel-isometry.md
            topics/serre-uniformity/results/R747-global-real-square-root-of-original-toric-period-product.md
            topics/serre-uniformity/notes/R745-p41-original-Hodge-input-method.md
            topics/serre-uniformity/computations/R717-original-CM-norm-p41/43597163388-1
            topics/serre-uniformity/computations/R748-original-signed-CM-root-p41
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned interval arithmetic
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Recover the exact original signed CM root
        id: calculation
        continue-on-error: true
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python topics/serre-uniformity/scripts/R748_public_signed_CM_root.py compute
      - name: Preserve complete and failed stage certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serre-cartier-R748-original-signed-CM-root-p41-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-cartier/R748-original-signed-CM-root-p41/output
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded certificates and full manifest
        if: always()
        env:
          SERRE_ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python topics/serre-uniformity/scripts/R748_public_signed_CM_root.py publish
      - name: Verify original sign and six exact first jets
        if: always()
        run: python topics/serre-uniformity/scripts/R748_public_signed_CM_root.py verify

