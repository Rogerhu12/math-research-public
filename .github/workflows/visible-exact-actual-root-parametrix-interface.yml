name: visible-exact actual root parametrix interface and finite coefficient audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-actual-root-parametrix-interface.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-actual-root-parametrix-interface
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-actual-root-parametrix-interface-CI-inputs.json
  PHASE_MANIFEST_SHA: 23ee815bad88e7972aff601974cdc4e246ab0e5a4a886626e669605eaa170c33
  PHASE_PIPELINE_SHA: cbcfbcb21bdbe5c28170b08366bfec057fb4919dafeb17a9a3c81331e7ccc876
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
  REVIEWED_RULES_SHA: fdb83fd44505b84955d81b1e070ea45001ef9064880b2b4613a8a67e26e3e0d1

jobs:
  complete-actual-root-parametrix-interface:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 65
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the exact consumer entry points
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_actual_root_parametrix_interface_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-actual-root-parametrix-interface-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-14-R133-reviewed-public-CI-rules.json
      - name: Hydrate the fifteen exact original process and proof inputs
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_actual_root_parametrix_interface_public_worker.py
          --mode hydrate --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Install the pinned original numerical environment
        run: >-
          python -m pip install --disable-pip-version-check python-flint==0.9.0 sympy==1.14.0
      - name: Set the original artifact path
        id: paths
        run: |
          printf 'output=%s\n' "$RUNNER_TEMP/visible-exact-actual-root-parametrix-interface-output" >> "$GITHUB_OUTPUT"
      - name: Compute the actual source interfaces and finite coefficient algebra and publish the outcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_actual_root_parametrix_interface_public_worker.py
          --mode run --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-exact-actual-root-parametrix-interface-science"
          --out-dir "$RUNNER_TEMP/visible-exact-actual-root-parametrix-interface-output"
      - name: Preserve every true native and failure record
        if: ${{ always() && steps.paths.outputs.output != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visible-exact-actual-root-parametrix-interface-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.output }}/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
