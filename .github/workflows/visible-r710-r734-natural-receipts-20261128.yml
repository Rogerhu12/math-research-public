name: visible-flex receive the naturally completed R710 and R734 paid objects
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r710-r734-natural-receipts-20261128.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visible-r710-r734-natural-receipts-20261128
  cancel-in-progress: false
jobs:
  receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /topics/visible-flex-new-mechanism/computations/request-r710-r734-natural-receipts-20261128.json
            /.github/workflows/visible-r710-r734-natural-receipts-20261128.yml
            /topics/visible-flex-new-mechanism/scripts/r710_completed_terminal_receiver_20261128.py
            /topics/visible-flex-new-mechanism/scripts/completed_receipt_recovery_20261128.py
            /topics/visible-flex-new-mechanism/scripts/completed_receipt_detail_20261128.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Receive exact completed literals and the original paid journal
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python topics/visible-flex-new-mechanism/scripts/r710_completed_terminal_receiver_20261128.py
          --request topics/visible-flex-new-mechanism/computations/request-r710-r734-natural-receipts-20261128.json
      - name: Retain exact old terminals and paid objects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-r710-r734-natural-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: r710-completed-receipt/
          retention-days: 30
          if-no-files-found: error
