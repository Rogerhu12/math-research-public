name: visible-exact individual principal energy terminal density

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-individual-principal-energy-terminal-density.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: visible-individual-principal-energy-terminal-density
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-individual-principal-energy-terminal-density-CI-inputs.json
  PHASE_MANIFEST_SHA: 3e26d5eb305e0a1112f059192f6060a4a90c74aa4d37e0da1bc26247f4030a9f
  PHASE_PIPELINE_SHA: f75a8f905b89a5527d52271c3e1fd682d43cf7f90d8b4b865f16efdcc75f8723
  PHASE_WORKER_SHA: 90f3b3c5e7ee45ad4af4096f9e739ffec2e1c5be69749fd826bed39b3949e293
  REVIEWED_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  REVIEWED_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  individual-principal-energy-terminal-density:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out only scripts parameters and reviewed READMEs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_individual_principal_energy_terminal_density_public_worker.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-individual-principal-energy-terminal-density-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
      - name: Verify the separately pinned worker
        run: |
          python - <<'PY_WORKER'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_individual_principal_energy_terminal_density_public_worker.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_WORKER_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_WORKER
      - name: Hydrate source and small provenance without restoring data into Git
        run: >-
          python topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_individual_principal_energy_terminal_density_public_worker.py --mode hydrate
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
      - name: Parse the new source before any mathematical evaluation
        run: |
          python - <<'PY_SOURCE'
          import ast,hashlib,os,pathlib
          p=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_individual_principal_energy_terminal_density.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PHASE_PIPELINE_SHA']
          ast.parse(p.read_text(),filename=str(p))
          PY_SOURCE
      - name: Install the pinned scalar runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Check the full immutable AST closure and evaluate the complete individual principal energy terminal density
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_individual_principal_energy_terminal_density_public_worker.py --mode run
          --manifest "$PHASE_MANIFEST" --manifest-sha "$PHASE_MANIFEST_SHA"
          --pipeline-sha "$PHASE_PIPELINE_SHA" --rules "$REVIEWED_RULES" --rules-sha "$REVIEWED_RULES_SHA"
          --work "$RUNNER_TEMP/visible-individual-principal-energy-terminal-density-science"
          --out-dir "$RUNNER_TEMP/visible-individual-principal-energy-terminal-density-output"
      # Root rule15: no upload-artifact, Release upload, native or numerical-data commit.
