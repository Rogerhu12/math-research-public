name: visible-exact saved collar components

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visible-exact-saved-collar-components.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-exact-saved-collar-components
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  SAVED_COLLAR_MANIFEST: topics/visible-flex-exact-nearby/notes/2026-11-15-R133-saved-collar-component-coercivity-CI-inputs.json
  SAVED_COLLAR_MANIFEST_SHA: 3a172b9e41587c50bd8f3112b3ef98b0c33a736a75b1204e2d627ef82767766c
  SAVED_COLLAR_SCI_SHA: 02fc50c45ed2610b94619d9db60ee2f74dc3a1643ce2f398c8eb25505926f7ea
  SAVED_COLLAR_WORKER_SHA: 02bc473c3e87105fd8484e603cffa18bc9f160b4becf3501323f7b3e24b0aeeb
  SAVED_COLLAR_RULES: topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
  SAVED_COLLAR_RULES_SHA: 65503a41254348a301fd71657ea61e5c32aa2d0bf7c980967b9ae35022a6b1d1

jobs:
  saved-collar-components:
    runs-on: ubuntu-latest
    container: python:3.12.14-trixie
    timeout-minutes: 45
    steps:
      - name: Install terminal Git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Partially check out the small scientific entry and existing conclusions
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-exact-nearby/README.md
            /topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_saved_collar_component_coercivity_CI.py
            /topics/visible-flex-exact-nearby/notes/2026-11-15-R133-saved-collar-component-coercivity-CI-inputs.json
            /topics/visible-flex-exact-nearby/notes/2026-11-15-1133-R133-reviewed-public-CI-rules-cleanup-history.json
            /topics/visible-flex-exact-nearby/notes/saved_positive_collar_components_ci/
      - name: Check the independently pinned worker and complete input manifest
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY_SAVED_COLLAR'
          import ast,hashlib,json,os,pathlib
          w=pathlib.Path('topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_saved_collar_component_coercivity_CI.py')
          assert hashlib.sha256(w.read_bytes()).hexdigest()==os.environ['SAVED_COLLAR_WORKER_SHA']
          ast.parse(w.read_text(),filename=str(w))
          p=pathlib.Path(os.environ['SAVED_COLLAR_MANIFEST'])
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['SAVED_COLLAR_MANIFEST_SHA']
          m=json.loads(p.read_bytes())
          assert m['source_sha256']==os.environ['SAVED_COLLAR_SCI_SHA']
          r=pathlib.Path(os.environ['SAVED_COLLAR_RULES'])
          assert hashlib.sha256(r.read_bytes()).hexdigest()==os.environ['SAVED_COLLAR_RULES_SHA']
          PY_SAVED_COLLAR
      - name: Install the identical directed scalar runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Read only saved positive rows for new collar components and12 candidate gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u topics/visible-flex-exact-nearby/scripts/fourfold_codazzi_saved_collar_component_coercivity_CI.py
          --repo "$GITHUB_WORKSPACE"
          --work "$RUNNER_TEMP/visible-exact-saved-collar-components"
          --manifest "$SAVED_COLLAR_MANIFEST" --manifest-sha "$SAVED_COLLAR_MANIFEST_SHA"
          --rules "$SAVED_COLLAR_RULES" --compute-minutes 20
      # Rule15: no numerical native, large audit, Release or Actions artifact is retained.
