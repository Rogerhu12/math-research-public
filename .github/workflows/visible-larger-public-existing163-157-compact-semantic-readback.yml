name: visible-larger request167 compact original157 evidence
'on':
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-existing163-157-compact-semantic-request.json
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: visible-larger-public-existing163157-compact-evidence
  cancel-in-progress: false
jobs:
  read:
    name: One original163 read157 log and bounded scientific-field selection
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      summary: ${{ steps.readback.outputs.summary }}
      summary_bytes: ${{ steps.readback.outputs.summary_bytes }}
      summary_sha256: ${{ steps.readback.outputs.summary_sha256 }}
      part0: ${{ steps.readback.outputs.part0 }}
      part0_bytes: ${{ steps.readback.outputs.part0_bytes }}
      part0_sha256: ${{ steps.readback.outputs.part0_sha256 }}
      part1: ${{ steps.readback.outputs.part1 }}
      part1_bytes: ${{ steps.readback.outputs.part1_bytes }}
      part1_sha256: ${{ steps.readback.outputs.part1_sha256 }}
      part2: ${{ steps.readback.outputs.part2 }}
      part2_bytes: ${{ steps.readback.outputs.part2_bytes }}
      part2_sha256: ${{ steps.readback.outputs.part2_sha256 }}
      part3: ${{ steps.readback.outputs.part3 }}
      part3_bytes: ${{ steps.readback.outputs.part3_bytes }}
      part3_sha256: ${{ steps.readback.outputs.part3_sha256 }}
      part4: ${{ steps.readback.outputs.part4 }}
      part4_bytes: ${{ steps.readback.outputs.part4_bytes }}
      part4_sha256: ${{ steps.readback.outputs.part4_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/README.md
            /topics/visible-flex-larger-amplitude/computations/root_20261115_existing151_157_log_readback.py
            /topics/visible-flex-larger-amplitude/computations/root_20261115_existing163_157_compact_semantic_readback.py
            /topics/visible-flex-larger-amplitude/computations/public-existing163-157-compact-semantic-request.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14
      - name: Bind two metadata sources and current README without importing science
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          git config --global merge.stat false
          python - <<'PYBIND'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          comp=root/'topics/visible-flex-larger-amplitude/computations'
          path=comp/'public-existing163-157-compact-semantic-request.json'
          raw=path.read_bytes()
          assert len(raw)==14702
          assert hashlib.sha256(raw).hexdigest()=='dcd09ad515645c4f90dae169e74243f86a9764f5ee3de00950177413d01741fe'
          request=json.loads(raw)
          bound=[]
          for field in ('reader','helper'):
              item=request[field]
              data=(root/item['path']).read_bytes()
              assert len(data)==item['bytes']
              assert hashlib.sha256(data).hexdigest()==item['sha256']
              bound.append(item)
          rules=[]
          for path,wanted in request['reviewed_README_blobs'].items():
              actual=subprocess.check_output(['git','rev-parse','HEAD:'+path],cwd=root,text=True).strip()
              assert actual==wanted,'Read the changed README before dispatch: '+path
              data=(root/path).read_bytes()
              rules.append(dict(path=path,git_blob=actual,bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          print(json.dumps(dict(event='request167-actual-source-and-rule-binding',
              source_commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],
              request_bytes=len(raw),request_sha256=hashlib.sha256(raw).hexdigest(),
              sources=bound,actual_reviewed_rules=rules,science_imported=False,
              job_minutes=35,unchanged_rule_monitor_period_seconds=2700,
              pure_metadata_job_shorter_than_monitor_period=True),sort_keys=True),flush=True)
          PYBIND
      - name: One official original163 log download and exact metadata selection
        id: readback
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u topics/visible-flex-larger-amplitude/computations/root_20261115_existing163_157_compact_semantic_readback.py \
            --request topics/visible-flex-larger-amplitude/computations/public-existing163-157-compact-semantic-request.json \
            --request-sha256 dcd09ad515645c4f90dae169e74243f86a9764f5ee3de00950177413d01741fe \
            --out "$RUNNER_TEMP/visible-existing163157-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retire only this fresh metadata-log directory if still present
        if: always()
        run: |
          python - <<'PYCLEAN'
          import hashlib,json,os,stat
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']).resolve()
          owned=root/('visible-existing163157-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ.get('GITHUB_RUN_ATTEMPT','1'))
          removed=[]
          if owned.is_symlink():raise ValueError('Owned log cleanup must not follow a symlink')
          if owned.exists():
              if owned.parent.resolve()!=root or owned.stat().st_uid!=os.getuid():
                  raise ValueError('Cleanup only this request direct owned directory')
              for path in sorted(owned.iterdir()):
                  info=path.lstat()
                  if not stat.S_ISREG(info.st_mode) or info.st_uid!=os.getuid():
                      raise ValueError('Unexpected object in metadata-only temporary directory')
                  h=hashlib.sha256();size=0
                  with path.open('rb') as stream:
                      for block in iter(lambda:stream.read(1048576),b''):
                          h.update(block);size+=len(block)
                  removed.append(dict(file=path.name,bytes=size,sha256=h.hexdigest()))
                  path.unlink()
              owned.rmdir()
          print(json.dumps(dict(event='request167-owned-log-retirement',
              removed=removed,raw_uploaded=False,science_rerun=False,
              original_scientific_result_not_changed=True),sort_keys=True),flush=True)
          PYCLEAN
  report0:
    name: Exact original157 selected evidence PART_0
    needs: [read]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Print one complete bounded packet with exact compute identity
        env:
          ORIGINAL: ${{ needs.read.outputs.part0 }}
          ORIGINAL_BYTES: ${{ needs.read.outputs.part0_bytes }}
          ORIGINAL_SHA256: ${{ needs.read.outputs.part0_sha256 }}
          READ_RESULT: ${{ needs.read.result }}
        run: |
          python3 - <<'PYREPORT'
          import hashlib,json,os
          text=os.environ.get('ORIGINAL','')
          if text:
              raw=text.encode('ascii')
              if len(raw)>76000:raise ValueError('Complete selected packet exceeds declared report bound')
              if len(raw)!=int(os.environ['ORIGINAL_BYTES']) or hashlib.sha256(raw).hexdigest()!=os.environ['ORIGINAL_SHA256']:
                  raise ValueError('Compute-to-report original words changed')
              json.loads(raw)
          else:
              raw=json.dumps(dict(schema='request167-selected-packet-unavailable-v1',
                  part='PART_0',read_job_result=os.environ.get('READ_RESULT'),
                  complete=False,scientific_failure_not_inferred=True,
                  run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA']),
                  ensure_ascii=True,sort_keys=True,separators=(',',':')).encode('ascii')
          print('BEGIN_REQUEST167_PART_0')
          print(raw.decode('ascii'))
          print('END_REQUEST167_PART_0')
          print(json.dumps(dict(event='request167-report-packet-identity',part='PART_0',
              bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),
              read_job_result=os.environ.get('READ_RESULT'),no_scientific_computation=True),
              sort_keys=True),flush=True)
          PYREPORT
