name: Serre full p47 short Cartier first four v2

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/full-p47-short-Cartier-first-four-request.json

permissions:
  contents: read

concurrency:
  group: serre-full-p47-short-Cartier-first-four-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_first_four_Cartier:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/full_p47_Miller_support.py
            /topics/serre-uniformity/scripts/full_p47_eight_CM_tangents.py
            /topics/serre-uniformity/scripts/full_p47_graded_RR_source.py
            /topics/serre-uniformity/scripts/full_p47_weight_one_Hodge_certificate.py
            /topics/serre-uniformity/scripts/original_p47_ell4513_cuspidal_transfer.py
            /topics/serre-uniformity/scripts/original_p47_cuspidal_disks.py
            /topics/serre-uniformity/notes/full-p47-graded-RR-source-request.json
            /topics/serre-uniformity/notes/full-p47-CM-height-move-request.json
            /topics/serre-uniformity/notes/original-p47-ell4513-cuspidal-transfer-request.json
            /topics/serre-uniformity/scripts/full_p47_short_Cartier_third_kind.py
            /topics/serre-uniformity/scripts/full_p47_Cartier_support.py
            /topics/serre-uniformity/notes/2026-11-27-full-p47-short-Cartier-third-kind-method.md
            /topics/serre-uniformity/scripts/full_p47_Gaussian_CM_log.py
            /topics/serre-uniformity/results/R1118-original-short-Cartier-reading-for-CM-third-kind-values.md
            /topics/serre-uniformity/notes/full-p47-short-Cartier-third-kind-request.json
            /topics/serre-uniformity/scripts/full_p47_short_Cartier_first_four.py
            /topics/serre-uniformity/notes/2026-11-27-full-p47-short-Cartier-first-four-method.md
            /topics/serre-uniformity/notes/full-p47-short-Cartier-first-four-request.json
            /topics/serre-uniformity/results/R1121-certified-original-twelve-short-Cartier-values.md
      - name: Pull pinned official SageMath 10.6 image
        run: docker pull sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      - name: Read four unfinished values by independent short Cartier
        env:
          SERRE_EXPECTED_REQUEST_SHA256: 'ed9508e1cd4d0f4b9950c68eebde5ada7fddf29d1e63810df7e367bffa6b8bc2'
        run: |
          timeout --signal=TERM --kill-after=30s 3960s docker run --rm --cpus=4 --memory=14g \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work,readonly" \
            --workdir /work \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SHA \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e SERRE_EXPECTED_REQUEST_SHA256 \
            -e PYTHONUNBUFFERED=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879 \
            /bin/bash -lc '
              set -e
              sage -pip install --user --no-cache-dir python-flint==0.9.0
              exec sage -python topics/serre-uniformity/scripts/full_p47_short_Cartier_first_four.py
            '
