name: Serre source publication recovery

on:
  push:
    branches: [serre-public-recovery-20261116]
    paths:
      - topics/serre-uniformity/notes/serre-source-publication-recovery-request.json

permissions:
  contents: write
  actions: write

concurrency:
  group: serre-source-publication-recovery
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/
            /.github/workflows/serre-source-publication-recovery.yml
      - name: Publish reviewed source with actual pulls and rule comparisons
        run: python topics/serre-uniformity/scripts/serre_public_source_publication_recovery.py
