name: visible-larger actual large-core mainline

on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-mainline-request.json
  workflow_dispatch:
    inputs:
      lane:
        description: Actual numerical calculation
        type: choice
        default: all
        options: [all, free3, geometry, coupling, couplingcheck, tailzero, tailzero112, prepare112, cardinal, gwcompat, circleprobe, gwvelocity, stage28, coupling112, coupling112banded, banddirection, coupling112physical]

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.choose.outputs.lanes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /topics/visible-flex-larger-amplitude/computations/public-mainline-request.json
      - name: Select exactly the requested public calculations
        id: choose
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_LANE: ${{ inputs.lane }}
        run: |
          python - <<'PYLANES'
          import json, os
          from pathlib import Path
          allowed = {'free3', 'geometry', 'coupling', 'couplingcheck', 'tailzero', 'tailzero112', 'prepare112', 'cardinal', 'gwcompat', 'circleprobe', 'gwvelocity', 'stage28', 'coupling112', 'coupling112banded', 'banddirection', 'coupling112physical'}
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              selected = os.environ['DISPATCH_LANE'] or 'all'
              lanes = ['free3', 'geometry', 'coupling', 'tailzero', 'cardinal'] if selected == 'all' else [selected]
          else:
              request = json.loads(Path('topics/visible-flex-larger-amplitude/computations/public-mainline-request.json').read_text())
              if request['repository'] != 'Rogerhu12/math-research-public':
                  raise ValueError('The request belongs to another repository')
              lanes = request['lanes']
          if not isinstance(lanes, list) or not lanes or any(lane not in allowed for lane in lanes) or len(set(lanes)) != len(lanes):
              raise ValueError('A nonempty list of distinct supported lanes is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('lanes=' + json.dumps(lanes, separators=(',', ':')) + '\n')
          print('Selected public calculations: ' + ', '.join(lanes))
          PYLANES
  mainline:
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: ${{ fromJSON(needs.select.outputs.lanes) }}
    name: Mainline ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: visible-larger-public-mainline-${{ matrix.lane }}
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43580643038-1-free3/stage-00/actual.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43582043166-1-coupling/preparation/prepared-compact.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43582043166-1-tailzero/zero-H-T96/
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-public-RK48-cardinal-tail-packet/
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-GW-cusp-compatibility-packet/
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-stage28-original-rk48-input/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-prepare112/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-tailzero112/zero-H-T112/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43592195185-1-coupling112banded/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43590496434-1-coupling112/full-DN112/reduced-001.npz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43586618658-1-gwcompat/GW-cusp-compatibility/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43585737152-1-coupling/preparation/prepared.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43585737152-1-coupling/full-DN/RMS-domain-preflight.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-exact-resume-RK24-radial4to8-closed-r1/
            /topics/visible-flex-larger-amplitude/notes/2026-11-12-closure-scaled-endpoint-q003-m8-d12-f225-exclusive-ready.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-m28-recovered-full-audit-r1-ready.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1.json.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1-config.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1-tail-response_0003.json.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1-accepted-ready-extracted.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1_coeff_00.npy.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1_coeff_01.npy.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1_coeff_02.npy.gz
      - name: Bound maintenance and establish result paths
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          mkdir -p "$RUNNER_TEMP/visible-mainline/${{ matrix.lane }}"
          echo "VISIBLE_OUT=$RUNNER_TEMP/visible-mainline/${{ matrix.lane }}" >> "$GITHUB_ENV"
          echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
          echo "VISIBLE_ACCEPTED=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43580643038-1-free3/stage-00/actual.json.gz" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.lane != 'banddirection'
        with:
          node-version: '24.22.1'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Restore pinned source bytes only from the public repository
        if: matrix.lane != 'free3' && matrix.lane != 'gwcompat' && matrix.lane != 'circleprobe' && matrix.lane != 'gwvelocity' && matrix.lane != 'banddirection'
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PY'
          import os
          from pathlib import Path
          from exact_20261114_public_resume import prepare_public_source
          source = prepare_public_source(Path.cwd(), Path(os.environ['RUNNER_TEMP'])/'visible-mainline-source', Path(os.environ['VISIBLE_OUT']))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
          PY
      - name: Continue the accepted 0.99 field with adaptive prediction steps
        if: matrix.lane == 'free3'
        timeout-minutes: 315
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_public_free3_adaptive.py" \
            --accepted "$VISIBLE_ACCEPTED" --out "$VISIBLE_OUT" \
            --work "$RUNNER_TEMP/visible-mainline-free3-qr" \
            --duration .006 --target-end 1.05 --budget-seconds 18000
      - name: Cover actual spatial blocks using diagonal paths and normal cones
        if: matrix.lane == 'geometry'
        timeout-minutes: 90
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_continuous_cover_budget_v3.py" \
            --directory topics/visible-flex-larger-amplitude/notes/2026-11-14-exact-resume-RK24-radial4to8-closed-r1/closed \
            --checkpoint topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1.json.gz \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --out "$VISIBLE_OUT/R241-cover-v3-q8.json" --radial-stride 1 --angular-stride 1 --prefix-angular-subdivision 8
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_held_hausdorff_cover.py" \
            --directory topics/visible-flex-larger-amplitude/notes/2026-11-14-exact-resume-RK24-radial4to8-closed-r1/closed \
            --cover "$VISIBLE_OUT/R241-cover-v3-q8-position-cover.json" --out "$VISIBLE_OUT/held-Hausdorff-cover.json"
      - name: Diagnose actual cusp Hermite compatibility from the original node bytes
        if: matrix.lane == 'gwcompat'
        timeout-minutes: 20
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_GW_cusp_compatibility.py" \
            --packet topics/visible-flex-larger-amplitude/notes/2026-11-14-GW-cusp-compatibility-packet \
            --out "$VISIBLE_OUT/GW-cusp-compatibility"
      - name: Solve and audit the actual T96 zero-height tail anchor
        if: matrix.lane == 'tailzero'
        timeout-minutes: 315
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_true_tail_client.py" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" --modes 96 --quadrature 1024 \
            --node-heap 6144 --out "$VISIBLE_OUT/zero-H-T96"
      - name: Compare nested actual node velocities and GW accelerations
        if: matrix.lane == 'gwvelocity'
        timeout-minutes: 20
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_GW_three_node_velocity_check.py" \
            --input-directory topics/visible-flex-larger-amplitude/notes/public-actions-43586618658-1-gwcompat/GW-cusp-compatibility \
            --packet topics/visible-flex-larger-amplitude/notes/2026-11-14-GW-cusp-compatibility-packet \
            --out "$VISIBLE_OUT/GW-three-node"
      - name: Replay only the original stage28 RK48 nodes and compare local finite fields
        if: matrix.lane == 'stage28'
        timeout-minutes: 30
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_stage28_local_GW_refinement.py" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" --node-heap 1536 \
            --out "$VISIBLE_OUT/stage28-original-RK48"
      - name: Solve and audit the actual new T112 zero-height tail anchor
        if: matrix.lane == 'tailzero112'
        timeout-minutes: 315
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_true_tail_client.py" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" --modes 112 --quadrature 2048 \
            --node-heap 6144 --out "$VISIBLE_OUT/zero-H-T112"
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_zero_tail_response_audit.py" \
            --response "$VISIBLE_OUT/zero-H-T112/tail_0001.json.gz" \
            --ready "$VISIBLE_OUT/zero-H-T112/tail_ready.json.gz" \
            --out "$VISIBLE_OUT/zero-H-T112-J-audit.json"
      - name: Prepare all original mesh and RMS queries at the genuine M112 field dimension
        if: matrix.lane == 'prepare112'
        timeout-minutes: 60
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_lifted_modes_response.py" scalar \
            --accepted "$VISIBLE_ACCEPTED" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --field-modes 112 --angles 2048 --out "$VISIBLE_OUT/scalar112-RHS-response.json"
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_lifted_modes_prepare.py" \
            --accepted "$VISIBLE_ACCEPTED" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --source-warm topics/visible-flex-larger-amplitude/notes/public-actions-43582043166-1-coupling/preparation/prepared-compact.json.gz \
            --field-modes 112 --angles 2048 --max-nodes 1200 --out "$VISIBLE_OUT/preparation112"
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PY'
          import os
          from pathlib import Path
          from exact_20261114_true_tail_client import prepare_config
          prepare_config(Path(os.environ['VISIBLE_OUT'])/'T112-config.json', modes=112, quadrature=2048)
          PY
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_lifted_modes_response.py" boundary \
            --accepted "$VISIBLE_ACCEPTED" --prepared "$VISIBLE_OUT/preparation112/prepared.json.gz" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --tail-client "$VISIBLE_COMPUTATIONS/exact_20261114_true_tail_client.py" \
            --tail-config "$VISIBLE_OUT/T112-config.json" \
            --tail-source-root "$VISIBLE_SOURCE_TOPIC/repro/source-root" \
            --node-heap 6144 --out "$VISIBLE_OUT/boundary112-response"
      - name: Restore the actual completed M112 preparation and full boundary response
        if: matrix.lane == 'coupling112' || matrix.lane == 'coupling112banded' || matrix.lane == 'coupling112physical'
        run: |
          export PREPARED112="$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-prepare112"
          python - <<'PY112'
          import hashlib, os
          from pathlib import Path
          base = Path(os.environ['PREPARED112'])
          expected = {
              'preparation112/prepared.json.gz': '0f94dd88b4ad43a58694e25c8dded46cddcf96939abae1dc21416adb50042714',
              'boundary112-response/response-check.json': '4bacf0bdbf00fd919e4de48f0b36c8322d2ea26539abeac9b9ddcf7c0db6bf7f',
          }
          for name, digest in expected.items():
              if hashlib.sha256((base/name).read_bytes()).hexdigest() != digest:
                  raise ValueError('The actually passed M112 input changed: ' + name)
          PY112
          mkdir -p "$VISIBLE_OUT/preparation112" "$VISIBLE_OUT/boundary112-response"
          cp "$PREPARED112/preparation112/prepared.json.gz" "$VISIBLE_OUT/preparation112/prepared.json.gz"
          cp "$PREPARED112/boundary112-response/response-check.json" "$VISIBLE_OUT/boundary112-response/response-check.json"
          cp "$PREPARED112/T112-config.json" "$VISIBLE_OUT/T112-config.json"
      - name: Solve the genuine M112 full-DN problem using its own true T112 anchor
        if: matrix.lane == 'coupling112'
        timeout-minutes: 270
        run: |
          export VISIBLE_FLEX_COMPLETED_ZERO_TAIL_DIR="$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-tailzero112/zero-H-T112"
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_lifted_modes_full_dn.py" \
            --accepted "$VISIBLE_ACCEPTED" --warm "$VISIBLE_OUT/preparation112/prepared.json.gz" \
            --response-check "$VISIBLE_OUT/boundary112-response/response-check.json" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --tail-client "$VISIBLE_COMPUTATIONS/exact_20261114_seeded_zero_tail_client.py" \
            --tail-config "$VISIBLE_OUT/T112-config.json" \
            --tail-source-root "$VISIBLE_SOURCE_TOPIC/repro/source-root" \
            --node-heap 6144 --out "$VISIBLE_OUT/full-DN112" --work "$RUNNER_TEMP/visible-full-DN112-qr"
      - name: Solve the complete original M112 collocation matrix with pivoted band LU
        if: matrix.lane == 'coupling112banded'
        timeout-minutes: 270
        run: |
          export VISIBLE_FLEX_COMPLETED_ZERO_TAIL_DIR="$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-tailzero112/zero-H-T112"
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_lifted_modes_banded_full_dn.py" \
            --accepted "$VISIBLE_ACCEPTED" --warm "$VISIBLE_OUT/preparation112/prepared.json.gz" \
            --response-check "$VISIBLE_OUT/boundary112-response/response-check.json" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --tail-client "$VISIBLE_COMPUTATIONS/exact_20261114_seeded_zero_tail_client.py" \
            --tail-config "$VISIBLE_OUT/T112-config.json" \
            --tail-source-root "$VISIBLE_SOURCE_TOPIC/repro/source-root" \
            --node-heap 6144 --max-nodes 1200 \
            --out "$VISIBLE_OUT/full-DN112" --work "$RUNNER_TEMP/visible-full-DN112-band"
      - name: Check the complete new physical-angle boundary with the actual saved T112 Jacobian
        if: matrix.lane == 'coupling112physical'
        timeout-minutes: 25
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_physical_test_response.py" \
            --accepted "$VISIBLE_ACCEPTED" --prepared "$VISIBLE_OUT/preparation112/prepared.json.gz" \
            --tail-anchor "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43592195185-1-coupling112banded/full-DN112/outer-00-anchor-tail.json.gz" \
            --tail-config "$VISIBLE_OUT/T112-config.json" \
            --qr-reduced "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43590496434-1-coupling112/full-DN112/reduced-001.npz" \
            --material-angles 4096 --physical-angles 4096 --out "$VISIBLE_OUT/physical-response"
      - name: Solve the full R252 physical-angle finite DN system with all original field and scalar rows
        if: matrix.lane == 'coupling112physical'
        timeout-minutes: 270
        run: |
          export VISIBLE_FLEX_COMPLETED_ZERO_TAIL_DIR="$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-tailzero112/zero-H-T112"
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_physical_test_full_dn.py" \
            --accepted "$VISIBLE_ACCEPTED" --warm "$VISIBLE_OUT/preparation112/prepared.json.gz" \
            --response-check "$VISIBLE_OUT/physical-response/response-check.json" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --tail-client "$VISIBLE_COMPUTATIONS/exact_20261114_seeded_zero_tail_client.py" \
            --tail-config "$VISIBLE_OUT/T112-config.json" \
            --tail-source-root "$VISIBLE_SOURCE_TOPIC/repro/source-root" \
            --node-heap 6144 --max-nodes 1200 --material-angles 4096 --physical-angles 4096 \
            --out "$VISIBLE_OUT/full-DN112" --work "$RUNNER_TEMP/visible-full-DN112-physical-band"
      - name: Read and close only the actually accepted M112 field with its own tail
        if: matrix.lane == 'coupling112' || matrix.lane == 'coupling112banded' || matrix.lane == 'coupling112physical'
        timeout-minutes: 90
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_lifted_modes_after_accept.py" \
            --checkpoint "$VISIBLE_OUT/full-DN112/actual.json.gz" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --tail-config "$VISIBLE_OUT/T112-config.json" \
            --tail-response "$VISIBLE_OUT/full-DN112/actual-tail-final-audit.json.gz" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" --out "$VISIBLE_OUT/accepted-112-physical-closed" \
            --angles 2048 4096 --radial-subdivisions 2 4 --readout-levels 1,2,4
      - name: Audit and assemble the exact inlet parity normal form of the accepted field
        if: matrix.lane == 'coupling112banded' || matrix.lane == 'coupling112physical'
        timeout-minutes: 45
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_inlet_parity_normal_form.py" audit \
            --checkpoint "$VISIBLE_OUT/full-DN112/actual.json.gz" \
            --angles 2048 4096 --radial-subdivisions 16 32 \
            --out "$VISIBLE_OUT/accepted-112-normalized/inlet-audit.json"
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_inlet_parity_normal_form.py" closed all \
            --checkpoint "$VISIBLE_OUT/full-DN112/actual.json.gz" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --config "$VISIBLE_OUT/T112-config.json" \
            --tail-response "$VISIBLE_OUT/full-DN112/actual-tail-final-audit.json.gz" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --complete "$VISIBLE_OUT/accepted-112-physical-closed/closed/surface-actual-tail-readout/complete-4.json" \
            --out-prefix "$VISIBLE_OUT/accepted-112-normalized/closed/surface"
      - name: Diagnose original material-circle projection and actual RMS domains
        if: matrix.lane == 'circleprobe'
        timeout-minutes: 20
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_material_circle_domain_probe.py" \
            --warm topics/visible-flex-larger-amplitude/notes/public-actions-43585737152-1-coupling/preparation/prepared.json.gz \
            --rms-report topics/visible-flex-larger-amplitude/notes/public-actions-43585737152-1-coupling/full-DN/RMS-domain-preflight.json \
            --out "$VISIBLE_OUT/material-circle-domain-probe.json.gz"
      - name: Diagnose the saved actual band-LU direction without another Jacobian or tail solve
        if: matrix.lane == 'banddirection'
        timeout-minutes: 35
        run: |
          export ACTUAL_BAND_RUN="$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43592195185-1-coupling112banded"
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_actual_direction_probe.py" \
            --accepted "$VISIBLE_ACCEPTED" \
            --warm "$ACTUAL_BAND_RUN/preparation112/prepared.json.gz" \
            --run-dir "$ACTUAL_BAND_RUN/full-DN112" \
            --tail-config "$ACTUAL_BAND_RUN/T112-config.json" \
            --qr-reduced "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43590496434-1-coupling112/full-DN112/reduced-001.npz" \
            --out "$VISIBLE_OUT/direction-probe"
      - name: Check the actual controlled scalar and complete physical RHS
        if: matrix.lane == 'coupling' || matrix.lane == 'couplingcheck'
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_prefix_controls_response.py" scalar \
            --accepted "$VISIBLE_ACCEPTED" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --out "$VISIBLE_OUT/scalar-RHS-response.json"
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PY'
          import os
          from pathlib import Path
          from exact_20261114_true_tail_client import prepare_config
          prepare_config(Path(os.environ['VISIBLE_OUT'])/'T96-config.json', modes=96, quadrature=1024)
          PY
      - name: Restore the complete previously prepared field without recomputation
        if: matrix.lane == 'coupling' || matrix.lane == 'couplingcheck'
        run: |
          mkdir -p "$VISIBLE_OUT/preparation"
          cp topics/visible-flex-larger-amplitude/notes/public-actions-43582043166-1-coupling/preparation/prepared-compact.json.gz "$VISIBLE_OUT/preparation/prepared.json.gz"
      - name: Check the complete material and augmented boundary derivatives
        if: matrix.lane == 'coupling' || matrix.lane == 'couplingcheck'
        timeout-minutes: 30
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_prefix_controls_response.py" boundary \
            --accepted "$VISIBLE_ACCEPTED" --prepared "$VISIBLE_OUT/preparation/prepared.json.gz" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --tail-client "$VISIBLE_COMPUTATIONS/exact_20261114_true_tail_client.py" \
            --tail-config "$VISIBLE_OUT/T96-config.json" \
            --tail-source-root "$VISIBLE_SOURCE_TOPIC/repro/source-root" \
            --node-heap 6144 --out "$VISIBLE_OUT/boundary-response"
      - name: Solve the actual full DN boundary problem with all scalar controls
        if: matrix.lane == 'coupling'
        timeout-minutes: 270
        run: |
          export VISIBLE_FLEX_COMPLETED_ZERO_TAIL_DIR="$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43582043166-1-tailzero/zero-H-T96"
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_zero_tail_response_audit.py" \
            --response "$VISIBLE_FLEX_COMPLETED_ZERO_TAIL_DIR/tail_0001.json.gz" \
            --ready "$VISIBLE_FLEX_COMPLETED_ZERO_TAIL_DIR/tail_ready.json.gz" --out "$VISIBLE_OUT/zero-height-J-audit.json"
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_full_dn_prefix_controls.py" \
            --accepted "$VISIBLE_ACCEPTED" --warm "$VISIBLE_OUT/preparation/prepared.json.gz" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --tail-client "$VISIBLE_COMPUTATIONS/exact_20261114_seeded_zero_tail_client.py" \
            --tail-config "$VISIBLE_OUT/T96-config.json" \
            --tail-source-root "$VISIBLE_SOURCE_TOPIC/repro/source-root" \
            --node-heap 6144 --out "$VISIBLE_OUT/full-DN" --work "$RUNNER_TEMP/visible-full-DN-qr"
      - name: Read the actual accepted complete physical field at two resolutions
        if: matrix.lane == 'coupling'
        timeout-minutes: 45
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_prefix_controls_readout.py" \
            --input "$VISIBLE_OUT/full-DN/actual.json.gz" --angles 1024 2048 \
            --radial-subdivisions 2 4 --out "$VISIBLE_OUT/full-DN/material-quintic.json"
      - name: Assemble the accepted large core with its own actual tail and fixed caps
        if: matrix.lane == 'coupling'
        timeout-minutes: 90
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_large_core_closed_assembly.py" all \
            --checkpoint "$VISIBLE_OUT/full-DN/actual.json.gz" \
            --tail-response "$VISIBLE_OUT/full-DN/actual-tail-final-audit.json.gz" \
            --config "$VISIBLE_OUT/T96-config.json" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" --out-prefix "$VISIBLE_OUT/closed/refined-A-closed"
      - name: Check exact shared-node cardinal tail and collar nonplanarity
        if: matrix.lane == 'cardinal'
        timeout-minutes: 90
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_cardinal_tail_exact_check.py" \
            --packet topics/visible-flex-larger-amplitude/notes/2026-11-14-public-RK48-cardinal-tail-packet/manifest.json \
            --checkpoint topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1.json.gz \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --out "$VISIBLE_OUT/R238-exact-C2-normal-form.json"
      - name: Read actual full DN tail diagnostics without changing solver status
        if: always() && matrix.lane == 'coupling'
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_tail_trace_report.py" \
            --directory "$VISIBLE_OUT/full-DN" --out "$VISIBLE_OUT/full-DN-tail-diagnostics.json.gz"
      - name: Read actual M112 full-DN diagnostics without changing solver status
        if: always() && (matrix.lane == 'coupling112' || matrix.lane == 'coupling112banded' || matrix.lane == 'coupling112physical')
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_tail_trace_report.py" \
            --directory "$VISIBLE_OUT/full-DN112" --out "$VISIBLE_OUT/full-DN112-tail-diagnostics.json.gz"
      - name: Preserve actual outcomes and failure checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-mainline-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visible-mainline/${{ matrix.lane }}/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bounded outputs with ordinary rebase and push
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u "$VISIBLE_COMPUTATIONS/root_20261114_publish_actions.py" \
            --results "$VISIBLE_OUT" --lane "${{ matrix.lane }}"
