name: visible-larger actual large-core mainline

on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-mainline-request.json
  workflow_dispatch:
    inputs:
      lane:
        description: Actual numerical calculation
        type: choice
        default: all
        options: [all, free3, geometry, coupling, couplingcheck, tailzero, tailzero112, prepare112, cardinal, gwcompat, circleprobe, gwvelocity, stage28, coupling112, coupling112banded, banddirection, coupling112physical, coupling112physicalqr, coupling112bridge, operatorcheck, coupling112trust, trustresume, coldtailprobe, trustprotected, zerorkprobe, trustmultiline, zerorkprobev2, zerorkprobev3, angledomain, nativeseed, angleprojection, sevenprojection, nativecorrection, observedseven, fullhprojection, nativeband]

permissions:
  contents: write
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.choose.outputs.lanes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /topics/visible-flex-larger-amplitude/computations/public-mainline-request.json
      - name: Select exactly the requested public calculations
        id: choose
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_LANE: ${{ inputs.lane }}
        run: |
          python - <<'PYLANES'
          import json, os
          from pathlib import Path
          allowed = {'free3', 'geometry', 'coupling', 'couplingcheck', 'tailzero', 'tailzero112', 'prepare112', 'cardinal', 'gwcompat', 'circleprobe', 'gwvelocity', 'stage28', 'coupling112', 'coupling112banded', 'banddirection', 'coupling112physical', 'coupling112physicalqr', 'coupling112bridge', 'operatorcheck', 'coupling112trust', 'trustresume', 'coldtailprobe', 'trustprotected', 'zerorkprobe', 'trustmultiline', 'zerorkprobev2', 'zerorkprobev3', 'angledomain', 'nativeseed', 'angleprojection', 'sevenprojection', 'nativecorrection', 'observedseven', 'fullhprojection', 'nativeband'}
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              selected = os.environ['DISPATCH_LANE'] or 'all'
              lanes = ['free3', 'geometry', 'coupling', 'tailzero', 'cardinal'] if selected == 'all' else [selected]
          else:
              request = json.loads(Path('topics/visible-flex-larger-amplitude/computations/public-mainline-request.json').read_text())
              if request['repository'] != 'Rogerhu12/math-research-public':
                  raise ValueError('The request belongs to another repository')
              lanes = request['lanes']
          if not isinstance(lanes, list) or not lanes or any(lane not in allowed for lane in lanes) or len(set(lanes)) != len(lanes):
              raise ValueError('A nonempty list of distinct supported lanes is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('lanes=' + json.dumps(lanes, separators=(',', ':')) + '\n')
          print('Selected public calculations: ' + ', '.join(lanes))
          PYLANES
  mainline:
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: ${{ fromJSON(needs.select.outputs.lanes) }}
    name: Mainline ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: visible-larger-public-mainline-${{ matrix.lane }}
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43580643038-1-free3/stage-00/actual.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43582043166-1-coupling/preparation/prepared-compact.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43582043166-1-tailzero/zero-H-T96/
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-public-RK48-cardinal-tail-packet/
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-GW-cusp-compatibility-packet/
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-stage28-original-rk48-input/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-prepare112/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43598917532-1-coupling112trust/constrained-warm/warm-003.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43602070499-1-trustresume/constrained-warm/warm-001.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43598917532-1-coupling112trust/full-DN112/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43602823170-1-coldtailprobe/cold-tail-residual/summary.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43603477207-1-trustprotected/protected-warm/warm-001.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43604874829-1-trustmultiline/multiline-warm/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43608931469-1-angleprojection/full-angle-warm/warm-001.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43610469627-1-sevenprojection/seven-angle-warm/warm-001.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43612331803-1-observedseven/observed-seven-warm/warm-001.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43612331803-1-observedseven/observed-seven-warm/driver-status.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43603818345-1-zerorkprobe/same-RK-candidate-native-probe/summary.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43604874829-1-zerorkprobev2/same-RK-candidate-native-probe-v2/summary.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43604874829-1-zerorkprobev2/same-RK-candidate-native-probe-v2/initializer-v2-construction-045-000.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/summary.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/candidate-checkpoint.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/candidate-initializer-identity.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/candidate-factory-identity.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/original-live-identity.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/probe-spec.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/verified-launch-intent.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/instrumentation.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/candidate-states-000.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3/original-graphs-gains-000.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43607404925-1-nativeseed/native-actual23-seeded-full/result.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43607404925-1-nativeseed/native-actual23-seeded-full/native_0001.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43607404925-1-nativeseed/native-actual23-seeded-full/native_iteration.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43607404925-1-nativeseed/native-actual23-seeded-full/native_trace.jsonl
            /topics/visible-flex-larger-amplitude/notes/public-actions-43607404925-1-nativeseed/native-actual23-seeded-full/native_trials.jsonl
            /topics/visible-flex-larger-amplitude/notes/public-actions-43607404925-1-nativeseed/native-actual23-seeded-full/seed-binding.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43607404925-1-nativeseed/native-actual23-seeded-full/instrumentation.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43607404925-1-nativeseed/native-actual23-seeded-full/seeded-solve-spec.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43607404925-1-nativeseed/native-actual23-seeded-full/verified-launch-intent.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43607404925-1-nativeseed/native-actual23-seeded-full/original-live-identity-before-seed.json
            /topics/visible-flex-larger-amplitude/notes/public-actions-43588155190-1-tailzero112/zero-H-T112/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43592195185-1-coupling112banded/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43594985550-1-coupling112physical/full-DN112/banded-linear/factor-001-first-step.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43594985550-1-coupling112physical/full-DN112/banded-linear/factor-001-first-rhs.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43590496434-1-coupling112/full-DN112/reduced-001.npz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43586618658-1-gwcompat/GW-cusp-compatibility/
            /topics/visible-flex-larger-amplitude/notes/public-actions-43585737152-1-coupling/preparation/prepared.json.gz
            /topics/visible-flex-larger-amplitude/notes/public-actions-43585737152-1-coupling/full-DN/RMS-domain-preflight.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-14-exact-resume-RK24-radial4to8-closed-r1/
            /topics/visible-flex-larger-amplitude/notes/2026-11-12-closure-scaled-endpoint-q003-m8-d12-f225-exclusive-ready.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-m28-recovered-full-audit-r1-ready.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1.json.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1-config.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1-tail-response_0003.json.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1-accepted-ready-extracted.json
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1_coeff_00.npy.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1_coeff_01.npy.gz
            /topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1_coeff_02.npy.gz
      - name: Bound maintenance and establish result paths
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          mkdir -p "$RUNNER_TEMP/visible-mainline/${{ matrix.lane }}"
          echo "VISIBLE_OUT=$RUNNER_TEMP/visible-mainline/${{ matrix.lane }}" >> "$GITHUB_ENV"
          echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
          echo "VISIBLE_ACCEPTED=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43580643038-1-free3/stage-00/actual.json.gz" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.lane != 'banddirection' && matrix.lane != 'operatorcheck' && matrix.lane != 'trustresume' && matrix.lane != 'trustprotected' && matrix.lane != 'trustmultiline' && matrix.lane != 'angledomain' && matrix.lane != 'angleprojection' && matrix.lane != 'sevenprojection' && matrix.lane != 'observedseven' && matrix.lane != 'fullhprojection' && matrix.lane != 'nativeband'
        with:
          node-version: '24.22.1'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Install interval arithmetic for the exact operator interface
        if: matrix.lane == 'operatorcheck'
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Compile recovered certificate sources and check three analytic metric cases
        if: matrix.lane == 'operatorcheck'
        timeout-minutes: 20
        run: |
          python -m py_compile \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_direct_operator_cell.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_full_prefix_operator.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_prefix_exact_nonplanarity.py" \
            "$VISIBLE_COMPUTATIONS/geometry_20261114_operator_interface_check.py"
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_operator_interface_check.py" \
            --out "$VISIBLE_OUT/operator-interface.json"
      - name: Fetch the byte-pinned actual28 public artifact into independent storage
        if: matrix.lane == 'nativeband'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_fetch_pinned_public_artifact.py" \
            --run-id 43611175099 --artifact-id 14120548264 \
            --artifact-name visible-mainline-nativecorrection-43611175099-1 \
            --expected-size 235561097 \
            --expected-sha256 0ff8e6f597af60f19243b5457c28e8638096c775551b6f3d044dc2d2f1fabeee \
            --out "$RUNNER_TEMP/actual28-pinned-input"
          cp "$RUNNER_TEMP/actual28-pinned-input/_pinned_public_artifact_receipt.json" "$VISIBLE_OUT/actual28-artifact-fetch-receipt.json"
      - name: Resolve the saved complete native system with pivoted band LU
        if: matrix.lane == 'nativeband'
        timeout-minutes: 45
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_native_captured_band_correction.py" \
            --capture-directory "$RUNNER_TEMP/actual28-pinned-input/native-correction-capture" \
            --capture-result-sha256 ff53d954de378571eac8d4b22e55c1b0a4595c0a0ab567d0760e1f3d427fded7 \
            --scaling original-sigma --out "$VISIBLE_OUT/captured-native-band-correction"
      - name: Restore pinned source bytes only from the public repository
        if: matrix.lane != 'free3' && matrix.lane != 'gwcompat' && matrix.lane != 'circleprobe' && matrix.lane != 'gwvelocity' && matrix.lane != 'banddirection' && matrix.lane != 'operatorcheck' && matrix.lane != 'nativeband'
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PY'
          import os
          from pathlib import Path
          from exact_20261114_public_resume import prepare_public_source
          source = prepare_public_source(Path.cwd(), Path(os.environ['RUNNER_TEMP'])/'visible-mainline-source', Path(os.environ['VISIBLE_OUT']))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
          PY
      - name: Replay the actual failed cold-tail residual with the original no-J stage pass
        if: matrix.lane == 'coldtailprobe'
        timeout-minutes: 20
        run: |
          python -u "$VISIBLE_COMPUTATIONS/exact_20261114_tail_cold_residual_probe.py" \
            --failed-directory "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43598917532-1-coupling112trust/full-DN112" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --out "$VISIBLE_OUT/cold-tail-residual" --node-heap 1536
      - name: Evaluate one same-RK zero-linear candidate in the unchanged original native tail
        if: matrix.lane == 'zerorkprobe'
        timeout-minutes: 20
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_zero_rk_native_probe.py" \
            --failed-directory "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43598917532-1-coupling112trust/full-DN112" \
            --cold-probe-summary "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43602823170-1-coldtailprobe/cold-tail-residual/summary.json" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --out "$VISIBLE_OUT/same-RK-candidate-native-probe" --node-heap 1536
      - name: Retain actual zero-RK block diagnostics and evaluate a v2 candidate only if constructed
        if: matrix.lane == 'zerorkprobev2'
        timeout-minutes: 20
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_zero_rk_native_probe_v2.py" \
            --failed-directory "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43598917532-1-coupling112trust/full-DN112" \
            --cold-probe-summary "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43602823170-1-coldtailprobe/cold-tail-residual/summary.json" \
            --first-candidate-summary "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43603818345-1-zerorkprobe/same-RK-candidate-native-probe/summary.json" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --out "$VISIBLE_OUT/same-RK-candidate-native-probe-v2" --node-heap 1536
      - name: Retain exact internal rounding identities and evaluate the full v3 candidate
        if: matrix.lane == 'zerorkprobev3'
        timeout-minutes: 20
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_zero_rk_native_probe_v3.py" \
            --failed-directory "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43598917532-1-coupling112trust/full-DN112" \
            --cold-probe-summary "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43602823170-1-coldtailprobe/cold-tail-residual/summary.json" \
            --first-candidate-summary "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43603818345-1-zerorkprobe/same-RK-candidate-native-probe/summary.json" \
            --v2-candidate-summary "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43604874829-1-zerorkprobev2/same-RK-candidate-native-probe-v2/summary.json" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --out "$VISIBLE_OUT/same-RK-candidate-native-probe-v3" --node-heap 1536
      - name: Solve the original full native tail and fresh J audit from the complete actual23 seed
        if: matrix.lane == 'nativeseed'
        timeout-minutes: 320
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_native_candidate_seeded_solve.py" \
            --failed-directory "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43598917532-1-coupling112trust/full-DN112" \
            --cold-probe-summary "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43602823170-1-coldtailprobe/cold-tail-residual/summary.json" \
            --first-candidate-summary "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43603818345-1-zerorkprobe/same-RK-candidate-native-probe/summary.json" \
            --v2-candidate-summary "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43604874829-1-zerorkprobev2/same-RK-candidate-native-probe-v2/summary.json" \
            --candidate-directory "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --out "$VISIBLE_OUT/native-actual23-seeded-full" --node-heap 6144
      - name: Capture the complete original first native Newton model and correction
        if: matrix.lane == 'nativecorrection'
        timeout-minutes: 320
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_native_correction_capture.py" \
            --failed-directory "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43598917532-1-coupling112trust/full-DN112" \
            --cold-probe-summary "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43602823170-1-coldtailprobe/cold-tail-residual/summary.json" \
            --first-candidate-summary "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43603818345-1-zerorkprobe/same-RK-candidate-native-probe/summary.json" \
            --v2-candidate-summary "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43604874829-1-zerorkprobev2/same-RK-candidate-native-probe-v2/summary.json" \
            --candidate-directory "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43605912092-1-zerorkprobev3/same-RK-candidate-native-probe-v3" \
            --native-failure-directory "$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/notes/public-actions-43607404925-1-nativeseed/native-actual23-seeded-full" \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --out "$VISIBLE_OUT/native-correction-capture" --node-heap 6144
      - name: Continue the accepted 0.99 field with adaptive prediction steps
        if: matrix.lane == 'free3'
        timeout-minutes: 315
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_public_free3_adaptive.py" \
            --accepted "$VISIBLE_ACCEPTED" --out "$VISIBLE_OUT" \
            --work "$RUNNER_TEMP/visible-mainline-free3-qr" \
            --duration .006 --target-end 1.05 --budget-seconds 18000
      - name: Cover actual spatial blocks using diagonal paths and normal cones
        if: matrix.lane == 'geometry'
        timeout-minutes: 90
        run: |
          python -u "$VISIBLE_COMPUTATIONS/geometry_20261114_continuous_cover_budget_v3.py" \
            --directory topics/visible-flex-larger-amplitude/notes/2026-11-14-exact-resume-RK24-radial4to8-closed-r1/closed \
            --checkpoint topics/visible-flex-larger-amplitude/notes/2026-11-13-strong-q126-m32-tail2-actual-r1.json.gz \
            --source-topic "$VISIBLE_SOURCE_TOPIC" \
            --port "$VISIBLE_COMPUTATIONS/alternative-neck-provider-smallcut30-port32-r2048.json" \
            --out "$VISIBLE_OUT/R241-cover-v3-q8.json" --radial-stride 1 --angular-stride 1 --prefix-angular-subdivision 8
