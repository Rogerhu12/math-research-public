name: visible-flex complete self image of the paid joint kernel
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-joint-kernel-complete-self.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visible-flex-joint-kernel-complete-self
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/visible-joint-kernel-complete-self.yml
            /topics/visible-flex-new-mechanism/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Read current rules and observe the one new complete self image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path.cwd()
          topic='topics/visible-flex-new-mechanism'
          request_path=topic+'/computations/request-joint-kernel-complete-self.json'
          reader_path=topic+'/scripts/read_original_actions_log.py'
          source=os.environ['GITHUB_SHA']
          raw=subprocess.check_output(['git','show',source+':'+request_path],cwd=root)
          if Path(request_path).read_bytes()!=raw:
              raise RuntimeError('checked-out request differs from the workflow source commit')
          request=json.loads(raw)
          reader_raw=subprocess.check_output(['git','show',source+':'+reader_path],cwd=root)
          reader_sha='b7b16d0917bf99e4183421ab6d5c1dd33b9c0fe8009ad59a5141a17d798e5c4a'
          if (len(reader_raw)!=50679 or hashlib.sha256(reader_raw).hexdigest()!=reader_sha
                  or Path(reader_path).read_bytes()!=reader_raw):
              raise RuntimeError('frozen rule-reader source changed before import')
          sys.path.insert(0,str((root/topic/'scripts').resolve()))
          import read_original_actions_log as reader
          reader.require(request['source_sha256'][reader_path]==reader_sha,'request rule-reader binding changed')
          def emit(tag,value):
              print(tag+' '+reader.encoded(value).decode('utf-8'),flush=True)
          emit('SELF_KERNEL_REQUEST',{'source_commit':source,'request_bytes':len(raw),'request_sha256':hashlib.sha256(raw).hexdigest(),'source_binding_count':len(request['source_sha256']),'one_new_self_observation':True,'paid_relations':53,'new_development_checks':2,'old_Q_current_operator_rank_or_check_executions':0})
          public=reader.actual_pull(root,request,source)
          emit('SELF_KERNEL_PUBLIC_PULL',public)
          reader.require(public['passed'],'public rules changed or actual pull failed; apply only the diff before science')
          private={}
          try:
              reader.private_rule_pull(request,private)
          finally:
              emit('SELF_KERNEL_PRIVATE_PULL',private)
              os.environ.pop('MR_TOKEN',None)
          reader.git_ok(root,['checkout','--detach',source])
          reader.require(reader.git_ok(root,['rev-parse','HEAD']).decode().strip()==source,'did not detach at the reviewed workflow source')
          reader.require(Path(request_path).read_bytes()==raw,'source request changed after current-rule reads')
          for item in request['source_manifest']:
              data=Path(item['path']).read_bytes()
              reader.require(len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256'],'pinned requested source changed: '+item['path'])
          emit('SELF_KERNEL_DETACHED_SOURCE',{'source_commit':source,'request_sha256':hashlib.sha256(raw).hexdigest(),'source_bindings_verified':len(request['source_manifest']),'public_private_rules_read_before_new_checks':True})
          entry=request['entry_point']
          reader.require(entry==topic+'/scripts/literature_joint_kernel_complete_self.py','the single new self entry changed')
          out=Path(os.environ['RUNNER_TEMP'])/'visible-joint-kernel-complete-self'
          code=0
          try:
              code=subprocess.run([sys.executable,entry,'--request',request_path,'--out',str(out/'joint-kernel-complete-self.json')]).returncode
          finally:
              for path in sorted(out.glob('*.json*')):
                  data=path.read_bytes()
                  emit('SELF_KERNEL_OUTPUT_METADATA',{'filename':path.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'payload_committed_or_uploaded':False})
          raise SystemExit(code)
          PY
      # Standard library and the seven frozen paid algebra/interface modules.
      # Exactly two NEW self adapters, then one 53-column complete self problem.
      # No old 18/144 construction, Q/current map or rank, old check, profile/root
      # evaluation, artifact, or machine-output payload commit.
