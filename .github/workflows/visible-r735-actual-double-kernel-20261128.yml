name: visible-flex actual dyadic double-kernel matching
on:
  push:
    branches: [main]
    paths:
      - topics/visible-flex-new-mechanism/computations/request-r735-actual-double-kernel-20261128.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visible-flex-R735-original-paid-input
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      R735_REQUEST: topics/visible-flex-new-mechanism/computations/request-r735-actual-double-kernel-20261128.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-new-mechanism/README.md
            /topics/visible-flex-new-mechanism/computations/request-r735-actual-double-kernel-20261128.json
            /topics/visible-flex-new-mechanism/scripts/r734_true_dyadic_tail.py
            /topics/visible-flex-new-mechanism/scripts/r735_paid_tail_beta_envelope.py
            /topics/visible-flex-new-mechanism/scripts/r735_actual_two_port_match.py
            /topics/visible-flex-new-mechanism/scripts/r734_completed_members_transport_20261128.py
            /topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
            /topics/visible-flex-new-mechanism/computations/r735-actual-two-port-match-20261128.json
            /topics/visible-flex-new-mechanism/notes/2026-11-28-r735-actual-dyadic-tail-double-kernel-scope.md
            /topics/visible-flex-new-mechanism/results/R735-explicit-double-kernel-core-and-true-second-order-tilt-with-dyadic-caps.md
            /topics/visible-flex-new-mechanism/results/R734-dyadic-flat-collar-and-true-decaying-spinor-directions.md
            /.github/workflows/visible-r735-actual-double-kernel-20261128.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Restore exact original completed R734 input members
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/r734_completed_members_transport_20261128.py
          --request topics/visible-flex-new-mechanism/computations/request-r735-actual-double-kernel-20261128.json
      - name: Pull both current rule sources and solve the actual two-port problem
        env:
          MR_TOKEN: ${{ secrets.MR_TOKEN }}
        run: >-
          python topics/visible-flex-new-mechanism/scripts/run_inverse_rotational_metric_20261126.py
          --request topics/visible-flex-new-mechanism/computations/request-r735-actual-double-kernel-20261128.json
          --lane actual-dyadic-double-kernel
      - name: Preserve original paid input and every new interval operation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visible-r735-paid-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r735-paid/
          retention-days: 30
          if-no-files-found: error
