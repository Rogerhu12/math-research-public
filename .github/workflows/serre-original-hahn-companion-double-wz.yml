name: Serre original Hahn companion exact double WZ v1

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/original-hahn-companion-double-wz-request.json

permissions:
  contents: read

concurrency:
  group: serre-original-hahn-companion-double-wz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_hahn_companion_double_certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/original_hahn_companion_double_wz.py
            /topics/serre-uniformity/notes/original-hahn-companion-double-wz-request.json
            /topics/serre-uniformity/notes/2026-11-28-original-hahn-companion-double-wz-method.md
      - name: Pull pinned official SageMath 10.6 image
        run: docker pull sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879
      - name: Derive and verify exact two-variable symbolic certificate
        env:
          SERRE_EXPECTED_REQUEST_SHA256: '22c3fa7c9ff57df135b7f51d237493f0e4926154765d3ea20546878fb73b8c8d'
        run: |
          timeout --signal=TERM --kill-after=30s 3570s docker run --rm --cpus=4 --memory=14g \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work,readonly" \
            --workdir /work \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SHA \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e SERRE_EXPECTED_REQUEST_SHA256 \
            -e PYTHONUNBUFFERED=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            sagemath/sagemath@sha256:60dfb09e8d1399e127a0d7b62b45eef1044574bae397df51bb6ba38df5498879 \
            sage -python topics/serre-uniformity/scripts/original_hahn_companion_double_wz.py
