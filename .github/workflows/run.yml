name: run

on:
  push:
    branches: ['main']
    paths: ['requests/**.json']
  workflow_dispatch:
    inputs:
      request:
        description: 'Path of a request JSON in this repo, e.g. requests/topic/name.json'
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      reqs: ${{ steps.list.outputs.reqs }}
    steps:
      - id: list
        env:
          EVENT: ${{ toJson(github.event) }}
          INPUT_REQ: ${{ inputs.request }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_REQ:-}" ]; then
            reqs=$(jq -cn --arg r "$INPUT_REQ" '[$r]')
          else
            reqs=$(jq -c '[.commits[]? | (.added + .modified)[]] | map(select(startswith("requests/") and endswith(".json"))) | unique' <<<"$EVENT")
          fi
          echo "reqs=$reqs" >> "$GITHUB_OUTPUT"
          echo "requests: $reqs"

  run:
    needs: plan
    if: needs.plan.outputs.reqs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        req: ${{ fromJson(needs.plan.outputs.reqs) }}
    steps:
      - name: Read request
        id: req
        env:
          GH_TOKEN: ${{ github.token }}
          REQ: ${{ matrix.req }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/${REQ}?ref=${GITHUB_SHA}" --jq .content | base64 -d > "$RUNNER_TEMP/req.json"
          topic=$(jq -r '.topic' "$RUNNER_TEMP/req.json")
          [[ "$topic" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad topic"; exit 1; }
          jq -e '.command | type == "string"' "$RUNNER_TEMP/req.json" >/dev/null
          jq -r '.command' "$RUNNER_TEMP/req.json" > "$RUNNER_TEMP/cmd.sh"
          tmin=$(jq -r '.timeout_minutes // 300' "$RUNNER_TEMP/req.json"); [ "$tmin" -gt 350 ] && tmin=350
          name=$(basename "$REQ" .json)
          {
            echo "topic=$topic"; echo "tmin=$tmin"; echo "name=$name"
            echo "python=$(jq -r '.python // "3.12"' "$RUNNER_TEMP/req.json")"
            echo "node=$(jq -r '.node // "24"' "$RUNNER_TEMP/req.json")"
            echo "sparse<<SPARSE_EOF"
            echo "/README.md"
            echo "/topics/$topic/"
            jq -r '(.sparse // [])[]' "$RUNNER_TEMP/req.json"
            echo "SPARSE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "topic=$topic timeout=${tmin}m"

      - name: Check out private repo
        uses: actions/checkout@v4
        with:
          repository: Rogerhu12/math-research
          token: ${{ secrets.MR_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.req.outputs.sparse }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.req.outputs.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.req.outputs.node }}

      - name: Run (output goes to the private repo only)
        env:
          GH_TOKEN: ${{ secrets.MR_TOKEN }}
          TOPIC: ${{ steps.req.outputs.topic }}
          TMIN: ${{ steps.req.outputs.tmin }}
          NAME: ${{ steps.req.outputs.name }}
          REQ: ${{ matrix.req }}
        shell: bash
        run: |
          set -uo pipefail
          export MR="$GITHUB_WORKSPACE"
          export OUT_DIR="topics/$TOPIC/ci-runs/${NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$OUT_DIR"
          start=$(date -u +%FT%TZ)
          timeout --signal=TERM --kill-after=60 "${TMIN}m" bash "$RUNNER_TEMP/cmd.sh" > "$OUT_DIR/log.txt" 2>&1
          code=$?
          end=$(date -u +%FT%TZ)
          jq -n --arg req "$REQ" --arg runner_sha "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg start "$start" --arg end "$end" --argjson exit "$code" --argjson timeout_min "$TMIN" \
            '{request:$req, exit:$exit, timed_out:($exit==124 or $exit==137), timeout_min:$timeout_min, start:$start, end:$end, runner_sha:$runner_sha, run:$run}' > "$OUT_DIR/status.json"
          echo "exit=$code start=$start end=$end"
          echo "CODE=$code" >> "$GITHUB_ENV"

      - name: Push results to the private repo
        if: always()
        env:
          TOPIC: ${{ steps.req.outputs.topic }}
          NAME: ${{ steps.req.outputs.name }}
        shell: bash
        run: |
          set -uo pipefail
          OUT_DIR="topics/$TOPIC/ci-runs/${NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [ -d "$OUT_DIR" ] || exit 0
          find "$OUT_DIR" -type f -size +45M ! -name '*.gz' -exec gzip -9 {} \; 2>/dev/null || true
          find "$OUT_DIR" -type f -size +95M -print -delete > "$RUNNER_TEMP/dropped.txt" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/dropped.txt" ]; then cp "$RUNNER_TEMP/dropped.txt" "$OUT_DIR/dropped-over-95MB.txt"; fi
          git config user.name "math-research-ci"
          git config user.email "math-research-ci@users.noreply.github.com"
          git add -A "topics/$TOPIC"
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "ci: $TOPIC $NAME run $GITHUB_RUN_ID exit ${CODE:-?}"
          for i in $(seq 1 30); do
            if git push -q origin HEAD:main; then echo "pushed"; exit 0; fi
            git pull -q --rebase origin main || { git rebase --abort; sleep 5; }
            sleep $((RANDOM % 10 + 3))
          done
          echo "push failed"; exit 1
