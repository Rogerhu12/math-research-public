name: run

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  MRREPO: Rogerhu12/math-research

jobs:
  claim:
    runs-on: ubuntu-latest
    concurrency:
      group: claim
      cancel-in-progress: false
    outputs:
      reqs: ${{ steps.claim.outputs.reqs }}
    steps:
      - id: claim
        env:
          GH_TOKEN: ${{ secrets.MR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          files=$(gh api "repos/$MRREPO/contents/ci-queue" --jq '[.[] | select(.type=="file" and (.name|endswith(".json"))) | .path] | .[]' 2>/dev/null || true)
          if [ -z "$files" ]; then echo "reqs=[]" >> "$GITHUB_OUTPUT"; echo "queue empty"; exit 0; fi
          echo '[]' > reqs.json; echo '[]' > del.json
          for p in $files; do
            name=$(basename "$p" .json)
            body=$(gh api "repos/$MRREPO/contents/$p" --jq .content | base64 -d || true)
            if jq -e '(.topic|type=="string") and (.topic|test("^[A-Za-z0-9._-]+$")) and (.command|type=="string")' <<<"$body" >/dev/null 2>&1; then
              jq --arg n "$name" --argjson b "$body" '. + [$b + {name:$n}]' reqs.json > t && mv t reqs.json
            else
              echo "invalid request $p (dropped)"
            fi
            jq --arg p "$p" '. + [{path:$p, mode:"100644", type:"blob", sha:null}]' del.json > t && mv t del.json
          done
          for i in $(seq 1 15); do
            tip=$(gh api "repos/$MRREPO/git/ref/heads/main" --jq .object.sha)
            base=$(gh api "repos/$MRREPO/git/commits/$tip" --jq .tree.sha)
            tree=$(jq -n --arg b "$base" --slurpfile d del.json '{base_tree:$b, tree:$d[0]}' | gh api -X POST "repos/$MRREPO/git/trees" --input - --jq .sha)
            commit=$(jq -n --arg t "$tree" --arg p "$tip" --arg m "ci-queue: claim $(jq length reqs.json) request(s) for $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{message:$m, tree:$t, parents:[$p]}' | gh api -X POST "repos/$MRREPO/git/commits" --input - --jq .sha)
            if jq -n --arg s "$commit" '{sha:$s, force:false}' | gh api -X PATCH "repos/$MRREPO/git/refs/heads/main" --input - >/dev/null 2>&1; then
              echo "claimed: $(jq -c '[.[].name]' reqs.json)"
              echo "reqs=$(jq -c . reqs.json)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((RANDOM % 5 + 2))
          done
          echo "could not claim"; exit 1

  run:
    needs: claim
    if: needs.claim.outputs.reqs != '[]' && needs.claim.outputs.reqs != ''
    name: ${{ matrix.r.topic }} / ${{ matrix.r.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        r: ${{ fromJson(needs.claim.outputs.reqs) }}
    steps:
      - name: Read request
        id: req
        env:
          R: ${{ toJson(matrix.r) }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$R" > "$RUNNER_TEMP/req.json"
          jq -r '.command' "$RUNNER_TEMP/req.json" > "$RUNNER_TEMP/cmd.sh"
          tmin=$(jq -r '.timeout_minutes // 300' "$RUNNER_TEMP/req.json"); [ "$tmin" -gt 350 ] && tmin=350
          topic=$(jq -r '.topic' "$RUNNER_TEMP/req.json")
          {
            echo "topic=$topic"; echo "tmin=$tmin"; echo "name=$(jq -r '.name' "$RUNNER_TEMP/req.json")"
            echo "python=$(jq -r '.python // "3.12"' "$RUNNER_TEMP/req.json")"
            echo "node=$(jq -r '.node // "24"' "$RUNNER_TEMP/req.json")"
            echo "sparse<<SPARSE_EOF"
            echo "/README.md"
            echo "/topics/$topic/"
            jq -r '(.sparse // [])[]' "$RUNNER_TEMP/req.json"
            echo "SPARSE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check out private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MRREPO }}
          token: ${{ secrets.MR_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.req.outputs.sparse }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.req.outputs.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.req.outputs.node }}

      - name: Run (output goes to the private repo only)
        env:
          GH_TOKEN: ${{ secrets.MR_TOKEN }}
          TOPIC: ${{ steps.req.outputs.topic }}
          TMIN: ${{ steps.req.outputs.tmin }}
          NAME: ${{ steps.req.outputs.name }}
        shell: bash
        run: |
          set -uo pipefail
          export MR="$GITHUB_WORKSPACE"
          export OUT_DIR="topics/$TOPIC/ci-runs/${NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$OUT_DIR"
          cp "$RUNNER_TEMP/req.json" "$OUT_DIR/request.json"
          start=$(date -u +%FT%TZ)
          timeout --signal=TERM --kill-after=60 "${TMIN}m" bash "$RUNNER_TEMP/cmd.sh" > "$OUT_DIR/log.txt" 2>&1
          code=$?
          end=$(date -u +%FT%TZ)
          jq -n --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg start "$start" --arg end "$end" --argjson exit "$code" --argjson timeout_min "$TMIN" \
            '{exit:$exit, timed_out:($exit==124 or $exit==137), timeout_min:$timeout_min, start:$start, end:$end, run:$run}' > "$OUT_DIR/status.json"
          echo "exit=$code start=$start end=$end"
          echo "CODE=$code" >> "$GITHUB_ENV"

      - name: Push results to the private repo
        if: always()
        env:
          TOPIC: ${{ steps.req.outputs.topic }}
          NAME: ${{ steps.req.outputs.name }}
        shell: bash
        run: |
          set -uo pipefail
          OUT_DIR="topics/$TOPIC/ci-runs/${NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [ -d "$OUT_DIR" ] || exit 0
          find "$OUT_DIR" -type f -size +45M ! -name '*.gz' -exec gzip -9 {} \; 2>/dev/null || true
          find "$OUT_DIR" -type f -size +95M -print -delete > "$RUNNER_TEMP/dropped.txt" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/dropped.txt" ]; then cp "$RUNNER_TEMP/dropped.txt" "$OUT_DIR/dropped-over-95MB.txt"; fi
          git config user.name "math-research-ci"
          git config user.email "math-research-ci@users.noreply.github.com"
          git add -A "topics/$TOPIC"
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "ci: $TOPIC $NAME run $GITHUB_RUN_ID exit ${CODE:-?}"
          for i in $(seq 1 30); do
            if git push -q origin HEAD:main; then echo "pushed"; exit 0; fi
            git pull -q --rebase origin main || { git rebase --abort; sleep 5; }
            sleep $((RANDOM % 10 + 3))
          done
          echo "push failed"; exit 1
