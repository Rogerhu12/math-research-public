name: visible-larger original continuous-C complete112 deep far graph
'on':
  push:
    branches: [main]
    paths:
      - topics/visible-flex-larger-amplitude/computations/public-original-continuous-C-far-graph-request.json
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: visible-larger-public-continuous-C-far-graph
  cancel-in-progress: false
jobs:
  compute:
    name: Original C-root family complete112 deep-port Robin enclosure
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      scalar_summary: ${{ steps.scalar.outputs.scalar_summary }}
      scalar_summary_bytes: ${{ steps.scalar.outputs.scalar_summary_bytes }}
      scalar_summary_sha256: ${{ steps.scalar.outputs.scalar_summary_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /topics/visible-flex-larger-amplitude/*.md
            /topics/visible-flex-larger-amplitude/computations/
            /topics/visible-flex-larger-amplitude/results/R286-original-stored-continuous-integral-and-metric-bridge.md
            /topics/visible-flex-larger-amplitude/results/R312-continuous-C-complete112-zero-tail-and-head-connection.md
      - name: Establish request143 owned temporary namespace
        run: |
          git config gc.auto 0
          git config gc.autoPackLimit 0
          git config maintenance.auto false
          git config --global merge.stat false
          mkdir "$RUNNER_TEMP/visible-continuous-C-far143"
          echo "VISIBLE_BASE=$RUNNER_TEMP/visible-continuous-C-far143" >> "$GITHUB_ENV"
          echo "VISIBLE_COMPUTATIONS=$GITHUB_WORKSPACE/topics/visible-flex-larger-amplitude/computations" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14
      - name: Install only the explicit rigorous interval runtime
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Bind all original sources and exact complete112 deep-port contract
        run: |
          python - <<'PYPINS'
          import ast,hashlib,json,os,re,subprocess
          from pathlib import Path,PurePosixPath
          repo=Path(os.environ['GITHUB_WORKSPACE']);comp=Path(os.environ['VISIBLE_COMPUTATIONS'])
          raw=(comp/'public-original-continuous-C-far-graph-request.json').read_bytes();request=json.loads(raw)
          assert request['schema']=='public-original-continuous-C-deep-far-request-v1'
          assert request['request_number']==143 and request['lanes']==['continuousCfar']
          assert request['repository']=='Rogerhu12/math-research-public'
          assert request['scientific_entry']=='geometry_20261115_stored_continuous_C_far_graph.py'
          assert request['source_count']==len(request['source_sha256'])==11
          verified=[]
          for name,expected in request['source_sha256'].items():
              assert PurePosixPath(name).name==name and re.fullmatch(r'[0-9a-f]{64}',expected)
              data=(comp/name).read_bytes();assert hashlib.sha256(data).hexdigest()==expected,name
              if name.endswith('.py'):compile(ast.parse(data,filename=name),name,'exec')
              verified.append(dict(file=name,bytes=len(data),sha256=expected))
          def constants(path,names):
              tree=ast.parse(path.read_bytes())
              return {node.targets[0].id:ast.literal_eval(node.value) for node in tree.body
                if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name)
                and node.targets[0].id in names}
          entry=constants(comp/request['scientific_entry'],('BINDER_NAME','BINDER_SHA256','PROOF_NAME','PROOF_SHA256','MODEL_SCHEMA','SCHEMA'))
          binder=request['original_metadata_binder']
          assert entry['BINDER_NAME']==binder['file'] and entry['BINDER_SHA256']==binder['sha256']==request['source_sha256'][binder['file']]
          original=constants(comp/binder['file'],('PINS','PROOF_SHA','REVISION','BASE_SOURCE_NAME','BASE_SOURCE_SHA256','UNIT_PANEL_SOURCE_NAME','UNIT_PANEL_SOURCE_SHA256'))
          assert original['PINS']==request['original_formula_source_sha256']
          assert original['REVISION']==request['original_source_revision']
          for item in request['preserved_source_files']:
              data=(comp/item['file']).read_bytes()
              assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256']==request['source_sha256'][item['file']]
          assert original['BASE_SOURCE_NAME']==request['preserved_source_files'][0]['file']
          assert original['BASE_SOURCE_SHA256']==request['preserved_source_files'][0]['sha256']
          assert original['UNIT_PANEL_SOURCE_NAME']==request['preserved_source_files'][1]['file']
          assert original['UNIT_PANEL_SOURCE_SHA256']==request['preserved_source_files'][1]['sha256']
          for key in ('proof','tail_proof'):
              item=request[key];data=(repo/item['file']).read_bytes()
              assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256']
          assert original['PROOF_SHA']==request['proof']['sha256']
          assert entry['PROOF_SHA256']==request['tail_proof']['sha256']
          assert entry['PROOF_NAME']==Path(request['tail_proof']['file']).name
          assert entry['MODEL_SCHEMA']==request['complete_scope']['target_model_schema']
          assert entry['SCHEMA']==request['complete_scope']['producer_schema']
          for name,expected in request['reviewed_README_blobs'].items():
              assert subprocess.check_output(['git','hash-object',name],text=True).strip()==expected
          assert request['scientific_parameters']==dict(far_port=159,precision_bits=256)
          assert request['complete_scope']['all_complete_physical_modes']==list(range(2,225,2))
          assert request['complete_scope']['mode_count']==112
          assert request['complete_scope']['output_is_deep_port_not_cut_DN'] is True
          assert not any(request['retention'][k] for k in ('upload_artifact','upload_release','publish_raw_to_git'))
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          print(json.dumps(dict(event='request143_source_and_scope_identity',run_id=os.environ['GITHUB_RUN_ID'],
           source_commit=os.environ['GITHUB_SHA'],request_sha256=hashlib.sha256(raw).hexdigest(),
           sources=verified,proof=request['proof'],tail_proof=request['tail_proof'],complete_scope=request['complete_scope'],
           scientific_parameters=request['scientific_parameters'],no_science_started=True)),flush=True)
          PYPINS
      - name: Restore exactly the original config and both saved-ready byte inputs
        run: |
          python - <<'PYINPUTS'
          import hashlib,json,os,subprocess
          from pathlib import Path,PurePosixPath
          repo=Path(os.environ['GITHUB_WORKSPACE']);comp=Path(os.environ['VISIBLE_COMPUTATIONS'])
          request=json.loads((comp/'public-original-continuous-C-far-graph-request.json').read_bytes())
          commit='8bd267107cc8710d371f3b62c02986655ac965b0'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['GITHUB_SHA']
          if subprocess.run(['git','cat-file','-e',commit+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
            subprocess.run(['git','fetch','--no-write-fetch-head','--no-tags','--filter=blob:none','--depth=1','origin',commit],check=True)
          base=Path(os.environ['VISIBLE_BASE']);inputs=base/'original-inputs';inputs.mkdir(exist_ok=False)
          records={}
          for role,item in request['inputs'].items():
            assert item['historical_public_commit']==commit
            relative=PurePosixPath(item['file'])
            assert not relative.is_absolute() and '..' not in relative.parts
            assert str(relative).startswith('topics/visible-flex-larger-amplitude/notes/')
            assert Path(item['runtime_basename']).name==item['runtime_basename']
            blob=subprocess.check_output(['git','rev-parse',commit+':'+str(relative)],text=True).strip()
            if 'git_blob' in item:assert blob==item['git_blob']
            raw=subprocess.check_output(['git','cat-file','blob',blob])
            assert len(raw)==item['bytes'] and hashlib.sha256(raw).hexdigest()==item['sha256'],role
            path=inputs/item['runtime_basename']
            with path.open('xb') as stream:stream.write(raw);stream.flush();os.fsync(stream.fileno())
            records[role]=dict(source_path=str(relative),git_blob=blob,bytes=len(raw),sha256=item['sha256'],temporary_file=str(path))
          assert set(records)=={'config','calibration_ledger','stored_reference'}
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==head
          print(json.dumps(dict(event='request143_original_geometry_bytes_restored',historical_public_commit=commit,
            source_commit=head,inputs=records,raw_inputs_not_rewritten_or_rearchived=True,
            no_accepted_tail_or_field_input_consumed=True)),flush=True)
          PYINPUTS
      - name: Restore the unchanged original public source subset once
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python - <<'PYSOURCE'
          import os
          from pathlib import Path
          from exact_20261114_public_resume import prepare_public_source
          base=Path(os.environ['VISIBLE_BASE'])
          source=prepare_public_source(Path.cwd(),base/'original-public-source',base)
          with open(os.environ['GITHUB_ENV'],'a') as stream:
            stream.write('VISIBLE_SOURCE_TOPIC='+str(source)+'\n')
          PYSOURCE
      - name: Enclose all112 original C-root-family deep far rows
        id: science
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH="$VISIBLE_COMPUTATIONS" python -u - <<'PYRUN'
          import hashlib,json,os,sys
          from pathlib import Path
          import root_20261114_current576_rules_runner as runner
          repo=Path(os.environ['GITHUB_WORKSPACE']);comp=Path(os.environ['VISIBLE_COMPUTATIONS']).resolve()
          request=json.loads((comp/'public-original-continuous-C-far-graph-request.json').read_bytes())
          assert Path(runner.__file__).resolve()==comp/'root_20261114_current576_rules_runner.py'
          expected=request['source_sha256']['root_20261114_current576_rules_runner.py']
          assert hashlib.sha256(Path(runner.__file__).read_bytes()).hexdigest()==expected
          baselines={}
          for name,blob in request['reviewed_README_blobs'].items():
              raw=(repo/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==blob
              baselines[name]=dict(blob=blob,text=raw.decode())
          old={name:value['blob'] for name,value in runner.BASELINES.items()};runner.BASELINES=baselines
          print(json.dumps(dict(event='request143_explicit_rules_baseline_update',unchanged_runner_sha256=expected,
           old_embedded_blobs=old,reviewed_current_blobs=request['reviewed_README_blobs'],
           period_seconds=runner.PERIOD_SECONDS,original_pull_rebase_rule_change_stop_retained=True)),flush=True)
          base=Path(os.environ['VISIBLE_BASE']);inputs=base/'original-inputs'
          argv=[str(comp/request['scientific_entry']),'--runtime-computations',str(comp),
           '--source-topic',os.environ['VISIBLE_SOURCE_TOPIC'],'--proof',str(repo/request['proof']['file']),
           '--tail-proof',str(repo/request['tail_proof']['file']),'--out',str(base/'continuous-C-deep-far')]
          for role,option in (('config','config'),('calibration_ledger','ledger-ready'),('stored_reference','stored-ready')):
              item=request['inputs'][role]
              argv.extend(['--'+option,str(inputs/item['runtime_basename']),'--'+option+'-sha256',item['sha256']])
          for key,value in request['scientific_parameters'].items():
              argv.extend(['--'+key.replace('_','-'),str(value)])
          bootstrap="import os,runpy,sys; [os.environ.pop(k,None) for k in ('GH_TOKEN','GITHUB_TOKEN','MR_TOKEN')]; sys.argv=sys.argv[1:]; runpy.run_path(sys.argv[0],run_name='__main__')"
          command=[sys.executable,'-u','-c',bootstrap,*argv]
          sys.argv=[runner.__file__,'--out',str(base/'rule-sync'),'--command',*command]
          raise SystemExit(runner.main())
          PYRUN
      - name: Read actual complete112 row identities and unpaid finite-head scope
        id: scalar
        if: always()
        run: |
          python - <<'PYSCALAR'
          import hashlib,json,os
          from pathlib import Path,PurePosixPath
          base=Path(os.environ['VISIBLE_BASE']);out=base/'continuous-C-deep-far'
          comp=Path(os.environ['VISIBLE_COMPUTATIONS'])
          request=json.loads((comp/'public-original-continuous-C-far-graph-request.json').read_bytes())
          def digest(path):
              h=hashlib.sha256();count=0
              with path.open('rb') as stream:
                  for block in iter(lambda:stream.read(1048576),b''):h.update(block);count+=len(block)
              return dict(file=str(path.relative_to(base)),bytes=count,sha256=h.hexdigest())
          def bound_path(desc):
              relative=PurePosixPath(desc['file'])
              assert not relative.is_absolute() and '..' not in relative.parts
              path=out/relative
              assert not path.is_symlink() and path.resolve().is_relative_to(out.resolve())
              actual=digest(path)
              assert actual['bytes']==desc['bytes'] and actual['sha256']==desc['sha256']
              return path,actual
          summary=dict(schema='request143-original-C-complete112-deep-far-actual-scalar-summary-v1',
           run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],
           compute_step_outcome='${{ steps.science.outcome }}',source_result=None,
           complete_row_byte_scope=None,cut_DN_and_nonlinear_acceptance_not_claimed=True,
           readout_performs_no_new_scientific_arithmetic=True)
          result=out/'result.json'
          if result.is_file():
              desc=digest(result);record=json.loads(result.read_bytes())
              assert record['schema']==request['complete_scope']['producer_schema']
              assert record['source_sha256']==request['source_sha256'][request['scientific_entry']]
              assert record['target_model_schema']==request['complete_scope']['target_model_schema']
              assert record['far_port']==159 and record['physical_node']==160
              assert record['run_id']==os.environ['GITHUB_RUN_ID'] and record['source_commit']==os.environ['GITHUB_SHA']
              assert record['complete_requested_modes']==request['complete_scope']['all_complete_physical_modes']
              assert record['cut_DN_matrix'] is None and record['finite_head_propagation_performed'] is False
              assert record['requested_cut_domain_verified'] is False and record['cut_height_denominators_verified'] is False
              assert record['full_BVP_or_closed_surface_accepted'] is False
              bpath,bdesc=bound_path(record['input_binding']);binding=json.loads(bpath.read_bytes())
              assert binding['schema']=='R312-original-C-root-family-deep-far-input-binding-v1'
              assert binding['source_sha256']==record['source_sha256']
              assert binding['actual_R312_proof']['sha256']==request['tail_proof']['sha256']
              assert binding['actual_original_metadata_binder']['sha256']==request['original_metadata_binder']['sha256']
              original=binding['original_C_input_binding']
              for role in ('config','calibration_ledger','stored_reference'):
                  assert original[role]['bytes']==request['inputs'][role]['bytes']
                  assert original[role]['sha256']==request['inputs'][role]['sha256']
              rows_path,rows_desc=bound_path(record['complete_rows'])
              seen=[];row_schema='R312-original-C-one-mode-deep-far-enclosure-v1'
              with rows_path.open('rb') as stream:
                  for raw in stream:
                      row=json.loads(raw);index=len(seen)
                      assert row['schema']==row_schema and index<112
                      assert row['mode_index']==index and row['physical_frequency']==request['complete_scope']['all_complete_physical_modes'][index]
                      assert row['far_port']==159 and row['physical_node']==160
                      assert row['every_actual_original_root_choice_included'] is True
                      assert row['finite_head_propagation_or_cut_DN_claimed'] is False
                      assert row['actual_root_replaced_by_ideal_alpha'] is False
                      assert row['original_Robin_row']['order']==['Q_m','Pi_m']
                      assert row['physical_Robin_row']['order']==['u_m','k_m=dH_m/dr']
                      seen.append(row['physical_frequency'])
              assert len(seen)==record['complete_rows']['rows']
              assert seen==record['completed_modes']
              assert record['unpaid_mode_suffix']==request['complete_scope']['all_complete_physical_modes'][len(seen):]
              assert record['all_complete112_deep_far_rows_enclosed']==(len(seen)==112 and record['error'] is None)
              summary['original_result_file']=desc;summary['source_result']=record
              summary['complete_row_byte_scope']=dict(
                original_input_binding_file=bdesc,original_complete_rows_file=rows_desc,
                complete_row_count=len(seen),complete_physical_modes_seen=seen,
                every_saved_row_schema_source_port_and_scope_checked=True,
                every_result_descriptor_byte_hash_checked=True,
                no_112_numeric_row_payload_copied_to_stdout=True,
                interval_arithmetic_not_repeated=True)
          else:
              summary['failure_scope']='No final producer result; inspect original child stderr and rule-sync outcome; no deep graph or cut DN completion is inferred.'
          rules=base/'rule-sync'/'runner-result.json'
          if rules.is_file():summary['rules_runner_result']=dict(original_file=digest(rules),value=json.loads(rules.read_bytes()))
          raw=json.dumps(summary,ensure_ascii=False,separators=(',',':'),allow_nan=False).encode()
          if len(raw)>90000:
              print(json.dumps(dict(event='request143_actual_scalar_summary_too_large',bytes=len(raw),
                sha256=hashlib.sha256(raw).hexdigest(),no_truncation_and_no_success_relabel=True)),flush=True)
              raise SystemExit(70)
          print('BEGIN_REQUEST143_ACTUAL_CONTINUOUS_C_DEEP_FAR_SCALAR_SUMMARY')
          print(raw.decode())
          print('END_REQUEST143_ACTUAL_CONTINUOUS_C_DEEP_FAR_SCALAR_SUMMARY')
          checksum=hashlib.sha256(raw).hexdigest()
          print(json.dumps(dict(event='request143_actual_scalar_identity',bytes=len(raw),sha256=checksum,
           hash_scope='compact UTF8 JSON excluding separator LF',raw_upload=False)),flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('scalar_summary='+raw.decode()+'\n')
              stream.write('scalar_summary_bytes='+str(len(raw))+'\n')
              stream.write('scalar_summary_sha256='+checksum+'\n')
          PYSCALAR
      - name: Remove only request143 temporary inputs and recomputable output after actual readout
        if: always()
        run: |
          python - <<'PYCLEAN'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']).resolve()
          target=Path(os.environ.get('VISIBLE_BASE',str(root/'visible-continuous-C-far143')))
          try:
            assert target.name=='visible-continuous-C-far143'
            assert not target.is_symlink() and target.resolve().is_relative_to(root) and target.resolve()!=root
            if target.is_dir():shutil.rmtree(target)
            print(json.dumps(dict(event='request143_owned_temporary_payload_removed',
              raw_outputs_or_recovered_inputs_not_uploaded=True)),flush=True)
          except Exception as error:
            print(json.dumps(dict(event='request143_owned_cleanup_error',error=repr(error),
              separate_from_scientific_partial_or_complete_result=True)),flush=True)
          PYCLEAN
  report:
    name: Actual deep-port scope and complete112 output hashes only
    needs: compute
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCALAR_SUMMARY: ${{ needs.compute.outputs.scalar_summary }}
      SCALAR_SUMMARY_BYTES: ${{ needs.compute.outputs.scalar_summary_bytes }}
      SCALAR_SUMMARY_SHA256: ${{ needs.compute.outputs.scalar_summary_sha256 }}
      COMPUTE_RESULT: ${{ needs.compute.result }}
    steps:
      - name: Print bounded original readout with honest unavailable case
        run: |
          python - <<'PYREPORT'
          import hashlib,json,os
          text=os.environ.get('SCALAR_SUMMARY','')
          if not text:
            text=json.dumps(dict(schema='request143-actual-continuous-C-deep-far-output-unavailable-v1',
              run_id=os.environ['GITHUB_RUN_ID'],source_commit=os.environ['GITHUB_SHA'],
              compute_job_result=os.environ.get('COMPUTE_RESULT'),deep_far_and_cut_DN_completion_not_claimed=True),separators=(',',':'))
            raw=text.encode()
          else:
            raw=text.encode();assert len(raw)==int(os.environ['SCALAR_SUMMARY_BYTES'])<=90000
            assert hashlib.sha256(raw).hexdigest()==os.environ['SCALAR_SUMMARY_SHA256'];json.loads(raw)
          print('BEGIN_REQUEST143_ACTUAL_CONTINUOUS_C_DEEP_FAR_SCALAR_SUMMARY')
          print(text)
          print('END_REQUEST143_ACTUAL_CONTINUOUS_C_DEEP_FAR_SCALAR_SUMMARY')
          print(json.dumps(dict(event='request143_report_identity',bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),
            hash_scope='compact UTF8 JSON excluding separator LF',compute_job_result=os.environ.get('COMPUTE_RESULT'),
            raw_artifact_release_git_upload=False)))
          PYREPORT
