          PYCUTREPORT
      - name: Repeat independent deep and finite-head actual scope blocks without scientific arithmetic
        run: |
          python - <<'PYHEADREPORT'
          import hashlib,json,os
          entries=(('FAR_SUMMARY','request156-actual-deep-far-scalar-readout-v1',
            'REQUEST156_ACTUAL_DEEP_FAR_SUMMARY'),
            ('FINITE_HEAD_SUMMARY','request156-actual-finite-head-complete-scope-readout-v1',
            'REQUEST156_ACTUAL_FINITE_HEAD_SUMMARY'))
          for key,schema,marker in entries:
            text=os.environ.get(key,'')
            if text:
              raw=(text+'\n').encode()
              assert len(raw)==int(os.environ[key+'_BYTES'])<=90000
              assert hashlib.sha256(raw).hexdigest()==os.environ[key+'_SHA256']
