          raw=canonical(summary)
          if len(raw)>90000:
            print(json.dumps(dict(event='request156_far_readout_too_large',bytes=len(raw),
              sha256=hashlib.sha256(raw).hexdigest(),no_truncation=True)),flush=True)
            raise SystemExit(70)
          print('BEGIN_REQUEST156_ACTUAL_DEEP_FAR_SUMMARY');print(raw.decode(),end='');print('END_REQUEST156_ACTUAL_DEEP_FAR_SUMMARY')
          checksum=hashlib.sha256(raw).hexdigest()
          print(json.dumps(dict(event='request156_far_readout_identity',bytes=len(raw),sha256=checksum,
            hash_scope='canonical UTF8 JSON including final LF')),flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
            stream.write('far_summary='+raw.decode().rstrip('\n')+'\n')
            stream.write('far_summary_bytes='+str(len(raw))+'\n')
            stream.write('far_summary_sha256='+checksum+'\n')
          PYFARREAD
      - name: Read every actual finite-head ledger and all paid or pending mode scopes
        id: linear_scalar
        if: always()
        run: |
          python - <<'PYLINEARREAD'
          import collections,hashlib,json,os
          from pathlib import Path,PurePosixPath
          base=Path(os.environ['VISIBLE_BASE']);out=base/'finite-head'
