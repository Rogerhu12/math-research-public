name: Serre p41 exact power6 short basis

on:
  push:
    branches: [main]
    paths:
      - topics/serre-uniformity/notes/R795-public-exact-power6-short-basis-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: serre-R795-exact-power6-short-basis
  cancel-in-progress: false

jobs:
  exact_power6_short_basis:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/serre-p41-exact-power6-short-basis.yml
            /topics/serre-uniformity/README.md
            /topics/serre-uniformity/scripts/R795_exact_power6_short_basis.py
            /topics/serre-uniformity/scripts/R795_public_exact_power6_short_basis.py
            /topics/serre-uniformity/scripts/R786_public_exact_power5_short_basis.py
            /topics/serre-uniformity/scripts/p41_public_actions_recovery.py
            /topics/serre-uniformity/notes/R795-public-exact-power6-short-basis-request.json
            /topics/serre-uniformity/notes/R795-exact-ordinary-power6-prefix-method.md
            /topics/serre-uniformity/results/R793-original-RR-pole-divisors-and-CM-local-algebra.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Complete only the original power6 qY0 to81 prefix
        continue-on-error: true
        timeout-minutes: 315
        env:
          GH_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R795_public_exact_power6_short_basis.py compute
      - name: Transfer the active checkpoint to the immediate continuation only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serre-global-R795-exact-original-power6-short-basis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serre-global/R795-exact-original-power6-short-basis/output
          retention-days: 1
          if-no-files-found: warn
      - name: Publish only script parameters run and output hashes
        if: always()
        continue-on-error: true
        env:
          SERRE_ACTIONS_TOKEN: ${{ github.token }}
        run: python topics/serre-uniformity/scripts/R795_public_exact_power6_short_basis.py publish
      - name: Require all original power6 short basis rows
        if: always()
        run: python topics/serre-uniformity/scripts/R795_public_exact_power6_short_basis.py verify
